const SAVE_KEY='tangoQuest_v1';
let memFallback=null;
function defaultState(){
  return {xp:0, streak:0, bestStreak:0, lastStudyDate:"", freezes:1, today:{date:"",sessions:0,xp:0},
    cleared:{}, srs:{}, badges:[], maxComboEver:0, reviewCount:0, sRankCount:0, flashCount:0,
    totalAnswered:0, totalCorrect:0, lastLoc:{pk:"p1",course:1}};
}
function loadState(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const st=JSON.parse(raw);return Object.assign(defaultState(),st);}}
  catch(e){if(memFallback)return memFallback;}
  return defaultState();
}
let saveWarned=false;
function save(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(ST));}
  catch(e){
    memFallback=ST;
    if(!saveWarned){saveWarned=true;setTimeout(()=>toast("⚠️ この環境では進捗を保存できないかも。設定からバックアップしてね"),600);}
  }
}
let ST=loadState();
function ensureToday(){const t=todayStr();if(ST.today.date!==t){ST.today={date:t,sessions:0,xp:0};}}
ensureToday();

/* 表示用ストリーク（おまもり🧊があれば1日空きまでセーフ） */
function displayStreak(){
  const t=todayStr(),y=addDaysStr(t,-1),y2=addDaysStr(t,-2);
  if(ST.lastStudyDate===t||ST.lastStudyDate===y)return ST.streak;
  if(ST.lastStudyDate===y2&&ST.freezes>0)return ST.streak;
  return 0;
}
function bumpStreak(){
  const t=todayStr();
  if(ST.lastStudyDate===t)return {extended:false,streak:ST.streak,froze:false,earned:false};
  const y=addDaysStr(t,-1),y2=addDaysStr(t,-2);
  let froze=false;
  if(ST.lastStudyDate===y){ST.streak++;}
  else if(ST.lastStudyDate===y2&&ST.freezes>0){ST.freezes--;ST.streak++;froze=true;}
  else{ST.streak=1;}
  ST.bestStreak=Math.max(ST.bestStreak,ST.streak);
  ST.lastStudyDate=t;
  let earned=false;
  if(ST.streak>0&&ST.streak%7===0&&ST.freezes<2){ST.freezes++;earned=true;}
  return {extended:true,streak:ST.streak,froze,earned};
}

function levelInfo(xp){
  let lv=1,need=100,rem=xp;
  while(rem>=need){rem-=need;lv++;need=100+(lv-1)*50;}
  return {lv,cur:rem,need};
}
const TITLES=[[1,"みならい冒険者"],[3,"単語ルーキー"],[5,"コツコツ勇者"],[8,"ボキャブラ戦士"],[11,"単語ハンター"],[14,"フレーズ騎士"],[17,"例文の賢者"],[20,"語彙マスター"],[25,"伝説の単語王"]];
function titleFor(lv){let t=TITLES[0][1];for(const [n,name] of TITLES){if(lv>=n)t=name;}return t;}

/* ============================================================
   単語アクセス・SRS（復習キュー）
============================================================ */
function stagesOf(pk){return Math.ceil(WORDS[pk].length/STAGE_SIZE);}
function stageWords(pk,s){
  return WORDS[pk].slice(s*STAGE_SIZE,(s+1)*STAGE_SIZE).map((w,i)=>({...w,id:pk+"-"+(s*STAGE_SIZE+i)}));
}
function wordById(id){const [pk,idx]=id.split("-");return {...WORDS[pk][+idx],id};}
function partOfId(id){return id.split("-")[0];}
function srsGet(id){return ST.srs[id]||null;}
function srsOnAnswer(id,ok){
  const t=todayStr();
  let e=ST.srs[id]||{lv:0,due:t,seen:0,wrong:0,d:""};
  e.seen++;
  if(ok){
    // 習熟レベルが上がるのは1日1回まで（同じ日に何度も正解しても「覚えた」ことにはならない）
    if(e.d!==t){e.lv=Math.min(5,e.lv+1);e.due=addDaysStr(t,SRS_INT[e.lv]);}
    else if(e.due<=t){e.due=addDaysStr(t,SRS_INT[Math.max(1,e.lv)]);}
  }
  else{e.wrong++;e.lv=(e.lv>=3)?e.lv-2:0;e.due=addDaysStr(t,1);}
  e.d=t;
  ST.srs[id]=e;
}
/* 復習が溜まりすぎたら自動で翌日以降に分散（おかえりモード） */
function softenBacklog(){
  const due=dueList();
  if(due.length<=REVIEW_DAILY_CAP+20)return false;
  const t=todayStr();
  due.slice(REVIEW_DAILY_CAP).forEach((id,i)=>{
    ST.srs[id].due=addDaysStr(t,1+Math.floor(i/REVIEW_DAILY_CAP));
  });
  save();
  return true;
}
function dueList(){
  const t=todayStr();
  return Object.entries(ST.srs).filter(([id,e])=>e.due<=t).sort((a,b)=>a[1].due<b[1].due?-1:1).map(([id])=>id);

============================================================ */
function ck(pk,c,s){return pk+"-"+c+"-"+s;}
function clearedInfo(pk,c,s){return ST.cleared[ck(pk,c,s)]||null;}
function isCleared(pk,c,s){return !!clearedInfo(pk,c,s);}
function unlocked(pk,c,s){
  if(c===1)return s===0||isCleared(pk,1,s-1);
  return isCleared(pk,c-1,s);
}
function starsHtml(pk,c,s){
  const info=clearedInfo(pk,c,s);
  if(!info)return "";
  return "★".repeat(info.stars)+"☆".repeat(3-info.stars);
}
function partClearedCount(pk){
  const n=stagesOf(pk);let cnt=0;
  for(let c=1;c<=3;c++)for(let s=0;s<n;s++)if(isCleared(pk,c,s))cnt++;
  return cnt;
}
function partProgressPct(pk){return Math.round(partClearedCount(pk)/(stagesOf(pk)*3)*100);}
function courseDone(pk,c){const n=stagesOf(pk);for(let s=0;s<n;s++)if(!isCleared(pk,c,s))return false;return true;}
function recommendNextStage(){
  const order=PART_INFO.map(p=>p.key);
  const startIdx=Math.max(0,order.indexOf(ST.lastLoc.pk));
  const seq=order.slice(startIdx).concat(order.slice(0,startIdx));
  for(const pk of seq){
    for(let c=1;c<=3;c++){
      for(let s=0;s<stagesOf(pk);s++){
        if(unlocked(pk,c,s)&&!isCleared(pk,c,s))return {kind:"stage",pk,c,s};
      }
    }
  }
  return null;
}
function recommendNext(){
  if(dueList().length>0)return {kind:"review"};
  return recommendNextStage()||{kind:"done"};
}

/* ============================================================
   問題生成
============================================================ */
function mShort(m){return m.split(/[；;]/)[0].trim();}
function conflicts(a,b){const x=mShort(a),y=mShort(b);return x===y||x.includes(y)||y.includes(x);}
function maskWord(text,w){return String(text).replace(new RegExp(escRe(w),'gi'),'？？？');}

function poolFor(pk){return WORDS[pk];}
function pickMeaningDistractors(word,pool,n){
  const seen=new Set([mShort(word.m)]);
  const out=[];
  for(const c of shuffle(pool)){
    if(c.w===word.w)continue;
    if(conflicts(c.m,word.m))continue;
    const ms=mShort(c.m);
    if(seen.has(ms))continue;
    seen.add(ms);out.push(c);
    if(out.length>=n)break;
  }
  return out;
}
function pickWordDistractors(word,pool,n,opts){
  opts=opts||{};
  const out=[];const seen=new Set([word.w]);
  for(const c of shuffle(pool)){
    if(seen.has(c.w))continue;
    if(conflicts(c.m,word.m))continue;
    if(opts.avoidText&&opts.avoidText.toLowerCase().includes(c.w.toLowerCase()))continue;
    if(opts.samePos&&c.pos!==word.pos)continue;
    seen.add(c.w);out.push(c);
    if(out.length>=n)break;
  }
  if(out.length<n&&opts.samePos){ // 品詞縛りで足りなければ、既選択を除いたプールから緩めて補充
    const rest=pickWordDistractors(word,pool.filter(c=>!out.some(o=>o.w===c.w)),n-out.length,{...opts,samePos:false});
    return out.concat(rest);
  }
  return out;
}
/* 語境界つきで見出語を空所化（部分文字列の誤置換を防ぐ）。含まれなければ null */
function blankOut(text,w){
  const re=new RegExp("\\b"+escRe(w)+"\\b","g");
  const out=String(text).replace(re,"（　　）");
  return out===String(text)?null:out;
}
function expFor(word,course){
  let s=`<b>${esc(word.w)}</b>【${esc(word.pos)}】${esc(word.m)}`;
  s+=`<br>💡 ${esc(word.nu)}`;
  if(course>=2)s+=`<br>📌 ${esc(word.ph)}（${esc(word.phm)}）<br>✏️ ${esc(word.ex)}<br>　${esc(word.exm)}`;
  if(course>=3)s+=`<br>🔧 ${esc(word.us)}<br>⭐ Tip: ${esc(word.tip)}`;
  return s;
}
/* --- 個別問題ビルダー（正解は index 0、表示時にシャッフルされる） --- */
function qWordToMeaning(word,pool,course){
  const ds=pickMeaningDistractors(word,pool,3);
  return {type:"yon",lvLabel:"意味",q:`「${word.w}」の意味は？`,choices:[mShort(word.m),...ds.map(d=>mShort(d.m))],a:0,wids:[word.id],exp:expFor(word,course),speak:word.w,sayAfter:word.w};
}
function qMeaningToWord(word,pool,course){
  const ds=pickWordDistractors(word,pool,3,{});
  return {type:"yon",lvLabel:"逆引き",q:`「${mShort(word.m)}」という意味の単語は？`,choices:[word.w,...ds.map(d=>d.w)],a:0,wids:[word.id],exp:expFor(word,course),sayAfter:word.w};
}
function qNuance(word,pool,course){
  const ds=pickWordDistractors(word,pool,3,{});
  return {type:"yon",lvLabel:"ニュアンス",q:`【イメージ】${maskWord(word.nu,word.w)}\nこのイメージに合う単語は？`,choices:[word.w,...ds.map(d=>d.w)],a:0,wids:[word.id],exp:expFor(word,course),sayAfter:word.w};
}
function qExFill(word,pool,course){
  const blanked=blankOut(word.ex,word.w);
  if(!blanked)return qWordToMeaning(word,pool,course); // 保険
  const ds=pickWordDistractors(word,pool,3,{avoidText:word.ex,samePos:true});
  return {type:"yon",lvLabel:"例文穴埋め",q:`（　　）に入る単語は？\n${blanked}\n（${word.exm}）`,choices:[word.w,...ds.map(d=>d.w)],a:0,wids:[word.id],exp:expFor(word,Math.max(course,2)),sayAfter:word.ex};
}
function qPhMeaning(word,pool,course){
  const seen=new Set([word.phm]);const ds=[];
  for(const c of shuffle(pool)){
    if(c.w===word.w||seen.has(c.phm)||conflicts(c.m,word.m))continue;
    seen.add(c.phm);ds.push(c);if(ds.length>=3)break;
  }
  return {type:"yon",lvLabel:"フレーズ",q:`「${word.ph}」の意味は？`,choices:[word.phm,...ds.map(d=>d.phm)],a:0,wids:[word.id],exp:expFor(word,Math.max(course,2)),speak:word.ph,sayAfter:word.ph};
}
function qPhFill(word,pool,course){
  const blanked=blankOut(word.ph,word.w);
  if(!blanked)return qPhMeaning(word,pool,course);
  const ds=pickWordDistractors(word,pool,3,{avoidText:word.ph,samePos:true});
  return {type:"yon",lvLabel:"フレーズ穴埋め",q:`「${word.phm}」＝ ${blanked} に入るのは？`,choices:[word.w,...ds.map(d=>d.w)],a:0,wids:[word.id],exp:expFor(word,Math.max(course,2)),sayAfter:word.ph};
}
function qExTrans(word,pool,course){
  const seen=new Set([word.exm]);const ds=[];
  for(const c of shuffle(pool)){
    if(c.w===word.w||seen.has(c.exm)||conflicts(c.m,word.m))continue;
    seen.add(c.exm);ds.push(c);if(ds.length>=3)break;
  }
  return {type:"yon",lvLabel:"例文読解",q:`${word.ex}\nこの文の意味は？`,choices:[word.exm,...ds.map(d=>d.exm)],a:0,wids:[word.id],exp:expFor(word,course),speak:word.ex,sayAfter:word.w};
}
function qMaru(word,pool,course,val){
  if(val){
    return {type:"maru",lvLabel:"○×",q:`「${word.w}」の意味は「${mShort(word.m)}」である。`,a:true,wids:[word.id],
      exp:`正しいです。`+expFor(word,course),speak:word.w,sayAfter:word.w};
  }
  const d=pickMeaningDistractors(word,pool,1)[0];
  if(!d)return qMaru(word,pool,course,true);
  return {type:"maru",lvLabel:"○×",q:`「${word.w}」の意味は「${mShort(d.m)}」である。`,a:false,wids:[word.id],
    exp:`誤りです。正しくは「${esc(mShort(word.m))}」。<br>`+expFor(word,course),speak:word.w,sayAfter:word.w};
}
function qKumiMeaning(words,course){
  return {type:"kumi",lvLabel:"組み合わせ",q:"単語と意味を組み合わせよう。",
    pairs:words.map(w=>({l:w.w,r:mShort(w.m),wid:w.id})),
    exp:words.map(w=>`<b>${esc(w.w)}</b>：${esc(w.m)}`).join("<br>")};
}
function qKumiPhrase(words,course){
  return {type:"kumi",lvLabel:"フレーズ組み合わせ",q:"フレーズと意味を組み合わせよう。",
    pairs:words.map(w=>({l:w.ph,r:w.phm,wid:w.id})),
    exp:words.map(w=>`<b>${esc(w.ph)}</b>：${esc(w.phm)}（${esc(w.w)}＝${esc(mShort(w.m))}）`).join("<br>")};
}

function genC1(words,pk){
  const pool=poolFor(pk);
  const sh=shuffle(words);
  const qs=[];
  sh.slice(0,6).forEach(w=>qs.push(qWordToMeaning(w,pool,1)));
  sh.slice(6,8).forEach(w=>qs.push(qMeaningToWord(w,pool,1)));
  sh.slice(8,10).forEach(w=>qs.push(qNuance(w,pool,1)));
  shuffle(sh.slice(6,10)).slice(0,2).forEach(w=>qs.push(qWordToMeaning(w,pool,1)));
  return shuffle(qs);
}
function genC2(words,pk){
  const pool=poolFor(pk);
  const sh=shuffle(words);
  const qs=[];
  sh.slice(0,4).forEach(w=>qs.push(qExFill(w,pool,2)));
  sh.slice(4,7).forEach(w=>qs.push(qPhMeaning(w,pool,2)));
  sh.slice(7,10).forEach(w=>qs.push(qPhFill(w,pool,2)));
  shuffle(words).slice(0,2).forEach(w=>qs.push(qWordToMeaning(w,pool,2)));
  return shuffle(qs);
}
function genC3(words,pk){
  const pool=poolFor(pk);
  const sh=shuffle(words);
  const g=i=>sh[i%sh.length]; // 10語未満のステージでも落ちないように
  const qs=[];
  if(sh.length>=3)qs.push(qKumiMeaning(sh.slice(0,3),3));
  if(sh.length>=6)qs.push(qKumiPhrase(sh.slice(3,6),3));
  qs.push(qMaru(g(6),pool,3,true));
  qs.push(qMaru(g(7),pool,3,false));
  qs.push(qMaru(g(8),pool,3,Math.random()<.5));
  qs.push(qExTrans(g(9),pool,3));
  shuffle(words).slice(0,3).forEach(w=>qs.push(qExFill(w,pool,3)));
  shuffle(words).slice(0,2).forEach(w=>qs.push(qWordToMeaning(w,pool,3)));
  return shuffle(qs);
}
function genReview(ids){
  return shuffle(ids).map(id=>{
    const w=wordById(id);
    const pool=poolFor(partOfId(id));
    const forms=[qWordToMeaning,qMeaningToWord,qExFill,w2=>qMaru(w2,pool,3,Math.random()<.5)];
    const f=forms[Math.floor(Math.random()*forms.length)];
    return f===forms[3]?f(w):f(w,pool,3);
  });
}

function startFlashAuto(){
  const due=dueList();
  let ids=due.slice(0,FLASH_MAX);
  if(ids.length<FLASH_MAX){
    const rest=shuffle(Object.keys(ST.srs).filter(id=>!ids.includes(id))).slice(0,FLASH_MAX-ids.length);
    ids=ids.concat(rest);
  }
  if(!ids.length){toast("まずはコース1で単語を学ぼう！");return;}
  startFlash(ids);
}

  CUR={mode:"flash",flash:{
    queue:shuffle(ids.slice(0,FLASH_MAX)),round:1,idx:0,
    firstTry:{},okFirst:0,retry:[],score:0,prevLine:"",
    total:Math.min(ids.length,FLASH_MAX),t0:Date.now(),applied:false
  }};
  renderFlash();
}

  const f=CUR.flash;

  const w=wordById(id);
  app().innerHTML="";

      <span class="chip">⚡ 高速周回${f.round>1?`（${f.round}周目）`:""}</span>
      <span class="chip">${f.idx+1}/${f.queue.length}</span>
      <span class="chip">+<span class="em">${f.score}</span>XP</span>
    </div>
    <div class="progress"><div class="bar" style="width:${Math.round(f.idx/f.queue.length*100)}%"></div></div>
    <div class="card">
      <div class="flashprev">${f.prevLine?esc(f.prevLine):"　"}</div>
      <div class="flashword">${esc(w.w)}</div>
      <div class="center"><span class="muted">【${esc(w.pos)}】</span> <button class="spk" data-spk="${esc(w.w)}">🔊</button></div>
      <div class="fxwrap">
        <button class="opt" id="fOk">👌 わかった</button>
        <button class="opt" id="fNg">🤔 あやしい</button>
      </div>
      <div class="flashhint" style="margin-top:10px">目標：1語1〜2秒！ 意味がパッと出たら「わかった」</div>
    </div>
    <button class="btn secondary small" id="quitBtn">← 終了する</button>
  </div>`));
  document.querySelectorAll('.spk').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.spk)));
  const judge=(ok)=>{
    const first=!(id in f.firstTry);
    if(first){f.firstTry[id]=ok;srsOnAnswer(id,ok);} // SRSには最初の判定だけを記録
    if(ok){
      f.score+=first?2:1;
      if(first)f.okFirst++;
    } else {
      if(!f.retry.includes(id))f.retry.push(id);
      sfx('bad');
    }
    f.prevLine=`${w.w}＝${mShort(w.m)}`;
    f.idx++;
    if(f.idx>=f.queue.length){
      if(f.retry.length&&f.round<3){
        f.queue=shuffle(f.retry);f.retry=[];f.round++;f.idx=0;
        toast(`あやしい${f.queue.length}語をもう一周！`);
      } else {
        finishFlash();return;
      }
    }
    renderFlash();
  };
  document.getElementById('fOk').addEventListener('click',()=>judge(true));
  document.getElementById('fNg').addEventListener('click',()=>judge(false));
  document.getElementById('quitBtn').addEventListener('click',()=>{
    if(confirm("終了する？（ここまでの分は記録されるよ）"))finishFlash();
  });
}
function finishFlash(){
  const f=CUR.flash;
  if(f.applied)return;f.applied=true;
  ensureToday();
  ST.flashCount=(ST.flashCount||0)+1;
  const lvBefore=levelInfo(ST.xp).lv;
  ST.xp+=f.score;ST.today.xp+=f.score;ST.today.sessions++;
  let goalBonus=false;
  if(ST.today.sessions===DAILY_GOAL){ST.xp+=30;ST.today.xp+=30;goalBonus=true;}
  const levelUp=levelInfo(ST.xp).lv>lvBefore?levelInfo(ST.xp).lv:0;
  const streakInfo=bumpStreak();
  const newBadges=checkBadges();
  save();
  const secs=Math.max(1,Math.round((Date.now()-f.t0)/1000));
  const judged=Object.keys(f.firstTry).length;
  const weak=Object.entries(f.firstTry).filter(([,ok])=>!ok).map(([id])=>wordById(id));
  const perfect=judged>0&&weak.length===0;
  const weakHtml=weak.length
    ?`<div style="text-align:left;margin-top:12px"><div class="muted">あやしかった語（あすの復習に出るよ）:</div>${weak.map(w=>`<div style="font-size:.88rem">・<b>${esc(w.w)}</b>：${esc(mShort(w.m))}</div>`).join("")}</div>`
    :`<div class="muted" style="margin-top:12px">全部一発「わかった」！こまめな周回が最強！</div>`;
  app().innerHTML="";
  app().appendChild(el(`<div><div class="card center">
    <div class="muted">⚡ 高速周回 結果</div>
    <div class="rankbig">${perfect?"💯":"⚡"}</div>
    <div style="font-size:1.15rem;font-weight:800">${judged}語を${secs}秒でチェック（1語${(secs/Math.max(1,judged)).toFixed(1)}秒）</div>
    <div class="muted">一発でわかった ${f.okFirst}/${judged}語 ｜ +${f.score}XP</div>
    ${levelUp?`<div class="chip" style="margin-top:8px;border-color:#b388ff;color:#d8c8ff">🎉 レベルアップ！ Lv.${levelUp}「${titleFor(levelUp)}」</div>`:""}
    ${goalBonus?`<div class="chip" style="margin-top:8px;border-color:var(--ok);color:#bff3ec">🎯 今日のノルマ${DAILY_GOAL}回達成！ +30XP</div>`:""}
    ${streakInfo.extended?`<div class="chip flame" style="margin-top:8px">🔥 ストリーク ${streakInfo.streak}日目！</div>`:""}
    ${newBadges.length?`<div class="badges">${newBadges.map(b=>`<div class="badge">🏅 ${esc(b)} GET!</div>`).join("")}</div>`:""}
    ${weakHtml}
    <div class="row" style="margin-top:16px">
      <button class="btn secondary" id="againBtn">⚡ もう一周</button>
      <button class="btn" id="homeBtn">ホームへ</button>
    </div>
  </div></div>`));
  if(perfect){confetti();sfx('fanfare');}
  document.getElementById('homeBtn').addEventListener('click',renderHome);
  document.getElementById('againBtn').addEventListener('click',startFlashAuto);
}

/* ============================================================
   画面：Part（コースタブ＋ステージグリッド）
============================================================ */
function renderPart(pk,course){
  course=course||1;
  ST.lastLoc={pk,course};save();
  const p=PART_INFO.find(x=>x.key===pk);
  const ci=COURSE_INFO[course-1];
  const n=stagesOf(pk);

  let grid="";
  for(let s=0;s<n;s++){
    const un=unlocked(pk,course,s);
    const info=clearedInfo(pk,course,s);
    const ws=stageWords(pk,s);
    const isIdiom=ws.every(w=>w.pos==="熟");
    grid+=`<div class="snode ${un?'':'locked'} ${info?'done':''}" data-s="${s}" data-locked="${!un}">
      <div class="n">${s+1}${isIdiom?'<span style="font-size:.6rem;color:var(--accent2)">熟</span>':''}</div>
      <div class="r">${s*STAGE_SIZE+1}〜${s*STAGE_SIZE+ws.length}</div>
      <div class="st">${info?("★".repeat(info.stars)):(un?"▶":"🔒")}</div>
    </div>`;
  }
  app().innerHTML="";
  app().appendChild(el(`<div>
    <div class="navrow"><button class="btn secondary small" id="backBtn">← ホーム</button>
      <button class="btn secondary small" id="wbBtn">📖 このPartの単語帳</button></div>
    <div class="card">
      <h2>${p.name}｜${p.label}</h2>
      <div class="muted">${p.desc}（全${WORDS[pk].length}語・${n}ステージ）</div>
      <div class="tabs">${tabs}</div>
      <div class="coursedesc">${ci.icon} ${ci.desc}${course>1?`<br>🔒 各ステージは ${COURSE_INFO[course-2].name} をクリアすると解放`:""}</div>
      <div class="sgrid">${grid}</div>
    </div>
  </div>`));
  document.getElementById('backBtn').addEventListener('click',renderHome);
  document.getElementById('wbBtn').addEventListener('click',()=>renderWordbook(pk));
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>renderPart(pk,+t.dataset.c)));
  document.querySelectorAll('.snode').forEach(nd=>nd.addEventListener('click',()=>{
    if(nd.dataset.locked==="true"){toast(course===1?"前のステージを先にクリアしよう！":"同じステージの前のコースを先にクリアしよう！");return;}
    startStageSession(pk,course,+nd.dataset.s);
  }));
}

/* ============================================================
   画面：学習カード（クイズ前のインプット）
============================================================ */
let CUR=null;
function startStageSession(pk,course,s){
  ST.lastLoc={pk,course};save();
  CUR={mode:"stage",pk,course,stage:s,words:stageWords(pk,s),cardIdx:0,revealed:false};
  renderStudy();
}
function cardBody(w,course,revealed){
  const spkBtn=`<div><button class="spk" data-spk="${esc(w.w)}">🔊 発音</button></div>`;
  if(!revealed){
    return `<div class="w">${esc(w.w)}</div><div class="pos">【${esc(w.pos)}】</div>${spkBtn}
      <div class="hidden-hint">タップして${course===1?"意味":course===2?"例文":"使い方"}を表示</div>`;
  }
  if(course===1){
    const rest=w.m.length>mShort(w.m).length?`<div class="nu" style="font-size:.82rem">ほかの意味：${esc(w.m)}</div>`:"";
    return `<div class="w">${esc(w.w)}</div><div class="pos">【${esc(w.pos)}】</div>
      <div class="m">${esc(mShort(w.m))}</div>${rest}<div class="nu">💡 ${esc(w.nu)}</div>${spkBtn}
      <div class="hidden-hint" style="font-size:.75rem">🗣 声に出して読むと記憶に残るよ！</div>`;
  }
  if(course===2){
    return `<div class="w">${esc(w.w)}</div><div class="m" style="font-size:.95rem">${esc(w.m)}</div>
      <div class="phen">📌 ${esc(w.ph)}</div><div class="nu">${esc(w.phm)}</div>
      <div class="exen">✏️ ${esc(w.ex)}</div><div class="exja">${esc(w.exm)}</div>
      <div><button class="spk" data-spk="${esc(w.ex)}">🔊 例文</button></div>`;
  }
  return `<div class="w">${esc(w.w)}</div><div class="m" style="font-size:.95rem">${esc(w.m)}</div>
    <div class="us">🔧 ${esc(w.us)}</div><div class="tipx">⭐ Tip: ${esc(w.tip)}</div>${spkBtn}`;
}
function renderStudy(){
  const c=CUR;
  const w=c.words[c.cardIdx];
  const p=PART_INFO.find(x=>x.key===c.pk);
  const ci=COURSE_INFO[c.course-1];
  app().innerHTML="";
  app().appendChild(el(`<div>
    <div class="hud">
      <span class="chip">${p.name} ${ci.icon}${ci.name} ステージ${c.stage+1}</span>
      <span class="chip">確認 <span class="em">${c.cardIdx+1}</span>/${c.words.length}</span>
    </div>
    <div class="progress"><div class="bar" style="width:${Math.round(c.cardIdx/c.words.length*100)}%"></div></div>
    <div class="fcard" id="fcard">${cardBody(w,c.course,c.revealed)}</div>
    <button class="btn" id="nextCard">${c.revealed?(c.cardIdx<c.words.length-1?"次の単語へ →":"クイズに挑戦！ ⚔️"):"タップして表示"}</button>
    <div class="row" style="margin-top:8px">
      <button class="btn secondary small" id="skipBtn">クイズへスキップ ⏩</button>
      <button class="btn secondary small" id="quitBtn">← もどる</button>
    </div>
  </div>`));
  if(!c.revealed&&ST.autoSpeak!==false)speak(w.w); // 新しいカードが出たら発音（音読のお手本）
  const reveal=()=>{if(!c.revealed){c.revealed=true;renderStudy();}};
  document.getElementById('fcard').addEventListener('click',e=>{if(e.target.closest('.spk'))return;reveal();});
  document.getElementById('nextCard').addEventListener('click',()=>{
    if(!c.revealed){reveal();return;}
    if(c.cardIdx<c.words.length-1){c.cardIdx++;c.revealed=false;renderStudy();}
    else beginQuiz();
  });
  document.getElementById('skipBtn').addEventListener('click',beginQuiz);
  document.getElementById('quitBtn').addEventListener('click',()=>renderPart(c.pk,c.course));
  document.querySelectorAll('.spk').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();speak(b.dataset.spk);}));
}

/* ============================================================
   クイズ本体
============================================================ */
function beginQuiz(){
  const c=CUR;
  const gen=[genC1,genC2,genC3][c.course-1];
  c.quiz={list:gen(c.words,c.pk),i:0,correct:0,combo:0,maxCombo:0,score:0,wrongWids:[],applied:false};
  renderQuestion();
}
function startReview(){
  const due=dueList();
  if(!due.length){toast("復習する単語はないよ！🎉");return;}
  const ids=due.slice(0,REVIEW_MAX);
  CUR={mode:"review"};
  CUR.quiz={list:genReview(ids),i:0,correct:0,combo:0,maxCombo:0,score:0,wrongWids:[],applied:false};
  renderQuestion();
}
function sessionTitle(){
  if(CUR.mode==="review")return "🔁 復習クエスト";
  const p=PART_INFO.find(x=>x.key===CUR.pk);
  return `${p.name} ${COURSE_INFO[CUR.course-1].icon}ステージ${CUR.stage+1}`;
}
function renderQuestion(){
  const z=CUR.quiz;
  const q=z.list[z.i];
  const num=z.i+1,total=z.list.length;
  const pct=Math.round(z.i/total*100);
  const hud=`<div class="hud">
    <span class="chip">${sessionTitle()}</span>
    <span class="chip">Q <span class="em">${num}</span>/${total}</span>
    <span class="chip">スコア <span class="em">${z.score}</span></span>
    <span class="chip combo">🔥 ${z.combo}</span>
  </div>
  <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
  ${CUR.mode==="stage"?`<div class="muted" style="font-size:.72rem;margin-bottom:8px">クリア基準：正答率${CLEAR_PCT}%で★／85%で★★／100%で★★★</div>`:""}`;
  const typeLabel={yon:"4択",maru:"○×",kumi:"組み合わせ"}[q.type];
  const tags=`<div class="qtypebar"><span class="tag lv">${esc(q.lvLabel||"")}</span><span class="tag">${typeLabel}</span>${q.speak?`<button class="spk" data-spk="${esc(q.speak)}" style="padding:2px 10px;font-size:.85rem">🔊</button>`:""}</div>`;
  let body="";
  if(q.type==="maru"){
    body=`<div class="qtext">${esc(q.q)}</div>
      <div class="mxwrap">
        <button class="opt" data-mx="true">○</button>
        <button class="opt" data-mx="false">×</button>
      </div>`;
  } else if(q.type==="kumi"){
    const rights=shuffle(q.pairs.map((p,i)=>({text:p.r,i})));
    const rows=q.pairs.map((p,idx)=>`
      <div class="matchrow">
        <div class="l">${esc(p.l)}</div>
        <select data-sel="${idx}">
          <option value="">▼ 選ぶ</option>
          ${rights.map(r=>`<option value="${r.i}">${esc(r.text)}</option>`).join("")}
        </select>
      </div>`).join("");
    body=`<div class="qtext">${esc(q.q)}</div>${rows}
      <button class="btn" id="kumiCheck">こたえ合わせ</button>`;
  } else {
    const order=shuffle(q.choices.map((ch,idx)=>({ch,idx})));
    z.shuffledCorrect=order.findIndex(o=>o.idx===q.a);
    const opts=order.map((o,pos)=>`<button class="opt" data-i="${pos}">${esc(o.ch)}</button>`).join("");
    body=`<div class="qtext">${esc(q.q)}</div>${opts}`;
  }
  z.answered=false;
  app().innerHTML="";
  app().appendChild(el(`<div><div class="card">${hud}${tags}${body}
    <div class="fb" id="fb"></div>
    <div id="nextWrap"></div>
  </div>
  <button class="btn secondary small" id="quitBtn" style="margin-top:4px">← 中断してもどる</button>
  </div>`));
  document.getElementById('quitBtn').addEventListener('click',()=>{
    if(confirm("中断する？（ここまでのXPと単語の記録はちゃんと保存されるよ）")){
      applyPartial();
      if(CUR.mode==="review")renderHome();else renderPart(CUR.pk,CUR.course);
    }
  });
  document.querySelectorAll('.spk').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.spk)));
  if(q.type==="maru"){
    document.querySelectorAll('[data-mx]').forEach(b=>b.addEventListener('click',()=>{
      answer((b.dataset.mx==='true')===q.a,b,null);
    }));
  } else if(q.type==="kumi"){
    document.getElementById('kumiCheck').addEventListener('click',checkKumi);
  } else {
    document.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{
      answer(parseInt(b.dataset.i)===z.shuffledCorrect,b,parseInt(b.dataset.i));
    }));
  }
}
function answer(isCorrect,clickedBtn,chosenIdx){
  const z=CUR.quiz,q=z.list[z.i];
  if(z.answered)return;z.answered=true;
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
  if(q.type==="maru"){
    document.querySelectorAll('[data-mx]').forEach(o=>{
      const val=o.dataset.mx==='true';
      if(val===q.a)o.classList.add('correct');
      else if(o===clickedBtn)o.classList.add('wrong');
    });
  } else {
    document.querySelectorAll('[data-i]').forEach(o=>{
      const idx=parseInt(o.dataset.i);
      if(idx===z.shuffledCorrect)o.classList.add('correct');
      else if(idx===chosenIdx)o.classList.add('wrong');
    });
  }
  (q.wids||[]).forEach(wid=>srsOnAnswer(wid,isCorrect));
  finishQuestion(isCorrect,q);
}
function checkKumi(){
  const z=CUR.quiz,q=z.list[z.i];
  if(z.answered)return;
  const sels=document.querySelectorAll('select[data-sel]');
  let allFilled=true,allRight=true;
  sels.forEach(sel=>{if(sel.value==="")allFilled=false;});
  if(!allFilled){toast("すべて選んでね！");return;}
  z.answered=true;
  let okPairs=0;
  sels.forEach(sel=>{
    const idx=parseInt(sel.dataset.sel);
    const pairOk=(+sel.value===idx)||(q.pairs[+sel.value].r===q.pairs[idx].r);
    if(pairOk){sel.classList.add('correct');okPairs++;}else{sel.classList.add('wrong');allRight=false;}
    if(q.pairs[idx].wid){
      srsOnAnswer(q.pairs[idx].wid,pairOk);
      if(!pairOk&&!z.wrongWids.includes(q.pairs[idx].wid))z.wrongWids.push(q.pairs[idx].wid);
    }
    sel.disabled=true;
  });
  document.getElementById('kumiCheck').disabled=true;
  finishQuestion(allRight,q,{ok:okPairs,total:q.pairs.length});
}
function finishQuestion(isCorrect,q,pairInfo){
  const z=CUR.quiz;
  ST.totalAnswered++;
  const fb=document.getElementById('fb');
  if(isCorrect){
    ST.totalCorrect++;
    z.correct++;z.combo++;z.maxCombo=Math.max(z.maxCombo,z.combo);
    ST.maxComboEver=Math.max(ST.maxComboEver,z.combo);
    let pts=10;
    let bonus=z.combo>=3?(z.combo>=5?10:5):0;
    z.score+=pts+bonus;
    sfx('good');
    fb.className="fb good show";
    fb.innerHTML=`<div class="head">⭕ 正解！ +${pts}XP${bonus?` <span class="combo">コンボ+${bonus}</span>`:''}</div><div class="exp">${q.exp}</div>`;
    if(z.combo===3)toast("🔥 3連続正解！ボーナス発生！");
    if(z.combo===5)toast("🔥🔥 5連続！絶好調！");
    if(z.combo===10)toast("🌟 10連続！！天才！？");
  } else {
    z.combo=0;
    sfx('bad');
    (q.wids||[]).forEach(wid=>{if(wid&&!z.wrongWids.includes(wid))z.wrongWids.push(wid);});
    let head=`❌ おしい！ここで覚えれば勝ち`;
    if(pairInfo&&pairInfo.ok>0){ // 組み合わせは部分点あり
      const pp=Math.round(10*pairInfo.ok/pairInfo.total);
      z.score+=pp;
      head=`❌ おしい！ ${pairInfo.total}組中${pairInfo.ok}組正解（部分点+${pp}XP）`;
    }
    fb.className="fb bad show";
    fb.innerHTML=`<div class="head">${head}</div><div class="exp">${q.exp}</div>`;
  }
  if(ST.autoSpeak!==false&&q.sayAfter)speak(q.sayAfter);
  save();
  const nw=document.getElementById('nextWrap');
  const last=z.i>=z.list.length-1;
  nw.appendChild(el(`<button class="btn" id="nextBtn">${last?"結果を見る 🏁":"次の問題へ →"}</button>`));
  const nb=document.getElementById('nextBtn');
  nb.addEventListener('click',()=>{if(last){applyResult();renderResult();}else{z.i++;renderQuestion();}});
}

/* ============================================================
   結果
============================================================ */
function applyResult(){
  const z=CUR.quiz;
  if(z.applied)return;z.applied=true;
  const total=z.list.length;
  const pct=Math.round(z.correct/total*100);
  let stars=0;
  if(pct>=CLEAR_PCT)stars=1;
  if(pct>=85)stars=2;
  if(pct===100)stars=3;
  z.pct=pct;z.stars=stars;
  ensureToday();
  const lvBefore=levelInfo(ST.xp).lv;
  ST.xp+=z.score;ST.today.xp+=z.score;ST.today.sessions++;
  if(ST.today.sessions===DAILY_GOAL){ST.xp+=30;ST.today.xp+=30;z.goalBonus=true;}
  z.levelUp=levelInfo(ST.xp).lv>lvBefore?levelInfo(ST.xp).lv:0;
  if(CUR.mode==="stage"&&stars>0){
    const key=ck(CUR.pk,CUR.course,CUR.stage);
    const prev=ST.cleared[key];
    ST.cleared[key]={stars:Math.max(prev?prev.stars:0,stars),best:Math.max(prev?prev.best:0,pct)};
  }
  if(CUR.mode==="review")ST.reviewCount++;
  if(pct>=90)ST.sRankCount++;
  z.streakInfo=bumpStreak();
  z.newBadges=checkBadges();
  save();
}
/* 中断時もここまでの分は記録する */
function applyPartial(){
  const z=CUR.quiz;
  if(!z||z.applied)return;
  const answered=z.i+(z.answered?1:0);
  if(answered<1)return;
  z.applied=true;
  ensureToday();
  ST.xp+=z.score;ST.today.xp+=z.score;
  if(answered>=3){ST.today.sessions++;bumpStreak();}
  checkBadges();save();
}
function renderResult(){
  const z=CUR.quiz;
  const total=z.list.length,pct=z.pct;
  let rank,msg;
  if(pct>=90){rank="S";msg="かんぺき！キミの記憶力、本物だ！";}
  else if(pct>=75){rank="A";msg="よくできました！クリアライン余裕ごえ！";}
  else if(pct>=CLEAR_PCT){rank="B";msg="クリア！まちがえた語は復習リストが面倒みるよ。";}
  else if(pct>=40){rank="C";msg=`おしい！クリアは${CLEAR_PCT}%から。もう1回やればほぼ確実！`;}
  else{rank="D";msg=`大丈夫、1回目はみんなこんなもん。クリアは${CLEAR_PCT}%から。解説を見てもう一度！`;}
  const cleared=CUR.mode==="stage"&&z.stars>0;
  const wrongWords=z.wrongWids.map(wordById);
  const wrongHtml=wrongWords.length
    ?`<div style="text-align:left;margin-top:12px"><div class="muted">今回にがてだった語（あすの復習に自動で出るよ）:</div>${wrongWords.map(w=>`<div style="font-size:.88rem">・<b>${esc(w.w)}</b>：${esc(mShort(w.m))}</div>`).join("")}</div>`
    :`<div class="muted" style="margin-top:12px">まちがい0！パーフェクト！</div>`;
  const badgeHtml=z.newBadges.length?`<div class="badges">${z.newBadges.map(b=>`<div class="badge">🏅 ${esc(b)} GET!</div>`).join("")}</div>`:"";
  let streakHtml="";
  if(z.streakInfo&&z.streakInfo.extended){
    streakHtml=`<div class="chip flame" style="margin-top:8px">🔥 ストリーク ${z.streakInfo.streak}日目！</div>`;
    if(z.streakInfo.froze)streakHtml+=`<div class="muted" style="margin-top:4px">🧊 おまもり発動！1日あいたけどストリーク継続</div>`;
    if(z.streakInfo.earned)streakHtml+=`<div class="muted" style="margin-top:4px">🧊 7日連続ボーナス：おまもりを1つゲット！</div>`;
  }
  const levelHtml=z.levelUp?`<div class="chip" style="margin-top:8px;border-color:#b388ff;color:#d8c8ff">🎉 レベルアップ！ Lv.${z.levelUp}「${titleFor(z.levelUp)}」</div>`:"";
  const goalHtml=z.goalBonus?`<div class="chip" style="margin-top:8px;border-color:var(--ok);color:#bff3ec">🎯 今日のノルマ${DAILY_GOAL}回達成！ +30XP</div>`:"";
  let nextBtns="";
  if(CUR.mode==="stage"){
    const {pk,course,stage}=CUR;
    if(!cleared){
      nextBtns=`<button class="btn" id="retryBtn">もう一度チャレンジ 💪</button>`;
    } else {
      let nb="";
      if(course<3&&unlocked(pk,course+1,stage))nb=`<button class="btn" id="nextCourseBtn">${COURSE_INFO[course].icon} 同じ10語で${COURSE_INFO[course].name}へ</button>`;
      else if(stage+1<stagesOf(pk)&&unlocked(pk,course,stage+1))nb=`<button class="btn" id="nextStageBtn">▶ 次のステージ${stage+2}へ</button>`;
      else nb=`<button class="btn" id="recNextBtn">▶ おまかせで次へ</button>`;
      nextBtns=`${nb}<button class="btn secondary" id="flashRetryBtn">⚡ この10語を高速周回（1秒1単語）</button><button class="btn secondary" id="retryBtn">もう一度（星を増やす）</button>`;
    }
  } else {
    const dueN=dueList().length;
    const recS=recommendNextStage();
    nextBtns=(dueN?`<button class="btn" id="reviewAgainBtn">🔁 続けて復習（あと${Math.min(dueN,REVIEW_MAX)}語）</button>`:"")
      +(recS?`<button class="btn ${dueN?'secondary':''}" id="newStageBtn">▶ 新しいステージにすすむ</button>`:"");
  }
  app().innerHTML="";
  app().appendChild(el(`<div><div class="card center">
    <div class="muted">${sessionTitle()}　結果</div>
    <div class="rankbig">${rank}</div>
    <div class="stars" style="font-size:1.6rem">${CUR.mode==="stage"?("★".repeat(z.stars)+"☆".repeat(3-z.stars)):""}</div>
    <div style="font-size:1.3rem;font-weight:800">正答率 ${pct}%</div>
    <div class="muted">${z.correct}/${total}問正解 ｜ 最大コンボ ${z.maxCombo} ｜ +${z.score}XP</div>
    <div style="margin:10px 0;font-weight:700">${msg}</div>
    ${levelHtml}
    ${goalHtml}
    ${streakHtml}
    ${badgeHtml}
    ${wrongHtml}
    <div style="margin-top:16px">${nextBtns}</div>
    <div class="row" style="margin-top:10px">
      <button class="btn secondary" id="homeBtn">ホームへ</button>
      ${CUR.mode==="stage"?`<button class="btn secondary" id="partBtn">ステージ一覧</button>`:""}
    </div>
  </div></div>`));
  if(z.levelUp||z.stars===3||rank==="S"){confetti();sfx('fanfare');}
  else if(pct>=CLEAR_PCT)sfx('good');
  if(CUR.mode==="stage"&&cleared)setTimeout(()=>toast("🎉 ステージクリア！"),300);
  document.getElementById('homeBtn').addEventListener('click',renderHome);
  const pb=document.getElementById('partBtn');if(pb)pb.addEventListener('click',()=>renderPart(CUR.pk,CUR.course));
  const rb=document.getElementById('retryBtn');if(rb)rb.addEventListener('click',()=>startStageSession(CUR.pk,CUR.course,CUR.stage));
  const nc=document.getElementById('nextCourseBtn');if(nc)nc.addEventListener('click',()=>startStageSession(CUR.pk,CUR.course+1,CUR.stage));
  const ns=document.getElementById('nextStageBtn');if(ns)ns.addEventListener('click',()=>startStageSession(CUR.pk,CUR.course,CUR.stage+1));
  const rn=document.getElementById('recNextBtn');if(rn)rn.addEventListener('click',()=>{
    const rec=recommendNext();
    if(rec.kind==="review")startReview();
    else if(rec.kind==="stage")startStageSession(rec.pk,rec.c,rec.s);
    else renderHome();
  });
  const fr=document.getElementById('flashRetryBtn');if(fr)fr.addEventListener('click',()=>{
    startFlash(stageWords(CUR.pk,CUR.stage).map(w=>w.id));
  });
  const nsb=document.getElementById('newStageBtn');if(nsb)nsb.addEventListener('click',()=>{
    const recS=recommendNextStage();
    if(recS)startStageSession(recS.pk,recS.c,recS.s);else renderHome();
  });
  const ra=document.getElementById('reviewAgainBtn');if(ra)ra.addEventListener('click',startReview);
}

/* ============================================================
   画面：単語帳
============================================================ */
function renderWordbook(pk){
  pk=pk||"p1";
  const p=PART_INFO.find(x=>x.key===pk);
  const tabs=PART_INFO.map(x=>`<div class="tab ${x.key===pk?'on':''}" data-pk="${x.key}" style="font-size:.78rem;padding:8px 2px">${x.no}</div>`).join("");
  app().innerHTML="";
  app().appendChild(el(`<div>
    <div class="navrow"><button class="btn secondary small" id="backBtn">← ホーム</button></div>
    <div class="card">
      <h2>📖 単語帳｜${p.name} ${p.label}</h2>
      <div class="tabs">${tabs}</div>
      <input class="search" id="wbSearch" placeholder="単語・意味でしぼりこみ…">
      <div id="wbList"></div>
    </div>
  </div>`));
  document.getElementById('backBtn').addEventListener('click',renderHome);
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>renderWordbook(t.dataset.pk)));
  const listEl=document.getElementById('wbList');
  const render=(filter)=>{
    const f=(filter||"").trim().toLowerCase();
    const items=WORDS[pk].map((w,i)=>({...w,id:pk+"-"+i}))
      .filter(w=>!f||w.w.toLowerCase().includes(f)||w.m.includes(f));
    listEl.innerHTML=items.slice(0,400).map(w=>`
      <div class="wbitem" data-id="${w.id}">
        <div class="top">
          <span class="dots">${dotsOf(w.id)}</span>
          <span class="w">${esc(w.w)}</span><span class="muted">【${esc(w.pos)}】</span>
          <span class="m">${esc(mShort(w.m))}</span>
        </div>
        <div class="detail">
          <div>意味：${esc(w.m)}</div>
          <div>💡 ${esc(w.nu)}</div>
          <div>📌 ${esc(w.ph)}（${esc(w.phm)}）</div>
          <div>✏️ ${esc(w.ex)}<br>　${esc(w.exm)}</div>
          <div>🔧 ${esc(w.us)}</div>
          <div>⭐ Tip: ${esc(w.tip)}</div>
          <button class="spk" data-spk="${esc(w.w)}">🔊 発音</button>
        </div>
      </div>`).join("")||`<div class="muted" style="margin-top:10px">見つからなかった…</div>`;
    listEl.querySelectorAll('.wbitem').forEach(it=>it.addEventListener('click',e=>{
      if(e.target.closest('.spk')){speak(e.target.closest('.spk').dataset.spk);return;}
      it.classList.toggle('open');
    }));
  };
  render("");
  document.getElementById('wbSearch').addEventListener('input',e=>render(e.target.value));
}

/* ============================================================
   画面：実績
============================================================ */
function renderBadges(){
  app().innerHTML="";
  const items=BADGES.map(b=>{
    const got=ST.badges.includes(b.id);
    return `<div class="badge ${got?'':'locked'}" title="${esc(b.desc)}">${got?"🏅":"🔒"} ${esc(b.name)}<br><span style="font-size:.68rem;font-weight:400">${esc(b.desc)}</span></div>`;
  }).join("");
  app().appendChild(el(`<div>
    <div class="navrow"><button class="btn secondary small" id="backBtn">← ホーム</button></div>
    <div class="card">
      <h2>🏅 実績（${ST.badges.length}/${BADGES.length}）</h2>
      <div class="badges" style="justify-content:flex-start">${items}</div>
    </div>
  </div>`));
  document.getElementById('backBtn').addEventListener('click',renderHome);
}

/* ============================================================
   画面：設定
============================================================ */
function renderSettings(){
  app().innerHTML="";
  app().appendChild(el(`<div>
    <div class="navrow"><button class="btn secondary small" id="backBtn">← ホーム</button></div>
    <div class="card">
      <h2>⚙️ 設定・データ</h2>
      <div class="muted">進捗はこのブラウザに自動保存。機種変更やブラウザ変更のときは下のコードで引っこし。</div>
      <h2 style="margin-top:14px">サウンド</h2>
      <button class="btn secondary" id="soundBtn">${ST.sound===false?"🔇 効果音 OFF（タップでON）":"🔊 効果音 ON（タップでOFF）"}</button>
      <button class="btn secondary" id="speakBtn">${ST.autoSpeak===false?"🤐 単語の自動発音 OFF（タップでON）":"🗣 単語の自動発音 ON（タップでOFF）"}</button>
      <h2 style="margin-top:14px">バックアップを作る</h2>
      <div class="muted">この文字列をメモアプリ等に保存しておけば、機種変更しても続きから遊べるよ。</div>
      <textarea class="io" id="exArea" readonly>${esc(JSON.stringify(ST))}</textarea>
      <button class="btn secondary" id="copyBtn">📋 コピー</button>
      <h2 style="margin-top:14px">バックアップからもどす</h2>
      <textarea class="io" id="imArea" placeholder="ここにバックアップの文字列を貼り付け"></textarea>
      <button class="btn secondary" id="imBtn">↩️ 読み込む</button>
      <h2 style="margin-top:14px">リセット</h2>
      <button class="btn secondary" id="resetBtn" style="border-color:var(--ng);color:#ffb3b3">🗑 進捗を全部消す</button>
      <div class="muted" style="margin-top:14px">このアプリの語彙データ（意味・例文・Tip等）はすべてオリジナルの書き下ろしです。</div>
    </div>
  </div>`));
  document.getElementById('backBtn').addEventListener('click',renderHome);
  document.getElementById('soundBtn').addEventListener('click',()=>{
    ST.sound=(ST.sound===false)?true:false;save();
    if(ST.sound!==false)sfx('good');
    renderSettings();
  });
  document.getElementById('speakBtn').addEventListener('click',()=>{
    ST.autoSpeak=(ST.autoSpeak===false)?true:false;save();
    if(ST.autoSpeak!==false)speak("apple");
    renderSettings();
  });
  document.getElementById('copyBtn').addEventListener('click',()=>{
    const ta=document.getElementById('exArea');ta.select();
    try{navigator.clipboard.writeText(ta.value);}catch(e){document.execCommand('copy');}
    toast("コピーしたよ！");
  });
  document.getElementById('imBtn').addEventListener('click',()=>{
    try{
      const obj=JSON.parse(document.getElementById('imArea').value);
      if(typeof obj.xp!=="number"||!obj.srs)throw new Error("bad");
      ST=Object.assign(defaultState(),obj);ensureToday();save();
      toast("復元したよ！");renderHome();
    }catch(e){toast("コードが読み取れなかった…");}
  });
  document.getElementById('resetBtn').addEventListener('click',()=>{
    if(!confirm("進捗・ストリーク・バッジを全部消す？"))return;
    if(!confirm("ほんとうに？この操作はもどせないよ"))return;
    ST=defaultState();ensureToday();save();toast("リセットしたよ");renderHome();
  });
}

/* ---------- キーボード操作（PC向け: 1〜4で回答 / ○=O ×=X / Enterで次へ） ---------- */
document.addEventListener('keydown',e=>{
  const tag=document.activeElement?document.activeElement.tagName:"";
  if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT')return;
  const fOk=document.getElementById('fOk');
  if(fOk){ // 高速周回: 1=わかった / 2=あやしい
    if(e.key==='1')fOk.click();
    else if(e.key==='2')document.getElementById('fNg').click();
    return;
  }
  if(e.key>='1'&&e.key<='4'){
    const b=document.querySelector(`[data-i="${+e.key-1}"]`);
    if(b&&!b.classList.contains('disabled'))b.click();
  } else if(e.key==='o'||e.key==='O'){
    const b=document.querySelector('[data-mx="true"]');
    if(b&&!b.classList.contains('disabled'))b.click();
  } else if(e.key==='x'||e.key==='X'){
    const b=document.querySelector('[data-mx="false"]');
    if(b&&!b.classList.contains('disabled'))b.click();
  } else if(e.key==='Enter'){
    if(tag==='BUTTON')return; // ボタンにフォーカスがある時はブラウザ標準に任せる
    const nb=document.getElementById('nextBtn')||document.getElementById('nextCard');
    if(nb)nb.click();
  }
});

/* ---------- 起動 ---------- */
renderHome();
</script>

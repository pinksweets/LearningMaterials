えた」のように出やすい語である。"},{"w":"crowd","pos":"名","m":"群衆","nu":"一つの場所に集まった多くの人々のまとまりを表す語だ。","ph":"a crowd of people","phm":"大勢の人の群れ","ex":"A large crowd gathered outside the stadium before the game.","exm":"試合前に大勢の群衆がスタジアムの外に集まった。","us":"集合名詞で通例単数扱いだが、英では複数扱いされることもある。動詞crowdは「群がる、混雑させる」の意味になる。","tip":"crowdedという形容詞「混雑した」とセットで覚えると使い分けやすい。"},{"w":"dawn","pos":"名","m":"夜明け","nu":"太陽が昇り始め、空が明るくなり始める一日の始まりの時間を表す語だ。","ph":"at dawn","phm":"夜明けに","ex":"The runners started their training at dawn every morning.","exm":"ランナーたちは毎朝夜明けに練習を始めた。","us":"at dawn「夜明けに」という前置詞atとの組み合わせが頻出だ。sunriseとほぼ同義だが、より文学的な響きを持つ。","tip":"duskが「夕暮れ」で対義語にあたるので、dawnとduskをペアで覚えると効果的である。"},{"w":"debt","pos":"名","m":"借金","nu":"他人やお金から借りていて返さなければならない義務を表す語だ。","ph":"pay off a debt","phm":"借金を完済する","ex":"His parents worked hard to pay off their debt quickly.","exm":"彼の両親はその借金を早く完済するために懸命に働いた。","us":"発音では中のbは読まない(発音記号はdet)ことに注意が必要な語である。","tip":"in debtで「借金を抱えている」という状態を表す表現もあわせて覚えておくと良い。"},{"w":"desert","pos":"名","m":"砂漠","nu":"雨がほとんど降らず、植物がほとんど育たない乾燥した広大な土地を表す語だ。","ph":"cross the desert","phm":"砂漠を横断する","ex":"The travelers needed plenty of water to cross the desert.","exm":"旅人たちは砂漠を横断するために大量の水を必要とした。","us":"名詞は前に強勢(DEsert)を置くが、動詞「見捨てる」の意味では後ろに強勢(deSERT)を置き発音が変わる。","tip":"「デザート(dessert)」とスペルが似ているので、sの数(desert=s1つ、dessert=s2つ)で区別すると混同を防げる。"},{"w":"desire","pos":"名","m":"欲求","nu":"何かを強く欲しいと思う気持ちや願望を表す語だ。","ph":"a strong desire","phm":"強い願望","ex":"She had a strong desire to study abroad someday.","exm":"彼女はいつか留学したいという強い願望を持っていた。","us":"desire for ~「~への欲求」、desire to do「~したいという願望」の形で使われる。wantより硬く強い響きを持つ。","tip":"wantが日常的な「欲しい」、desireはより強く格式ばった「切望」だと考えると使い分けやすい。"},{"w":"diet","pos":"名","m":"食事；ダイエット","nu":"日常的に食べる食事の内容や、健康・減量のための食事制限を表す語だ。","ph":"a healthy diet","phm":"健康的な食事","ex":"Eating a balanced diet helps students concentrate during class.","exm":"バランスの取れた食事を摂ることは生徒が授業中に集中するのに役立つ。","us":"「日常の食事内容」という意味と「(減量のための)食事制限」という意味の両方があり、日本語の「ダイエット」より意味が広い。","tip":"「ダイエット=痩せること」と覚えがちだが、英語のdietはまず「日々の食事内容」を指す語だと意識すると誤解が減る。"},{"w":"document","pos":"名","m":"文書","nu":"情報や記録が書かれた公式な書類やファイルを表す語だ。","ph":"sign a document","phm":"文書に署名する","ex":"Please bring an important document for the school application.","exm":"学校の申し込みのために重要な書類を持ってきてください。","us":"動詞として「(出来事など)を記録する、文書化する」の意味でも使われる。","tip":"「証拠として残す書類」というイメージを持つと、動詞用法の「記録する」にもつながりやすい。"},{"w":"drought","pos":"名","m":"干ばつ","nu":"長期間雨が降らず、水不足が深刻になる状態を表す語だ。","ph":"a severe drought","phm":"深刻な干ばつ","ex":"A long drought damaged crops across the entire region.","exm":"長い干ばつが地域全体の作物に被害を与えた。","us":"発音注意（droutと発音し、ghは発音しない）。ニュースや環境問題の文脈で頻出する語である。","tip":"floodが「洪水」で正反対の自然災害にあたるので、droughtとfloodをペアで覚えると効果的である。"},{"w":"edge","pos":"名","m":"端；刃","nu":"物の外側の端の部分や、刃物の鋭い切れる部分を表す語だ。","ph":"on the edge of","phm":"~の端に","ex":"A small cat sat quietly on the edge of the desk.","exm":"小さな猫が机の端に静かに座っていた。","us":"on the edge of ~「~の端に、~の瀬戸際に」という比喩表現でもよく使われる（on the edge of your seat「(手に汗握るほど)興奮して」など）。","tip":"刃物の「切れ味」の意味でsharp edgeのように使うこともあり、「際どい境界線」というイメージで覚えると広がりやすい。"},{"w":"enemy","pos":"名","m":"敵；敵国","nu":"争う相手を指し、対立する個人・集団・国家など幅広く使う語。","ph":"make an enemy of","phm":"～を敵に回す","ex":"He does not want to make an enemy of his classmates.","exm":"彼はクラスメートを敵に回したくないと思っている。","us":"「敵」は可算名詞で、the enemy で軍隊全体を集合的に指すこともある。","tip":"friend の反対語として覚えると分かりやすい。"},{"w":"engine","pos":"名","m":"エンジン；機関","nu":"機械を動かす動力源そのものを指し、比喩的に原動力の意味でも使う。","ph":"start the engine","phm":"エンジンをかける","ex":"The mechanic checked the engine before the long road trip.","exm":"整備士は長距離ドライブの前にエンジンを点検した。","us":"車・飛行機・船など乗り物の動力装置を指すのが基本で、可算名詞として使う。","tip":"search engine（検索エンジン）のように比喩的にも使われる点も覚えておく。"},{"w":"error","pos":"名","m":"誤り；エラー；間違い","nu":"判断や計算などでの客観的な間違いを指し、mistake よりやや堅い語。","ph":"make an error","phm":"誤りを犯す","ex":"She found a small error in her math homework last night.","exm":"彼女は昨晩、数学の宿題に小さな誤りを見つけた。","us":"可算名詞で、an error in ~ の形で使うことが多い。","tip":"mistake とほぼ同義だが、error はシステムや計算の誤りなどやや客観的な文脈で好まれる。"},{"w":"fate","pos":"名","m":"運命；宿命","nu":"個人の意思では変えられない、あらかじめ決まった運命的な結末を表す。","ph":"decide one's fate","phm":"運命を決める","ex":"A single decision can decide the fate of a team.","exm":"たった一つの決断がチームの運命を決めることがある。","us":"不可算名詞として使うことが多く、fate of ~ の形で頻出する。","tip":"destiny とほぼ同義だが、fate はやや悲劇的・不可避なニュアンスを持つ。"},{"w":"fault","pos":"名","m":"過失；欠点；責任","nu":"失敗や不具合の原因となった責任の所在を指す語で、自分のミスを認める場面で使う。","ph":"it's my fault","phm":"それは私のせいだ","ex":"It was his fault that the team lost the match.","exm":"チームが試合に負けたのは彼のせいだった。","us":"it is one's fault that/to do の形で「〜のせいだ」と表す。可算・不可算どちらでも使われる。","tip":"地質学の「断層」の意味もあるが、日常会話では「過失・責任」の意味で覚えておく。"},{"w":"fiction","pos":"名","m":"フィクション；小説；作り話","nu":"実際にはない、想像で作られた物語や話を指し、事実(fact)と対比される。","ph":"work of fiction","phm":"創作作品","ex":"This novel is a work of fiction, not a true story.","exm":"この小説は創作であり、実話ではない。","us":"不可算名詞として文学のジャンルを指すことが多く、science fiction のように複合語でも使われる。","tip":"fact（事実）の対義語として覚えると区別しやすい。"},{"w":"flame","pos":"名","m":"炎；火炎","nu":"燃え上がる炎そのものを指し、fire よりも立ち上る火の形に焦点を当てる。","ph":"burst into flame","phm":"炎に包まれる","ex":"The candle's flame flickered gently in the quiet classroom.","exm":"ろうそくの炎は静かな教室の中で優しく揺れていた。","us":"可算名詞で、in flames（炎上して）のように複数形でも使われる。","tip":"fire は火全般、flame は具体的な一つ一つの炎の形を指すと覚える。"},{"w":"flood","pos":"名","m":"洪水；殺到","nu":"水が一気にあふれ出る現象を指し、比喩的に物事が大量に押し寄せる意味でも使う。","ph":"a flood of","phm":"大量の～","ex":"The heavy rain caused a flood near the school yesterday.","exm":"昨日、大雨が学校の近くで洪水を引き起こした。","us":"可算・不可算両方あるが、a flood of emails のように比喩表現でも頻出する。","tip":"flow（流れる）と語源が近く、水があふれる様子をイメージすると覚えやすい。"},{"w":"fuel","pos":"名","m":"燃料；活力源","nu":"機械や体を動かすためのエネルギー源を指し、比喩的にやる気の源にも使う。","ph":"run out of fuel","phm":"燃料切れになる","ex":"The bus stopped because it ran out of fuel suddenly.","exm":"バスは急に燃料切れになったので止まった。","us":"不可算名詞として使うのが基本で、動詞としても「燃料を供給する」の意味で使われる。","tip":"gas や oil などの具体的な燃料をまとめて指す上位語だと覚える。"},{"w":"gap","pos":"名","m":"隔たり；すき間；格差","nu":"二つのものの間にある空間や違いを指し、物理的・抽象的どちらにも使う。","ph":"fill the gap","phm":"隙間を埋める","ex":"There is a big gap between the two buildings downtown.","exm":"繁華街の二つの建物の間には大きな隙間がある。","us":"可算名詞で、generation gap（世代間の隔たり）のように抽象的な差にもよく使われる。","tip":"gap year（進学前の空白期間）という表現も合わせて覚えておくと便利。"},{"w":"gesture","pos":"名","m":"身振り；ジェスチャー；意思表示","nu":"言葉を使わず手や体の動きで気持ちを伝える行為を指す。","ph":"make a gesture","phm":"身振りをする","ex":"She made a friendly gesture to welcome the new student.","exm":"彼女は新しい生徒を歓迎するために親しみのある身振りをした。","us":"可算名詞で、a gesture of kindness のように「〜の表れ」という比喩的用法もある。","tip":"手話や合図など体を使ったコミュニケーション全般を指すと覚える。"},{"w":"grain","pos":"名","m":"穀物；粒","nu":"米や麦などの穀物、または砂や塩のような小さな粒を指す語。","ph":"a grain of rice","phm":"一粒の米","ex":"A single grain of rice fell onto the kitchen floor.","exm":"一粒の米が台所の床に落ちた。","us":"穀物全体を指すときは不可算、一粒を指すときは可算名詞として a grain of ~ で使う。","tip":"a grain of truth（一片の真実）のように比喩表現でもよく使われる。"},{"w":"gravity","pos":"名","m":"重力；重大さ","nu":"物体を地球に引き寄せる力を指し、比喩的に事態の深刻さを表すこともある。","ph":"the force of gravity","phm":"重力の力","ex":"Without gravity, everything on Earth would simply float away.","exm":"重力がなければ、地球上のすべてのものはただ浮かんでいってしまうだろう。","us":"不可算名詞で、科学の授業では the law of gravity（万有引力の法則）としてよく登場する。","tip":"「重い」を意味する grave/grav と語根が同じで、比喩的に「深刻さ」も表すと覚える。"},{"w":"harbor","pos":"名","m":"港；避難所","nu":"船が安全に停泊できる入り江状の港を指し、比喩的に安全な場所の意味もある。","ph":"a safe harbor","phm":"安全な港","ex":"The fishing boats returned to the harbor before the storm.","exm":"漁船は嵐が来る前に港へ戻った。","us":"可算名詞で、port とほぼ同義だが harbor は地形としての「入り江」を強調する。","tip":"イギリス英語では harbour と綴る点も合わせて覚えておく。"},{"w":"harvest","pos":"名","m":"収穫；収穫期","nu":"農作物を刈り取って集めること、またはその収穫量や時期を指す語。","ph":"a good harvest","phm":"豊作","ex":"Farmers celebrated a good harvest after the long summer.","exm":"農家の人々は長い夏の後、豊作を祝った。","us":"可算・不可算どちらでも使われ、動詞としても「収穫する」の意味で使われる。","tip":"autumn（秋）と結びつけて、実りの季節をイメージすると覚えやすい。"},{"w":"height","pos":"名","m":"高さ；身長；絶頂","nu":"地面や基準からの垂直方向の高さを指し、人の身長にも比喩的な絶頂にも使う。","ph":"at the height of","phm":"～の絶頂で","ex":"His height surprised everyone when he joined the basketball team.","exm":"彼がバスケ部に入ったとき、その身長は皆を驚かせた。","us":"不可算名詞で、形容詞形は high、動詞形は heighten と語形変化を区別して覚える必要がある。","tip":"at the height of one's career（キャリアの絶頂で）のような比喩表現も一緒に覚えておく。"},{"w":"horizon","pos":"名","m":"水平線；地平線；視野","nu":"空と地面・海が接して見える境界線を指し、比喩的に将来の展望も表す。","ph":"on the horizon","phm":"水平線上に；間近に迫って","ex":"The sun slowly rose above the horizon during our trip.","exm":"私たちの旅行中、太陽はゆっくりと水平線から昇った。","us":"可算名詞だが通常は the horizon と定冠詞をつけて使う。","tip":"broaden one's horizons（視野を広げる）という比喩表現も一緒に覚えておく。"},{"w":"illness","pos":"名","m":"病気；疾患","nu":"体調が悪い状態や病気そのものを指す一般的な語で、disease よりも幅広く使われる。","ph":"suffer from an illness","phm":"病気を患う","ex":"He missed school for a week due to illness.","exm":"彼は病気のため一週間学校を休んだ。","us":"不可算名詞として使うことが多いが、an illness のように可算で具体的な病名を指すこともある。","tip":"sick/ill の名詞形として覚え、disease（特定の病名）とは範囲の広さで区別する。"},{"w":"scene","pos":"名","m":"場面；光景；現場","nu":"劇や映画の一場面、または目の前に広がる光景や事件現場を指す語。","ph":"the scene of the crime","phm":"犯行現場","ex":"The final scene of the movie made everyone cry.","exm":"その映画の最後の場面はみんなを泣かせた。","us":"可算名詞で、scene of the crime（犯行現場）のように場所を指す用法も頻出する。","tip":"scenery（風景）と混同しやすいが、scene は「一場面」、scenery は「風景全体」を指す。"},{"w":"infant","pos":"名","m":"幼児；乳児","nu":"生まれたばかりの、または歩き始める前の非常に幼い子どもを指す語。","ph":"care for an infant","phm":"乳児の世話をする","ex":"The nurse gently held the infant in the hospital.","exm":"看護師は病院でその乳児をそっと抱いた。","us":"可算名詞で、baby よりもやや形式的・医学的な文脈で使われる。","tip":"形容詞としても使え、infant mortality（乳児死亡率）のように複合語でよく登場する。"},{"w":"insect","pos":"名","m":"昆虫；虫","nu":"体が3対の脚を持つ小さな虫を指す生物学的な分類語。","ph":"a harmful insect","phm":"害虫","ex":"My little brother caught an insect in the garden yesterday afternoon.","exm":"私の弟は昨日の午後、庭で虫を一匹捕まえた。","us":"可算名詞で、bug（虫の口語表現）よりも科学的・正式な語として使われる。","tip":"in（中に）+ sect（切る）が語源で、体が節に分かれている生き物を指すと覚える。"},{"w":"intelligence","pos":"名","m":"知能；知性；情報","nu":"物事を理解し考え判断する力を指し、情報や諜報の意味でも使われる。","ph":"artificial intelligence","phm":"人工知能","ex":"Her intelligence helped her solve the difficult puzzle quickly.","exm":"彼女の知性は難しいパズルを素早く解くのに役立った。","us":"不可算名詞で、artificial intelligence（AI）のように複合語で頻出する。","tip":"intelligent（形容詞）とセットで覚え、「賢さ」を表す抽象名詞だと理解する。"},{"w":"universe","pos":"名","m":"宇宙；世界","nu":"すべての天体や空間を含む全体としての宇宙を指す語。","ph":"the whole universe","phm":"宇宙全体","ex":"Scientists still do not fully understand the whole universe.","exm":"科学者たちは宇宙全体をまだ完全には理解していない。","us":"通常 the universe と定冠詞をつけて使う不可算名詞。","tip":"space（宇宙空間）よりも広い概念で、存在するすべてを含む点を意識すると区別しやすい。"},{"w":"lecture","pos":"名","m":"講義；説教","nu":"大学などで行われるまとまった内容の講義、または長い説教を指す語。","ph":"give a lecture","phm":"講義をする","ex":"The professor gave a long lecture about ancient Roman history.","exm":"教授は古代ローマ史について長い講義をした。","us":"可算名詞で、動詞としても「講義する、説教する」の意味で使われる。","tip":"「叱られる」という意味で get a lecture from ~ という口語表現も覚えておくと便利。"},{"w":"leisure","pos":"名","m":"余暇；自由な時間","nu":"仕事や勉強から解放された、自分の好きに使える自由な時間を指す。","ph":"leisure time","phm":"余暇の時間","ex":"Students need some leisure time to relax after exams.","exm":"生徒は試験の後、リラックスするための余暇の時間が必要だ。","us":"不可算名詞で、at leisure（ゆっくりと）という熟語表現もよく使われる。","tip":"pleasure（楽しみ）と綴りが似ているので、leisure＝「自由な時間」と区別して覚える。"},{"w":"liberty","pos":"名","m":"自由","nu":"束縛や支配から解放された、行動や思想の自由を指すやや堅い語。","ph":"take the liberty of","phm":"勝手ながら～する","ex":"Freedom of speech is a basic form of liberty in a democracy.","exm":"言論の自由は民主主義における基本的な自由の形だ。","us":"不可算名詞で、freedom とほぼ同義だが、liberty は政治的・法的な文脈でよく使われる。","tip":"「Statue of Liberty（自由の女神）」という固有名詞で覚えると印象に残りやすい。"},{"w":"liquid","pos":"名","m":"液体","nu":"一定の形を持たず容器の形に合わせて流れる物質の状態を指す語。","ph":"a clear liquid","phm":"透明な液体","ex":"The scientist poured a clear liquid into the glass tube.","exm":"科学者は透明な液体をガラス管に注いだ。","us":"可算・不可算どちらでも使われ、形容詞としても「液体の」という意味で使われる。","tip":"solid（固体）・gas（気体）と対比させて三つの状態としてセットで覚える。"},{"w":"lung","pos":"名","m":"肺","nu":"呼吸によって空気を出し入れする胸の中の臓器を指す語。","ph":"lung cancer","phm":"肺がん","ex":"The patient's left lung was severely damaged in the accident.","exm":"その患者の左肺は事故でひどく損傷していた。","us":"可算名詞で、通常人間には left lung と right lung の二つがある。","tip":"breathe（呼吸する）と関連付けて、肺は呼吸器系の中心的な臓器だと覚える。"},{"w":"luxury","pos":"名","m":"贅沢；高級品","nu":"必要以上に快適さや豪華さを与える、ぜいたくな物や状態を指す語。","ph":"a life of luxury","phm":"贅沢な暮らし","ex":"Owning a private pool is a luxury for most families.","exm":"プライベートプールを持つことはほとんどの家庭にとって贅沢だ。","us":"不可算名詞としても、a luxury のように可算名詞としても使われる。形容詞的に luxury car のように使うことも多い。","tip":"necessity（必需品）の反対の概念として覚えると分かりやすい。"},{"w":"miracle","pos":"名","m":"奇跡","nu":"通常の常識や科学では説明できない、驚くべき出来事を指す語。","ph":"a miracle happens","phm":"奇跡が起こる","ex":"It was a miracle that the team won the final game.","exm":"チームが決勝戦に勝ったのは奇跡だった。","us":"可算名詞で、it is a miracle that ~ の形でよく使われる。","tip":"miraculous（形容詞）とセットにして、「信じられないほどすごい」というイメージで覚える。"},{"w":"mission","pos":"名","m":"任務；使命","nu":"達成すべき特別な目的や任務を指し、組織的な活動にもよく使われる語。","ph":"a mission to","phm":"～するための任務","ex":"Their mission was to clean up the local river.","exm":"彼らの任務は地元の川を清掃することだった。","us":"可算名詞で、mission to do ~ の形で目的を表すことが多い。","tip":"「使命感」というイメージで、単なる仕事(job)よりも重要で特別な目的を持つ語だと覚える。"},{"w":"mood","pos":"名","m":"気分；雰囲気","nu":"その時々の感情の状態や、場の全体的な雰囲気を指す語。","ph":"be in a good mood","phm":"機嫌がいい","ex":"She was in a good mood after winning the tennis match.","exm":"彼女はテニスの試合に勝った後、機嫌がよかった。","us":"可算名詞で、in a bad/good mood の形で気分を表す表現が頻出する。","tip":"feeling（一時的な感情）よりもやや持続的な気分の状態を指すと覚える。"},{"w":"muscle","pos":"名","m":"筋肉","nu":"体を動かすために収縮する組織を指し、比喩的に力や影響力の意味でも使う。","ph":"build muscle","phm":"筋肉をつける","ex":"Regular exercise helps you build muscle and stay healthy.","exm":"定期的な運動は筋肉をつけ、健康を保つのに役立つ。","us":"不可算名詞として使うことが多いが、a muscle のように可算で特定の筋肉を指すこともある。","tip":"muscular（形容詞）とセットで覚え、スポーツや筋トレの話題でよく登場する語だと意識する。"},{"w":"mystery","pos":"名","m":"謎；神秘","nu":"説明のつかない不思議な出来事や、まだ解明されていない事柄を指す語。","ph":"solve a mystery","phm":"謎を解く","ex":"The detective finally managed to solve the strange mystery.","exm":"探偵はついにその奇妙な謎を解くことができた。","us":"可算名詞で、mystery novel（推理小説）のように複合語でもよく使われる。","tip":"mysterious（形容詞）と合わせて、「解明されていない」というコアイメージで覚える。"},{"w":"myth","pos":"名","m":"神話；俗説","nu":"古代から伝わる神々の物語、または広く信じられているが誤った考えを指す。","ph":"an ancient myth","phm":"古代の神話","ex":"Every culture has its own myth about the creation of the world.","exm":"どの文化にも世界の創造についての独自の神話がある。","us":"可算名詞で、比喩的に「誤った通説」を表すときにも頻繁に使われる。","tip":"legend（伝説、実在の可能性がある話）と区別し、myth は神々が登場する物語だと覚える。"},{"w":"oxygen","pos":"名","m":"酸素","nu":"人間や生物が呼吸するために不可欠な気体元素を指す科学用語。","ph":"lack of oxygen","phm":"酸素不足","ex":"Plants produce oxygen that humans and animals need to breathe.","exm":"植物は人間や動物が呼吸するために必要な酸素を作り出す。","us":"不可算名詞で、化学記号Oで表される元素として理科の授業でよく登場する。","tip":"接頭辞 oxy- は「酸」を意味し、酸素は多くの酸化反応に関わる気体だと覚える。"},{"w":"tragedy","pos":"名","m":"悲劇","nu":"人の死や大きな不幸を伴う、深刻で悲しい出来事や演劇の一種を指す。","ph":"a great tragedy","phm":"大きな悲劇","ex":"The sudden accident was a tragedy for the whole town.","exm":"その突然の事故は町全体にとって悲劇だった。","us":"可算名詞で、演劇のジャンルとしても、実際の悲惨な出来事としても使われる。","tip":"comedy（喜劇）の対義語として覚えると、演劇の文脈で区別しやすい。"},{"w":"passion","pos":"名","m":"情熱；熱意","nu":"何かに対する強く激しい感情や、夢中になるほどの熱意を指す語。","ph":"a passion for","phm":"～への情熱","ex":"His passion for music led him to join the school band.","exm":"音楽への情熱が彼を学校のバンドに入ることへと導いた。","us":"不可算名詞として使うことが多く、have a passion for ~ の形で頻出する。","tip":"passionate（形容詞）とセットにして、「夢中になるほど好き」というイメージで覚える。"},{"w":"penalty","pos":"名","m":"罰；罰則；ペナルティ","nu":"規則違反に対して科される罰や、その結果としての不利益を指す語。","ph":"pay a penalty","phm":"罰を受ける","ex":"The player received a penalty for arguing with the referee.","exm":"その選手は審判に抗議したことでペナルティを受けた。","us":"可算名詞で、スポーツの反則や法律上の罰則など幅広い文脈で使われる。","tip":"サッカーの penalty kick（ペナルティキック）のように、スポーツ用語としてもよく登場する。"},{"w":"phrase","pos":"名","m":"語句；フレーズ；言い回し","nu":"いくつかの単語がまとまってひとつの意味を作る、文より小さい単位を指す。","ph":"a common phrase","phm":"よくある言い回し","ex":"The teacher wrote a useful phrase on the whiteboard today.","exm":"先生は今日、役に立つフレーズをホワイトボードに書いた。","us":"可算名詞で、sentence（文）より小さい単位を指す点に注意する。","tip":"「句」という文法用語として英文法の授業でも頻出する語だと覚えておく。"},{"w":"pleasure","pos":"名","m":"喜び；楽しみ","nu":"心から満足感や喜びを感じることを表す語で、日常の小さな幸せにも使う。","ph":"with pleasure","phm":"喜んで","ex":"My grandmother takes great pleasure in gardening every weekend.","exm":"祖母は毎週末、庭仕事にとても喜びを感じている。","us":"不可算名詞として「喜び」の意味で使うことが多く、\"It's a pleasure to meet you\"のような決まり文句でも頻出。","tip":"pleaseと語源が同じで、動詞pleaseの名詞形と覚えると結びつけやすい。"},{"w":"poison","pos":"名","m":"毒","nu":"生物に害を与え死に至らせることもある物質を指し、比喩的に悪影響を及ぼすものにも使う。","ph":"poison ivy","phm":"ツタウルシ（かぶれを起こす植物）","ex":"The mystery novel began when someone put poison in his tea.","exm":"その推理小説は、誰かが彼の紅茶に毒を入れたことから始まった。","us":"名詞としては不可算で「毒」を表すが、動詞として「〜を毒する、汚染する」の意味でも使われる。","tip":"poisonous（有毒な）という形容詞とセットで覚えると語彙が広がる。"},{"w":"prison","pos":"名","m":"刑務所；牢獄","nu":"犯罪者を拘束し自由を奪う施設を指し、jailよりもやや硬い響きを持つ語。","ph":"go to prison","phm":"刑務所に入る","ex":"The corrupt politician was finally sent to prison last month.","exm":"その汚職政治家は先月ついに刑務所に送られた。","us":"\"in prison\"で「服役中で」の意味になり、この場合prisonは無冠詞で使われることが多い。","tip":"imprison（〜を投獄する）という動詞形と合わせて覚えると効果的。"},{"w":"profession","pos":"名","m":"職業","nu":"医師や弁護士など専門的な訓練を要する職業を指し、jobより格式が高い語。","ph":"by profession","phm":"職業は〜で","ex":"My uncle is a doctor by profession and loves helping patients.","exm":"私のおじは職業は医師で、患者を助けることが大好きだ。","us":"\"the medical profession\"のように特定の職業全体を指す集合的な用法もある。","tip":"professional（専門家、プロの）という頻出派生語とセットで覚える。"},{"w":"religion","pos":"名","m":"宗教","nu":"神や超自然的存在への信仰体系を指す語で、特定の宗教にも一般概念にも使う。","ph":"freedom of religion","phm":"信教の自由","ex":"Students discussed how religion shapes different cultures around the world.","exm":"生徒たちは宗教が世界のさまざまな文化をどう形作るかについて話し合った。","us":"不可算名詞として一般的な「宗教」を表す一方、個別の宗教を指すときは可算名詞にもなる。","tip":"religious（宗教的な）という形容詞形も頻出なので合わせて覚える。"},{"w":"rhythm","pos":"名","m":"リズム；律動","nu":"音楽や動作が繰り返す規則的なパターンを表し、体で感じる拍子のニュアンスを持つ。","ph":"keep the rhythm","phm":"リズムを保つ","ex":"The drummer kept a steady rhythm during the entire school concert.","exm":"そのドラマーは学校のコンサート中ずっと安定したリズムを刻み続けた。","us":"\"sense of rhythm\"（リズム感）のように抽象的な感覚を表す表現でよく登場する。","tip":"rhyme（韻）と綴りが似ているので混同しないよう注意して覚える。"},{"w":"route","pos":"名","m":"道筋；経路","nu":"出発地から目的地までの決まった道筋を表し、旅行や配送の文脈でよく使われる。","ph":"take a route","phm":"経路をとる","ex":"We chose a scenic route to the mountains instead of the highway.","exm":"私たちは高速道路の代わりに山までの景色の良い経路を選んだ。","us":"バスや飛行機の「路線」を表すときにも使われ、\"bus route\"のように名詞を修飾する用法も多い。","tip":"rootと発音が同じなのでスペルに注意し、「道の一本道」というイメージで覚える。"},{"w":"abundant","pos":"形","m":"豊富な","nu":"必要以上にたっぷりある様子を表し、資源や自然の恵みについて使われることが多い。","ph":"abundant resources","phm":"豊富な資源","ex":"The region has abundant rainfall, which supports rich farmland every year.","exm":"その地域は雨量が豊富で、毎年豊かな農地を支えている。","us":"名詞の前に置いて修飾する用法が中心で、\"be abundant in\"で「〜が豊富だ」と表す。","tip":"abundanceという名詞形と合わせて覚え、量があふれるほど多いイメージを持つ。"},{"w":"alert","pos":"形","m":"油断のない；警戒した","nu":"危険や変化にすぐ気づけるよう注意を集中させている状態を表す語。","ph":"stay alert","phm":"警戒を怠らない","ex":"Lifeguards must stay alert while watching swimmers at the crowded pool.","exm":"監視員は混雑したプールで泳ぐ人を見守る間、警戒を怠ってはならない。","us":"名詞・動詞としても使われ、動詞では「〜に警告する」の意味になる点に注意。","tip":"alarm（警報）と似た「はっと気づく」緊張感をイメージすると覚えやすい。"},{"w":"awful","pos":"形","m":"ひどい；恐ろしい","nu":"質や状態が非常に悪い、あるいは不快であることを強調する口語的な語。","ph":"an awful mistake","phm":"ひどい間違い","ex":"I made an awful mistake by forgetting my homework at home again.","exm":"また家に宿題を忘れてくるというひどい失敗をしてしまった。","us":"会話では「とても」を強めるawfully（副詞）も頻出し、\"awfully sorry\"のように使われる。","tip":"aweが語源だが、現在はほぼ「ひどい」という否定的な意味で使われる。"},{"w":"awkward","pos":"形","m":"気まずい；ぎこちない","nu":"動作や状況が不自然でぎこちなく、当人が居心地悪く感じる様子を表す。","ph":"an awkward silence","phm":"気まずい沈黙","ex":"There was an awkward silence after he forgot his classmate's name.","exm":"彼がクラスメートの名前を忘れた後、気まずい沈黙が流れた。","us":"人の動作にも状況にも使え、\"feel awkward\"で「気まずく感じる」という表現になる。","tip":"「不自然でぎこちない」という語感を持つ語だと意識して、状況全体のぎこちなさと結びつけて覚える。"},{"w":"bitter","pos":"形","m":"苦い；つらい","nu":"味の「苦さ」だけでなく、悔しさや恨みを伴う「つらい経験」にも使われる語。","ph":"bitter disappointment","phm":"深い失望","ex":"She felt bitter disappointment after losing the final tennis match.","exm":"彼女はテニスの決勝戦に負けて深い失望を感じた。","us":"味覚だけでなく感情面の「苦々しい」にも使われ、\"to the bitter end\"（最後まで）という表現も覚えておきたい。","tip":"sweet（甘い）の反対語として覚えると同時に、心の苦さという比喩用法も押さえる。"},{"w":"blind","pos":"形","m":"目の見えない","nu":"視覚を失っている状態を表し、比喩的に「気づかない、盲目的な」の意味でも使う。","ph":"turn a blind eye","phm":"見て見ぬふりをする","ex":"The teacher decided not to turn a blind eye to bullying.","exm":"その教師はいじめを見て見ぬふりをしないことに決めた。","us":"\"the blind\"のようにthe+形容詞で「目の見えない人々」という集合的な意味を表せる。","tip":"視界がふさがれているイメージを持ち、比喩表現turn a blind eyeとセットで覚える。"},{"w":"bold","pos":"形","m":"大胆な","nu":"危険や批判を恐れず、自信を持って行動する様子を表す語。","ph":"a bold decision","phm":"大胆な決断","ex":"Making a bold decision, she quit the team to start her own club.","exm":"大胆な決断をして、彼女はチームを辞め自分のクラブを始めた。","us":"人の性格だけでなくデザインや文字の「太字」を表すときにも使われる（boldface）。","tip":"braveと似るが、boldは思い切った、際立った行動そのものを強調するニュアンスがある。"},{"w":"brave","pos":"形","m":"勇敢な","nu":"恐怖を感じながらも困難に立ち向かう強い心を表す語。","ph":"brave enough to","phm":"〜するほど勇敢な","ex":"He was brave enough to admit his mistake in front of everyone.","exm":"彼はみんなの前で自分の間違いを認めるほど勇敢だった。","us":"\"brave enough to do\"で「〜する勇気がある」という頻出表現になる。","tip":"boldが大胆さを強調するのに対し、braveは恐怖に打ち勝つ勇気を強調する違いを意識する。"},{"w":"brilliant","pos":"形","m":"優秀な；輝かしい","nu":"知性や才能が際立って優れていることや、光が強く輝く様子を表す語。","ph":"a brilliant idea","phm":"素晴らしい発想","ex":"Our club president came up with a brilliant idea for the festival.","exm":"部長は文化祭のための素晴らしい発想を思いついた。","us":"イギリス英語の会話では「素晴らしい、最高だ」という感嘆の返答としても頻繁に使われる。","tip":"頭脳の輝き＝優秀さと光の輝きの両方に使われる語だと覚える。"},{"w":"broad","pos":"形","m":"幅広い","nu":"物理的な幅だけでなく、範囲や視野の広さを表すのにも使われる語。","ph":"broad range","phm":"広範囲","ex":"The library offers a broad range of books on science and history.","exm":"その図書館は科学や歴史に関する幅広い本を取り揃えている。","us":"wideとほぼ同義だが、broadは知識・視野・肩幅など比喩的な「広さ」にも使われやすい。","tip":"\"broad daylight（真昼間）\"のような決まり文句もあるので例文とあわせて覚える。"},{"w":"capable","pos":"形","m":"能力がある","nu":"特定のことを行うのに十分な能力や技術を持っていることを表す語。","ph":"capable of doing","phm":"〜する能力がある","ex":"Everyone believes she is capable of winning the national speech contest.","exm":"彼女は全国スピーチコンテストで優勝できる能力があるとみんな信じている。","us":"\"capable of + 動名詞\"の形で使うのが基本で、canのような助動詞とは文法的な扱いが異なる。","tip":"ableと似た意味だが、capableは潜在的な能力・可能性を強調するニュアンスが強い。"},{"w":"casual","pos":"形","m":"気軽な；普段着の","nu":"形式ばらず、リラックスした態度や服装を表す語で、堅苦しさがない場面で使う。","ph":"casual clothes","phm":"普段着","ex":"Students can wear casual clothes to school on the last Friday.","exm":"生徒たちは最後の金曜日には普段着で登校してよい。","us":"服装だけでなく話し方や態度が「くだけた」ことを表すときにも使われる。","tip":"formal（正式な）の反対語として対で覚えると効率がよい。"},{"w":"cheerful","pos":"形","m":"陽気な；明るい","nu":"気持ちが明るく前向きで、周りにも良い雰囲気を与える様子を表す語。","ph":"a cheerful smile","phm":"明るい笑顔","ex":"Our new teacher always greets us with a cheerful smile every morning.","exm":"新しい先生は毎朝いつも明るい笑顔で私たちに挨拶してくれる。","us":"人だけでなく色や部屋の雰囲気など「明るく元気な」印象を表すのにも使われる。","tip":"cheer（応援・励まし）に-fulがついた形で、元気づけられる明るさをイメージして覚える。"},{"w":"clever","pos":"形","m":"賢い；巧妙な","nu":"頭の回転が速く、工夫して問題を解決する能力を表す語。","ph":"a clever idea","phm":"巧妙なアイデア","ex":"The engineer designed a clever way to save electricity at school.","exm":"その技術者は学校で電気を節約する巧妙な方法を考案した。","us":"smartとほぼ同義だが、cleverは工夫や機転の利いた賢さを強調することが多い。","tip":"時に「悪賢い」という否定的なニュアンスで使われることもある点に注意する。"},{"w":"cruel","pos":"形","m":"残酷な","nu":"他者に対して思いやりがなく、苦痛を平気で与える様子を表す語。","ph":"cruel treatment","phm":"残酷な扱い","ex":"It is cruel to leave a dog alone outside all winter.","exm":"冬中ずっと犬を外に一人にしておくのは残酷だ。","us":"\"It is cruel of 人 to do\"や\"be cruel to 人/動物\"の形でよく使われる。","tip":"cruelty（残酷さ）という名詞形とセットで覚え、kindの対義語として位置づける。"},{"w":"dull","pos":"形","m":"退屈な；鈍い","nu":"刺激や面白みがなく単調な様子、または刃物や痛みが鋭くない様子を表す語。","ph":"a dull lecture","phm":"退屈な講義","ex":"Half the class fell asleep during the dull history lecture yesterday.","exm":"昨日の退屈な歴史の講義中、クラスの半分が眠ってしまった。","us":"天気の「どんよりした」様子や刃物の「切れ味の悪い」様子を表すときにも使われる。","tip":"boringと似ているが、dullは輝きや鋭さが失われたというイメージが根底にある。"},{"w":"evil","pos":"形","m":"邪悪な","nu":"道徳的に非常に悪く、他者に深刻な害を与える性質を表す強い語。","ph":"an evil plan","phm":"邪悪な計画","ex":"The villain in the movie had an evil plan to destroy the city.","exm":"その映画の悪役は街を破壊する邪悪な計画を持っていた。","us":"badよりもはるかに強い道徳的な悪を表し、名詞としても「悪、邪悪」の意味で使われる。","tip":"goodの対極にある概念として、宗教的・道徳的な文脈で使われることが多いと覚える。"},{"w":"false","pos":"形","m":"誤った；偽の","nu":"事実に反していることや、本物ではなく作られたものであることを表す語。","ph":"a false alarm","phm":"誤報；空騒ぎ","ex":"The fire alarm turned out to be a false alarm during class.","exm":"授業中の火災報知器は結局誤報だとわかった。","us":"trueの対義語で、\"false teeth\"のように「人工の、偽の」という意味でも使われる。","tip":"falsehood（虚偽）と合わせて覚え、事実と異なる点を強調すると覚えやすい。"},{"w":"fierce","pos":"形","m":"猛烈な；獰猛な","nu":"動物や競争、感情などが非常に激しく、勢いが強いことを表す語。","ph":"fierce competition","phm":"激しい競争","ex":"There was fierce competition among students for the top exam score.","exm":"生徒たちの間でトップの試験点数をめぐる激しい競争があった。","us":"動物の獰猛さだけでなく、風雨や議論の「激しさ」を表すときにも幅広く使われる。","tip":"fireと綴りが似て、燃えるような激しさをイメージすると覚えやすい。"},{"w":"formal","pos":"形","m":"正式な；形式的な","nu":"決まった作法や規則に従っていることを表し、服装や場面の堅苦しさを示す語。","ph":"formal clothes","phm":"正装","ex":"Students wore formal clothes to the graduation ceremony last spring.","exm":"生徒たちはこの前の春の卒業式に正装で臨んだ。","us":"casualの対義語で、\"a formal apology\"のように正式な手続きや言葉遣いを表すのにも使う。","tip":"form（形式）に由来し、決まった形に従っているというイメージで覚える。"},{"w":"generous","pos":"形","m":"気前のよい","nu":"お金や時間、親切さを惜しみなく他人に与える性質を表す語。","ph":"generous with","phm":"〜を惜しみなく与える","ex":"Our coach is always generous with his time after practice.","exm":"私たちのコーチは練習後いつも自分の時間を惜しみなく使ってくれる。","us":"\"generous with money/time\"のように前置詞withを伴って何を惜しみなく与えるか示す。","tip":"generosity（寛大さ）という名詞形と合わせ、豊かな心から与えるイメージを持つ。"},{"w":"gentle","pos":"形","m":"優しい；穏やかな","nu":"力を加えず穏やかで優しい態度や動作を表す語で、荒々しさの対極にある。","ph":"a gentle reminder","phm":"優しい注意","ex":"The nurse gave the child a gentle reminder to drink water.","exm":"看護師はその子供に水を飲むよう優しく注意した。","us":"人の性格だけでなく、風や坂道など自然の「穏やかさ」を表すときにも使われる。","tip":"kindが心の優しさを表すのに対し、gentleは態度や力加減の柔らかさを強調する違いを意識する。"},{"w":"grateful","pos":"形","m":"感謝している","nu":"受けた親切や助けに対して心から感謝の気持ちを抱いている状態を表す語。","ph":"grateful for","phm":"〜に感謝している","ex":"I am truly grateful for my friends' support during the exam.","exm":"試験の間、友人たちの支えに心から感謝している。","us":"\"grateful to 人 for 物事\"の形で誰に何を感謝するかを表すのが基本パターン。","tip":"gratitude（感謝）という名詞形と合わせて覚え、thankfulとほぼ同義だと理解しておく。"},{"w":"guilty","pos":"形","m":"有罪の；罪悪感のある","nu":"法的に罪を犯したことだけでなく、心の中で悪いことをしたと感じる気持ちも表す語。","ph":"feel guilty","phm":"罪悪感を覚える","ex":"He felt guilty about forgetting his sister's birthday last week.","exm":"彼は先週妹の誕生日を忘れたことに罪悪感を覚えた。","us":"\"guilty of\"で「〜の罪を犯した」、\"guilty about\"で「〜について罪悪感がある」と使い分ける。","tip":"innocent（無罪の）の反対語として法律用語と日常表現の両方で覚えておく。"},{"w":"harsh","pos":"形","m":"厳しい；過酷な","nu":"気候や態度、罰などが非常に厳しく、耐えるのが辛い様子を表す語。","ph":"harsh criticism","phm":"厳しい批判","ex":"The coach gave harsh criticism after the team lost the match.","exm":"チームが試合に負けた後、コーチは厳しい批判をした。","us":"気候の「厳しさ」、言葉の「きつさ」、罰の「過酷さ」など幅広い対象に使える形容詞。","tip":"strictが規則の厳格さを表すのに対し、harshは感情的な冷たさや辛さを含む点が異なる。"},{"w":"honest","pos":"形","m":"正直な","nu":"嘘をつかず、事実をありのままに伝える誠実な性質を表す語。","ph":"to be honest","phm":"正直に言うと","ex":"To be honest, I did not finish my homework last night.","exm":"正直に言うと、私は昨夜宿題を終わらせなかった。","us":"\"to be honest\"や\"honest with 人\"のように会話でよく使われる決まり文句がある。","tip":"honesty（正直さ）という名詞形と合わせ、hが発音されない点にも注意して覚える。"},{"w":"huge","pos":"形","m":"巨大な","nu":"大きさや規模が非常に大きいことを強調する口語的な語。","ph":"a huge difference","phm":"大きな違い","ex":"Practicing every day made a huge difference in her tennis skills.","exm":"毎日練習したことが彼女のテニスの技術に大きな違いをもたらした。","us":"bigよりも規模の大きさを強調したいときに使われ、感情や量の大きさにも使える。","tip":"enormousやgiantと似た意味を持つ語としてまとめて覚えると語彙が広がる。"},{"w":"ideal","pos":"形","m":"理想的な","nu":"目的や条件に対して完璧に近く、最も望ましい状態を表す語。","ph":"an ideal place","phm":"理想的な場所","ex":"The quiet library is an ideal place to study before exams.","exm":"静かな図書館は試験前に勉強するのに理想的な場所だ。","us":"名詞としても「理想」の意味で使われ、\"in an ideal world\"は「理想を言えば」という表現になる。","tip":"idea（考え）と語源が近く、頭の中で描く最良の姿というイメージを持つと覚えやすい。"},{"w":"keen","pos":"形","m":"熱心な；鋭い","nu":"物事に強い興味や意欲を持っていることや、感覚が鋭いことを表す語。","ph":"keen on","phm":"〜に熱心な","ex":"My brother is keen on learning how computers work.","exm":"私の兄はコンピューターの仕組みを学ぶことに熱心だ。","us":"イギリス英語で\"keen on doing\"の形が特によく使われ、interestedよりも意欲の強さを表す。","tip":"感覚の鋭さ（keen eyesight）と興味の強さの両方の意味があることをまとめて覚える。"},{"w":"loyal","pos":"形","m":"忠実な","nu":"人や組織、信念に対して裏切らず変わらぬ支持を示す態度を表す語。","ph":"loyal fans","phm":"忠実なファン","ex":"The small team still has many loyal fans after every defeat.","exm":"その弱小チームは負け続けても多くの忠実なファンを持っている。","us":"\"loyal to 人/組織\"の形で、誰・何に対して忠実かを前置詞toで示す。","tip":"loyalty（忠誠心）という名詞形と合わせ、friendshipやteamに関する話題でよく登場すると覚える。"},{"w":"mild","pos":"形","m":"穏やかな；軽い","nu":"気候・味・症状などが強すぎず穏やかである様子を表す語。","ph":"mild weather","phm":"穏やかな天気","ex":"We enjoyed a walk in the park thanks to the mild weather.","exm":"穏やかな天気のおかげで私たちは公園の散歩を楽しんだ。","us":"病気の症状にも使われ、\"a mild cold\"は「軽い風邪」という意味になる。","tip":"severe（厳しい、重い）の反対語として対で覚えておくと便利。"},{"w":"rapid","pos":"形","m":"急速な","nu":"変化やスピードが非常に速いことを客観的に表す語で、ニュースなどでよく使う。","ph":"rapid growth","phm":"急成長","ex":"The city experienced rapid growth after the new train station opened.","exm":"新しい駅が開業した後、その街は急速な成長を経験した。","us":"fastが会話的なのに対し、rapidは変化や進歩について書き言葉でも使われる客観的な語。","tip":"rapids（急流）という名詞形もあり、速く流れるイメージから覚えると良い。"},{"w":"rude","pos":"形","m":"失礼な","nu":"礼儀を欠き、他人を不快にさせる言動を表す語で、丁寧さとは正反対の態度を示す。","ph":"rude to","phm":"〜に対して失礼な","ex":"It is rude to interrupt someone while they are speaking.","exm":"人が話している時に割り込むのは失礼なことだ。","us":"\"rude to 人\"の形でよく使われ、politeの反対語として覚えておくとよい。","tip":"語源はラテン語で「未加工の」という意味があり、洗練されていない態度というイメージを持つ。"},{"w":"violent","pos":"形","m":"暴力的な；激しい","nu":"力ずくで人や物を傷つける激しさを表し、天候や感情にも使う。","ph":"a violent storm","phm":"激しい嵐","ex":"The news reported that a violent storm had hit the coastal town.","exm":"そのニュースは激しい嵐が沿岸の町を襲ったと報じた。","us":"名詞形はviolence。人の行動だけでなく天気や衝突の激しさにも用いる。","tip":"violate（違反する）と語源が近く、力で規範や体を侵す激しさをイメージすると覚えやすい。"},{"w":"perhaps","pos":"副","m":"もしかすると；たぶん","nu":"maybeよりやや控えめで丁寧な響きを持ち、断定を避ける場面で使う。","ph":"perhaps the best way","phm":"おそらく最良の方法","ex":"I think perhaps we should ask the teacher before the exam.","exm":"試験の前に、もしかすると先生に聞いた方がいいと私は思う。","us":"文中に挿入して確信度を下げる働きを持つ副詞で、maybeよりやや硬い書き言葉に多い。","tip":"per（〜によって）とhaps（偶然、chanceの意）が由来で、「偶然次第では」から「もしかすると」の意味になった。"},{"w":"indeed","pos":"副","m":"実に；本当に","nu":"前の内容を強調して「まさにその通り」と念押しする働きを持つ。","ph":"very hot indeed","phm":"実にとても暑い","ex":"The test was indeed harder than most students had expected.","exm":"そのテストは実に、ほとんどの生徒が予想していたより難しかった。","us":"very+形容詞の後に置いて強調したり、Yes, indeed.のように同意を強める返答にも使う。","tip":"in＋deedで「実際の行為において」が語源で、「実際のところ」という強調表現だと覚える。"},{"w":"nearly","pos":"副","m":"ほとんど；もう少しで","nu":"ある基準にあと少しで到達する近さを表し、almostとほぼ同じ意味で使う。","ph":"nearly missed the bus","phm":"もう少しでバスに乗り遅れる","ex":"She nearly missed the bus because she overslept this morning.","exm":"彼女は今朝寝坊してもう少しでバスに乗り遅れるところだった。","us":"almostとほぼ同義で動詞や形容詞の前に置く。near（近い）と混同しないよう副詞であることに注意する。","tip":"near（近い）に-lyが付いた形で、「近いところまで」というイメージから「ほとんど」の意味になる。"},{"w":"mostly","pos":"副","m":"主に；たいてい","nu":"全体の大部分がある状態であることを示し、mainlyに近い意味を持つ。","ph":"mostly sunny weather","phm":"主に晴れの天気","ex":"Our club members are mostly first-year students who joined recently.","exm":"私たちの部の部員は主に最近入部した1年生だ。","us":"文の中でbe動詞の後や名詞の前に置き、全体の大半を占める様子を表す。","tip":"most（最も多くの）に-lyが付いた形で、「大部分は」という意味になると覚える。"},{"w":"forever","pos":"副","m":"永遠に；ずっと","nu":"終わりなく続く時間の長さを強調し、日常会話でも大げさな強調にも使う。","ph":"last forever","phm":"永遠に続く","ex":"My best friend promised we would stay close forever after graduation.","exm":"親友は卒業後もずっと仲良くしようと約束してくれた。","us":"for＋everが語源で1語の副詞として使い、文末に置くことが多い。","tip":"forever young（永遠に若く）のような表現で覚えると印象に残りやすい。"},{"w":"elsewhere","pos":"副","m":"どこか他の場所で","nu":"今話題にしている場所とは別のどこかを漠然と指す語。","ph":"look elsewhere","phm":"他の場所を探す","ex":"The shop was closed, so we decided to eat elsewhere instead.","exm":"その店は閉まっていたので、私たちは他の場所で食べることにした。","us":"前置詞なしで単独で「他の場所へ／で」という意味の副詞として使う。","tip":"else（他の）+where（場所）で「他のどこかで」という成り立ちがそのまま意味になっている。"},{"w":"afterward","pos":"副","m":"その後；後で","nu":"ある出来事の後の時間の流れを示し、laterと似た意味で文章に使う。","ph":"shortly afterward","phm":"その少し後で","ex":"We watched the movie and went to a cafe together afterward.","exm":"私たちは映画を見て、その後一緒にカフェへ行った。","us":"文末に置いて出来事の順序を示すことが多く、イギリス英語ではafterwardsとsが付く形もよく使われる。","tip":"after（後に）+wardで「後の方向へ」という成り立ちから「その後」の意味だと覚える。"},{"w":"anyway","pos":"副","m":"とにかく；いずれにせよ","nu":"話題を切り替えたり、前の内容にかかわらず結論を述べたりする際に使う。","ph":"anyway, let's start","phm":"とにかく始めよう","ex":"It started raining, but we played soccer anyway after school today.","exm":"雨が降り出したが、私たちは今日放課後とにかくサッカーをした。","us":"文頭で話題転換に使うことも、文末で「ともかく〜した」と譲歩を表すこともある。","tip":"any（どんな）+wayで「どんな方法・状況でも」というイメージから「とにかく」の意味になる。"},{"w":"ahead","pos":"副","m":"前方に；先に","nu":"空間的にも時間的にも他より前・先に進んでいる状態を表す。","ph":"ahead of schedule","phm":"予定より早く","ex":"Our team finished the group project ahead of the deadline easily.","exm":"私たちのチームは締め切りより早く楽々とグループ課題を終えた。","us":"ahead ofの形で「〜より先に」と比較対象を示すことが多い。","tip":"a+head（頭の方へ）が成り立ちで、「頭が向いている方向＝前方」とイメージすると覚えやすい。"},{"w":"apart","pos":"副","m":"離れて；ばらばらに","nu":"物や人が距離的・状態的に分離していることを表す語。","ph":"fall apart","phm":"ばらばらに壊れる","ex":"The two friends live far apart but still video call each other daily.","exm":"その二人の友人は遠く離れて暮らしているが今も毎日ビデオ通話している。","us":"come apartで「壊れる」、tell twins apartで「双子を見分ける」のように使われる。","tip":"a+partで「一部分ずつに」という成り立ちから「離れて・別々に」の意味になったと覚える。"},{"w":"beneath","pos":"前","m":"〜の下に","nu":"underとほぼ同義だが、やや文語的で「覆われた下」のイメージを持つ。","ph":"beneath the surface","phm":"表面の下に","ex":"The old coin was hidden beneath a pile of dead leaves.","exm":"その古いコインは枯れ葉の山の下に隠されていた。","us":"underよりも書き言葉的で、「地位が下」という比喩的な意味でも使われる。","tip":"be+neath（下）が成り立ちで、underの文語的な言い換えだと覚えると整理しやすい。"},{"w":"whenever","pos":"接","m":"〜するときはいつでも","nu":"時を表すifのように、条件が満たされるたびに起こることを示す接続詞。","ph":"whenever you like","phm":"好きなときにいつでも","ex":"You can visit our club whenever you have some free time.","exm":"空いた時間があればいつでも私たちの部に来ていいよ。","us":"at any time whenの意味で、時を表す節を導く接続詞として使う。","tip":"when（いつ）+everで「いつであっても」という強調の成り立ちだと覚える。"},{"w":"whatever","pos":"代","m":"何でも；何であれ","nu":"anything thatに近く、選択肢を問わず全てを含む譲歩のニュアンスを持つ。","ph":"whatever you want","phm":"あなたが望むもの何でも","ex":"You can choose whatever you like for the school report.","exm":"学校のレポートは好きなものを何でも選んでよい。","us":"名詞の前に置いて「どんな〜でも」という形容詞的用法もよく使われる。","tip":"what（何）+everで「何であっても」という強調の成り立ちだと覚える。"},{"w":"tolerate","pos":"動","m":"我慢する；許容する","nu":"不快なことを怒らずに受け入れて耐える態度を表す語。","ph":"tolerate the noise","phm":"騒音を我慢する","ex":"I cannot tolerate loud music while I am trying to study.","exm":"勉強しようとしているときに大音量の音楽は我慢できない。","us":"他動詞で目的語を直接取り、cannot tolerateの形で強い不快感を表すことが多い。","tip":"名詞形tolerance（寛容・耐性）と合わせて覚えると語彙が広がる。"},{"w":"install","pos":"動","m":"設置する；導入する","nu":"機器やソフトを使える状態に取り付ける行為を表す語。","ph":"install a new app","phm":"新しいアプリをインストールする","ex":"My brother helped me install a new app on my phone.","exm":"兄が私のスマホに新しいアプリを入れるのを手伝ってくれた。","us":"install A on/in Bの形で、設置場所を前置詞で示すことが多い。","tip":"コンピューター用語としても定着しており、「アプリをインストールする」という日本語表現がそのまま覚え方になる。"},{"w":"equip","pos":"動","m":"装備させる；備え付ける","nu":"必要な道具や能力を人や場所に備えさせることを表す語。","ph":"equip students with skills","phm":"生徒に技能を身につけさせる","ex":"The school plans to equip every classroom with a new projector.","exm":"学校は全教室に新しいプロジェクターを備え付ける予定だ。","us":"equip A with Bの形で「AにBを備え付ける」という語法が最も重要。","tip":"名詞equipment（装備・設備）とセットで覚えると理解が深まる。"},{"w":"inhabit","pos":"動","m":"住む；生息する","nu":"liveよりも生物学的・生態的に「その場所に生息する」響きを持つ。","ph":"animals that inhabit rainforests","phm":"熱帯雨林に生息する動物","ex":"Many rare animals inhabit the deep rainforests of South America.","exm":"多くの希少な動物が南米の深い熱帯雨林に生息している。","us":"他動詞で前置詞を伴わずに場所を目的語に取り、live inと違いinを付けない点に注意する。","tip":"ラテン語のhabitare（住む）に由来し、名詞inhabitant（住民）とセットで覚えると効果的。"},{"w":"vanish","pos":"動","m":"消える；姿を消す","nu":"突然、跡形もなく見えなくなる様子を表し、disappearよりやや劇的な響きを持つ。","ph":"vanish into thin air","phm":"跡形もなく消える","ex":"The magician made the coin vanish right in front of us.","exm":"そのマジシャンは私たちの目の前でコインを消して見せた。","us":"自動詞で目的語を取らず、vanish from sightのように前置詞fromと共に使うことも多い。","tip":"vanish into thin airという決まり文句で「跡形もなく消える」様子を覚えると印象に残る。"},{"w":"grasp","pos":"動","m":"つかむ；理解する","nu":"手でしっかり握る意味と、物事の要点を頭でつかむ意味の両方を持つ。","ph":"grasp the meaning","phm":"意味を理解する","ex":"It took me a while to grasp the meaning of the poem.","exm":"その詩の意味を理解するのに私はしばらく時間がかかった。","us":"具体的に「手でつかむ」意味と抽象的に「理解する」意味の両方で他動詞として使う。","tip":"名詞graspも「理解・把握」の意味で使われ、have a good grasp ofの形も覚えておくと便利。"},{"w":"seize","pos":"動","m":"つかむ；奪う","nu":"機会や物を素早くしっかりとつかみ取る力強い動作を表す語。","ph":"seize the opportunity","phm":"機会をつかむ","ex":"You should seize this opportunity to study abroad next year.","exm":"来年留学するこの機会をつかむべきだ。","us":"seize the opportunity/chanceの形で頻出し、警察が物を「押収する」という意味でも使われる。","tip":"sei-のつづりに注意し、seize the day（今を生きよ）という有名な表現と結びつけて覚える。"},{"w":"trace","pos":"動","m":"たどる；突き止める","nu":"起源や経路を過去にさかのぼって追跡することを表す語。","ph":"trace back to","phm":"〜にさかのぼる","ex":"We tried to trace the history of our school back further.","exm":"私たちは学校の歴史をさらにさかのぼってたどろうとした。","us":"trace A back to Bの形で「Aの起源をBまでさかのぼる」という表現が頻出。","tip":"名詞traceは「跡・痕跡」の意味で、動詞は「跡をたどる」というイメージでつながる。"},{"w":"trigger","pos":"動","m":"引き起こす；誘発する","nu":"ある出来事や反応を突然引き起こすきっかけとなることを表す語。","ph":"trigger a reaction","phm":"反応を引き起こす","ex":"A small joke can sometimes trigger a big argument between friends.","exm":"ちょっとした冗談が友人間の大きな口論を引き起こすことがある。","us":"他動詞でtrigger a response/reaction/memoryなど、突発的な出来事を目的語に取ることが多い。","tip":"名詞では銃の「引き金」を意味し、そこから「きっかけを引く」という動詞の意味に発展したと覚える。"},{"w":"urge","pos":"動","m":"強く勧める；促す","nu":"相手に強くそうするよう働きかけ、行動を促す気持ちを表す語。","ph":"urge students to study","phm":"生徒に勉強するよう促す","ex":"Our teacher tried to urge us to review before the test.","exm":"先生は試験の前に復習するよう私たちに促そうとした。","us":"urge A to doの形で「Aに〜するよう強く勧める」という語法が基本。","tip":"名詞urgeは「衝動」の意味も持ち、feel an urge to doという表現もあわせて覚える。"},{"w":"comprehend","pos":"動","m":"理解する","nu":"understandよりやや硬い語で、複雑な内容を頭で正しく把握することを表す。","ph":"comprehend the instructions","phm":"指示を理解する","ex":"Some students found it hard to comprehend the difficult math problem.","exm":"一部の生徒はその難しい数学の問題を理解するのに苦労した。","us":"understandとほぼ同義だが読解問題の説明文などフォーマルな文脈でよく使われる。","tip":"名詞comprehension（理解力）は読解問題reading comprehensionでおなじみの語だと覚える。"},{"w":"portray","pos":"動","m":"描写する；演じる","nu":"絵や文章、演技によって人物や物事のイメージを描き出すことを表す語。","ph":"portray a character","phm":"ある人物を演じる","ex":"This movie tends to portray teenagers as careless and rebellious people.","exm":"この映画は十代の若者を無頓着で反抗的な人々として描く傾向がある。","us":"portray A as Bの形で「AをBとして描く」という語法がよく使われる。","tip":"名詞portrait（肖像画）と語源が同じで、「人物や物事を描き出す」イメージでつながる。"},{"w":"flee","pos":"動","m":"逃げる","nu":"危険や恐怖から急いでその場を離れることを表す語。escapeより緊迫した響きを持つ。","ph":"flee the scene","phm":"現場から逃げる","ex":"The frightened cat tried to flee the loud fireworks last night.","exm":"おびえた猫は昨夜、大きな花火の音から逃げようとした。","us":"活用はflee-fled-fledと不規則に変化する点に注意し、fromを伴わず目的語を直接取ることもできる。","tip":"fleeとflea（ノミ）はつづりが似ているが意味は全く違うので区別して覚える。"},{"w":"altitude","pos":"名","m":"高度；標高","nu":"海面からの高さを表す語で、飛行機や登山の文脈でよく使われる。","ph":"at high altitude","phm":"高い高度で","ex":"The plane began to climb to a higher altitude after takeoff.","exm":"飛行機は離陸後、より高い高度まで上昇し始めた。","us":"不可算名詞として使うことが多く、at an altitude of ~ metersのように具体的な高さを示す。","tip":"altiはラテン語で「高い」を意味し、altitudeもaltitude sicknessもaltiから「高さ」に関する語だと覚える。"},{"w":"appetite","pos":"名","m":"食欲；欲求","nu":"食べ物への欲求だけでなく、物事への強い興味・関心にも比喩的に使う。","ph":"lose one's appetite","phm":"食欲をなくす","ex":"I lost my appetite after studying too hard for the exam.","exm":"試験のために勉強しすぎて食欲をなくしてしまった。","us":"have an appetite for〜で「〜への欲求がある」という比喩的用法も頻出。","tip":"appetizer（前菜、食欲をそそる料理）と語源が同じで、食欲に関する語だと関連づけて覚える。"},{"w":"bacteria","pos":"名","m":"細菌","nu":"目に見えない微生物を指す学術的な語で、良い菌と悪い菌の両方に使われる。","ph":"harmful bacteria","phm":"有害な細菌","ex":"The science teacher showed us bacteria growing under a microscope today.","exm":"理科の先生は今日、顕微鏡の下で増殖する細菌を見せてくれた。","us":"bacteriaは複数形で、単数形はbacteriumだが日常会話ではほぼ常に複数形bacteriaが使われる。","tip":"単数形bacteriumと合わせて覚え、動詞の一致もare/wereなど複数扱いになる点に注意する。"},{"w":"committee","pos":"名","m":"委員会","nu":"ある特定の目的のために選ばれた少人数の集団を指す語だ。","ph":"join a committee","phm":"委員会に加わる","ex":"She was chosen to join the student council committee this year.","exm":"彼女は今年、生徒会委員会に加わることに選ばれた。","us":"集合名詞で、イギリス英語では複数扱い、アメリカ英語では単数扱いされることが多い。","tip":"つづりにmとtとeが二重になっている点（committee）を意識して繰り返し書いて覚える。"},{"w":"contrast","pos":"名","m":"対照；対比","nu":"二つの物事の違いを際立たせて比べることを表す語で、似た点に注目するcompareと区別する。","ph":"in contrast to","phm":"〜とは対照的に","ex":"In contrast to last summer, this summer has been extremely hot.","exm":"去年の夏とは対照的に、今年の夏は非常に暑い。","us":"in contrast to/withの形で頻出し、名詞だがcontrastは動詞としても使われる点に注意。","tip":"動詞としても使われ、A contrasts with Bで「AはBと対照的だ」という意味になる。"},{"w":"council","pos":"名","m":"議会；評議会","nu":"地域や学校などの意思決定を行う会議体そのもの、またはその会合を指す語。","ph":"student council","phm":"生徒会","ex":"Our student council decided to hold a charity event next month.","exm":"私たちの生徒会は来月チャリティーイベントを開くことに決めた。","us":"student councilで「生徒会」を意味し、助言を意味するcounsel（動詞:忠告する）とスペルを混同しないよう注意。","tip":"councilは「会議体」、counselは「助言」という意味の違いをセットで覚えると混同を防げる。"},{"w":"creature","pos":"名","m":"生き物；生物","nu":"人間を含む生きているものを幅広く指し、特に動物や空想上の生物にも使う。","ph":"a living creature","phm":"生きている生き物","ex":"The documentary showed a strange creature living deep in the ocean.","exm":"そのドキュメンタリーは海の深くに住む奇妙な生き物を映していた。","us":"動植物や人間、想像上の存在まで幅広く指す可算名詞で、fictional creatureのように使う。","tip":"create（創造する）と語源が同じで、「創造されたもの＝生き物」というイメージでつながる。"},{"w":"currency","pos":"名","m":"通貨","nu":"国や地域で使われるお金の種類を指す語で、為替の話題でよく登場する。","ph":"foreign currency","phm":"外国通貨","ex":"We exchanged our money for foreign currency before the trip abroad.","exm":"私たちは海外旅行の前にお金を外国通貨に両替した。","us":"不可算名詞として使うことが多いが、具体的な通貨の種類を言うときはcurrenciesと数えられる名詞としても使う。","tip":"current（流通している）と語源が同じで、「流通しているお金」というイメージで覚える。"},{"w":"curriculum","pos":"名","m":"教育課程；カリキュラム","nu":"学校が定める教科の構成や指導計画、学習内容全体を指す語だ。","ph":"school curriculum","phm":"学校の教育課程","ex":"Our school added a new coding class to the curriculum this year.","exm":"私たちの学校は今年、教育課程に新しいプログラミングの授業を加えた。","us":"複数形はcurriculaまたはcurriculumsの両方が使われ、school curriculumの形でよく登場する。","tip":"カタカナの「カリキュラム」がそのまま意味なので、発音のアクセント位置（curriculum）に注意して覚える。"},{"w":"departure","pos":"名","m":"出発","nu":"旅行や電車・飛行機などが出発する時点や行為を指す語。","ph":"departure time","phm":"出発時刻","ex":"Please check the departure time of your flight before leaving home.","exm":"家を出る前に飛行機の出発時刻を確認してください。","us":"動詞departの名詞形で、departure fromの形で「〜からの出発」「〜からの逸脱」を表すこともある。","tip":"depart（出発する）に-ureが付いた名詞形で、arrival（到着）が対義語だとセットで覚える。"},{"w":"duration","pos":"名","m":"継続期間","nu":"ある出来事や状態がどれくらいの時間続くかを表す語で、期間の長さに焦点を当てる。","ph":"for the duration of","phm":"〜の間ずっと","ex":"The duration of the school festival was extended by one day.","exm":"学園祭の期間は1日延長された。","us":"for the duration of〜で「〜の期間中ずっと」という意味の頻出表現になる。","tip":"durable（耐久性のある）と語源が同じで、「続く時間の長さ」というイメージで結びつけて覚える。"},{"w":"fatigue","pos":"名","m":"疲労","nu":"身体的・精神的な強い疲れを表す、tirednessよりやや医学的・フォーマルな語。","ph":"suffer from fatigue","phm":"疲労に悩まされる","ex":"Many students suffer from fatigue after a long week of exams.","exm":"多くの生徒は長い試験週間の後、疲労に悩まされる。","us":"不可算名詞として使い、suffer from fatigueやmental fatigueのように医学的・専門的な文脈で頻出する。","tip":"tired（疲れた）よりフォーマルな語で、fatigueは体力や気力を消耗しきった状態を指すと覚える。"},{"w":"frontier","pos":"名","m":"国境；最前線","nu":"国と国の境界だけでなく、新しい分野の限界・最先端を比喩的に指す語。","ph":"the frontier of science","phm":"科学の最前線","ex":"Scientists keep pushing the frontier of medical research every single year.","exm":"科学者たちは毎年、医学研究の最前線を押し広げ続けている。","us":"push the frontier ofの形で比喩的に「未知の領域を切り開く」という意味でよく使われる。","tip":"front（前面）と語源が近く、「最も前にある境界線」というイメージで覚える。"},{"w":"insurance","pos":"名","m":"保険","nu":"事故や病気などの将来のリスクに備えて、あらかじめお金を積み立てておく仕組みを指す。","ph":"health insurance","phm":"健康保険","ex":"My father pays for health insurance every month for our family.","exm":"父は毎月家族のために健康保険料を払っている。","us":"不可算名詞として扱うことが多く、「an insurance」のようには言わない。前置詞は「insurance against/for」の形でよく使われる。","tip":"「assure」と同語源で、「sure（確実）」を核に持つと考えると覚えやすい。"},{"w":"interval","pos":"名","m":"間隔；合間","nu":"時間や空間における一定の隔たりや切れ目を指し、休憩の意味でも使われる。","ph":"a short interval","phm":"短い間隔","ex":"We had a short interval between classes to grab a snack.","exm":"私たちは授業の合間に軽食を取る短い休み時間があった。","us":"可算名詞で、「at intervals（時々、一定間隔で）」という副詞句でよく使われる。イギリス英語では劇の幕間の意味でも使う。","tip":"「inter-（間に）＋vallum（壁）」というラテン語が由来とされ、物と物の間にある隔たりを表すと覚える。"},{"w":"laboratory","pos":"名","m":"実験室；研究室","nu":"科学的な実験や研究を行うための専用設備が整った部屋や施設を指す。","ph":"work in a laboratory","phm":"実験室で働く","ex":"Our chemistry teacher spends hours preparing experiments in the laboratory.","exm":"化学の先生は実験室で実験の準備に何時間も費やしている。","us":"会話では「lab」と略されることが多く、日常的にはlabの方が一般的だ。可算名詞。","tip":"「labor（労働、作業）」と語源が近く、手を動かして作業する場所というイメージを持つ。"},{"w":"minority","pos":"名","m":"少数派；少数民族","nu":"全体の中で数が少ない集団を指し、多数派との対比でよく使われる語だ。","ph":"a minority of students","phm":"生徒の少数","ex":"Only a minority of students chose to join the debate club.","exm":"討論部に入ることを選んだのは生徒のうち少数だけだった。","us":"「majority」との対比で覚えると使い方がわかりやすい。「a minority of ~」の形で「~の少数」を表す。","tip":"「minor（小さい、未成年の）」と同語源で、数が小さいグループというイメージを持つ。"},{"w":"moisture","pos":"名","m":"湿気；水分","nu":"空気や物の表面に含まれるわずかな水分を指し、湿り気のニュアンスを持つ。","ph":"absorb moisture","phm":"湿気を吸収する","ex":"This towel can absorb a lot of moisture after swimming practice.","exm":"このタオルは水泳部の練習の後にたくさんの水分を吸収できる。","us":"不可算名詞で、「moist（湿った）」の名詞形にあたる。「water」より控えめな湿り気を表す。","tip":"形容詞「moist」に名詞語尾「-ure」がついた形と考えると意味がつながりやすい。"},{"w":"motion","pos":"名","m":"動き；運動","nu":"物が動くこと自体や、その動作の様子を指す物理的・一般的な語だ。","ph":"in slow motion","phm":"スローモーションで","ex":"The coach replayed the jump in slow motion to check her form.","exm":"コーチはフォームを確認するためにジャンプをスローモーションで再生した。","us":"「movement」とほぼ同義だが、「in motion（動いている）」「set in motion（動き出させる）」など定型表現で使われることが多い。","tip":"「move（動く）」と同語源で、動作そのものを指す名詞だと覚える。"},{"w":"orbit","pos":"名","m":"軌道","nu":"惑星や人工衛星が中心の天体の周りを回る、決まった通り道を指す。","ph":"put into orbit","phm":"軌道に乗せる","ex":"Scientists worked for years to put the new satellite into orbit.","exm":"科学者たちは新しい衛星を軌道に乗せるために何年も取り組んだ。","us":"「in orbit（軌道上に）」「orbit around ~（~の周りを回る）」のように前置詞と共によく使う。動詞として「周回する」の意味でも使える。","tip":"円形の通り道というイメージから、目の周りの骨（眼窩）を意味する医学用語にもつながると覚える。"},{"w":"privilege","pos":"名","m":"特権","nu":"一部の人だけに与えられる特別な権利や恩恵を指し、当然の権利とは区別される。","ph":"have the privilege of","phm":"~する特権を持つ","ex":"Senior students have the privilege of leaving campus during lunch break.","exm":"上級生は昼休みに校外に出る特権を持っている。","us":"「have the privilege of doing」の形で「~する特権がある」を表す。動詞として「特別扱いする」の意味でも使われる。","tip":"「private（私的な）」と語源が近く、特定の人にだけ与えられる決まりという成り立ちを持つ。"},{"w":"protein","pos":"名","m":"タンパク質","nu":"筋肉や体を作る栄養素の一種で、肉・魚・卵などに多く含まれる。","ph":"high in protein","phm":"タンパク質が豊富な","ex":"Athletes need food that is high in protein to build muscle.","exm":"運動部の選手は筋肉をつけるためにタンパク質が豊富な食事が必要だ。","us":"通常不可算名詞として使うが、種類を表すときは複数形「proteins」も使われる。栄養学や生物の文脈で頻出。","tip":"ギリシャ語で「第一の」を意味する語が由来とされ、体にとって最も重要な栄養素という位置づけを持つ。"},{"w":"refugee","pos":"名","m":"難民","nu":"戦争や災害などから逃れ、安全な場所を求めて自国を離れた人を指す。","ph":"a refugee camp","phm":"難民キャンプ","ex":"The news report showed families living in a crowded refugee camp.","exm":"そのニュース報道は混雑した難民キャンプで暮らす家族を映していた。","us":"「refugee from ~（~からの難民）」の形で使う。可算名詞。","tip":"「refuge（避難、逃げ場）」に人を表す語尾「-ee」がついた形で、逃げてきた人という意味になると覚える。"},{"w":"satellite","pos":"名","m":"衛星","nu":"惑星の周りを回る天体や、通信・観測のために打ち上げられた人工の機器を指す。","ph":"a communication satellite","phm":"通信衛星","ex":"The teacher explained how a communication satellite sends signals to phones.","exm":"先生は通信衛星がどのように携帯電話に信号を送るかを説明した。","us":"「artificial satellite（人工衛星）」のように形容詞を伴って自然の天体と区別することが多い。可算名詞。","tip":"「従者、供の者」という意味も持ち、月が地球に付き従う姿からイメージすると覚えやすい。"},{"w":"scholar","pos":"名","m":"学者","nu":"ある分野を深く研究し、専門的な知識を持つ人を指す、やや硬い語だ。","ph":"a leading scholar","phm":"一流の学者","ex":"A leading scholar visited our school to give a special lecture.","exm":"一流の学者が特別講演をするために私たちの学校を訪れた。","us":"「scholarship（奨学金、学識）」と関連づけて覚えるとよい。可算名詞。","tip":"「school（学校）」と語源が近く、学問に励む人というイメージを持つと結びつけやすい。"},{"w":"shelter","pos":"名","m":"避難所；シェルター","nu":"悪天候や危険な状況から身を守るために避難する場所や建物を指す語だ。","ph":"take shelter from","phm":"~から避難する","ex":"We had to take shelter from the sudden storm during the trip.","exm":"旅行中、突然の嵐から避難しなければならなかった。","us":"「take shelter（避難する）」は動詞takeとセットの定型表現。動詞としても「~を保護する」の意味で使う。","tip":"「shield（盾）」と関連があるとされ、危険から身を守るというコアイメージを持つ。"},{"w":"specimen","pos":"名","m":"標本；見本","nu":"研究や観察のために集められた、ある種類を代表する一つの個体や試料を指す。","ph":"collect a specimen","phm":"標本を採集する","ex":"During biology class, we collected a specimen of pond water to study.","exm":"生物の授業で、調べるために池の水の標本を採集した。","us":"理科や医学の文脈で頻出。可算名詞で、「a specimen of ~」の形をよく取る。","tip":"ラテン語で「見る」を意味する語が由来とされ、観察のための見本というイメージを持つ。"},{"w":"treaty","pos":"名","m":"条約","nu":"国と国との間で結ばれる、公式な取り決めや合意文書を指す。","ph":"sign a treaty","phm":"条約に署名する","ex":"In history class, we learned why two countries decided to sign a treaty.","exm":"歴史の授業で、なぜ二つの国が条約に署名することにしたのかを学んだ。","us":"「sign/break a treaty」のように動詞と組み合わせて使うことが多い。可算名詞。","tip":"「treat（扱う、交渉する）」と語源が近く、話し合いの末に結ばれる約束だとイメージする。"},{"w":"vaccine","pos":"名","m":"ワクチン","nu":"病気を予防するために体に接種する薬剤で、免疫をつける目的で使われる。","ph":"get a vaccine","phm":"ワクチンを接種する","ex":"Every autumn, our school nurse reminds us to get a flu vaccine.","exm":"毎年秋、養護教諭は私たちにインフルエンザワクチンを接種するよう呼びかける。","us":"可算名詞。「vaccine against/for ~（~に対するワクチン）」や動詞「vaccinate（予防接種する）」とセットで覚える。","tip":"ラテン語で「牛」を意味する語に由来し、牛痘を利用した種痘の歴史から生まれた語とされる。"},{"w":"wage","pos":"名","m":"賃金","nu":"労働の対価として時間や日ごとに支払われるお金を指し、給料よりも現場的な響きを持つ。","ph":"raise the minimum wage","phm":"最低賃金を引き上げる","ex":"The government decided to raise the minimum wage for part-time workers.","exm":"政府はアルバイト労働者の最低賃金を引き上げることを決めた。","us":"「wages」と複数形で使われることも多く、時給や日給の意味で使うときは複数形が一般的だ。","tip":"「salary」は月給・年俸、「wage」は時給・日給というイメージで区別すると覚えやすい。"},{"w":"wealth","pos":"名","m":"富；財産","nu":"お金や資産だけでなく、豊かさや充実感全般を表す語として広く使われる。","ph":"a wealth of information","phm":"豊富な情報","ex":"The library offers a wealth of information for students writing reports.","exm":"図書館はレポートを書く生徒たちのために豊富な情報を提供している。","us":"不可算名詞。「a wealth of ~」は「たくさんの~」という比喩表現として頻出する。","tip":"形容詞「wealthy（裕福な）」とセットで覚え、お金に限らない豊かさを表すと理解する。"},{"w":"absolute","pos":"形","m":"絶対的な；完全な","nu":"他と比較したり条件をつけたりせず、100パーセントそうであることを強調する語だ。","ph":"absolute silence","phm":"完全な静寂","ex":"The library requires absolute silence during the final exam period.","exm":"図書館は期末試験の期間中、完全な静寂を求めている。","us":"「relative（相対的な）」と対で覚えると意味がはっきりする。副詞形「absolutely（絶対に）」も会話で頻出する。","tip":"「ab-（離れて）＋solutus（解き放たれた）」というラテン語が由来とされ、他条件から切り離された状態を表すと覚える。"},{"w":"academic","pos":"形","m":"学問の；学業の","nu":"学校の勉強や研究など、知的な学びに関することを表す語だ。","ph":"academic performance","phm":"学業成績","ex":"Her academic performance improved after she started studying with friends.","exm":"彼女は友達と一緒に勉強し始めてから学業成績が上がった。","us":"「academic year（学年度）」「academic subject（学問的科目）」のように名詞を修飾する形でよく使う。","tip":"古代ギリシャの学園「Academy」に由来し、そこで学ばれる学問的な内容を表すと覚える。"}],"p5":[{"w":"abolish","pos":"動","m":"廃止する","nu":"制度や規則を公式に無くすこと。個人の習慣をやめるceaseとは違う公的な廃止を表す。","ph":"abolish a rule","phm":"規則を廃止する","ex":"Our school decided to abolish the old dress code rule.","exm":"私たちの学校は古い服装規定を廃止することにした。","us":"他動詞で制度・規則などの名詞を目的語にとる。個人の習慣にはstopやgive upを使う。","tip":"ab-（離れて）＋olish（壊す）で「取り除いて壊す」がイメージ。名詞形はabolition。"},{"w":"absurd","pos":"形","m":"ばかげた；不合理な","nu":"常識で考えるとありえないほど滑稽で筋が通らないという強い驚きを含む語。","ph":"sound absurd","phm":"ばかげて聞こえる","ex":"It sounds absurd, but he studies English while running.","exm":"ばかげて聞こえるが、彼は走りながら英語を勉強する。","us":"It is absurd that/to doの形でよく使う。ridiculousと近いが、論理的な矛盾の滑稽さを強調する。","tip":"ラテン語surdus（耳が聞こえない）にab-がついた語とされ、「筋が通らない」の意味へ発展した。"},{"w":"accumulate","pos":"動","m":"蓄積する；たまる","nu":"少しずつ長い時間をかけて物や量が増えていく様子を表す語。","ph":"accumulate points","phm":"ポイントをためる","ex":"She managed to accumulate a lot of points this term.","exm":"彼女は今学期、多くのポイントをためることに成功した。","us":"他動詞・自動詞両方で使え、Dust accumulates on the shelf.のように自然にたまる意味でも使える。","tip":"ac-（〜へ）＋cumulus（積み重ね）が語源。積乱雲cumulus cloudと同じ語根を持つ。"},{"w":"acquisition","pos":"名","m":"獲得；習得","nu":"知識・技術・企業などを努力や取引を通じて自分のものにすることを指す硬い語。","ph":"language acquisition","phm":"言語習得","ex":"Many students find that language acquisition becomes harder with age.","exm":"多くの生徒は年齢が上がるにつれ言語習得がより難しくなると感じている。","us":"動詞acquireの名詞形。企業買収の意味でも使われ、mergers and acquisitionsは頻出表現。","tip":"acquire（得る）＋-tionで名詞化。gainより努力を伴う正式な獲得を意味する。"},{"w":"aesthetic","pos":"形","m":"美的な；美しさの","nu":"芸術・デザインなどの美しさや趣味に関する感覚を表す語。","ph":"aesthetic sense","phm":"美的感覚","ex":"The new uniform design shows a strong aesthetic sense.","exm":"新しい制服のデザインは強い美的感覚を示している。","us":"名詞としても「美的センス、様式」の意味で使われる。発音はイースセティックに近い。","tip":"ギリシャ語aisthesis（感覚）が語源。anesthetic（麻酔＝感覚を失わせる）と語根が同じ。"},{"w":"aggravate","pos":"動","m":"悪化させる；いらだたせる","nu":"すでに悪い状態や問題をさらにひどくすることを表す。人をいらだたせる意味もある。","ph":"aggravate the situation","phm":"状況を悪化させる","ex":"Skipping practice will only aggravate the team's current problem.","exm":"練習を休むことはチームの今の問題を悪化させるだけだ。","us":"worsenと似るが、すでに存在する悪い事態を対象にとる点に注意する。","tip":"ag-（〜へ）＋gravis（重い）が語源。「さらに重くする」がコアイメージ。"},{"w":"allocate","pos":"動","m":"割り当てる；配分する","nu":"限られた資源・時間・予算を目的に応じて計画的に配分することを表す。","ph":"allocate time","phm":"時間を割り当てる","ex":"We need to allocate more time for exam preparation this week.","exm":"今週は試験勉強にもっと時間を割り当てる必要がある。","us":"allocate A to Bの形で「AをBに割り当てる」を表す。assignより計画的な配分の響きが強い。","tip":"al-（〜へ）＋locate（場所を定める）から「決まった分け前を与える」の意味になった。"},{"w":"alter","pos":"動","m":"変える；変わる","nu":"全体ではなく一部分を変化させることを表す、changeよりやや硬い語。","ph":"alter plans","phm":"計画を変更する","ex":"The sudden rain forced us to alter our weekend plans.","exm":"突然の雨で私たちは週末の計画を変更せざるを得なかった。","us":"他動詞・自動詞両方で使える。服の寸法直しもalterと言う（alter a skirt）。","tip":"ラテン語alter（もう一方の）が語源。alternative（代わりの）と語根が同じ。"},{"w":"ambiguous","pos":"形","m":"あいまいな；複数の意味の","nu":"一つの言葉や状況が二通り以上に解釈できて分かりにくいことを表す語。","ph":"ambiguous answer","phm":"あいまいな答え","ex":"His ambiguous answer left the whole class confused about homework.","exm":"彼のあいまいな答えはクラス全体を宿題について困惑させた。","us":"vagueが単に「はっきりしない」のに対し、ambiguousは複数解釈が可能な点を強調する。","tip":"ambi-（両方に）＋agere（導く）が語源。名詞形はambiguity。"},{"w":"analogy","pos":"名","m":"類推；たとえ","nu":"あるものを別のよく似た身近なものにたとえて説明する考え方・比較を指す。","ph":"draw an analogy","phm":"類推する、たとえる","ex":"The teacher drew an analogy between the brain and a computer.","exm":"先生は脳とコンピューターの間で類推を示した。","us":"draw an analogy between A and Bの形が定番。形容詞はanalogous。","tip":"ana-（対応して）＋logos（比率）が語源。似た構造を持つものを並べて説明するイメージ。"},{"w":"anonymous","pos":"形","m":"匿名の","nu":"名前が明かされていない、誰が行ったか分からない状態を表す語。","ph":"remain anonymous","phm":"匿名のままでいる","ex":"The student who reported the bullying wished to remain anonymous.","exm":"いじめを報告した生徒は匿名のままでいることを望んだ。","us":"人だけでなく寄付や投稿にも使う（an anonymous donation）。副詞anonymouslyも頻出。","tip":"an-（無い）＋onyma（名前）が語源。synonym（同義語）と語根onymが共通。"},{"w":"apparatus","pos":"名","m":"装置；器具","nu":"ある目的のために組み立てられた機械や器具一式をまとめて指す語。","ph":"laboratory apparatus","phm":"実験装置","ex":"Please handle the laboratory apparatus carefully during the chemistry class.","exm":"化学の授業中は実験装置を注意深く扱ってください。","us":"不可算名詞として扱われることが多く、複数の器具全体を一つのまとまりとして表す。","tip":"ap-（〜へ）＋parare（準備する）が語源。「目的のために準備された一式」がコアイメージ。"},{"w":"arbitrary","pos":"形","m":"恣意的な；気まぐれな","nu":"明確な理由や基準がなく、個人の判断や気分だけで決められることを表す語。","ph":"arbitrary decision","phm":"恣意的な決定","ex":"Students complained that the seating change felt like an arbitrary decision.","exm":"生徒たちは席替えが恣意的な決定のように感じると不満を言った。","us":"「勝手気ままな」という否定的なニュアンスで使われることが多い。randomと違い判断者の主観を含意する。","tip":"ラテン語arbiter（審判）が語源。審判の一存で決まるイメージで覚える。"},{"w":"articulate","pos":"動","m":"明確に述べる","nu":"考えや気持ちを言葉ではっきりと分かりやすく表現することを表す語。","ph":"articulate an opinion","phm":"意見を明確に述べる","ex":"It took practice for her to articulate her opinion clearly in debate.","exm":"ディベートで意見を明確に述べられるようになるには練習が必要だった。","us":"他動詞。形容詞としても使われ、an articulate speakerで「話し方が明瞭な人」を意味する。","tip":"article（関節）と同語源で、考えを一つ一つ関節でつなぐように言葉にするイメージ。"},{"w":"asset","pos":"名","m":"資産；強み","nu":"価値があり役立つ人・物・能力を指し、企業の財産にも個人の長所にも使える語。","ph":"valuable asset","phm":"貴重な財産、強み","ex":"Her calm attitude is a valuable asset to the volleyball team.","exm":"彼女の冷静な態度はバレー部にとって貴重な強みだ。","us":"会計用語では複数形assetsで「資産」を表す。人の長所を指す比喩表現でもよく使われる。","tip":"ラテン語ad satis（十分な状態へ）が語源。「十分に価値のあるもの」というイメージ。"},{"w":"assumption","pos":"名","m":"仮定；思い込み","nu":"証拠がなくても正しいと当然のように考えていることを指す語。","ph":"make an assumption","phm":"仮定する、思い込む","ex":"Don't make an assumption about his grades without checking the report.","exm":"成績表を確認せずに彼の成績について思い込みをしないほうがいい。","us":"動詞assumeの名詞形。on the assumption that〜「〜という前提で」の形も頻出。","tip":"as-（〜へ）＋sumere（取る）が語源。「証拠なしに事実として取り込む」がコアイメージ。"},{"w":"authentic","pos":"形","m":"本物の；正真正銘の","nu":"偽物やコピーではなく、本物・オリジナルであることを強調する語。","ph":"authentic experience","phm":"本物の体験","ex":"The homestay gave us an authentic experience of Australian daily life.","exm":"ホームステイは私たちにオーストラリアの日常生活の本物の体験を与えてくれた。","us":"realよりも「本物であると証明できる」という信頼性の高さを強調するときに使う。","tip":"ギリシャ語authentikos（本人自身が行った、正真正銘の）が語源で、autos（自己）とhentes（成し遂げる者）から成る。「本人自らの手による本物」というイメージで覚えるとよい（authorとは語源が異なる）。"},{"w":"autonomy","pos":"名","m":"自治；自律性","nu":"他人に支配されず自分の意思で決定し行動できる状態を指す語。","ph":"student autonomy","phm":"生徒の自主性","ex":"The teacher gave students more autonomy in choosing their own projects.","exm":"先生は生徒たちに自分のプロジェクトを選ぶより多くの自主性を与えた。","us":"give A autonomyの形でよく使う。形容詞形はautonomous（自動運転のautonomous carにも使う）。","tip":"auto-（自分自身）＋nomos（法）が語源。「自分自身のルールに従う」がコアイメージ。"},{"w":"bias","pos":"名","m":"偏見；偏り","nu":"特定の人・考えに対して公平でない、偏った見方や好みを表す語。","ph":"have a bias","phm":"偏見を持つ","ex":"The survey questions seemed to have a bias toward one answer.","exm":"そのアンケートの質問は一つの答えに偏りがあるように見えた。","us":"bias toward/against〜の形をとる。動詞化も可能で、be biased towardで「〜に偏っている」を表す。","tip":"元は「斜め」を意味するフランス語biaisから。まっすぐでなく斜めに傾くイメージで覚える。"},{"w":"bureaucracy","pos":"名","m":"官僚制；お役所仕事","nu":"複雑な規則や手続きに縛られた行政組織、またその非効率さを指す語。","ph":"cut through bureaucracy","phm":"煩雑な手続きを省く","ex":"Getting the club approved involved a lot of school bureaucracy.","exm":"部活の承認を得るには多くの学校の官僚的手続きが関わった。","us":"不可算名詞。しばしば手続きの多さや非効率さへの不満を込めて使われる。","tip":"フランス語bureau（机、事務所）＋-cracy（支配）が語源。「机による支配」がコアイメージ。"},{"w":"catastrophe","pos":"名","m":"大惨事；大災害","nu":"予期しない出来事による極めて深刻で悲惨な結果を指す強い語。","ph":"environmental catastrophe","phm":"環境の大惨事","ex":"Scientists warned that ignoring the issue could cause an environmental catastrophe.","exm":"科学者たちはその問題を無視すると環境の大惨事を招くと警告した。","us":"disasterよりさらに深刻・破滅的な事態を表すことが多い。形容詞形catastrophicも頻出。","tip":"ギリシャ語kata-（下へ）＋strephein（ひっくり返す）が語源。すべてがひっくり返る様子。"},{"w":"cease","pos":"動","m":"やめる；終わる","nu":"続いていた行動や状態がきっぱりと終わる・終わらせることを表す硬い語。","ph":"cease to exist","phm":"存在しなくなる","ex":"The old school festival tradition may soon cease to exist.","exm":"その古い学園祭の伝統はまもなく存在しなくなるかもしれない。","us":"stopより書き言葉的でフォーマル。cease fire（停戦）のように名詞的にも使われる。","tip":"ラテン語cedere（退く、やめる）が語源。ceaselessは「絶え間ない」という反対の意味。"},{"w":"census","pos":"名","m":"国勢調査；人口調査","nu":"国や自治体が住民の人数・状況を定期的に公式に調べる調査を指す語。","ph":"national census","phm":"国勢調査","ex":"Our class studied how the national census counts every household.","exm":"私たちのクラスは国勢調査がどのように各世帯を数えるか学んだ。","us":"census dataやcensus resultsのように名詞を修飾する形でよく使われる。","tip":"ラテン語censere（評価する、数える）が語源。国民全体を数え上げるイメージ。"},{"w":"chronic","pos":"形","m":"慢性の；長引く","nu":"病気や問題が短期間で終わらず長期間続いている状態を表す語。","ph":"chronic shortage","phm":"慢性的な不足","ex":"The school library suffers from a chronic shortage of new books.","exm":"その学校の図書館は新しい本の慢性的な不足に悩んでいる。","us":"病気（chronic illness）だけでなく、問題や不足など抽象的な事柄にも広く使う。","tip":"ギリシャ語chronos（時間）が語源。chronology（年代記）と同じ語根で「長く続く」イメージ。"},{"w":"cite","pos":"動","m":"引用する；例を挙げる","nu":"意見の根拠として他の文章・データ・具体例を示すことを表す語。","ph":"cite an example","phm":"例を挙げる","ex":"The essay should cite an example to support each main point.","exm":"そのエッセイは各主要な論点を支える例を挙げるべきだ。","us":"他動詞。cite A as evidence「Aを証拠として引用する」の形も頻出。名詞形はcitation。","tip":"ラテン語citare（呼び出す）が語源。証拠として持ち出すイメージで覚える。"},{"w":"clarify","pos":"動","m":"明確にする","nu":"あいまいで分かりにくい点を、詳しく説明してはっきりさせることを表す語。","ph":"clarify a point","phm":"論点を明確にする","ex":"Could you clarify a point you made about the homework deadline?","exm":"宿題の締め切りについて言った点を明確にしていただけますか。","us":"他動詞。clarify that〜の形でも使われる。名詞形clarificationも合わせて覚えておくとよい。","tip":"clear（明確な）＋-ifyから成る語で、作りがそのまま意味になっている。"},{"w":"cognitive","pos":"形","m":"認知の；認識の","nu":"記憶・理解・思考など、脳を使った情報処理に関する働きを表す学術的な語。","ph":"cognitive ability","phm":"認知能力","ex":"Playing chess is said to improve cognitive ability in young students.","exm":"チェスをすることは若い生徒の認知能力を高めると言われている。","us":"心理学・脳科学の文脈で頻出。cognitive scienceのように名詞を修飾する形でよく使う。","tip":"ラテン語cognoscere（知る）が語源。recognize（認識する）と同じ語根cogn-を持つ。"},{"w":"coincide","pos":"動","m":"一致する；同時に起こる","nu":"二つ以上の出来事や意見が偶然同時に起きたり、ぴったり重なったりすることを表す語。","ph":"coincide with","phm":"〜と重なる、一致する","ex":"Our club trip happened to coincide with the school sports festival.","exm":"私たちの部活の旅行は偶然学校の体育祭と重なった。","us":"自動詞でcoincide with〜の形を必ずとる。名詞形coincidence（偶然の一致）もよく使われる。","tip":"co-（共に）＋incidere（起こる）が語源。作りがそのまま意味になる。"},{"w":"commodity","pos":"名","m":"商品；日用品","nu":"市場で売買される、特に原材料や日用品など標準化された物品を指す語。","ph":"basic commodity","phm":"生活必需品","ex":"Rice remains a basic commodity in many countries across Asia.","exm":"米はアジア各国で基本的な生活必需品であり続けている。","us":"goodsと似るが、石油や穀物のように取引される一次産品を指すことが多い。","tip":"ラテン語commodus（都合の良い）が語源。「便利で役立つ物」から商品の意味へ発展した。"},{"w":"compensate","pos":"動","m":"補償する；埋め合わせる","nu":"損害・不足・欠点を、お金や別の行動で埋め合わせることを表す語。","ph":"compensate for","phm":"〜を埋め合わせる","ex":"Extra practice can compensate for a lack of natural talent.","exm":"追加の練習は生まれつきの才能の不足を埋め合わせることができる。","us":"compensate for〜（埋め合わせる）とcompensate A for B（AにBの補償をする）を区別して覚える。","tip":"com-（共に）＋pensare（重さを量る）が語源。天秤で釣り合いを取るイメージ。"},{"w":"competent","pos":"形","m":"有能な；能力のある","nu":"ある仕事や役割を問題なくこなせる十分な能力があることを表す語。","ph":"competent leader","phm":"有能な指導者","ex":"Everyone agreed that the new club captain was a competent leader.","exm":"誰もが新しい部長は有能な指導者だと認めた。","us":"excellentほど優秀ではなく「必要な水準を満たしている」というニュアンスが基本。対義語はincompetent。","tip":"com-（共に）＋petere（求める）が語源。目標に見合う力を持つイメージで覚える。"},{"w":"compile","pos":"動","m":"編集する；まとめる","nu":"いろいろな場所から集めた情報や資料を一つにまとめ上げることを表す語。","ph":"compile a list","phm":"リストをまとめる","ex":"The committee will compile a list of recommended summer reading books.","exm":"委員会は夏休みの推薦図書のリストをまとめる予定だ。","us":"他動詞。プログラミングでソースコードを実行形式に変換する意味でも使われる。","tip":"com-（共に）＋pilare（積み重ねる）が語源。資料を一か所に積み重ねてまとめるイメージ。"},{"w":"component","pos":"名","m":"構成要素；部品","nu":"機械や組織など全体を形作っている一つ一つの部分や要素を指す語。","ph":"key component","phm":"主要な構成要素","ex":"Teamwork is a key component of success in club activities.","exm":"チームワークは部活動での成功の主要な構成要素だ。","us":"partよりも、全体を組み立てる仕組みの一部という機能的な意味合いが強い。","tip":"com-（共に）＋ponere（置く）が語源。「一緒に置かれて全体を作るもの」がコアイメージ。"},{"w":"comprehensive","pos":"形","m":"包括的な；総合的な","nu":"必要な範囲すべてを漏れなく含んでいる、詳しく網羅的であることを表す語。","ph":"comprehensive review","phm":"総合的な復習","ex":"The teacher gave a comprehensive review before the final exam.","exm":"先生は期末試験の前に総合的な復習をしてくれた。","us":"comprehensive＋名詞の形で、範囲や内容の網羅性を強調するときに使う。","tip":"com-（完全に）＋prehendere（つかむ）が語源。「すべてをつかみ取る」イメージ。"},{"w":"compromise","pos":"名","m":"妥協；歩み寄り","nu":"対立する両者がお互いに少しずつ譲り合って合意点を見つけることを指す語。","ph":"reach a compromise","phm":"妥協点に達する","ex":"After a long discussion, the two groups reached a fair compromise.","exm":"長い話し合いの後、二つのグループは公平な妥協点に達した。","us":"動詞としてもよく使われ、compromise on〜「〜について妥協する」の形も頻出。","tip":"com-（共に）＋promittere（約束する）が語源。互いに約束し合って歩み寄るイメージ。"},{"w":"conceive","pos":"動","m":"思いつく；想像する","nu":"新しい考え・計画・可能性を頭の中で作り出し理解することを表す語。","ph":"conceive an idea","phm":"アイデアを思いつく","ex":"It's hard to conceive an idea nobody in the club has tried.","exm":"部活の誰も試したことのないアイデアを思いつくのは難しい。","us":"conceive of〜（〜を思い描く）の形もよく使う。名詞形conception、形容詞形conceivableも重要。","tip":"con-（共に）＋capere（つかむ）が語源。頭の中でイメージをつかみ取るイメージ。"},{"w":"condemn","pos":"動","m":"非難する；断罪する","nu":"道徳的・社会的に間違っていると強く公に批判することを表す語。","ph":"condemn violence","phm":"暴力を非難する","ex":"The principal decided to condemn violence of any kind on campus.","exm":"校長はキャンパス内でのいかなる暴力も非難することを決めた。","us":"他動詞。criticizeより強い非難で、しばしば公的な立場から述べる場合に使う。","tip":"con-（強意）＋damnare（有罪とする）が語源。damn（罰する）と同語源で強い否定を表す。"},{"w":"confine","pos":"動","m":"限定する；閉じ込める","nu":"人や物・話題などを一定の範囲や場所から出さないように制限することを表す語。","ph":"confine oneself to","phm":"〜だけに限定する","ex":"Please confine your speech to the topic given for today.","exm":"今日与えられたテーマにスピーチを限定してください。","us":"しばしば受け身be confined to〜「〜に限定されている、閉じ込められている」の形で使われる。","tip":"con-（完全に）＋finis（境界）が語源。fine, finishと同語根で「境界内に留める」イメージ。"},{"w":"conform","pos":"動","m":"従う；合わせる","nu":"規則・基準・周囲の期待などに合わせて自分の行動を変えることを表す語。","ph":"conform to rules","phm":"規則に従う","ex":"New members are expected to conform to the club's rules.","exm":"新入部員はクラブの規則に従うことが期待されている。","us":"自動詞でconform to〜の形をとる。obeyより「型に合わせる」という同調のニュアンスが強い。","tip":"con-（共に）＋forma（形）が語源。「同じ形に合わせる」というイメージ。"},{"w":"confront","pos":"動","m":"直面する；立ち向かう","nu":"困難な問題や相手と正面から向き合い、避けずに対処することを表す語。","ph":"confront a problem","phm":"問題に立ち向かう","ex":"The team decided to confront the problem instead of ignoring it.","exm":"チームはその問題を無視するのではなく直面することを決めた。","us":"他動詞。confront A with B「AにBを突きつける」の形もある。faceより対立的な緊張感を含む。","tip":"con-（共に）＋frons（額、正面）が語源。額と額を突き合わせるように向き合うイメージ。"},{"w":"consecutive","pos":"形","m":"連続した","nu":"途切れずに続けて並ぶ様子を表し、日数や回数を数える場面でよく使う。","ph":"for five consecutive days","phm":"5日間連続で","ex":"She won the tournament for three consecutive years.","exm":"彼女は3年連続でその大会で優勝した。","us":"「for + 数詞 + consecutive + 名詞（複数形）」の形で使うことが多い。名詞の前に置く形容詞だ。","tip":"con-（共に）+ sequi（続く）が語源。successive とほぼ同じ意味で使われる。"},{"w":"consensus","pos":"名","m":"合意；総意","nu":"集団の中で意見が一致し、全員が納得している状態を指し合意を強調する語だ。","ph":"reach a consensus","phm":"合意に達する","ex":"The club members reached a consensus on the new rules.","exm":"部員たちは新しい規則について合意に達した。","us":"不可算名詞として使うことが多く、「consensus on/about ~」の形をとる。","tip":"con-（共に）+ sentire（感じる）が語源で、「共通の感覚」がもとの意味だ。"},{"w":"constrain","pos":"動","m":"制約する；強いる","nu":"自由な行動や選択を外的な力で狭めることを表し、しばしば受け身で使われる。","ph":"constrain someone's choices","phm":"人の選択を制約する","ex":"A tight budget can constrain what our club is able to do.","exm":"予算が厳しいと、私たちの部活動でできることが制約されることがある。","us":"「constrain A to do」「be constrained by ~」の形が多い。名詞形は constraint だ。","tip":"con-（強く）+ stringere（締める）が語源。restrict より強い拘束感を持つ。"},{"w":"contemplate","pos":"動","m":"じっくり考える；熟考する","nu":"結論を急がず、時間をかけて選択肢や将来について静かに考えることを表す。","ph":"contemplate the future","phm":"将来についてじっくり考える","ex":"Before the exam, I like to contemplate my study plan quietly.","exm":"試験前、私は静かに勉強計画についてじっくり考えるのが好きだ。","us":"目的語には動名詞（-ing）や名詞をとり、不定詞は使わない点に注意する。","tip":"con-（共に）+ templum（神殿）が語源で「じっと見つめる」から発展した。think より重く長い思考を表す。"},{"w":"contradict","pos":"動","m":"矛盾する；否定する","nu":"発言や事実が互いに食い違う、または相手の言うことに反対することを表す。","ph":"contradict each other","phm":"互いに矛盾する","ex":"I did not want to contradict my teacher in front of the class.","exm":"私はクラスの前で先生に反論したくなかった。","us":"「contradict + 目的語(人・発言)」の形で他動詞として使う。名詞形は contradiction だ。","tip":"contra-（反対に）+ dicere（言う）が語源。「反対のことを言う」がそのままの意味だ。"},{"w":"converge","pos":"動","m":"収束する；集まる","nu":"別々の方向から来たものが一点に近づき、集まっていく様子を表す。","ph":"converge on a single point","phm":"一点に収束する","ex":"Little by little, everyone's opinions began to converge on one plan.","exm":"少しずつ、みんなの意見は一つの案に収束し始めた。","us":"自動詞で「converge on/at ~」の形をとる。対義語は diverge（分岐する）だ。","tip":"con-（共に）+ vergere（傾く）が語源。道が合流するイメージで覚える。"},{"w":"correlation","pos":"名","m":"相関関係","nu":"二つの物事が互いに関連して変化する統計的な結びつきを表す語だ。","ph":"a correlation between A and B","phm":"AとBの間の相関関係","ex":"There seems to be a correlation between sleep and test scores.","exm":"睡眠とテストの点数には相関関係があるようだ。","us":"「correlation between A and B」の形で使う。因果関係(causation)とは区別される点に注意する。","tip":"co-（共に）+ relation（関係）が語源。correlate（動詞）と合わせて覚える。"},{"w":"correspond","pos":"動","m":"一致する；文通する","nu":"二つのものが対応・一致すること、または手紙などでやり取りすることを表す。","ph":"correspond to reality","phm":"現実と一致する","ex":"His story did not correspond to what actually happened at school.","exm":"彼の話は学校で実際に起きたこととは一致していなかった。","us":"「correspond to/with ~」の形をとる自動詞。名詞形 correspondence も覚えておく。","tip":"cor-（共に）+ respond（応じる）が語源。「互いに応じ合う」から一致・文通の意味になった。"},{"w":"corrupt","pos":"形","m":"腐敗した","nu":"権力を持つ人が金銭や地位のために不正を行う様子を表す形容詞だ。","ph":"a corrupt official","phm":"腐敗した役人","ex":"The news reported that a corrupt official had taken bribes.","exm":"そのニュースは腐敗した役人が賄賂を受け取っていたと報じた。","us":"形容詞のほか「汚職で堕落させる」という動詞としても使える。名詞形は corruption だ。","tip":"cor-（完全に）+ rumpere（壊す）が語源。「完全に壊れた」道徳を表す。"},{"w":"cultivate","pos":"動","m":"育てる；培う","nu":"作物だけでなく、能力や人間関係を時間をかけて育てる場合にも使う。","ph":"cultivate a habit","phm":"習慣を身につける","ex":"Wide reading can help students cultivate strong critical thinking skills.","exm":"幅広い読書は生徒が強い批判的思考力を培う助けになる。","us":"土地を「耕す」意味に加え、「(能力・関係を)育てる」比喩的な用法も頻出する。","tip":"culture と同じ語源(colere「耕す」)を持つ。plant より広い意味で使えると覚える。"},{"w":"deficit","pos":"名","m":"赤字；不足","nu":"収入や量が必要な水準に足りていない状態を数値的に表す語だ。","ph":"a budget deficit","phm":"財政赤字","ex":"The student council reported a small deficit in this year's budget.","exm":"生徒会は今年度の予算に少額の赤字があると報告した。","us":"可算名詞で「a deficit of ~」「in deficit」の形で使う。対義語は surplus（黒字）だ。","tip":"de-（下に）+ facere（作る）が語源で「不足を作る」がもとの意味だ。"},{"w":"degrade","pos":"動","m":"劣化させる；品位を落とす","nu":"質や価値、環境などが徐々に悪い方向へ落ちていくことを表す。","ph":"degrade the environment","phm":"環境を悪化させる","ex":"Littering in the park will slowly degrade the environment for everyone.","exm":"公園にゴミを捨てることは、みんなのために環境を徐々に悪化させる。","us":"他動詞・自動詞どちらでも使え、「be degraded」の受け身も多い。名詞形は degradation だ。","tip":"de-（下へ）+ grade（段階）が語源。「段階を下げる」がそのままのイメージだ。"},{"w":"deliberate","pos":"形","m":"故意の；慎重な","nu":"偶然ではなく意図的に行われること、または急がず慎重に考えることを表す。","ph":"a deliberate decision","phm":"慎重な（意図的な）決断","ex":"Ignoring her message was not a deliberate choice on my part.","exm":"彼女のメッセージを無視したのは、私の故意の選択ではなかった。","us":"形容詞・動詞（熟考する）ともに第2音節にアクセントがあるが、動詞は語尾を /-eɪt/ とはっきり発音し、形容詞は /-ət/ とあいまい母音になる点で発音が異なる。","tip":"de-（完全に）+ librare（秤にかける）が語源。「よく吟味した」がもとの意味だ。"},{"w":"denote","pos":"動","m":"示す；意味する","nu":"記号や言葉がある特定の意味を客観的に指し示すことを表す、やや形式的な語だ。","ph":"denote a specific meaning","phm":"特定の意味を示す","ex":"In this graph, the red line seems to denote average temperature.","exm":"このグラフでは、赤い線が平均気温を示しているようだ。","us":"記号・言葉が「〜を意味する」という客観的な指示に使う。感情的な含みを持つ connote と対比される。","tip":"de-（強調）+ notare（印をつける）が語源。「印をつけて示す」がもとの意味だ。"},{"w":"deprive","pos":"動","m":"奪う","nu":"本来持っているべきものや権利を人から取り上げることを表す。","ph":"deprive someone of sleep","phm":"人から睡眠を奪う","ex":"Staying up late every night can deprive students of proper sleep.","exm":"毎晩夜更かしをすることは、生徒から十分な睡眠を奪いかねない。","us":"「deprive A of B」の形をとる。受け身の「be deprived of ~」も頻出する。","tip":"de-（否定）+ privare（個人のものにする）が語源。rob と似るが、必要なものを奪うニュアンスを持つ。"},{"w":"designate","pos":"動","m":"指定する","nu":"人や場所・役割を公式に特定のものとして選び定めることを表す。","ph":"designate a place as ~","phm":"ある場所を〜として指定する","ex":"The school plans to designate this room as the new library.","exm":"学校はこの部屋を新しい図書室として指定する予定だ。","us":"「designate A as B」の形で使うことが多い。名詞形は designation だ。","tip":"de-（強調）+ signare（印をつける）が語源。sign と同語源で「はっきり示す」イメージだ。"},{"w":"deteriorate","pos":"動","m":"悪化する","nu":"健康や状況、関係などが時間とともに徐々に悪くなっていくことを表す。","ph":"relations deteriorate","phm":"関係が悪化する","ex":"Their friendship seemed to deteriorate quickly after that one argument.","exm":"その一度の口論の後、彼らの友情は急速に悪化していったようだ。","us":"自動詞として使うことが多く、「deteriorate rapidly/gradually」のように副詞を伴いやすい。","tip":"de-（下へ）+ deterior（より悪い）が語源。worsen とほぼ同義でやや硬い語だ。"},{"w":"devastate","pos":"動","m":"荒廃させる；打ちのめす","nu":"地域や人の心を壊滅的なまでに強く傷つけることを表す強い語だ。","ph":"devastate the region","phm":"その地域を壊滅させる","ex":"A single storm can devastate an entire coastal town overnight.","exm":"一つの嵐が一晩で沿岸の町全体を壊滅させることがある。","us":"多くは受け身「be devastated by ~」で人の心理的衝撃を表す。形容詞 devastating も重要だ。","tip":"de-（完全に）+ vastare（荒らす）が語源。vast（広大な）と関連づけて覚える。"},{"w":"diagnosis","pos":"名","m":"診断","nu":"病気や問題の原因を専門的に見極めて特定することを表す名詞だ。","ph":"receive a diagnosis","phm":"診断を受ける","ex":"The doctor gave a clear diagnosis after checking all his symptoms.","exm":"医者は彼の症状をすべて確認した後、明確な診断を下した。","us":"複数形は diagnoses になる不規則変化に注意する。動詞形は diagnose だ。","tip":"dia-（通して）+ gnosis（知ること）が語源。「よく調べて知る」がもとの意味だ。"},{"w":"dialect","pos":"名","m":"方言","nu":"ある地域や集団に特有の言葉づかいで、標準語とは異なる語彙・発音を指す。","ph":"speak in a dialect","phm":"方言で話す","ex":"My grandmother still speaks in her local dialect at home.","exm":"祖母は家では今でも地元の方言で話す。","us":"可算名詞。「a local/regional dialect」のように地域性を表す語と共に使う。","tip":"dia-（〜を通して）+ legein（話す）が語源。language の下位区分としてイメージする。"},{"w":"dictate","pos":"動","m":"命令する；書き取らせる","nu":"権威をもって何をすべきか一方的に指示すること、または口述して書かせることを表す。","ph":"dictate the terms","phm":"条件を一方的に指示する","ex":"The captain tried to dictate every single move during the game.","exm":"キャプテンは試合中、すべての動きを一方的に指示しようとした。","us":"「dictate to 人」または「dictate that ~」の形をとる。名詞形は dictation（書き取り）だ。","tip":"dictare（何度も言う）が語源。dictator（独裁者）と同語源だと覚えると意味がつかみやすい。"},{"w":"dilemma","pos":"名","m":"ジレンマ；板挟み","nu":"どちらを選んでも困難や不利益が伴う、二者択一の苦しい状況を表す。","ph":"face a dilemma","phm":"ジレンマに直面する","ex":"She faced a real dilemma about which club to join this year.","exm":"彼女は今年どちらの部活に入るかという本当のジレンマに直面した。","us":"「face/be in a dilemma」の形が多い。「dilemma between A and B」も使われる。","tip":"di-（二つの）+ lemma（前提）が語源。「二つの選択肢の板挟み」がそのままの意味だ。"},{"w":"diminish","pos":"動","m":"減少する","nu":"量や重要性、力などが徐々に、しかし着実に小さくなっていくことを表す。","ph":"diminish in importance","phm":"重要性が薄れる","ex":"His interest in the club seemed to diminish over the year.","exm":"彼のその部活への関心は、一年の間に薄れていったようだ。","us":"自動詞・他動詞どちらでも使う。decrease よりやや上品でフォーマルな響きを持つ。","tip":"di-（強意）+ minuere（小さくする）が語源。minor, minimum と同じ語根を持つ。"},{"w":"discourse","pos":"名","m":"談話；言説","nu":"ある話題について展開される、まとまった話し言葉や書き言葉のやり取りを指す。","ph":"public discourse","phm":"公共の議論・言説","ex":"Social media has changed the way public discourse takes place.","exm":"SNSは公共の言説が行われる形を変えてきた。","us":"不可算名詞として使うことが多く、「discourse on/about ~」の形もとる。","tip":"dis-（離れて）+ currere（走る）が語源。「話が展開していく」イメージで覚える。"},{"w":"discrete","pos":"形","m":"個別の；離散した","nu":"他と混じり合わず、はっきり区別できる別々の単位であることを表す。","ph":"discrete units","phm":"個別の単位","ex":"The course is divided into five discrete units of study.","exm":"その講座は5つの個別の学習単位に分かれている。","us":"発音・綴りが似た discreet（分別のある）と混同しやすいので区別して覚える。","tip":"dis-（離れて）+ cernere（分ける）が語源。discreet と語源は同じだが意味が分岐した。"},{"w":"discrimination","pos":"名","m":"差別；識別","nu":"特定の集団を不当に区別して扱うこと、または細かい違いを見分けることを表す。","ph":"racial discrimination","phm":"人種差別","ex":"The school held an event to raise awareness about discrimination.","exm":"学校は差別についての意識を高めるための行事を開いた。","us":"「discrimination against ~」の形で「〜に対する差別」を表す。動詞形は discriminate だ。","tip":"dis-（分けて）+ cernere（分ける、識別する）が語源。discrete, discreet と同語根で、良い意味の「識別」と悪い意味の「差別」両方を持つ。"},{"w":"dispose","pos":"動","m":"処分する；配置する","nu":"不要な物を片付けたり、人や物をある状態・位置に置いたりすることを表す。","ph":"dispose of waste","phm":"ゴミを処分する","ex":"Please dispose of your trash properly after the club meeting ends.","exm":"部活のミーティングが終わったら、ゴミを適切に処分してください。","us":"「dispose of ~」の形で「処分する」を表すことが最も多い。「be disposed to do」で「〜する傾向がある」の意味にもなる。","tip":"dis-（別々に）+ ponere（置く）が語源。「別の場所に置く」から「処分する」意味に発展した。"},{"w":"dispute","pos":"名","m":"論争","nu":"意見や権利をめぐって二者以上が激しく対立する状態を表す。","ph":"a dispute over ~","phm":"〜をめぐる論争","ex":"There was a heated dispute over who should be team captain.","exm":"誰がチームのキャプテンになるべきかをめぐって激しい論争があった。","us":"「dispute over/about ~」「in dispute」の形が頻出する。動詞としても同じ形で使われる。","tip":"dis-（離れて）+ putare（考える）が語源。「意見が分かれて考える」がもとの意味だ。"},{"w":"distort","pos":"動","m":"歪める","nu":"事実や形、音などを本来の姿から不正確・不自然な形に変えることを表す。","ph":"distort the facts","phm":"事実を歪める","ex":"That rumor seemed to distort what really happened at the party.","exm":"その噂は、パーティーで実際に起きたことを歪めているようだった。","us":"「distort the truth/facts/image」のように具体・抽象どちらの対象にも使える。名詞形は distortion だ。","tip":"dis-（離れて）+ torquere（ねじる）が語源。「ねじ曲げる」イメージで覚える。"},{"w":"doctrine","pos":"名","m":"教義；主義","nu":"宗教や政治などである集団が公式に信じ、教えとして掲げる考え方を表す。","ph":"religious doctrine","phm":"宗教上の教義","ex":"The textbook briefly explained the doctrine behind the social movement.","exm":"教科書はその社会運動の背後にある主義を簡潔に説明していた。","us":"「doctrine of ~」の形で特定の教義・原則を表す。フォーマルな文脈で使われる。","tip":"docere（教える）が語源で doctor, document と同語根。「教えられた考え」がもとの意味だ。"},{"w":"domain","pos":"名","m":"領域；分野","nu":"ある人や物事が専門的・権限的に関わる範囲・分野を指す。","ph":"in the domain of ~","phm":"〜の分野において","ex":"Coding used to be outside the domain of most high schoolers.","exm":"かつてプログラミングはほとんどの高校生の領域外だった。","us":"「in the domain of ~」「public domain」のように使われる。field, area と似るが専門性がやや強い。","tip":"dominus（主人）が語源で「支配が及ぶ範囲」がもとの意味だ。"},{"w":"drastic","pos":"形","m":"徹底的な；思い切った","nu":"状況を大きく変えるほど極端で急激な措置や変化を表す形容詞だ。","ph":"take drastic measures","phm":"思い切った対策を取る","ex":"The coach decided to take drastic measures to improve the team.","exm":"監督はチームを改善するため、思い切った対策を取ることにした。","us":"「drastic measures/change/action」のように名詞を修飾する形で頻出する。","tip":"ギリシャ語 drastikos（行動的な）が語源。mild の対極にある強い変化を表すと覚える。"},{"w":"durable","pos":"形","m":"耐久性のある","nu":"長期間の使用や時間の経過に耐えて壊れにくいことを表す。","ph":"a durable material","phm":"耐久性のある素材","ex":"These sports shoes are made from a very durable material.","exm":"このスポーツシューズはとても耐久性のある素材で作られている。","us":"物だけでなく「durable peace（永続する平和）」のように抽象的なものにも使える。","tip":"durare（続く）が語源で endure と同語根。「続く力がある」がもとの意味だ。"},{"w":"dynamic","pos":"形","m":"動的な；活発な","nu":"絶えず変化し、エネルギーや動きに満ちている様子を表す。","ph":"a dynamic personality","phm":"活発な性格","ex":"The new teacher has a very dynamic way of running class.","exm":"新しい先生はとても活発な授業の進め方をする。","us":"対義語は static（静的な）。名詞形は dynamics（力学、力関係）で頻出する。","tip":"ギリシャ語 dynamis（力）が語源。dynamite と同語根で「力に満ちた」イメージだ。"},{"w":"ecology","pos":"名","m":"生態学","nu":"生物と環境の関わり合いを研究する学問、または生態系そのものを指す。","ph":"study ecology","phm":"生態学を学ぶ","ex":"Our biology class started a new unit on forest ecology.","exm":"生物の授業で森林の生態学についての新しい単元が始まった。","us":"学問分野としては不可算名詞。形容詞形 ecological、関連語 ecosystem も合わせて覚える。","tip":"oikos（家）+ logos（学問）が語源。「生き物の住まいについての学問」がもとの意味だ。"},{"w":"elaborate","pos":"形","m":"精巧な；入念な","nu":"細部まで手間をかけて作り込まれている、または複雑で詳しいことを表す。","ph":"an elaborate plan","phm":"入念に練られた計画","ex":"The students created an elaborate plan for the school festival.","exm":"生徒たちは学園祭のために入念な計画を作り上げた。","us":"形容詞のほか「elaborate on ~（〜について詳しく説明する）」という動詞用法も重要。形容詞・動詞ともに第2音節にアクセントがあるが、動詞は語尾を /-eɪt/ とはっきり発音し、形容詞は /-ət/ とあいまい母音になる点で発音が異なる。","tip":"e-（外へ）+ labor（労働）が語源。「手間をかけて作り上げた」がもとの意味だ。"},{"w":"embed","pos":"動","m":"埋め込む","nu":"あるものを別のものの中にしっかりと固定して組み込むことを表す。","ph":"embed a video","phm":"動画を埋め込む","ex":"Our teacher decided to embed a short video in the lesson.","exm":"先生は授業に短い動画を埋め込むことにした。","us":"「embed A in B」の形で使う。過去分詞 embedded は「埋め込まれた」「深く根付いた」の意味で形容詞的にも使う。","tip":"em-（中に）+ bed（床、基盤）が語源。「土台の中に据える」イメージで覚える。"},{"w":"empirical","pos":"形","m":"経験的な；実証的な","nu":"理論だけでなく実際の観察や実験から得られたデータに基づくことを表す。","ph":"empirical evidence","phm":"実証的な証拠","ex":"The report was based on empirical evidence, not just personal opinions.","exm":"その報告書は単なる個人の意見ではなく、実証的な証拠に基づいていた。","us":"「empirical evidence/data/study」のように学術的な文脈で頻出する形容詞だ。","tip":"ギリシャ語 empeiria（経験）が語源。theoretical（理論的な）と対比して覚えるとよい。"},{"w":"enforce","pos":"動","m":"施行する；強制する","nu":"法律や規則を実際に守らせ、違反を許さず実行に移すことを表す語だ。","ph":"enforce the rules","phm":"規則を徹底させる","ex":"The teacher began to enforce the rule about phones very strictly.","exm":"先生は携帯電話に関する規則をとても厳しく徹底させ始めた。","us":"「enforce a law/rule」の形が多い。名詞形は enforcement（例: law enforcement）だ。","tip":"en-（〜にする）+ force（力）が語源。「力を加えて守らせる」がそのままのイメージだ。"},{"w":"entity","pos":"名","m":"実体；事業体","nu":"独立して存在する一つのまとまったもの・組織を客観的に指す語だ。","ph":"a separate entity","phm":"独立した存在（組織）","ex":"The student council operates as a separate entity from teachers here.","exm":"生徒会はここで教師とは別の独立した組織として活動している。","us":"「a legal entity（法人）」のように法律・組織関連の文脈で頻出する。","tip":"ラテン語 ens（存在するもの）が語源。「はっきりと存在する一つのもの」がもとの意味だ。"},{"w":"epidemic","pos":"名","m":"流行病；伝染病","nu":"感染症が急速に広がる状況を指し、比較的狭い地域での急増を表すことが多い。","ph":"an epidemic of flu","phm":"インフルエンザの流行","ex":"The school reported an epidemic of colds after winter break.","exm":"冬休み明け、学校では風邪の流行が報告された。","us":"可算名詞で「an epidemic of ~」の形で使うことが多い。医学的な文脈だけでなく比喩的にも使われる。","tip":"epi-(among)+demos(people)が語源で「人々の間に広がる」イメージ。pandemic(世界的流行)より規模が小さい。"},{"w":"equation","pos":"名","m":"方程式；等式","nu":"数学で数量の関係を等号で表した式のことで、比喩的に複雑に絡む要因の意味でも使う。","ph":"solve an equation","phm":"方程式を解く","ex":"Our math teacher asked us to solve the equation on the board.","exm":"数学の先生は黒板の方程式を解くよう私たちに言った。","us":"数学的な意味以外に「the equation」で考慮すべき要素全体を指す比喩表現もある。","tip":"equal(等しい)と同語源。等号でバランスが取れている式、というイメージで覚える。"},{"w":"equivalent","pos":"形","m":"同等の；相当する","nu":"価値・量・意味などが実質的に等しいことを表し、identicalほど完全一致は含意しない。","ph":"roughly equivalent to","phm":"ほぼ同等である","ex":"One kilometer is roughly equivalent to 0.6 miles.","exm":"1キロメートルはおよそ0.6マイルに相当する。","us":"「be equivalent to A」の形で前置詞toを伴う。名詞としても相当するものの意味で使える。","tip":"equi-(等しい)+valent(価値)が語源。valueと語根が近いと覚えると結びつきやすい。"},{"w":"erosion","pos":"名","m":"侵食；衰退","nu":"土壌や岩が水・風で少しずつ削られる現象で、比喩的に信頼や権利が徐々に失われる意味でも使う。","ph":"soil erosion","phm":"土壌侵食","ex":"Heavy rain last week caused serious soil erosion near the field.","exm":"先週の大雨で畑の近くで深刻な土壌侵食が起きた。","us":"不可算名詞として扱われることが多い。動詞形erodeとセットで覚えると使いやすい。","tip":"動詞erode(浸食する)の名詞形。信頼のerosionのように抽象的な減少にも使われる。"},{"w":"ethics","pos":"名","m":"倫理；倫理学","nu":"何が正しく何が誤りかを判断する道徳的な原則の体系を指す、やや学術的な語。","ph":"a code of ethics","phm":"倫理規定","ex":"Our club created a simple code of ethics for members.","exm":"私たちの部活はメンバー向けに簡単な倫理規定を作った。","us":"学問分野を指すときは単数扱い、個人の道徳観を指すときは複数扱いになることがある。形容詞形はethical。","tip":"moral(道徳的な)と似た意味だが、ethicsは組織や職業に関わる体系的な規範を指すことが多い。"},{"w":"evoke","pos":"動","m":"呼び起こす；喚起する","nu":"記憶・感情・イメージなどを心の中に自然に湧き上がらせることを表す動詞。","ph":"evoke memories of","phm":"～の記憶を呼び起こす","ex":"Old photographs like these evoke memories of my childhood summers.","exm":"こうした古い写真は私の子供時代の夏の記憶を呼び起こす。","us":"他動詞でevoke+名詞(感情・記憶・イメージ)の形をとる。受動態evoke feelingsなどもよく使われる。","tip":"e-(外へ)+vokeは声に関するvoc-と同語源で「呼び出す」イメージ。invoke(祈願する)と混同しないよう注意。"},{"w":"execute","pos":"動","m":"実行する；処刑する","nu":"計画や命令を実際に行動に移すことを表すやや形式的な語で、プログラム実行の意味でも使う。","ph":"execute a plan","phm":"計画を実行する","ex":"The team decided to execute the plan before the deadline.","exm":"チームは締め切り前にその計画を実行することに決めた。","us":"他動詞でexecute+名詞(plan, strategy, order)の形。処刑するの意味もあるため文脈で判断する必要がある。","tip":"ex-(外へ)+sequi/secutus(従う)が語源で「最後までやり遂げる」イメージ。名詞形execution(実行・処刑)も覚えておく。"},{"w":"exert","pos":"動","m":"及ぼす；行使する","nu":"力・影響・努力などを対象に働きかけることを表し、しばしば圧力や統制の文脈で使う。","ph":"exert influence on","phm":"～に影響を及ぼす","ex":"Social media can exert a strong influence on teenagers today.","exm":"ソーシャルメディアは今日、10代の若者に強い影響を及ぼしうる。","us":"「exert oneself」で努力するの意味にもなる再帰用法がある。influence, pressure, controlなどと結びつきやすい。","tip":"exertion(努力・行使)という名詞形も頻出。外に(ex-)力を及ぼすイメージで覚える。"},{"w":"explicit","pos":"形","m":"明白な；明示的な","nu":"情報や指示が曖昧さなくはっきり述べられている様子を表し、implicitの対義語。","ph":"give explicit instructions","phm":"明確な指示を与える","ex":"The coach gave explicit instructions about the new training sc

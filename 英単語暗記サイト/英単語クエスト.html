語になる点に注意する。reasonが「理由」なのに対しpurposeは「目的」を表す。","tip":"on purpose（わざと）とby accident（偶然に）を対にして覚えると使い分けやすい。"},{"w":"question","pos":"名","m":"質問；問題","nu":"答えを求めて尋ねる内容を指し、試験問題やクイズにも使われる。","ph":"ask a question","phm":"質問をする","ex":"A student raised her hand to ask a question in class.","exm":"一人の生徒が授業中に質問をするために手を挙げた。","us":"ask ~ a question の形で「人に質問する」という第4文型を作る。answerとセットで覚える。","tip":"quest（探求）という語根を含み、「答えを探し求める」内容だとイメージすると覚えやすい。"},{"w":"reason","pos":"名","m":"理由","nu":"ある結果や行動を引き起こした原因・根拠を説明する語だ。","ph":"the reason why","phm":"〜という理由","ex":"Nobody knew the reason why he left the club suddenly.","exm":"彼が突然部活を辞めた理由を誰も知らなかった。","us":"the reason why S+V や the reason for ~ の形でよく使われる。「the reason is because ~」は重複表現として誤りとされることが多く、「the reason is that ~」が正しいとされる。","tip":"reasonable（合理的な）という形容詞と一緒に覚えると語彙が広がる。"},{"w":"rest","pos":"名","m":"休息；残り","nu":"疲れを取るための休みと、全体から残った部分の両方を表す語だ。","ph":"take a rest","phm":"休憩を取る","ex":"After practice, the players took a short rest together.","exm":"練習の後、選手たちは一緒に短い休憩を取った。","us":"the rest of ~ で「~の残り」という意味になり、take a rest（休息する）とは異なる用法なので区別する。","tip":"「休む」のrestと「残り」のrestは同じ綴りだが文脈で意味を判断する必要がある。"},{"w":"result","pos":"名","m":"結果","nu":"何かを行った後に生じる成果や結末を客観的に述べる語だ。","ph":"as a result","phm":"結果として","ex":"As a result of hard practice, our team won the game.","exm":"猛練習の結果として、私たちのチームは試合に勝った。","us":"as a result of ~ で「~の結果として」という頻出表現になる。resultはinを伴い「~という結果になる」を表すこともある。","tip":"re-（再び）+sult（跳ねる）が語源とされ、「跳ね返ってくるもの」が結果だとイメージすると覚えやすい。"},{"w":"river","pos":"名","m":"川","nu":"海へと注ぐ大きな水の流れを指し、地形を表す最も基本的な語の一つだ。","ph":"cross the river","phm":"川を渡る","ex":"The old bridge lets people cross the river safely.","exm":"その古い橋のおかげで人々は安全に川を渡ることができる。","us":"特定の川の名前を言うときはthe River Thamesやthe Nile Riverのようにtheを付けることが多い。","tip":"lake（湖）やsea（海）と一緒に地形を表す語としてまとめて覚えると効率的だ。"},{"w":"rule","pos":"名","m":"規則","nu":"従うべき決まりを表し、学校やゲームの規則によく使われる。","ph":"a strict rule","phm":"厳しい規則","ex":"Every student must follow this important rule at school.","exm":"すべての生徒は学校でこの大切な規則を守らなければならない。","us":"動詞では「支配する」という意味も持ち、名詞のas a rule（一般的に）という熟語も覚えておくとよい。","tip":"「定規」のrulerと語源が近く、「まっすぐ整える基準」というイメージで結びつけて覚える。"},{"w":"schedule","pos":"名","m":"予定；日程","nu":"いつ何をするかを整理した計画表を表すビジネスや日常でも使う語だ。","ph":"a busy schedule","phm":"忙しい予定","ex":"Please check your schedule before we plan the trip.","exm":"旅行を計画する前に自分の予定を確認してください。","us":"on schedule（予定通りに）、behind schedule（予定より遅れて）という表現をセットで覚えると便利。","tip":"アメリカ英語では/skedʒuːl/、イギリス英語では/ʃedjuːl/と発音が異なるので聞き分けに注意する。"},{"w":"season","pos":"名","m":"季節；シーズン","nu":"春夏秋冬の一区分に加え、スポーツや活動が盛んな時期も表す語だ。","ph":"the rainy season","phm":"梅雨の季節","ex":"The baseball season starts early in the spring here.","exm":"ここでは野球のシーズンは春の早い時期に始まる。","us":"in seasonで「旬で・盛りで」という意味になり、seasoning（調味料）という派生語もある。","tip":"四季を表すspring・summer・fall・winterと合わせてseasonという総称語を覚える。"},{"w":"secret","pos":"名","m":"秘密","nu":"他人に知られたくない、または知らせていない事柄を指す語だ。","ph":"keep a secret","phm":"秘密を守る","ex":"Can you keep a secret if I tell you something?","exm":"何か話したら、秘密を守ってくれますか。","us":"in secretで「こっそりと、秘密に」という副詞的表現になる。形容詞としても「秘密の」の意味で使われる。","tip":"secretary（秘書）は元々「秘密を扱う人」という意味から生まれた語だと関連づけて覚える。"},{"w":"shape","pos":"名","m":"形","nu":"物の輪郭や形状を表し、状態や調子を表す比喩的用法もある語だ。","ph":"in the shape of","phm":"〜の形をした","ex":"The cookies were baked in the shape of stars.","exm":"そのクッキーは星の形に焼かれていた。","us":"in good shape（体調が良い）という熟語もよく使われ、単なる図形以外の意味にも注意する。","tip":"circle・square・triangleなど具体的な形の名前とセットで覚えると使いやすくなる。"},{"w":"side","pos":"名","m":"側；面","nu":"物の一部分や、対立する立場・グループを表す幅広い語だ。","ph":"on the other side","phm":"反対側に","ex":"Our classroom is on the side of the building facing the park.","exm":"私たちの教室は公園に面した建物の側にある。","us":"side by side（並んで）、take sides（味方する）などの熟語表現が多く、前置詞onと結びつきやすい。","tip":"「両側」を表すときはboth sidesと複数形になる点に注意して覚える。"},{"w":"situation","pos":"名","m":"状況","nu":"ある時点における物事の状態や取り巻く事情全体を表す語だ。","ph":"a difficult situation","phm":"難しい状況","ex":"The teacher explained the situation calmly to worried students.","exm":"先生は不安な生徒たちに状況を落ち着いて説明した。","us":"in this situationのように前置詞inを伴うことが多く、conditionやcircumstanceと似た意味を持つ。","tip":"situate（位置づける）という動詞から派生した語で、「置かれている状態」がコアイメージだ。"},{"w":"difficult","pos":"形","m":"難しい","nu":"習得や解決に努力を要する状態を表し、hardよりやや硬い語感を持つ。","ph":"a difficult question","phm":"難しい問題","ex":"This math problem is too difficult for me to solve.","exm":"この数学の問題は私には難しすぎて解けない。","us":"It is difficult for A to doの形で「Aにとって〜するのは難しい」を表す。difficult toの後には動詞の原形が続く。","tip":"対義語のeasyとセットで覚え、名詞形difficultyも一緒に覚えると語彙が広がる。"},{"w":"famous","pos":"形","m":"有名な","nu":"多くの人に名前や存在が広く知られている状態を表す語だ。","ph":"become famous","phm":"有名になる","ex":"This small town became famous for its beautiful cherry blossoms.","exm":"この小さな町は美しい桜の花で有名になった。","us":"be famous for ~で「~で有名だ」という意味になり、forの後には理由となる名詞が続く。","tip":"fame（名声）という名詞と語源が同じで、「名が知れ渡る」イメージで結びつけて覚える。"},{"w":"angry","pos":"形","m":"怒った","nu":"強い不満や腹立たしさを感じている感情の状態を表す語だ。","ph":"get angry","phm":"怒る","ex":"My mother got angry when I forgot my homework again.","exm":"私が宿題をまた忘れたとき、母は怒った。","us":"be angry with[at] 人、be angry about ~事 のように前置詞を使い分ける点に注意する。","tip":"angerという名詞形と合わせて覚え、mad（怒った）という口語表現とも結びつけておく。"},{"w":"beautiful","pos":"形","m":"美しい","nu":"見た目や響きなどが強く心を打つほど美しいことを表す語だ。","ph":"a beautiful view","phm":"美しい景色","ex":"We stopped to take pictures of the beautiful sunset.","exm":"私たちは立ち止まって美しい夕日の写真を撮った。","us":"prettyよりも強い美しさを表し、人・景色・音楽など幅広い対象に使うことができる。","tip":"beauty（美しさ）という名詞形とセットで覚えると使い分けが自然になる。"},{"w":"bright","pos":"形","m":"明るい；賢い","nu":"光が強く輝いている様子や、頭の回転が速い様子を表す語だ。","ph":"a bright future","phm":"明るい未来","ex":"The classroom looked bright because of the large windows.","exm":"大きな窓のおかげで教室は明るく見えた。","us":"光の明るさだけでなく、色の鮮やかさや人の賢さを表すときにも使える点が特徴的。","tip":"対義語のdarkと一緒に覚え、「賢い」という意味ではsmartとほぼ同義だと押さえておく。"},{"w":"busy","pos":"形","m":"忙しい","nu":"やるべきことが多く、時間に余裕がない状態を表す語だ。","ph":"be busy with","phm":"〜で忙しい","ex":"She is always busy with club activities after school.","exm":"彼女は放課後いつも部活動で忙しい。","us":"be busy with ~事、be busy doing ~ing（~するのに忙しい）の両方の形で使われる。","tip":"busy streetのように「にぎやかな」という意味にもなるので文脈で判断する。"},{"w":"careful","pos":"形","m":"注意深い","nu":"失敗や事故がないよう細心の注意を払う様子を表す語だ。","ph":"be careful with","phm":"〜に気をつける","ex":"Please be careful with the scissors when you cut paper.","exm":"紙を切るときはハサミの扱いに気をつけてください。","us":"Be careful! だけで「気をつけて」という命令表現になり、careful ofやcareful aboutも使われる。","tip":"care（注意）+ful（満ちた）という構成で、「注意に満ちた」様子だと覚える。"},{"w":"cheap","pos":"形","m":"安い","nu":"値段が低いことを表すが、品質が低い印象を与える場合もある語だ。","ph":"a cheap hotel","phm":"安いホテル","ex":"I bought a cheap notebook at the store near school.","exm":"私は学校の近くの店で安いノートを買った。","us":"低価格を表すが、人に対して使うと「けちな」という否定的な意味になることもある。値段自体を言うときはa low priceが自然で、a cheap priceは不自然とされることが多い。","tip":"対義語のexpensiveとセットで覚え、値段が「お得」なときはinexpensiveも使われると押さえる。"},{"w":"comfortable","pos":"形","m":"快適な","nu":"体や心にとって心地よく、リラックスできる状態を表す語だ。","ph":"feel comfortable","phm":"快適に感じる","ex":"This chair is very comfortable to sit on for hours.","exm":"この椅子は何時間座っても非常に快適だ。","us":"comfortable to doの形や、feel comfortable with ~（~に対して気楽だ）という表現でよく使われる。","tip":"comfort（快適さ、慰め）という名詞と一緒に覚えると理解が深まる。"},{"w":"common","pos":"形","m":"共通の；よくある","nu":"多くの人や物に広く当てはまる、ありふれた様子を表す語だ。","ph":"a common mistake","phm":"よくある間違い","ex":"Losing your umbrella is a common problem on rainy days.","exm":"傘をなくすのは雨の日によくある問題だ。","us":"have ~ in common（~を共通して持つ）という熟語表現が頻出なので合わせて覚える。","tip":"「共通の」という意味からcommunity（共同体）という語との関連を意識すると覚えやすい。"},{"w":"convenient","pos":"形","m":"便利な","nu":"利用しやすく、手間や不便を感じさせない様子を表す語だ。","ph":"a convenient location","phm":"便利な場所","ex":"The new station is very convenient for students living nearby.","exm":"その新しい駅は近くに住む生徒たちにとって非常に便利だ。","us":"It is convenient for A to do の形で使われ、人を主語にしてI am convenientとは言わない点に注意する。","tip":"convenience store（コンビニ）という身近な語から意味を連想すると覚えやすい。"},{"w":"dangerous","pos":"形","m":"危険な","nu":"怪我や事故など悪い結果を招く恐れがある状態を表す語だ。","ph":"a dangerous place","phm":"危険な場所","ex":"Swimming in that river can be dangerous after heavy rain.","exm":"大雨の後にあの川で泳ぐのは危険な場合がある。","us":"It is dangerous for A to do や dangerous to ~ の形でよく使われる。","tip":"danger（危険）という名詞にfulではなく-ousが付く形なので綴りに注意して覚える。"},{"w":"dark","pos":"形","m":"暗い","nu":"光がほとんどない状態や、色が濃い様子を表す基本的な語だ。","ph":"get dark","phm":"暗くなる","ex":"It gets dark early in winter, so be careful going home.","exm":"冬は早く暗くなるので、帰り道は気をつけてください。","us":"天候や時間を表す主語itと共にIt gets dark（暗くなる）という形でよく使われる。","tip":"対義語のbrightやlightとセットで覚え、dark blue（濃い青）のように色にも使えると押さえる。"},{"w":"deep","pos":"形","m":"深い","nu":"表面から底までの距離が大きいことや、程度が強いことを表す語だ。","ph":"a deep sleep","phm":"深い眠り","ex":"The lake near our town is surprisingly deep in the middle.","exm":"私たちの町の近くの湖は中央部が驚くほど深い。","us":"深さを尋ねるときはHow deep is ~?を使い、five meters deepのように数値の後に置くこともできる。","tip":"副詞形deeplyと合わせて覚え、対義語shallow（浅い）も一緒に押さえておく。"},{"w":"delicious","pos":"形","m":"おいしい","nu":"味が非常によく、食欲をそそる様子を強調して表す語だ。","ph":"look delicious","phm":"おいしそうに見える","ex":"The cake my sister made looked absolutely delicious this morning.","exm":"今朝、姉が作ったケーキは実においしそうに見えた。","us":"very deliciousとは言わず、程度を強めるときはabsolutelyやreallyを用いるのが自然。","tip":"goodやtastyより強い「とてもおいしい」を表す語だと段階を意識して覚える。"},{"w":"different","pos":"形","m":"異なる","nu":"他と比べて性質や種類が同じでないことを表す基本的な語だ。","ph":"different from","phm":"〜と異なる","ex":"My opinion is different from my classmate's on this topic.","exm":"この話題について私の意見はクラスメートのものと異なる。","us":"different from が標準的だが、口語ではdifferent thanも使われることがある。","tip":"名詞形difference、動詞differと合わせて覚えると語彙のつながりが理解できる。"},{"w":"dirty","pos":"形","m":"汚い","nu":"汚れやほこりが付着して清潔でない状態を表す、日常でよく使う語だ。","ph":"get dirty","phm":"汚れる","ex":"His shoes got dirty after playing soccer in the mud.","exm":"泥の中でサッカーをした後、彼の靴は汚れた。","us":"cleanの対義語として使われ、get dirty（汚れる）という変化を表す表現が頻出。","tip":"対義語cleanとペアで覚え、dirt（土、汚れ）という名詞形も一緒に押さえる。"},{"w":"early","pos":"形","m":"早い；早く","nu":"予定や普通の時刻より前であることを表す語で形容詞・副詞両方で使う。","ph":"get up early","phm":"早起きする","ex":"I need to get up early to catch the first train.","exm":"始発電車に乗るために早起きする必要がある。","us":"形容詞としても副詞としても同じ形earlyを使い、-lyを付けたearlilyという語は存在しない点に注意。","tip":"対義語lateとセットで覚え、early morning（早朝）という表現も一緒に押さえる。"},{"w":"empty","pos":"形","m":"空の","nu":"中に何も入っていない、あるいは人がいない状態を表す基本的な語だ。","ph":"an empty bottle","phm":"空のボトル","ex":"The classroom was empty when I arrived at school early.","exm":"早く登校したとき、教室は誰もいなかった。","us":"動詞として「空にする」という意味でも使われ、emptyはfullの対義語として覚えるとよい。","tip":"対義語full（いっぱいの）と対にして、状況をイメージしながら覚える。"},{"w":"excellent","pos":"形","m":"優れた","nu":"非常に質が高く、他より抜きんでている様子を表す強い褒め言葉だ。","ph":"do an excellent job","phm":"素晴らしい仕事をする","ex":"The coach said we did an excellent job during the match.","exm":"コーチは私たちが試合で素晴らしい活躍をしたと言った。","us":"goodよりずっと強い賞賛を表し、very excellentのように強調語veryを重ねて使わないのが基本。","tip":"excelという動詞（優れる）から派生した語で、「抜きん出て優れている」イメージで覚える。"},{"w":"expensive","pos":"形","m":"高価な；値段が高い","nu":"値段が高くて負担に感じる意味合いを持ち、金額そのものを表すpriceとは異なる。","ph":"too expensive to buy","phm":"高すぎて買えない","ex":"This bag looks nice but it is too expensive for me.","exm":"このかばんは素敵だが、私には高すぎる。","us":"be動詞の補語として使うことが多く、costlyよりも日常会話で広く使われる。","tip":"反対語はcheap（安い）。expense（費用）と語源が同じだと覚えると関連づけやすい。"},{"w":"favorite","pos":"形","m":"お気に入りの；大好きな","nu":"数ある中から自分が一番好きなものを選ぶときに使い、best-likedに近い意味を持つ。","ph":"my favorite subject","phm":"私の大好きな科目","ex":"Math is my favorite subject because I like solving problems.","exm":"問題を解くのが好きなので、数学は私の大好きな科目だ。","us":"名詞の前に置いて使うことが多く、like betterよりも強い好みを表す。","tip":"favor（好意）から派生した語で、イギリス英語ではfavouriteと綴る。"},{"w":"foreign","pos":"形","m":"外国の","nu":"自分の国とは異なる国や地域に関するものを表す形容詞で、副詞のabroadと区別する。","ph":"foreign language","phm":"外国語","ex":"She wants to study a foreign language at university next year.","exm":"彼女は来年大学で外国語を勉強したいと思っている。","us":"foreign countryやforeign studentのように名詞の前に置いて使う。gを発音しない点に注意する。","tip":"foreignerは「外国人」を指す名詞で、形容詞形と一緒に覚えると効率がよい。"},{"w":"fresh","pos":"形","m":"新鮮な","nu":"食べ物などが取れたてで新しい状態や、空気が澄んでいる様子を表す。","ph":"fresh vegetables","phm":"新鮮な野菜","ex":"My grandmother sends us fresh vegetables from her garden every week.","exm":"祖母は毎週庭で採れた新鮮な野菜を送ってくれる。","us":"食品だけでなく、fresh airやfresh startのように空気や新たな始まりにも使える。","tip":"対義語はstale（新鮮でない）。freshman（新入生）もこの語から来ていると覚える。"},{"w":"friendly","pos":"形","m":"親切な；友好的な","nu":"人に対して優しく接し、話しかけやすい雰囲気を持つ様子を表す。","ph":"friendly to everyone","phm":"誰にでも親切な","ex":"Our new teacher is very friendly to everyone in the class.","exm":"私たちの新しい先生はクラスの誰にでもとても親切だ。","us":"friend＋lyの形だが副詞ではなく形容詞なので注意する。be friendly withで「〜と仲が良い」を表す。","tip":"語尾がlyでも副詞ではない代表例。friend（友人）から作られた語だと覚える。"},{"w":"full","pos":"形","m":"いっぱいの；満腹の","nu":"容器や場所に何かが満ちている状態、また食事でお腹がいっぱいな状態を表す。","ph":"full of energy","phm":"元気いっぱいで","ex":"After lunch, I felt full and could not eat any more.","exm":"昼食の後、お腹がいっぱいで、もう食べられなかった。","us":"be full ofの形でよく使い「〜でいっぱいだ」を表す。満腹はfull、空腹はhungryと対で覚える。","tip":"対義語はempty（空の）。fill（満たす）という動詞と関連づけて覚えるとよい。"},{"w":"funny","pos":"形","m":"おかしい；こっけいな","nu":"笑いを誘うようなおもしろさを表し、興味を引くというinterestingとは意味が異なる。","ph":"a funny story","phm":"おかしな話","ex":"He told a funny story that made everyone laugh loudly.","exm":"彼はみんなを大笑いさせるおかしな話をした。","us":"「奇妙な」という意味でも使われ、funny smellのように違和感を表すこともある。","tip":"fun（楽しみ、名詞）に形容詞語尾yがついた語だと覚えるとつづりを間違えにくい。"},{"w":"glad","pos":"形","m":"うれしい","nu":"何かのおかげで気持ちが晴れやかになる様子を表し、happyより一時的な感情に使うことが多い。","ph":"glad to hear that","phm":"それを聞いてうれしい","ex":"I am so glad to hear that your team won the game.","exm":"あなたのチームが試合に勝ったと聞いてとてもうれしい。","us":"be glad to doやbe glad thatの形で使い、名詞の前には置かない点がhappyと異なる。","tip":"gladlyは副詞で「喜んで」を表す。I'd be glad to.は依頼を快諾する定番表現。"},{"w":"heavy","pos":"形","m":"重い","nu":"物の重さが大きいことに加え、heavy rainのように程度が大きいことも表す。","ph":"heavy rain","phm":"大雨","ex":"We could not go out because of the heavy rain yesterday.","exm":"昨日は大雨のせいで外出できなかった。","us":"重量だけでなく、heavy trafficやheavy homeworkのように量や程度の大きさにも使う。","tip":"対義語はlight（軽い）。weight（重さ）と合わせて覚えると関連づけやすい。"},{"w":"hungry","pos":"形","m":"空腹の","nu":"食べ物を欲している状態を表し、be hungry forで「〜を渇望する」という比喩にも使う。","ph":"hungry for lunch","phm":"お腹がすいて昼食が待ち遠しい","ex":"By noon, all the students were hungry for lunch.","exm":"正午までに生徒全員がお腹をすかせて昼食を待ち望んでいた。","us":"be hungryの形で使い、程度を強めるときはvery hungryやreally hungryとする。","tip":"hunger（空腹、名詞）から形容詞化した語。反対語はfull（満腹の）。"},{"w":"important","pos":"形","m":"重要な","nu":"結果や物事に大きな影響を与えるため軽視できない様子を表す。","ph":"an important decision","phm":"重要な決断","ex":"Choosing a high school is an important decision for students.","exm":"高校を選ぶことは生徒にとって重要な決断だ。","us":"It is important for A to doやIt is important that S doの形で頻繁に使われる。","tip":"importance（重要性、名詞）と合わせて覚える。matter（重要である、動詞）も似た意味を持つ。"},{"w":"interesting","pos":"形","m":"おもしろい；興味深い","nu":"人の関心や好奇心を引く様子を表し、笑いを誘うfunnyとは意味が異なる。","ph":"an interesting fact","phm":"興味深い事実","ex":"I learned an interesting fact about space in science class.","exm":"理科の授業で宇宙についての興味深い事実を学んだ。","us":"物事が「おもしろい」ときはinteresting、人が「興味を持つ」ときはinterestedを使う点に注意する。","tip":"interest（興味、名詞）から派生。interesting／interestedの使い分けはbored／boringと同じ形。"},{"w":"international","pos":"形","m":"国際的な","nu":"一つの国だけでなく複数の国に関わる、または国と国の間で行われる様子を表す。","ph":"an international student","phm":"留学生","ex":"Our school welcomed an international student from Australia this year.","exm":"私たちの学校は今年オーストラリアからの留学生を迎えた。","us":"inter-（〜の間の）＋national（国家の）から成る語で、national（国内の）と対比して覚える。","tip":"nation（国家）を含む語なので、national、nationalityと合わせて語彙を広げるとよい。"},{"w":"kind","pos":"形","m":"親切な；優しい","nu":"他人に対して思いやりを持って接し、困っている人を助けようとする性格を表す。","ph":"so kind of you","phm":"あなたはとても親切だ","ex":"It was so kind of you to help me with my homework.","exm":"宿題を手伝ってくれてとても親切だった。","us":"be kind to〜で「〜に親切だ」を表し、It is kind of you to doで「〜してくれて親切だ」を表す。","tip":"kindness（親切さ、名詞）と合わせて覚える。kind ofは会話で「なんとなく」という意味の副詞句にもなる。"},{"w":"large","pos":"形","m":"大きい","nu":"サイズや規模が大きいことを表し、bigよりもややかたい語感で数量にも使われる。","ph":"a large amount of","phm":"大量の〜","ex":"The library has a large amount of information on Japanese history.","exm":"図書館には日本史に関する大量の情報がある。","us":"面積・規模を表すときによく使い、large numberのように量的表現でも使われる。","tip":"対義語はsmall。bigとほぼ同じ意味だが、largeの方がやや客観的な場面で好まれる。"},{"w":"late","pos":"形","m":"遅い","nu":"予定の時刻より後になっている状態を表し、副詞としても同じ形で使われる。","ph":"late for school","phm":"学校に遅刻して","ex":"He was late for school because he missed the bus.","exm":"彼はバスに乗り遅れて学校に遅刻した。","us":"be late for〜で「〜に遅れる」を表す。形容詞・副詞同形なので、arrive lateのようにも使う。","tip":"比較級はlater、最上級はlatest（最新の）とlast（最後の）で意味が分かれる点に注意する。"},{"w":"lazy","pos":"形","m":"怠惰な","nu":"働いたり努力したりすることを避け、何もしないでいたい様子を表す。","ph":"a lazy day","phm":"のんびりした一日","ex":"We spent a lazy day at home doing nothing special.","exm":"私たちは特に何もせず、家でのんびりした一日を過ごした。","us":"be lazyで人の性格を表すほか、a lazy dayのようにゆったりした様子を表すこともある。","tip":"対義語はdiligentやhard-working。名詞形はlaziness「怠惰」。"},{"w":"light","pos":"形","m":"軽い；明るい","nu":"重さが少ないこと、または色や部屋が明るいことの両方を表す多義語。","ph":"light rain","phm":"小雨","ex":"It was only light rain, so we did not need an umbrella.","exm":"ただの小雨だったので、傘は必要なかった。","us":"重さの軽さと光の明るさの両方の意味を持つため、文脈で判断する必要がある。","tip":"対義語は重さならheavy、明るさならdark。light music（軽音楽）のような表現もある。"},{"w":"local","pos":"形","m":"地元の","nu":"特定の狭い地域に限定されている様子を表し、national（国の）やforeignと対比される。","ph":"a local newspaper","phm":"地元の新聞","ex":"I read about the festival in a local newspaper yesterday.","exm":"私は昨日、地元の新聞でその祭りについて読んだ。","us":"local time（現地時間）やlocal peopleのように名詞の前に置いて使う。","tip":"語源はラテン語のlocus（場所）。locationやlocateと関連づけて覚える。"},{"w":"lonely","pos":"形","m":"孤独な","nu":"一人でいて寂しさを感じる気持ちを表し、単に「一人」を表すaloneとは異なる。","ph":"feel lonely","phm":"孤独を感じる","ex":"She felt lonely after moving to a new town alone.","exm":"彼女は一人で新しい町に引っ越した後、孤独を感じた。","us":"feel lonelyやlook lonelyの形で感情や様子を表す。aloneは事実としての一人を表す点で異なる。","tip":"alone（一人で）と対比して覚える。aloneが必ずしも寂しいとは限らない点に注意する。"},{"w":"loud","pos":"形","m":"大声の；うるさい","nu":"音量が大きく耳障りに感じられる様子を表し、noiseとの結びつきが強い。","ph":"a loud noise","phm":"大きな音","ex":"We suddenly heard a loud noise coming from the gym.","exm":"私たちは体育館から突然大きな音が聞こえてきた。","us":"副詞としても使えるが、loudlyの方が自然とされる場面が多い。out loudで「声に出して」を表す。","tip":"対義語はquiet。read out loud「声に出して読む」という表現とセットで覚えると便利。"},{"w":"low","pos":"形","m":"低い","nu":"高さ・値段・声などの程度が基準より小さいことを表す。","ph":"a low price","phm":"安い値段","ex":"The store sells fresh fruit at a low price every morning.","exm":"その店は毎朝、安い値段で新鮮な果物を売っている。","us":"位置の低さだけでなく、low priceやlow voiceのように程度の低さにも幅広く使う。","tip":"対義語はhigh。lowerは動詞「下げる」としても使われる点に注意する。"},{"w":"modern","pos":"形","m":"現代の","nu":"現在の時代に特徴的で、古い時代のものと区別される新しさを表す。","ph":"modern technology","phm":"現代の技術","ex":"Many schools now use modern technology to help students learn.","exm":"今、多くの学校が生徒の学習を助けるために現代の技術を使っている。","us":"modern historyやmodern lifeのように時代区分や現代生活を表す名詞と結びつきやすい。","tip":"対義語はancientやtraditional。moderneではなくmodernとつづる点に注意する。"},{"w":"narrow","pos":"形","m":"狭い","nu":"道や幅が左右に十分な広がりを持たない様子を表し、面積を表すsmallとは焦点が異なる。","ph":"a narrow street","phm":"狭い通り","ex":"We walked carefully down a narrow street near the station.","exm":"私たちは駅の近くの狭い通りを注意深く歩いた。","us":"幅の狭さを表す語で、a narrow roomのように部屋にも使えるが、面積全体にはsmallを使う。","tip":"対義語はwide／broad（広い）。narrow escape（間一髪の脱出）という比喩表現もある。"},{"w":"necessary","pos":"形","m":"必要な；不可欠な","nu":"それがなければ物事がうまくいかないほど不可欠である様子を表す。","ph":"it is necessary to","phm":"〜することが必要だ","ex":"It is necessary to bring your student ID to the exam.","exm":"試験には学生証を持ってくることが必要だ。","us":"It is necessary for A to doやit is necessary thatの形で使う形式主語構文によく登場する。","tip":"necessityは名詞形「必要性」。need（必要とする、動詞）と意味が近いので合わせて覚えるとよい。"},{"w":"nervous","pos":"形","m":"緊張した","nu":"失敗や結果を心配して落ち着かない気持ちを表し、試験や発表の前によく使われる。","ph":"nervous about the test","phm":"テストのことで緊張して","ex":"I was very nervous about the test before it started.","exm":"私はテストが始まる前、とても緊張していた。","us":"be nervous about〜やfeel nervousの形で使う。excited（わくわくした）との違いを意識するとよい。","tip":"nervousnessは名詞形「緊張」。nerve（神経）から派生した語だと覚える。"},{"w":"perfect","pos":"形","m":"完璧な","nu":"欠点が一つもなく理想的な状態であることを表す、程度の強い形容詞。","ph":"a perfect score","phm":"満点","ex":"She got a perfect score on the English vocabulary test.","exm":"彼女は英単語のテストで満点を取った。","us":"程度がすでに最上級的な意味を持つため、very perfectとは基本的に言わない。","tip":"perfectlyは副詞「完璧に」。反対の意味はimperfectで、接頭辞imがつくと否定になる。"},{"w":"poor","pos":"形","m":"貧しい；下手な","nu":"お金が不足している状態、または技術や出来が劣っている状態の両方を表す。","ph":"poor at math","phm":"数学が苦手で","ex":"My brother is poor at math but good at English.","exm":"私の弟は数学が苦手だが、英語は得意だ。","us":"be poor at〜で「〜が苦手だ」を表し、be good at〜と対で覚えると便利。","tip":"対義語はrichや、上手を表すgood。二つの意味を文脈で見分けることが大切。"},{"w":"popular","pos":"形","m":"人気のある","nu":"多くの人に好まれ、支持されている様子を表す。","ph":"popular among students","phm":"生徒たちの間で人気のある","ex":"This singer is very popular among students at our school.","exm":"この歌手は私たちの学校の生徒たちの間でとても人気がある。","us":"be popular among〜／with〜の形で「〜の間で人気がある」を表す。","tip":"popularity（人気、名詞）と合わせて覚える。people（人々）と語源を共有している。"},{"w":"quiet","pos":"形","m":"静かな","nu":"音や動きが少なく落ち着いている様子を表し、うるさいloudの対義語にあたる。","ph":"keep quiet","phm":"静かにする","ex":"Please keep quiet in the library so others can study.","exm":"他の人が勉強できるように、図書館では静かにしてください。","us":"be quietやkeep quietの形でよく使う。quite（かなり）とつづりが似ているため区別が必要。","tip":"quiet（静かな）とquite（かなり）を混同しないよう、意味とつづりの違いを意識して覚える。"},{"w":"easily","pos":"副","m":"簡単に","nu":"労力や時間をほとんどかけずに物事ができる様子を表す副詞。","ph":"solve it easily","phm":"それを簡単に解く","ex":"She could solve the difficult math problem easily.","exm":"彼女はその難しい数学の問題を簡単に解くことができた。","us":"動詞を修飾し、文末や動詞の直後に置くことが多い。形容詞easyに-lyがついた形。","tip":"easy（簡単な、形容詞）のyをiに変えてlyをつけた形と覚える。"},{"w":"abroad","pos":"副","m":"海外へ；外国で","nu":"自国を離れて外国にいる、または外国へ行くことを表す副詞。","ph":"study abroad","phm":"留学する","ex":"My sister wants to study abroad in Canada next year.","exm":"姉は来年カナダに留学したいと思っている。","us":"副詞なので前置詞toは不要で、go abroadやlive abroadのように動詞に直接続ける。","tip":"形容詞のforeign（外国の）と品詞が違う点に注意。broad（幅広い）とつづりが似ているが意味は別。"},{"w":"almost","pos":"副","m":"ほとんど","nu":"完全ではないが、それに近い状態や程度であることを表す副詞。","ph":"almost every day","phm":"ほとんど毎日","ex":"I practice the piano almost every day after school.","exm":"私は放課後、ほとんど毎日ピアノを練習している。","us":"almost every／all／noのように数量詞の前に置いて「ほぼ〜」を表すことが多い。","tip":"nearlyとほぼ同じ意味で言い換え可能。most（大部分の）と混同しないよう注意する。"},{"w":"already","pos":"副","m":"すでに","nu":"ある時点よりも前に物事が完了していることを表す副詞。","ph":"already finished","phm":"すでに終わった","ex":"I have already finished my homework for tomorrow.","exm":"私は明日の宿題をすでに終わらせた。","us":"現在完了形とともに使われることが多く、肯定文でbe動詞や助動詞の後、一般動詞の前に置く。","tip":"疑問文ではyetを使うことが多い点と合わせて覚える。all＋readyが語源的な由来。"},{"w":"always","pos":"副","m":"いつも","nu":"例外なく毎回同じことが起こる様子を表す頻度の副詞で、頻度が最も高い。","ph":"always smiling","phm":"いつも笑顔で","ex":"Our teacher is always smiling when she enters the classroom.","exm":"私たちの先生は教室に入るとき、いつも笑顔だ。","us":"頻度副詞として一般動詞の前、be動詞の後に置くのが基本の語順。","tip":"頻度の強さはalways＞usually＞often＞sometimesの順で覚えると整理しやすい。"},{"w":"usually","pos":"副","m":"普段は；たいてい","nu":"例外はあるものの、多くの場合そうであるという習慣的な頻度を表す。","ph":"usually go to bed","phm":"普段は寝る","ex":"I usually go to bed before eleven o'clock on weekdays.","exm":"私は平日、普段は11時前に寝る。","us":"頻度副詞なので一般動詞の前、be動詞の後に置く。alwaysより頻度がやや低い。","tip":"usual（いつもの、形容詞）に-lyがついた語。as usual「いつものように」も合わせて覚える。"},{"w":"often","pos":"副","m":"しばしば；よく","nu":"何度も繰り返し起こることを表す頻度の副詞で、alwaysより頻度は低い。","ph":"often talk about","phm":"よく〜について話す","ex":"My friends and I often talk about our favorite music.","exm":"友達と私はよく好きな音楽について話す。","us":"頻度副詞として一般動詞の前、be動詞の後に置く。文頭や文末に置くこともできる。","tip":"How often〜?で頻度を尋ねる疑問文になる。sometimesより頻度が高い点を整理して覚える。"},{"w":"sometimes","pos":"副","m":"ときどき","nu":"常にではなく、時折そうすることがあるという頻度を表す副詞。","ph":"sometimes forget","phm":"ときどき忘れる","ex":"I sometimes forget to bring my textbook to school.","exm":"私はときどき教科書を学校に持ってくるのを忘れる。","us":"頻度副詞の中では文頭や文末にも置きやすく、位置の自由度が比較的高い。","tip":"some＋timesからできた語。頻度の順番ではoftenより低いと覚えておく。"},{"w":"together","pos":"副","m":"一緒に","nu":"複数の人やものが離れずに同じ場所や時間を共有する様子を表す。","ph":"study together","phm":"一緒に勉強する","ex":"We often study together at the library after school.","exm":"私たちは放課後、よく図書館で一緒に勉強する。","us":"動詞の後に置いて「一緒に〜する」を表す。get togetherで「集まる」という意味になる。","tip":"対義語はapart（離れて）。to＋getherで「一つにまとめる」というイメージを持つと覚えやすい。"},{"w":"soon","pos":"副","m":"すぐに；まもなく","nu":"現在または基準の時点から近い将来のうちに何かが起こる様子を表す。","ph":"see you soon","phm":"またすぐに会おう","ex":"Please get well soon and come back to school.","exm":"すぐに元気になって、学校に戻ってきてください。","us":"as soon as possibleで「できるだけ早く」を表す。soon after〜で「〜のすぐ後に」を表す。","tip":"as soon as〜（〜するとすぐに）という接続詞的表現とセットで覚える。"},{"w":"suddenly","pos":"副","m":"突然；急に","nu":"予期しない変化が一瞬で起こる様子を表し、驚きのニュアンスを伴う副詞だ。","ph":"suddenly stopped","phm":"突然止まった","ex":"The classroom door suddenly opened and the teacher walked in.","exm":"教室のドアが突然開いて先生が入ってきた。","us":"文中に置き動詞を修飾するのが基本で、驚きや予想外の展開を伝えるときに使う。","tip":"形容詞suddenの副詞形で、sudden change（突然の変化）と合わせて覚えるとよい。"},{"w":"especially","pos":"副","m":"特に；とりわけ","nu":"多くの中から一つを取り上げて強調するときに使い、特別な度合いを示す副詞だ。","ph":"especially good at","phm":"特に～が得意で","ex":"I love sports, especially soccer, and I practice every weekend.","exm":"私はスポーツが好きで、特にサッカーが好きで毎週末練習している。","us":"文中でカンマを挟み具体例を後ろに続ける形が多く、especially whenの形もよく使う。","tip":"special（特別な）から派生した語だと考えると、意味の結び付きを覚えやすい。"},{"w":"finally","pos":"副","m":"ついに；最後に","nu":"長い時間や過程を経てようやく結果に至る様子を表す副詞だ。","ph":"finally finished","phm":"ついに終えた","ex":"After three hours of practice, we finally scored a goal.","exm":"3時間の練習の後、私たちはついにゴールを決めた。","us":"文頭・文中どちらでも使え、first・thenなどの順序を表す語と並べて使うことも多い。","tip":"final（最後の）の副詞形なので、「最終的に至る」という意味だと覚えやすい。"},{"w":"however","pos":"副","m":"しかしながら","nu":"前の内容と対立する情報を丁寧につなぐ、butよりやや硬い副詞だ。","ph":"however, I think","phm":"しかし、私は思う","ex":"The test was hard; however, most students passed it easily.","exm":"テストは難しかったが、ほとんどの生徒は簡単に合格した。","us":"文頭や文中でコンマと共に使うのが基本で、butと違い接続詞ではなく副詞である点に注意する。","tip":"howとeverが合わさった語で、「どのようであっても」の意味から逆接の意味に発展したと覚える。"},{"w":"maybe","pos":"副","m":"たぶん；もしかすると","nu":"確信度が低い推量を表し、probablyより控えめで会話的な副詞だ。","ph":"maybe next time","phm":"たぶん次回は","ex":"It's raining outside, so maybe we should cancel the picnic.","exm":"外は雨が降っているので、もしかしたらピクニックは中止すべきかもしれない。","us":"文頭でよく使われ、断定を避けたいカジュアルな会話で便利な語だ。","tip":"may（かもしれない）とbeが合わさってできた語だと考えると成り立ちが分かる。"},{"w":"once","pos":"副","m":"一度；かつて","nu":"回数の「1回」と過去のある時点「かつて」の両方を表せる副詞だ。","ph":"once a week","phm":"週に一度","ex":"Our club meets once a week to practice for the contest.","exm":"私たちの部活はコンテストに向けて週に一度練習のために集まる。","us":"頻度を表すonce a week／monthの形や、接続詞的に「一度～すると」の意味でも使われる。","tip":"twice（2回）やthree times（3回）と並べて回数表現として覚えると効率的だ。"},{"w":"quickly","pos":"副","m":"素早く；急いで","nu":"動作のスピードが速いことを表す副詞で、fastより動きの様子を強調する。","ph":"quickly finish","phm":"急いで終える","ex":"She quickly finished her homework before the club meeting started.","exm":"彼女は部活のミーティングが始まる前に急いで宿題を終えた。","us":"動詞の直後や文中に置き、動作の速さを直接修飾するのが基本の使い方だ。","tip":"quick（速い）の副詞形で、slowly（ゆっくり）が反対の意味の語になる。"},{"w":"really","pos":"副","m":"本当に；とても","nu":"話し手の強い実感や驚きを込めて程度を強調する会話的な副詞だ。","ph":"really want to","phm":"本当に～したい","ex":"I really want to join the drama club this semester.","exm":"私は今学期、本当に演劇部に入りたいと思っている。","us":"形容詞や動詞を強調する際に使い、単独のReally?は「本当に？」という相づちにもなる。","tip":"real（本当の）の副詞形だと考えると、veryに近い強調の意味が理解しやすい。"},{"w":"still","pos":"副","m":"まだ；それでも","nu":"状態が変わらず継続していることを示し、意外性を伴う場合もある副詞だ。","ph":"still waiting","phm":"まだ待っている","ex":"It's already nine, but he is still waiting for the bus.","exm":"もう9時なのに、彼はまだバスを待っている。","us":"現在完了や進行形とともに使うことが多く、be動詞や助動詞の後ろに置く。","tip":"yet（もう～した？）と対で覚え、stillは継続、yetは完了の確認と区別するとよい。"},{"w":"instead","pos":"副","m":"その代わりに","nu":"予定していたものをやめて別の選択をすることを示す副詞だ。","ph":"instead of","phm":"～の代わりに","ex":"I didn't have time to cook, so we ordered pizza instead.","exm":"料理をする時間がなかったので、代わりにピザを注文した。","us":"instead ofは前置詞句として名詞や動名詞の前に置き、単独のinsteadは文末に置くことが多い。","tip":"in＋steadの成り立ちで、「代わりの場所に」というイメージから意味を覚えるとよい。"},{"w":"among","pos":"前","m":"～の間で；～の中で","nu":"3つ以上のもの・人の間に囲まれている、または属していることを示す前置詞だ。","ph":"among friends","phm":"友人たちの間で","ex":"This song is very popular among high school students right now.","exm":"この曲は今、高校生の間でとても人気がある。","us":"3人・3つ以上の集団に使い、2者の場合はbetweenを使う点が重要な違いだ。","tip":"betweenは「2つの間」、amongは「3つ以上の間」と対比させて覚えると混同しない。"},{"w":"between","pos":"前","m":"～の間に","nu":"2つのもの・人にはさまれている位置関係を表す前置詞だ。","ph":"between classes","phm":"授業の間に","ex":"We usually chat between classes near the vending machine outside.","exm":"私たちはたいてい自動販売機のそばで授業の間におしゃべりする。","us":"between A and Bの形で2つを結び付けて使うのが基本の用法だ。","tip":"amongとの違いを意識し、2者限定ならbetweenと覚えると使い分けやすい。"},{"w":"during","pos":"前","m":"～の間（中）","nu":"特定の期間や出来事が続いている間ずっと、という意味を表す前置詞だ。","ph":"during the summer","phm":"夏の間に","ex":"Please turn off your phone during the exam, everyone in class.","exm":"試験の間はクラスの皆さん、携帯の電源を切ってください。","us":"後ろには特定の期間を表す名詞が続き、主語と動詞を含む節は続かない点に注意する。","tip":"whileは後ろに文（主語＋動詞）、duringは後ろに名詞が続くと区別すると覚えやすい。"},{"w":"against","pos":"前","m":"～に反対して；～に対して","nu":"対立・接触・不利な条件など、何かにぶつかる方向性を持つ前置詞だ。","ph":"against the rules","phm":"規則に反して","ex":"Our basketball team will play against the strongest school tomorrow afternoon.","exm":"私たちのバスケ部は明日の午後、最強の学校と対戦する。","us":"スポーツの対戦相手や、意見の対立、物にもたれる様子など幅広い場面で使われる。","tip":"forが賛成・味方、againstが反対・敵対という対の関係で覚えると整理しやすい。"},{"w":"without","pos":"前","m":"～なしで","nu":"あるべきものが欠けている、伴っていない状態を表す前置詞だ。","ph":"without permission","phm":"許可なしで","ex":"You can't enter the music room without a teacher's permission today.","exm":"今日は先生の許可なしでは音楽室に入れない。","us":"後ろに名詞または動名詞（-ing）を置き、否定的な状況や欠如を表す際に使う。","tip":"withの反対語で、with（～と一緒に）に否定を表すoutが付いた語だと覚えやすい。"},{"w":"although","pos":"接","m":"～だけれども","nu":"後に続く内容と対照的な事実を前置きし、butより文語的な接続詞だ。","ph":"although it was","phm":"～ではあったけれど","ex":"The soccer match continued although it was raining very hard outside.","exm":"雨がとても激しく降っていたけれど、サッカーの試合は続いた。","us":"文頭・文中どちらにも置け、butと違い文の始まりから使える接続詞である点が特徴だ。","tip":"thoughとほぼ同じ意味だが、althoughの方がやや硬い書き言葉でよく使われると覚える。"},{"w":"because","pos":"接","m":"なぜなら；～だから","nu":"理由や原因を直接的に述べる、最も基本的で使用頻度の高い接続詞だ。","ph":"because of","phm":"～が原因で","ex":"We stayed inside because it was raining hard during lunch break.","exm":"昼休みに雨が激しく降っていたので、私たちは中にいた。","us":"because＋主語＋動詞で理由の節を作り、because ofは後ろに名詞を置く点で異なる。","tip":"sinceやasも理由を表すが、becauseが最も直接的で強い理由を示すと覚えるとよい。"},{"w":"while","pos":"接","m":"～する間に；一方で","nu":"同時進行の動作や、対比・逆接のニュアンスも表せる柔軟な接続詞だ。","ph":"while studying","phm":"勉強している間に","ex":"He listens to music while doing his homework every single night.","exm":"彼は毎晩、宿題をしながら音楽を聴いている。","us":"後ろに進行形の文が続くことが多く、対比の意味ではbutに近い使い方もできる。","tip":"duringが名詞を伴うのに対し、whileは主語＋動詞の節を伴う点で使い分けるとよい。"},{"w":"everyone","pos":"代","m":"みんな；誰でも","nu":"集団の中の全員を一人ひとり指すイメージを持つ、単数扱いの代名詞だ。","ph":"everyone knows","phm":"みんな知っている","ex":"Our teacher told everyone in class to bring their textbooks tomorrow.","exm":"先生はクラスのみんなに明日教科書を持ってくるように言った。","us":"動詞は単数形で受けるが、後ろで指す代名詞はtheyで受けることが会話では一般的だ。","tip":"every＋oneの成り立ちで、one by oneのように一人ひとり全員というイメージを持つとよい。"},{"w":"something","pos":"代","m":"何か","nu":"はっきり特定しない一つの物事を指す、肯定文でよく使う代名詞だ。","ph":"something wrong","phm":"何か問題が","ex":"I noticed something strange in the locker room after practice yesterday.","exm":"私は昨日の練習の後、ロッカールームで何か奇妙なものに気づいた。","us":"形容詞は後ろに置き（something new）、疑問文・否定文ではanythingを使うのが基本だ。","tip":"someは肯定文、anyは疑問・否定文で使うという原則がsomethingとanythingにも当てはまる。"},{"w":"look for","pos":"熟","m":"探す；捜す","nu":"意識して何かを見つけようと注意を向けて探す動作を表し、単に見るとは違う。","ph":"look for a job","phm":"仕事を探す","ex":"I always look for my glasses before leaving the house.","exm":"家を出る前はいつも眼鏡を探す。","us":"後ろにfor＋名詞を続け、「〜を探し求める」という意味になる他動詞的な句動詞。前置詞forを忘れないよう注意する。","tip":"forは「〜を求めて」という方向性を表し、seekよりくだけた日常表現として使われる。"},{"w":"look after","pos":"熟","m":"世話をする；面倒を見る","nu":"目を離さず注意を払って世話をするニュアンスで、take care ofとほぼ同義である。","ph":"look after a pet","phm":"ペットの世話をする","ex":"She has to look after her little sister after school today.","exm":"彼女は今日の放課後、妹の面倒を見なければならない。","us":"afterは「後ろについて見守る」イメージで、人・動物・物のいずれにも使える他動詞句である。","tip":"lookは「目を向ける」、afterは「付き添う」で、視線を離さず守るイメージで覚える。"},{"w":"look forward to","pos":"熟","m":"楽しみに待つ","nu":"未来の出来事を心待ちにする気持ちを表し、toの後は名詞か動名詞が続く。","ph":"look forward to seeing you","phm":"会えるのを楽しみにする","ex":"We really look forward to the school festival every autumn.","exm":"私たちは毎年秋の学園祭を本当に楽しみにしている。","us":"toは不定詞ではなく前置詞なので、後ろは名詞または動名詞（-ing）にする点に注意する。","tip":"forwardは「前方へ」で、未来へ視線を向けて待つイメージから意味を覚える。"},{"w":"look up","pos":"熟","m":"調べる；見上げる","nu":"辞書や資料で情報を調べる動作、または物理的に上を見上げる動作を表す。","ph":"look up a word in a dictionary","phm":"辞書で単語を調べる","ex":"Please look up this word before the vocabulary quiz tomorrow.","exm":"明日の単語テストの前に、この単語を調べておいて。","us":"目的語が代名詞の場合はlook it upのように分離するが、名詞の場合は分離してもしなくてもよい。","tip":"upは「探し出す」動作の完了イメージで、見上げる意味とは文脈で区別する。"},{"w":"give up","pos":"熟","m":"あきらめる；やめる","nu":"努力や習慣を途中でやめてしまう意味で、後ろにonや動名詞が続くことが多い。","ph":"give up smoking","phm":"禁煙する","ex":"Don't give up practicing just because the game went badly.","exm":"試合の出来が悪かったからといって、練習をあきらめないで。","us":"後ろに動詞が続く場合は動名詞（-ing）を使い、to不定詞にはしない。","tip":"upは「手放す」イメージで、giveと組み合わさると「差し出してやめる」となる。"},{"w":"get up","pos":"熟","m":"起きる；立ち上がる","nu":"眠っていた状態や座っていた状態から体を起こす動作を表す基本表現。","ph":"get up early","phm":"早起きする","ex":"I usually get up at six to jog before school starts.","exm":"私はたいてい6時に起きて、学校が始まる前にジョギングする。","us":"自動詞的に使い、「起床する」だけでなく椅子から「立ち上がる」意味にもなる。","tip":"upは起きた状態への移動を示し、wake upが意識の覚醒を指すのに対しget upは体を起こす行為を表す。"},{"w":"wake up","pos":"熟","m":"目が覚める；起こす","nu":"眠りから意識が戻る瞬間を表し、他動詞では人を起こす意味にもなる。","ph":"wake up early","phm":"早く目が覚める","ex":"The loud alarm made me wake up before six this morning.","exm":"今朝は大きな目覚まし音のせいで6時前に目が覚めた。","us":"自動詞・他動詞どちらでも使え、get upとの違いは「意識が戻る」段階を指す点である。","tip":"wakeは「目覚める」の意味そのもので、upは覚醒状態への到達を強調する。"},{"w":"take part in","pos":"熟","m":"参加する","nu":"行事や活動に加わって役割を果たすことを表し、participate inとほぼ同義である。","ph":"take part in a contest","phm":"コンテストに参加する","ex":"Many students take part in volunteer activities during summer vacation.","exm":"多くの生徒が夏休み中にボランティア活動に参加する。","us":"後ろは前置詞inを伴い、joinより「積極的に関わる」というニュアンスが強い。","tip":"partは「役割・一部分」の意味で、その一部を担うことから「参加する」となる。"},{"w":"take care of","pos":"熟","m":"世話をする；処理する","nu":"人や物の面倒を見る、または問題を責任を持って処理する意味を持つ。","ph":"take care of the plants","phm":"植物の世話をする","ex":"Could you take care of my dog while I'm on a trip?","exm":"旅行中、うちの犬の世話をしてもらえますか。","us":"look afterと似るが、care ofの部分に「責任を持って対応する」という含みがある。","tip":"careは「注意・世話」、takeは「引き受ける」で、責任を引き受けるイメージで覚える。"},{"w":"take off","pos":"熟","m":"脱ぐ；離陸する","nu":"衣服を体から取り去る動作、または飛行機が地面を離れる動作を表す。","ph":"take off your shoes","phm":"靴を脱ぐ","ex":"Please take off your shoes before you enter the classroom.","exm":"教室に入る前に靴を脱いでください。","us":"衣類が目的語の場合は分離してtake your shoes offとも言えるが、飛行機の意味では自動詞的に使う。","tip":"offは「体から離れる」イメージで、着るput onの反対語として対で覚えると効率的である。"},{"w":"take place","pos":"熟","m":"行われる；起こる","nu":"行事や出来事が予定通り、または実際に発生することを表す表現である。","ph":"the event will take place","phm":"そのイベントは開催される","ex":"The sports festival will take place on the school ground next week.","exm":"体育祭は来週、校庭で行われる予定だ。","us":"happenと似た意味だが、take placeは計画された行事について使われることが多い。","tip":"「場所を取る」が直訳で、出来事がその場所を占めて実現するイメージで覚える。"},{"w":"put on","pos":"熟","m":"身につける；着る","nu":"衣服や靴、化粧などを体につける動作の瞬間を表す表現である。","ph":"put on a jacket","phm":"上着を着る","ex":"It's cold outside, so put on a warm jacket before you leave.","exm":"外は寒いから、出かける前に暖かい上着を着なさい。","us":"「着ている状態」を表すwearとは異なり、put onは「着る動作」に焦点がある。","tip":"onは「接触・装着」を表し、offのtake offと対で覚えると忘れにくい。"},{"w":"put off","pos":"熟","m":"延期する","nu":"予定していた行動を後の日時にずらすことを表し、postponeの口語的表現である。","ph":"put off the meeting","phm":"会議を延期する","ex":"We had to put off the club meeting because of the storm.","exm":"嵐のせいで、部活のミーティングを延期しなければならなかった。","us":"後ろに動詞が続く場合は動名詞を使い、put off doingの形をとる。","tip":"offは「遠くへ離す」イメージで、予定を先へ押しやることから「延期」の意味になる。"},{"w":"turn on","pos":"熟","m":"つける；作動させる","nu":"電源やスイッチを入れて機器を動かす動作を表す基本的な句動詞である。","ph":"turn on the light","phm":"明かりをつける","ex":"Could you turn on the light because this room is dark?","exm":"この部屋は暗いので、電気をつけてもらえますか。","us":"目的語が代名詞のときはturn it onのように分離する必要がある。","tip":"onは「作動中」の状態を示し、offのturn offと対で覚えると効果的である。"},{"w":"turn off","pos":"熟","m":"消す；止める","nu":"電源やスイッチを切って機器の動作を止めることを表す表現である。","ph":"turn off the TV","phm":"テレビを消す","ex":"Remember to turn off the TV before you go to bed.","exm":"寝る前にテレビを消すのを忘れないでね。","us":"水道の蛇口を閉めるときにも使われ、機械類全般に幅広く使える。","tip":"offは「切断」を意味し、turn onの逆として一緒に覚えると定着しやすい。"},{"w":"turn down","pos":"熟","m":"断る；小さくする","nu":"申し出や依頼を丁寧に拒否すること、または音量を下げることを表す。","ph":"turn down the offer","phm":"その申し出を断る","ex":"He decided to turn down the invitation to the party.","exm":"彼はそのパーティーへの招待を断ることに決めた。","us":"refuseより柔らかい響きで、音量や明るさを下げる意味でも日常的に使われる。","tip":"downは「下げる・却下する」イメージで、turn upの反対語として対で覚える。"},{"w":"pick up","pos":"熟","m":"拾う；迎えに行く","nu":"物を手に取って持ち上げる、または人を車で迎えに行くことを表す。","ph":"pick up the phone","phm":"電話に出る","ex":"My mother will pick up my friend after club practice today.","exm":"母は今日、部活のあとで私の友達を迎えに来てくれる。","us":"代名詞が目的語のときはpick me upのように分離するが、名詞の場合は分離しなくてもよい。","tip":"upは「持ち上げる」イメージで、物にも人にも使える便利な句動詞として覚える。"},{"w":"find out","pos":"熟","m":"見つけ出す；知る","nu":"調べたり尋ねたりして、それまで知らなかった事実を明らかにすることを表す。","ph":"find out the truth","phm":"真実を知る","ex":"I want to find out why the club meeting was canceled.","exm":"なぜ部活のミーティングが中止になったのか知りたい。","us":"後ろに疑問詞節（why, what, howなど）を続けて使うことが多い。","tip":"outは「表に出す」イメージで、隠れていた情報を外へ引き出すことから意味を覚える。"},{"w":"figure out","pos":"熟","m":"理解する；解決する","nu":"考えたり分析したりして、複雑な物事や問題の答えを見つけることを表す。","ph":"figure out the answer","phm":"答えを導き出す","ex":"It took me an hour to figure out this math problem.","exm":"この数学の問題を理解するのに1時間かかった。","us":"understandより「考えて解明する」努力の過程を含み、口語でよく使われる。","tip":"figureは「数字・形」から「計算して形にする」イメージで、答えを組み立てる様子を表す。"},{"w":"carry out","pos":"熟","m":"実行する","nu":"計画や指示、実験などを実際に行動に移して遂行することを表す。","ph":"carry out a plan","phm":"計画を実行する","ex":"The science club will carry out an experiment next Monday.","exm":"科学部は来週の月曜日に実験を実行する予定だ。","us":"doより形式的で、計画・研究・命令などかたい目的語と結びつくことが多い。","tip":"carryは「運ぶ」、outは「最後まで」の意で、計画を最後まで運び通すイメージである。"},{"w":"get along with","pos":"熟","m":"仲良くやる","nu":"人と良好な関係を保ちながら過ごすことを表し、友人関係でよく使われる。","ph":"get along with classmates","phm":"クラスメートと仲良くする","ex":"It's important to get along with people from different cultures.","exm":"異なる文化の人たちと仲良くやることは大切だ。","us":"自動詞句で、be friends withより「うまくやっていく」という動的なニュアンスがある。","tip":"alongは「並んで進む」イメージで、一緒に歩調を合わせて付き合う様子を表す。"},{"w":"get over","pos":"熟","m":"乗り越える；回復する","nu":"病気やつらい経験、困難な感情から立ち直ることを表す表現である。","ph":"get over a cold","phm":"風邪から回復する","ex":"It took a few weeks to get over the disappointing loss.","exm":"その悔しい敗戦から立ち直るのに数週間かかった。","us":"recover fromと似た意味で使われ、風邪などの病気にも精神的な打撃にも使える。","tip":"overは「越えて向こう側へ」というイメージで、困難を乗り越える様子を表す。"},{"w":"get to","pos":"熟","m":"到着する","nu":"ある場所に移動して到達することを表し、arrive atの口語的な言い方である。","ph":"get to school","phm":"学校に着く","ex":"We need to get to the station before the train leaves.","exm":"電車が出発する前に、駅に着かなければならない。","us":"後ろに場所を表す名詞が続き、homeなど一部の語を除き前置詞toを省略できない点に注意する。","tip":"toは「〜へ向かって」到達点を示し、get home（無冠詞）との違いに気をつける。"},{"w":"come up with","pos":"熟","m":"思いつく","nu":"アイデアや解決策を新たに考え出すことを表し、think ofより発想の瞬間を強調する。","ph":"come up with an idea","phm":"アイデアを思いつく","ex":"Our team tried to come up with a new plan for the festival.","exm":"私たちのチームは文化祭のための新しい企画を考え出そうとした。","us":"後ろには通常アイデア・解決策・計画などの名詞が続く他動詞的な句動詞である。","tip":"upは「浮かび上がる」イメージで、アイデアが心の中から浮上する様子を表す。"},{"w":"come true","pos":"熟","m":"実現する","nu":"夢や願い、予想していたことが実際に現実となることを表す。","ph":"dreams come true","phm":"夢がかなう","ex":"Her wish to study abroad will surely come true one day.","exm":"留学したいという彼女の願いは、いつか必ず実現するだろう。","us":"主語は夢・願い・予言などが多く、come trueで「そのまま現実になる」という完結した表現になる。","tip":"trueは「本当」という意味の形容詞で、comeの補語になっている第2文型の形である。"},{"w":"come from","pos":"熟","m":"出身である；由来する","nu":"人の出身地や物事の起源・原因を示す表現で、状態を表す動詞句である。","ph":"come from Japan","phm":"日本出身である","ex":"Our new exchange students come from a small town in Canada.","exm":"私たちの新しい交換留学生たちは、カナダの小さな町の出身だ。","us":"状態を表す動詞なので進行形にはせず、出身地だけでなく物の原材料や原因を述べる時にも使う。","tip":"fromは「起点」を示し、人・物・感情のどれの出どころを説明するときにも使える。"},{"w":"go on","pos":"熟","m":"続く；起こる","nu":"物事が中断せずに継続すること、また「何が起きているか」を表す表現である。","ph":"go on talking","phm":"話し続ける","ex":"The rain didn't stop, and the game had to go on anyway.","exm":"雨は止まず、試合はとにかく続けられなければならなかった。","us":"continueと近い意味だが、go on doingの形で「〜し続ける」という進行の継続を表す。","tip":"onは「継続」を示す副詞で、前へ前へと進んでいくイメージで覚える。"},{"w":"grow up","pos":"熟","m":"成長する；育つ","nu":"子どもから大人へと年月をかけて成長していく過程を表す表現である。","ph":"grow up in Tokyo","phm":"東京で育つ","ex":"My mother always says that children grow up so fast these days.","exm":"近頃は子どもの成長が本当に早い、といつも母は言う。","us":"自動詞で、育つ場所を示すときはin/onなどの前置詞句を後ろに続けることが多い。","tip":"upは「大きくなる方向」を示し、大人へ向かって伸びていくイメージで覚える。"},{"w":"bring up","pos":"熟","m":"育てる；話題に出す","nu":"子どもをしつけて育てる、または会話の中で話題を持ち出すことを表す。","ph":"bring up a topic","phm":"話題を持ち出す","ex":"She didn't want to bring up the test results during dinner.","exm":"彼女は夕食中にテストの結果を話題にしたくなかった。","us":"子育ての意味ではraiseとほぼ同義で、受け身be brought upの形もよく使われる。","tip":"upは「表に持ってくる」イメージで、育てる意味と話題を出す意味の両方につながる。"},{"w":"set up","pos":"熟","m":"設立する；準備する","nu":"組織や機器、催しなどを新たに作り上げたり配置したりすることを表す。","ph":"set up a tent","phm":"テントを設営する","ex":"The volunteers worked together to set up chairs for the ceremony.","exm":"ボランティアたちは式典のためのいすを協力して並べた。","us":"会社や制度を「設立する」意味と、機材を「設置する」意味の両方で幅広く使われる。","tip":"upは「起き上がらせる・組み立てる」イメージで、何もない状態から作り上げる様子を表す。"},{"w":"show up","pos":"熟","m":"現れる；姿を見せる","nu":"約束や予定の場に人が実際に姿を見せることを表す、やや口語的な表現である。","ph":"show up on time","phm":"時間通りに現れる","ex":"We were worried when he didn't show up for the meeting.","exm":"彼が会議に姿を見せなかったとき、私たちは心配した。","us":"appearよりくだけた言い方で、遅刻や不在を話題にするときによく使われる。","tip":"showは「見せる」、upは「姿を現す」で、隠れていた人が出てくるイメージである。"},{"w":"run out of","pos":"熟","m":"使い果たす","nu":"持っていたものや時間が完全になくなってしまうことを表す表現である。","ph":"run out of time","phm":"時間切れになる","ex":"If we don't buy more, we will run out of milk soon.","exm":"もっと買わないと、すぐに牛乳を切らしてしまうだろう。","us":"後ろに名詞（時間・お金・食料など）を続け、主語は人だけでなく物にも使える。","tip":"runは「尽きる」方向へ進むイメージ、outは「外へ・なくなる」ことを強調する。"},{"w":"catch up with","pos":"熟","m":"追いつく","nu":"遅れていた人や進度に、努力して追いついて並ぶことを表す表現である。","ph":"catch up with the class","phm":"クラスに追いつく","ex":"After being sick, she worked hard to catch up with classmates.","exm":"病気で休んだ後、彼女はクラスメートに追いつこうと努力した。","us":"後ろにwith＋人・進度を続け、遅れを取り戻すニュアンスを持つ。","tip":"catchは「捕まえる」、upは「追いついた状態」を表し、前を行く相手に近づくイメージである。"},{"w":"keep up with","pos":"熟","m":"遅れずついていく","nu":"変化の速い状況や相手の速さに合わせて、遅れないよう努力し続けることを表す。","ph":"keep up with the news","phm":"ニュースについていく","ex":"It's hard to keep up with all the new phone apps.","exm":"新しいスマホアプリすべてに遅れずついていくのは大変だ。","us":"catch up withが「遅れを取り戻す」のに対し、keep up withは「並んだ状態を保つ」点が異なる。","tip":"keepは「維持する」、upは並んだ状態を示し、ペースを落とさず並走するイメージである。"},{"w":"deal with","pos":"熟","m":"対処する；扱う","nu":"問題や状況、人などに対して適切に対応し処理することを表す表現である。","ph":"deal with a problem","phm":"問題に対処する","ex":"Teachers must deal with many different problems every single day.","exm":"教師は毎日さまざまな問題に対処しなければならない。","us":"handleとほぼ同義で、後ろに問題・人・状況などの名詞が続く前置詞句を伴う。","tip":"dealは「取引・対応」の意味で、withの相手や問題に正面から向き合うイメージである。"},{"w":"depend on","pos":"熟","m":"頼る；次第である","nu":"人や物事に頼って成り立つこと、または結果が何かによって左右されることを表す。","ph":"depend on the weather","phm":"天気次第である","ex":"Whether we go hiking will depend on tomorrow's weather forecast.","exm":"ハイキングに行くかどうかは明日の天気予報次第だ。","us":"rely onとほぼ同義だが、「〜次第である」という条件・状況の意味でもよく使う。","tip":"onは「支え・支点」を示し、何かの上に寄りかかって成り立つイメージで覚える。"},{"w":"rely on","pos":"熟","m":"頼る；信頼する","nu":"人や物を信頼して頼りにし、その支えを当てにすることを表す表現である。","ph":"rely on friends","phm":"友人を頼りにする","ex":"You can always rely on your teammates during a difficult match.","exm":"苦しい試合の間はいつでもチームメートを頼っていい。","us":"depend onより少し「信頼して」という気持ちの強さが感じられる語である。","tip":"relyの語源は「結びつける」に通じ、onで対象にしっかり結びつく信頼を表す。"},{"w":"belong to","pos":"熟","m":"所属する；〜のものだ","nu":"組織の一員であること、または所有物が誰かのものであることを表す状態動詞である。","ph":"belong to a club","phm":"部活に所属する","ex":"This old bicycle used to belong to my grandfather years ago.","exm":"この古い自転車は何年も前、祖父のものだった。","us":"状態動詞なので進行形にはせず、所属先や所有者は前置詞toの後ろに置く。","tip":"belongは「ふさわしい場所にある」イメージで、toはその所属先を指し示す。"},{"w":"suffer from","pos":"熟","m":"苦しむ；患う","nu":"病気や苦痛、不快な状況によって継続的に苦しめられていることを表す。","ph":"suffer from a headache","phm":"頭痛に悩まされる","ex":"Many students suffer from stress before important entrance exams begin.","exm":"多くの生徒は大切な入試が始まる前にストレスに苦しむ。","us":"後ろに病名や症状を表す名詞を続け、フォーマルな文章や医療の話題でよく使われる。","tip":"sufferは「苦痛を受ける」で、fromはその苦痛の原因・出どころを示す。"},{"w":"result in","pos":"熟","m":"結果として〜になる","nu":"ある原因や行動が、最終的に特定の結果や状態を引き起こすことを表す表現である。","ph":"result in success","phm":"成功という結果になる","ex":"Poor planning can often result in problems during the school trip.","exm":"計画が不十分だと、修学旅行中の問題につながることが多い。","us":"result inの後ろは結果を表す名詞、result fromは原因を表す点と対比して覚えるとよい。","tip":"inは「〜という状態に至る」到達点を示し、原因から結果への流れを表す。"},{"w":"succeed in","pos":"熟","m":"〜に成功する","nu":"努力を重ねて目標を達成する意味で、後には行為や活動を表す語句がくる。","ph":"succeed in life","phm":"人生で成功する","ex":"If you keep practicing, you will succeed in the piano competition.","exm":"練習を続ければ、あなたはピアノのコンクールできっと成功するだろう。","us":"後ろには動名詞や名詞が続くことが多い。日本語につられて succeed to としないよう注意する。","tip":"success（名詞）・successful（形容詞）と語根が同じ。反意語は fail in。"},{"w":"pay attention to","pos":"熟","m":"〜に注意を払う","nu":"話や状況の細部を意識して集中して見聞きするときに使う表現。","ph":"pay attention to detail","phm":"細部に注意を払う","ex":"Students should always pay attention to the teacher during class.","exm":"生徒は授業中、常に先生の話に注意を払うべきだ。","us":"attention は不可算名詞で使う。人の注意を引く draw attention と混同しないよう注意する。","tip":"pay（払う）＋attention（注意）で「注意を払う」と直訳的に覚えられる。"},{"w":"make up for","pos":"熟","m":"〜を埋め合わせる","nu":"不足や失敗を別の努力・行動で補い、埋め合わせるときに使う。","ph":"make up for lost time","phm":"失った時間を埋め合わせる","ex":"He practiced extra hours to make up for the missed lesson.","exm":"彼は欠席した授業の埋め合わせに、余分に練習した。","us":"for の後には補う対象がくる。compensate for とほぼ同じ意味で使う。","tip":"make up（作り上げる）＋for（〜のために）で不足分を補うイメージ。"},{"w":"make fun of","pos":"熟","m":"〜をからかう","nu":"相手を笑いものにしたり冗談の対象にしたりする、やや否定的な表現。","ph":"make fun of someone's accent","phm":"人の訛りをからかう","ex":"It is not kind to make fun of classmates who make mistakes.","exm":"間違えたクラスメートをからかうのは優しくない。","us":"fun は不可算名詞で常に単数のまま使う。tease（からかう）よりも相手を見下すような否定的な響きが強い。","tip":"make fun（おもしろがる）＋of（〜を対象に）で「からかう」の意味になる。"},{"w":"make use of","pos":"熟","m":"〜を利用する","nu":"既にある物や機会を有効に活用するという中立的な表現。","ph":"make use of dictionaries","phm":"辞書を活用する","ex":"Try to make use of every chance to speak English at school.","exm":"学校で英語を話すあらゆる機会を利用するようにしよう。","us":"good や full を use の前に挟むことが多い。use はここでは不可算名詞扱い。","tip":"utilize のカジュアルな言い換えとして覚えると便利。"},{"w":"make sure","pos":"熟","m":"確かめる；確認する","nu":"間違いがないよう事前に確認したり、必ず〜するよう気をつける表現。","ph":"make sure the door is locked","phm":"ドアの鍵がかかっているか確認する","ex":"Please make sure you bring your textbook to class tomorrow.","exm":"明日は必ず教科書を持ってきてください。","us":"後ろに（that）節が続くことが多い。check より「必ず〜する」という意志を強く含む。","tip":"sure（確かな）を make（そうする）と覚えると忘れにくい。"},{"w":"take advantage of","pos":"熟","m":"〜をうまく利用する；つけ込む","nu":"チャンスや状況を自分に有利になるよう積極的に活用するイメージ。","ph":"take advantage of the opportunity","phm":"その機会を利用する","ex":"You should take advantage of every opportunity to join club activities.","exm":"部活動に参加できる機会はすべて利用すべきだ。","us":"人に対して使うと「〜につけ込む」という否定的な意味にもなる点に注意する。","tip":"advantage（有利な点）を take（つかむ）と考えると意味がつながる。"},{"w":"be interested in","pos":"熟","m":"〜に興味がある","nu":"対象に強い関心や好奇心を持っている状態を表す形容詞的表現。","ph":"be interested in science","phm":"科学に興味がある","ex":"Many students seem to be interested in learning a new language.","exm":"多くの生徒が新しい言語を学ぶことに興味があるようだ。","us":"interested は人が主語、interesting は物事が主語になる点を混同しやすい。","tip":"interest（興味）の過去分詞形と考えると使い分けを覚えやすい。"},{"w":"be good at","pos":"熟","m":"〜が得意だ","nu":"スキルや能力の面で優れている、上手であることを表す表現。","ph":"be good at drawing pictures","phm":"絵を描くのが得意だ","ex":"My brother is said to be good at solving math problems.","exm":"私の兄は数学の問題を解くのが得意だと言われている。","us":"at の後には名詞・動名詞がくる。反意語は be poor at や be bad at。","tip":"at は「〜の点で」という得意分野を指すと覚える。"},{"w":"be afraid of","pos":"熟","m":"〜を恐れる；怖がる","nu":"危険や失敗などに対して不安や恐怖を感じている状態を表す。","ph":"be afraid of making mistakes","phm":"失敗することを恐れる","ex":"You don't need to be afraid of speaking up in class.","exm":"授業中に発言することを恐れる必要はない。","us":"of の後は名詞・動名詞。that節を続けて be afraid that の形も使う。","tip":"afraid は単独では使わず be 動詞とセットで使う形容詞。be scared of とほぼ同じ意味だと覚える。"},{"w":"be proud of","pos":"熟","m":"〜を誇りに思う","nu":"自分や他人の成果・行動を誇らしく感じる気持ちを表す。","ph":"be proud of your effort","phm":"あなたの努力を誇りに思う","ex":"Our coach told us to be proud of our hard work.","exm":"コーチは私たちに、頑張ったことを誇りに思うようにと言った。","us":"of の後には人・物・こと全てを置ける。名詞形 pride との品詞違いに注意する。","tip":"proud（誇りに思う）＋of（〜について）で覚える。"},{"w":"be famous for","pos":"熟","m":"〜で有名だ","nu":"ある特徴や功績によって広く知られている状態を表す。","ph":"be famous for its cherry blossoms","phm":"桜で有名だ","ex":"This town continues to be famous for its delicious ramen shops.","exm":"この町はおいしいラーメン店で有名であり続けている。","us":"for の後には有名になった理由がくる。人を紹介する be famous as と区別する。","tip":"famous（有名な）＋for（〜という理由で）と覚える。"},{"w":"be different from","pos":"熟","m":"〜と異なる","nu":"比較対象と性質・特徴が異なっていることを客観的に述べる表現。","ph":"be different from each other","phm":"互いに異なっている","ex":"Everyone's opinion can be different from what the news reports.","exm":"誰の意見もニュースが報じる内容とは異なることがある。","us":"口語では from の代わりに than も使われるが、標準的には from が正しい。","tip":"different（異なる）＋from（〜から離れて）で違いの起点を表すと考える。"},{"w":"be similar to","pos":"熟","m":"〜と似ている","nu":"完全に同じではないが、性質や見た目が近いことを表す表現。","ph":"be similar to the original","phm":"元のものと似ている","ex":"This song's melody seems to be similar to an old folk tune.","exm":"この曲のメロディーは古い民謡と似ているようだ。","us":"to の後には比較対象がくる。be alike は前置詞を伴わない点が異なる。","tip":"similar（類似の）＋to（〜に対して）とセットで覚える。"},{"w":"be full of","pos":"熟","m":"〜でいっぱいだ","nu":"容器や場所、心などが何かで満たされている様子を表す。","ph":"be full of energy","phm":"元気いっぱいだ","ex":"The gym seemed to be full of students before the game began.","exm":"試合が始まる前、体育館はすでに生徒でいっぱいのようだった。","us":"of の後は可算・不可算どちらの名詞も可。be filled with と意味は近いが構造が異なる。","tip":"full（いっぱいの）＋of（〜で）とセットで丸ごと覚える。"},{"w":"be filled with","pos":"熟","m":"〜で満たされている","nu":"空間や気持ちが何かで隙間なく満ちている状態を強調する表現。","ph":"be filled with joy","phm":"喜びで満たされている","ex":"Her heart seemed to be filled with joy after passing the exam.","exm":"試験に合格した後、彼女の心は喜びで満たされているようだった。","us":"受け身の形で使うことが多く、with の後に満たす中身がくる。fill（満たす）が由来。","tip":"fill（満たす）＋ed＋with（〜で）と構造で覚える。"},{"w":"be made of","pos":"熟","m":"〜でできている","nu":"材料が見た目からわかる場合に使う、物理的な構成を表す表現。","ph":"be made of wood","phm":"木でできている","ex":"This old desk in our classroom seems to be made of solid wood.","exm":"教室にあるこの古い机は、頑丈な木でできているようだ。","us":"材料が変化して原形をとどめない場合は be made from を使う点と区別する。","tip":"made（作られた）＋of（〜から＝材料が見える）とセットで覚える。"},{"w":"be known for","pos":"熟","m":"〜で知られている","nu":"特定の特徴や業績によって世間に認知されていることを表す。","ph":"be known for its history","phm":"その歴史で知られている","ex":"Our school has come to be known for its strong soccer team.","exm":"私たちの学校は強豪サッカー部で知られるようになった。","us":"for の後には理由がくる。人物紹介の be known as（〜として）との違いに注意する。","tip":"known（知られた）＋for（理由）で be famous for とほぼ同義と覚える。"},{"w":"be used to","pos":"熟","m":"〜に慣れている","nu":"繰り返し経験して、その状況を当たり前だと感じている状態を表す。","ph":"be used to living abroad","phm":"海外生活に慣れている","ex":"After a year, she came to be used to the new school schedule.","exm":"1年後、彼女は新しい学校の時間割に慣れるようになった。","us":"to の後は名詞・動名詞。used to＋動詞原形（以前は〜した）と混同しないよう注意する。","tip":"get used to（慣れる）と be used to（慣れている）を変化と状態で区別する。"},{"w":"be about to","pos":"熟","m":"まさに〜しようとする","nu":"ある動作が今にも始まろうとしている、直前の瞬間を表す表現。","ph":"be about to leave home","phm":"まさに家を出ようとしている","ex":"The train seemed to be about to leave when we arrived.","exm":"私たちが到着した時、電車はまさに出発しようとしているようだった。","us":"about to の後は動詞原形。just を前に置くと「ちょうど今」の意味が強まる。","tip":"about（〜のあたりに）＋to不定詞で「まさに直前」とイメージする。"},{"w":"be likely to","pos":"熟","m":"〜しそうだ","nu":"可能性が高いと予想されることを客観的に述べる表現。","ph":"be likely to rain tonight","phm":"今夜は雨が降りそうだ","ex":"The test results are said to be likely to improve next term.","exm":"テストの結果は来学期には上がりそうだと言われている。","us":"後ろに動詞原形が続く。it is likely that ... の形に書き換え可能。","tip":"likely（ありそうな）を主語の性質として使うと覚える。反意語は be unlikely to。"},{"w":"be able to","pos":"熟","m":"〜できる","nu":"生まれつきや訓練によって、何かを行う十分な力があることを示す表現。","ph":"be able to swim fast","phm":"速く泳ぐことができる","ex":"With more practice, you will be able to speak English fluently.","exm":"もっと練習すれば、あなたは英語を流暢に話せるようになるだろう。","us":"can と違い未来形・完了形でも使える。to の後は動詞原形になる。","tip":"can の代わりに他の助動詞と組み合わせたい時に be able to を使うと覚える。"},{"w":"be supposed to","pos":"熟","m":"〜することになっている","nu":"規則・約束・予定などにより、そうすべきだとされていることを表す。","ph":"be supposed to arrive by noon","phm":"正午までに到着することになっている","ex":"He seems to be supposed to give the opening speech.","exm":"彼は開会のスピーチをすることになっているようだ。","us":"後ろに動詞原形が続く。話し言葉では should に近い軽い義務・予定を表す。","tip":"suppose（想定する）の受け身から生まれた表現で、should と近い意味だと覚える。"},{"w":"be responsible for","pos":"熟","m":"〜に責任がある","nu":"ある役割や結果に対して責任を負う立場にあることを表す表現。","ph":"be responsible for cleaning the room","phm":"部屋の掃除の責任がある","ex":"Each member is expected to be responsible for one class duty.","exm":"各部員は一つのクラス当番に責任を持つことが期待されている。","us":"for の後には担当する仕事・結果がくる。in charge of とほぼ同じ意味で使える。","tip":"response（応答）と語源が近く、結果に応える立場とイメージすると覚えやすい。"},{"w":"be satisfied with","pos":"熟","m":"〜に満足している","nu":"結果や状況に十分納得し、不満がない気持ちを表す表現。","ph":"be satisfied with the result","phm":"その結果に満足している","ex":"Our teacher seemed to be satisfied with our group presentation.","exm":"先生は私たちのグループ発表に満足しているようだった。","us":"with の後には満足の対象がくる。物事が主語の satisfying との使い分けに注意する。","tip":"satisfy（満足させる）の受け身形で、be pleased with と似た意味だと覚える。"},{"w":"a lot of","pos":"熟","m":"たくさんの","nu":"数・量ともに使え、可算・不可算どちらの名詞にも使える便利な表現。","ph":"a lot of homework","phm":"たくさんの宿題","ex":"We still have a lot of homework to finish before Friday.","exm":"金曜日までに終わらせるべき宿題がまだたくさんある。","us":"後ろの名詞が単数か複数かで動詞の形が変わる。lots of とほぼ同じ意味で使う。","tip":"many（可算）・much（不可算）の区別を気にせず使える便利な表現と覚える。"},{"w":"a few","pos":"熟","m":"少しの；数個の","nu":"数えられる名詞に対して肯定的に「少しはある」ことを表す表現。","ph":"a few close friends","phm":"数人の親しい友人","ex":"She invited a few close friends to her small birthday party.","exm":"彼女は自分の小さな誕生日パーティーに数人の親しい友人を招待した。","us":"可算名詞の複数形とともに使う。冠詞なしの few は否定的な「ほとんどない」を表す。","tip":"a がつくと肯定的、a がないと否定的というニュアンスの違いで覚える。"},{"w":"a little","pos":"熟","m":"少し；少量の","nu":"不可算名詞に対して肯定的に「少しはある」ことを表す表現。","ph":"a little more time","phm":"もう少しの時間","ex":"He always asks for a little more time to finish his homework.","exm":"彼はいつも宿題を終えるのにもう少し時間がほしいと頼む。","us":"不可算名詞とともに使う。冠詞なしの little は否定的な「ほとんどない」を表す。","tip":"a few（可算）と a little（不可算）をセットで対比して覚える。"},{"w":"a number of","pos":"熟","m":"いくつかの；多数の","nu":"はっきりしないが、ある程度まとまった数量を表す表現。","ph":"a number of reasons","phm":"いくつかの理由","ex":"There are a number of reasons why the trip was canceled.","exm":"その旅行が中止になった理由はいくつかある。","us":"後ろは複数名詞で動詞も複数扱い。the number of（〜の数）は単数扱いになる点と区別する。","tip":"a number of は多い、the number of は数そのものと意味の違いで覚える。"},{"w":"a variety of","pos":"熟","m":"様々な；種々の","nu":"種類が豊富でバラエティーに富んでいることを強調する表現。","ph":"a variety of activities","phm":"様々な活動","ex":"Our school festival offers a variety of activities for every student.","exm":"私たちの学園祭は、すべての生徒に様々な活動を提供する。","us":"後ろの名詞は複数形が基本。形容詞 various との品詞の違いに注意する。","tip":"vary（変化する）と語根が同じで、変化に富むイメージで覚える。"},{"w":"a kind of","pos":"熟","m":"一種の；〜のようなもの","nu":"はっきり分類しにくい物事を「〜のようなもの」と和らげて言う表現。","ph":"a kind of sport","phm":"一種のスポーツ","ex":"Badminton could be described as a kind of fast indoor sport.","exm":"バドミントンは一種の速い室内スポーツだと言えるだろう。","us":"後ろに単数形の名詞が続くのが基本。口語の sort of もほぼ同じ意味で使われる。","tip":"kind（種類）に of（〜の）がついて「〜という種類のもの」と考える。"},{"w":"in front of","pos":"熟","m":"〜の前に","nu":"人や物の正面・目の前という空間的な位置関係を表す表現。","ph":"in front of the school gate","phm":"校門の前で","ex":"He waited in front of the school gate for his friend.","exm":"彼は友達を校門の前で待っていた。","us":"behind（〜の後ろに）の反意語として覚える。人前でのスピーチなど比喩的にも使う。","tip":"front（正面）＋of（〜の）で「〜の正面に」というイメージ。"},{"w":"in fact","pos":"熟","m":"実は；実際に","nu":"前の内容を補足・強調したり、予想と違う事実を示す時に使う表現。","ph":"in fact, he was right","phm":"実は彼が正しかった","ex":"The quiz looked difficult, but in fact it was quite easy.","exm":"そのクイズは難しく見えたが、実は結構簡単だった。","us":"文頭・文中どちらにも置ける。actually とほぼ同じ働きをする語である。","tip":"fact（事実）に基づいて話すイメージから「実は」の意味になると覚える。"},{"w":"in addition to","pos":"熟","m":"〜に加えて","nu":"既にある事柄に、さらに別の事柄を付け加えることを表す表現。","ph":"in addition to homework","phm":"宿題に加えて","ex":"He studies for exams in addition to attending soccer practice daily.","exm":"彼は毎日サッカーの練習に参加することに加えて、試験勉強もしている。","us":"後ろには名詞・動名詞がくる。文をつなぐ場合は in addition,（コンマ）を使う点と区別する。","tip":"addition（追加）という意味からそのまま「〜に加えて」と覚えられる。"},{"w":"in order to","pos":"熟","m":"〜するために","nu":"目的を明確に示して、その達成のための行動を述べる表現。","ph":"in order to pass the test","phm":"テストに合格するために","ex":"She studied every night in order to pass the entrance exam.","exm":"彼女は入学試験に合格するために毎晩勉強した。","us":"後ろは動詞原形。so that ... can（〜できるように）に書き換え可能である。","tip":"to不定詞の目的用法を強調した形と覚えると理解しやすい。"},{"w":"in spite of","pos":"熟","m":"〜にもかかわらず","nu":"予想や障害があっても、それに反する結果が起きることを表す表現。","ph":"in spite of the rain","phm":"雨にもかかわらず","ex":"The team kept practicing in spite of the heavy summer heat.","exm":"そのチームは厳しい夏の暑さにもかかわらず、練習を続けた。","us":"後ろには名詞・動名詞がくる。despite は of を伴わない点が異なる。","tip":"spite（反発）という語から「それに逆らって」というイメージで覚える。"},{"w":"in the future","pos":"熟","m":"将来；今後","nu":"これから先の、まだ来ていない時間について述べる表現。","ph":"do better in the future","phm":"将来はもっとうまくやる","ex":"Many students hope to study abroad in the future.","exm":"多くの生徒は将来、留学することを望んでいる。","us":"未来の予定・願望を述べる文でよく使う。near future（近い将来）の形でも使う。","tip":"future（未来）に the をつけて、これから先の時を漠然と指すと覚える。"},{"w":"in time","pos":"熟","m":"間に合って","nu":"期限や特定の瞬間に遅れず、ちょうど間に合うことを表す表現。","ph":"arrive in time for class","phm":"授業に間に合って到着する","ex":"We ran fast and arrived in time for the opening ceremony.","exm":"私たちは急いで走り、開会式に間に合って到着した。","us":"for＋名詞や to不定詞を伴うことが多い。on time（時間通りに）との違いに注意する。","tip":"期限に遅れない in time と、予定通りの on time をセットで区別して覚える。"},{"w":"on time","pos":"熟","m":"時間通りに","nu":"予定・時刻表どおりに、遅れも早すぎもせず行われることを表す。","ph":"finish the project on time","phm":"時間通りにプロジェクトを終える","ex":"Our train left the station exactly on time this morning.","exm":"今朝、私たちの電車はちょうど時間通りに駅を出発した。","us":"予定表・スケジュール通りという意味合いが強い。in time（間に合って）との違いを意識する。","tip":"on（ぴったり）＋time（時刻）で「時刻ぴったりに」と覚える。"},{"w":"at first","pos":"熟","m":"最初は；初めのうちは","nu":"物事の初期段階の状況を述べ、後の変化と対比して使うことが多い表現。","ph":"nervous at first","phm":"最初は緊張して","ex":"The math problem seemed hard at first, but he solved it.","exm":"その数学の問題は最初は難しく思えたが、彼はそれを解いた。","us":"後に but や however で状況の変化を続けることが多い。first of all と混同しないよう注意する。","tip":"最初の時点ではという時間の起点を示す表現だと覚える。"},{"w":"at last","pos":"熟","m":"ついに；とうとう","nu":"長く待った末についに実現する、という達成感や安堵を伴う言い方。","ph":"arrive at last","phm":"ついに到着する","ex":"We finished the difficult project at last after two long weeks.","exm":"私たちは2週間かけてついに大変なプロジェクトを終えた。","us":"文中や文末に置くのが普通で、良い出来事が実現したときに使うことが多い。at lengthはややかたい同義表現である。","tip":"last「最後の」からイメージし、「最後にようやく」と覚えると忘れにくい。"},{"w":"at least","pos":"熟","m":"少なくとも","nu":"数量や程度の下限を示し、実際にはそれ以上である可能性も含む言い方。","ph":"at least five minutes","phm":"少なくとも5分","ex":"You should study at least two hours before the exam tomorrow.","exm":"明日の試験前に少なくとも2時間は勉強すべきだ。","us":"数字の前に置いて下限を示すほか、悪い状況でも救いがある点を述べる際にも使う。","tip":"least「最も少ない」がベース。反対に上限を示すat mostとセットで覚えると整理しやすい。"},{"w":"at once","pos":"熟","m":"すぐに；同時に","nu":"時間を置かず即座に行動する意味と、複数の事を同時に行う意味の2用法がある。","ph":"leave at once","phm":"すぐに出発する","ex":"The teacher told the noisy students to be quiet at once.","exm":"先生は騒がしい生徒たちにすぐに静かにするよう言った。","us":"「すぐに」の意味ではimmediatelyに近くかたい命令文でも使う。「同時に」の意味ではall at onceの形もよく使われる。","tip":"once「一度」から「一度でまとめて」→同時に、と広がったと考えると整理しやすい。"},{"w":"for example","pos":"熟","m":"例えば","nu":"前で述べた内容について具体的な例を一つ挙げて説明を補うときに使う。","ph":"for example, apples","phm":"例えばりんご","ex":"Many fruits, for example, oranges and apples, contain vitamin C.","exm":"多くの果物、例えばオレンジやりんごにはビタミンCが含まれる。","us":"文中ではコンマで挟んで挿入することが多く、文頭に置くこともできる。","tip":"example「例」がそのまま核。for instanceと一緒に覚えると言い換え表現の幅が広がる。"},{"w":"for a while","pos":"熟","m":"しばらくの間","nu":"明確ではないが短すぎない、ある程度の時間の長さを漠然と表す表現。","ph":"wait for a while","phm":"しばらく待つ","ex":"Let's rest for a while before we continue the club practice.","exm":"部活の練習を続ける前にしばらく休もう。","us":"動詞の後に置いて継続する時間を表し、具体的な長さを示さない点がfor an hourなどと異なる。","tip":"while「しばらくの時間」という名詞用法から生まれた表現で、for a long timeより短めのイメージで覚える。"},{"w":"for the first time","pos":"熟","m":"初めて","nu":"生まれて初めて、またはある期間内で最初に経験することを強調する表現。","ph":"meet him for the first time","phm":"彼に初めて会う","ex":"I visited Kyoto with my family for the first time last spring.","exm":"私は去年の春、家族と初めて京都を訪れた。","us":"文末に置くことが多く、forを省いたthe first timeは「初めて〜したとき」という接続詞的な意味で使う。","tip":"first「最初の」がコア。for the second timeのように数字を変えて応用できる。"},{"w":"because of","pos":"熟","m":"〜のために；〜が原因で","nu":"直後に名詞（句）を続けて原因や理由を簡潔に示す前置詞的な表現。","ph":"cancel because of rain","phm":"雨のため中止する","ex":"The game was cancelled because of the sudden heavy rain.","exm":"試合は突然の大雨のため中止になった。","us":"後ろには名詞や動名詞を置き、節（主語+動詞）を続けるときはofを取ってbecauseのみを使う。","tip":"原因・結果を表すbecauseにofが付いた形だと考える。後ろが文ならbecause、名詞ならbecause ofと覚える。"},{"w":"thanks to","pos":"熟","m":"〜のおかげで","nu":"良い結果の理由をポジティブに述べる表現で、皮肉的に悪い結果に使うこともある。","ph":"thanks to your help","phm":"あなたの助けのおかげで","ex":"Our team improved a lot this season, thanks to our coach's advice.","exm":"私たちのチームはコーチの助言のおかげで、今シーズン大きく成長した。","us":"直後に名詞（句）を置き、基本的にはプラスの結果に使うが、皮肉として悪い結果に使われることもある。","tip":"thanks「感謝」が語源。感謝したくなる良い理由を表すとイメージすると覚えやすい。"},{"w":"instead of","pos":"熟","m":"〜の代わりに","nu":"ある選択肢をやめて別のものを選ぶという、置き換えの関係を表す表現。","ph":"instead of studying","phm":"勉強する代わりに","ex":"She chose to walk to school instead of taking the bus.","exm":"彼女はバスに乗る代わりに歩いて学校へ行くことにした。","us":"後ろには名詞や動名詞（-ing形）を置き、動詞の原形をそのまま続けない点に注意する。","tip":"instead「その代わりに」にofが付いて対象を明示した形だと覚える。"},{"w":"according to","pos":"熟","m":"〜によれば","nu":"情報の出どころとなる人・資料・データを示し、その内容を伝える際に使う。","ph":"according to the news","phm":"ニュースによれば","ex":"It will rain again tomorrow, according to the latest weather report.","exm":"最新の天気予報によれば、明日もまた雨が降るそうだ。","us":"情報源を示すために使い、自分自身の意見を述べるaccording to meのような使い方は避ける。","tip":"accord「一致する」から「〜と一致して」→「〜によれば」と派生したと考えると覚えやすい。"},{"w":"as well as","pos":"熟","m":"〜と同様に；〜に加えて","nu":"前に述べた事柄に別の事柄を付け加え、両方とも当てはまることを示す。","ph":"English as well as math","phm":"数学だけでなく英語も","ex":"She studies English as well as math every day after school.","exm":"彼女は放課後、毎日数学だけでなく英語も勉強している。","us":"A as well as Bの形でAが強調される点に注意し、動詞の人称や数はAに合わせる。","tip":"not only A but also Bとほぼ同じ意味だが、as well asの方が前の語を強調すると覚える。"},{"w":"as soon as","pos":"熟","m":"〜するとすぐに","nu":"2つの出来事の間にほとんど時間差がないことを示す接続表現。","ph":"as soon as possible","phm":"できるだけ早く","ex":"Please call me as soon as you arrive at the station.","exm":"駅に着いたらすぐに私に電話してください。","us":"未来のことを表す場合でも後ろの動詞は現在形にする点に注意し、as soon as possibleの形も頻出する。","tip":"soon「すぐに」が核で、比較のasが前後についた「同じくらいすぐ」という形だと考える。"},{"w":"as a result","pos":"熟","m":"結果として","nu":"前に述べた原因を受けて生じた結果を導入する、文と文をつなぐ表現。","ph":"as a result, improve","phm":"結果として向上する","ex":"He practiced every day, and as a result, his skills improved.","exm":"彼は毎日練習し、結果として技術が向上した。","us":"文頭やコンマの後に置いて前文の結果を述べ、as a result ofとすると後ろに名詞を続けられる。","tip":"result「結果」が核。原因を表すbecauseと、結果を表すas a resultをセットで整理すると覚えやすい。"},{"w":"each other","pos":"熟","m":"お互い（に）","nu":"2人以上の人が互いに同じ行為をし合う関係を表す代名詞的な表現。","ph":"help each other","phm":"お互いに助け合う","ex":"Good friends should always help each other when they have trouble.","exm":"良い友達は困ったときいつもお互いに助け合うべきだ。","us":"動詞や前置詞の目的語として使い、文の主語には使わない。3人以上ではone anotherも使われる。","tip":"each「それぞれ」とother「他者」で「それぞれが他者に」という関係をイメージすると覚えやすい。"},{"w":"right away","pos":"熟","m":"すぐに；直ちに","nu":"間を置かずただちに行動する、口語的でカジュアルな即時性を表す表現。","ph":"come right away","phm":"すぐに来る","ex":"If you feel sick, please tell your teacher right away.","exm":"気分が悪くなったら、すぐに先生に伝えてください。","us":"文末に置くことが多く、会話ではat onceやimmediatelyよりくだけた場面でよく使われる。","tip":"right「まさに」がawayを強めており、「まさにその場ですぐ」とイメージすると覚えやすい。"},{"w":"by the way","pos":"熟","m":"ところで","nu":"会話の流れを変えて、思いついた別の話題を切り出すときに使う前置き表現。","ph":"by the way, what time","phm":"ところで何時","ex":"Did you finish your homework for tomorrow's class, by the way?","exm":"ところで、明日の授業の宿題は終わった?","us":"話題転換の合図として使い、フォーマルな文章にはあまり使わない口語的な表現である。","tip":"way「道」から「話の途中で寄り道する」イメージを持つと使う場面が理解しやすい。"},{"w":"by mistake","pos":"熟","m":"間違って","nu":"わざとではなく、うっかりミスで何かをしてしまったことを表す。","ph":"delete it by mistake","phm":"間違って削除する","ex":"I sent the message to the wrong person by mistake yesterday.","exm":"私は昨日、間違ってメッセージを違う人に送ってしまった。","us":"動詞の後に置いて無意識のミスを表し、on purpose「わざと」と対で覚えると使い分けやすい。","tip":"mistake「間違い」が核。「間違いによって」→うっかりミスで、とそのままイメージできる。"},{"w":"on the other hand","pos":"熟","m":"一方（で）","nu":"前に述べた事柄と対比させて、別の側面や反対の意見を示す表現。","ph":"on the other hand, quiet","phm":"一方で静かだ","ex":"He is very active in sports; on the other hand, he studies little.","exm":"彼はスポーツにとても積極的だが、一方で勉強はあまりしない。","us":"前の文と対照的な内容を続ける際に使い、on one handと対で使われることもあるが省略される場合も多い。","tip":"hand「手」を両側に見立て、「もう片方の手では」という対比のイメージで覚える。"},{"w":"more and more","pos":"熟","m":"ますます；だんだん多く","nu":"時間の経過とともに程度や数量が徐々に増していく様子を表す。","ph":"more and more popular","phm":"ますます人気になる","ex":"Online classes are becoming more and more popular among high school students.","exm":"オンライン授業は高校生の間でますます人気になってきている。","us":"形容詞や動詞の前に置いて変化の進行を強調し、more and more difficultのように比較級と組み合わせても使う。","tip":"more「もっと」を重ねることで「だんだん増えていく」変化のイメージを強めた表現だと覚える。"},{"w":"no longer","pos":"熟","m":"もはや〜ない","nu":"以前はそうだったが、今はその状態や行為が続いていないことを表す。","ph":"no longer live here","phm":"もうここに住んでいない","ex":"My grandfather can no longer walk without using a cane.","exm":"祖父はもう杖なしでは歩けなくなった。","us":"通常はbe動詞や助動詞の後、一般動詞の前に置き、not ... any longerと書き換えられる。","tip":"long「長く」にnoが付いて「長くはもう〜ない」というイメージで、期間の終わりを表すと覚える。"}],"p2":[{"w":"achieve","pos":"動","m":"達成する；成し遂げる","nu":"努力の末に目標や成果を手に入れるという達成感を含む語。","ph":"achieve a goal","phm":"目標を達成する","ex":"She worked hard to achieve her dream of becoming a doctor.","exm":"彼女は医者になる夢を達成するために懸命に努力した。","us":"achieve+目的語（成果・目標など）の形で使う他動詞。名詞形achievement(達成)も頻出。","tip":"achieveは古フランス語で「頭(chief)に至る」が語源とされ、目標の頂点に到達するイメージで覚える。"},{"w":"provide","pos":"動","m":"与える；提供する","nu":"必要なものを相手に用意して渡すという中立的で丁寧な語感。","ph":"provide students with information","phm":"生徒に情報を提供する","ex":"The school will provide students with new textbooks this term.","exm":"学校は今学期、生徒たちに新しい教科書を提供する。","us":"provide A with B、またはprovide B for Aの形をとる。giveより公式な場面で使われる。","tip":"pro(前もって)+vide(見る)が語源で「前もって用意する」と結びつけて覚える。"},{"w":"require","pos":"動","m":"必要とする；要求する","nu":"規則や状況が客観的に何かを必須としているというやや硬い語。","ph":"require a lot of effort","phm":"多大な努力を必要とする","ex":"Learning a new language will require patience and daily practice.","exm":"新しい言語を学ぶことは忍耐と毎日の練習を必要とするだろう。","us":"require+名詞、require A to doの形もとる。needより形式的でルール性が強い場面に使う。","tip":"require=re(強意)+quire(求める、quest仲間)で「強く求める」と関連付ける。requirement(必要条件)も重要。"},{"w":"compare","pos":"動","m":"比べる；比較する","nu":"二つ以上のものの類似点・相違点を並べて見るという語。","ph":"compare A with B","phm":"AをBと比較する","ex":"Let's compare the prices of these two smartphones before buying.","exm":"買う前にこの2つのスマートフォンの値段を比較しよう。","us":"compare A with[to] Bの形で使う。toは類似性の指摘、withは詳細な比較に使うことが多い。","tip":"com(共に)+pare(等しくする、parは「等しい」の意)から「同等のものとして並べて見る」と覚える。"},{"w":"decrease","pos":"動","m":"減る；減らす","nu":"数量・程度が徐々に下がっていくという客観的で穏やかな変化を表す語。","ph":"decrease by 10 percent","phm":"10パーセント減少する","ex":"The number of students in this club may decrease after this year.","exm":"このクラブの部員数は今年以降減少するかもしれない。","us":"自動詞・他動詞どちらでも使える。decrease in/by〜の形で変化の程度を示す。反意語はincrease。","tip":"de(下へ)+crease(cresc、成長)で「成長の逆、下がる」と覚える。"},{"w":"increase","pos":"動","m":"増える；増やす","nu":"数量・程度が上がっていくことを表す最も基本的で中立的な語。","ph":"increase in number","phm":"数が増加する","ex":"The price of bus tickets will increase next month in our city.","exm":"私たちの街ではバスの運賃が来月値上がりする。","us":"自動詞・他動詞両方で使う。increase by(差)/to(結果の数値)の前置詞に注意。","tip":"in(中へ)+crease(cresc、成長)で「内側から成長する」イメージ。decreaseと対で覚える。"},{"w":"develop","pos":"動","m":"発達する；開発する","nu":"段階を経て成長・進化していく過程に焦点を当てた語。","ph":"develop a new app","phm":"新しいアプリを開発する","ex":"Our team spent months trying to develop a useful study app.","exm":"私たちのチームは役立つ学習アプリを開発するのに何ヶ月も費やした。","us":"develop+能力・技術・国など幅広い目的語をとる。名詞development(発展、開発)も頻出。","tip":"de(反対)+velop(包む、envelopeのvelop)で「包みを開いて広げる」と覚える。"},{"w":"create","pos":"動","m":"創造する；作り出す","nu":"何もないところから新しいものを生み出すという語感が強い。","ph":"create a new website","phm":"新しいウェブサイトを作る","ex":"My brother wants to create his own video game someday.","exm":"兄はいつか自分自身のビデオゲームを作りたいと思っている。","us":"他動詞でcreate+名詞の形。makeより「独創性・新規性」を強調する場面で使われる。","tip":"creator(創造者)、creative(創造的な)など派生語が多い。「クリエイティブ」のカタカナからイメージしやすい。"},{"w":"offer","pos":"動","m":"申し出る；提供する","nu":"相手のために自分から進んで何かを差し出すという積極的な姿勢を表す。","ph":"offer to help","phm":"手伝うことを申し出る","ex":"A kind classmate will offer to help me with my math homework.","exm":"親切なクラスメートが数学の宿題を手伝うと申し出てくれるだろう。","us":"offer to do、offer A B（AにBを提供する）の形で使う。名詞としても頻出（an offer）。","tip":"of(〜へ)+fer(運ぶ、ferはtransferのfer)で「相手へ運んでいく」と覚える。"},{"w":"avoid","pos":"動","m":"避ける","nu":"危険・不快なことが起こらないよう、自分から意図的に距離を置くという語感。","ph":"avoid making mistakes","phm":"間違いを避ける","ex":"You should avoid eating too much junk food before a test.","exm":"テスト前はジャンクフードを食べ過ぎないようにするべきだ。","us":"avoid+動名詞（-ing）をとり、avoid to doとは言わない点に注意。","tip":"a(離れて)+void(空にする)が語源とされ、「離れて空ける」とイメージすると覚えやすい。"},{"w":"consider","pos":"動","m":"考慮する；〜とみなす","nu":"決定の前にじっくりと時間をかけて検討するという語感。","ph":"consider the options","phm":"選択肢をよく考える","ex":"Please consider all the options before choosing your future job.","exm":"将来の仕事を選ぶ前にすべての選択肢をよく考えてください。","us":"consider+動名詞、またはconsider A（as）B「AをBとみなす」の形をとる。consider to doとは言わない。","tip":"con(共に)+sider(星)が語源とされ、星の位置を細かく観察するように物事を検討する、とイメージすると覚えやすい。"},{"w":"describe","pos":"動","m":"描写する；説明する","nu":"物事の様子や特徴を、聞き手に伝わるように言葉で詳しく伝えるという語。","ph":"describe a person","phm":"人物を描写する","ex":"Can you describe the man who took your bicycle yesterday?","exm":"昨日あなたの自転車を持って行った男性の特徴を説明してもらえますか。","us":"describe A as B「AをBと表現する」の形も頻出。名詞形はdescription。","tip":"de(完全に)+scribe(書く)で「詳しく書き記す」というイメージで覚える。"},{"w":"discuss","pos":"動","m":"議論する；話し合う","nu":"あるテーマについて複数人で意見を出し合うという語。","ph":"discuss the problem","phm":"問題について話し合う","ex":"Our group will discuss the topic before presenting it to the class.","exm":"私たちのグループはクラスに発表する前にそのテーマについて話し合う。","us":"他動詞なのでdiscuss about〜としないこと。discuss+名詞で直接目的語をとる点に注意。","tip":"dis(離れて)+cuss(打つ)で「打ち合って考えをほぐす」とイメージする。aboutが不要な点が最大の注意点。"},{"w":"encourage","pos":"動","m":"励ます；促す","nu":"相手が前向きに行動できるよう勇気や自信を与えるという語。","ph":"encourage students to read","phm":"生徒に読書を促す","ex":"Our coach always tries to encourage us before every important game.","exm":"私たちのコーチはいつも大事な試合前に私たちを励まそうとする。","us":"encourage A to doの形が基本。反意語discourage(やる気をなくさせる)とセットで覚える。","tip":"en(〜にする)+courage(勇気)で「勇気を与える」とそのままイメージできる語。"},{"w":"expect","pos":"動","m":"予期する；期待する","nu":"これから起こるだろうと前もって予測し、心の準備をするという語感。","ph":"expect good results","phm":"良い結果を期待する","ex":"My parents expect me to get good grades this semester.","exm":"両親は私が今学期良い成績を取ることを期待している。","us":"expect to do、expect A to doの形をとる。hopeより「予測」のニュアンスが強い。","tip":"ex(外へ)+spect(見る)で「先を見通す」と覚える。inspect(視察する)などspect仲間と関連付ける。"},{"w":"express","pos":"動","m":"表現する","nu":"心の中の考えや感情を言葉・態度で外に表すという語。","ph":"express your feelings","phm":"気持ちを表現する","ex":"It's important to express your feelings honestly to your friends.","exm":"友達に自分の気持ちを正直に表現することは大切だ。","us":"express oneself「自分を表現する」の形も頻出。名詞expression(表現)もよく使う。","tip":"ex(外へ)+press(押す)で「内側の思いを外へ押し出す」とイメージする。"},{"w":"include","pos":"動","m":"含む","nu":"全体の一部として、別の物やことがらを自然に取り込んでいるという語。","ph":"include a photo","phm":"写真を含める","ex":"The school trip fee will include lunch and transportation costs.","exm":"修学旅行の費用には昼食代と交通費が含まれる予定だ。","us":"他動詞でinclude+名詞。反意語exclude(除外する)とセットで覚えると整理しやすい。","tip":"in(中に)+clude(閉じる)で「中に閉じ込める→含む」とイメージする。"},{"w":"invent","pos":"動","m":"発明する","nu":"今までになかった新しい道具や仕組みをゼロから作り出すという語。","ph":"invent a new machine","phm":"新しい機械を発明する","ex":"Many students dream of a chance to invent something that changes lives.","exm":"多くの生徒は人々の生活を変える何かを発明する機会を夢見ている。","us":"他動詞。createより「実用的な物・装置」を新しく作る場面で使われることが多い。","tip":"in(上に)+vent(来る)で「偶然出くわして新しいものを見つけ出す」とイメージし、inventor(発明家)とセットで覚える。"},{"w":"involve","pos":"動","m":"巻き込む；伴う","nu":"ある物事や人が、別の事柄と切り離せない形で関わっているという語。","ph":"involve a lot of effort","phm":"多くの努力を伴う","ex":"This project will involve a lot of teamwork among club members.","exm":"このプロジェクトは部員間の多くのチームワークを伴うことになるだろう。","us":"be involved in〜の受動態でよく使われる。involve+動名詞の形も頻出（involve doing）。","tip":"in(中に)+volve(巻く)で「中に巻き込む」とイメージする。"},{"w":"manage","pos":"動","m":"何とかやり遂げる；管理する","nu":"困難な状況でも工夫して物事を成し遂げるという語感を持つ。","ph":"manage to finish","phm":"何とか終わらせる","ex":"Our club members always manage to finish work before the deadline.","exm":"私たちの部員はいつも締め切り前になんとか作業を終わらせる。","us":"manage to do「何とか〜する」の形が頻出。manage+名詞で「〜を管理する」の意味にもなる。","tip":"man(手)が語源とされ、「手で扱う→うまく処理する」とイメージすると覚えやすい。"},{"w":"mention","pos":"動","m":"言及する","nu":"話の流れの中でついでに軽く触れる、簡単に述べるという語感。","ph":"mention his name","phm":"彼の名前に言及する","ex":"She didn't mention the test when we talked at lunch today.","exm":"今日の昼食で話したとき、彼女はそのテストについて言及しなかった。","us":"他動詞でmention+名詞/that節をとる。not to mention〜「〜は言うまでもなく」も頻出表現。","tip":"mentionはmind(心)と語源が近く、「心に浮かんだことをちょっと述べる」とイメージする。"},{"w":"prevent","pos":"動","m":"防ぐ；妨げる","nu":"悪いことが起こらないように前もって手を打つという語。","ph":"prevent an accident","phm":"事故を防ぐ","ex":"Wearing a helmet can prevent serious injuries while cycling.","exm":"ヘルメットを着用することは自転車に乗る際の重傷を防ぐことができる。","us":"prevent A from doingの形が基本。preventの後にthat節は使わない点に注意。","tip":"pre(前に)+vent(来る)で「前もって立ちはだかる」とイメージすると覚えやすい。"},{"w":"produce","pos":"動","m":"生産する；生み出す","nu":"材料や努力から何かの結果・製品を作り出すという語。","ph":"produce good results","phm":"良い結果を生み出す","ex":"This factory can produce thousands of bicycles every single month.","exm":"この工場は毎月何千台もの自転車を生産することができる。","us":"他動詞。produceは名詞(農産物、アクセントは前)としても使われ、動詞(アクセントは後ろ)と発音が変わる点に注意。","tip":"pro(前へ)+duce(導く)で「前へ引き出す→生み出す」とイメージする。"},{"w":"realize","pos":"動","m":"気づく；実現する","nu":"今まで気づかなかったことをはっきりと理解するという語。","ph":"realize the importance","phm":"重要性に気づく","ex":"I didn't realize how much I missed my hometown until now.","exm":"今になってようやく故郷をどれほど恋しく思っていたか気づいた。","us":"realize+that節/名詞の形で使う。「実現する」の意味でもrealize a dreamのように使う。","tip":"real(現実)+ize(〜にする)で「現実のものとして理解する・実現する」とイメージする。"},{"w":"recommend","pos":"動","m":"勧める","nu":"自分の経験や知識をもとに良いと思うものを他人に勧めるという語。","ph":"recommend a book","phm":"本を勧める","ex":"My teacher will recommend a great novel for our summer reading list.","exm":"先生は夏休みの読書リストに素晴らしい小説を勧めてくれるだろう。","us":"recommend that S (should) do、recommend A to Bの形をとる。recommend to doとは言わない。","tip":"re(強意)+commend(称賛する、委ねる)で「良いものとして人に委ねる」とイメージする。"},{"w":"reduce","pos":"動","m":"減らす","nu":"量・程度・大きさなどを意図的に小さくするという語。","ph":"reduce waste","phm":"ゴミを減らす","ex":"Our city is trying to reduce plastic waste in the ocean.","exm":"私たちの街は海のプラスチックごみを減らそうとしている。","us":"他動詞でreduce A by/to〜の形をとる。decreaseより「意図的に減らす」ニュアンスが強い。","tip":"re(後ろへ)+duce(導く)で「後ろへ引いて小さくする」とイメージする。"},{"w":"remain","pos":"動","m":"残る；〜のままである","nu":"周りの状況が変わっても、そのままの状態がずっと続いているという語。","ph":"remain calm","phm":"冷静なままでいる","ex":"Please remain calm and follow the teacher during the fire drill.","exm":"避難訓練中は冷静さを保ち、先生の指示に従ってください。","us":"remain+形容詞（第2文型）でstayに近い意味になる。remain to be done「まだ〜されていない」も重要表現。","tip":"re(後に)+main(留まる)で「後に留まり続ける」とイメージする。"},{"w":"remove","pos":"動","m":"取り除く","nu":"邪魔なものやいらないものをその場から取り去るという語。","ph":"remove the stain","phm":"汚れを取り除く","ex":"Please remove your shoes before entering the school gym.","exm":"学校の体育館に入る前に靴を脱いでください。","us":"他動詞。remove A from Bの形で「BからAを取り除く」という場所関係を示す。","tip":"re(離れて)+move(動かす)で「離れた場所へ動かす→取り除く」とそのままイメージする。"},{"w":"replace","pos":"動","m":"取り替える","nu":"古い・壊れたものを新しい別のものと入れ替えるという語。","ph":"replace the battery","phm":"電池を交換する","ex":"We need to replace the broken window in the classroom soon.","exm":"教室の割れた窓をすぐに取り替える必要がある。","us":"replace A with B「AをBと取り替える」の形が基本。名詞replacement(交換品、後任)も頻出。","tip":"re(再び)+place(置く)で「別のものを再び置く」とイメージする。"},{"w":"respect","pos":"動","m":"尊敬する；尊重する","nu":"相手の価値や考え方を大切なものとして認めるという語。","ph":"respect other opinions","phm":"他人の意見を尊重する","ex":"We should respect other people's opinions even when we disagree.","exm":"たとえ意見が違っても私たちは他人の考えを尊重するべきだ。","us":"他動詞でrespect+人/考え方をとる。名詞としても同じ形（respect）で使われる。","tip":"re(再び)+spect(見る)で「もう一度よく見て価値を認める」とイメージする。"},{"w":"spread","pos":"動","m":"広まる；広げる","nu":"情報・病気・範囲などが一点から周囲へ拡大していくという語。","ph":"spread quickly","phm":"急速に広まる","ex":"The rumor about the new teacher spread quickly around school.","exm":"新しい先生についての噂は学校中にあっという間に広まった。","us":"過去形・過去分詞も同形spreadの不規則動詞。自動詞・他動詞両方で使う。","tip":"パンにジャムを塗る\"spread jam\"の場面と結びつけて、平らに広げるイメージで覚える。"},{"w":"support","pos":"動","m":"支える；支持する","nu":"人や意見、活動などを助け支えるという幅広く使える語。","ph":"support the team","phm":"チームを応援する","ex":"All my classmates came to support our team at the final game.","exm":"クラスメート全員が決勝戦で私たちのチームを応援しに来てくれた。","us":"他動詞でsupport+人/意見/活動をとる。名詞としても同形（support）で使われる。","tip":"sup(下から)+port(運ぶ)で「下から運んで支える」とそのままイメージする。"},{"w":"survive","pos":"動","m":"生き残る","nu":"命に関わるような危険や困難な状況を乗り越えて生き続けるという語。","ph":"survive the exam","phm":"試験を乗り切る","ex":"I don't know how I will survive this week's three exams.","exm":"今週の3つの試験をどう乗り切るのか自分でも分からない。","us":"自動詞・他動詞両方で使う。survive on〜「〜で生き延びる」も頻出。名詞survival(生存)。","tip":"sur(超えて)+vive(生きる)で「困難を超えて生きる」とイメージする。"},{"w":"waste","pos":"動","m":"無駄にする","nu":"時間・お金・資源などを有効に使わず失ってしまうという語。","ph":"waste time","phm":"時間を無駄にする","ex":"Don't waste your time playing games before the big test.","exm":"大事な試験前にゲームで時間を無駄にしてはいけない。","us":"waste+時間/お金+(in) doingの形も使う。名詞（ごみ、無駄）としても頻出。","tip":"wasteはラテン語vastus(荒れた、空っぽの)に由来し、荒れ地(wasteland)のイメージと結びつける。"},{"w":"gain","pos":"動","m":"得る；増す","nu":"努力や時間の経過を通じて少しずつ何かを手に入れるという語。","ph":"gain confidence","phm":"自信をつける","ex":"Practicing every day helped him gain confidence for the speech contest.","exm":"毎日練習したことが彼にスピーチコンテストへの自信をつけさせた。","us":"gain weight/experience/confidenceなど抽象名詞を目的語にとることが多い。反意語lose。","tip":"「利益を得る」のgainは、体重や経験など少しずつ積み上がるものを得る場面で使うと覚える。"},{"w":"raise","pos":"動","m":"上げる；育てる","nu":"何かに力を加えて高い位置へ持ち上げる、他者に働きかける動作を表す語。","ph":"raise your hand","phm":"手を挙げる","ex":"If you have a question, please raise your hand in class.","exm":"質問があれば授業中に手を挙げてください。","us":"他動詞なので必ず目的語をとる（raise+something）。自動詞のrise（上がる）と混同しやすいので注意。","tip":"raiseは他動詞、riseは自動詞。「raiseは物を上げる、riseは自ら上がる」と対で覚える。"},{"w":"reach","pos":"動","m":"到達する","nu":"目的地や目標、一定の水準までたどり着くという到達のイメージを持つ語。","ph":"reach the goal","phm":"目標に到達する","ex":"Our team hopes to reach the final round of this tournament.","exm":"私たちのチームは今回の大会で決勝ラウンドに到達することを望んでいる。","us":"他動詞でreach+場所/目標をとる。arriveと違いreach at〜のように前置詞を付けない点に注意。","tip":"reachは「手を伸ばして届く」が原義。arrive at/getと比べ前置詞不要な点で区別する。"},{"w":"recognize","pos":"動","m":"認識する；見分ける","nu":"以前に見聞きした情報をもとに、それだと分かるという語。","ph":"recognize a face","phm":"顔を見分ける","ex":"I almost didn't recognize my old friend after ten years.","exm":"10年ぶりだったので昔の友人だとほとんど気づかなかった。","us":"recognize A as B「AをBとして認める」の形も頻出。名詞recognition(認識、評価)。","tip":"re(再び)+cognize(知る)で「以前の知識をもう一度呼び起こす」とイメージする。"},{"w":"refuse","pos":"動","m":"拒否する；断る","nu":"求められたことをはっきりと受け入れないという意思を示す語。","ph":"refuse to answer","phm":"答えることを拒否する","ex":"He will politely refuse to lend his notebook to a stranger.","exm":"彼は見知らぬ人にノートを貸すことを丁寧に断るだろう。","us":"refuse to doの形が基本。名詞refusal(拒否)、似た語denyとの違いにも注意。","tip":"re(後ろへ)+fuse(注ぐ)で「相手からの申し出を押し戻す」とイメージする。"},{"w":"rely","pos":"動","m":"頼る；当てにする","nu":"誰か・何かが確実に助けてくれると信じて頼る気持ちを表す語。","ph":"rely on friends","phm":"友人を頼る","ex":"You can always rely on your classmates when you need help.","exm":"助けが必要なときはいつでもクラスメートを頼ることができる。","us":"rely on[upon]〜の形で必ず前置詞onを伴う自動詞。dependとほぼ同義。","tip":"re(強意)+ly(結ぶ)で「しっかり結びついて頼る」とイメージする。onを忘れないよう注意。"},{"w":"respond","pos":"動","m":"返事する；応じる","nu":"質問や出来事を受けて、考えたうえで言葉や行動で応じるという意味合いを持つ。","ph":"respond to a question","phm":"質問に答える","ex":"Please respond to my email before the club meeting starts tomorrow.","exm":"明日クラブのミーティングが始まる前に私のメールに返事してください。","us":"respond to ~ の形で使うことが多く、answerより丁寧でフォーマルな響きを持つ。","tip":"re-(返す)とspond(誓う、応じる)から成り、名詞responseと合わせて覚える。"},{"w":"serve","pos":"動","m":"仕える；役立つ；出す","nu":"人や目的のために働く、または食べ物・飲み物を提供する場面で使う語。","ph":"serve a purpose","phm":"目的にかなう","ex":"This old bicycle can still serve me well on my way to school.","exm":"この古い自転車は今でも私の通学に役立ってくれる。","us":"serve as ~で「〜として機能する」、serve+人+食べ物で「人に食べ物を出す」の形もよく使う。","tip":"テニスの「サーブ」と同じ語で、「相手に差し出す」イメージから「仕える・提供する」に広がった。"},{"w":"suffer","pos":"動","m":"苦しむ；かかる","nu":"痛み・被害・病気など好ましくない状態を経験することを表す語。","ph":"suffer from a cold","phm":"風邪で苦しむ","ex":"Many students suffer from stress during the week of final exams.","exm":"多くの生徒が期末試験の週にストレスに苦しんでいる。","us":"suffer from+病気・苦痛の形が定番で、suffer damage/lossのように名詞を直接目的語にも取れる。","tip":"名詞sufferingは「苦しみ」。sufficient(十分な)と綴りが似ているので混同しないよう注意する。"},{"w":"supply","pos":"動","m":"供給する；供給","nu":"必要とされている物やサービスを与え、需要を満たすという意味合いが強い語。","ph":"supply and demand","phm":"需要と供給","ex":"Our school will supply new textbooks to every student next semester.","exm":"私たちの学校は来学期、全生徒に新しい教科書を供給する予定だ。","us":"supply A with B、またはsupply B to Aの形で「AにBを供給する」を表す。","tip":"反対の意味を持つdemand(需要)とセットで、supply and demandという表現で覚えると定着しやすい。"},{"w":"suppose","pos":"動","m":"思う；仮定する","nu":"確実な根拠がなくても、たぶんそうだろうと考えるときに使う控えめな語。","ph":"I suppose so","phm":"たぶんそうだと思う","ex":"I suppose the bus will arrive late because of the heavy rain.","exm":"大雨のせいでバスは遅れて到着するだろうと私は思う。","us":"be supposed to ~で「〜することになっている、〜するはずだ」という重要表現になる。","tip":"thinkより確信度が低く控えめな推量を表す。be supposed toの形も必ず一緒に覚える。"},{"w":"trust","pos":"動","m":"信頼する；信頼","nu":"相手が正直で頼れると信じ、安心して任せられると感じる気持ちを表す。","ph":"trust each other","phm":"お互いを信頼する","ex":"Good teammates trust each other even after losing an important game.","exm":"良いチームメイトは大事な試合に負けた後でもお互いを信頼する。","us":"trust+人で「人を信頼する」、trust in ~で「〜を信用する」という形も取る。","tip":"名詞trust(信頼)と同形。believe(内容を信じる)とtrust(人や物を信頼する)の違いを意識する。"},{"w":"accept","pos":"動","m":"受け入れる","nu":"提案・招待・状況などを、拒まずに受け取るという前向きな行為を表す。","ph":"accept an invitation","phm":"招待を受け入れる","ex":"She decided to accept the invitation to her friend's birthday party.","exm":"彼女は友達の誕生日パーティーへの招待を受け入れることに決めた。","us":"acceptは他動詞で直接目的語を取る。receive(受け取るだけ)とは違い、承諾・同意のニュアンスを含む。","tip":"反対語はrefuse(断る)。名詞形acceptance(受け入れ)とあわせて覚えるとよい。"},{"w":"admit","pos":"動","m":"認める；入場を許す","nu":"事実や過ちを正直に認めたり、人の入場・入学を許可したりする意味を持つ。","ph":"admit a mistake","phm":"過ちを認める","ex":"He had to admit his mistake in front of the whole class.","exm":"彼はクラス全員の前で自分の間違いを認めなければならなかった。","us":"admit doing ~で「〜したことを認める」、admit to ~の形も使われる。","tip":"「入場を認める」の意味からadmission(入場、入学)という名詞が生まれたと覚える。"},{"w":"affect","pos":"動","m":"影響を与える","nu":"物事や状況が人・結果に変化をもたらすときに使う、やや客観的な語。","ph":"affect the result","phm":"結果に影響する","ex":"Poor sleep can affect a student's concentration during morning classes.","exm":"睡眠不足は生徒の午前中の授業での集中力に影響を与えることがある。","us":"他動詞で前置詞なしに目的語を取る。名詞effect(結果、影響)とのスペル・品詞の違いに注意する。","tip":"affect(動詞、影響を与える)とe

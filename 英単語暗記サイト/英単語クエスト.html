hedule.","exm":"コーチは新しい練習スケジュールについて明確な指示を出した。","us":"instructions, rules, consentなど名詞を修飾することが多い。反意語implicitとセットで対比を意識すると覚えやすい。","tip":"ex-(外に)+plicare(折りたたむ)が語源で「折りたたんだものを開いて見せる」イメージ。implicitとの対比で暗記する。"},{"w":"exploit","pos":"動","m":"利用する；搾取する","nu":"資源や機会を有効活用する意味と、人を不当に利用するという否定的な意味の両方を持つ。","ph":"exploit natural resources","phm":"天然資源を利用する","ex":"The company plans to exploit new resources found near the coast.","exm":"その会社は沿岸近くで見つかった新資源を活用する計画だ。","us":"名詞exploitはアクセントが前、動詞はアクセントが後になる点に注意。文脈で肯定的か否定的かを判断する。","tip":"exploitation(搾取)という名詞もニュースでよく使われる。利用と搾取の両義性を意識して覚える。"},{"w":"extract","pos":"動","m":"抽出する；引き出す","nu":"全体から一部分を注意深く取り出すことを表し、情報・成分など具体・抽象の両方に使う。","ph":"extract information from","phm":"～から情報を引き出す","ex":"Reporters tried to extract information from the tired coach after the game.","exm":"記者たちは試合後、疲れたコーチから情報を引き出そうとした。","us":"extract A from Bの形で頻出。名詞としても抜粋やエキスの意味で使われる。","tip":"ex-(外へ)+trahere(引く)が語源で「引っ張り出す」イメージ。tractor(トラクター)と語根traが共通。"},{"w":"feasible","pos":"形","m":"実行可能な","nu":"計画や方法が現実的に実行できると判断される様子を表し、possibleより実現性の検討が伴う。","ph":"a feasible plan","phm":"実行可能な計画","ex":"Is it feasible to finish this science project by Friday?","exm":"この理科の課題を金曜日までに終わらせるのは実現可能だろうか。","us":"「It is feasible to do ~」や「a feasible solution/plan」の形でよく使う。名詞形feasibility(実現可能性)も重要。","tip":"語根fea-はラテン語facere(行う)に由来し、行うことができるイメージ。possibleより現実的な計画性を含意する。"},{"w":"fluctuate","pos":"動","m":"変動する","nu":"数値や状態が一定せず上下に不規則に変化することを表し、株価や気温などによく使われる。","ph":"fluctuate widely","phm":"大きく変動する","ex":"Prices at the school shop fluctuate widely during festival season.","exm":"学園祭の時期には学校の売店の価格が大きく変動する。","us":"自動詞で「fluctuate between A and B」の形もよく使う。名詞形fluctuation(変動)も合わせて覚える。","tip":"ラテン語fluctus(波)が語源で、波のように上下する動きをイメージすると覚えやすい。"},{"w":"formulate","pos":"動","m":"策定する；まとめる","nu":"考えや計画を体系立てて明確な形に組み立てることを表す、ややフォーマルな動詞。","ph":"formulate a strategy","phm":"戦略を練り上げる","ex":"The committee met to formulate a new strategy for the festival.","exm":"委員会は学園祭の新しい戦略を策定するために集まった。","us":"formulate a plan/policy/questionなど、抽象的な成果物を目的語に取ることが多い。名詞形formula(公式)と語源が同じ。","tip":"formula(公式)から派生した語で、公式のようにきちんと組み立てるイメージを持つと覚えやすい。"},{"w":"framework","pos":"名","m":"枠組み；骨組み","nu":"物事を考えたり組み立てたりする際の基本となる構造や体系を指す語。","ph":"within a framework","phm":"枠組みの中で","ex":"The teacher explained the framework for our group research project.","exm":"先生は私たちのグループ研究の枠組みを説明した。","us":"「a framework for/of ~」の形で使う。物理的な骨組みだけでなく、法律・理論・組織の構造にも使う抽象語。","tip":"frame(枠)+work(構造物)が組み合わさった語で、骨組みとなる構造というイメージそのまま覚えられる。"},{"w":"hierarchy","pos":"名","m":"階層；序列","nu":"組織や集団の中で上下関係・順位が明確に構造化されていることを指す語。","ph":"a strict hierarchy","phm":"厳格な階層","ex":"Our school club follows a clear hierarchy from captain to members.","exm":"私たちの部活は主将から部員まで明確な階層に従っている。","us":"「social hierarchy」「corporate hierarchy」のように組織構造を表す文脈で頻出する。形容詞形hierarchicalも覚えておく。","tip":"ギリシャ語hieros(神聖な)+arkhia(支配)が語源。もとは聖職者の階級制度を指した語だと知ると印象に残る。"},{"w":"hinder","pos":"動","m":"妨げる；邪魔する","nu":"進歩や行動を遅らせたり困難にしたりすることを表し、preventより完全に止めるわけではない。","ph":"hinder progress","phm":"進歩を妨げる","ex":"Poor lighting in the gym can hinder progress during practice.","exm":"体育館の照明が悪いと練習中の上達を妨げることがある。","us":"hinder A from doingやhinder progress/developmentのように使う。preventは完全阻止、hinderは遅延・妨害のニュアンスが強い。","tip":"obstacle(障害物)と似た場面で使われるが、hinderは動詞で進行を遅らせるイメージを持つと区別しやすい。"},{"w":"hostile","pos":"形","m":"敵意のある；敵対的な","nu":"相手に対して強い反感や敵意を示す態度・環境を表す形容詞。","ph":"a hostile reaction","phm":"敵意のある反応","ex":"The visiting team received a hostile reaction from the home crowd.","exm":"遠征チームは地元の観客から敵意のある反応を受けた。","us":"「hostile to/toward ~」の形で前置詞を伴うことが多い。名詞形hostility(敵意)もセットで覚える。","tip":"英語のhost(もてなす側)と共通の語源(ラテン語hostis「よそ者・敵」)を持つ語。friendlyの対義語として覚えると効率的。"},{"w":"identical","pos":"形","m":"同一の；全く同じ","nu":"二つ以上のものが細部まで完全に同じであることを表し、equivalentより厳密な一致を示す。","ph":"identical twins","phm":"一卵性双生児","ex":"My identical twin brothers are hard for teachers to tell apart.","exm":"私の一卵性双生児の兄弟は先生たちにも見分けがつきにくい。","us":"「identical to ~」の形で前置詞toを伴う。similarとの違いはほぼ同じではなく完全に同じである点。","tip":"identity(同一性・身元)と語根が同じ。同じidentityを持つと考えると意味がつながりやすい。"},{"w":"ideology","pos":"名","m":"イデオロギー；思想","nu":"政治・社会に関する体系立った信念や価値観のまとまりを指すやや硬い語。","ph":"political ideology","phm":"政治的イデオロギー","ex":"The history teacher compared political ideology across different countries in class.","exm":"歴史の先生は授業でさまざまな国の政治的イデオロギーを比較した。","us":"不可算名詞として思想体系全般を指すことも、可算名詞として特定の主義を指すこともある。","tip":"idea(観念)+-logy(学・論)が語源で「観念の体系」というイメージを持つと覚えやすい。"},{"w":"immune","pos":"形","m":"免疫の；影響されない","nu":"病気に対する抵抗力を持つ意味と、批判や影響を受けない意味の両方で使われる形容詞。","ph":"immune to criticism","phm":"批判に影響されない","ex":"No student seems completely immune to stress before final exams.","exm":"期末試験前のストレスから完全に無縁でいられる生徒はいないようだ。","us":"「immune to/from ~」の形をとる。医学的な意味(immune system)と比喩的な意味の両方を押さえておく。","tip":"immunity(免疫・免除)という名詞形も頻出。守られていて影響を受けないイメージで覚える。"},{"w":"imperative","pos":"形","m":"必須の；絶対必要な","nu":"状況上どうしても必要で緊急性が高いことを表す、essentialより強い語気を持つ語。","ph":"it is imperative that","phm":"～することが不可欠だ","ex":"It is imperative that every player arrive on time tomorrow.","exm":"明日は全選手が時間通りに到着することが絶対に必要だ。","us":"「It is imperative that S (should) 原形」のように仮定法現在を伴う文型でよく使われる。名詞としても必須事項の意味がある。","tip":"emperor(皇帝)と語根が近く、命令する権威から必ず従うべきというイメージにつながる。"},{"w":"implement","pos":"動","m":"実行する；実施する","nu":"決定された計画や制度を具体的な行動として実際に導入することを表す。","ph":"implement a new policy","phm":"新しい方針を実施する","ex":"The principal will implement a new policy on smartphone use next term.","exm":"校長は来学期からスマートフォン使用に関する新しい方針を実施する予定だ。","us":"implement a plan/policy/systemなど、公的・組織的な決定を実行に移す文脈で使われることが多い。名詞形implementation(実施)も重要。","tip":"executeと似るが、implementは制度・方針を導入する文脈でよく使われる点を意識すると区別しやすい。"},{"w":"implicit","pos":"形","m":"暗黙の；言外の","nu":"直接言葉にされていないが、状況や文脈から理解される意味・態度を表す。","ph":"implicit trust","phm":"暗黙の信頼","ex":"There was an implicit rule about sharing snacks in our classroom.","exm":"私たちの教室にはお菓子を分け合うという暗黙のルールがあった。","us":"explicit(明示的な)の対義語として対比で覚えると効果的。「implicit in ~」の形で～に内在するの意味にもなる。","tip":"im-(中に)+plicare(折りたたむ)が語源で、中に折りたたまれ隠れている意味合いをイメージする。"},{"w":"incentive","pos":"名","m":"動機；奨励金","nu":"人により良い行動を取らせるための金銭的・心理的な誘因を指す語。","ph":"a strong incentive","phm":"強い動機付け","ex":"Extra points gave students a strong incentive to finish homework early.","exm":"追加ポイントは生徒に宿題を早く終わらせる強い動機を与えた。","us":"「an incentive to do / for ~」の形をとる。motivationより外的な報酬・誘因というニュアンスが強い。","tip":"incentiveのcentは歌う意味のcantareに由来し、気持ちを駆り立てるというイメージにつながる。"},{"w":"incorporate","pos":"動","m":"取り入れる；組み込む","nu":"別の要素を全体の一部として組み込み、統合することを表す動詞。","ph":"incorporate feedback into","phm":"フィードバックを取り入れる","ex":"She decided to incorporate her classmates' feedback into the final speech.","exm":"彼女はクラスメートの意見を最終スピーチに取り入れることにした。","us":"「incorporate A into B」の形が頻出。ビジネスでは法人化するという専門的な意味もある。","tip":"in-(中に)+corpus(体)が語源で、体の中に組み込むイメージから統合する意味につながる。"},{"w":"indigenous","pos":"形","m":"先住の；固有の","nu":"ある土地に古くから自然に存在し、他から持ち込まれたものではないことを表す。","ph":"indigenous people","phm":"先住民","ex":"Our history class studied the culture of indigenous people in Australia.","exm":"私たちの歴史の授業ではオーストラリアの先住民の文化を学んだ。","us":"「indigenous to ~」で～に固有のという形もとる。動植物にも人々にも使える語。","tip":"nativeとほぼ同義だが、indigenousはより学術的・公式な文脈で使われることが多い。"},{"w":"induce","pos":"動","m":"誘発する；促す","nu":"ある行動や状態、感情などを間接的に引き起こすことを表すやや硬い語。","ph":"induce sleep","phm":"眠気を誘う","ex":"Warm milk before bed is said to induce sleep more easily.","exm":"就寝前の温かい牛乳は眠気をより誘うと言われている。","us":"「induce A to do」でAに～させるの意味にもなる。医学・心理学の文脈で頻出する。","tip":"in-(中へ)+ducere(導く)が語源で、内側から導き出すイメージ。introduce(紹介する)と語根が共通。"},{"w":"infer","pos":"動","m":"推論する；推測する","nu":"直接示されていない情報を、手がかりや文脈から論理的に導き出すことを表す。","ph":"infer from the context","phm":"文脈から推測する","ex":"Students had to infer the author's opinion from the passage.","exm":"生徒たちは文章から筆者の意見を推測しなければならなかった。","us":"「infer A from B」の形が頻出。imply(暗示する)と混同しやすいが、inferは読み手・聞き手側の行為である点に注意。","tip":"imply(話し手が暗示する)とinfer(聞き手が推測する)は対の関係にあると覚えると区別しやすい。"},{"w":"infrastructure","pos":"名","m":"インフラ；基盤設備","nu":"道路・電力・通信網など社会を支える基礎的な設備やシステム全体を指す。","ph":"public infrastructure","phm":"公共インフラ","ex":"The typhoon damaged public infrastructure such as roads and power lines.","exm":"台風は道路や電線などの公共インフラに被害を与えた。","us":"通常不可算名詞として扱う。物理的な設備だけでなく、教育・医療制度など社会的基盤を指すこともある。","tip":"infra-(下に)+structure(構造)が語源で、社会の下支えとなる構造というイメージそのまま覚えられる。"},{"w":"inherent","pos":"形","m":"固有の；本来備わった","nu":"ある性質が対象に元々備わっていて切り離せないことを表す形容詞。","ph":"inherent in","phm":"～に本来備わっている","ex":"Some risk is inherent in almost every outdoor school activity.","exm":"ほとんどの屋外の学校行事にはある程度のリスクが本来つきものだ。","us":"「inherent in ~」の形で前置詞inを伴う点に注意する。intrinsicとほぼ同義で置き換え可能な場面が多い。","tip":"in-(中に)+haerere(くっつく)が語源で、中にくっついて離れない性質というイメージを持つ。"},{"w":"inhibit","pos":"動","m":"抑制する；妨げる","nu":"感情・行動・成長などを内側から抑えて起こりにくくすることを表す語。","ph":"inhibit growth","phm":"成長を抑制する","ex":"Lack of sunlight can inhibit the growth of plants indoors.","exm":"日光不足は屋内の植物の成長を抑制することがある。","us":"preventのように完全に止めるのではなく、遅らせたり弱めたりするニュアンスを持つ。心理学ではinhibitionsで抑制・ためらいの意味になる。","tip":"hinderと似るが、inhibitは化学・生物・心理的な抑制作用を表す専門的な文脈でよく使われる。"},{"w":"initiative","pos":"名","m":"主導権；新たな取り組み","nu":"自ら進んで行動を起こす力、または新しく始められた計画・活動を指す。","ph":"take the initiative","phm":"率先して行動する","ex":"One student took the initiative to organize the charity event.","exm":"ある生徒が率先してチャリティーイベントを企画した。","us":"「take the initiative」で自発的に行動するという定型表現になる。プロジェクトの名称としても使われる。","tip":"initial(最初の)と同語源で、自分から最初の一歩を踏み出すイメージを持つと覚えやすい。"},{"w":"innate","pos":"形","m":"生まれつきの；先天的な","nu":"学習や経験によらず、生まれた時からその人・物に備わっている性質を表す。","ph":"innate ability","phm":"生まれ持った才能","ex":"Her innate ability to calm others made her a great leader.","exm":"他人を落ち着かせる生まれ持った能力が、彼女を優れたリーダーにした。","us":"innate ability/talent/qualityのように名詞を修飾する形が多い。acquired(後天的な)の対義語として覚えると整理しやすい。","tip":"in-(中に)+natus(生まれた)が語源で、生まれながらに内在するイメージ。inherentと意味が近い。"},{"w":"integrity","pos":"名","m":"誠実さ；完全性","nu":"道徳的に一貫して正しく行動する姿勢と、物事が損なわれず完全である状態の両方を指す。","ph":"act with integrity","phm":"誠実に行動する","ex":"The captain always tried to act with integrity during matches.","exm":"キャプテンは試合中いつも誠実に行動しようとした。","us":"「act with integrity」「academic integrity(学問的誠実さ)」のように使われる。物理的な意味では構造上の完全性も表す。","tip":"integer(整数・完全な)と同語源で、欠けたところがなく完全であるイメージから道徳的な誠実さにもつながる。"},{"w":"intact","pos":"形","m":"無傷の；そのままの","nu":"壊れたり変更されたりせず、元の状態が完全に保たれていることを表す形容詞。","ph":"remain intact","phm":"無傷のまま残る","ex":"Surprisingly, her phone remained intact after falling off the desk.","exm":"驚いたことに、彼女の携帯電話は机から落ちても無傷のままだった。","us":"「remain intact」「keep ~ intact」のように補語として使われることが多いが、限定用法(an intact specimenなど)で名詞を直接修飾することもある。","tip":"in-(否定)+tactus(触れられた)が語源で、手つかずのままというイメージから覚えやすい。"},{"w":"interfere","pos":"動","m":"干渉する；邪魔する","nu":"本来関わるべきでない事柄に割り込んで悪影響を与えることを表す自動詞。","ph":"interfere with","phm":"～を妨げる","ex":"Loud music from next door began to interfere with our study.","exm":"隣から聞こえる大音量の音楽が私たちの勉強の邪魔をし始めた。","us":"自動詞なので目的語をとる際は必ず前置詞withまたはinを伴う。他動詞disturbとの語法の違いに注意。","tip":"inter-(間に)+ferire(打つ)が語源で、間に割って入るイメージそのまま覚えられる。"},{"w":"intervene","pos":"動","m":"介入する；仲裁する","nu":"争いや問題が起きている状況に第三者として割って入り、事態を変えようとすることを表す。","ph":"intervene in a dispute","phm":"争いに介入する","ex":"The teacher had to intervene in a dispute between two students.","exm":"先生は二人の生徒間の言い争いに介入しなければならなかった。","us":"自動詞で「intervene in ~」の形をとる。名詞形intervention(介入)も政治・医療の文脈で頻出する。","tip":"inter-(間に)+venire(来る)が語源で、間に入ってくるイメージからinterfereより中立的・積極的な介入を表す。"},{"w":"intrinsic","pos":"形","m":"本質的な；固有の","nu":"外的な要因ではなく、そのもの自体が本来持っている性質・価値を表す形容詞。","ph":"intrinsic value","phm":"本質的な価値","ex":"Reading books has an intrinsic value beyond just passing exams.","exm":"読書には試験に合格すること以上の本質的な価値がある。","us":"「intrinsic to ~」の形で～に本来備わっているの意味にもなる。extrinsic(外的な)の対義語として押さえておく。","tip":"intrinsic motivation(内発的動機)とextrinsic motivation(外発的動機)の対比で心理学の文脈でもよく使われる。"},{"w":"intuition","pos":"名","m":"直感；直観","nu":"論理的な推論を経ずに物事を瞬時に感じ取り理解する働きを指す名詞。","ph":"trust your intuition","phm":"自分の直感を信じる","ex":"When solving tricky problems, she often trusts her intuition first.","exm":"難しい問題を解くとき、彼女はまず自分の直感を信じることが多い。","us":"不可算名詞として使うことが多い。形容詞形intuitive(直感的な)も頻出。","tip":"in-(中へ)+tueri(見る)が語源で、内側を見通す感覚というイメージを持つと覚えやすい。"},{"w":"irrigation","pos":"名","m":"灌漑；水を引くこと","nu":"農地に人工的に水を供給する仕組みを指す語で、agriculture(農業)と結びつきやすい。","ph":"irrigation system","phm":"灌漑システム","ex":"The farmers built an irrigation system to save the dry fields.","exm":"農家たちは乾いた畑を救うため灌漑システムを作った。","us":"通例不可算名詞。irrigate(動詞)の名詞形で、irrigation of ~の形でも使う。","tip":"動詞irrigateはwater(水をやる)のフォーマル版と考えると覚えやすい。"},{"w":"isolate","pos":"動","m":"孤立させる；分離する","nu":"他から切り離して単独の状態にすることを表し、社会的孤立にも化学的分離にも使う。","ph":"isolate oneself from","phm":"~から自分を孤立させる","ex":"Some students isolate themselves after moving to a new school.","exm":"新しい学校に転校した後、自分を孤立させる生徒もいる。","us":"isolate A from Bの形で「AをBから切り離す」。受け身のbe isolatedも頻出。","tip":"語源はラテン語で「島」を意味するinsula。isle(島)と同語源で「島のように孤立させる」とイメージする。"},{"w":"legislation","pos":"名","m":"法律；立法","nu":"議会が制定する法律全体を指す集合的な語で、個々の法律より制度としての側面を表す。","ph":"pass legislation","phm":"法律を可決する","ex":"The government plans to pass new legislation on school safety.","exm":"政府は学校の安全に関する新しい法律を可決する計画だ。","us":"不可算名詞で複数形にしない。a piece of legislationのように数える。","tip":"legis(法)から成る語。legal・legitimateと同じ語根legを持つ仲間だと覚える。"},{"w":"legitimate","pos":"形","m":"合法的な；正当な","nu":"法や規則、道理にかなっていて疑いの余地がないことを表す語。illegitimateが対義語。","ph":"legitimate reason","phm":"正当な理由","ex":"She had a legitimate reason for missing the club meeting yesterday.","exm":"彼女は昨日の部活のミーティングを休んだ正当な理由があった。","us":"名詞の前で使う用法が多い。動詞legitimize(正当化する)と混同しないこと。","tip":"legを含みlegal・legislationと同じ仲間。「法にかなった」が核となるイメージ。"},{"w":"liable","pos":"形","m":"責任がある；~しがちな","nu":"悪いことが起こる可能性が高いこと、または法的責任を負う立場にあることを示す語。","ph":"liable to","phm":"~しがちな、~の責任がある","ex":"Tired students are liable to make careless mistakes on tests.","exm":"疲れている生徒はテストでうっかりミスをしがちだ。","us":"be liable to doで「~しがちだ」、be liable for ~で「~の責任を負う」と前置詞で意味が変わる。","tip":"likely(~しそうだ)と近いが、liableは悪い結果や責任に使われやすい点が違う。"},{"w":"linguistic","pos":"形","m":"言語の；言語学の","nu":"言葉や言語そのもの、あるいは言語学という学問領域に関することを表す形容詞。","ph":"linguistic ability","phm":"言語能力","ex":"Learning a third language improved her overall linguistic ability quickly.","exm":"第三言語を学んだことで彼女の全体的な言語能力は素早く向上した。","us":"名詞linguistics(言語学)は単数扱いの学問名。linguist(言語学者)と混同しないよう注意。","tip":"lingua(舌・言語)が語根。bilingual(2言語の)と同じ仲間だと覚える。"},{"w":"literacy","pos":"名","m":"読み書き能力；識字","nu":"文字を読み書きできる力を指し、比喩的にcomputer literacyのように「基礎能力」にも広がる。","ph":"digital literacy","phm":"デジタルリテラシー","ex":"The school started a program to improve students' digital literacy skills.","exm":"その学校は生徒のデジタルリテラシー能力を高めるプログラムを始めた。","us":"不可算名詞。対義語はilliteracy(非識字)、形容詞はliterate/illiterate。","tip":"literal(文字通りの)・letter(文字)と同じ語根literを持つと覚えると忘れにくい。"},{"w":"longevity","pos":"名","m":"長寿；長く続くこと","nu":"人の寿命の長さだけでなく、物や関係が長期間続くことにも使える語。","ph":"increase longevity","phm":"寿命を延ばす","ex":"Regular exercise and good sleep can increase human longevity significantly.","exm":"定期的な運動と十分な睡眠は人の寿命を大幅に延ばすことができる。","us":"不可算名詞。longevity of ~の形で「~の長寿・存続期間」を表す。","tip":"long(長い)+aevum(生涯・時代)からできた語だと考えると意味を思い出しやすい。"},{"w":"magnitude","pos":"名","m":"規模；重大さ","nu":"出来事や数値の大きさ・重要度を表すフォーマルな語で、地震の規模にも問題の深刻さにも使う。","ph":"of great magnitude","phm":"非常に大きな規模の","ex":"Nobody expected a problem of this magnitude to occur so suddenly.","exm":"これほどの規模の問題がこんなに突然起こるとは誰も予想しなかった。","us":"an earthquake of magnitude 6のように地震の規模を表す専門用語としても頻出する。","tip":"magni(大きい)が語根。magnify(拡大する)・magnificent(壮大な)と仲間。"},{"w":"mandatory","pos":"形","m":"義務的な；必須の","nu":"規則や法律によって必ず行わなければならないことを表し、optionalの対義語として使われる。","ph":"mandatory attendance","phm":"出席必須","ex":"Attendance at the morning assembly is mandatory for all students.","exm":"朝礼への出席はすべての生徒にとって必須だ。","us":"It is mandatory for A to doやmandatory Nの形が多い。compulsoryと近い意味。","tip":"mandate(命令・権限)の形容詞形。mand(命じる)という語根を持つ。"},{"w":"manifest","pos":"動","m":"明らかにする；表れる","nu":"隠れていた性質や感情、症状などが目に見える形で現れることを表すフォーマルな語。","ph":"manifest itself","phm":"(症状などが)現れる","ex":"Her anxiety began to manifest itself as trouble sleeping at night.","exm":"彼女の不安は夜眠れないという形で現れ始めた。","us":"manifest itself as/inの形で「~という形で現れる」。形容詞用法「明白な」もある。","tip":"manus(手)+festus(捕まえた)が語源とされ「手でつかめるほど明白」とイメージする。"},{"w":"manipulate","pos":"動","m":"操作する；操る","nu":"物を巧みに扱う意味と、人を意のままに操って利用するという否定的な意味の両方を持つ。","ph":"manipulate data","phm":"データを操作する","ex":"It is dishonest to manipulate data just to support your opinion.","exm":"自分の意見を支持するためだけにデータを操作するのは不誠実だ。","us":"人に対して使うとしばしば「悪用して操る」という否定的ニュアンスになる点に注意する。","tip":"manus(手)が語源で元は「手で扱う」の意味。そこから「巧みに操る」へ発展した。"},{"w":"marginal","pos":"形","m":"わずかな；周辺的な","nu":"中心から外れた、あるいは重要度や量がごくわずかであることを表す語。","ph":"marginal improvement","phm":"わずかな改善","ex":"Her new study method only brought a marginal improvement in scores.","exm":"彼女の新しい勉強法は成績にわずかな改善しかもたらさなかった。","us":"marginal difference/effectのように名詞を修飾することが多い。副詞marginallyも頻出。","tip":"margin(余白・端)の形容詞形。「ページの端」から「わずかな」という意味に広がった。"},{"w":"mediate","pos":"動","m":"仲裁する；仲介する","nu":"対立する両者の間に立って合意へ導くことを表すフォーマルな語。","ph":"mediate a dispute","phm":"争いを仲裁する","ex":"The teacher had to mediate a dispute between two club members.","exm":"先生は部員2人の間の争いを仲裁しなければならなかった。","us":"mediate between A and Bの形も頻出。名詞形mediation、仲裁者はmediator。","tip":"medi(真ん中)が語根。middle・mediumと同じ仲間で「真ん中に入る」と覚える。"},{"w":"metabolism","pos":"名","m":"新陳代謝","nu":"体内で食物をエネルギーに変える化学的な働き全体を指す生物学用語。","ph":"boost metabolism","phm":"新陳代謝を高める","ex":"Regular exercise can help boost your metabolism throughout the day.","exm":"定期的な運動は一日を通して新陳代謝を高める助けになる。","us":"不可算名詞。形容詞形はmetabolic(例: metabolic rate 代謝率)。","tip":"meta(変化)+bole(投げる)が語源。「体の中で物質が変化していく」イメージ。"},{"w":"metaphor","pos":"名","m":"隠喩；比喩","nu":"「AはBだ」のようにたとえて表現する修辞技法で、直喩simile(like/asを使う比喩)と対比される。","ph":"a metaphor for","phm":"~の比喩","ex":"The poem uses the sea as a metaphor for endless love.","exm":"その詩は終わりのない愛の比喩として海を用いている。","us":"use A as a metaphor for Bの形が定番。形容詞はmetaphorical。","tip":"simileは「like/as」を使う直喩、metaphorはそれを使わない隠喩という違いで区別する。"},{"w":"migrate","pos":"動","m":"移住する；移動する","nu":"人が生活の場を求めて別の土地へ移ることや、動物が季節ごとに移動することを表す。","ph":"migrate to","phm":"~へ移住する、~へ渡る","ex":"Many birds migrate to warmer countries before winter begins here.","exm":"多くの鳥はここで冬が始まる前に暖かい国へ渡っていく。","us":"自動詞でmigrate to/fromの形。名詞migration、人はmigrant/immigrant/emigrantと使い分ける。","tip":"immigrate(入ってくる移住)・emigrate(出ていく移住)と違い、migrateは方向を問わない一般語。"},{"w":"minimal","pos":"形","m":"最小限の；最少の","nu":"量や程度が必要最低限まで小さいことを表し、maximalの対義語として使われる。","ph":"minimal effort","phm":"最小限の努力","ex":"He passed the quiz with minimal effort thanks to daily review.","exm":"毎日の復習のおかげで彼は最小限の努力でその小テストに合格した。","us":"with minimal ~、minimal riskなど名詞を直接修飾する用法が多い。副詞形はminimally。","tip":"minimum(最小限度)の形容詞版。miniやminorと同じ「小さい」を表す語根mini-を持つ。"},{"w":"molecule","pos":"名","m":"分子","nu":"原子が結びついてできる物質の最小単位を指す理科用語。","ph":"water molecule","phm":"水分子","ex":"Each water molecule is made of two hydrogen atoms and one oxygen atom.","exm":"それぞれの水分子は2つの水素原子と1つの酸素原子からできている。","us":"可算名詞。化学の授業でatom(原子)とセットで頻出する。","tip":"「モル」の元になった語。atomより一段階大きい「原子の集まり」だとイメージすると区別しやすい。"},{"w":"monopoly","pos":"名","m":"独占","nu":"特定の企業や個人が市場や権利を独り占めしている状態を表す経済用語。","ph":"have a monopoly on","phm":"~を独占している","ex":"One company seemed to have a monopoly on the local market.","exm":"ある一社がその地元市場を独占しているように見えた。","us":"have a monopoly on/overの形が頻出。可算名詞で複数monopoliesにもなる。","tip":"mono(単一)+poly(売る)が語源。「一社だけが売る」状態だと覚える。"},{"w":"mortality","pos":"名","m":"死亡率；死ぬこと","nu":"人が死を免れない存在であること、または集団における死亡の割合を表すフォーマルな語。","ph":"mortality rate","phm":"死亡率","ex":"New medicine has lowered the mortality rate for this disease.","exm":"新しい薬がこの病気の死亡率を下げた。","us":"mortality rateの形が最頻出コロケーション。対義語はimmortality(不死)。","tip":"mort(死)が語根。immortal(不死の)・mortal(死すべき)と同じ仲間で覚える。"},{"w":"namely","pos":"副","m":"すなわち；つまり","nu":"直前で述べた内容を具体的に言い換えたり例を挙げたりするときに使う説明的な副詞。","ph":"namely, ...","phm":"すなわち~","ex":"Two students, namely Aya and Ken, will represent our class tomorrow.","exm":"2人の生徒、すなわちアヤとケンが明日クラスを代表する。","us":"直前の名詞句を具体的に説明するときにカンマとともに使う。that is(to say)とほぼ同義。","tip":"name(名前)+lyから「名前を挙げて言うと」と考えると意味を覚えやすい。"},{"w":"norm","pos":"名","m":"規範；標準","nu":"社会やグループの中で当たり前とされる行動や基準を表す語。","ph":"social norm","phm":"社会規範","ex":"Wearing a uniform is a social norm at most Japanese high schools.","exm":"制服を着ることはほとんどの日本の高校で社会規範だ。","us":"可算名詞。形容詞normal(普通の)、動詞normalize(標準化する)と関連づけて覚える。","tip":"normal(普通の)の名詞形と考えると「普通とされる基準=norm」だとつながる。"},{"w":"nourish","pos":"動","m":"栄養を与える；育む","nu":"体に栄養を与えて健康に育てること、また比喩的に感情や関係を育むことも表す。","ph":"nourish the body","phm":"体に栄養を与える","ex":"A balanced breakfast helps nourish the body before a busy day.","exm":"バランスの取れた朝食は忙しい一日の前に体に栄養を与える助けとなる。","us":"他動詞で人・体・感情などを目的語に取る。名詞形nourishment、形容詞nourishing。","tip":"nurse(看護する)・nutrition(栄養)と同じ語根nutriから来ており、「養い育てる」が核。"},{"w":"objective","pos":"名","m":"目的；目標","nu":"達成すべき具体的な目標を指すフォーマルな語で、goalよりも計画的・客観的な響きを持つ。","ph":"achieve an objective","phm":"目標を達成する","ex":"The team set a clear objective before starting the group project.","exm":"そのチームはグループプロジェクトを始める前に明確な目標を設定した。","us":"名詞のほかobjective(形)「客観的な」もあり、subjective(主観的な)と対で覚える。","tip":"object(目指す対象)から派生。「目指す物=目的」とイメージすると名詞用法を覚えやすい。"},{"w":"obligation","pos":"名","m":"義務","nu":"道徳的・法的にしなければならないことを表し、しばしば責任感を伴う語。","ph":"fulfill an obligation","phm":"義務を果たす","ex":"Every member has an obligation to attend the weekly club meeting.","exm":"全部員は毎週の部活のミーティングに出席する義務がある。","us":"have an obligation to doの形が頻出。動詞obligate、形容詞obligatoryと関連づける。","tip":"dutyとほぼ同義だが、obligationは約束や契約から生じる義務というニュアンスが強い。"},{"w":"obscure","pos":"形","m":"不明瞭な；無名の","nu":"よく知られていない、またはわかりにくくはっきりしないことを表す語。","ph":"obscure reference","phm":"わかりにくい言及","ex":"The teacher made an obscure reference that few students understood clearly.","exm":"先生はほとんどの生徒が理解できないわかりにくい言及をした。","us":"動詞用法「不明瞭にする、覆い隠す」もある。clear(明瞭な)の対義語として覚える。","tip":"ob(上に)+scurus(暗い)が語源とされ「覆われて暗い」から「不明瞭な」のイメージ。"},{"w":"offset","pos":"動","m":"相殺する","nu":"あるマイナスの影響を別の要因で埋め合わせてバランスを取ることを表すビジネス系の語。","ph":"offset the cost","phm":"費用を相殺する","ex":"Part-time work helped offset the cost of his new laptop.","exm":"アルバイトが彼の新しいノートパソコンの費用を相殺する助けとなった。","us":"offset A with/by Bの形も使う。過去形・過去分詞も同形offsetのまま変化しない不規則動詞。","tip":"off(離れて)+set(置く)で「一方を差し引いてバランスを取る」とイメージすると覚えやすい。"},{"w":"ongoing","pos":"形","m":"進行中の；継続中の","nu":"現在も続いていて終わっていない状態を表す語で、プロジェクトや問題によく使う。","ph":"ongoing project","phm":"進行中のプロジェクト","ex":"The school's ongoing project aims to reduce plastic waste on campus.","exm":"その学校の進行中のプロジェクトはキャンパスのプラスチックごみを減らすことを目指す。","us":"名詞の前で使う限定用法が中心。continuingやin progressとほぼ同義。","tip":"on(続いて)+going(進んでいる)がそのまま合わさった語で、直感的に意味をつかみやすい。"},{"w":"optimal","pos":"形","m":"最適な","nu":"与えられた条件の中で最も望ましい、最良の状態や結果を表すフォーマルな語。","ph":"optimal conditions","phm":"最適な条件","ex":"Eight hours of sleep creates optimal conditions for learning at school.","exm":"8時間の睡眠は学校での学習に最適な条件を作り出す。","us":"bestよりも学術的・技術的な文脈で好まれる。名詞optimum、動詞optimizeと関連づける。","tip":"optimum(最適点)の形容詞形。optimistic(楽観的な)と綴りが似ているが意味が違うので注意。"},{"w":"paradigm","pos":"名","m":"パラダイム；模範","nu":"ある時代や分野で当たり前とされる考え方の枠組みや典型例を指すフォーマルな語。","ph":"paradigm shift","phm":"パラダイムの転換","ex":"Online learning caused a paradigm shift in how students study today.","exm":"オンライン学習は今日の生徒の勉強の仕方にパラダイムの転換をもたらした。","us":"paradigm shiftという固定表現で使われることが最も多い。可算名詞。","tip":"para(並んで)+deiknynai(示す)が語源で「模範として示すもの」がもとの意味。"},{"w":"paradox","pos":"名","m":"逆説；矛盾","nu":"一見矛盾しているようで、実は真実を含んでいる考えや状況を表す語。","ph":"it is a paradox that","phm":"~とは逆説的だ","ex":"It is a paradox that studying too much can lower test scores.","exm":"勉強しすぎるとテストの点が下がることがあるとは逆説的だ。","us":"It is a paradox that S+Vの形でよく使う。形容詞形はparadoxical。","tip":"para(反する)+doxa(意見)が語源。「常識に反する意見・事実」とイメージする。"},{"w":"particle","pos":"名","m":"粒子","nu":"物質を構成するごく小さな一片を指し、理科では原子・分子より小さい単位も表す。","ph":"dust particle","phm":"ちりの粒子","ex":"A single dust particle can be seen under a strong microscope.","exm":"一つのちりの粒子は強力な顕微鏡の下では見ることができる。","us":"可算名詞。物理・化学の授業でatom, moleculeと並んで頻出する語。","tip":"part(部分)+icle(小さいもの)から成り、「物のごく小さな部分」と考えると覚えやすい。"},{"w":"patent","pos":"名","m":"特許","nu":"発明したものを一定期間独占的に使用できる法的権利を指す語。","ph":"apply for a patent","phm":"特許を出願する","ex":"The young inventor decided to apply for a patent next year.","exm":"その若い発明家は来年特許を出願することに決めた。","us":"hold a patent on/forの形も頻出。動詞用法「特許を取る」もある。","tip":"patentは形容詞で「明白な」の意味もあるが、名詞では「発明の独占権」と覚える。"},{"w":"peculiar","pos":"形","m":"独特の；奇妙な","nu":"普通とは違っていて風変わりだったり、その物・人だけに特有だったりすることを表す。","ph":"peculiar to","phm":"~に特有の","ex":"This peculiar habit of hers surprised everyone in the classroom yesterday.","exm":"彼女のこの奇妙な習慣は昨日教室にいた全員を驚かせた。","us":"be peculiar to ~で「~に特有だ」という重要用法がある。strangeより硬い語。","tip":"peculiarは「特有の」と「奇妙な」の2つの意味を持つ点に注意して文脈で判断する。"},{"w":"perpetual","pos":"形","m":"永続的な；絶え間ない","nu":"終わることなくずっと続く状態を表すフォーマルな語で、しばしば不満や問題の継続にも使う。","ph":"perpetual motion","phm":"永久運動","ex":"He seemed to live in a state of perpetual worry about exams.","exm":"彼は試験について絶え間ない心配の状態で生きているようだった。","us":"a perpetual Nの形で名詞を修飾することが多い。eternal(永遠の)より「絶え間なく続く」ニュアンス。","tip":"per(通して)+petual(続く)が語源。「ずっと通して続く」とイメージすると覚えやすい。"},{"w":"pervasive","pos":"形","m":"広範囲に及ぶ；浸透する","nu":"ある性質や影響が隅々まで広がって行き渡っている様子を表すフォーマルな語。","ph":"pervasive influence","phm":"広範囲に及ぶ影響","ex":"Smartphones now have a pervasive influence on how teens communicate.","exm":"スマートフォンは今や10代の若者のコミュニケーションの仕方に広範囲な影響を及ぼしている。","us":"pervasive influence/effectのように社会的な広がりを表す名詞とよく結びつく。動詞pervadeの形容詞形。","tip":"per(通して)+vadere(行く)が語源。「隅々まで行き渡る」イメージで覚える。"},{"w":"plausible","pos":"形","m":"もっともらしい","nu":"証拠は完全でなくても信じるに値する、理にかなっているように思える様子を表す語。","ph":"plausible explanation","phm":"もっともらしい説明","ex":"She gave a plausible explanation for why she was late again.","exm":"彼女はまた遅刻した理由についてもっともらしい説明をした。","us":"真実かどうかは断定せず「一応筋が通っている」ニュアンスで使う。対義語implausible(信じがたい)。","tip":"plaus(拍手する)が語源で「拍手されるほど納得できる」から「もっともらしい」の意味に発展した。"},{"w":"pragmatic","pos":"形","m":"実用的な；現実的な","nu":"理想よりも実際に役立つかどうかを重視して物事を判断する態度を表す語。","ph":"pragmatic approach","phm":"現実的なやり方","ex":"The captain took a pragmatic approach to solving the team's problem.","exm":"キャプテンはチームの問題を解決するのに現実的なやり方を取った。","us":"idealistic(理想主義的な)の対比として使われることが多い。名詞形pragmatism。","tip":"practical(実用的な)と似た意味だが、pragmaticは「理想より結果重視」という判断姿勢を強調する。"},{"w":"precede","pos":"動","m":"先行する；前に起こる","nu":"時間的・順序的にあることの前に来ることを表すフォーマルな語。","ph":"precede the event","phm":"その出来事に先立つ","ex":"A short speech will precede the award ceremony at school tomorrow.","exm":"短いスピーチが明日学校で行われる表彰式に先立つ予定だ。","us":"precede A(他動詞、前置詞不要)。名詞precedent(前例)、形容詞preceding、対義語follow。","tip":"pre(前に)+cede(行く)が語源。「前に行く」から「先行する」とそのままイメージできる。"},{"w":"predator","pos":"名","m":"捕食者；天敵","nu":"他の動物を捕らえて食べる生物を指し、生態系の力関係を表す語。","ph":"natural predator","phm":"天敵","ex":"The lion is a powerful predator that hunts on the African plains.","exm":"ライオンはアフリカの平原で狩りをする強力な捕食者だ。","us":"可算名詞。「〜の捕食者」はpredator of ~で表し、対義語はprey（獲物）。","tip":"predatorはprey（獲物）とセットで覚える。獲物を狙う者というイメージだ。"},{"w":"preliminary","pos":"形","m":"予備の；準備段階の","nu":"本番前の下調べや準備段階を表し、正式な決定の前段階であることを強調する語。","ph":"preliminary results","phm":"予備的な結果","ex":"The team announced preliminary results before the final match next week.","exm":"チームは来週の決勝戦の前に予備的な結果を発表した。","us":"名詞の前に置く形容詞として使う。preliminary to ~で「〜の前段階として」の意味にもなる。","tip":"pre-（前に）+limen（敷居）が語源で、本番の敷居の手前にあるイメージだ。"},{"w":"premise","pos":"名","m":"前提","nu":"議論や結論のもとになる仮定・出発点を指す、論理的な文脈で使う語。","ph":"based on the premise","phm":"〜という前提に基づいて","ex":"Her argument was based on the premise that everyone learns differently.","exm":"彼女の主張は誰もが違う方法で学ぶという前提に基づいていた。","us":"可算名詞でthe premise that S+Vの形で使うことが多い。複数形premisesは「建物、敷地」という別の意味になる。","tip":"premisesは複数形だと「構内・建物」という意味に変わることも覚えておく。"},{"w":"prescribe","pos":"動","m":"処方する；規定する","nu":"医者が薬を指示する場合と、規則が行動を定める場合の両方に使う語。","ph":"prescribe medicine for","phm":"〜に薬を処方する","ex":"The doctor decided to prescribe medicine for his persistent morning cough.","exm":"医者は彼のしつこい朝の咳に薬を処方することにした。","us":"prescribe A for B（BにAを処方する）の形をとる。名詞形prescription（処方箋）とセットで覚える。","tip":"pre-（前もって）+scribe（書く）が語源で、前もって書く指示というイメージだ。"},{"w":"prestige","pos":"名","m":"名声；威信","nu":"社会的に高く評価される地位や評判を指し、しばしば名誉と結びつく語。","ph":"gain prestige","phm":"名声を得る","ex":"Winning the national contest gave our club great prestige at school.","exm":"全国大会で優勝したことで私たちの部は学校で大きな名声を得た。","us":"不可算名詞として使う。形容詞prestigious（名声のある）もあわせて覚えると便利。","tip":"フランス語で「幻惑」を意味した語が由来で、人を惹きつける輝きのイメージだ。"},{"w":"presume","pos":"動","m":"推定する；思い込む","nu":"確証がないまま「たぶんそうだろう」と当然のように考えることを表す語。","ph":"presume that","phm":"〜だと推定する","ex":"I presume that the bus will arrive late because of the storm.","exm":"嵐のせいでバスは遅れて到着するだろうと私は推定する。","us":"presume that S+Vやpresume A to be Bの形で使う。名詞形presumption（推定）も重要。","tip":"assumeより根拠にやや基づく推測というニュアンスがあり、法廷での推定無罪の考え方にも通じる。"},{"w":"prevail","pos":"動","m":"普及する；勝る","nu":"ある考えや習慣が広く行き渡る、または対立に打ち勝つことを表す語。","ph":"prevail over","phm":"〜に打ち勝つ","ex":"Our team hoped that fair play would prevail over rough tactics.","exm":"私たちのチームはフェアプレーが荒っぽい戦術に打ち勝つことを望んだ。","us":"自動詞で前置詞overやamongを伴うことが多い。形容詞prevalent（広く見られる）も関連語。","tip":"pre-（前に）+valere（強い）が語源で、他より前に出て強く勝るイメージだ。"},{"w":"primitive","pos":"形","m":"原始的な；未発達な","nu":"文明が発達する前の段階、または単純で未熟な状態を指す語。","ph":"primitive tools","phm":"原始的な道具","ex":"Early humans made primitive tools from stone to hunt for food.","exm":"初期の人類は食料を狩るために石で原始的な道具を作った。","us":"名詞の前に置いて使うことが多い。単に「古い」ではなく「発達の初期段階」というニュアンスを持つ。","tip":"primary（第一の）と語根primus（最初）を共有し、「最初の段階」というイメージでつながる。"},{"w":"prominent","pos":"形","m":"顕著な；著名な","nu":"目立って人目を引く、または社会的に有名であることを表す語。","ph":"play a prominent role","phm":"重要な役割を果たす","ex":"She played a prominent role in organizing our school's cultural festival.","exm":"彼女は学校の文化祭を企画する上で重要な役割を果たした。","us":"prominent role/figure/positionのように名詞を修飾する形でよく使う。","tip":"pro-（前へ）+minere（突き出る）が語源で、周りより突き出て目立つイメージだ。"},{"w":"prone","pos":"形","m":"〜しがちな；傾向がある","nu":"好ましくないことが起こりやすい性質や体質を表す語。","ph":"prone to","phm":"〜しがちな","ex":"He is prone to catching colds whenever the seasons start changing.","exm":"彼は季節の変わり目になるといつも風邪をひきがちだ。","us":"be prone to + 名詞/動名詞の形で使い、悪い傾向に使うことが多い点に注意。","tip":"語源はラテン語で「前に傾いた」の意味で、悪い方向に傾きやすいイメージを持つ。"},{"w":"prospect","pos":"名","m":"見込み；展望","nu":"将来起こりそうなことへの期待や可能性を表す語。","ph":"little prospect of","phm":"〜の見込みがほとんどない","ex":"There was little prospect of finding a part-time job during exams.","exm":"試験期間中にアルバイトを見つける見込みはほとんどなかった。","us":"単数でも使うが、複数形prospectsで「将来性」の意味でよく使われる。","tip":"pro-（前を）+specere（見る）が語源で、前方を見渡して見える将来像というイメージだ。"},{"w":"provoke","pos":"動","m":"引き起こす；挑発する","nu":"意図的または結果的に強い反応や感情を引き起こすことを表す語。","ph":"provoke a reaction","phm":"反応を引き起こす","ex":"His careless comment during the meeting seemed to provoke a reaction.","exm":"会議中の彼の不用意な発言は反応を引き起こしたようだった。","us":"provoke A into Bやprovoke a response/angerの形で使う。人を怒らせる意味でも使われる。","tip":"pro-（前へ）+vocare（呼ぶ）が語源で、相手を呼び出して反応させるイメージだ。"},{"w":"proximity","pos":"名","m":"近接；近さ","nu":"物理的・時間的に近い距離にあることを表す、ややフォーマルな語。","ph":"in close proximity to","phm":"〜のすぐ近くに","ex":"Our school library is in close proximity to the main train station.","exm":"私たちの学校の図書館は主要な駅のすぐ近くにある。","us":"不可算名詞でproximity to ~の形をとる。closeと重ねてclose proximityとよく使う。","tip":"approximate（おおよその）と語根proximus（最も近い）を共有し、近さのイメージでつながる。"},{"w":"qualitative","pos":"形","m":"質的な","nu":"数値ではなく性質や特徴に注目する分析・調査を表す語。","ph":"qualitative research","phm":"質的研究","ex":"The study used qualitative research methods, including interviews with several students.","exm":"その研究はいくつかの学生への面接を含む質的な研究方法を用いた。","us":"対義語quantitative（量的な）とセットで使われることが多い。名詞形はquality。","tip":"quality（質）から派生した語で、対義語quantitative（quantityから）と対比して覚えると整理しやすい。"},{"w":"radical","pos":"形","m":"急進的な；根本的な","nu":"従来の考え方を大きく変える、または非常に徹底的であることを表す語。","ph":"radical change","phm":"根本的な変化","ex":"The new principal introduced a radical change to our school's schedule.","exm":"新しい校長は私たちの学校の時間割に根本的な変化を導入した。","us":"名詞radical（急進主義者）としても使う。政治的な文脈と一般的な文脈の両方で使われる。","tip":"語源はラテン語radix（根）で、物事の「根っこ」から変えるイメージを持つと覚えやすい。"},{"w":"realm","pos":"名","m":"領域；王国","nu":"学問や活動の範囲、または王が治める国土を表す、やや文語的な語。","ph":"in the realm of","phm":"〜の領域では","ex":"In the realm of science, new discoveries often overturn old assumptions.","exm":"科学の領域では、新しい発見がしばしば古い前提を覆す。","us":"in the realm of ~で「〜の分野・世界では」という定型表現としてよく使う。","tip":"royal（王の）と語源を共有し、もともと「王国」を意味した語が比喩的に「領域」の意味に広がった。"},{"w":"reconcile","pos":"動","m":"和解させる；調和させる","nu":"対立する人同士や矛盾する考えを折り合わせることを表す語。","ph":"reconcile with","phm":"〜と和解する","ex":"The two former friends finally managed to reconcile with each other.","exm":"二人のかつての友人はついにお互い和解することができた。","us":"reconcile with ~（人と和解する）やreconcile A with B（AをBと調和させる）の形で使う。","tip":"re-（再び）+conciliare（結びつける）が語源で、離れた関係を再び結び直すイメージだ。"},{"w":"refine","pos":"動","m":"洗練する；精製する","nu":"不純物を取り除いて質を高めることや、表現・技術を磨くことを表す語。","ph":"refine one's skills","phm":"技術を磨く","ex":"She practiced every day to refine her skills before the piano recital.","exm":"彼女はピアノの発表会の前に技術を磨くために毎日練習した。","us":"石油や砂糖などを「精製する」意味と、考え・技能を「洗練する」意味の両方で使われる。","tip":"名詞refinery（精製所）や形容詞refined（洗練された）と一緒に覚えると語彙が広がる。"},{"w":"refrain","pos":"動","m":"控える；差し控える","nu":"何かをしたい気持ちを抑えて、あえて行動しないことを表す語。","ph":"refrain from","phm":"〜を控える","ex":"Please refrain from using your phone during the entrance ceremony tomorrow.","exm":"明日の入学式では携帯電話の使用をお控えください。","us":"自動詞でrefrain from -ing（または名詞）の形をとる。掲示や案内文でよく使われるやや丁寧な表現。","tip":"名詞のrefrain（繰り返し句）と同じ綴りだが意味が異なるので注意する。"},{"w":"refute","pos":"動","m":"論駁する；反証する","nu":"証拠や論理を示して相手の主張が誤りであることを証明することを表す語。","ph":"refute the claim","phm":"主張に反論する","ex":"The scientist presented data to refute the claim made by critics.","exm":"その科学者は批評家たちの主張に反論するためにデータを提示した。","us":"単に反対意見を言うdisagreeとは違い、証拠で誤りを証明するという強い意味を持つ。","tip":"似た語のrefuse（拒否する）と混同しないよう注意。refuteは「論で否定する」というイメージだ。"},{"w":"regime","pos":"名","m":"政権；体制","nu":"特に権威主義的・強権的な政府や統治体制を指すことが多い語。","ph":"under the regime","phm":"政権のもとで","ex":"Life was difficult for citizens under the strict military regime.","exm":"厳格な軍事政権のもとで市民の生活は困難だった。","us":"しばしば否定的なニュアンスを伴い、独裁的な政府を指すことが多い。中立的な「政府」はgovernmentを使う。","tip":"regimen（養生法）と語源が近く、「統治のやり方・体制」というイメージを持つ。"},{"w":"reluctant","pos":"形","m":"気が進まない；渋々の","nu":"気乗りしないままいやいや何かをする様子を表す語。","ph":"reluctant to","phm":"〜するのに気が進まない","ex":"He was reluctant to speak in front of the whole class.","exm":"彼はクラス全員の前で話すのに気が進まなかった。","us":"be reluctant to doの形で使う。副詞reluctantly（いやいやながら）もよく使われる。","tip":"語源は「抵抗してもがく」という意味のラテン語で、心の中で抵抗している様子をイメージすると覚えやすい。"},{"w":"render","pos":"動","m":"〜にする；提供する","nu":"ある状態にさせる、または正式にサービスや判断を提供することを表す語。","ph":"render useless","phm":"役に立たなくする","ex":"A single mistake can render weeks of hard work completely useless.","exm":"たった一つのミスが何週間もの努力を全く無駄にしてしまうことがある。","us":"render + O + C（形容詞/名詞）の形で「OをCの状態にする」という意味になる。makeよりフォーマルな響き。","tip":"「与える」という意味のラテン語reddereが語源で、ある状態や結果を「もたらす」イメージだ。"},{"w":"renowned","pos":"形","m":"有名な；名高い","nu":"特定の分野で広く知られ高く評価されていることを表す、ややフォーマルな語。","ph":"renowned for","phm":"〜で有名な","ex":"The chef is renowned for creating delicious dishes using local vegetables.","exm":"そのシェフは地元の野菜を使ったおいしい料理を作ることで有名だ。","us":"be renowned for ~の形でfamousよりやや硬い響きを持つ。","tip":"re-（強調）+nown（nameと同語源）が語源で、名前が繰り返し広く知れ渡るイメージだ。"},{"w":"restrain","pos":"動","m":"抑制する；抑える","nu":"人の行動や感情、力の働きを物理的・意志的に抑えつけることを表す語。","ph":"restrain oneself","phm":"自分を抑える","ex":"It was hard for her to restrain herself from laughing during the serious speech.","exm":"真剣なスピーチの間、彼女は笑うのをこらえるのが大変だった。","us":"restrain A from -ingやrestrain oneselfの形で使う。名詞形restraint（抑制）も重要。","tip":"re-（後ろへ）+stringere（締める）が語源で、後ろに引っ張って締め付けるイメージだ。"},{"w":"retrieve","pos":"動","m":"取り戻す；回収する","nu":"失った物や情報をもとの場所・状態に取り戻すことを表す語。","ph":"retrieve data","phm":"データを回収する","ex":"The technician managed to retrieve data from the broken laptop overnight.","exm":"その技術者は一晩かけて壊れたノートパソコンからデータを回収した。","us":"情報や物を「取ってくる」際に使い、コンピューター用語としても頻出。犬が物を取ってくる意味でも使われる。","tip":"re-（再び）+trouver（見つける、フランス語）が語源で、再び見つけ出すイメージを持つと覚えやすい。"},{"w":"revenue","pos":"名","m":"歳入；収益","nu":"政府や企業が得る総収入を指し、利益（profit）とは区別される語。","ph":"generate revenue","phm":"収益を生み出す","ex":"The school festival aimed to generate revenue for the new library.","exm":"学校祭は新しい図書館のための収益を生み出すことを目指した。","us":"経費を引く前の総収入を指し、経費を引いた後のprofit（利益）と区別される。不可算名詞として使うことが多い。","tip":"re-（戻る）+venir（来る、フランス語）が語源で、お金が戻ってくるイメージを持つ。"},{"w":"rhetoric","pos":"名","m":"修辞；美辞麗句","nu":"説得のために工夫された言葉遣いを指し、時に内容の伴わない話し方を批判的に表す語。","ph":"empty rhetoric","phm":"中身のない美辞麗句","ex":"Critics said the politician's speech was full of empty rhetoric.","exm":"批評家たちはその政治家の演説は中身のない美辞麗句ばかりだと述べた。","us":"不可算名詞。肯定的に「説得の技術」を指す場合と、否定的に「口先だけ」を指す場合がある。","tip":"古代ギリシャの弁論術に由来する語で、rhetorical question（修辞疑問文）という表現も一緒に覚えておく。"},{"w":"sanction","pos":"名","m":"制裁；認可","nu":"規則違反への罰則という否定的な意味と、公式な許可という肯定的な意味を併せ持つ語。","ph":"impose a sanction on","phm":"〜に制裁を科す","ex":"The committee decided to impose a sanction on the rule-breaking team.","exm":"委員会は規則を破ったチームに制裁を科すことを決めた。","us":"「制裁」の意味では複数形sanctionsで使うことも多く、「認可」の意味では動詞としても使う。文脈で意味が正反対になる点に注意。","tip":"一つの語が「罰」と「許可」という逆の意味を持つ珍しい例として覚えておくと印象に残る。"},{"w":"sanitation","pos":"名","m":"公衆衛生；衛生設備","nu":"下水やごみ処理など、公衆衛生を保つための設備や仕組みを指す語。","ph":"improve sanitation","phm":"衛生状態を改善する","ex":"The volunteers worked to improve sanitation in the flood-affected village.","exm":"ボランティアたちは洪水の被害を受けた村の衛生状態を改善するために働いた。","us":"不可算名詞。sanitary（衛生的な）という形容詞形も合わせて覚えると良い。","tip":"sane（健全な）と同じ語根sanus（健康な）に由来し、健康を保つための仕組みというイメージだ。"},{"w":"skeptical","pos":"形","m":"懐疑的な","nu":"他人の主張や情報をすぐには信じず、疑いの目で見る態度を表す語。","ph":"skeptical about","phm":"〜について懐疑的な","ex":"Many students were skeptical about the rumor spreading around the school.","exm":"多くの生徒たちは学校中に広まっているうわさについて懐疑的だった。","us":"skeptical about/of ~の形で使う。名詞形skepticism（懐疑論）も覚えておきたい。","tip":"ギリシャ語skeptesthai（よく調べる）が語源で、簡単には信じずよく確かめる態度をイメージする。"},{"w":"sector","pos":"名","m":"部門；分野","nu":"経済や社会を分けたときの一区分を指し、産業や活動の分野を表す語。","ph":"the public sector","phm":"公共部門","ex":"Many graduates hope to find stable jobs in the public sector.","exm":"多くの卒業生は公共部門で安定した仕事を見つけることを望んでいる。","us":"public sector（公共部門）、private sector（民間部門）という対比表現でよく使われる。","tip":"ラテン語secare（切る）が語源で、全体を切り分けた一部分というイメージを持つ。"},{"w":"segment","pos":"名","m":"部分；区分","nu":"全体を区切ったひとつの部分を指し、市場や社会集団を分ける際にもよく使う語。","ph":"a segment of society","phm":"社会の一部分","ex":"This advertisement targets a specific segment of the teenage population.","exm":"この広告は10代の人口の特定の一部分を対象にしている。","us":"動詞としても使い、segment the market（市場を区分する）のように使う。sectorより細かい区分を指すことが多い。","tip":"ラテン語secare（切る）が語源で、sectorと同じ語根を持つ「切り取られた一片」というイメージだ。"},{"w":"sensory","pos":"形","m":"感覚の","nu":"視覚・聴覚・触覚など五感を通じて得られる情報に関わることを表す語。","ph":"sensory input","phm":"感覚からの入力","ex":"The brain constantly processes sensory input from our eyes and ears.","exm":"脳は目や耳からの感覚的な入力を絶えず処理している。","us":"senseの形容詞形で、sensory organ（感覚器官）のように名詞を修飾する形で使う。","tip":"senseと同じ語根を持ち、五感（sight, hearing, smell, taste, touch）に関わる語だと意識すると覚えやすい。"},{"w":"sentiment","pos":"名","m":"感情；世論","nu":"個人的な気持ちだけでなく、社会全体が共有する意見や気分も表す語。","ph":"public sentiment","phm":"世論、大衆の感情","ex":"Public sentiment shifted quickly after the surprising announcement from the government.","exm":"政府からの驚くべき発表の後、世論はすぐに変化した。","us":"feelingより少しフォーマルで、集団的な感情や意見を表すときにもよく使われる。","tip":"sense（感覚）と同語根で、感覚から生まれる気持ちや意見というイメージを持つと覚えやすい。"},{"w":"simulate","pos":"動","m":"模擬する；まねる","nu":"実際の状況や動きをコンピューターなどで人工的に再現することを表す語。","ph":"simulate a situation","phm":"状況を再現する","ex":"The training program was designed to simulate a real job interview.","exm":"その研修プログラムは実際の就職面接を模擬するために作られた。","us":"名詞形simulation（模擬実験）やsimulator（シミュレーター）とセットで覚える。","tip":"similar（似ている）と同語根で、本物に似せて再現するイメージを持つと理解しやすい。"},{"w":"simultaneous","pos":"形","m":"同時の","nu":"二つ以上の出来事が全く同じ時刻に起こることを表す語。","ph":"simultaneous translation","phm":"同時通訳","ex":"The conference offered simultaneous translation for guests from different countries.","exm":"その会議は様々な国からの来賓のために同時通訳を提供した。","us":"副詞simultaneously（同時に）もよく使われる。simultaneous with ~の形もある。","tip":"simul（同時に、ラテン語）が語源で、同じ瞬間に複数のことが起こるイメージだ。"},{"w":"sovereignty","pos":"名","m":"主権；統治権","nu":"国家が他から干渉されずに自国を治める最高の権力を指す語。","ph":"national sovereignty","phm":"国家主権","ex":"The small island nation fought hard to protect its national sovereignty.","exm":"その小さな島国は自国の主権を守るために懸命に戦った。","us":"不可算名詞。形容詞sovereign（主権を持つ、君主）とセットで覚える。","tip":"super（上に）に由来し、他の誰の上にも立つ最高の権力というイメージを持つ。"},{"w":"spatial","pos":"形","m":"空間の","nu":"物の位置関係や広がりなど、空間に関わる性質を表す語。","ph":"spatial awareness","phm":"空間認識力","ex":"Playing basketball helped improve his spatial awareness on the court.","exm":"バスケットボールをすることは彼のコート上での空間認識力を向上させるのに役立った。","us":"space（空間）の形容詞形で、spatial relationship（空間的な関係）のように名詞を修飾する。","tip":"spaceと同語根なので、「空間の」という意味は音からも連想しやすい。"},{"w":"specify","pos":"動","m":"明記する；具体的に述べる","nu":"あいまいさを残さないよう、詳細や条件をはっきりと指定して述べることを表す語。","ph":"specify the details","phm":"詳細を明記する","ex":"The teacher asked us to specify the details of our research topic.","exm":"先生は私たちに研究テーマの詳細を明記するよう求めた。","us":"specify that S+Vやspecify wh-節の形でも使う。形容詞specific（具体的な）、名詞specification（仕様）と関連づけて覚える。","tip":"species（種）と同語根で、特定の種類を指し示すイメージから「明記する」の意味につながる。"},{"w":"speculate","pos":"動","m":"推測する；投機する","nu":"確証がない事柄について理由や結果を推測すること。投機的に売買する意味でも使う。","ph":"speculate about the future","phm":"将来について推測する","ex":"Some students speculate about which teacher they will get next year.","exm":"一部の生徒は来年どの先生が担当になるか推測する。","us":"speculate about/on ~の形で「~について推測する」の意味になる。that節を続けて具体的な内容を述べることも多い。","tip":"spec-は「見る」を表す語根（spectacle, inspectと同語源）で、心の中で見て推し量るイメージ。"},{"w":"spontaneous","pos":"形","m":"自発的な；自然に起こる","nu":"前もって計画せず、内側から自然に湧き出るように起こる様子を表す。","ph":"a spontaneous decision","phm":"自発的な決断","ex":"Her spontaneous laughter made everyone in the classroom smile.","exm":"彼女の自然な笑い声で教室のみんなが笑顔になった。","us":"spontaneous decision/reaction のように名詞を修飾する形で使うことが多い。副詞形はspontaneously。","tip":"対義語はplanned（計画された）。ラテン語sponte（自らの意志で）に由来する。"},{"w":"static","pos":"形","m":"静的な；変化しない","nu":"動きや変化がなく、一定の状態にとどまっている様子。dynamicの対義語。","ph":"remain static","phm":"変わらないままである","ex":"Sales figures stayed static during the quiet summer months.","exm":"売り上げは静かな夏の間、変わらないままだった。","us":"remain/stay staticの形で「変わらないままである」の意味になる。物理の「静電気」はstatic electricity。","tip":"対義語はdynamic（動的な）。stat-は「立つ、静止」を表す語根。"},{"w":"stereotype","pos":"名","m":"固定観念；ステレオタイプ","nu":"ある集団に対して単純化・固定化された、しばしば不正確なイメージのこと。","ph":"challenge a stereotype","phm":"固定観念に異議を唱える","ex":"The film challenges the stereotype that boys dislike ballet class.","exm":"その映画は男子はバレエを嫌うという固定観念に異議を唱える。","us":"可算名詞。stereotype of ~ /stereotype that ~ の形で具体的な内容を示す。動詞化すると「型にはめる」の意味になる。","tip":"元は印刷用の「鉛版」を指した語で、そこから「同じ型で決まった見方」の意味に広がった。"},{"w":"subjective","pos":"形","m":"主観的な","nu":"個人の感じ方や意見に基づく判断を表し、objectiveの対義語として使う。","ph":"a subjective opinion","phm":"主観的な意見","ex":"Choosing the best song is a highly subjective matter for judges.","exm":"一番の曲を選ぶことは審査員にとって非常に主観的な問題だ。","us":"be subjective の形でよく使う。名詞形subjectivityも覚えておくと便利。","tip":"対義語はobjective（客観的な）。subject（主体）に由来し、「主体の側から見た」という意味を持つ。"},{"w":"subordinate","pos":"形","m":"従属的な；下位の","nu":"地位・重要度が他より低く、それに従う立場にあることを示す語。","ph":"subordinate to management","phm":"経営陣の下位に置かれる","ex":"In this club, personal preference is subordinate to team decisions.","exm":"この部活では個人の好みはチームの決定より下位に置かれる。","us":"be subordinate to ~ の形で「~に従属する」という意味になる。名詞としても使え、その場合は「部下」を指す。","tip":"sub-（下に）+ordinate（順序づけられた）という成り立ちで、「順位が下」というイメージをつかむとよい。"},{"w":"subsequent","pos":"形","m":"その後の；続く","nu":"ある出来事の後に続いて起こることを表し、名詞の前に置いて使うことが多い。","ph":"subsequent events","phm":"その後の出来事","ex":"The team lost the first match but won all subsequent games.","exm":"そのチームは初戦に負けたが、その後の試合にはすべて勝った。","us":"subsequent to ~ で「~の後に」という前置詞的用法もある。名詞の直前に置く形容詞用法が中心。","tip":"sub-（後に）+sequ（続く）という語根から成り、subsequentlyという副詞形も頻出。"},{"w":"subsidy","pos":"名","m":"補助金；助成金","nu":"政府や団体が特定の産業・活動を支えるために出す金銭的支援を指す。","ph":"government subsidy","phm":"政府の補助金","ex":"The government offers a subsidy to farmers growing organic vegetables.","exm":"政府は有機野菜を栽培する農家に補助金を出している。","us":"可算名詞で、subsidy for/to ~ の形をとる。動詞形subsidize（補助金を出す）も合わせて覚える。","tip":"sub-（下から）+sid（座る、支える）という語源で、「下から支える金」というイメージ。"},{"w":"substantial","pos":"形","m":"かなりの；実質的な","nu":"量や程度が無視できないほど大きいこと、または内容が確かであることを表す。","ph":"a substantial increase","phm":"かなりの増加","ex":"The new stadium cost a substantial amount of the city's budget.","exm":"新しいスタジアムは市の予算のかなりの部分を使った。","us":"substantial amount/increase/evidence など「量・程度の大きさ」を表す名詞と結びつくことが多い。","tip":"substance（実体・物質）と同語源で、「実質を伴うほど大きい」というイメージで覚える。"},{"w":"superficial","pos":"形","m":"表面的な；浅薄な","nu":"物事の深部まで見ず、表面だけを見て判断する浅い様子を表す。","ph":"a superficial understanding","phm":"表面的な理解","ex":"His knowledge of history was only superficial before the school trip.","exm":"修学旅行の前、彼の歴史の知識は表面的なものにすぎなかった。","us":"superficial understanding/wound などのように「深さの欠如」を示す名詞とともに使う。","tip":"super-（上に）+faci-（顔・表面）から成り、「表面だけ」というイメージで覚える。"},{"w":"supplement","pos":"名","m":"補足；栄養補助食品","nu":"不足分を補うために追加されるもの。教材の補足資料やサプリメントを指す。","ph":"take a vitamin supplement","phm":"ビタミン剤を摂取する","ex":"She takes a vitamin supplement every morning before track practice.","exm":"彼女は陸上部の練習前に毎朝ビタミン剤を摂取している。","us":"可算名詞。動詞supplement（補う）としても使い、supplement A with Bの形をとる。","tip":"sup-（下から）+plement（満たす）から「不足を下から満たすもの」というイメージ。"},{"w":"suppress","pos":"動","m":"抑える；鎮圧する","nu":"感情・情報・反乱などを表に出さないよう力で抑え込むことを表す。","ph":"suppress a yawn","phm":"あくびをこらえる","ex":"The student tried hard to suppress a yawn during the long lecture.","exm":"その生徒は長い講義中、あくびをこらえようと必死だった。","us":"suppress a feeling/laughter/information など「表に出るはずのものを抑える」対象を目的語にとる。","tip":"sup-（下に）+press（押す）から「下に押さえつける」イメージ。名詞形はsuppression。"},{"w":"surge","pos":"名","m":"急増；高まり","nu":"数量や感情が急激に高まり、押し寄せるように増える様子を表す。","ph":"a surge in demand","phm":"需要の急増","ex":"There was a sudden surge in demand for tickets to the concert.","exm":"コンサートのチケットの需要が突然急増した。","us":"surge in ~ の形で「~の急増」を表す。動詞としても「急に高まる」の意味で使える。","tip":"波が押し寄せるイメージの語で、電流の「サージ」もこの語から来ている。"},{"w":"surplus","pos":"名","m":"余剰；黒字","nu":"必要量を超えて残った分を指し、貿易や財政の「黒字」の意味でも使う。","ph":"a trade surplus","phm":"貿易黒字","ex":"Japan recorded a small trade surplus with that country last month.","exm":"日本は先月その国との間でわずかな貿易黒字を記録した。","us":"surplus of ~ の形や、budget surplus（財政黒字）のように複合語で使うことが多い。対義語はdeficit。","tip":"sur-（超えて）+plus（多く）から「必要を超えた分」というイメージで覚える。"},{"w":"susceptible","pos":"形","m":"影響されやすい","nu":"病気や誘惑、影響などを受けやすい弱さを持つことを表す形容詞。","ph":"susceptible to colds","phm":"風邪をひきやすい","ex":"Young children are especially susceptible to colds in the winter season.","exm":"幼い子どもは冬の季節に特に風邪をひきやすい。","us":"be susceptible to ~ の形が基本で、後には病気・影響・説得などが続く。","tip":"vulnerable（傷つきやすい）と近いが、susceptibleは病気や影響を「受け入れやすい」性質に焦点がある。"},{"w":"synthesis","pos":"名","m":"統合；合成","nu":"複数の異なる要素を組み合わせて一つのまとまりを作り出すことを表す。","ph":"a synthesis of ideas","phm":"様々な考えの統合","ex":"Her essay presented a clear synthesis of two opposing scientific theories.","exm":"彼女の小論文は対立する2つの科学理論を明確に統合していた。","us":"synthesis of A and B の形で使う。動詞形synthesize（統合する、合成する）も頻出。","tip":"syn-（共に）+thesis（置く）から「一緒に組み立てる」イメージ。化学の「合成」の意味でも使う。"},{"w":"tangible","pos":"形","m":"明白な；有形の","nu":"手で触れられるほど具体的で、実際に確認できる様子を表す。","ph":"tangible evidence","phm":"明白な証拠","ex":"The coach wanted tangible proof that the new training plan worked.","exm":"コーチは新しい練習計画が効果的だという明白な証拠を求めた。","us":"tangible evidence/benefit/result のように、目に見える形の名詞と結びつくことが多い。","tip":"対義語はintangible（無形の）。tangere（触れる）というラテン語に由来する。"},{"w":"tariff","pos":"名","m":"関税","nu":"輸入品にかけられる税金のことで、貿易政策の議論で頻出する語。","ph":"impose a tariff","phm":"関税を課す","ex":"The government decided to impose a tariff on imported steel products.","exm":"政府は輸入鉄鋼製品に関税を課すことを決定した。","us":"impose/raise/lower a tariff on ~ の形で使う。可算名詞で複数形tariffsも頻出。","tip":"ニュースの貿易摩擦の話題で頻出する語。taxと似た意味だが輸出入品に限定される点が異なる。"},{"w":"tentative","pos":"形","m":"仮の；暫定的な","nu":"まだ確定しておらず、変更の可能性を残した状態を表す語。","ph":"a tentative plan","phm":"仮の計画","ex":"We made a tentative plan to visit the museum next Saturday.","exm":"私たちは次の土曜日に博物館を訪れる仮の計画を立てた。","us":"tentative plan/schedule/agreement のように「まだ確定していない」名詞を修飾する。","tip":"temporary（一時的な）と似るが、tentativeは「確定前で変更されうる」点に重点がある。"},{"w":"terminate","pos":"動","m":"終了させる","nu":"契約・雇用・作業などを正式に、また強制的に終わらせることを表す。","ph":"terminate a contract","phm":"契約を解除する","ex":"The company decided to terminate the contract with the old supplier.","exm":"その会社は古い仕入れ先との契約を解除することを決めた。","us":"terminate a contract/employment のようにフォーマルな文脈で使う。endよりも正式で強い響きを持つ。","tip":"terminus（終着点）と同語源で、「終着点に達して止める」というイメージを持つとよい。"},{"w":"testify","pos":"動","m":"証言する","nu":"法廷などで事実を宣誓のうえ述べることを表し、証拠として示す意味にも使う。","ph":"testify in court","phm":"法廷で証言する","ex":"The witness agreed to testify in court about the accident details.","exm":"その目撃者は事故の詳細について法廷で証言することに同意した。","us":"testify to/about ~ で「~について証言する」、testify that ~ で「~だと証言する」の形をとる。","tip":"test-（証人）という語根を持ち、testimony（証言）と関連づけて覚えると効果的。"},{"w":"thereby","pos":"副","m":"それによって","nu":"前の文の内容を受けて、その結果として何かが起こることを示す接続的な副詞。","ph":"thereby reducing costs","phm":"それによってコストを削減する","ex":"She studied every night, thereby improving her grades within a month.","exm":"彼女は毎晩勉強し、それによって1か月以内に成績を上げた。","us":"thereby doing の形で分詞構文とともに使われることが多く、フォーマルな文章によく登場する。","tip":"there（それ）+by（によって）という成り立ちをそのままイメージすると意味が定着しやすい。"},{"w":"thrive","pos":"動","m":"繁栄する；成長する","nu":"環境に適応して勢いよく成長したり成功したりする様子を表す。","ph":"thrive in a new environment","phm":"新しい環境でうまくやっていく","ex":"Many students thrive in a new environment after joining a club.","exm":"多くの生徒は部活に入った後、新しい環境でうまく成長していく。","us":"thrive in/on ~ の形で「~の中で成功する、成長する」という意味になる。","tip":"survive（生き延びる）より積極的に「うまく育つ・栄える」意味を持つ点に注意する。"},{"w":"transcend","pos":"動","m":"超越する","nu":"通常の限界や範囲を超えて、その先に及ぶことを表すやや硬い語。","ph":"transcend cultural boundaries","phm":"文化の壁を超える","ex":"Good music can transcend cultural boundaries and reach people everywhere.","exm":"良い音楽は文化の壁を超えて世界中の人々に届く。","us":"transcend + 名詞の形で他動詞として使い、限界・国境・世代などを目的語にとることが多い。","tip":"trans-（越えて）+scend（登る）から「乗り越えて上に行く」イメージで覚える。"},{"w":"transition","pos":"名","m":"移行；過渡期","nu":"ある状態や段階から別の状態へと移り変わる過程そのものを表す。","ph":"the transition to high school","phm":"高校への移行","ex":"The transition to high school can feel difficult for many students.","exm":"高校への移行は多くの生徒にとって難しく感じられることがある。","us":"transition from A to B の形で使う。動詞形transitionもあり、「移行する」という意味になる。","tip":"trans-（越えて）+it（行く）から「向こうへ移り行く」イメージをつかむとよい。"},{"w":"trivial","pos":"形","m":"些細な","nu":"取るに足らない、重要度が非常に低いことを表す形容詞。","ph":"a trivial mistake","phm":"些細な間違い","ex":"Don't worry about such a trivial mistake in your homework tonight.","exm":"今夜の宿題のそんな些細な間違いを気にしなくていい。","us":"trivial matter/mistake/detail のように「重要でない」名詞を修飾する形で使う。","tip":"significant（重要な）の対義語として覚えるとよい。名詞形trivia（雑学）も同語源。"},{"w":"underlie","pos":"動","m":"根底にある","nu":"表面には見えないが、物事の基礎や原因として存在していることを表す。","ph":"underlie the problem","phm":"問題の根底にある","ex":"A lack of communication seemed to underlie the problem in their team.","exm":"コミュニケーション不足がそのチームの問題の根底にあるようだった。","us":"underlie + 名詞の他動詞用法が基本。形容詞形underlying（根底にある、根本的な）も頻出。","tip":"under-（下に）+lie（横たわる）から「下に横たわって支える」イメージで覚える。"},{"w":"undermine","pos":"動","m":"弱体化させる","nu":"気づかれないうちに徐々に力・信頼・地位などを損なうことを表す。","ph":"undermine confidence","phm":"自信を弱める","ex":"Constant criticism can undermine a young athlete's confidence over time.","exm":"絶え間ない批判は若い選手の自信を徐々に弱めることがある。","us":"undermine confidence/authority/relationship など「信頼や力」を表す名詞を目的語にとる。","tip":"under-（下を）+mine（掘る）から「土台を下から掘り崩す」イメージで覚える。"},{"w":"unify","pos":"動","m":"統一する","nu":"別々だったものを一つにまとめ、一体性を持たせることを表す動詞。","ph":"unify the country","phm":"国を統一する","ex":"The new leader worked hard to unify the divided political parties.","exm":"新しい指導者は分裂した政党を統一しようと懸命に取り組んだ。","us":"unify A（統一する対象）の他動詞用法が基本。名詞形unity、形容詞形unifiedも重要。","tip":"uni-（一つ）+fy（〜にする）から「一つにする」という成り立ちがそのまま意味になる。"},{"w":"uphold","pos":"動","m":"支持する；維持する","nu":"法律・原則・決定などを正しいものとして守り、支え続けることを表す。","ph":"uphold the law","phm":"法を守る","ex":"Judges must uphold the law fairly, regardless of personal opinion.","exm":"裁判官は個人的な意見に関わらず、公平に法を守らなければならない。","us":"uphold the law/decision/tradition のように「守るべき価値」を目的語にとる、ややフォーマルな語。","tip":"up（上に）+hold（保つ）から「高く掲げて支え続ける」イメージで覚えるとよい。"},{"w":"variable","pos":"名","m":"変数；変動要因","nu":"状況によって値や性質が変わりうる要素のことで、数学や実験でも使う。","ph":"control a variable","phm":"変数を制御する","ex":"The experiment included one key variable that affected the final results.","exm":"その実験には最終結果に影響する重要な変数が一つ含まれていた。","us":"可算名詞でcontrol/consider a variableの形をとる。形容詞用法「変わりやすい」も重要。","tip":"vary（変わる）から派生した語で、「変わりうるもの」というイメージで覚えるとよい。"},{"w":"verbal","pos":"形","m":"言葉の；口頭の","nu":"文字ではなく話し言葉によるコミュニケーションを表す語。書面のwrittenと対比される。","ph":"verbal communication","phm":"言葉によるコミュニケーション","ex":"The teacher gave verbal instructions before handing out the worksheet.","exm":"先生はプリントを配る前に口頭で指示を出した。","us":"verbal communication/agreement/instructions のように「口頭の」という意味で名詞を修飾する。","tip":"対義語はwritten（書面の）。verb（動詞）と同語源で「言葉に関する」というイメージ。"},{"w":"verify","pos":"動","m":"検証する；確認する","nu":"情報や事実が正しいかどうかを証拠に基づいて確かめることを表す。","ph":"verify the information","phm":"情報を確認する","ex":"Please verify the information before you post it on social media.","exm":"SNSに投稿する前にその情報を確認してください。","us":"verify that ~ / verify + 名詞 の形で使う。名詞形verificationも押さえておく。","tip":"veri-（真実）+fy（〜にする）から「真実だと確かめる」という成り立ちで覚える。"},{"w":"versatile","pos":"形","m":"多才な；多用途の","nu":"人や物が多くの異なる状況・用途にうまく対応できる柔軟さを表す。","ph":"a versatile player","phm":"多才な選手","ex":"The coach praised him as a versatile player who can play anywhere.","exm":"コーチは彼をどこでもプレーできる多才な選手だと褒めた。","us":"versatile player/tool/material のように「多様な用途・能力を持つ」名詞を修飾する。","tip":"vers-（回す、変える）という語根を持ち、「色々な方向に対応できる」イメージで覚える。"},{"w":"viable","pos":"形","m":"実行可能な；存続可能な","nu":"計画・事業・生物などが実際にうまく機能し、成り立ちうることを表す。","ph":"a viable solution","phm":"実行可能な解決策","ex":"The committee looked for a viable solution to the parking problem.","exm":"委員会は駐車場問題の実行可能な解決策を探した。","us":"viable solution/option/alternative のように「現実的に成立する」名詞を修飾する形が多い。","tip":"vi-（生命）という語根（vital, viveなどと同語源）に由来し、「生きていける、機能する」というイメージで覚える。"},{"w":"vigorous","pos":"形","m":"精力的な；活発な","nu":"力強く活発なエネルギーを持って行動する様子を表す形容詞。","ph":"vigorous exercise","phm":"激しい運動","ex":"Doctors recommend vigorous exercise for at least twenty minutes a day.","exm":"医師は1日少なくとも20分の激しい運動を勧めている。","us":"vigorous exercise/debate/campaign のように「力強さ」を伴う名詞を修飾することが多い。","tip":"vigor（活力）の形容詞形で、energeticと近いが「力強さ」に重点が置かれる。"},{"w":"virtual","pos":"形","m":"事実上の；仮想の","nu":"実際にはそうでなくても、実質的にはそれと同じ状態であることを表す。","ph":"virtual reality","phm":"仮想現実","ex":"The class experienced a virtual tour of an ancient Roman city.","exm":"クラスは古代ローマの都市の仮想ツアーを体験した。","us":"virtual reality/tour のようにコンピュータ上の仮想空間を表す用法と、「事実上の」という抽象的用法がある。","tip":"副詞形virtuallyは「事実上、ほとんど」の意味で会話にも頻出するので合わせて覚える。"},{"w":"virtue","pos":"名","m":"美徳；長所","nu":"道徳的に優れた性質や、物事が持つ良い点を指す語。","ph":"the virtue of patience","phm":"忍耐という美徳","ex":"Her grandmother always spoke about the virtue of patience and kindness.","exm":"彼女の祖母はいつも忍耐と優しさという美徳について話していた。","us":"the virtue of ~ の形で使う。by virtue of ~（~のおかげで）という熟語表現も重要。","tip":"対義語はvice（悪徳）。virtuous（高潔な）という形容詞形も一緒に覚えておく。"},{"w":"vulnerable","pos":"形","m":"傷つきやすい；脆弱な","nu":"身体的・精神的に傷つきやすく、攻撃や被害を受けやすい状態を表す。","ph":"vulnerable to attack","phm":"攻撃を受けやすい","ex":"Without proper training, new players are vulnerable to serious injury.","exm":"適切な練習がなければ、新人選手は深刻なけがをしやすい。","us":"be vulnerable to ~ の形で使い、後には危険・攻撃・病気などが続く。","tip":"susceptibleと似るが、vulnerableは「傷つく可能性」に、susceptibleは「影響の受けやすさ」に重点がある。"},{"w":"withstand","pos":"動","m":"耐える","nu":"強い力・圧力・困難などに屈せず持ちこたえることを表す動詞。","ph":"withstand pressure","phm":"圧力に耐える","ex":"The old bridge was built to withstand strong winds and heavy snow.","exm":"その古い橋は強風と大雪に耐えられるように造られた。","us":"withstand pressure/attack/test のように「外からの力」を目的語にとる他動詞。","tip":"with-（対抗して）+stand（立つ）から「対抗して立ち続ける」イメージで覚える。"},{"w":"yield","pos":"動","m":"譲る；産出する；屈する","nu":"圧力に屈する場合と、作物や利益を生み出す場合の両方で使う動詞。","ph":"yield to pressure","phm":"圧力に屈する","ex":"The old bridge began to yield under the weight of the truck.","exm":"古い橋はトラックの重みでたわみ始めた。","us":"自動詞・他動詞の両方で使う。「yield to A」でAに屈する、「yield+数値」で利益や収穫を生み出す。","tip":"農作物の収穫量という意味でも使われる語。giveに近い「差し出す」イメージで覚えるとよい。"},{"w":"comprise","pos":"動","m":"構成する；含む","nu":"全体がどんな部分から成るかを述べる硬い語で、進行形にしにくい。","ph":"comprise several departments","phm":"いくつかの部門から成る","ex":"The school committee's members comprise teachers, parents, and students.","exm":"その学校の委員会のメンバーは教師、保護者、生徒から成る。","us":"「全体+comprise+部分」の語順で使う他動詞。受動態「be comprised of」も見かけるが、consist ofの方が無難とされる。","tip":"com(共に)+prise(掴む)から、全体を丸ごと掴んでまとめるイメージで覚える。"},{"w":"assert","pos":"動","m":"主張する；断言する","nu":"根拠を示しながら自信を持って強く言い切ることを表す硬めの動詞。","ph":"assert one's opinion","phm":"自分の意見を主張する","ex":"She would assert her opinion clearly during every class discussion.","exm":"彼女はクラスの議論のたびに自分の意見をはっきりと主張していた。","us":"「assert that ~」で「~だと主張する」、「assert oneself」で「自己主張する」の意味になる。","tip":"ad(~へ)+sert(結びつける)が語源。名詞形assertion(主張)とセットで覚える。"},{"w":"foster","pos":"動","m":"育てる；助長する","nu":"才能や良い関係が育つよう環境面から後押しするという意味合いを持つ。","ph":"foster a sense of community","phm":"共同体意識を育む","ex":"Group projects can foster teamwork among students who rarely talk otherwise.","exm":"グループ課題は普段話さない生徒同士のチームワークを育むことがある。","us":"foster+抽象名詞(友情・成長・才能など)の形で使うことが多い。人を目的語にすると「里子として育てる」意味になる。","tip":"「foster parent(里親)」から、実の親でなくても育てるイメージを抽象的な事柄にも広げて覚える。"},{"w":"depict","pos":"動","m":"描く；描写する","nu":"絵画や文章などで対象の様子をありのままに描き出すことを表す語。","ph":"depict a scene","phm":"場面を描写する","ex":"These old photographs depict students studying calmly in a quiet library.","exm":"これらの古い写真は生徒たちが静かな図書館で穏やかに勉強する様子を描いている。","us":"depict+名詞で「~を描く」という意味になる。paintやdrawより文章・映画・絵など幅広い媒体での描写に使う硬い語。","tip":"de(強意)+pict(描く、pictureと同語源)から、pictureを思い浮かべると覚えやすい。"},{"w":"allege","pos":"動","m":"申し立てる；主張する","nu":"証拠がまだ確定していない段階で~だと述べる、報道や法律でよく使う語。","ph":"allege that","phm":"~だと申し立てる","ex":"Reporters allege that the company hid important safety test results.","exm":"記者たちはその会社が重要な安全検査結果を隠したと主張している。","us":"受動態「be alleged to do」や形容詞allegedもニュース英語で頻出する。証明されていない点を強調する語。","tip":"assertより証拠不十分な非難のニュアンスが強い。「alleged criminal(容疑者)」の形で新聞によく登場する。"},{"w":"deem","pos":"動","m":"みなす；思う","nu":"公式・客観的な判断として物事を見なすという、considerより硬い語。","ph":"deem it necessary","phm":"それを必要だとみなす","ex":"The teacher would deem it unfair to change the test date.","exm":"先生はテストの日程を変えるのは不公平だとみなすだろう。","us":"「deem+目的語+補語」の第5文型でよく使う。受動態「be deemed(to be)~」も頻出する。","tip":"considerよりフォーマルで、規則や公式な判断が関わる文脈(法律・校則など)でよく登場する。"},{"w":"entail","pos":"動","m":"伴う；必要とする","nu":"ある事をすれば必然的について回る負担や結果を表す硬い語。","ph":"entail a lot of work","phm":"多くの労力を伴う","ex":"Studying abroad can entail unexpected costs that surprise many students.","exm":"留学には多くの生徒を驚かせる予想外の費用が伴うことがある。","us":"他動詞でtoを使わず目的語に名詞や動名詞を直接取る。受け身にはあまりしない。","tip":"en+tailは動物の「しっぽ」ではなく、tailor(仕立てる)と同語源の「裁断・割り当て」を意味する語根に由来する。もとは相続財産を限定する法律用語で、そこから『必然的に何かを伴う』という意味に発展したと覚える。"},{"w":"flourish","pos":"動","m":"繁栄する；茂る","nu":"植物がよく育つように人や組織が力強く発展する様子を表す語。","ph":"flourish under good guidance","phm":"良い指導のもとで伸びる","ex":"Small businesses often flourish when the local community offers strong support.","exm":"地域社会が強い支援を提供すると、小さな会社はしばしば繁栄する。","us":"自動詞で人・植物・経済・才能など幅広い主語をとる。thriveとほぼ同義でセットで覚えるとよい。","tip":"flower(花)と語源が近く、花が咲き誇るように生き生きと栄えるイメージを持つとよい。"},{"w":"perish","pos":"動","m":"死ぬ；滅びる","nu":"事故や災害などで命を落とすことを表す、dieより重々しい語。","ph":"perish in the disaster","phm":"その災害で命を落とす","ex":"Without careful planning, small island nations could perish as sea levels rise.","exm":"慎重な計画がなければ、小さな島国は海面上昇によって滅びる可能性がある。","us":"dieよりも硬く、文学的・報道的な文脈で使われる。「perish from/in+原因」で死因を示すこともある。","tip":"完全に消え去るイメージの語で、形容詞perishable(傷みやすい)と合わせて覚える。"},{"w":"soar","pos":"動","m":"急上昇する；舞い上がる","nu":"鳥が空高く飛ぶように価格や数値が勢いよく急上昇する様子を表す。","ph":"soar to a record high","phm":"記録的な高さまで急上昇する","ex":"Ticket prices for the concert soar whenever a famous band performs.","exm":"有名なバンドが演奏するときはいつもコンサートのチケット価格が急上昇する。","us":"自動詞で数値・気温・鳥・飛行機など具体・抽象どちらの主語にも使える。riseより急激で高いイメージ。","tip":"鳥が空高く舞い上がる元のイメージから、グラフが急に跳ね上がる様子にも使われると覚える。"},{"w":"dwindle","pos":"動","m":"徐々に減る","nu":"数量や勢いが時間をかけて少しずつ小さくなる様子を表す語。","ph":"dwindle to almost nothing","phm":"ほとんど無くなるまで減る","ex":"Membership in the chess club began to dwindle after the winter break.","exm":"冬休みの後、チェス部の部員数は徐々に減り始めた。","us":"自動詞で、急な減少ではなく緩やかな減少を表す点がdecreaseとの違い。「dwindling+名詞」の形容詞的用法も多い。","tip":"decreaseよりも「じわじわ縮む」響きを持つ語で、動詞変化はdwindle-dwindled-dwindledと規則的。"},{"w":"disrupt","pos":"動","m":"混乱させる；中断させる","nu":"順調に進んでいた流れを急に乱して止めてしまうことを表す語。","ph":"disrupt the class","phm":"授業を妨害する","ex":"A sudden fire alarm can disrupt an important exam without any warning.","exm":"突然の火災報知器が、何の前触れもなく重要な試験を妨げることがある。","us":"他動詞で交通・授業・生活・システムなど進行中の物事を目的語に取る。名詞形disruption、形容詞disruptiveも頻出する。","tip":"dis(分離)+rupt(壊す、ruptureと同語源)から、秩序を壊して破裂させるイメージで覚える。"},{"w":"discard","pos":"動","m":"捨てる；処分する","nu":"もう不要になった物や考えを思い切って手放すという硬めの語。","ph":"discard old clothes","phm":"古い服を処分する","ex":"Please discard any notes you no longer need before the exam.","exm":"試験の前に、もう必要のないノートは処分してください。","us":"他動詞で物理的な物にも、計画やアイデアなど抽象的なものにも使える語。","tip":"dis(離れて)+card(カード)が語源で、トランプの不要札を捨てる動作から意味が広がったと覚える。"},{"w":"disclose","pos":"動","m":"明らかにする；暴露する","nu":"今まで秘密にされていた情報を公式に公開するというやや硬い語。","ph":"disclose personal information","phm":"個人情報を開示する","ex":"The company refused to disclose how much data it actually collected.","exm":"その会社は実際にどれほどのデータを収集したか明らかにすることを拒んだ。","us":"「disclose that節」や「disclose+wh節」の形も取る。名詞形disclosure(開示)と合わせて覚えるとよい。","tip":"dis(否定・逆)+close(閉じる)から、閉じていたものを開くイメージで情報公開につながると覚える。"},{"w":"deceive","pos":"動","m":"だます；欺く","nu":"相手に嘘を信じ込ませ意図的に誤解させることを表す動詞。","ph":"deceive customers","phm":"顧客をだます","ex":"The advertisement seemed to deceive shoppers about the product's real price.","exm":"その広告は商品の本当の価格について買い物客をだましているようだった。","us":"他動詞で人を目的語に取る。「deceive A into -ing」で「Aをだまして~させる」という頻出表現がある。","tip":"名詞形deception(欺瞞)、形容詞deceptive(人を欺くような)とセットで覚える。receiveと綴りが似ているので注意。"},{"w":"defy","pos":"動","m":"逆らう；無視する","nu":"権威やルール、予想などに正面から従わず立ち向かう強い語。","ph":"defy the rules","phm":"規則に逆らう","ex":"The stubborn student decided to defy the strict dress code.","exm":"その頑固な生徒は厳しい服装規定に逆らうことに決めた。","us":"他動詞で規則・権威・命令・重力などを目的語に取る。「defy description(言葉で表せない)」という慣用表現も覚えておくとよい。","tip":"obeyの反対のイメージで覚える。名詞defiance(反抗)、形容詞defiant(反抗的な)と合わせて語彙を広げる。"},{"w":"comply","pos":"動","m":"従う；応じる","nu":"規則や要求に対して素直に合わせて行動することを表す動詞。","ph":"comply with the regulations","phm":"規則に従う","ex":"All students must comply with the new safety guidelines immediately.","exm":"すべての生徒は新しい安全指針にすぐに従わなければならない。","us":"自動詞で必ず「comply with+名詞」の形を取り、withを忘れやすいので注意。obeyより公式な規則への服従を表す。","tip":"com(共に)+ply(満たす、fillと同語源)から、要求を満たして応じるイメージで覚える。名詞形complianceも頻出する。"},{"w":"adhere","pos":"動","m":"固執する；付着する","nu":"規則や信念に忠実に従う、または物理的にぴったり付着することを表す。","ph":"adhere to the schedule","phm":"予定を厳守する","ex":"Team members must adhere to the schedule during the entire tournament.","exm":"チームメンバーは大会期間中ずっと予定を厳守しなければならない。","us":"自動詞で「adhere to+名詞」の形を取る。stick toと似た構造だが、規則や信念に使われやすくよりフォーマル。","tip":"ad(~へ)+here(くっつく)が語源。物がくっつくイメージから考えや規則に従う意味に広がったと覚える。"},{"w":"conceal","pos":"動","m":"隠す","nu":"感情や事実を他人に気づかれないよう意図的に隠すという、hideより書き言葉的な語。","ph":"conceal one's feelings","phm":"自分の感情を隠す","ex":"She tried hard to conceal her nervousness before the big speech.","exm":"彼女は大事なスピーチの前、緊張を隠そうと必死だった。","us":"他動詞で目的語に感情・情報・物を取る。revealの反対語として一緒に覚えると整理しやすい。","tip":"con(完全に)+ceal(隠す、cellと同語源)から、すっぽり覆い隠すイメージで覚える。"},{"w":"contend","pos":"動","m":"主張する；争う","nu":"議論の中で自分の考えを強く主張することを表す、argueより硬い語。","ph":"contend that","phm":"~だと主張する","ex":"Critics contend that the new policy will hurt small local businesses.","exm":"批評家たちは、その新しい政策が地元の小さな企業を傷つけると主張している。","us":"「contend that節」で主張を述べる用法と、「contend with(困難に対処する)」という自動詞用法の両方を押さえる。","tip":"名詞contention(論争点)、形容詞contentious(論争の的になる)とあわせて覚える。"},{"w":"strive","pos":"動","m":"努力する；奮闘する","nu":"高い目標に向け困難を乗り越えながら努力し続けることを表す語。","ph":"strive for excellence","phm":"優秀さを目指して努力する","ex":"Every athlete on the team must strive to improve daily practice habits.","exm":"チームのすべての選手が、日々の練習習慣を改善しようと努力しなければならない。","us":"自動詞で「strive for+目標」「strive to do」の形を取る。try hardよりも粘り強い努力のニュアンスが強い。","tip":"過去形strove、過去分詞strivenという不規則変化を持つ点に注意して覚える。"},{"w":"mitigate","pos":"動","m":"緩和する；軽くする","nu":"悪い影響や被害の程度を弱めることを表す、災害関連でよく使う語。","ph":"mitigate the damage","phm":"被害を軽減する","ex":"New building codes can mitigate damage caused by future earthquakes.","exm":"新しい建築基準は、将来の地震による被害を軽減できる。","us":"他動詞でrisk, damage, effectなど悪影響を表す名詞を目的語に取る。alleviateとほぼ同義で置き換え可能なことが多い。","tip":"mit(和らげる)というラテン語由来。名詞形mitigation(緩和策)は環境ニュースの頻出語。"},{"w":"nurture","pos":"動","m":"育む；養育する","nu":"子供や才能、関係などを愛情深く時間をかけて育てることを表す語。","ph":"nurture talent","phm":"才能を育む","ex":"Good coaches nurture confidence in players who used to doubt themselves.","exm":"良いコーチは、以前は自分を疑っていた選手たちの自信を育む。","us":"他動詞で子供・才能・関係・アイデアなど幅広く目的語に取る。natureと語形が似ているが意味は無関係なので注意。","tip":"nurse(看護する)と同語源。fosterと近いが、より愛情や時間をかけて育てるニュアンスが強い。"},{"w":"omit","pos":"動","m":"省く；除く","nu":"必要な情報や項目をリストや文章から意図的または不注意で抜かすこと。","ph":"omit important details","phm":"重要な詳細を省く","ex":"Try not to omit any key points when you summarize the article.","exm":"記事を要約するときは、重要な点を省かないようにしなさい。","us":"他動詞で「omit to do」「omit doing」両方の形が可能だが、omit+名詞の形が最も一般的。","tip":"leave outとほぼ同義。過去形・過去分詞omittedはmが重なる点に注意して覚える。"},{"w":"outweigh","pos":"動","m":"上回る；勝る","nu":"2つのものを比べ一方の重要性や価値がもう一方を超えることを表す。","ph":"outweigh the risks","phm":"リスクを上回る","ex":"For most students, the benefits of exercise outweigh the extra time it takes.","exm":"多くの生徒にとって、運動の利点はそれにかかる余分な時間を上回る。","us":"他動詞で「A outweigh B」の形でAとBを直接比較する。受動態にはほとんどしない点に注意。","tip":"out(超えて)+weigh(重さを量る)から、天秤にかけて重さで上回るイメージそのままの語。"},{"w":"alleviate","pos":"動","m":"軽減する；和らげる","nu":"苦痛や問題の程度を一時的にでも和らげることを表す語。","ph":"alleviate the pain","phm":"痛みを和らげる","ex":"A short break can alleviate stress before a difficult final exam.","exm":"短い休憩は、難しい期末試験の前のストレスを和らげることができる。","us":"他動詞でpain, stress, povertyなど苦しみを表す名詞を目的語に取る。mitigateとほぼ同義で入れ替え可能な場面が多い。","tip":"al(~へ)+levi(軽い、英語のlightと同語源)から、重荷を軽くするイメージで覚える。"},{"w":"artifact","pos":"名","m":"人工遺物；工芸品","nu":"過去の人間が作った歴史的・文化的に価値のある道具や物を指す語。","ph":"an ancient artifact","phm":"古代の遺物","ex":"The museum displayed an artifact discovered near an old riverbed.","exm":"その博物館は、古い川底の近くで発見された遺物を展示していた。","us":"可算名詞で単数・複数どちらも使う。考古学・歴史の文脈でよく登場し、fossil(化石、自然物)とは区別される。","tip":"art(技術)+fact(作られたもの)が語源。人の手で作られた物という点をfossilとの違いとして意識する。"},{"w":"breakthrough","pos":"名","m":"大発見；突破口","nu":"長く行き詰まっていた状況が一気に前進する重要な瞬間を指す語。","ph":"a major breakthrough","phm":"大きな進展・大発見","ex":"Scientists announced a breakthrough that could finally cure the rare disease.","exm":"科学者たちは、その珍しい病気をついに治せるかもしれない大発見を発表した。","us":"可算名詞で「a breakthrough in+分野」の形をよく取る。研究・医療・技術のニュースで頻出する語。","tip":"break(壊す)+through(通り抜ける)から、壁を打ち破って先に進むイメージそのままの語で覚えやすい。"},{"w":"compassion","pos":"名","m":"思いやり；同情","nu":"苦しんでいる相手に心を寄せ助けたいと感じる深い共感の気持ち。","ph":"show compassion","phm":"思いやりを示す","ex":"The nurse treated every patient with great compassion and patience.","exm":"その看護師は、あらゆる患者を大きな思いやりと忍耐をもって扱った。","us":"不可算名詞で冠詞をつけない。「compassion for/toward+人」の形で対象を示すことが多い。","tip":"com(共に)+passion(苦しみ)が語源で、相手と共に苦しみを感じる気持ちとして覚える。"},{"w":"counterpart","pos":"名","m":"対応するもの；相当する人","nu":"別の組織や国で同じ役割・地位にある人や物を指す語。","ph":"foreign counterpart","phm":"外国の同業者・相手方","ex":"The Japanese minister met with her counterpart from a neighboring country.","exm":"日本の大臣は、近隣国の相手方の大臣と会談した。","us":"可算名詞で「A's counterpart」「counterpart in/from+場所」の形が多い。外交・ビジネスのニュース記事で頻出する。","tip":"counter(対応する)+part(部分)から、もう一方の側で対になる役割を果たす人・物と考えると覚えやすい。"},{"w":"endeavor","pos":"名","m":"努力；試み","nu":"難しい目標を達成しようとする真剣で継続的な取り組みを指す。","ph":"a joint endeavor","phm":"共同の取り組み","ex":"Building the robot was a challenging endeavor for the science club.","exm":"ロボットを作ることは、科学部にとって挑戦的な取り組みだった。","us":"可算名詞として「an endeavor」の形でよく使う。動詞としても「endeavor to do(~しようと努める)」の形で使われる。","tip":"en(~にする)+devoir(義務)が語源。義務感を持って全力を尽くす取り組みというイメージで覚える。"},{"w":"famine","pos":"名","m":"飢饉","nu":"食糧が極端に不足し多くの人が飢えに苦しむ深刻な社会的災害。","ph":"a severe famine","phm":"深刻な飢饉","ex":"The long drought eventually led to a devastating famine in the region.","exm":"長い干ばつは、最終的にその地域で壊滅的な飢饉を引き起こした。","us":"可算名詞で「a famine」の形をよく取る。hunger(空腹感)より規模が大きい社会現象を指す点が異なる。","tip":"語頭のfamはfamily(家族)と似ているが無関係。食べ物(food)が無い状態と関連づけて覚えるとよい。"},{"w":"flaw","pos":"名","m":"欠陥；傷","nu":"完璧ではないことを示す小さな欠点や弱点を指す、性格にも使う語。","ph":"a design flaw","phm":"設計上の欠陥","ex":"Engineers found a small flaw in the bridge's original design plan.","exm":"技術者たちは、その橋の当初の設計案に小さな欠陥を見つけた。","us":"可算名詞で「flaw in+物・計画・性格」の形を取る。動詞flaw、形容詞flawless(完璧な)とあわせて覚える。","tip":"defectとほぼ同義だが、flawはやや小さく人間味のある欠点というニュアンスを持つ。"},{"w":"fossil","pos":"名","m":"化石","nu":"大昔の動植物の遺骸が地層の中で長い年月をかけ石のように残った物。","ph":"dig up a fossil","phm":"化石を掘り出す","ex":"The students carefully brushed dirt away from the ancient fossil.","exm":"生徒たちは、古代の化石から慎重に土を払い落とした。","us":"可算名詞。fossil fuel(化石燃料)という頻出複合語も一緒に覚えておくとよい。","tip":"自然にできた大昔の生物の痕跡という点で、人が作ったartifact(人工遺物)と対比して覚えると区別しやすい。"},{"w":"fraud","pos":"名","m":"詐欺","nu":"人をだまして金銭や利益を不正に得る行為、またはその行為者。","ph":"commit fraud","phm":"詐欺を働く","ex":"Police arrested the man for committing credit card fraud downtown.","exm":"警察は、市街地でクレジットカード詐欺を働いた男を逮捕した。","us":"不可算名詞として「行為」を表す用法と、可算名詞で「詐欺師」を表す用法(a fraud)の両方がある。","tip":"動詞deceiveと同じ「だます」仲間の語として、形容詞fraudulent(不正な)とセットで覚える。"},{"w":"friction","pos":"名","m":"摩擦","nu":"物同士がこすれる物理的抵抗、または人間関係の意見の衝突を表す。","ph":"cause friction","phm":"摩擦を引き起こす","ex":"Different opinions about the schedule caused friction among the club members.","exm":"予定に関する意見の違いが、部員間の摩擦を引き起こした。","us":"不可算名詞。理科の授業では「摩擦力」、日常会話では「人間関係の対立」の意味で使われる。","tip":"理科で習う物理用語の摩擦が、そのまま人間関係の軋轢にも比喩的に使われると覚える。"},{"w":"glacier","pos":"名","m":"氷河","nu":"山や極地でできる長い年月をかけゆっくり動く巨大な氷の塊。","ph":"a melting glacier","phm":"溶けていく氷河","ex":"Scientists measured how quickly the glacier had melted over ten years.","exm":"科学者たちは、10年間で氷河がどれほど急速に溶けたかを測定した。","us":"可算名詞。地球温暖化に関する英文で頻出し、iceberg(氷山、海に浮かぶ氷塊)と混同しないよう注意する。","tip":"フランス語のglace(氷)に由来し、glacial(氷のような、冷ややかな)と同語源。英語のglass(ガラス)とはつづりが似ているだけで語源は異なるので混同しないよう注意。"},{"w":"habitat","pos":"名","m":"生息地","nu":"動植物が自然に生きて育つことができる特定の環境や場所を指す語。","ph":"natural habitat","phm":"自然の生息地","ex":"Cutting down forests destroys the natural habitat of many wild animals.","exm":"森林伐採は、多くの野生動物の自然の生息地を破壊する。","us":"可算名詞。「habitat for/of+動植物」の形でよく使い、environment(環境全般)よりも生物種に結びついた場所を指す。","tip":"inhabit(住む)、inhabitant(住民)と語根habが共通しており、住む場所という意味のまとまりで覚える。"},{"w":"hazard","pos":"名","m":"危険；危険要因","nu":"事故やけがにつながりうる具体的な危険の原因や要素を指す語。","ph":"a fire hazard","phm":"火災の危険要因","ex":"Loose cables on the floor can become a serious safety hazard.","exm":"床に散らばったコードは、深刻な安全上の危険要因になりうる。","us":"可算名詞で「a hazard to/for+人・物」の形を取る。動詞「hazard a guess(思い切って推測する)」という慣用表現も覚えておくとよい。","tip":"dangerが漠然とした危険な状態なら、hazardは危険の原因となる具体的な物・要素を指すと区別する。"},{"w":"hygiene","pos":"名","m":"衛生；衛生管理","nu":"病気予防のための清潔さや習慣を指し、単なる「きれい」より医学的な意味合いが強い。","ph":"personal hygiene","phm":"個人の衛生管理","ex":"The school nurse always talks about hygiene before lunch break starts","exm":"保健の先生はいつも昼休み前に衛生について話す。","us":"不可算名詞として使う。「personal hygiene」や「dental hygiene」のように特定の分野を表す語と結びつくことが多い。","tip":"語源はギリシャ神話の健康の女神Hygieiaから。「hygienic（形）」という形容詞形も覚えておこう。"},{"w":"inflation","pos":"名","m":"インフレ；物価上昇","nu":"物価全体が継続的に上がる経済現象を指し、日常会話でも値上がりの意味で使われる。","ph":"rising inflation","phm":"上昇するインフレ","ex":"My mother complains that inflation makes snacks more expensive every month","exm":"母はインフレのせいでお菓子が毎月値上がりすると文句を言う。","us":"経済用語としては不可算名詞。「inflation rate（インフレ率）」のようにニュース記事でよく使われる。","tip":"動詞「inflate（膨らませる）」から派生した語で、風船が膨らむイメージで物価が膨張すると覚える。"},{"w":"innovation","pos":"名","m":"革新；新機軸","nu":"新しい技術や方法を生み出すことで、単なる変化ではなく画期的な進歩を強調する語。","ph":"technological innovation","phm":"技術革新","ex":"The science club presented an innovation that could reduce plastic waste","exm":"科学部はプラスチックごみを減らせる革新的な発明を発表した。","us":"可算・不可算どちらでも使われ、具体的な発明を指す時は可算名詞になる。動詞は「innovate」、形容詞は「innovative」。","tip":"ラテン語の「新しくする」が語源。「invention（発明）」より「実用化して社会を変える」ニュアンスが強い。"},{"w":"irony","pos":"名","m":"皮肉；反語","nu":"予想や言葉と実際の結果が正反対になる状況を指し、笑いや苦さを伴うことが多い。","ph":"the irony is that","phm":"皮肉なことに","ex":"The irony is that the fire station itself caught fire yesterday","exm":"皮肉なことに、消防署自体が昨日火事になった。","us":"不可算名詞として使うことが多い。形容詞形「ironic」や副詞「ironically」も文中でよく登場する。","tip":"「言葉の意味と本心が食い違う」という語源イメージ。日本語の「皮肉」よりやや客観的な状況描写にも使う。"},{"w":"legacy","pos":"名","m":"遺産；受け継いだもの","nu":"財産だけでなく、前の世代や先人が残した業績・伝統・影響を指す語。","ph":"leave a legacy","phm":"遺産を残す","ex":"Our retiring coach wants to leave a legacy of teamwork and respect","exm":"引退する監督はチームワークと敬意という遺産を残したいと思っている。","us":"可算名詞で「a legacy of ~」の形で使われることが多い。ITでは「legacy system（旧式のシステム）」という意味でも使われる。","tip":"ラテン語「委任する」が語源。人が去った後にも残る「影響」や「意味」に注目すると覚えやすい。"},{"w":"livestock","pos":"名","m":"家畜","nu":"農場で飼育される牛・豚・羊などをまとめて指す集合的な語。","ph":"raise livestock","phm":"家畜を飼育する","ex":"My grandfather still raises livestock on his small farm in the countryside","exm":"祖父は今も田舎の小さな農場で家畜を飼育している。","us":"常に単数扱いの不可算名詞で、複数のsをつけない。数える時は「a herd of livestock」のように表現する。","tip":"「live（生きている）+ stock（蓄え）」から成る語。「生きた資産」というイメージで覚えると良い。"},{"w":"offspring","pos":"名","m":"子孫；子","nu":"人間にも動物にも使え、生物学的な「子」を指すやや形式的な語。","ph":"produce offspring","phm":"子孫を残す","ex":"The biology teacher explained how insects protect their offspring from predators","exm":"生物の先生は昆虫がどう天敵から子孫を守るか説明した。","us":"単数形と複数形が同じ形（無変化）。単数でも複数でも「offspring」のまま使う。","tip":"「off（〜から離れて）+ spring（湧き出る）」がもとの意味。親から生まれ出るものというイメージ。"},{"w":"outbreak","pos":"名","m":"発生；勃発","nu":"病気や紛争など好ましくない事態が突然広がり始めることを表す語。","ph":"an outbreak of","phm":"〜の発生","ex":"The school closed early because of a sudden outbreak of the flu","exm":"インフルエンザが突然発生したため、学校は早めに休校になった。","us":"可算名詞。「an outbreak of disease/violence/war」のように「of」で対象を続けることが多い。","tip":"「out（外へ）+ break（破れる）」が語源イメージ。抑えられていたものが一気に噴き出す様子を表す。"},{"w":"abrupt","pos":"形","m":"突然の；ぶっきらぼうな","nu":"予告なく急に起こる変化や、態度が急で冷たい印象を与える様子を表す。","ph":"an abrupt change","phm":"突然の変化","ex":"Her abrupt reply made me wonder if she was upset with me","exm":"彼女の突然のそっけない返事に、怒っているのかと思った。","us":"名詞の前に置く用法が多い。人の態度に使うと「無愛想」というマイナスの含みが出る。","tip":"ラテン語「ぷつんと折れる」が語源。「sudden」より否定的なニュアンスが強いと覚える。"},{"w":"acute","pos":"形","m":"深刻な；鋭い；急性の","nu":"問題や痛みが急激で強い状態を表し、医学用語では「急性」の意味で使う。","ph":"an acute shortage","phm":"深刻な不足","ex":"The town is facing an acute shortage of clean drinking water","exm":"その町はきれいな飲み水の深刻な不足に直面している。","us":"「acute pain（激痛）」「acute problem（深刻な問題）」のように名詞を前から修飾する。対義語は慢性を表す「chronic」。","tip":"ラテン語「鋭い」が語源で、感覚が鋭い「acute sense」にも、問題が深刻な意味にも使う。"},{"w":"adverse","pos":"形","m":"不利な；逆の","nu":"天候・条件・影響などが人にとって好ましくない方向に働く様子を表す。","ph":"adverse effects","phm":"悪影響","ex":"The medicine can cause adverse effects if taken with certain foods","exm":"その薬は特定の食品と一緒に摂ると悪影響を引き起こすことがある。","us":"「adverse effect/condition/weather」のように名詞の前で使う形式的な語。「averse（嫌がって）」と綴りが似ているので混同注意。","tip":"ラテン語「〜に向かって反対する」が語源。人に不利な方向に向かうイメージで覚える。"},{"w":"coherent","pos":"形","m":"首尾一貫した","nu":"話や文章の筋が通っていて、論理的に理解しやすい様子を表す語。","ph":"a coherent argument","phm":"筋の通った主張","ex":"She gave a coherent explanation of why the experiment had failed","exm":"彼女はなぜ実験が失敗したのか筋の通った説明をした。","us":"「coherent argument/plan/explanation」のように論理性を評価する場面で使う。対義語は「incoherent（支離滅裂な）」。","tip":"ラテン語の「haerere（くっつく）」に「co-（共に）」がついた語。「adhere（付着する）」と同じ語根を持ち、部分同士がしっかりつながっているイメージ。"},{"w":"compatible","pos":"形","m":"互換性のある；両立する","nu":"二つ以上のものが問題なく一緒に機能したり、うまくやっていける様子を表す。","ph":"compatible with","phm":"〜と互換性がある","ex":"This new charger is compatible with almost every smartphone model available","exm":"この新しい充電器はほぼすべてのスマートフォン機種と互換性がある。","us":"前置詞「with」を伴い「be compatible with ~」の形で使うのが基本。機器の相性にも人間関係にも使える。","tip":"ラテン語「共に耐える」が語源。対義語は「incompatible（相容れない）」。"},{"w":"contagious","pos":"形","m":"伝染性の；感染する","nu":"接触や空気を通して人から人へ広がる病気、また感情や雰囲気が広がる様子も表す。","ph":"highly contagious","phm":"感染力が強い","ex":"The doctor said the virus is highly contagious among young children","exm":"医者はそのウイルスが幼い子供の間で感染力が強いと言った。","us":"病気だけでなく「a contagious smile/laughter（伝わる笑顔）」のように感情の伝播にも使える。","tip":"「con（共に）+ tangere（触れる）」が語源。接触によって広がるイメージを持つと覚えやすい。"},{"w":"credible","pos":"形","m":"信頼できる；本当らしい","nu":"話や証拠が信じるに値し、疑う理由が少ないと感じられる様子を表す。","ph":"a credible source","phm":"信頼できる情報源","ex":"The journalist refused to publish the story without a credible source","exm":"その記者は信頼できる情報源なしにその記事を公表するのを拒んだ。","us":"「credible witness/evidence/source」のように情報の信頼性を評価する時に使う。「credulous（信じやすい）」と混同しないよう注意。","tip":"ラテン語「信じる」が語源。「incredible（信じられないほどすごい）」の反対の落ち着いた意味だと覚える。"},{"w":"detrimental","pos":"形","m":"有害な","nu":"健康・環境・関係などに長期的な悪影響を及ぼす、ややかたい表現。","ph":"detrimental to","phm":"〜に有害な","ex":"Too much screen time can be detrimental to a teenager's sleep quality","exm":"画面を見過ぎることは10代の睡眠の質に有害になりうる。","us":"「be detrimental to ~」の形で使う。「harmful」よりフォーマルで、レポートや論説文でよく見る。","tip":"ラテン語「すり減らす」が語源。じわじわダメージを与えるイメージを持つと覚えやすい。"},{"w":"fertile","pos":"形","m":"肥沃な；豊かな","nu":"土地が作物を育てるのに適している様子や、アイデアが豊富に生まれる様子を表す。","ph":"fertile soil","phm":"肥沃な土壌","ex":"The river valley has fertile soil that farmers have used for centuries","exm":"その川沿いの谷には農家が何世紀も利用してきた肥沃な土壌がある。","us":"土壌以外にも「a fertile imagination（豊かな想像力）」のように比喩的にも使える。対義語は「infertile/barren」。","tip":"ラテン語「実り豊かな」が語源。「fertility（肥沃さ）」という名詞形も一緒に覚えておこう。"},{"w":"futile","pos":"形","m":"無駄な；無益な","nu":"努力してもどうせ成功しないと分かっている、報われない試みを表す語。","ph":"a futile attempt","phm":"無駄な試み","ex":"He made a futile attempt to fix the broken bike before practice","exm":"彼は練習前に壊れた自転車を直そうと無駄な試みをした。","us":"「a futile attempt/effort」の形でよく使われる。「in vain（無駄に）」と意味が近いが、futileは形容詞である点に注意。","tip":"ラテン語「漏れやすい」が語源。水が漏れる容器のように努力が無駄になるイメージ。"},{"w":"imminent","pos":"形","m":"差し迫った","nu":"良くない出来事がごく近い将来にほぼ確実に起こりそうな緊迫感を表す。","ph":"imminent danger","phm":"差し迫った危険","ex":"The weather report warned that a typhoon's arrival was imminent tonight","exm":"天気予報は今夜台風の到来が差し迫っていると警告した。","us":"名詞の前に置く用法（imminent danger）と、「be imminent」のように述語として使う用法がある。良い意味には基本使わない。","tip":"ラテン語「上にせり出す」が語源。今にも落ちてきそうなものをイメージすると覚えやすい。"},{"w":"indispensable","pos":"形","m":"不可欠な","nu":"それがなければ物事が成り立たないほど重要な存在や道具を表す強い語。","ph":"an indispensable tool","phm":"不可欠な道具","ex":"Her advice became an indispensable part of our club's decision making","exm":"彼女の助言は私たちの部の意思決定に欠かせないものになった。","us":"「indispensable to/for ~」の形をとることが多い。「essential」よりも「なくては困る」という強い必要性を示す。","tip":"「in（否定）+ dispensable（手放せる）」が語源。「手放すことができない」と直訳すると覚えやすい。"}]};

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000);}
const app=()=>document.getElementById('app');
function pad2(n){return String(n).padStart(2,'0');}
function dstr(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function todayStr(){return dstr(new Date());}
function addDaysStr(s,n){const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d+n);return dstr(dt);}
function speak(text){try{if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.92;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
let AC=null;
function sfx(kind){
  if(ST.sound===false)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const mk=(f0,f1,dur,delay,type,vol)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=type;o.frequency.setValueAtTime(f0,t+delay);
      if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+delay+dur);
      g.gain.setValueAtTime(vol,t+delay);g.gain.exponentialRampToValueAtTime(0.001,t+delay+dur);
      o.connect(g);g.connect(AC.destination);o.start(t+delay);o.stop(t+delay+dur);
    };
    if(kind==='good'){mk(660,660,0.09,0,'sine',0.14);mk(990,990,0.14,0.09,'sine',0.14);}
    else if(kind==='bad'){mk(200,130,0.22,0,'square',0.06);}
    else if(kind==='fanfare'){mk(523,523,0.13,0,'sine',0.13);mk(659,659,0.13,0.13,'sine',0.13);mk(784,784,0.13,0.26,'sine',0.13);mk(1046,1046,0.3,0.39,'sine',0.13);}
  }catch(e){}
}
function confetti(){
  const colors=['#ffb703','#8ecae6','#2ec4b6','#ff6b6b','#b388ff','#ffd166'];
  for(let i=0;i<50;i++){
    const s=document.createElement('div');s.className='cf';
    s.style.left=Math.random()*100+'vw';
    s.style.width=s.style.height=(6+Math.random()*8)+'px';
    s.style.background=colors[i%colors.length];
    s.style.borderRadius=Math.random()<.5?'50%':'2px';
    s.style.animationDuration=(1.6+Math.random()*1.8)+'s';
    s.style.animationDelay=(Math.random()*0.6)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),4200);
  }
}

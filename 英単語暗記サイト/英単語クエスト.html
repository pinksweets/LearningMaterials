ffect(名詞、影響・結果)を混同しやすいので品詞で区別する。"},{"w":"appear","pos":"動","m":"現れる；〜に見える","nu":"今までなかったものが視界に入ることや、外見からそう判断されることを表す。","ph":"appear on stage","phm":"舞台に現れる","ex":"A rainbow began to appear over the hill after the storm.","exm":"嵐の後、丘の上に虹が現れ始めた。","us":"appear to be ~で「〜のように見える」という意味になり、seemとほぼ同じ働きをする。","tip":"反対語はdisappear(消える)。appearance(外見、出現)という名詞形も一緒に覚えておく。"},{"w":"apply","pos":"動","m":"申し込む；適用する","nu":"制度や仕事に自分から働きかけて申し込んだり、ルールや方法を当てはめたりする意味を持つ。","ph":"apply for a job","phm":"仕事に応募する","ex":"Many graduates apply for jobs at this company every spring.","exm":"多くの卒業生が毎年春にこの会社の仕事に応募する。","us":"apply for ~(申し込む)とapply A to B(AをBに適用する)の2つの使い方を区別する。","tip":"名詞形application(申し込み、アプリ)は日常でも使われるので、意味のつながりで覚えやすい。"},{"w":"argue","pos":"動","m":"主張する；口論する","nu":"自分の意見の正しさを理由を挙げて述べたり、相手と言い争ったりする様子を表す。","ph":"argue with a friend","phm":"友達と口論する","ex":"The two brothers often argue about which movie to watch.","exm":"その兄弟はどの映画を見るかについてよく口論する。","us":"argue that ~で「〜だと主張する」、argue with人about ~で「人と〜について口論する」となる。","tip":"名詞argument(議論、口論)と一緒に覚える。fight(けんか)より言葉による対立を指す。"},{"w":"arrange","pos":"動","m":"手配する；並べる","nu":"会合や旅行などが順調に進むよう前もって準備したり、物を整然と配置したりする意味を持つ。","ph":"arrange a meeting","phm":"会議を手配する","ex":"Our teacher will arrange a meeting with our parents next week.","exm":"先生は来週、私たちの保護者との面談を手配する予定だ。","us":"arrange to do ~「〜する手はずを整える」、arrange for人to do ~の形も押さえておく。","tip":"名詞arrangement(準備、配置)。「アレンジする」という日本語のカタカナ語と近い感覚で使える。"},{"w":"adopt","pos":"動","m":"採用する；養子にする","nu":"新しい考え方・方法・子どもなどを自分のものとして正式に取り入れることを表す。","ph":"adopt a new method","phm":"新しい方法を採用する","ex":"The soccer team decided to adopt a new training method this year.","exm":"サッカー部は今年、新しいトレーニング方法を採用することに決めた。","us":"adopt a plan/policyのように制度や方針を目的語に取ることが多く、adopt a childで養子縁組も表す。","tip":"adapt(適応させる)とつづりが似ているので区別する。adoptは「取り入れる」、adaptは「合わせる」と覚える。"},{"w":"attract","pos":"動","m":"引きつける","nu":"人の興味・注意・視線などを自然に引き寄せる魅力があることを表す語。","ph":"attract attention","phm":"注目を集める","ex":"Bright posters on the wall attract attention from passing students.","exm":"壁の鮮やかなポスターが通りかかる生徒たちの注目を集める。","us":"attract A to Bで「AをBに引き寄せる」、受け身be attracted to ~「〜に魅力を感じる」もよく使う。","tip":"名詞attraction(魅力、観光名所)。ad-「〜へ」+tract「引く」で「引き寄せる」と覚える。"},{"w":"belong","pos":"動","m":"属する","nu":"ある集団・場所・人に自分がふさわしい形で所属している、あるいは所有物であることを表す。","ph":"belong to a club","phm":"部活に所属する","ex":"I belong to the art club and paint every Wednesday afternoon.","exm":"私は美術部に所属していて、毎週水曜の午後に絵を描いている。","us":"進行形にせず、belong to ~の形で状態を表す。前置詞toを忘れないよう注意する。","tip":"名詞belongings(持ち物、所持品)とセットで覚える。「そこに沿って(long)ある」という古い語源から所属を連想する。"},{"w":"cause","pos":"動","m":"引き起こす；原因","nu":"ある出来事が結果を生み出す直接のきっかけになることを表す語。","ph":"cause a problem","phm":"問題を引き起こす","ex":"Too much homework can cause stress for many high school students.","exm":"宿題が多すぎると多くの高校生にストレスを引き起こすことがある。","us":"cause+結果の他動詞用法が基本で、the cause of ~「〜の原因」という名詞用法も頻出する。","tip":"reason(理由、説明のための根拠)とcause(直接の原因)の違いを意識して使い分ける。"},{"w":"communicate","pos":"動","m":"伝える；意思疎通する","nu":"考え・気持ち・情報を言葉や態度を通して相手に伝え、理解し合うことを表す。","ph":"communicate with others","phm":"他人と意思疎通する","ex":"It is important to communicate clearly with your group members during projects.","exm":"課題の間、グループのメンバーと明確に意思疎通することが大切だ。","us":"communicate with人で「人と意思疎通する」、communicate A to Bで「AをBに伝える」の形も取る。","tip":"名詞communication(伝達、意思疎通)。communityと同じ語源で「共有する」イメージを持つ。"},{"w":"complain","pos":"動","m":"不平を言う","nu":"不満や苦情を、言葉に出して相手に伝えるという意味合いを持つ。","ph":"complain about the noise","phm":"騒音について不満を言う","ex":"Some neighbors complain about the noise from our band practice.","exm":"近所の人の中には私たちのバンド練習の騒音について不満を言う人もいる。","us":"complain about/of ~の形を取り、complain that ~で不満の内容を節で述べることもできる。","tip":"名詞complaint(苦情)。似た響きのcompliment(褒め言葉)と混同しないよう気をつける。"},{"w":"complete","pos":"動","m":"完成させる；完全な","nu":"何かを終わりまでやり遂げ、欠けたところがない状態にすることを表す語。","ph":"complete an assignment","phm":"課題を完成させる","ex":"Students must complete this assignment before the deadline on Friday.","exm":"生徒は金曜日の締め切り前にこの課題を完成させなければならない。","us":"動詞として「完成させる」、形容詞として「完全な」の両方で使われる頻度の高い語。","tip":"finish(単に終える)よりも「欠けなく仕上げる」ニュアンスが強い。completion(完成)という名詞形も覚える。"},{"w":"connect","pos":"動","m":"つなぐ","nu":"二つ以上の物・場所・人を関係づけたり、物理的につないだりすることを表す。","ph":"connect to the internet","phm":"インターネットに接続する","ex":"This app helps students connect with classmates studying the same subject.","exm":"このアプリは同じ科目を勉強するクラスメートと生徒をつなぐのに役立つ。","us":"connect A to/with Bで「AをBにつなぐ」となり、connect to ~で「〜に接続する」を表す。","tip":"名詞connection(つながり、接続)。disconnect(接続を切る)と対で覚えると理解しやすい。"},{"w":"contain","pos":"動","m":"含む","nu":"容器や文書、物が中に何かを持っている状態を表す、状態を示す語。","ph":"contain useful information","phm":"役立つ情報を含む","ex":"This textbook chapter may contain useful information for the history exam.","exm":"この教科書の章には歴史の試験に役立つ情報が含まれているかもしれない。","us":"進行形にはせず、状態動詞として使う。containerは「容器」という関連の名詞。","tip":"includeとほぼ同じ意味だが、containは「中に入っている」という物理的な包含のイメージが強い。"},{"w":"damage","pos":"名","m":"損害；被害","nu":"物や体に生じた、目に見える形の傷や損失を表す名詞。","ph":"cause damage to property","phm":"財産に損害を与える","ex":"The storm caused serious damage to the school's baseball field.","exm":"その嵐は学校の野球場に深刻な被害をもたらした。","us":"通常は不可算名詞として使い、複数形damagesにすると「損害賠償金」という別の意味になる。","tip":"動詞にも同じ形damageがあり「損害を与える」の意味になる。injury(人のけが)とdamage(物への損害)を区別する。"},{"w":"depend","pos":"動","m":"頼る；次第である","nu":"結果や判断が他の物事や人の助けによって決まる、または左右されることを表す。","ph":"depend on the weather","phm":"天気次第である","ex":"Whether we practice outside will depend on the weather tomorrow.","exm":"外で練習するかどうかは明日の天気次第だ。","us":"必ずdepend on/upon ~の形を取り、前置詞onを省略しないよう注意する。","tip":"形容詞dependent(頼っている)、反対語independent(自立した)と一緒に覚えると効果的。"},{"w":"destroy","pos":"動","m":"破壊する","nu":"建物や物を跡形もなく壊し、完全に使えない状態にすることを表す強い語。","ph":"destroy the environment","phm":"環境を破壊する","ex":"Cutting down too many trees can destroy the local environment quickly.","exm":"木を切りすぎると、地域の環境をすぐに破壊してしまうことがある。","us":"damage(部分的に傷つける)より強く、完全に壊す・失わせるという意味を持つ。","tip":"名詞destruction(破壊)。壊された結果は取り戻せないというニュアンスまで含む強い語だと覚える。"},{"w":"hesitate","pos":"動","m":"ためらう","nu":"決断や行動の前に、不安や迷いから一瞬立ち止まってしまう様子を表す。","ph":"hesitate to ask","phm":"質問するのをためらう","ex":"Don't hesitate to ask your teacher if you have any questions.","exm":"質問があれば遠慮せずに先生に尋ねてください。","us":"hesitate to do ~の形で「〜するのをためらう」を表す、日常会話でも頻出の表現。","tip":"名詞hesitation(ためらい)。Don't hesitate to ~は依頼や勧誘で定番の表現として丸ごと覚える。"},{"w":"discover","pos":"動","m":"発見する","nu":"今まで知られていなかった事実や物を初めて見つけ出すことを表す。","ph":"discover a new fact","phm":"新事実を発見する","ex":"Scientists hope to discover a new species of fish in the deep sea.","exm":"科学者たちは深海で新種の魚を発見することを望んでいる。","us":"discover(偶然や探求の末に発見する)とinvent(何もないところから発明する)の違いに注意する。","tip":"名詞discovery(発見)。dis-(取り除く)+cover(覆い)で「隠れていたものを見つける」と覚える。"},{"w":"earn","pos":"動","m":"稼ぐ；得る","nu":"労働や努力の対価として、お金や信頼、評価などを得ることを表す。","ph":"earn money","phm":"お金を稼ぐ","ex":"Many high school students earn money through a part-time job.","exm":"多くの高校生はアルバイトを通してお金を稼ぐ。","us":"earn money/a livingのようにお金だけでなく、earn trust/respectのように信頼や評価を得る意味でも使う。","tip":"win(競争に勝って得る)やget(単に手に入れる)と違い、努力の対価というニュアンスを含む。"},{"w":"employ","pos":"動","m":"雇う","nu":"給料を払って人を仕事に従事させる、ややフォーマルな語。","ph":"employ a new worker","phm":"新しい従業員を雇う","ex":"The local bakery decided to employ a new worker for the summer.","exm":"地元のパン屋はこの夏、新しい従業員を雇うことに決めた。","us":"hireとほぼ同じ意味だが、employは書き言葉でよりフォーマルな場面に使われることが多い。","tip":"名詞employee(従業員)とemployer(雇い主)、employment(雇用)を合わせて覚えると混同しない。"},{"w":"exist","pos":"動","m":"存在する","nu":"実際にこの世に存在している、または成立している状態を表す語。","ph":"exist in nature","phm":"自然界に存在する","ex":"Many rare plants still exist in the mountains near our town.","exm":"多くの珍しい植物が私たちの町の近くの山に今も存在している。","us":"進行形にはせず、状態を表す動詞として使う。there existのように文頭にthereを置く形もある。","tip":"名詞existence(存在)。exit(出口)とスペルが似ているので混同しないよう注意する。"},{"w":"fail","pos":"動","m":"失敗する","nu":"目標や試験などをうまく成し遂げられないことを表す語。","ph":"fail an exam","phm":"試験に落ちる","ex":"If you fail this exam, you can always take it again.","exm":"もしこの試験に落ちても、また受け直すことができる。","us":"fail to do ~で「〜し損なう」、fail an examで「試験に落ちる」と、目的語によって意味が変わる。","tip":"名詞failure(失敗)。反対語succeed(成功する)とセットで覚えると使い分けやすい。"},{"w":"handle","pos":"動","m":"扱う；対処する","nu":"問題・道具・状況などを適切に処理したり操作したりすることを表す。","ph":"handle the situation","phm":"状況に対処する","ex":"Our captain knows how to handle the situation during a tough match.","exm":"私たちのキャプテンは厳しい試合中に状況にどう対処するか知っている。","us":"deal with ~とほぼ同じ意味で使え、handle A with care「Aを丁寧に扱う」のような表現もある。","tip":"名詞としては「取っ手」の意味もあり、そこから「扱う」の動詞用法が生まれたと理解すると覚えやすい。"},{"w":"measure","pos":"動","m":"測る","nu":"長さ・重さ・程度などを数値で明らかにするために測定することを表す。","ph":"measure the temperature","phm":"温度を測る","ex":"We used a thermometer to measure the temperature in the classroom.","exm":"私たちは教室の温度を測るために温度計を使った。","us":"動詞のほか、名詞として「measures(対策、手段)」の形で使われることも多い。","tip":"名詞measurement(測定、寸法)。take measures「対策を取る」という熟語表現も一緒に覚える。"},{"w":"perform","pos":"動","m":"行う；演じる","nu":"仕事や役割をきちんと実行したり、舞台や試合で技を披露したりすることを表す。","ph":"perform on stage","phm":"舞台で演じる","ex":"Our drama club will perform on stage during the school festival.","exm":"私たちの演劇部は学園祭で舞台に立って演じる予定だ。","us":"perform a task「作業を行う」とperform on stage「舞台で演じる」の両方の用法がある。","tip":"名詞performance(公演、成績)。名詞performer(演者)とあわせて覚えるとよい。"},{"w":"persuade","pos":"動","m":"説得する","nu":"理由や言葉を尽くして、相手の考えや行動を変えさせることを表す語。","ph":"persuade someone to join","phm":"参加するよう説得する","ex":"I tried to persuade my friend to join the volunteer club.","exm":"私はボランティア部に入るよう友達を説得しようとした。","us":"persuade人to do ~の形が基本で、convince(納得させる)と意味が近いが行動を促す点を強調する。","tip":"名詞persuasion(説得)。try to persuade A to do ~を丸ごと文で覚えると使いやすい。"},{"w":"predict","pos":"動","m":"予測する","nu":"これまでの情報や経験をもとに、これから起こることを前もって述べることを表す。","ph":"predict the weather","phm":"天気を予測する","ex":"Scientists use satellites to predict the weather for the next week.","exm":"科学者たちは来週の天気を予測するために人工衛星を使う。","us":"predict that ~で節を続けることもでき、guess(単なる当てずっぽう)より根拠のある推測を表す。","tip":"名詞prediction(予測)。pre-(前もって)+dict(言う)という成り立ちから「前もって言う」と覚える。"},{"w":"prefer","pos":"動","m":"〜のほうを好む","nu":"二つ以上の選択肢を比較して、一方をより好ましいと感じることを表す語。","ph":"prefer tea to coffee","phm":"コーヒーより紅茶を好む","ex":"My sister and I both prefer tea to coffee in the morning.","exm":"私と姉は二人とも朝はコーヒーより紅茶のほうを好む。","us":"prefer A to B、またはprefer to do rather than doの形で比較の対象を示す。","tip":"likeより控えめで比較のニュアンスを含む。名詞preference(好み)も一緒に覚える。"},{"w":"promote","pos":"動","m":"促進する；昇進させる","nu":"物事の発展を後押ししたり、人の地位を上げたりすることを表す語。","ph":"promote good health","phm":"健康の増進を図る","ex":"Regular exercise can promote good health among busy high school students.","exm":"定期的な運動は忙しい高校生の間で健康の増進につながる。","us":"物事を「促進する」意味と、人を「昇進させる」意味の両方を文脈で使い分ける。","tip":"名詞promotion(昇進、販促)。pro-(前へ)というイメージで「前に押し進める」と覚える。"},{"w":"prove","pos":"動","m":"証明する","nu":"証拠や事実を示して、あることが正しいと明らかにすることを表す語。","ph":"prove a theory","phm":"理論を証明する","ex":"This experiment will help us prove our theory about plant growth.","exm":"この実験は植物の成長についての私たちの理論を証明する助けになるだろう。","us":"prove that ~、prove A to be Bの形も取り、「結果的に〜だとわかる」の意味でも使われる。","tip":"名詞proof(証拠)。過去分詞provedのほかprovenが形容詞的に使われることもある。"},{"w":"publish","pos":"動","m":"出版する；発表する","nu":"本や記事、研究結果などを世に送り出し、多くの人に読めるようにすることを表す。","ph":"publish a book","phm":"本を出版する","ex":"The school newspaper club will publish a special issue next month.","exm":"新聞部は来月、特別号を発行する予定だ。","us":"publish a book/articleのように文書や作品を目的語に取り、報道・研究発表にも使われる。","tip":"名詞publication(出版、出版物)、publisher(出版社)と一緒に覚えると語彙が広がる。"},{"w":"compete","pos":"動","m":"競争する；張り合う","nu":"他者と同じ目標を争って競う意味。スポーツの試合や市場での競争など幅広い場面で使う。","ph":"compete for the championship","phm":"選手権をかけて競う","ex":"Our team will compete against the strongest school in the tournament.","exm":"私たちのチームは大会で最も強い学校と対戦する。","us":"compete with/against A（人と競う）、compete for A（Aを得るために競う）の形をとる。自動詞なので目的語は前置詞を伴う。","tip":"competition（競争）、competitor（競争相手）と関連語。com-(共に)+pete(求める)が語源とされる。"},{"w":"concentrate","pos":"動","m":"集中する；濃縮する","nu":"注意や力を一点に集めること。勉強に集中するなど、心を一つの対象に向ける場面で使う。","ph":"concentrate on your studies","phm":"勉強に集中する","ex":"I need to concentrate on my homework before the test tomorrow.","exm":"明日のテストの前に宿題に集中する必要がある。","us":"concentrate on A（Aに集中する）の形が基本。名詞形concentration（集中、濃度）も重要。","tip":"con-(共に)+centr(中心)で「中心に集める」イメージ。focusと近いが「意識を凝縮する」ニュアンスが強い。"},{"w":"consume","pos":"動","m":"消費する；食べる","nu":"エネルギー・時間・食物などを使い切ること。useより堅く、formalな場面で使われる語。","ph":"consume a large amount of energy","phm":"大量のエネルギーを消費する","ex":"Playing video games all night can consume too much of your time.","exm":"一晩中ゲームをすると時間を消費しすぎることがある。","us":"他動詞で目的語を直接とる。consumption（消費）、consumer（消費者）も頻出の関連語。","tip":"con-(完全に)+sume(取る)が語源。「使い果たす」イメージを持つとuseとの違いが分かる。"},{"w":"contribute","pos":"動","m":"貢献する；寄付する","nu":"集団の成功や目的のために力・お金・意見を差し出すこと。チームや社会への貢献を表す。","ph":"contribute to the team's success","phm":"チームの成功に貢献する","ex":"Every member should contribute to the class festival in some way.","exm":"生徒全員が何らかの形で文化祭に貢献するべきだ。","us":"contribute to A（Aに貢献する）の形でtoを伴う。前置詞toを落としやすいので注意する。","tip":"contribution（貢献、寄付）は名詞形。tribute(捧げ物)から「共に捧げる」イメージで覚える。"},{"w":"convince","pos":"動","m":"納得させる；説得する","nu":"相手に論理や証拠を示して信じさせること。persuadeと近いが「確信させる」点を強調する語。","ph":"convince someone to join the club","phm":"人を説得して部活に入らせる","ex":"She managed to convince her parents to let her study abroad.","exm":"彼女は両親を説得して留学させてもらうことに成功した。","us":"convince A to do（Aに〜するよう納得させる）、convince A of B（AにBを確信させる）の形をとる。","tip":"persuadeは「行動を促す」、convinceは「考えを信じさせる」に重点がある。con-(強意)+vince(打ち勝つ)が語源。"},{"w":"delay","pos":"動","m":"遅らせる；延期する","nu":"予定より遅く行う、または起こることを遅らせること。名詞としても同形でよく使われる。","ph":"delay the meeting until next week","phm":"会議を来週まで延期する","ex":"Heavy snow will delay the school bus this morning.","exm":"大雪で今朝のスクールバスが遅れるだろう。","us":"他動詞。postponeとほぼ同義だが、delayは結果として遅延が生じる意味でも使える。","tip":"名詞delay（遅延）も同形で頻出。be delayed（遅れる）という受動形もよく使われる。"},{"w":"establish","pos":"動","m":"設立する；確立する","nu":"組織・制度・関係などを新たに作り、しっかりと築くこと。書き言葉に多いformalな語。","ph":"establish a new rule for the club","phm":"部活の新しい規則を設ける","ex":"The students worked together to establish a recycling program at school.","exm":"生徒たちは協力して学校にリサイクル制度を設立した。","us":"他動詞でestablish A（Aを設立する・確立する）の形をとる。名詞establishment（施設、設立）も覚えておく。","tip":"stable(安定した)と語源が近く、「しっかり立てる」イメージを持つと覚えやすい。"},{"w":"examine","pos":"動","m":"調べる；診察する","nu":"詳しく注意深く調べること。医師の診察やテストで確認する意味でも使われる。","ph":"examine the results carefully","phm":"結果を注意深く調べる","ex":"The doctor will examine your arm after the accident today.","exm":"医師は事故の後、今日あなたの腕を診察するだろう。","us":"他動詞でexamine A（Aを調べる）の形。名詞examination（試験、検査）はexamと略されることが多い。","tip":"checkよりformalで徹底的に調べるニュアンスを持つ。exam(試験)と同語源。"},{"w":"graduate","pos":"動","m":"卒業する","nu":"学校の課程を修了して卒業すること。自動詞として使われることが多い語。","ph":"graduate from high school next spring","phm":"来春高校を卒業する","ex":"My brother will graduate from university next March.","exm":"兄は来年3月に大学を卒業する予定だ。","us":"graduate from A（Aを卒業する）の形でfromを伴う。前置詞を落とさないよう注意する。","tip":"名詞graduate（卒業生）、graduation（卒業式）も頻出。grade(学年)と語源が近い。"},{"w":"ignore","pos":"動","m":"無視する","nu":"気づいていても意図的に相手や事実に注意を払わないこと。","ph":"ignore his advice completely","phm":"彼の助言を完全に無視する","ex":"Please don't ignore the warning signs before the exam.","exm":"試験前の警告サインを無視しないでください。","us":"他動詞でignore A（Aを無視する）の形。neglect（怠る）と違い、気づいた上で故意に無視する意味が強い。","tip":"ignorance（無知）と関連語。「知らないふりをする」イメージで覚えるとよい。"},{"w":"impress","pos":"動","m":"感銘を与える；感心させる","nu":"人に強く良い印象を与えること。be impressedの受け身の形で頻繁に使われる。","ph":"impress the audience with her speech","phm":"スピーチで聴衆に感銘を与える","ex":"Her speech at the ceremony will impress everyone in the hall.","exm":"彼女のスピーチは式典で会場の全員に感銘を与えるだろう。","us":"impress A with B（BでAに感銘を与える）の形。be impressed by/with A（Aに感銘を受ける）の受動形が会話では多い。","tip":"impressive（印象的な）、impression（印象）と関連語。press(押す)から「心に刻み込む」イメージ。"},{"w":"obtain","pos":"動","m":"得る；獲得する","nu":"努力して何かを手に入れること。getよりformalで、書き言葉によく使われる語。","ph":"obtain permission from the teacher","phm":"先生から許可を得る","ex":"Students must obtain permission before using the science lab.","exm":"生徒は理科室を使う前に許可を得なければならない。","us":"他動詞でobtain A（Aを得る）の形。getのformal版として、書き言葉やレポートでよく使う。","tip":"ob-(〜に向かって)+tain(保持する)から「手に入れて保持する」イメージ。gainと近いが努力の過程を含む。"},{"w":"organize","pos":"動","m":"組織する；企画する","nu":"物事や人を計画的に整理し、まとめること。イベントの企画などにもよく使われる。","ph":"organize a school festival together","phm":"一緒に文化祭を企画する","ex":"The committee will organize a charity event next month for everyone.","exm":"委員会は来月みんなのためにチャリティーイベントを企画する。","us":"他動詞でorganize A（Aを組織・整理する）の形。organization（組織、団体）、organized（整理された）も頻出。","tip":"organ(器官)と同語源で「各部分を機能的にまとめる」イメージを持つと覚えやすい。"},{"w":"participate","pos":"動","m":"参加する","nu":"活動やイベントに積極的に加わること。joinよりformalで、inを伴う自動詞。","ph":"participate in the debate contest","phm":"ディベート大会に参加する","ex":"More students should participate in club activities after school.","exm":"もっと多くの生徒が放課後の部活動に参加すべきだ。","us":"participate in A（Aに参加する）の形でinを必ず伴う。前置詞を省略しないよう注意する。","tip":"part(部分)+cip(取る)で「一部を担う」イメージ。名詞participation（参加）、participant（参加者）も重要。"},{"w":"recover","pos":"動","m":"回復する；取り戻す","nu":"病気やけがをした状態や、失った物事から元の良い状態に戻ることを表す語。","ph":"recover from a bad cold","phm":"ひどい風邪から回復する","ex":"It took a week for him to recover from the flu.","exm":"彼がインフルエンザから回復するのに1週間かかった。","us":"recover from A（Aから回復する）の形が基本。物を取り戻す意味では他動詞recover A（Aを取り戻す）も使う。","tip":"ラテン語recuperare（re-「再び」+capere「取る」）が語源とされる。「再び取り戻す」イメージ。recovery（回復）は名詞形。"},{"w":"regret","pos":"動","m":"後悔する；残念に思う","nu":"過去の行動や選択を悔やむ気持ちを表す語。to不定詞と動名詞で意味が変わる点に注意。","ph":"regret not studying harder","phm":"もっと熱心に勉強しなかったことを後悔する","ex":"I regret not joining the tennis club last year.","exm":"去年テニス部に入らなかったことを後悔している。","us":"regret doing（〜したことを後悔する）とregret to do（残念ながら〜する）は意味が異なるので区別が必要。","tip":"regretful(後悔している)という形容詞もある。re-(再び)+gret(嘆く)で「繰り返し悔やむ」と覚える。"},{"w":"release","pos":"動","m":"解放する；発表する","nu":"束縛や制限から解き放つこと。新製品や情報を「公開する」意味でも頻繁に使われる。","ph":"release the new album next month","phm":"来月新しいアルバムを発表する","ex":"The band will release their new song next Friday afternoon.","exm":"そのバンドは来週の金曜日の午後に新曲を発表する。","us":"他動詞でrelease A（Aを解放する、公開する）の形。名詞としても同形release（発売、公開）で使われる。","tip":"re-(再び)+lease(緩める)から「締め付けを緩めて自由にする」イメージで覚える。"},{"w":"satisfy","pos":"動","m":"満足させる","nu":"人の要求や期待を満たすこと。be satisfied with（〜に満足）の受動形が頻出する。","ph":"satisfy the teacher's requirements","phm":"先生の要求を満たす","ex":"Her essay did not satisfy the strict requirements of the contest.","exm":"彼女のエッセイはそのコンテストの厳しい要件を満たさなかった。","us":"他動詞でsatisfy A（Aを満足させる）の形。be satisfied with A（Aに満足している）という受動形での使用頻度が高い。","tip":"satisfaction（満足）、satisfactory（満足のいく）と関連語。「十分にする」イメージで覚える。"},{"w":"select","pos":"動","m":"選ぶ；選抜する","nu":"複数の中から慎重に選び出すこと。chooseよりややformalで、選抜のニュアンスが強い。","ph":"select the best candidate for captain","phm":"キャプテンに最もふさわしい候補者を選ぶ","ex":"The coach will select five players for the final match.","exm":"コーチは決勝戦に出る5人の選手を選抜するだろう。","us":"他動詞でselect A（Aを選ぶ）の形。selection（選択、選抜）、selective（選択的な）も頻出。","tip":"se-(分けて)+lect(選ぶ)から「区別して選び出す」イメージ。chooseより公式な場面向き。"},{"w":"separate","pos":"動","m":"分ける；分離する","nu":"一つのものを二つ以上に分けること。物理的な分離にも人間関係の意味にも使う。","ph":"separate the trash into categories","phm":"ゴミを分類して分ける","ex":"We need to separate the recyclable trash from the regular trash.","exm":"資源ゴミと通常のゴミを分ける必要がある。","us":"separate A from B（AをBから分ける）の形。形容詞separate（別々の）とはアクセント・発音が異なる点に注意。","tip":"se-(離れて)+par(準備する)が語源とされる。動詞と形容詞で発音が変わる点を意識する。"},{"w":"struggle","pos":"動","m":"苦闘する；もがく","nu":"困難な状況の中で懸命に努力すること。精神的・身体的な苦労のどちらにも使う。","ph":"struggle to finish the homework","phm":"宿題を終わらせようと苦闘する","ex":"Many students struggle to balance club activities and studying for exams.","exm":"多くの生徒は部活と試験勉強の両立に苦闘している。","us":"struggle to do（〜しようと苦闘する）、struggle with A（Aと格闘する）の形が頻出の自動詞。","tip":"名詞としても同形struggle（苦闘、奮闘）で使われる。tryより「強い抵抗の中での努力」を表す。"},{"w":"succeed","pos":"動","m":"成功する；継承する","nu":"目標を達成すること。succeed in（〜に成功する）の形が基本で、継承する意味もある。","ph":"succeed in passing the exam","phm":"試験に合格するのに成功する","ex":"She hopes to succeed in the speech contest this year.","exm":"彼女は今年のスピーチコンテストで成功したいと思っている。","us":"succeed in doing（〜することに成功する）の形でinを伴う。名詞success、形容詞successfulと区別して覚える。","tip":"suc-(下から)+ceed(行く)で「後に続いて上手くいく」イメージ。succeed to the throne（王位を継ぐ）の意味も派生。"},{"w":"warn","pos":"動","m":"警告する；注意する","nu":"危険や問題が起こる前に相手へ知らせ、注意するよう促すこと。","ph":"warn students about the danger","phm":"生徒たちに危険について警告する","ex":"The teacher will warn us about the difficult questions on the test.","exm":"先生はテストの難問について私たちに警告するだろう。","us":"warn A about/of B（AにBについて警告する）、warn A to do（Aに〜するよう警告する）の形をとる。","tip":"名詞warning（警告）も同じ語根。「危険を前もって知らせる」イメージを持つと覚えやすい。"},{"w":"escape","pos":"動","m":"逃げる；免れる","nu":"危険や束縛から逃れること。物理的な脱出だけでなく、責任などを免れる意味もある。","ph":"escape from the burning building","phm":"燃えている建物から逃げる","ex":"The students had to escape from the classroom during the fire drill.","exm":"生徒たちは避難訓練の間、教室から避難しなければならなかった。","us":"escape from A（Aから逃げる）の形が一般的だが、escape A（Aを免れる）と前置詞なしで使う場合もある。","tip":"語源はラテン語で「マントを脱いで逃げる」に由来するとされる。名詞としても同形escape（逃亡）で使う。"},{"w":"benefit","pos":"名","m":"利益；恩恵","nu":"何かによってもたらされる良い効果や得なこと。for the benefit ofの形も頻出。","ph":"for the benefit of the community","phm":"地域社会の利益のために","ex":"There is one clear benefit to studying with friends after school.","exm":"放課後に友達と一緒に勉強することには一つの明らかな利点がある。","us":"可算・不可算どちらでも使われるが、具体的な利点を指すときは可算(a benefit, benefits)。動詞としても使われる。","tip":"bene-(良い)+fit(行う)がラテン語源で「良い行いをする」イメージ。advantageより恩恵・利益寄りの語。"},{"w":"opportunity","pos":"名","m":"機会；好機","nu":"何かをするのに良いタイミングや状況。chanceよりやや formalで、前向きな機会を指す。","ph":"a great opportunity to study abroad","phm":"留学する絶好の機会","ex":"Studying overseas gave her a great opportunity to improve her English.","exm":"海外留学は彼女に英語を上達させる絶好の機会を与えた。","us":"opportunity to do / opportunity for A（〜する機会）の形。可算名詞で、通例a/anやtheを伴う。","tip":"chanceより「有利な状況で得られる機会」というニュアンスが強い。opportune(タイミングの良い)と同語源。"},{"w":"influence","pos":"名","m":"影響；影響力","nu":"人や物事の考え方・行動を変える力。良い意味・悪い意味のどちらにも使える語。","ph":"have a strong influence on students","phm":"生徒に強い影響を与える","ex":"Social media has a huge influence on how teenagers think today.","exm":"ソーシャルメディアは今日、10代の若者の考え方に大きな影響を与えている。","us":"influence on/over A（Aへの影響）の形。動詞としても同形influence（影響を与える）で使われる。","tip":"in-(中に)+flu(流れる)がラテン語源で「中に流れ込んで作用する」イメージ。effect（結果）との違いに注意。"},{"w":"advantage","pos":"名","m":"利点；有利な点","nu":"他と比べて有利になる点。take advantage of（〜を利用する）の形が頻出。","ph":"take advantage of this chance","phm":"この機会を利用する","ex":"Living near the station is a big advantage for busy students.","exm":"駅の近くに住んでいることは忙しい生徒にとって大きな利点だ。","us":"advantage of/over Aの形。可算名詞でan advantage、advantagesと使う。反意語disadvantage（不利な点）も覚える。","tip":"ad-(〜へ)+vantage(前方)から「前に出ている状態」のイメージ。benefitより比較上の有利さを強調する。"},{"w":"amount","pos":"名","m":"量；総額","nu":"物の分量や合計の大きさを表す。数えられない名詞と共に使われることが多い。","ph":"a large amount of homework","phm":"大量の宿題","ex":"She spends a huge amount of time practicing the piano every day.","exm":"彼女は毎日ピアノの練習に膨大な量の時間を費やしている。","us":"amount of A（Aの量）の形で、不可算名詞と結びつくことが多い。可算名詞にはnumber of Aを使う点に注意。","tip":"動詞amount to A（合計Aになる、結局Aに等しい）という表現も重要。numberとの使い分けを意識する。"},{"w":"attention","pos":"名","m":"注意；関心","nu":"意識を向けて集中すること。pay attention to（〜に注意を払う）の形が最重要。","ph":"pay attention to the teacher","phm":"先生に注意を払う","ex":"Please pay more attention to safety during the chemistry experiment.","exm":"化学の実験中は安全にもっと注意を払ってください。","us":"pay attention to Aの形が定番。不可算名詞で、通常冠詞をつけない。","tip":"attend(出席する、注意を払う)と同語源。「意識を一点に向ける」イメージで覚える。"},{"w":"attitude","pos":"名","m":"態度；考え方","nu":"物事や人に対する心の持ち方や姿勢。positive attitude（前向きな態度）などの形で頻出。","ph":"a positive attitude toward learning","phm":"学びに対する前向きな態度","ex":"Having a positive attitude helps you overcome difficult situations at school.","exm":"前向きな態度を持つことは学校での困難な状況を乗り越える助けになる。","us":"attitude toward/to A（Aに対する態度）の形。可算名詞でan attitudeのように使う。","tip":"behaviorが「実際の行動」を指すのに対し、attitudeは「心の中の姿勢・考え方」を表す点で区別する。"},{"w":"audience","pos":"名","m":"聴衆；観客","nu":"講演やコンサート、番組などを見聞きする人々の集団を指す集合名詞。","ph":"the audience clapped loudly","phm":"聴衆は大きな拍手を送った","ex":"The whole audience clapped loudly after the choir's final song.","exm":"合唱の最後の曲の後、聴衆全員が大きな拍手を送った。","us":"集合名詞で単数・複数どちらの動詞とも一致しうるが、英作文では単数扱いが基本。an audience of 500 peopleのように使う。","tip":"audio(音)と同語源で「耳を傾ける人々」のイメージ。テレビ・ラジオの視聴者にも使える。"},{"w":"behavior","pos":"名","m":"行動；振る舞い","nu":"人が実際にとる行動や振る舞い方。日頃の態度が表れる具体的な行動を指す。","ph":"change his behavior in class","phm":"授業中の彼の振る舞いを変える","ex":"The teacher praised his good behavior during the school trip.","exm":"先生は修学旅行での彼の良い振る舞いを褒めた。","us":"主に不可算名詞。米国式behavior、英国式behaviourのつづり違いに注意する。","tip":"behave（振る舞う）の名詞形。attitude（考え方）に対し、behaviorは「目に見える行動」を指す。"},{"w":"character","pos":"名","m":"性格；登場人物","nu":"人の性質や人柄、または小説・映画の登場人物を指す語。","ph":"build a strong character","phm":"強い人格を築く","ex":"Playing team sports can help build a strong character in teens.","exm":"チームスポーツをすることは10代の若者の強い人格を築く助けになる。","us":"「性格」の意味では不可算的に使われることが多いが、「登場人物」の意味では可算名詞。文脈で意味が変わる点に注意。","tip":"personality（性格）と似るが、characterは「道徳的な強さ・人格」も含意する点で異なる。"},{"w":"community","pos":"名","m":"地域社会；共同体","nu":"同じ地域や関心を共有する人々の集まり。学校や地域、オンライン上の集団にも使う。","ph":"serve the local community","phm":"地元の地域社会に貢献する","ex":"Our club volunteers to help the local community every weekend.","exm":"私たちの部活は毎週末、地元の地域社会を助けるボランティアをしている。","us":"可算名詞でa community、communitiesと使う。集合的に「〜の人々全体」を指す場合もある。","tip":"common（共通の）と同語源で「共通のものを持つ人々の集まり」というイメージ。"},{"w":"condition","pos":"名","m":"状態；条件","nu":"物や人の状態、または何かが成立するための条件を表す。複数形で「状況」の意味も。","ph":"in good condition","phm":"良い状態で","ex":"The old bicycle is still in good condition after five years.","exm":"その古い自転車は5年経った今でも良い状態を保っている。","us":"in ... condition（〜な状態で）の形が頻出。「条件」の意味ではon one condition（一つの条件で）のように使う。","tip":"複数形conditions（環境、状況）と単数conditionで意味の焦点が変わる点に注意する。"},{"w":"disease","pos":"名","m":"病気；疾患","nu":"身体や心の特定の病気を指す語。sicknessよりも医学的で具体的な病名を含意する。","ph":"prevent the spread of disease","phm":"病気の蔓延を防ぐ","ex":"Washing your hands often helps prevent the spread of disease.","exm":"頻繁に手を洗うことは病気の蔓延を防ぐのに役立つ。","us":"可算・不可算両方で使われ、特定の病名を指す時はa disease、一般的な「病気」全般はdiseaseと無冠詞で使う。","tip":"illness（体調不良全般）より、diseaseは「特定できる疾患」を指す点で区別される。"},{"w":"distance","pos":"名","m":"距離","nu":"二点間の物理的な隔たり。比喩的に人間関係の隔たりを表す意味でも使う。","ph":"keep a safe distance","phm":"安全な距離を保つ","ex":"The distance between my house and school is about two kilometers.","exm":"私の家から学校までの距離は約2キロメートルだ。","us":"distance between A and B（AとBの間の距離）、distance from A（Aからの距離）の形をよく使う。","tip":"distant（遠い）の名詞形。in the distance（遠くに）という熟語も頻出。"},{"w":"emotion","pos":"名","m":"感情","nu":"喜び・怒り・悲しみなど心の動きを表す語。feelingより強く込み上げる感情を指すことが多い。","ph":"control your emotion during the game","phm":"試合中に感情をコントロールする","ex":"It is not easy to control your emotion during a big match.","exm":"大事な試合の最中に自分の感情をコントロールするのは簡単ではない。","us":"可算・不可算どちらでも使われ、具体的な種類の感情を指す時は可算(emotions)。形容詞emotional（感情的な）も頻出。","tip":"e-(外へ)+motion(動き)がラテン語源で「心が外に動く」イメージ。feelingより強い動揺・高まりを表す。"},{"w":"evidence","pos":"名","m":"証拠","nu":"何かが真実であることを示す事実や資料。不可算名詞で、通常数えない点に注意。","ph":"strong evidence to support her theory","phm":"彼女の理論を裏付ける強力な証拠","ex":"The scientist found strong evidence to support her new theory.","exm":"その科学者は自分の新しい理論を裏付ける強力な証拠を見つけた。","us":"不可算名詞なので、a piece of evidence（一つの証拠）のように数える。evidencesという複数形は基本的に使わない。","tip":"proof（証明）と似るが、evidenceは「証拠となる材料」、proofは「決定的な証明」というニュアンスの違いがある。"},{"w":"expert","pos":"名","m":"専門家；達人","nu":"ある分野を深く知り、経験も豊富な人を指し、ただ詳しいだけの人より一段上の呼び方。","ph":"ask an expert for advice","phm":"専門家に助言を求める","ex":"Our teacher asked an expert to visit the science class today.","exm":"先生は今日、理科の授業に専門家を招くよう頼んだ。","us":"「expert in/on ~」の形で分野を示す。可算名詞で、形容詞としても使え、an expert opinionのように名詞を修飾する。","tip":"experience（経験）と同じ語源で、実際に試して経験を積んだ人という意味合いを持つ。"},{"w":"fear","pos":"名","m":"恐怖；不安","nu":"危険や失敗を予感して感じる強い不安な気持ちを表す、日常でもよく使う語。","ph":"overcome one's fear","phm":"恐怖心を克服する","ex":"Many students feel fear before speaking in front of the class.","exm":"多くの生徒はクラスの前で話す前に恐怖を感じる。","us":"「fear of ~」で「〜への恐れ」を表す。可算・不可算どちらでも使われ、動詞としても同形で使える。","tip":"動詞と名詞が同じ形なので文脈で判断する。worryより強い恐怖感を表す語だと覚える。"},{"w":"feature","pos":"名","m":"特徴；機能","nu":"他と区別できる目立った性質や部分を指し、製品の機能の意味でも使われる。","ph":"a key feature of","phm":"〜の重要な特徴","ex":"The new phone has a feature that helps the battery last longer.","exm":"その新しい電話にはバッテリーを長持ちさせる機能がある。","us":"「feature of ~」の形が多く、製品・地形・性格など幅広い対象に使う可算名詞。","tip":"動詞では「特集する」という意味にもなる。characteristicより日常的でくだけた語だと覚える。"},{"w":"freedom","pos":"名","m":"自由","nu":"束縛や制限を受けずに自分の意志で行動できる状態を表す抽象名詞。","ph":"freedom of speech","phm":"言論の自由","ex":"Students want more freedom to choose their own club activities.","exm":"生徒たちは部活動を自分で選ぶ自由をもっと求めている。","us":"「freedom of ~」「freedom to do」の形をとる不可算名詞。形容詞freeの名詞形。","tip":"free（自由な）+ -dom（状態を表す語尾）で「自由な状態」と覚えるとよい。"},{"w":"generation","pos":"名","m":"世代","nu":"ほぼ同じ時期に生まれ育った人々の集団を指し、価値観の違いを語る時によく使う。","ph":"the younger generation","phm":"若い世代","ex":"My grandmother says every generation faces different kinds of problems.","exm":"祖母は世代ごとに異なる種類の問題に直面すると言う。","us":"「generation gap」で世代間の考え方の違いを表す頻出表現。可算名詞として使う。","tip":"generate（生み出す）と同語源で、次々に生み出される人々のまとまりをイメージする。"},{"w":"average","pos":"名","m":"平均","nu":"複数の数値をならしたときの中間的な値を表し、統計やテストの得点でよく使う。","ph":"on average","phm":"平均して","ex":"On average, students spend two hours on homework every night.","exm":"平均して、生徒は毎晩2時間宿題に費やしている。","us":"「on average」で副詞的に使う頻出表現。形容詞として「average score（平均点）」のようにも使う。","tip":"形容詞・名詞どちらでも使う語。normal（普通の）と違い、数値の計算に基づく点に注意する。"},{"w":"impact","pos":"名","m":"影響；衝撃","nu":"物事に強く働きかけて変化を起こす力を表し、influenceより強い印象を与える。","ph":"have an impact on","phm":"〜に影響を与える","ex":"Social media has a big impact on how teenagers communicate today.","exm":"SNSは今日の十代の若者のコミュニケーション方法に大きな影響を与えている。","us":"「impact on ~」の形をとり、have/makeと共に使われることが多い可算名詞。","tip":"元は「衝突」を意味し、そこから強い「影響」の意味に広がったと考えると覚えやすい。"},{"w":"income","pos":"名","m":"収入","nu":"仕事などによって定期的に得るお金を指し、支出（expense）と対で語られることが多い。","ph":"a stable income","phm":"安定した収入","ex":"Many university students get a small income from part-time jobs.","exm":"多くの大学生はアルバイトからわずかな収入を得ている。","us":"「income from ~」の形をとる。不可算名詞として扱うことが多く、複数形は特定の文脈のみで使う。","tip":"in（中に）+ come（入ってくる）で「入ってくるお金」とイメージすると忘れにくい。"},{"w":"industry","pos":"名","m":"産業；工業","nu":"物を生産したりサービスを提供したりする経済活動全般、または特定の業界を指す。","ph":"the tourism industry","phm":"観光産業","ex":"The video game industry continues to grow rapidly around the world.","exm":"ゲーム産業は世界中で急速に成長し続けている。","us":"「the ~ industry」で特定業界を表す可算名詞。「勤勉」という意味の不可算用法もある。","tip":"industrious（勤勉な）と同語源で、人々が懸命に働いて作り出す活動というイメージ。"},{"w":"issue","pos":"名","m":"問題；論点","nu":"議論や解決が必要な事柄を指し、problemより中立的で客観的な響きを持つ。","ph":"a social issue","phm":"社会問題","ex":"Climate change is an issue that every generation must think about.","exm":"気候変動はあらゆる世代が考えなければならない問題だ。","us":"「issue with/about ~」の形で使う可算名詞。雑誌などの「号」という意味もある。","tip":"problemほど否定的でなく、話し合うべき「論点」というニュアンスを持つ点で区別する。"},{"w":"knowledge","pos":"名","m":"知識","nu":"学習や経験を通じて頭の中に蓄えられた情報や理解の総体を表す。","ph":"a wide range of knowledge","phm":"幅広い知識","ex":"Reading books every day helps students gain a lot of knowledge.","exm":"毎日本を読むことは生徒が多くの知識を得るのに役立つ。","us":"不可算名詞なので複数形にしない点に注意する。「knowledge of ~」で分野を示す。","tip":"know（知る）の名詞形。informationは個々の情報、knowledgeは体系化された理解というイメージ。"},{"w":"lifestyle","pos":"名","m":"生活様式；ライフスタイル","nu":"日々の暮らし方や習慣全体を指し、健康や価値観と結びつけて語られることが多い。","ph":"a healthy lifestyle","phm":"健康的な生活様式","ex":"Eating well and sleeping enough are part of a good lifestyle.","exm":"よく食べてよく眠ることは良い生活様式の一部だ。","us":"可算名詞で、healthy/active/modernなど形容詞と組み合わせて使われることが多い。","tip":"life（生活）+ style（様式）の合成語なので、意味も見た目のまま覚えやすい。"},{"w":"material","pos":"名","m":"材料；物質；生地","nu":"物を作るもとになる物質や、勉強に使う教材など幅広い「素材」を表す。","ph":"raw material","phm":"原材料","ex":"The teacher gave us extra material to study for the exam.","exm":"先生は試験勉強のために追加の教材を私たちにくれた。","us":"物質としては不可算、教材や生地の種類を指す時は可算になることがある。","tip":"matter（物質）と関連語で、具体的な「素材・材料」を表すと覚える。"},{"w":"memory","pos":"名","m":"記憶；思い出","nu":"過去の出来事を心に留めておく力、またはその内容そのものを指す。","ph":"a happy memory","phm":"楽しい思い出","ex":"The school trip left every student with a wonderful memory that will last forever.","exm":"修学旅行はすべての生徒に永遠に残る素晴らしい思い出を残した。","us":"「思い出」の意味では可算、「記憶力」の意味では不可算として使われることが多い。","tip":"memorize（暗記する）と同語源。コンピューターの「メモリー」も同じ語だと覚えると忘れにくい。"},{"w":"method","pos":"名","m":"方法；やり方","nu":"目的を達成するための計画的で体系立ったやり方を表し、wayより形式的な語。","ph":"a new method of teaching","phm":"新しい指導方法","ex":"Our teacher introduced a new method for solving math problems.","exm":"先生は数学の問題を解くための新しい方法を紹介した。","us":"「method of/for ~ing」の形をとる可算名詞。手段全般を表すwayより専門的・体系的な響きを持つ。","tip":"meta（〜に沿って）+ hodos（道）が語源とされ、決まった手順に沿って進む「道」をイメージする。"},{"w":"patient","pos":"名","m":"患者","nu":"医師の治療やケアを受けている人を指す、病院関連の場面で頻出の語。","ph":"treat a patient","phm":"患者を治療する","ex":"The hospital staff worked hard to help every patient recover quickly.","exm":"病院のスタッフはすべての患者が早く回復するよう懸命に働いた。","us":"形容詞「我慢強い」と同じつづりだが意味が異なるので文脈で判断する必要がある。","tip":"patience（忍耐）と語源が同じで、痛みに耐える人＝患者というつながりで覚える。"},{"w":"pattern","pos":"名","m":"パターン；様式","nu":"繰り返し現れる決まった形や傾向を指し、模様や行動の型にも使われる。","ph":"a pattern of behavior","phm":"行動パターン","ex":"Researchers found a clear pattern in how students study before exams.","exm":"研究者たちは生徒が試験前にどう勉強するかに明確なパターンを見出した。","us":"「pattern of/in ~」の形をとる可算名詞。布の模様の意味でも使われる。","tip":"trendが「変化の方向性」を表すのに対し、patternは「繰り返される型」を表す点で区別する。"},{"w":"period","pos":"名","m":"期間；時代；ピリオド","nu":"始まりと終わりのある一定の時間の区切りを表し、歴史の一時代を指すこともある。","ph":"over a long period","phm":"長い期間にわたって","ex":"Our history teacher explained an important period of ancient civilization.","exm":"歴史の先生は古代文明の重要な時代について説明した。","us":"「period of ~」の形で使う可算名詞。授業の「時限」や文末の「句点」の意味でも使われる。","tip":"アメリカ英語では文末の「。」に当たる記号もperiodと呼ぶことを合わせて覚えると便利だ。"},{"w":"population","pos":"名","m":"人口","nu":"ある地域に住む人々の総数を表し、増減や割合を語るときによく使われる。","ph":"population growth","phm":"人口増加","ex":"Japan's population is decreasing because fewer babies are being born.","exm":"日本の人口は、生まれる赤ちゃんが減っているため減少している。","us":"「population of ~」の形をとる。国や都市の人口を表す時は単数扱いが基本の可算名詞。","tip":"popular（人気の・大衆の）と同語源で、「人々の集まり」というイメージでとらえると覚えやすい。"},{"w":"poverty","pos":"名","m":"貧困","nu":"生活に必要なお金や物が十分になく苦しい状態を表す抽象名詞。","ph":"live in poverty","phm":"貧困の中で暮らす","ex":"The charity works to reduce poverty in developing countries around the world.","exm":"その慈善団体は世界中の発展途上国で貧困を減らすために活動している。","us":"不可算名詞で、「poverty line（貧困線）」のように他の語と組み合わせてよく使われる。","tip":"poor（貧しい）の名詞形。wealth（富）が反対の意味を表す語として一緒に覚えると良い。"},{"w":"quality","pos":"名","m":"質；品質","nu":"物や事柄の良し悪しの程度を表し、量（quantity）と対比されることが多い。","ph":"improve the quality of","phm":"〜の質を向上させる","ex":"The new library offers books of much higher quality than before.","exm":"新しい図書館は以前よりずっと質の高い本を提供している。","us":"「quality of ~」の形をとる。不可算名詞として質を表すほか、可算で「特質・特徴」の意味にもなる。","tip":"quantity（量）とセットで覚えると、質と量の対比を英作文でも使いやすくなる。"},{"w":"quantity","pos":"名","m":"量；数量","nu":"物の多さや数の程度を表し、質（quality）と対比して使われることが多い。","ph":"a large quantity of","phm":"大量の〜","ex":"The factory produces a large quantity of products every single day.","exm":"その工場は毎日大量の製品を生産している。","us":"「quantity of ~」の形で使う。可算・不可算どちらの名詞にも使える点でamountより幅広い。","tip":"qualityと語形が似ているので、qualityは「質」、quantityは「量」と対で暗記する。"},{"w":"relationship","pos":"名","m":"関係；人間関係","nu":"人と人、物事同士のつながりや結びつきを表し、感情的な絆を含むことも多い。","ph":"build a relationship","phm":"関係を築く","ex":"Sharing hobbies can help students build a strong relationship with friends.","exm":"趣味を共有することは生徒が友人と強い関係を築く助けになる。","us":"「relationship between A and B」「relationship with ~」の形で使う可算名詞。","tip":"relate（関連づける）の名詞形。connectionより人間的なつながりを強調する語だ。"},{"w":"research","pos":"名","m":"研究；調査","nu":"物事を詳しく調べて新しい知識を得ようとする学問的な活動を表す。","ph":"do research on","phm":"〜について研究する","ex":"The professor conducts research on how teenagers use social media daily.","exm":"その教授は十代の若者が日常的にSNSをどう使うか研究している。","us":"基本的に不可算名詞なので、a researchではなく「a piece of research」や「do research」と使う。","tip":"search（探す）と関連語で、re-（繰り返し）+ searchで「何度も探し調べる」というイメージ。"},{"w":"resource","pos":"名","m":"資源","nu":"利用できる自然の恵みや人・時間・お金など、役立つものの総称を表す。","ph":"a natural resource","phm":"天然資源","ex":"Clean water is a resource that every country truly needs.","exm":"きれいな水はすべての国が本当に必要とする資源だ。","us":"「natural resource」の形で複数形が使われることが多いが、単数でも可算名詞として扱う。","tip":"re-（再び）+ source（源）で、繰り返し利用できる「源」というイメージを持つと覚えやすい。"},{"w":"role","pos":"名","m":"役割；役","nu":"ある立場や状況で果たすべき仕事や機能を表し、演劇の「役」の意味にも使う。","ph":"play an important role","phm":"重要な役割を果たす","ex":"Every member of the team plays a role during the school festival.","exm":"チームの全員が学園祭で役割を果たす。","us":"「play a role in ~」の形が頻出。可算名詞で、劇の「配役」の意味からビジネスの「役割」まで幅広く使う。","tip":"rollと発音が同じ同音異義語なので、スペルの違い（role/roll）を意識して覚える。"},{"w":"skill","pos":"名","m":"技能；技術","nu":"訓練や練習によって身につけた、物事を上手に行う能力を表す。","ph":"learn a new skill","phm":"新しい技能を身につける","ex":"Playing the piano every day helped her develop excellent musical skill.","exm":"毎日ピアノを弾くことが彼女の優れた音楽的技能を伸ばすのに役立った。","us":"「skill in/at ~ing」の形で使う。多くの場合は複数形skillsで具体的な技能を列挙する。","tip":"abilityが生まれつきの能力も含むのに対し、skillは練習して身につけた技術を強調する。"},{"w":"society","pos":"名","m":"社会","nu":"人々が共に生活し、ルールや文化を共有する集団全体を指す語。","ph":"modern society","phm":"現代社会","ex":"Smartphones have changed the way people in modern society communicate with each other.","exm":"スマートフォンは現代社会の人々のコミュニケーションの仕方を変えた。","us":"「society」は不可算で全体社会を指すことが多いが、「a society」で特定の団体を指す可算用法もある。","tip":"socialの名詞形。communityより広い規模の、国や世界レベルの集団をイメージすると良い。"},{"w":"source","pos":"名","m":"源；出所","nu":"物事や情報が生まれ出てくる元、または原因となるものを表す。","ph":"a source of information","phm":"情報源","ex":"The internet has become the main source of news for teenagers.","exm":"インターネットは十代の若者にとって主なニュース源となっている。","us":"「source of ~」の形で使う可算名詞。resourceと似るが、sourceは「出どころ」に焦点がある。","tip":"resourceは「利用できるもの」、sourceは「起源・出どころ」と区別して覚えると混同しにくい。"},{"w":"species","pos":"名","m":"種；種類","nu":"生物を分類する基本単位を指し、動植物の「種」を表す学術的な語。","ph":"an endangered species","phm":"絶滅危惧種","ex":"Scientists discovered a new species of frog in the rainforest recently.","exm":"科学者たちは最近、熱帯雨林で新種のカエルを発見した。","us":"単数形も複数形もspeciesのまま変化しない特殊な名詞なので注意が必要。","tip":"kindやtypeより学術的な語。単複同形（a species / many species）だと意識して覚える。"},{"w":"system","pos":"名","m":"制度；仕組み；体系","nu":"複数の部分が組み合わさって一つの機能を果たす仕組み全体を表す。","ph":"an education system","phm":"教育制度","ex":"Many students think the exam system needs to change soon.","exm":"多くの生徒は入試制度がすぐに変わる必要があると考えている。","us":"「system of ~」の形をとる。可算名詞で、社会制度からコンピューターの仕組みまで幅広く使う。","tip":"syn-（共に）+ stem（立てる）が語源とされ、部分が組み合わさって成り立つ全体をイメージする。"},{"w":"task","pos":"名","m":"課題；任務","nu":"達成すべき具体的な仕事や作業を表し、しばしば負担や難しさを伴う。","ph":"complete a task","phm":"課題を終える","ex":"The teacher gave each group a difficult task to finish today.","exm":"先生は各グループに今日終えるべき難しい課題を与えた。","us":"「task of ~ing」の形をとる可算名詞。jobより一つ一つの具体的な作業を指すことが多い。","tip":"homeworkのような大きな仕事の中の、一つ一つの「作業」を指す語だと覚えると使い分けやすい。"},{"w":"technology","pos":"名","m":"技術；科学技術","nu":"科学の知識を実際に応用して作られた機械や仕組み全体を表す。","ph":"modern technology","phm":"現代の技術","ex":"New technology allows students to study online from their own homes.","exm":"新しい技術によって生徒は自宅からオンラインで学習できる。","us":"全体としての「科学技術」は不可算だが、「a new technology」で具体的な技術を指す可算用法もある。","tip":"techno-（技術）+ -logy（学問）から成る語で、技術に関する学問・応用というイメージで覚える。"},{"w":"tradition","pos":"名","m":"伝統","nu":"世代を超えて受け継がれてきた習慣や考え方、行事を表す語。","ph":"keep a tradition alive","phm":"伝統を守り続ける","ex":"Our school has a tradition of singing together at the entrance ceremony.","exm":"私たちの学校には入学式で共に歌う伝統がある。","us":"「tradition of ~ing」の形をとる可算名詞。形容詞形traditionalも合わせて覚えておくと便利。","tip":"trans-（超えて）+ dare（与える）が語源とされ、世代を超えて伝え渡すものというイメージを持つ。"},{"w":"trend","pos":"名","m":"傾向；流行","nu":"物事が変化していく方向性や、多くの人に広がる流行を表す語。","ph":"a growing trend","phm":"広がりつつある傾向","ex":"Wearing secondhand clothes has become a popular trend among young people.","exm":"古着を着ることは若者の間で人気の流行になっている。","us":"「trend toward/in ~」の形をとる可算名詞。fashionより広く、社会的な変化の方向性も指す。","tip":"patternが繰り返される「型」なのに対し、trendは変化していく「方向性」を表すと区別する。"},{"w":"value","pos":"名","m":"価値；価値観","nu":"物事の重要さや値打ちを表し、複数形で個人の大切にする信念も指す。","ph":"the value of education","phm":"教育の価値","ex":"Many parents try to teach their children the value of honesty.","exm":"多くの親は子どもに正直さの価値を教えようとする。","us":"単数で「価値」、複数形valuesで「価値観」を表すことが多い可算・不可算兼用の語。","tip":"動詞では「大切にする、評価する」という意味にもなる。worthと似るが、valueはより一般的に使う語だ。"},{"w":"variety","pos":"名","m":"多様性；種類","nu":"様々な種類のものが存在すること、または種類そのものを表す語。","ph":"a wide variety of","phm":"様々な種類の〜","ex":"The school cafeteria offers a wide variety of healthy lunch options.","exm":"学校の食堂は健康的な昼食の選択肢を幅広く提供している。","us":"「variety of ~」の形で頻出する不可算名詞。「多様性」を表すdiversityと似るが、varietyは種類の豊富さを強調する。","tip":"vary（変化する・異なる）の名詞形。「バラエティ番組」のカタカナ語からも意味を連想しやすい。"},{"w":"device","pos":"名","m":"装置；機器","nu":"特定の目的のために作られた機械や道具を指し、電子機器によく使われる。","ph":"an electronic device","phm":"電子機器","ex":"Students are not allowed to use a device during the exam.","exm":"生徒は試験中に機器を使用することが許されていない。","us":"「device for ~ing」の形をとる。machineより小型で特定用途の道具を指すことが多い可算名詞。","tip":"devise（工夫して考案する）と関連語で、目的のために工夫して作られた道具というイメージ。"},{"w":"disaster","pos":"名","m":"災害；大惨事","nu":"多くの人や物に深刻な被害をもたらす突然の出来事を表す。","ph":"a natural disaster","phm":"自然災害","ex":"The town quickly recovered after the disaster destroyed many local homes.","exm":"その町は災害が多くの住宅を破壊した後、すぐに復興した。","us":"「natural disaster」の形が頻出。可算名詞で、地震や台風など具体的な災害の種類を指すことが多い。","tip":"dis-（悪い）+ aster（星）が語源とされ、星回りが悪いことから生じる不運な出来事を表すとされる。"},{"w":"economy","pos":"名","m":"経済","nu":"国や地域における生産・消費・お金の流れ全体の仕組みを表す語。","ph":"boost the economy","phm":"経済を活性化させる","ex":"The local economy improved after the new factory opened last year.","exm":"地元経済は昨年新しい工場が開業してから改善した。","us":"「the economy」で国全体の経済を指すことが多い。形容詞形economicと、節約を表すeconomicalの違いに注意する。","tip":"eco-（家）+ nomy（管理）が語源とされ、家計の管理から国全体の経済運営へと意味が広がったとされる。"},{"w":"electricity","pos":"名","m":"電気","nu":"家庭や街で機械を動かす電気エネルギーそのものを指す語で、力や政治のpowerとは区別する。","ph":"run on electricity","phm":"電気で動く","ex":"Our school tries to save electricity during the summer holidays.","exm":"私たちの学校は夏休みの間、電気を節約しようとしている。","us":"不可算名詞として使い、「electricity bill(電気代)」のように複合語でもよく使われる。","tip":"electric(形)やelectrical(形)と語根が同じで、-ityは抽象名詞化する接尾辞。"},{"w":"emergency","pos":"名","m":"緊急事態；非常時","nu":"予期せず起きた危険な状況で、すぐに対応が必要な場面を表す語。","ph":"in case of emergency","phm":"緊急の場合には","ex":"Call the teacher immediately in case of an emergency at school.","exm":"学校で緊急事態が起きた場合は、すぐに先生を呼びなさい。","us":"可算名詞で、「emergency exit(非常口)」のように形容詞的にも使う。","tip":"emergeは「現れ出る」という意味で、そこから「突発的に生じる事態」という語感が生まれた。"},{"w":"experiment","pos":"名","m":"実験","nu":"仮説を確かめるために行う科学的な試みで、理科の授業を思い浮かべると覚えやすい。","ph":"carry out an experiment","phm":"実験を行う","ex":"We carried out an experiment in chemistry class last Friday.","exm":"私たちは先週の金曜日、化学の授業で実験を行った。","us":"可算名詞で、動詞のexperiment(実験する)としても使え、その際はwithやonを伴うことが多い。","tip":"expert(専門家)と同じ語根experiから来ており、「試して確かめる」というイメージでつながる。"},{"w":"factor","pos":"名","m":"要因；要素","nu":"結果に影響を与える複数の原因のうちの一つを指す、やや客観的な語。","ph":"an important factor","phm":"重要な要因","ex":"Diet is an important factor in staying healthy every day.","exm":"食事は毎日健康を保つうえで重要な要因だ。","us":"可算名詞。「factor in A(Aを考慮に入れる)」という句動詞的な使い方もある。","tip":"数学の「因数」もfactorと言い、「結果を作り出す要素」というコアイメージは共通する。"},{"w":"education","pos":"名","m":"教育","nu":"学校などで知識や技能を身につけさせる仕組み全体を指す、やや広い語。","ph":"receive a good education","phm":"良い教育を受ける","ex":"Every child deserves to receive a good education at school.","exm":"すべての子どもは学校で良い教育を受けるに値する。","us":"通常は不可算名詞として使うが、「a college education」のように具体的な種類を言うときは可算にもなる。","tip":"動詞educate(教育する)の名詞形。educatorは「教育者」。"},{"w":"individual","pos":"名","m":"個人","nu":"集団の中の一人ひとりを、他と区別して指すときに使う語。","ph":"as an individual","phm":"一個人として","ex":"Each individual in our club has a different favorite sport.","exm":"私たちの部活では一人ひとりが好きなスポーツが違う。","us":"可算名詞。「as an individual(一個人として)」のように使われ、group(集団)と対比される。","tip":"形容詞としても使われ「individual differences(個人差)」のように頻出。"},{"w":"option","pos":"名","m":"選択肢","nu":"複数ある中から自由に選べる一つの案を指す語で、選べる可能性の存在を強調する。","ph":"have no option","phm":"選択肢がない","ex":"We have more than one option for the school trip.","exm":"私たちには修学旅行についての選択肢が一つ以上ある。","us":"可算名詞。「option to do(〜する選択肢)」の形で使われることが多い。","tip":"動詞choose由来のchoiceと違い、optionは「選べる可能性」というニュアンスが強い。"},{"w":"pollution","pos":"名","m":"汚染","nu":"空気や水などが有害な物質で汚される状態を指す、環境問題で頻出の語。","ph":"air pollution","phm":"大気汚染","ex":"Air pollution is a serious problem in many big cities.","exm":"大気汚染は多くの大都市で深刻な問題だ。","us":"不可算名詞。動詞pollute(汚染する)の名詞形で、pollutant(汚染物質)も合わせて覚える。","tip":"pollute→pollutionという名詞化パターンはaction動詞から-ionを作る典型例。"},{"w":"progress","pos":"名","m":"進歩；進行","nu":"物事が良い方向へ、または目標に向かって少しずつ進む様子を表す語。","ph":"make progress","phm":"進歩する","ex":"She is making good progress in her English speaking class.","exm":"彼女は英語のスピーキングの授業で順調に上達している。","us":"不可算名詞で「a progress」とは言わない点に注意。動詞progress(進歩する)とアクセント位置が異なる。","tip":"pro-(前へ)+gress(進む)という語源で、「前進」というコアイメージがそのまま意味になっている。"},{"w":"range","pos":"名","m":"範囲","nu":"数値や種類などが最小から最大まで広がる幅を表す語。","ph":"a wide range of","phm":"幅広い範囲の","ex":"The store sells a wide range of school supplies for students.","exm":"その店は生徒向けの幅広い種類の学用品を売っている。","us":"可算名詞。動詞としても使われ「range from A to B(AからBの範囲にわたる)」の形が頻出。","tip":"「山脈」という意味もあり、どちらも「一続きに広がるもの」というイメージでつながる。"},{"w":"rate","pos":"名","m":"割合；速度","nu":"何かが起こる頻度や変化の度合いを数値で表す語。","ph":"at a rapid rate","phm":"急速な速度で","ex":"The population of the town is growing at a fast rate.","exm":"その町の人口は速いペースで増加している。","us":"可算名詞。「success rate(成功率)」「heart rate(心拍数)」のように複合語で頻出する。","tip":"「評価する」という動詞rateとも同語源で、「基準に対する度合い」というイメージが共通する。"},{"w":"region","pos":"名","m":"地域","nu":"国や大陸の中のある程度まとまった広がりを持つ地域を指す語で、areaより広め。","ph":"in this region","phm":"この地域では","ex":"Snow rarely falls in this region even during the winter.","exm":"この地域では冬でも雪はめったに降らない。","us":"可算名詞。「the northern region(北部地域)」のように方角や特徴を表す語と組み合わせやすい。","tip":"形容詞regional(地域の)とセットで覚えると、ニュース英語でも読み取りやすくなる。"},{"w":"reward","pos":"名","m":"報酬；ご褒美","nu":"努力や良い行いに対して与えられる、うれしい見返りを表す語。","ph":"as a reward for","phm":"〜へのご褒美として","ex":"Our coach gave us pizza as a reward for winning.","exm":"コーチは私たちの勝利へのご褒美としてピザをおごってくれた。","us":"可算名詞。動詞としても使い「reward A for B(AをBのことで報いる)」の形をとる。","tip":"re-(再び)+ward(見る、注意を払う)が語源とされ、「見返りを与える」イメージにつながる。"},{"w":"risk","pos":"名","m":"危険；リスク","nu":"悪い結果が起こる可能性を表す語で、dangerより「確率」の意味合いが強い。","ph":"take a risk","phm":"危険を冒す","ex":"You should not take a risk before an important exam.","exm":"大事な試験の前には危険を冒すべきではない。","us":"可算・不可算どちらでも使う。「at risk(危険にさらされて)」「risk doing(〜する危険を冒す)」の形が頻出。","tip":"「risk-taking(リスクを取ること)」のように名詞を修飾する形でもよく使われる。"},{"w":"strength","pos":"名","m":"強さ；長所","nu":"力や能力の強い部分を表す語で、weaknessと対で覚えると良い。","ph":"strength and weakness","phm":"長所と短所","ex":"Patience is a real strength when you learn a language.","exm":"忍耐力は言語を学ぶときの本当の強みだ。","us":"可算名詞として「長所」の意味で使う場合と、不可算で「力」の意味で使う場合がある。","tip":"形容詞strong(強い)の名詞形で、動詞strengthen(強化する)も一緒に覚えると語彙が広がる。"},{"w":"stress","pos":"名","m":"ストレス；重圧","nu":"心や体にかかる精神的な負担や緊張を表す語。","ph":"under stress","phm":"ストレスを受けて","ex":"Many students feel a lot of stress before final exams.","exm":"多くの生徒は期末試験の前に大きなストレスを感じる。","us":"不可算名詞。動詞stress(強調する、ストレスを与える)としても使われる。","tip":"「重点を置く」という動詞の意味もあり、「圧力をかける」イメージが共通する。"},{"w":"structure","pos":"名","m":"構造；仕組み","nu":"物事やものがどのように組み立てられているかという骨組みを表す語。","ph":"the structure of","phm":"〜の構造","ex":"This chart shows the structure of our school's student council.","exm":"この図は私たちの学校の生徒会の組織構造を示している。","us":"可算・不可算どちらもあり、建物や文章、組織など幅広い対象に使える。","tip":"動詞structure(組織立てる)や形容詞structural(構造上の)も合わせて覚えると理解が深まる。"},{"w":"survey","pos":"名","m":"調査；アンケート","nu":"多くの人の意見や実態を尋ねてまとめる調査を表す語。","ph":"conduct a survey","phm":"調査を行う","ex":"Our class conducted a survey about students' favorite subjects.","exm":"私たちのクラスは生徒の好きな科目についてのアンケート調査を行った。","us":"可算名詞。動詞としても使い「survey people about A(Aについて人々を調査する)」の形をとる。","tip":"sur-(上から)+vey(見る)が語源で、「全体を見渡して調べる」イメージにつながる。"},{"w":"target","pos":"名","m":"目標；対象","nu":"到達しようとする具体的な数値や的を表す語で、goalより具体的なニュアンス。","ph":"set a target","phm":"目標を設定する","ex":"Our team set a target of scoring twenty points today.","exm":"私たちのチームは今日20点を取るという目標を設定した。","us":"可算名詞。動詞としても使われ「target young people(若者を対象にする)」のように使う。","tip":"もとは「的」の意味で、そこから「達成すべき数値目標」という意味に広がった。"},{"w":"theory","pos":"名","m":"理論；学説","nu":"事実や実験に基づいて説明を体系立てた考えを表す語で、practiceと対で覚える。","ph":"in theory","phm":"理論上は","ex":"In theory, this plan should work well for our club.","exm":"理論上は、この計画は私たちの部活にとってうまくいくはずだ。","us":"可算名詞。「the theory of evolution(進化論)」のように特定の学説を指すこともある。","tip":"「in theory(理論上)」と「in practice(実際には)」を対で覚えると使い分けやすい。"},{"w":"tool","pos":"名","m":"道具；手段","nu":"何かを行うために使う具体的な道具や、比喩的な手段を表す語。","ph":"a useful tool","phm":"役立つ道具","ex":"A dictionary is a useful tool for learning new words.","exm":"辞書は新しい単語を覚えるための役立つ道具だ。","us":"可算名詞。実際の道具だけでなく「a learning tool(学習ツール)」のように抽象的な手段にも使う。","tip":"似た語のinstrumentよりも日常的でカジュアルな響きを持つ語。"},{"w":"topic","pos":"名","m":"話題；トピック","nu":"会話や文章で扱う具体的なテーマを表す語で、subjectとほぼ同義。","ph":"the main topic","phm":"主な話題","ex":"The main topic of today's speech was climate change.","exm":"今日のスピーチの主な話題は気候変動だった。","us":"可算名詞。「a topic for discussion(議論のための話題)」のように前置詞forを伴うこともある。","tip":"subjectより会話や作文の中の具体的な「話題」を指すことが多い。"},{"w":"traffic","pos":"名","m":"交通；交通量","nu":"道路上を行き交う車や人の流れの多さを表す語。","ph":"heavy traffic","phm":"激しい交通量","ex":"We were late for school because of heavy traffic today.","exm":"今日は交通量がひどかったので、私たちは学校に遅刻した。","us":"不可算名詞で、複数形にしない点に注意。「traffic jam(交通渋滞)」もよく使う表現。","tip":"「traffic light(信号機)」など複合語で覚えると使い方が定着しやすい。"},{"w":"transportation","pos":"名","m":"輸送；交通機関","nu":"人やものをある場所から別の場所へ運ぶ手段全体を表す語。","ph":"public transportation","phm":"公共交通機関","ex":"Many students use public transportation to get to school.","exm":"多くの生徒は学校に行くのに公共交通機関を利用する。","us":"不可算名詞。イギリス英語ではtransportと短く言うことが多い点も覚えておきたい。","tip":"動詞transport(輸送する)に-ation(名詞化語尾)が付いた形。"},{"w":"volunteer","pos":"名","m":"ボランティア","nu":"報酬を求めず自らの意志で人の役に立つ活動をする人を表す語。","ph":"work as a volunteer","phm":"ボランティアとして働く","ex":"My sister works as a volunteer at the local library.","exm":"私の姉は地元の図書館でボランティアとして働いている。","us":"可算名詞だが、動詞としても使い「volunteer to do(進んで〜する)」の形も頻出。","tip":"「意志、自由意志」を意味するラテン語volensに由来し、「自ら進んで」という語感につながる。"},{"w":"climate","pos":"名","m":"気候","nu":"ある地域の長期的な気象の傾向を表す語で、その日その日のweatherとは区別する。","ph":"a warm climate","phm":"温暖な気候","ex":"Japan has a mild climate compared to many other countries.","exm":"日本は他の多くの国と比べて穏やかな気候だ。","us":"可算名詞。「climate change(気候変動)」のように環境問題の話題で頻出する。","tip":"weatherは「今日の天気」、climateは「その土地の長期的な気候」と使い分けると覚えやすい。"},{"w":"effective","pos":"形","m":"効果的な","nu":"ある方法や薬などが望んだ結果をきちんと生み出すことを表す形容詞。","ph":"an effective way","phm":"効果的な方法","ex":"Repeating new words aloud is an effective way to memorize them.","exm":"新しい単語を声に出して繰り返すのは、それらを覚える効果的な方法だ。","us":"名詞effect(効果)から派生した形容詞。「effective from April(4月から施行される)」のように「発効した」という意味もある。","tip":"efficientと混同しやすいが、effectiveは「効果があるか」、efficientは「無駄がなく効率的か」に焦点がある。"},{"w":"active","pos":"形","m":"活発な；積極的な","nu":"エネルギーにあふれ、実際によく動いたり活動したりする様子を表す語。","ph":"an active member","phm":"積極的なメンバー","ex":"She is an active member of the school tennis club.","exm":"彼女は学校のテニス部の積極的な部員だ。","us":"文法用語の「能動態(active voice)」でも使われる語で、passive(受動的な)と対で覚える。","tip":"動詞act(行動する)から派生し、「実際に動いている」というコアイメージがそのまま意味になっている。"},{"w":"ancient","pos":"形","m":"古代の","nu":"何千年も前の歴史的に非常に古い時代を表す形容詞で、oldよりずっと古い時期を指す。","ph":"ancient history","phm":"古代史","ex":"We are studying ancient history in our world history class.","exm":"私たちは世界史の授業で古代史を学んでいる。","us":"古代エジプトや古代ローマなど、はるか昔の時代を指すときに使い、単に「古い」だけの意味では使わない。","tip":"oldは「古い」全般、ancientは「古代の」に限定されると覚えると使い分けやすい。"},{"w":"appropriate","pos":"形","m":"適切な","nu":"その場の状況や目的にぴったり合っていることを表す形容詞で、suitableとほぼ同義。","ph":"appropriate for","phm":"〜に適した","ex":"Please wear clothes appropriate for the school sports festival tomorrow.","exm":"明日の体育祭に適した服を着てきてください。","us":"後ろに「for」や「to do」を伴うことが多く、「appropriate behavior(適切な振る舞い)」のように名詞を直接修飾もする。","tip":"反意語はinappropriate(不適切な)。接頭辞in-をつけるパターンで覚えると語彙が増える。"},{"w":"available","pos":"形","m":"利用できる；手が空いている","nu":"物や人がすぐに使える、または対応できる状態にあることを表す語。","ph":"available for","phm":"〜のために利用できる","ex":"The teacher is available for questions after class today.","exm":"その先生は今日、授業後に質問対応が可能だ。","us":"「be available」の形で「利用可能だ」「手が空いている」という状態を表すことが多い。","tip":"動詞avail(役立つ)から派生し、「役立つ状態にある」というイメージが元になっている。"},{"w":"aware","pos":"形","m":"気づいている","nu":"ある事実や状況をはっきりと認識していることを表す形容詞。","ph":"be aware of","phm":"〜に気づいている","ex":"Students should be aware of the new school rules.","exm":"生徒たちは新しい校則に気づいておくべきだ。","us":"「aware of A(Aに気づいて)」または「aware that節」の形で使う。knowより「意識している」という感覚が強い。","tip":"反意語はunaware(気づいていない)。名詞形awareness(意識)も環境問題の英文でよく登場する。"},{"w":"complicated","pos":"形","m":"複雑な","nu":"部分が入り組んでいて理解や解決が難しい様子を表す形容詞。","ph":"a complicated problem","phm":"複雑な問題","ex":"This math problem looks complicated but it is actually simple.","exm":"この数学の問題は複雑に見えるが、実は簡単だ。","us":"動詞complicate(複雑にする)の過去分詞が形容詞化した語で、difficultより「絡み合って分かりにくい」ニュアンス。","tip":"反意語はsimple(単純な)。complexも似た意味だが、complicatedはより口語的でネガティブな響きを持つ。"},{"w":"efficient","pos":"形","m":"効率的な","nu":"時間や労力、資源を無駄にせず、うまく結果を出すことを表す形容詞。","ph":"an efficient way","phm":"効率的な方法","ex":"Making a schedule is an efficient way to finish homework quickly.","exm":"スケジュールを立てることは宿題を早く終わらせる効率的な方法だ。","us":"名詞形efficiency(効率)もあわせて覚えると読解で役立つ。","tip":"effectiveとの違いは、efficientが「無駄なく」に焦点を当てる点。両方セットで区別して覚えるとよい。"},{"w":"elderly","pos":"形","m":"高齢の","nu":"oldよりも丁寧に年配の人を表すときに使う形容詞。","ph":"an elderly person","phm":"お年寄り","ex":"We visited an elderly woman living alone near our school.","exm":"私たちは学校の近くに一人で暮らす高齢の女性を訪ねた。","us":"人に対してのみ使い、物にはoldを使う。「the elderly(高齢者たち)」のように名詞化しても使われる。","tip":"oldより丁寧で敬意のこもった響きがあるため、人を表すときに好んで使われる。"},{"w":"entire","pos":"形","m":"全体の","nu":"一部ではなく全部であることを強調する形容詞で、wholeとほぼ同義。","ph":"the entire class","phm":"クラス全体","ex":"The entire class worked together to clean the classroom yesterday.","exm":"昨日、クラス全体が協力して教室を掃除した。","us":"名詞の前に置いて使う限定用法が基本で、「the entire day(丸一日)」のように時間表現ともよく結びつく。","tip":"副詞entirely(完全に)もよく使われ、「全く〜ない(not entirely)」の形にも注意。"},{"w":"equal","pos":"形","m":"等しい","nu":"二つ以上のものが大きさや価値、程度などで同じであることを表す形容詞。","ph":"equal to","phm":"〜と等しい","ex":"Everyone in the club should have an equal chance to play.","exm":"部活のみんなが平等にプレーする機会を持つべきだ。","us":"「equal to A(Aと等しい)」の形で使い、動詞equal(〜に等しい)としても使われる。","tip":"名詞equality(平等)は社会問題の英文で頻出するので、一緒に覚えておくとよい。"},{"w":"essential","pos":"形","m":"不可欠な","nu":"それがなければ成り立たないほど絶対に必要であることを表す形容詞。","ph":"essential for","phm":"〜に不可欠な","ex":"Sleep is essential for students to concentrate well in class.","exm":"睡眠は生徒が授業でよく集中するために不可欠だ。","us":"necessaryよりも強く「なくてはならない」というニュアンスを持ち、「essential to/for」どちらも使われる。","tip":"名詞essence(本質)と語根が同じで、「本質的に必要な」というイメージにつながる。"},{"w":"familiar","pos":"形","m":"よく知っている","nu":"何度も接していてよく知っている、見慣れている様子を表す形容詞。","ph":"be familiar with","phm":"〜をよく知っている","ex":"I am familiar with most of the songs on this album.","exm":"私はこのアルバムのほとんどの曲をよく知っている。","us":"「be familiar with A(Aをよく知っている)」の形が基本で、known toと混同しないよう注意する。","tip":"familyと語根が似ているが意味は異なる。「家族のように親しい」というイメージから覚えると記憶に残りやすい。"},{"w":"general","pos":"形","m":"一般的な","nu":"特定の一部だけでなく、全体に広く当てはまる様子を表す形容詞。","ph":"in general","phm":"一般的に","ex":"In general, students prefer shorter homework to longer assignments.","exm":"一般的に、生徒は長い課題より短い宿題を好む。","us":"「in general(一般的に)」は文修飾の副詞句として頻出。特定を表すspecificと対で覚える。","tip":"名詞general(将軍)と同じ綴りだが意味が異なるので文脈で判断する。"},{"w":"global","pos":"形","m":"グローバルな；世界的な","nu":"地球規模・世界全体に関わる広がりを表す語で、国境を越えた視点を示す。","ph":"global warming","phm":"地球温暖化","ex":"Our club discussed global warming during the environmental study session yesterday.","exm":"私たちの部活は昨日、環境学習の授業で地球温暖化について話し合った。","us":"globeの形容詞形で、global issueやglobal warmingのように社会・環境問題によく使われる。","tip":"globe（地球儀）から派生した語で、「地球全体」というイメージを持つと覚えやすい。"},{"w":"harmful","pos":"形","m":"有害な","nu":"健康や環境などに悪い影響・被害を与える性質を表す語。","ph":"harmful effects","phm":"有害な影響","ex":"Doctors warned that smoking can be harmful to teenagers' health.","exm":"医師たちは喫煙が10代の健康に有害になり得ると警告した。","us":"harmful to ~ の形で「～にとって有害だ」と表すことが多い。","tip":"harm（害）+ ful（満ちた）で「害に満ちた」と覚える。対義語はharmless（無害な）。"},{"w":"main","pos":"形","m":"主な；主要な","nu":"複数ある中で最も重要・中心となるものを指す、日常的でシンプルな語。","ph":"the main reason","phm":"主な理由","ex":"The main reason for his success was daily practice after school.","exm":"彼が成功した主な理由は放課後の毎日の練習だった。","us":"名詞の前に置いて「主な～」と修飾し、the main pointのように使う。","tip":"majorより軽く日常的に使える語で、the main ideaなど頻出表現とセットで覚える。"},{"w":"major","pos":"形","m":"主要な；重大な","nu":"規模や重要度が大きいことを強調する語で、フォーマルな場面でも使われる。","ph":"a major role","phm":"重要な役割","ex":"She played a major role in planning the school festival.","exm":"彼女は学園祭の企画で重要な役割を果たした。","us":"a major problem/roleのように名詞を修飾する。対義語はminor（小さな）。","tip":"音楽の「メジャー（長調）」と同じ語で、「大きい・主要な」という核イメージを持つ。"},{"w":"mental","pos":"形","m":"精神的な；心の","nu":"心・頭の働きに関することを表し、physical（身体的な）と対で使われることが多い。","ph":"mental health","phm":"心の健康","ex":"Regular exercise can improve both physical and mental health.","exm":"定期的な運動は身体と心の両方の健康を向上させる。","us":"mental healthやmental illnessなど、健康・医療分野で頻出のコロケーションを持つ。","tip":"mind（心）を表す語として意味の上で結びつけて覚えると理解しやすい。"},{"w":"native","pos":"形","m":"生まれ故郷の；母国の","nu":"生まれた土地や生まれつきの言語・国籍に関する性質を表し、外国語学習の文脈でよく使われる語。","ph":"native speaker","phm":"母語話者","ex":"Talking with a native speaker helped her improve her pronunciation quickly.","exm":"母語話者と話したことは、彼女が発音を早く上達させるのに役立った。","us":"native speaker、native languageのように名詞とセットで使うことが多い。","tip":"nature（生まれつき）と同語源で、「生まれた時からの」というイメージを持つと覚えやすい。"},{"w":"negative","pos":"形","m":"否定的な；消極的な","nu":"悪い面・マイナスの側面を強調する語で、positiveの対義語。","ph":"a negative impact","phm":"悪影響","ex":"Too much homework can have a negative impact on students' sleep.","exm":"宿題が多すぎると生徒の睡眠に悪影響を与えることがある。","us":"have a negative impact/effect on ~ の形で頻出する。感情や態度にも使える。","tip":"マイナス記号(-)のイメージで覚え、positiveと対で暗記すると効率的。"},{"w":"positive","pos":"形","m":"肯定的な；積極的な","nu":"良い面・プラスの側面を強調する語で、前向きな態度も表す。","ph":"a positive attitude","phm":"前向きな姿勢","ex":"Keeping a positive attitude helped the team recover from their loss.","exm":"前向きな姿勢を保ったことがチームの敗戦からの立ち直りに役立った。","us":"a positive attitude/effectのように性格・結果の両方に使える。医療分野では「陽性の」の意味もある。","tip":"プラス(+)記号のイメージで覚え、negativeと対で暗記すると効率的。"},{"w":"normal","pos":"形","m":"普通の；正常な","nu":"標準的で異常のない状態を表す、日常でよく使う基本語。","ph":"return to normal","phm":"通常に戻る","ex":"After the holidays, our daily schedule slowly returned to normal.","exm":"休暇の後、私たちの日課は徐々にいつも通りに戻った。","us":"it's normal to ~ / return to normalのように名詞としても使われる。","tip":"norm（基準）から派生した語で、「基準に沿っている」がコアイメージ。対義語はabnormal。"},{"w":"obvious","pos":"形","m":"明白な","nu":"説明しなくても誰の目にも明らかであることを表す語。","ph":"an obvious mistake","phm":"明らかな間違い","ex":"It was obvious that he had not studied for the test.","exm":"彼がそのテストの勉強をしていなかったのは明らかだった。","us":"It is obvious that ~ / it is obvious to 人 の形で使われることが多い。","tip":"ob（前に）+ via（道）が語源とされ、「道の先に見えている」→明白な、とイメージする。"},{"w":"particular","pos":"形","m":"特定の；特別な","nu":"多くの中から一つを取り上げて特に指し示すときに使う語。","ph":"in particular","phm":"特に、とりわけ","ex":"I enjoyed the whole trip, but one place in particular impressed me.","exm":"旅行全体を楽しんだが、特にある場所が私に印象を残した。","us":"in particularで「特に」という副詞句になる頻出表現。名詞の前ではthis particular caseのように使う。","tip":"part（部分）が語幹で、「特定の一部分に注目する」という意味を連想すると覚えやすい。"},{"w":"personal","pos":"形","m":"個人的な","nu":"他人ではなく自分自身だけに関わる事柄であることを強調して表す語。","ph":"personal opinion","phm":"個人的な意見","ex":"In my personal opinion, group study is more effective than studying alone.","exm":"私個人の意見では、グループ学習は一人での勉強より効果的だ。","us":"personal opinion/informationのように名詞を修飾し、「個人の・私的な」を表す。","tip":"person（人）から派生し、「一個人に関わる」というコアイメージを持つ。"},{"w":"physical","pos":"形","m":"身体の；物理的な","nu":"心（mental）ではなく体・物理面に関することを表す語。","ph":"physical education","phm":"体育","ex":"Every student needs physical education class twice a week at school.","exm":"すべての生徒は週に2回、体育の授業を受ける必要がある。","us":"physical educationやphysical exerciseのように健康・スポーツ分野の語と結びつく。","tip":"「フィジカル」というカタカナ語としても浸透しており、「体・物質に関する」がコアイメージ。"},{"w":"polite","pos":"形","m":"礼儀正しい","nu":"言葉遣いや態度が丁寧で、相手への敬意を示す様子を表す語。","ph":"polite to strangers","phm":"見知らぬ人に礼儀正しい","ex":"It is important to stay polite to strangers you meet abroad.","exm":"海外で出会う見知らぬ人に礼儀正しくいることは大切だ。","us":"polite to 人 の形で「～に対して礼儀正しい」と表す。対義語はrude（無礼な）。","tip":"polish（磨く）と語源が近いとされ、「振る舞いが磨かれた」というイメージで覚えられる。"},{"w":"possible","pos":"形","m":"可能な","nu":"実現の見込みがある、起こり得るということを表す基本語。","ph":"as soon as possible","phm":"できるだけ早く","ex":"Please send me your report as soon as possible.","exm":"できるだけ早くレポートを私に送ってください。","us":"as soon as possible（できるだけ早く）は超頻出表現。It is possible that ~ の形も覚えておく。","tip":"対義語はimpossible（不可能な）。「人」を主語にできない点に注意（誤：He is possible to ~）。"},{"w":"practical","pos":"形","m":"実用的な；実際的な","nu":"理論だけでなく実際に役立つ・現実に使えることを重視する語。","ph":"practical advice","phm":"実用的な助言","ex":"Our teacher gave us practical advice about how to study efficiently.","exm":"先生は効率よく勉強する方法について実用的な助言をくれた。","us":"practical experience/adviceのように、理論(theoretical)との対比で使われることが多い。","tip":"practice（実践）と同語源で、「実践に基づいた」というコアイメージを持つと覚えやすい。"},{"w":"private","pos":"形","m":"私的な；個人の","nu":"他人に知られたくない、公にしないことを表す語。publicの対義語。","ph":"private information","phm":"個人情報","ex":"Never share your private information with people you don't know online.","exm":"ネット上で知らない人に個人情報を決して共有してはいけない。","us":"private information/schoolのように使う。in privateで「内密に」という副詞句にもなる。","tip":"publicとの対比セットで覚える。「非公開」というコアイメージを持つ。"},{"w":"public","pos":"形","m":"公共の；公の","nu":"一部の人だけでなく社会全体・誰もが関わることを表す語。","ph":"public transportation","phm":"公共交通機関","ex":"Many students use public transportation to get to school every day.","exm":"多くの生徒は毎日学校に行くのに公共交通機関を利用する。","us":"public transportation/opinionのように社会全体に関わる名詞と結びつく。","tip":"privateの対義語として覚える。「みんなのもの」というコアイメージ。"},{"w":"rare","pos":"形","m":"まれな；珍しい","nu":"数や頻度が少なく、めったに起こらないことを表す語。","ph":"a rare chance","phm":"めったにない機会","ex":"Meeting a famous scientist was a rare chance for our class.","exm":"有名な科学者に会うことは私たちのクラスにとってめったにない機会だった。","us":"a rare case/chanceのように「めったにない」を表す。対義語はcommon（よくある）。","tip":"ステーキの「レア」と綴り・発音は同じだが、実は語源の異なる別の語とされる。「あまり手を加えていない」というイメージを重ねると記憶に残りやすい。"},{"w":"regular","pos":"形","m":"定期的な；通常の","nu":"決まった間隔・パターンで繰り返されることを表す語。","ph":"regular exercise","phm":"定期的な運動","ex":"Doing regular exercise every morning helps him stay focused in class.","exm":"毎朝定期的に運動することは彼が授業に集中し続けるのに役立つ。","us":"regular exercise/meetingのように「決まって繰り返す」を表す。対義語はirregular。","tip":"rule（規則）と関連する語で、「規則正しい」というコアイメージを持つ。"},{"w":"responsible","pos":"形","m":"責任がある","nu":"ある物事の結果に対して責任・義務を負う立場を表す語。","ph":"responsible for","phm":"～に責任がある","ex":"The captain felt responsible for the team's poor performance last week.","exm":"キャプテンは先週のチームの不振に責任を感じていた。","us":"responsible for ~ の形で「～に対して責任がある」と表す最重要コロケーション。","tip":"response（応答）と同語源で、「求めに応じられる＝責任を果たせる」とイメージすると覚えやすい。"},{"w":"safe","pos":"形","m":"安全な","nu":"危険や事故に遭う心配がなく、安心していられる状態を表す基本語。","ph":"a safe place","phm":"安全な場所","ex":"This park is a safe place for children to play after school.","exm":"この公園は放課後に子供たちが遊ぶのに安全な場所だ。","us":"safe from ~（～から安全な）、it is safe to ~の形でよく使う。","tip":"対義語はdangerous（危険な）。名詞形safety（安全）とセットで覚えると語彙が広がる。"},{"w":"serious","pos":"形","m":"深刻な；真剣な","nu":"軽視できないほど重大であること、または態度が真面目であることを表す語。","ph":"a serious problem","phm":"深刻な問題","ex":"Climate change has become a serious problem for the whole world.","exm":"気候変動は世界全体にとって深刻な問題になっている。","us":"a serious problem/illnessのように重大さを表す他、be serious about ~で「真剣だ」を表す。","tip":"名詞形seriousness（深刻さ）と合わせて覚える。ふざけていない様子から「真剣な」にも広がる。"},{"w":"similar","pos":"形","m":"似ている","nu":"完全に同じではないが、見た目や性質など共通点が多いことを表す語。","ph":"similar to","phm":"～と似ている","ex":"Her handwriting is very similar to her older sister's.","exm":"彼女の字は姉の字ととてもよく似ている。","us":"similar to ~ の形で比較対象を示す。sameが「全く同一」なのに対しsimilarは「一部共通」を表す。","tip":"sameとの違いを意識して覚える。名詞形はsimilarity（類似点）。"},{"w":"specific","pos":"形","m":"特定の；具体的な","nu":"曖昧ではなく、はっきりと限定・特定された内容を表す語。","ph":"a specific example","phm":"具体例","ex":"The teacher asked us to give a specific example from history.","exm":"先生は私たちに歴史から具体例を挙げるよう求めた。","us":"a specific example/reasonのように「他ではなくこれ」という限定を表す。","tip":"particularと意味が近いが、specificは「具体性・明確さ」に焦点がある点を意識して区別する。"},{"w":"strict","pos":"形","m":"厳しい；厳格な","nu":"規則やルールに対して例外を認めない厳しさを表す語。","ph":"strict rules","phm":"厳しい規則","ex":"Our school has strict rules about using smartphones during class.","exm":"私たちの学校は授業中のスマートフォン使用について厳しい規則がある。","us":"strict rules/teacherのように規則・人の厳しさを表す。strict with 人の形もある。","tip":"「規則を締め付ける」イメージで覚える。対義語はloose（緩い）。"},{"w":"suitable","pos":"形","m":"適した","nu":"目的や状況、条件などに合っていて、ふさわしいことを表す語。","ph":"suitable for","phm":"～に適している","ex":"This book is suitable for beginners who are learning English grammar.","exm":"この本は英文法を学んでいる初心者に適している。","us":"suitable for ~ の形で「～に適している」と表す。fit forと似た意味を持つ。","tip":"suit（適合する）＋ableで「適合できる」→「適した」という成り立ちで覚える。"},{"w":"tough","pos":"形","m":"困難な；たくましい","nu":"精神的・肉体的にきつい、または人が強くて簡単には屈しないことを表す語。","ph":"a tough decision","phm":"難しい決断","ex":"Choosing which club to join was a tough decision for me.","exm":"どの部活に入るか選ぶのは私にとって難しい決断だった。","us":"a tough decision/dayのように「困難な」を表すほか、人に使うと「たくましい」の意味になる。","tip":"difficultより口語的でカジュアルな響きを持つ語として覚えるとよい。"},{"w":"typical","pos":"形","m":"典型的な","nu":"その種類・グループの特徴をよく表す、ありがちな例であることを示す語。","ph":"a typical example","phm":"典型的な例","ex":"A rainy morning is a typical example of Japan's June weather.","exm":"雨降りの朝は日本の6月の天気の典型的な例だ。","us":"a typical example/dayのように「よくある、代表的な」を表す。typical of ~ の形もある。","tip":"type（型）から派生した語で、「その型にはまった」というコアイメージで覚える。"},{"w":"unique","pos":"形","m":"独特の；唯一の","nu":"他に同じものがなく、その一つだけの特徴を持つことを表す語。","ph":"a unique culture","phm":"独特な文化","ex":"Every country has its own unique culture and traditional festivals.","exm":"どの国もそれぞれ独自の文化と伝統的な祭りを持っている。","us":"unique to ~ で「～に特有の」を表す。very uniqueのように程度を強める用法は避けるべきとされる。","tip":"uni（一つ）が語幹で、「唯一無二」というコアイメージを持つと覚えやすい。"},{"w":"willing","pos":"形","m":"進んで～する","nu":"頼まれたことや困難なことを嫌がらずに引き受ける気持ちを表す語。","ph":"willing to help","phm":"進んで助ける","ex":"My classmate was willing to help me with my math homework.","exm":"クラスメートは進んで私の数学の宿題を手伝ってくれた。","us":"be willing to do の形で「進んで～する」を表す最重要パターン。wantほど強い願望はない。","tip":"対義語はunwilling（気が進まない）。willの派生語で「意志がある」とイメージする。"},{"w":"therefore","pos":"副","m":"それゆえ；したがって","nu":"前の内容を根拠として、論理的な結論を導くときに使うフォーマルな語。","ph":"and therefore","phm":"それゆえに","ex":"He practiced every day and therefore improved his English speaking skills.","exm":"彼は毎日練習し、それゆえに英会話力が上達した。","us":"文と文をつなぐ接続副詞で、通常カンマやセミコロンの後に置く。soよりフォーマルな響きを持つ。","tip":"there（それ）＋ for（〜のために）から成る語で、「それゆえに」という成り立ちを持つと覚えやすい。"},{"w":"eventually","pos":"副","m":"結局；最終的に","nu":"時間や過程を経て、最終的にある結果に至ることを表す語。","ph":"eventually succeeded","phm":"最終的に成功した","ex":"After many failed attempts, she eventually succeeded in passing the exam.","exm":"何度も失敗した後、彼女は最終的に試験に合格することができた。","us":"過程や時間の経過を強調する文でよく使われ、文中や文末に置かれることが多い。","tip":"event（出来事）と関連し、「様々な出来事を経てついに」というイメージを持つ。"},{"w":"gradually","pos":"副","m":"徐々に","nu":"急にではなく、少しずつ時間をかけて変化する様子を表す語。","ph":"gradually improved","phm":"徐々に上達した","ex":"His pronunciation gradually improved after months of listening practice.","exm":"彼の発音はリスニング練習を何か月も続けた後、徐々に上達した。","us":"動詞を修飾し、変化がゆっくり進む様子を表す。suddenly（突然に）と対比して覚えると効果的。","tip":"gradual（段階的な）の副詞形で、grade（段階）と関連づけると覚えやすい。"},{"w":"immediately","pos":"副","m":"すぐに；直ちに","nu":"時間を置かずにその場ですぐ行動・反応することを表す語。","ph":"immediately after","phm":"～の直後に","ex":"Please raise your hand immediately if you feel sick in class.","exm":"授業中に気分が悪くなったら、すぐに手を挙げてください。","us":"immediately after ~（～の直後に）の形や文中で「すぐに」を強調する際に使う。","tip":"im（否定）+ mediate（間に入る）で「間を置かない」→即座に、というイメージで覚える。"},{"w":"nowadays","pos":"副","m":"近頃は；今日では","nu":"過去と対比して、現在の一般的な状況を述べるときに使う語。","ph":"nowadays, more students","phm":"近頃では、より多くの生徒が","ex":"More students nowadays use tablets instead of paper textbooks at school.","exm":"近頃では、より多くの生徒が紙の教科書の代わりにタブレットを使っている。","us":"文頭・文中どちらにも置け、現在の傾向を過去と比較して述べる際に使われる。","tip":"now + a + days（この頃の日々に）という成り立ちで、「今の時代は」というイメージを持つ。"},{"w":"otherwise","pos":"副","m":"さもなければ","nu":"前の条件が成立しない場合に起こる結果を示す語で、警告的な文脈でよく使われる。","ph":"or otherwise","phm":"さもないと","ex":"Study hard now, otherwise you will regret it before the exam.","exm":"今しっかり勉強しなさい、さもないと試験前に後悔することになる。","us":"命令文の後に続けて「そうしないと」という条件的な結果を表す用法が頻出する。","tip":"other + wise（方法で）から「別のやり方であれば」というイメージを持つと覚えやすい。"},{"w":"probably","pos":"副","m":"おそらく","nu":"確信度は高いが100%ではない推測を表す語で、maybeより確信の度合いが強い。","ph":"probably true","phm":"おそらく本当","ex":"My friend said the rumor about the new teacher is probably true.","exm":"友達は新しい先生についての噂はおそらく本当だと言った。","us":"一般動詞の前、be動詞・助動詞の後に置くのが基本の語順。maybeより確信度が高い。","tip":"probable（ありそうな）の副詞形で、probability（確率）と関連づけて覚える。"},{"w":"recently","pos":"副","m":"最近","nu":"現在に近い過去の出来事について述べるときに使う語で、現在完了形と相性が良い。","ph":"recently moved","phm":"最近引っ越した","ex":"Our new classmate recently moved here from another prefecture in Japan.","exm":"私たちの新しいクラスメートは最近、日本の別の県からここに引っ越してきた。","us":"現在完了形や過去形とともに使われ、「つい最近」という近い過去を表す。","tip":"recent（最近の）の副詞形なので、形容詞recentとセットで覚えると効率的。"},{"w":"unfortunately","pos":"副","m":"残念ながら","nu":"望ましくない結果や事実を伝える際に文頭でよく使われる語。","ph":"unfortunately, it started","phm":"残念ながら、それは始まった","ex":"We planned a picnic, but unfortunately it started raining that afternoon.","exm":"私たちはピクニックを計画したが、残念ながらその日の午後は雨が降り始めた。","us":"文全体を修飾し、文頭に置いてコンマで区切ることが多い。対義語はfortunately。","tip":"fortune（幸運）にun（否定）とlyがついた語で、「幸運ではない」というコアイメージを持つ。"},{"w":"hardly","pos":"副","m":"ほとんど～ない","nu":"程度や頻度がごくわずかであることを示す否定的な副詞で、notより婉曲的な響きを持つ。","ph":"can hardly believe it","phm":"ほとんど信じられない","ex":"I can hardly believe we won the final match yesterday.","exm":"昨日決勝で勝てたなんて、ほとんど信じられない。","us":"hardlyは意味的に否定を含むため、notと重ねて二重否定にしない点に注意する。","tip":"hard（懸命に）と語形が似ているが意味は全く異なるので混同しないようにする。"},{"w":"unless","pos":"接","m":"もし～でなければ","nu":"「もし～でなければ」という条件の否定を表す接続詞で、if...notの代わりに簡潔に使える。","ph":"unless you hurry","phm":"急がなければ","ex":"We will miss the train unless we leave the house now.","exm":"今すぐ家を出なければ、電車に乗り遅れてしまうだろう。","us":"unless節の中では未来のことも現在形で表す。ifとnotを重ねて使う必要はない。","tip":"un-（否定）+ less（～なしに）と分けて考えると意味を覚えやすい。"},{"w":"whether","pos":"接","m":"～かどうか","nu":"二つ以上の選択肢や不確かな事柄を示す接続詞で、名詞節を作りifよりやや形式的に響く。","ph":"whether or not","phm":"そうであろうとなかろうと","ex":"I am not sure whether the club meeting starts at four.","exm":"部活のミーティングが4時に始まるかどうか、よくわからない。","us":"whether節は主語・目的語になる名詞節を作る。whether to doやwhether or notの形も頻出。","tip":"ifとほぼ同義だが、to不定詞の前やor notを伴う形ではwhetherしか使えない点で区別する。"},{"w":"despite","pos":"前","m":"～にもかかわらず","nu":"予想に反する結果を導く前置詞で、後ろに名詞や動名詞を置きalthoughより簡潔に書ける。","ph":"despite the rain","phm":"雨にもかかわらず","ex":"Our club practiced outside despite the heavy rain yesterday.","exm":"昨日、激しい雨にもかかわらず、私たちの部活は外で練習した。","us":"despiteの後には名詞・動名詞が続き、主語と動詞を含む節は直接続けられない。","tip":"in spite ofとほぼ同じ意味なので、書き換え表現として一緒に覚えておくとよい。"},{"w":"throughout","pos":"前","m":"～の間中；至る所に","nu":"時間や空間の全体にわたって及ぶことを表す前置詞で、duringより隅々までの広がりを強調する。","ph":"throughout the year","phm":"一年を通して","ex":"She practiced the piano throughout the long summer vacation.","exm":"彼女は長い夏休みの間ずっとピアノを練習した。","us":"throughout the year（一年中）のように期間にも、throughout the town（町中に）のように場所にも使える。","tip":"through（通り抜けて）にoutが付き、端から端まで行き渡るイメージで覚える。"},{"w":"within","pos":"前","m":"～以内に；～の中に","nu":"一定の範囲や期限の内側にあることを表す前置詞で、inより境界を意識させる語感を持つ。","ph":"within a week","phm":"一週間以内に","ex":"Please finish your homework within three days after class.","exm":"授業後3日以内に宿題を終わらせてください。","us":"within + 期間・距離の形で「～以内に」を表すことが多く、期限を示す表現でよく使われる。","tip":"withoutの反対語として、withとinを組み合わせた形だと考えると覚えやすい。"},{"w":"add","pos":"動","m":"加える；足す","nu":"既にあるものに新しい要素を付け足す基本動詞で、combineより単純な追加の動作を表す。","ph":"add sugar to","phm":"～に砂糖を加える","ex":"My brother likes to add honey to his morning tea.","exm":"私の弟は朝の紅茶にハチミツを加えるのが好きだ。","us":"add A to B（AをBに加える）の形が基本。add upで「合計する」という意味にもなる。","tip":"名詞形additionと対義語subtract（引く）を合わせて覚えると理解が深まる。"},{"w":"announce","pos":"動","m":"発表する；知らせる","nu":"重要な情報や決定を公式に人々へ知らせる動詞で、tellより改まった公的な響きを持つ。","ph":"announce the results","phm":"結果を発表する","ex":"The teacher will announce the exam results next Monday.","exm":"先生は来週の月曜日に試験の結果を発表する予定だ。","us":"announce that節やannounce + 名詞の形で使う。誰に知らせるかはannounce to Aで表す。","tip":"名詞形announcement（発表・アナウンス）も一緒に覚えておくと役立つ。"},{"w":"attend","pos":"動","m":"出席する；通う","nu":"授業や式典など決まった場に実際に足を運んで出席することを表す動詞。","ph":"attend a meeting","phm":"会議に出席する","ex":"All students must attend the opening ceremony this morning.","exm":"全生徒は今朝の開会式に出席しなければならない。","us":"attendは他動詞で目的語を直接とる。attend to Aは「Aに対応する・世話をする」という別の意味になる。","tip":"名詞形attendance（出席）とattendant（係員）も関連づけて覚えておくとよい。"},{"w":"celebrate","pos":"動","m":"祝う","nu":"特別な出来事や成功を喜び祝う動詞で、記念日や達成を祝う場面でよく使われる。","ph":"celebrate a birthday","phm":"誕生日を祝う","ex":"We plan to celebrate our coach's birthday after practice.","exm":"練習後にコーチの誕生日を祝う予定だ。","us":"celebrateは他動詞で祝う対象を直接目的語にとり、celebrate forとはしない。","tip":"名詞形celebration（祝賀）とあわせて、行事や達成を祝う場面で使う語だと覚える。"},{"w":"confuse","pos":"動","m":"混乱させる；勘違いさせる","nu":"人の頭の中を整理できない状態にする動詞で、be confusedの形で「混乱する」を表す。","ph":"confuse A with B","phm":"AとBを混同する","ex":"The new rules confuse many students in our class.","exm":"新しい規則は私たちのクラスの多くの生徒を混乱させる。","us":"confuse A with B（AとBを混同する）の形が頻出。人が主語のときは受け身で使うことが多い。","tip":"形容詞confusing（混乱させるような）とconfused（混乱している）の違いに注意する。"},{"w":"control","pos":"動","m":"支配する；制御する","nu":"物事や感情を思い通りに管理・抑制する動詞で、manageより力による統制の意味合いが強い。","ph":"control your emotions","phm":"感情を抑える","ex":"Good players learn to control their emotions during a match.","exm":"優れた選手は試合中に感情を抑える方法を身につける。","us":"controlは他動詞で直接目的語をとる。out of control（制御不能で）という熟語も頻出。","tip":"名詞としても同形で使われ、self-control（自制心）のように複合語で覚えると便利。"},{"w":"deliver","pos":"動","m":"配達する；届ける","nu":"物や情報を目的の場所や相手にきちんと届ける動詞で、演説を行う意味でも使われる。","ph":"deliver a speech","phm":"スピーチをする","ex":"The captain will deliver a short speech before the game.","exm":"主将は試合前に短いスピーチをする予定だ。","us":"deliver A to B（AをBに届ける）が基本形。deliver a speechで「演説をする」という比喩的な意味にもなる。","tip":"名詞形delivery（配達）と一緒に覚えると、宅配便のイメージから意味を思い出しやすい。"},{"w":"design","pos":"動","m":"設計する；デザインする","nu":"目的に合わせて形や仕組みを計画・考案する動詞で、単なる装飾より機能面の工夫を含む。","ph":"design a website","phm":"ウェブサイトを設計する","ex":"Her club decided to design a poster for the festival.","exm":"彼女の部は文化祭のポスターをデザインすることに決めた。","us":"design A for B（BのためにAを設計する）の形でよく使われ、名詞としても同形で使う。","tip":"designer（デザイナー）という関連語とセットで、計画的に作るイメージを持つとよい。"},{"w":"divide","pos":"動","m":"分ける；分割する","nu":"一つの物や集団をいくつかの部分に分けて配分する動詞で、shareより物理的な分割を強調する。","ph":"divide into groups","phm":"グループに分ける","ex":"The teacher will divide the class into four small groups.","exm":"先生はクラスを4つの小さなグループに分ける予定だ。","us":"divide A into B（AをBに分ける）の形が頻出。数学の「割る」という意味でも使われる。","tip":"名詞division（分割・部門）と対義語combine（結合する）を合わせて覚える。"},{"w":"doubt","pos":"動","m":"疑う","nu":"物事の真実性や実現可能性を確信できずに疑う動詞で、信じられない気持ちを含む。","ph":"doubt whether","phm":"～かどうか疑う","ex":"Nobody could doubt her effort during the tennis tournament.","exm":"テニスの大会での彼女の努力を疑う者は誰もいなかった。","us":"肯定文ではdoubt whether/ifを、否定文・疑問文ではdoubt thatを使うことが多い。","tip":"名詞としても同形で使われ、no doubt（間違いなく）という熟語も覚えておくと便利。"},{"w":"exchange","pos":"動","m":"交換する","nu":"物や意見などを互いに取り替える動詞で、changeと違い双方向のやり取りを表す。","ph":"exchange ideas","phm":"意見を交換する","ex":"The two teams decided to exchange gifts after the match.","exm":"二つのチームは試合後に贈り物を交換することにした。","us":"exchange A for B（AをBと交換する）の形も使う。名詞のin exchange for（～と引き換えに）も頻出。","tip":"ex-（外へ）+ change（変える）で、互いに取り替えるイメージを持つと覚えやすい。"},{"w":"explore","pos":"動","m":"探検する；探る","nu":"未知の場所や可能性を実際に調べて発見しようとする動詞で、searchより広い範囲を対象とする。","ph":"explore new ideas","phm":"新しい考えを探る","ex":"The science club plans to explore the old forest nearby.","exm":"科学部は近くの古い森を探検する計画を立てている。","us":"exploreは他動詞で直接目的語をとり、explore intoのようにintoを続けない。","tip":"名詞形exploration（探検）とexplorer（探検家）も関連づけて覚えておく。"},{"w":"force","pos":"動","m":"強いる；強制する","nu":"相手の意思に反して何かをさせる動詞で、makeより強い圧力や権力を伴うニュアンスを持つ。","ph":"force someone to do","phm":"人に～するよう強いる","ex":"The coach may force the team to run extra laps.","exm":"コーチはチームに追加のラップを走らせるかもしれない。","us":"force A to do（Aに～することを強いる）の形が基本。名詞では「力・軍隊」の意味も持つ。","tip":"by force（力ずくで）という熟語とあわせて、強制のイメージで覚えるとよい。"},{"w":"gather","pos":"動","m":"集める；集まる","nu":"人や物が一箇所に集まる、または集める動詞で、collectより自然に集まる場面にも使う。","ph":"gather information","phm":"情報を集める","ex":"Students often gather in the library to study together.","exm":"生徒たちはよく図書館に集まって一緒に勉強する。","us":"gatherは自動詞（集まる）と他動詞（集める）の両方の用法を持つ。","tip":"名詞形gathering（集まり）も一緒に覚えておくと表現の幅が広がる。"},{"w":"judge","pos":"動","m":"判断する；審査する","nu":"証拠や基準に基づいて評価や決定を下す動詞で、guessより根拠のある判断を意味する。","ph":"judge a contest","phm":"コンテストを審査する","ex":"Please do not judge people by their test scores alone.","exm":"テストの点数だけで人を判断しないでください。","us":"judge A by B（BによってAを判断する）の形が頻出。名詞としても「裁判官・審査員」を表す。","tip":"名詞形judgment（判断力・判決）とセットで覚えておくと便利。"},{"w":"lead","pos":"動","m":"導く；率いる","nu":"人や集団を目的地や結果へ先頭に立って導く動詞で、guideより責任を伴う統率の意味が強い。","ph":"lead a team","phm":"チームを率いる","ex":"Hard work and practice often lead to great results.","exm":"努力と練習はしばしば素晴らしい結果につながる。","us":"lead to ~（～という結果につながる）の形が特に頻出。過去形・過去分詞はledになる。","tip":"動詞のlead（導く）は/liːd/、金属を表す名詞のlead（鉛）は/lɛd/と発音され、綴りは同じでも発音が異なる同形異音語である点に注意する。"},{"w":"observe","pos":"動","m":"観察する；気づく","nu":"注意深く物事を見て情報や変化を把握する動詞で、watchより科学的・客観的な観察を含む。","ph":"observe the behavior","phm":"行動を観察する","ex":"Scientists observe the stars carefully through a large telescope.","exm":"科学者たちは大きな望遠鏡を通して星を注意深く観察する。","us":"observeには「規則を守る」という意味もあり、observe the rulesのように使われる。","tip":"名詞形observation（観察）とobserver（観察者）も関連づけて覚えておく。"},{"w":"operate","pos":"動","m":"操作する；作動する","nu":"機械を動かしたり組織を運営したりする動詞で、runと近いが専門的な仕組みを扱う場面に多い。","ph":"operate a machine","phm":"機械を操作する","ex":"Only trained staff can operate this heavy machine safely.","exm":"訓練を受けたスタッフだけが、この重い機械を安全に操作できる。","us":"operate onで「手術する」という意味にもなる。自動詞として「機能する」の意味でも使われる。","tip":"名詞形operation（操作・手術・作戦）とoperator（操作者）も一緒に覚える。"},{"w":"own","pos":"動","m":"所有する","nu":"法的・実質的に何かを自分のものとして持っている動詞で、haveより所有権を明確に示す。","ph":"own a car","phm":"車を所有する","ex":"Very few high school students own a car in Japan.","exm":"日本で車を所有している高校生はごく少数だ。","us":"ownは状態動詞で進行形にはしにくい。形容詞としてmy own book（自分自身の本）のようにも使う。","tip":"名詞形owner（所有者）とownership（所有権）も関連づけて覚えておく。"},{"w":"pretend","pos":"動","m":"ふりをする","nu":"実際とは違う様子を装う動詞で、悪意よりも遊びや照れ隠しの場面でよく使われる。","ph":"pretend to be asleep","phm":"寝たふりをする","ex":"My little sister likes to pretend she is a princess.","exm":"私の幼い妹はお姫様のふりをするのが好きだ。","us":"pretend to doまたはpretend that節の形をとり、子どものごっこ遊びの文脈でも頻出。","tip":"見せかける・装うというイメージで、actと似た場面でも使われると覚えるとよい。"},{"w":"propose","pos":"動","m":"提案する；プロポーズする","nu":"新しい考えや計画を人前に出して検討を求める動詞で、suggestよりやや改まった響きを持つ。","ph":"propose a plan","phm":"計画を提案する","ex":"One member will propose a new idea at the meeting.","exm":"会議で一人のメンバーが新しいアイデアを提案する予定だ。","us":"propose that節では動詞の原形を使うことがある。propose to doで「～しようと計画する」の意味にもなる。","tip":"名詞形proposal（提案・プロポーズ）も一緒に覚えておくと便利。"},{"w":"record","pos":"動","m":"記録する；録音する","nu":"情報や音・映像を後で確認できる形で保存する動詞で、writeより機械的・正式な保存を含む。","ph":"record a video","phm":"動画を記録する","ex":"We will record the concert to watch it again later.","exm":"後でもう一度見られるように、私たちはそのコンサートを録画する予定だ。","us":"動詞のrecordはアクセントが後ろ、名詞のrecord（記録）は前にある点に注意する。","tip":"break a record（記録を破る）という表現と一緒に、名詞・動詞両方の用法を覚える。"},{"w":"seem","pos":"動","m":"～のように見える","nu":"話し手の推測や印象に基づいて物事の様子を述べる動詞で、lookより主観的な判断を表す。","ph":"seem tired","phm":"疲れているように見える","ex":"My classmates seem excited about the upcoming sports festival.","exm":"クラスメートたちは今度の体育祭に興奮しているようだ。","us":"seem + 形容詞、seem to doの形が基本で、進行形にはしない状態動詞である。","tip":"lookは見た目、seemは印象や推測に基づく点で使い分けると覚えやすい。"},{"w":"translate","pos":"動","m":"翻訳する；訳す","nu":"ある言語の意味を別の言語に置き換える動詞で、interpretと違い主に文章に使われる。","ph":"translate into English","phm":"英語に翻訳する","ex":"Our English teacher asked us to translate this short passage.","exm":"英語の先生は私たちにこの短い文章を訳すように言った。","us":"translate A into B（AをBに翻訳する）の形が基本。話し言葉の通訳にはinterpretを使う。","tip":"名詞形translation（翻訳）とtranslator（翻訳者）、interpreter（通訳者）との違いを押さえておく。"},{"w":"ability","pos":"名","m":"能力","nu":"何かを成し遂げるための生まれつきや習得した力を表す名詞で、skillより広い意味を持つ。","ph":"the ability to communicate","phm":"意思疎通する能力","ex":"Reading many books can improve your ability to concentrate.","exm":"多くの本を読むことは、集中する能力を高めることができる。","us":"ability to do（～する能力）の形が頻出。可算・不可算どちらでも使われる。","tip":"形容詞able（できる）と動詞enable（可能にする）が語根を共有すると覚えやすい。"},{"w":"aim","pos":"名","m":"目的；狙い","nu":"達成しようとする具体的な目標を表す名詞で、purposeより短期的で明確な狙いを指すことが多い。","ph":"the aim of the project","phm":"そのプロジェクトの目的","ex":"The main aim of our club is to help others.","exm":"私たちの部の主な目的は、人々を助けることだ。","us":"the aim of A is to do（Aの目的は～することだ）の形が頻出。動詞としてaim at/forでも使う。","tip":"goalやpurposeと近い意味だが、狙いを定めるという動作のイメージを持つとよい。"},{"w":"article","pos":"名","m":"記事；品目","nu":"新聞や雑誌に載る文章、または一つ一つの品物を指す名詞で、文脈によって意味が変わる。","ph":"a newspaper article","phm":"新聞記事","ex":"I read an interesting article about climate change today.","exm":"私は今日、気候変動についての興味深い記事を読んだ。","us":"article about/on ~（～についての記事）の形が頻出。可算名詞なのでan articleのように使う。","tip":"文法用語の「冠詞」も同じarticleと呼ばれるので、英文法の授業でも登場すると意識する。"},{"w":"author","pos":"名","m":"著者；作者","nu":"本や文章を書いた人を指す名詞で、writerよりやや形式的で作品の権利者という響きを持つ。","ph":"the author of the book","phm":"その本の著者","ex":"The author of this novel visited our school last week.","exm":"この小説の著者が先週、私たちの学校を訪れた。","us":"the author of ~（～の著者）の形が頻出。動詞としても「（本などを）著す」の意味で使われる。","tip":"authority（権威）と語根を共有し、自ら作り出す人というイメージで覚える。"},{"w":"balance","pos":"名","m":"均衡；バランス","nu":"複数の要素が偏らず釣り合っている状態を表す名詞で、比喩的に生活や心の安定にも使われる。","ph":"a good balance","phm":"良いバランス","ex":"It is important to keep a balance between study and rest.","exm":"勉強と休息の間のバランスを保つことが大切だ。","us":"keep/lose a balance between A and B（AとBの間のバランスを保つ・崩す）の形が頻出。","tip":"体操の「バランスを取る」というカタカナ語と同じ意味なので直感的に覚えやすい。"},{"w":"citizen","pos":"名","m":"市民；国民","nu":"ある国や都市に属し権利や義務を持つ人を表す名詞で、residentより法的な所属を強調する。","ph":"a good citizen","phm":"良き市民","ex":"Every citizen has the right to vote in elections.","exm":"すべての市民は選挙で投票する権利を持っている。","us":"citizen of + 国・都市名の形で所属先を表す。名詞citizenshipで「市民権」を表す。","tip":"city（都市）と語源が近く、都市や国に属する人というイメージで結びつけて覚える。"},{"w":"concern","pos":"名","m":"心配；関心事","nu":"気にかかって不安や関心を抱く事柄を表す名詞で、worryより社会的な問題にも広く使われる。","ph":"a growing concern","phm":"高まる懸念","ex":"Pollution has become a major concern for our city.","exm":"汚染は私たちの街にとって大きな懸念事項になっている。","us":"concern for/about ~（～についての心配）の形が頻出。動詞としては「心配させる・関係する」の意味を持つ。","tip":"形容詞concerned（心配している）、be concerned about ~という表現も一緒に覚えておく。"},{"w":"confidence","pos":"名","m":"自信；信頼","nu":"自分や他人の能力を信じて疑わない気持ちを表す名詞で、誇張のない安心感を含む。","ph":"gain confidence","phm":"自信をつける","ex":"Winning the match gave the young player great confidence.","exm":"試合に勝ったことで、その若い選手は大きな自信を得た。","us":"confidence in ~（～への信頼・自信）の形が頻出。不可算名詞として使うことが多い。","tip":"形容詞confident（自信のある）とあわせて、con-（共に）+ fide（信じる）という語根を意識する。"},{"w":"courage","pos":"名","m":"勇気","nu":"恐れを感じても行動する強い心を表す名詞で、日常的な困難への挑戦にもよく使われる。","ph":"have the courage to","phm":

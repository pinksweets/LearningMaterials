覚える。"},{"w":"inevitable","pos":"形","m":"避けられない；必然の","nu":"どうしても起こることが確実で、防ぎようがない事態を表す語だ。","ph":"an inevitable result","phm":"必然的な結果","ex":"Losing a few games seemed inevitable after the captain's injury.","exm":"キャプテンの怪我の後、数試合負けることは避けられないように思えた。","us":"it is inevitable that ...の形や、seem inevitableのようにbe動詞の補語で使うことが多い。","tip":"ラテン語のevitare（避ける）にin-（否定）がついた語で、「避けられない」という直訳的な意味を持つ。"},{"w":"intense","pos":"形","m":"激しい；強烈な","nu":"感情・活動・状況の程度が非常に強く、集中している様子を表す語だ。","ph":"intense pressure","phm":"強いプレッシャー","ex":"Players felt intense pressure during the last five minutes of the match.","exm":"選手たちは試合の残り5分間、強いプレッシャーを感じた。","us":"intense heat（猛暑）、intense training（猛練習）のように感覚や活動の強度を表す。名詞形はintensity。","tip":"extreme（極端な）と似るが、intenseは「集中して強い」ニュアンスが強い。動詞intensify（強める）も一緒に覚える。"},{"w":"internal","pos":"形","m":"内部の；心の中の","nu":"組織や物の内側、あるいは人の心の中を指す語だ。","ph":"internal conflict","phm":"内部の対立","ex":"The novel focuses on the internal conflict of its main character.","exm":"その小説は主人公の内面の葛藤に焦点を当てている。","us":"対義語はexternal（外部の）。internal organs（内臓）のように体の部位にもよく使われる。","tip":"対義語のexternalとセットで覚えると効率的。internal organs（内臓）のような表現もあわせて覚える。"},{"w":"legal","pos":"形","m":"法律の；合法の","nu":"法律に基づいている、または法律に反していないことを表す語だ。","ph":"legal age","phm":"法定年齢","ex":"In Japan, eighteen is now the legal age for voting.","exm":"日本では今、18歳が選挙権を持つ法定年齢だ。","us":"対義語はillegal（違法の）。legal adviceのように名詞を修飾することが多い。","tip":"ラテン語lex（法）が語源。illegal、legislationなど関連語とまとめて覚えると効率的。"},{"w":"mature","pos":"形","m":"成熟した；大人びた","nu":"心身が十分に発達し、大人としての判断力を備えている様子を表す語だ。","ph":"a mature attitude","phm":"大人びた態度","ex":"His classmates admired his mature attitude toward solving conflicts.","exm":"クラスメートは彼の争いごとを解決する大人びた態度に感心した。","us":"人にも果物・チーズなどにも使える語。動詞としても「成熟する」の意味で使われる。","tip":"対義語はimmature（未熟な）。natureと綴りが似ているが意味は無関係なので注意する。"},{"w":"moderate","pos":"形","m":"適度な；穏健な","nu":"極端でなく、ちょうどよい程度に抑えられている様子を表す語だ。","ph":"moderate exercise","phm":"適度な運動","ex":"Doctors recommend moderate exercise for students who study long hours.","exm":"医者は長時間勉強する生徒に適度な運動を勧めている。","us":"形容詞・名詞のmoderateは語尾を弱く「モデレット」/ˈmɒdərət/と発音するが、動詞（和らげる、司会をする）のmoderateは語尾を強く「モデレイト」/ˈmɒdəreɪt/と発音する点に注意が必要だ。","tip":"extreme（極端な）の対義語として覚えるとよい。moderate opinion（穏健な意見）のように立場にも使う。"},{"w":"modest","pos":"形","m":"控えめな；謙虚な","nu":"自分の実力や成果を誇示せず、控えめにふるまう態度を表す語だ。","ph":"a modest achievement","phm":"控えめな成果","ex":"Despite winning the contest, she remained modest about her achievement.","exm":"コンテストで優勝したにもかかわらず、彼女は自分の成果について謙虚だった。","us":"人の性格には「謙虚な」、数量にはa modest increase（わずかな増加）のように「小規模な」の意味になる。","tip":"modestyが名詞形。moderateと綴りが似ているが、modestは「謙虚さ」に重点がある点で区別する。"},{"w":"mutual","pos":"形","m":"相互の；共通の","nu":"二者以上の間で感情や利益が両方向に成り立っていることを表す語だ。","ph":"mutual respect","phm":"相互の尊重","ex":"Good teamwork is built on mutual respect among all members.","exm":"良いチームワークは全員の相互の尊重の上に成り立っている。","us":"mutual friend（共通の友人）のように「共通の」の意味でも使われる。","tip":"eachとの違いに注意。mutualは「お互いに向き合う」関係、eachは単に「それぞれ」を指す。"},{"w":"neutral","pos":"形","m":"中立の；中立的な","nu":"どちらの側にも味方せず、公平な立場を保っていることを表す語だ。","ph":"remain neutral","phm":"中立を保つ","ex":"The teacher tried to remain neutral during the class debate.","exm":"先生はクラス討論の間、中立を保とうとした。","us":"a neutral colorのように「これといった特徴のない、無難な」の意味でも使われる。","tip":"カタカナ語「ニュートラル」のイメージ通り、どちらにも偏らない状態を表す。"},{"w":"numerous","pos":"形","m":"多数の","nu":"manyよりも硬く、数がかなり多いことを客観的に述べる語だ。","ph":"numerous times","phm":"何度も","ex":"She has visited that library numerous times to prepare for exams.","exm":"彼女は試験勉強のためにその図書館を何度も訪れている。","us":"名詞の前に置いて使う。可算名詞の複数形と結びつくことが多い（numerous problemsなど）。","tip":"number（数）と同語源。manyのフォーマルな言い換えとして覚える。"},{"w":"permanent","pos":"形","m":"永続的な；恒久的な","nu":"一時的でなく、ずっと変わらずに続く状態を表す語だ。","ph":"a permanent solution","phm":"恒久的な解決策","ex":"The school needs a permanent solution to the crowded cafeteria problem.","exm":"その学校は混雑した食堂問題への恒久的な解決策を必要としている。","us":"対義語はtemporary（一時的な）。permanent job（正社員の仕事）のようにも使う。","tip":"permanent marker（油性ペン）のように「消えない」イメージで覚えると定着しやすい。"},{"w":"potential","pos":"形","m":"潜在的な；可能性のある","nu":"まだ実現していないが、将来そうなる可能性を秘めていることを表す語だ。","ph":"potential risks","phm":"潜在的なリスク","ex":"The coach warned the team about potential risks of overtraining.","exm":"コーチはチームに練習過多の潜在的なリスクについて警告した。","us":"名詞としても「潜在能力」の意味でよく使われる（have great potential）。","tip":"カタカナ語「ポテンシャル」通り、表には出ていない力や可能性を指す語だ。"},{"w":"precise","pos":"形","m":"正確な；精密な","nu":"数値や表現に誤差や曖昧さがほとんどないことを強調する語だ。","ph":"precise instructions","phm":"正確な指示","ex":"The recipe gives precise instructions about oven temperature and timing.","exm":"そのレシピはオーブンの温度と時間について正確な指示を与えている。","us":"accurateと似るが、preciseは細部までの厳密さに重点がある。副詞precisely（正確に）も頻出。","tip":"「精密」を表すカタカナ語「プレシジョン」から連想すると覚えやすい。"},{"w":"primary","pos":"形","m":"主要な；最初の","nu":"複数ある中で最も重要である、または時間的に最初であることを表す語だ。","ph":"the primary goal","phm":"主要な目標","ex":"Improving teamwork is the primary goal of this year's club activities.","exm":"チームワークの向上が今年の部活動の主要な目標だ。","us":"primary school（小学校）のように「最初の段階」の意味でも使われる。secondaryと対で覚える。","tip":"prime（第一の）と同語源。「一番目」というイメージで覚えるとよい。"},{"w":"rational","pos":"形","m":"合理的な；理性的な","nu":"感情に流されず、筋道立てて論理的に考え判断する様子を表す語だ。","ph":"a rational decision","phm":"合理的な判断","ex":"It is hard to make a rational decision when you are angry.","exm":"怒っているときに合理的な判断をするのは難しい。","us":"対義語はirrational（不合理な）。ratio（比、割合）と関連し、筋道の通った考え方を表す。","tip":"reason（理性）と同じ語根を持つ。emotional（感情的な）と対比して覚えると理解しやすい。"},{"w":"relevant","pos":"形","m":"関連した；適切な","nu":"話題や状況と直接つながりがあり、無関係ではないことを表す語だ。","ph":"relevant information","phm":"関連情報","ex":"Please include only information that is relevant to your research topic.","exm":"研究テーマに関連する情報だけを含めてください。","us":"be relevant to Aの形でよく使う。対義語はirrelevant（無関係な）。","tip":"対義語のirrelevantとセットで覚えると効率的。「話や場面と結びつく」というイメージを持つとよい。"},{"w":"remote","pos":"形","m":"遠く離れた；へんぴな","nu":"中心地から物理的・心理的に離れていて、アクセスしにくいことを表す語だ。","ph":"a remote village","phm":"へんぴな村","ex":"Her grandparents live in a remote village with no train station.","exm":"彼女の祖父母は電車の駅がないへんぴな村に住んでいる。","us":"remote controlのように「離れた場所から操作する」の意味や、remote work（在宅勤務）のようにも使う。","tip":"remove（取り除く）と同語源で、「離れている」イメージを持つ。isolatedと似た文脈で使われる。"},{"w":"rural","pos":"形","m":"田舎の；農村の","nu":"都市部と対照的に、自然が多く農業が中心の地域を表す語だ。","ph":"rural areas","phm":"農村地域","ex":"Many young people are moving away from rural areas to cities.","exm":"多くの若者が農村地域から都市へ移り住んでいる。","us":"対義語はurban（都市の）。rural lifeのように名詞を修飾する形でよく使う。","tip":"urbanとセットで覚えると対比しやすい。ruralはラテン語rus（田舎）に由来する語だ。"},{"w":"sensible","pos":"形","m":"分別のある；賢明な","nu":"状況をよく考えて実用的で理にかなった判断や行動をする様子を表す語だ。","ph":"a sensible choice","phm":"賢明な選択","ex":"Wearing a helmet while cycling is a sensible choice for safety.","exm":"自転車に乗るときヘルメットをかぶるのは安全のための賢明な選択だ。","us":"sensitive（敏感な）と綴りが似ているが意味が異なるので混同しないよう注意する。","tip":"sense（分別、常識）から派生した語。「実用的で常識的」というイメージで覚える。"},{"w":"severe","pos":"形","m":"深刻な；厳しい","nu":"被害・痛み・態度などの程度が非常に強く、深刻であることを表す語だ。","ph":"severe damage","phm":"深刻な被害","ex":"The typhoon caused severe damage to houses along the coast.","exm":"その台風は沿岸の家屋に深刻な被害をもたらした。","us":"severe weather（悪天候）、severe pain（激しい痛み）のように悪い状況を強調する語だ。","tip":"strict（厳格な）と近いが、severeは被害や苦痛の程度の深刻さに重点がある点で区別する。"},{"w":"significant","pos":"形","m":"重要な；著しい","nu":"注目に値するほど大きい、または重要な意味を持つことを表す語だ。","ph":"a significant difference","phm":"著しい違い","ex":"There was a significant difference between the two groups' test scores.","exm":"2つのグループのテストの点数には著しい違いがあった。","us":"importantとほぼ同義だが、統計や調査結果など客観的なデータの重要性を述べる際によく使われる。","tip":"sign（しるし）から派生し、「意味を示すほど重要」というイメージで覚える。"},{"w":"solid","pos":"形","m":"固体の；しっかりした","nu":"形が崩れず安定している、または内容がしっかりして信頼できることを表す語だ。","ph":"solid evidence","phm":"確かな証拠","ex":"The lawyer presented solid evidence to support her client's story.","exm":"弁護士は依頼人の話を裏付ける確かな証拠を提示した。","us":"物質の状態（固体）だけでなく、solid planのように「しっかりした、堅実な」の意味でも使う。","tip":"対義語はliquid（液体）やgas（気体）。比喩的にはreliable（信頼できる）に近い意味を持つ。"},{"w":"steady","pos":"形","m":"安定した；着実な","nu":"変動が少なく、一定のペースや状態を保ち続けていることを表す語だ。","ph":"steady progress","phm":"着実な進歩","ex":"Daily practice led to steady progress in her piano skills.","exm":"毎日の練習が彼女のピアノの技術の着実な進歩につながった。","us":"a steady jobのように「安定した」収入や生活を表す際にも使われる。","tip":"standと関連の深い語で、「ぐらつかず安定して立っている」イメージを持つとよい。"},{"w":"sufficient","pos":"形","m":"十分な","nu":"必要な量や程度をきちんと満たしていることをやや形式的に述べる語だ。","ph":"sufficient evidence","phm":"十分な証拠","ex":"The police did not have sufficient evidence to make an arrest.","exm":"警察は逮捕するのに十分な証拠を持っていなかった。","us":"enoughのフォーマルな言い換え。対義語はinsufficient（不十分な）。","tip":"sufficeという動詞（十分である）から派生した形容詞だと覚える。"},{"w":"superior","pos":"形","m":"優れた；上位の","nu":"他と比較して質・地位・能力が高いことを表す語だ。","ph":"superior quality","phm":"優れた品質","ex":"Customers chose the brand because of its superior quality and durability.","exm":"顧客はその優れた品質と耐久性のためにそのブランドを選んだ。","us":"be superior to A（Aより優れている）のようにthanではなくtoを使う点に注意する。","tip":"対義語はinferior（劣った）。ラテン語superus（上の）に由来し、「上位」のイメージで覚える。"},{"w":"tremendous","pos":"形","m":"非常に大きい；ものすごい","nu":"驚くほど大きい、すごいという驚きの気持ちを込めて規模や程度を強調する語。","ph":"a tremendous amount of effort","phm":"ものすごい量の努力","ex":"Our team put in a tremendous effort before the final match.","exm":"私たちのチームは決勝戦前にものすごい努力をした。","us":"amount, effort, success など規模や量を表す名詞の前によく置く。副詞形 tremendously も高頻度で使われる。","tip":"語源はラテン語で「震えるほど恐ろしいもの」の意味。そこから程度の甚だしさを表す語になった。"},{"w":"urban","pos":"形","m":"都市の；都会の","nu":"都市特有の生活様式や環境を指す語で、田舎（rural）と対比して使われる。","ph":"urban development","phm":"都市開発","ex":"Many young people move to urban areas to find better jobs.","exm":"多くの若者はより良い仕事を求めて都市部へ移り住む。","us":"名詞の前に置いて「都市の」という意味を表す形容詞。対義語は rural（田舎の）。","tip":"urb-はラテン語で「都市」を表す語根で、suburb（郊外）や urbanize（都市化する）にも含まれる。"},{"w":"urgent","pos":"形","m":"緊急の；急を要する","nu":"すぐに対応しなければ深刻な事態になりかねないという切迫感を表す語。","ph":"an urgent matter","phm":"緊急の用件","ex":"She received an urgent message from her coach late at night.","exm":"彼女は夜遅くにコーチから緊急のメッセージを受け取った。","us":"urgent need, urgent message のように名詞を修飾することが多い。名詞形は urgency（緊急性）。","tip":"urge（強く迫る、衝動）と語源が同じで、今すぐ行動を迫るイメージで覚えるとよい。"},{"w":"valid","pos":"形","m":"有効な；妥当な","nu":"法的・論理的な根拠や条件を満たしており、認められる状態を表す語。","ph":"a valid reason","phm":"妥当な理由","ex":"You need a valid ticket to enter the school festival hall.","exm":"学園祭の会場に入るには有効なチケットが必要だ。","us":"パスポートや契約が「期限内で効力がある」ことと、議論が「筋の通った」ことの両方に使う。反意語は invalid。","tip":"valid の val はラテン語で「価値がある、強い」を意味し、value（価値）と同じ語根から来ている。"},{"w":"vital","pos":"形","m":"不可欠な；重大な","nu":"それがなければ存続や成功が成り立たないほど重要であることを強調する語。","ph":"play a vital role","phm":"重要な役割を果たす","ex":"Sleep plays a vital role in keeping students healthy and focused.","exm":"睡眠は生徒の健康と集中力を保つ上で重要な役割を果たす。","us":"vital to / for の形で「〜にとって不可欠だ」と表す。important よりも重要度が高いニュアンスを持つ。","tip":"vita はラテン語で「生命」を意味し、vitamin（ビタミン）と同じ語源だと考えると覚えやすい。"},{"w":"voluntary","pos":"形","m":"自発的な；ボランティアの","nu":"義務ではなく自らの意志で行うことを表し、compulsory（強制的な）と対比される。","ph":"voluntary work","phm":"自発的な奉仕活動","ex":"Joining the clean-up event is completely voluntary for all students.","exm":"その清掃活動への参加は生徒全員にとって完全に自由参加だ。","us":"voluntary work（ボランティア活動）のように名詞を修飾する。動詞 volunteer（自ら申し出る）と合わせて覚える。","tip":"volunt-はラテン語で「意志」を意味し、volunteer（志願者）と語根が共通する。"},{"w":"approximately","pos":"副","m":"おおよそ；約","nu":"正確ではないが実際の数値に近いことを示す、数量表現に添える語。","ph":"approximately two hours","phm":"約2時間","ex":"The trip to the museum takes approximately two hours by train.","exm":"その美術館までの旅は電車で約2時間かかる。","us":"数詞の直前に置いて使うことが多く、about よりもややかたい表現。","tip":"approximate（近似の）の副詞形。ap-（〜へ）+ proxim（最も近い）という成り立ちから「近い数値」を表す。"},{"w":"barely","pos":"副","m":"かろうじて；ほとんど〜ない","nu":"基準をぎりぎり満たす、または満たさないほど程度が低いことを表す語。","ph":"barely passed the test","phm":"かろうじて試験に合格した","ex":"He barely passed the test after studying all night long.","exm":"彼は徹夜で勉強してかろうじて試験に合格した。","us":"準否定語として scarcely, hardly と似た意味で使うが、「ぎりぎり成功した」文脈でも使える点が特徴。","tip":"bare（むき出しの、わずかな）から派生し、わずかな余地しかないイメージで覚える。"},{"w":"deliberately","pos":"副","m":"意図的に；わざと","nu":"偶然ではなく、はっきりとした意図をもって行動することを示す語。","ph":"deliberately ignored her","phm":"わざと彼女を無視した","ex":"He deliberately ignored her text message to avoid an argument.","exm":"彼は口論を避けるためわざと彼女のメッセージを無視した。","us":"on purpose と同じ意味だが、より書き言葉的で、慎重に考えた上での行動というニュアンスを含む。","tip":"deliberate（形：慎重な、故意の）の副詞形で、よく考えてからという語源イメージを持つ。"},{"w":"frequently","pos":"副","m":"頻繁に；しばしば","nu":"ある行動や出来事が短い間隔で繰り返し起こることを表す語。","ph":"frequently asked questions","phm":"よくある質問","ex":"Students frequently check their phones during short breaks between classes.","exm":"生徒は授業の合間の短い休憩中に頻繁にスマホを確認する。","us":"often よりもややかたく、統計や説明文でよく使われる。形容詞形 frequent と合わせて覚える。","tip":"反意語は rarely, seldom。frequency（頻度、周波数）と語根が同じだと考えると覚えやすい。"},{"w":"literally","pos":"副","m":"文字通り；実際に","nu":"比喩ではなく実際にその通りであることを強調する語で、口語では誇張表現にも使われる。","ph":"literally means","phm":"文字通り〜を意味する","ex":"The word \"photosynthesis\" literally means putting together using light.","exm":"「光合成」という単語は文字通り「光を使って組み立てる」ことを意味する。","us":"本来は比喩表現と対比して使うが、口語では強調のために誇張表現の前でも使われることがある。","tip":"letter（文字）と語根が同じで、文字の通りにという原義から意味を理解すると覚えやすい。"},{"w":"merely","pos":"副","m":"単に；ほんの","nu":"それ以上でも以下でもなく、単純にそれだけであることを強調する語。","ph":"merely a suggestion","phm":"単なる提案","ex":"His comment was merely a suggestion, not a strict rule.","exm":"彼のコメントは単なる提案であり、厳格なルールではなかった。","us":"only や just と似た意味だが、文章語としてやや硬い響きを持つ。","tip":"mere（形：単なる）の副詞形で、nothing more than の意味合いを持つと覚える。"},{"w":"nevertheless","pos":"副","m":"それにもかかわらず","nu":"前の内容と反する事実や意見を、逆接的につなげて述べる際に使う語。","ph":"nevertheless, she smiled","phm":"それでも彼女は微笑んだ","ex":"The rain was heavy; nevertheless, the team continued their practice match.","exm":"雨は激しかったが、それでもチームは練習試合を続けた。","us":"however よりもややかたい書き言葉で、文頭やセミコロンの後にコンマを伴って使うことが多い。","tip":"never + the + less「それでも少しも減らない」という成り立ちから意味を連想できる。"},{"w":"occasionally","pos":"副","m":"時々；たまに","nu":"頻繁ではないが、時折起こる程度の頻度を表す語。","ph":"occasionally skips breakfast","phm":"たまに朝食を抜く","ex":"My brother occasionally skips breakfast when he wakes up late.","exm":"兄は寝坊したときたまに朝食を抜く。","us":"sometimes よりも頻度が低いニュアンスで、often と rarely の中間程度の頻度を表す。","tip":"occasion（機会、場合）の副詞形で、たまにその機会があるという意味から覚える。"},{"w":"rarely","pos":"副","m":"めったに〜ない","nu":"頻度が非常に低いことを表す準否定の副詞。","ph":"rarely goes out","phm":"めったに外出しない","ex":"My grandfather rarely goes out on cold winter mornings.","exm":"祖父は寒い冬の朝にはめったに外出しない。","us":"準否定語なので not と一緒に使わない点に注意。頻度は seldom とほぼ同じ。","tip":"rare（形：まれな）の副詞形で、対義語は frequently や often。"},{"w":"somewhat","pos":"副","m":"いくぶん；多少","nu":"完全にではないが、ある程度その状態や性質を持つことを表す控えめな語。","ph":"somewhat surprised","phm":"いささか驚いて","ex":"I was somewhat surprised by how quickly the meeting ended.","exm":"会議がこんなに早く終わったことに私はいくぶん驚いた。","us":"形容詞や比較級の前に置いて程度を和らげる働きをする。a little や slightly と似た意味。","tip":"some + what「いくらか何か」という成り立ちから、控えめな程度を表す語だと覚える。"},{"w":"thoroughly","pos":"副","m":"徹底的に；すっかり","nu":"細部まで手を抜かずに完全に行うことを表す語。","ph":"thoroughly cleaned the room","phm":"部屋を徹底的に掃除した","ex":"We thoroughly cleaned the room before the guests arrived.","exm":"私たちはお客さんが来る前に部屋を徹底的に掃除した。","us":"check, clean, understand などの動詞とよく結びつき、completely に近い意味を持つ。","tip":"thorough（形：徹底的な）の副詞形で、through（通り抜けて）と関連づけてすみずみまでとイメージすると覚えやすい。"},{"w":"ultimately","pos":"副","m":"最終的に；結局","nu":"いくつかの経過や議論を経て、最後にたどり着く結論や結果を示す語。","ph":"ultimately decided to quit","phm":"最終的に辞めることを決めた","ex":"After much thought, she ultimately decided to quit the club.","exm":"熟考の末、彼女は最終的にその部活を辞めることを決めた。","us":"finally と似ているが、長い過程や検討の末の結論を述べる際に好まれる。","tip":"ultimate（形：究極の、最終的な）の副詞形で、これ以上先がない結末とイメージすると覚えやすい。"},{"w":"virtually","pos":"副","m":"事実上；ほとんど","nu":"完全にではないが、実質的にはほぼそうであると言える状態を表す語。","ph":"virtually impossible","phm":"事実上不可能","ex":"Finishing the project in one day is virtually impossible for us.","exm":"そのプロジェクトを1日で終えるのは私たちにとって事実上不可能だ。","us":"almost に近いが、より客観的・断定的な響きを持つ。「オンラインの、仮想の」という意味の virtual と混同しないよう注意。","tip":"virtual（実質上の、仮想の）の副詞形で、名目上ではないが実質的にはという意味だと覚える。"},{"w":"regarding","pos":"前","m":"〜に関して","nu":"話題や対象を示す際に、about よりもやや改まった場面で使う前置詞。","ph":"regarding your question","phm":"あなたの質問に関して","ex":"I have a few concerns regarding the schedule for next week.","exm":"来週のスケジュールに関していくつか気になる点がある。","us":"about, concerning とほぼ同義でメールや書き言葉でよく使われる前置詞。","tip":"regard（〜とみなす、注目する）から派生し、〜に目を向けてという意味だと覚えるとよい。"},{"w":"whereas","pos":"接","m":"〜である一方","nu":"二つの事柄を対比させ、違いをはっきり示すときに使う接続詞。","ph":"whereas the other","phm":"一方でもう一方は","ex":"Tom enjoys team sports, whereas his sister prefers reading alone.","exm":"トムはチームスポーツを楽しむ一方、彼の妹は一人で読書をする方が好きだ。","us":"while と同様に対比を表すが、whereas の方がより明確でフォーマルな対比を示す接続詞。","tip":"where + as という形から、その点において〜な一方という対比のイメージを持つと覚えやすい。"},{"w":"approach","pos":"動","m":"近づく；取り組む","nu":"物理的に近づくことと、問題に対処し始めることの両方を表せる語。","ph":"approach the problem","phm":"その問題に取り組む","ex":"We should approach this issue calmly instead of arguing loudly.","exm":"大声で言い争うのではなく、冷静にこの問題に取り組むべきだ。","us":"他動詞として直接目的語をとり、to は不要。名詞としても「取り組み方」の意味で使われる。","tip":"ap-（〜へ）+ proach（近い）という成り立ちから、近づくという基本イメージを持つと覚えやすい。"},{"w":"assist","pos":"動","m":"助ける；手伝う","nu":"主な行動をする人の補助として力を貸すことを表す、help よりやや堅い語。","ph":"assist with homework","phm":"宿題を手伝う","ex":"Older students often assist younger ones with their homework after school.","exm":"上級生は放課後、下級生の宿題をよく手伝う。","us":"assist in/with という形をとることが多く、名詞形 assistance や assistant も合わせて覚えるとよい。","tip":"help よりもフォーマルな場面で使われ、補助的な立場からの支援というニュアンスを持つ。"},{"w":"attempt","pos":"動","m":"試みる","nu":"成功するかどうか分からないことに挑戦する行為を表す語。","ph":"attempt to solve","phm":"解決を試みる","ex":"He will attempt to solve the puzzle before the time limit ends.","exm":"彼は制限時間が終わる前にそのパズルを解こうとするだろう。","us":"attempt to do の形で「〜しようと試みる」という意味。名詞としても attempt at ~ の形でよく使う。","tip":"try よりもやや硬い語で、困難な課題に挑むニュアンスを持つ。"},{"w":"criticize","pos":"動","m":"批判する","nu":"欠点や誤りを指摘して否定的な意見を述べることを表す語。","ph":"criticize the decision","phm":"その決定を批判する","ex":"Some fans criticize the coach for changing the starting lineup.","exm":"一部のファンは先発メンバーを変更したことでコーチを批判する。","us":"criticize A for B の形で「BのことでAを批判する」という意味になる。名詞形は criticism。","tip":"critic（批評家）と語根が同じで、評価して意見を述べるというイメージを持つと覚えやすい。"},{"w":"defend","pos":"動","m":"守る；擁護する","nu":"攻撃や批判からある対象を守り、その正当性を主張することを表す語。","ph":"defend her opinion","phm":"彼女の意見を擁護する","ex":"Good lawyers always defend their clients with strong evidence and logic.","exm":"優秀な弁護士は常に強い証拠と論理で依頼人を弁護する。","us":"defend A from/against B の形で「BからAを守る」という意味。スポーツでは「守備をする」という意味でも使われる。","tip":"de-（away）+ fend（打つ、防ぐ）という成り立ちから、打撃をそらして守るというイメージを持つ。"},{"w":"deserve","pos":"動","m":"〜に値する","nu":"その人の行動や性質から見て、当然その報いを受けるべきだという評価を表す語。","ph":"deserve a break","phm":"休憩に値する","ex":"After such hard training, the players deserve a good rest tonight.","exm":"あれほど厳しい練習の後だから、選手たちは今夜しっかり休むに値する。","us":"deserve to do や deserve + 名詞の形で使い、良いことにも悪いことにも使える。進行形にはしない点に注意。","tip":"de-（完全に）+ serve（仕える、値する）という成り立ちから、十分に値するというイメージを持つ。"},{"w":"endure","pos":"動","m":"耐える","nu":"苦痛や困難な状況を我慢し、長期間持ちこたえることを表す語。","ph":"endure the pain","phm":"痛みに耐える","ex":"Marathon runners must endure severe pain during the final few kilometers.","exm":"マラソン選手は最後の数キロメートルで激しい痛みに耐えなければならない。","us":"endure + 名詞、または endure doing の形で使う。bear や stand と似た意味を持つ。","tip":"en-（〜にする）+ dure（持続する、durable と同語源）という成り立ちから、持ちこたえるというイメージを持つ。"},{"w":"exaggerate","pos":"動","m":"誇張する","nu":"実際よりも大げさに表現し、事実以上に強調して伝えることを表す語。","ph":"exaggerate the story","phm":"話を誇張する","ex":"My friends always exaggerate the size of the fish they catch.","exm":"私の友人たちはいつも釣った魚の大きさを誇張する。","us":"exaggerate + 名詞や exaggerate that ~ の形で使う。名詞形は exaggeration。","tip":"ex-（外へ）+ agger（積み上げる）という成り立ちから、積み上げて大きく見せるというイメージを持つ。"},{"w":"inspire","pos":"動","m":"鼓舞する；着想を与える","nu":"人の心を動かし、意欲や新しいアイデアを引き出すきっかけを与えることを表す語。","ph":"inspire her students","phm":"生徒たちを鼓舞する","ex":"Great teachers inspire their students to keep trying their best.","exm":"優れた教師は生徒たちが最善を尽くし続けるよう鼓舞する。","us":"inspire A to do の形で「Aに〜する気にさせる」という意味になる。名詞形 inspiration も頻出。","tip":"in-（中に）+ spire（息を吹き込む、spirit と同語源）という成り立ちから、魂を吹き込むというイメージを持つ。"},{"w":"intend","pos":"動","m":"意図する；つもりである","nu":"未来にある行動をとろうと心の中で計画・決意していることを表す語。","ph":"intend to study","phm":"勉強するつもりである","ex":"Many students intend to study abroad after graduating from high school.","exm":"多くの生徒は高校卒業後に留学するつもりでいる。","us":"intend to do の形でよく使い、plan to do とほぼ同じ意味。名詞形 intention、形容詞 intentional も覚えておく。","tip":"in-（〜へ）+ tend（伸ばす、tension と同語源）という成り立ちから、目標に向けて心を伸ばすというイメージを持つ。"},{"w":"interrupt","pos":"動","m":"中断する；遮る","nu":"進行中の会話や行動を途中で急に止めることを表す語。","ph":"interrupt the meeting","phm":"会議を中断させる","ex":"Please do not interrupt the teacher while she is explaining.","exm":"先生が説明している間は遮らないでください。","us":"interrupt A の形で他動詞として使い、interrupt someone while doing のように使うことが多い。名詞形 interruption も重要。","tip":"inter-（間に）+ rupt（破る、rupture と同語源）という成り立ちから、間に割って入るというイメージを持つ。"},{"w":"motivate","pos":"動","m":"動機づける；やる気にさせる","nu":"ある行動を起こす気持ちや理由を人に与えることを表す語。","ph":"motivate her teammates","phm":"チームメイトを動機づける","ex":"A good coach can motivate players even after a tough loss.","exm":"優れたコーチは辛い敗戦の後でも選手を奮い立たせることができる。","us":"motivate A to do の形で「Aに〜する気を起こさせる」という意味。名詞形 motivation も頻出語。","tip":"motive（動機）と語根が同じで、動く理由を与えるというイメージを持つと覚えやすい。"},{"w":"permit","pos":"動","m":"許可する","nu":"公式または権限を持つ立場から、何かをすることを認めることを表す語。","ph":"permit students to leave","phm":"生徒の退出を許可する","ex":"The rules do not permit students to use phones in class.","exm":"校則では授業中の生徒のスマホ使用を許可していない。","us":"permit A to do の形で「Aが〜するのを許可する」という意味。allow よりもややフォーマルな響きを持つ。","tip":"per-（通して）+ mit（送る、mission と同語源）という成り立ちから、通ることを許すというイメージを持つ。"},{"w":"resemble","pos":"動","m":"似ている","nu":"見た目や性質が別のものと共通点を持っていることを表す状態動詞。","ph":"resemble her mother","phm":"母親に似ている","ex":"Many people say twins often resemble each other in personality too.","exm":"双子は性格まで互いに似ていることが多いと多くの人が言う。","us":"状態動詞なので基本的に進行形にしない。look like と似た意味だが、resemble は他動詞で前置詞を伴わない点に注意。","tip":"re-（再び）+ semble（似る、フランス語の semblerに由来）という成り立ちから、同じように見えるというイメージを持つ。"},{"w":"resist","pos":"動","m":"抵抗する","nu":"圧力や誘惑、変化などに屈せず、対抗しようとすることを表す語。","ph":"resist the temptation","phm":"誘惑に抵抗する","ex":"It is hard to resist the temptation to check your phone.","exm":"スマホを確認したいという誘惑に抵抗するのは難しい。","us":"resist doing の形をとり、to不定詞は続けない点に注意。名詞形 resistance も合わせて覚える。","tip":"re-（対抗して）+ sist（立つ、consist と同語源）という成り立ちから、立ちはだかって対抗するというイメージを持つ。"},{"w":"revise","pos":"動","m":"修正する；改訂する","nu":"内容をより良くするために見直し、部分的に書き直すことを表す語。","ph":"revise the essay","phm":"小論文を修正する","ex":"Students should revise their essays carefully before the final submission.","exm":"生徒は最終提出前に小論文を注意深く修正すべきだ。","us":"イギリス英語では「復習する」の意味でも使われる。名詞形 revision も頻出。","tip":"re-（再び）+ vise（見る、vision と同語源）という成り立ちから、もう一度見直すというイメージを持つ。"},{"w":"transfer","pos":"動","m":"移す；転校する","nu":"人や物をある場所・所属から別の場所・所属へ移動させることを表す語。","ph":"transfer to another school","phm":"別の学校に転校する","ex":"He decided to transfer to another school near his new house.","exm":"彼は新しい家の近くの別の学校に転校することを決めた。","us":"transfer to ~ の形で「〜へ移る」という意味になり、名詞として使う場合は強勢の位置が変わる点に注意。","tip":"trans-（越えて）+ fer（運ぶ、ラテン語 ferre に由来）という成り立ちから、向こう側へ運ぶというイメージを持つ。"},{"w":"ancestor","pos":"名","m":"祖先；先祖","nu":"自分より前の世代に生きていた血縁上の人々を指す語。","ph":"a common ancestor","phm":"共通の祖先","ex":"According to my grandmother, our family has one famous ancestor from Kyushu.","exm":"祖母によると、私たちの家系には九州出身の有名な先祖が一人いるそうだ。","us":"可算名詞で、複数形 ancestors もよく使われる。祖父母よりもさらに前の世代を指すことが多い。","tip":"「前に行く者」を意味するラテン語に由来し、反意語の descendant（子孫）とセットで覚えるとよい。"},{"w":"anxiety","pos":"名","m":"不安；心配","nu":"将来の出来事に対する強い心配や落ち着かない気持ちを表す語。","ph":"feel anxiety about","phm":"〜について不安を感じる","ex":"Many students feel anxiety about speaking in front of the class.","exm":"多くの生徒はクラスの前で話すことに不安を感じる。","us":"不可算名詞として使うことが多いが、「不安の種」を指す場合は複数形 anxieties も使われる。形容詞形は anxious。","tip":"anxious（不安な）の名詞形で、「苦悩」を意味する anguish とも語源的なつながりを持つ語として覚えるとよい。"},{"w":"background","pos":"名","m":"背景；経歴","nu":"人や物事の背後にある事情・経歴・環境を指し、前面に出ない「土台」を表すイメージの語。","ph":"from a poor background","phm":"貧しい家庭環境の出身で","ex":"She talked about her family background during the interview.","exm":"彼女は面接で自分の家庭環境について話した。","us":"可算・不可算どちらでも使われ、\"background in ~\"で「〜の経験・素養」を表す。前置詞はinやfromがよく使われる。","tip":"back（後ろ）＋ground（地面）の成り立ちで、「背後にある土台」というイメージで覚えるとよい。"},{"w":"career","pos":"名","m":"職業；経歴","nu":"一生を通して積み重ねていく仕事の道筋を指し、単発の仕事（job）より長期的な視点を持つ語。","ph":"pursue a career in medicine","phm":"医療分野で経歴を積む","ex":"My brother wants to build a career in music.","exm":"兄は音楽の分野でキャリアを築きたいと思っている。","us":"\"career in/as ~\"の形でよく使う。build a career、change one's careerなど動詞との組み合わせも重要。","tip":"carやcarryと同じくラテン語の「車、荷車」を語源に持つとされ、人生を運んでいく道というイメージで捉える。"},{"w":"fee","pos":"名","m":"料金；謝礼","nu":"サービスや専門的な行為への対価として支払う、決まった額のお金を指す語。","ph":"pay an entrance fee","phm":"入場料を払う","ex":"Students must pay a small fee to join the club.","exm":"生徒はそのクラブに入るために少額の料金を払う必要がある。","us":"可算名詞で、school fee、entrance feeのように名詞を前に置いた複合語で使われることが多い。","tip":"「サービスへの対価」という点でchargeと似るが、feeは会費・受講料など決まった額の支払いに使われることが多い。"},{"w":"fund","pos":"名","m":"資金；基金","nu":"特定の目的のために集められ蓄えられたお金のまとまりを指し、組織的な資金というイメージを持つ語。","ph":"create a fund for research","phm":"研究のための基金を作る","ex":"The school plans to start a fund for new books.","exm":"学校は新しい本のための基金を始める予定だ。","us":"「資金」の意味では複数形fundsもよく使われ、動詞では「資金を提供する」という意味になる。","tip":"fund（基金）と、findの過去形・過去分詞のfound（見つけた）、または「設立する」という意味の動詞found（found-founded-founded）は綴りが似ているので混同しないように注意する。"},{"w":"license","pos":"名","m":"免許；許可証","nu":"公的な機関が特定の行為を行うことを正式に認めたことを示す証明書を指す語。","ph":"get a driver's license","phm":"運転免許を取得する","ex":"You need a license to drive a car in Japan.","exm":"日本で車を運転するには免許が必要だ。","us":"イギリス英語では名詞licenceと動詞licenseを区別するが、アメリカ英語ではlicenseに統一されることが多い。","tip":"license plate（ナンバープレート）のような複合語と合わせて覚えると定着しやすい。"},{"w":"symbol","pos":"名","m":"象徴；記号","nu":"抽象的な意味や概念を目に見える形で表すもの・マークを指す語。","ph":"a symbol of peace","phm":"平和の象徴","ex":"The dove is often used as a symbol of peace.","exm":"ハトはしばしば平和の象徴として使われる。","us":"\"a symbol of ~\"の形で「〜の象徴」を表す。数学の記号や地図記号など具体的なマークにも使う。","tip":"動詞symbolize（象徴する）、形容詞symbolic（象徴的な）と合わせて覚えると語彙が広がる。"},{"w":"victim","pos":"名","m":"犠牲者；被害者","nu":"事故・犯罪・災害などによって害を受けた人を指し、同情を伴うニュアンスを持つ語。","ph":"a victim of the accident","phm":"その事故の被害者","ex":"The news reported that no one became a victim.","exm":"そのニュースは誰も被害者にはならなかったと報じた。","us":"\"victim of ~\"の形で使い、fall victim to ~で「〜の犠牲になる」という熟語表現になる。","tip":"ラテン語で「生け贄（いけにえ）」を意味する語に由来し、何かの犠牲になった人というイメージで覚える。"},{"w":"wisdom","pos":"名","m":"知恵","nu":"知識だけでなく経験に裏づけられた判断力や思慮深さを指す語。","ph":"words of wisdom","phm":"知恵の言葉、金言","ex":"My grandmother often shares wisdom from her long life.","exm":"祖母はよく自分の長い人生から得た知恵を教えてくれる。","us":"不可算名詞として扱い、\"the wisdom of ~\"や\"words of wisdom\"の形でよく使われる。","tip":"形容詞wise（賢い）に抽象名詞を作る語尾-domがついた形だと考えると覚えやすい。"},{"w":"brief","pos":"形","m":"短い；簡潔な","nu":"時間や説明が短く、要点だけにまとまっている様子を表す語。","ph":"a brief explanation","phm":"簡潔な説明","ex":"The teacher gave a brief explanation before the test.","exm":"先生はテストの前に簡潔な説明をした。","us":"\"in brief\"で「要するに」という副詞句になる。shortより堅い語で、内容の簡潔さを強調する。","tip":"「短い」という意味ではshortと似るが、briefは時間よりも要点を絞った簡潔さに重点がある。"},{"w":"cautious","pos":"形","m":"慎重な","nu":"危険や失敗を避けるために注意深く行動する様子を表す語。","ph":"be cautious about spending money","phm":"お金を使うことに慎重である","ex":"You should be cautious when you walk near the road.","exm":"道路の近くを歩くときは慎重になるべきだ。","us":"\"cautious about/of ~\"の形で「〜に慎重な」を表す。名詞形はcaution（注意、警戒）。","tip":"名詞caution（警戒）に形容詞語尾-iousがついた形なので、名詞と一緒に覚えると効率的。"},{"w":"fluent","pos":"形","m":"流暢な","nu":"言葉がよどみなくすらすらと出てくる様子を表し、主に外国語の運用能力を評価する語。","ph":"be fluent in English","phm":"英語が流暢である","ex":"Her older sister is fluent in three languages.","exm":"彼女の姉は3つの言語を流暢に話す。","us":"\"fluent in + 言語\"の形で使う。goodやwellと違い、言葉の流暢さそのものを強調する語。","tip":"flu-は「流れる」という意味を持ち（fluidやinfluenceと同系）、言葉がスムーズに流れ出るイメージで覚える。"},{"w":"innocent","pos":"形","m":"無実の；無邪気な","nu":"罪や悪意がなく潔白である様子、または純粋で世間ずれしていない様子を表す語。","ph":"prove someone innocent","phm":"人が無実であると証明する","ex":"The boy looked innocent, but he had broken the rule.","exm":"その少年は無邪気に見えたが、規則を破っていた。","us":"「無罪の」の意味ではguiltyの対義語として使われ、\"innocent of ~\"で「〜について無実の」を表す。","tip":"in-（否定）＋nocere（害する）というラテン語の成り立ちから「害を与えない＝無実の」と覚えられる。"},{"w":"intelligent","pos":"形","m":"知能の高い","nu":"物事を理解し判断する能力が優れている様子を表し、学力よりも思考力の高さに焦点を当てる語。","ph":"an intelligent guess","phm":"賢明な推測","ex":"The intelligent student solved the difficult problem quickly.","exm":"その賢い生徒は難しい問題を素早く解いた。","us":"名詞形intelligenceは不可算名詞。cleverよりフォーマルで、知性そのものを評価するときに使う。","tip":"artificial intelligence（人工知能、AI）という表現から名詞形と一緒に覚えると定着しやすい。"},{"w":"ordinary","pos":"形","m":"普通の","nu":"特別でなく、日常どこにでもある平凡な様子を表す語。","ph":"an ordinary day","phm":"普通の一日","ex":"It was just an ordinary Monday morning at school.","exm":"それは学校でのごく普通の月曜の朝だった。","us":"\"out of the ordinary\"で「普通ではない、異例の」という熟語になる。normalより「平凡さ」を強調する。","tip":"extraordinary（並外れた）はextra（〜の外）＋ordinaryの成り立ちなので、対で覚えると効率的。"},{"w":"precious","pos":"形","m":"貴重な","nu":"金銭的または心情的に非常に価値が高く、失いたくないと感じる様子を表す語。","ph":"precious time with family","phm":"家族との貴重な時間","ex":"Every precious moment with friends should be remembered.","exm":"友達との貴重な瞬間はどれも覚えておくべきだ。","us":"preciousは感情的な価値、valuableは金銭的価値を強調することが多いが、重なる場面も多い。","tip":"price（価格）と同じ語源のpretiumに由来するとされ、価値の高さをイメージすると覚えやすい。"},{"w":"sincere","pos":"形","m":"誠実な","nu":"見せかけではなく、心から本当にそう思っている様子を表す語。","ph":"a sincere apology","phm":"心からの謝罪","ex":"He gave a sincere apology for being late to practice.","exm":"彼は練習に遅刻したことについて心から謝罪した。","us":"手紙の結びの\"Sincerely,\"はこの語の副詞形。honestが「正直さ」なら、sincereは「心のこもった真剣さ」を表す。","tip":"手紙の結び\"Sincerely yours,\"でおなじみの語で、そこから「心を込めた」という意味を連想すると覚えやすい。"},{"w":"vivid","pos":"形","m":"鮮やかな","nu":"色や記憶、描写が生き生きとして印象に残る様子を表す語。","ph":"a vivid memory","phm":"鮮明な記憶","ex":"I still have a vivid memory of my first soccer game.","exm":"私は初めてのサッカーの試合について今も鮮明な記憶がある。","us":"色彩だけでなく、記憶や描写、想像力(imagination)の鮮明さを表すときにも使える。","tip":"viv-は「生きる」という意味を持ち（surviveと同系）、生き生きとした様子をイメージすると覚えやすい。"},{"w":"actually","pos":"副","m":"実は；実際に","nu":"予想や一般論とは異なる事実を示したり、話の内容を訂正・強調したりするときに使う語。","ph":"actually, I disagree","phm":"実は、私は反対だ","ex":"I actually enjoyed the boring lecture we had yesterday.","exm":"私は実は昨日受けた退屈な講義を楽しんだ。","us":"文頭にも文中にも置け、会話では相手の予想を軽く訂正するときによく使われる。currently（現在）と混同しないよう注意。","tip":"形容詞actual（実際の）の副詞形で、「実際のところは」という訂正・驚きのニュアンスを添える語。"},{"w":"besides","pos":"副","m":"その上；さらに","nu":"すでに述べた理由に別の理由を追加し、話を補強するときに使う語。","ph":"besides, it's too late","phm":"それに、もう遅すぎる","ex":"I don't want to go; besides, I have no money.","exm":"行きたくない。それに、お金もない。","us":"副詞として文頭に置きコンマで区切ることが多い。前置詞のbesides（〜に加えて）との用法の違いに注意。","tip":"besideは「〜のそばに」、besidesは「その上に」と語尾のsの有無で意味が変わる点を区別して覚える。"},{"w":"certainly","pos":"副","m":"確かに；必ず","nu":"話し手が高い確信を持って強く断言する気持ちを表す語。","ph":"certainly not true","phm":"確かに真実ではない","ex":"This test will certainly be difficult for everyone.","exm":"このテストはきっと誰にとっても難しいだろう。","us":"依頼への返事で\"Certainly.\"と使うと「もちろんです」という丁寧な承諾になる。","tip":"形容詞certain（確実な）の副詞形で、話し手の確信の強さをそのまま表すと覚える。"}],"p4":[{"w":"abandon","pos":"動","m":"見捨てる；放棄する","nu":"一度始めた物事や場所を、途中で完全に捨て去るイメージの語。","ph":"abandon the idea","phm":"その考えを捨てる","ex":"The team had to abandon the plan due to heavy rain.","exm":"そのチームは大雨のため計画を中止せざるを得なかった。","us":"他動詞で目的語を直接取る。give upよりもフォーマルで、後戻りしない放棄を表すことが多い。","tip":"a-(離れて)+bandon(支配下に置く)が語源とされ、「支配から離す→見捨てる」と覚える。"},{"w":"absorb","pos":"動","m":"吸収する；夢中にさせる","nu":"液体や光、知識などを内部に取り込み一体化させるイメージの動詞。","ph":"absorb information","phm":"情報を吸収する","ex":"A sponge can absorb a large amount of water quickly.","exm":"スポンジは大量の水を素早く吸収することができる。","us":"他動詞。be absorbed in ~で「~に夢中である」という受け身表現も頻出。","tip":"ab-(~から)+sorb(吸い込む)が語源。sorbはラテン語の「吸う」に由来する。"},{"w":"claim","pos":"動","m":"主張する；要求する","nu":"根拠の真偽はさておき、自分の権利や正しさを強く言い張る動詞。","ph":"claim compensation","phm":"補償を要求する","ex":"Many students claim that the new rule is unfair.","exm":"多くの生徒がその新しい規則は不公平だと主張している。","us":"claim that節、claim to doの形で使われることが多く、しばしば疑わしいというニュアンスを含む。","tip":"名詞でも「主張」「請求」の意味で使われ、insurance claim(保険金請求)などが代表例。"},{"w":"combine","pos":"動","m":"結合する；組み合わせる","nu":"別々の物や要素を一つにまとめ、新しい全体を作る動詞。","ph":"combine A with B","phm":"AとBを組み合わせる","ex":"You can combine the two clubs to save on membership fees.","exm":"会費を節約するためにその二つの部活を統合することができる。","us":"combine A with Bの形が基本。名詞combinationも合わせて覚えたい。","tip":"com-(共に)+bine(二つずつ)が語源で、「二つを一緒にする」イメージ。"},{"w":"consist","pos":"動","m":"成る；構成される","nu":"全体がどんな要素から出来ているかを説明する、自動詞的な語。","ph":"consist of","phm":"～から成る","ex":"The exam will consist of three parts and one essay.","exm":"その試験は三つのパートと小論文一つから成る予定だ。","us":"必ずconsist ofの形を取り、受け身にはしない自動詞。","tip":"con-(共に)+sist(立つ)が語源で、「複数の要素が共に立って全体を作る」と覚える。"},{"w":"deny","pos":"動","m":"否定する；拒む","nu":"事実や要求をはっきりと「そうではない」と言い切る動詞。","ph":"deny the rumor","phm":"そのうわさを否定する","ex":"He will surely deny that he broke the window.","exm":"彼はきっとその窓を割ったことを否定するだろう。","us":"deny doingの形を取り、deny to doとはしない点に注意。","tip":"対義語はadmit(認める)。名詞形denialとセットで覚えると定着しやすい。"},{"w":"determine","pos":"動","m":"決定する；突き止める","nu":"詳しい調査や検討を経て、事実や方針を明確に定めるという動詞。","ph":"determine the cause","phm":"原因を突き止める","ex":"Doctors ran tests to determine the cause of his fever.","exm":"医師たちは彼の発熱の原因を突き止めるため検査を行った。","us":"be determined to do「~しようと決意している」という受け身的な形が特によく使われる。","tip":"de-(完全に)+termine(境界を定める)が語源で、「はっきり境界を引く→決定する」と覚える。"},{"w":"distinguish","pos":"動","m":"区別する；識別する","nu":"似ている二つ以上のものの違いを見分け、はっきり分ける動詞。","ph":"distinguish between A and B","phm":"AとBを区別する","ex":"It is hard to distinguish between the twins at first.","exm":"最初はその双子を区別するのが難しい。","us":"distinguish A from Bまたはdistinguish between A and Bの形を取る。","tip":"di-(離れて)+stinguish(印をつける)が語源で、「別々に印をつけて分ける」イメージ。"},{"w":"engage","pos":"動","m":"従事させる；引き込む","nu":"人の注意や興味を引きつけ、活動に積極的に関わらせる動詞。","ph":"engage in volunteer work","phm":"ボランティア活動に従事する","ex":"Students should engage in class discussions more actively.","exm":"生徒たちはもっと積極的にクラス討論に参加すべきだ。","us":"engage in ~「~に従事する」、be engaged in ~「~に携わっている」の形が頻出。","tip":"engagement(婚約、関与)という名詞も同語源で、「深く関わり結びつく」イメージを共有する。"},{"w":"imply","pos":"動","m":"暗示する；ほのめかす","nu":"はっきり言わずに、内容から間接的に意味を伝える動詞。","ph":"imply that","phm":"～ということを暗示する","ex":"Her silence seemed to imply that she disagreed with us.","exm":"彼女の沈黙は私たちに反対していることを暗示しているようだった。","us":"imply that節の形が基本。infer(推論する、聞き手側の動作)との混同に注意。","tip":"im-(中に)+ply(折り込む)が語源で、「意味を折り込んで隠す」イメージ。"},{"w":"insist","pos":"動","m":"主張する；言い張る","nu":"反対や疑いにもかかわらず、自分の意見や要求を強く押し通す動詞。","ph":"insist on doing","phm":"～することを主張する","ex":"My mother will insist that I wear a jacket today.","exm":"母はきっと私に今日ジャケットを着るよう言い張るだろう。","us":"insist on doing、またはinsist that S (should) doの形を取る自動詞。","tip":"in-(上に)+sist(立つ)が語源で、「自分の立場の上に立ち続ける」イメージ。"},{"w":"neglect","pos":"動","m":"怠る；無視する","nu":"するべき世話や義務にあえて注意を払わず、放っておく動詞。","ph":"neglect one's duty","phm":"義務を怠る","ex":"Don't neglect your homework just because it's summer vacation.","exm":"夏休みだからといって宿題をおろそかにしてはいけない。","us":"neglect to do「~し忘れる」の形もあるが、neglect+名詞の形がより一般的。","tip":"neg-(否定)+lect(選ぶ、集める)が語源で、「選んで気にかけない→放置する」と覚える。"},{"w":"refer","pos":"動","m":"言及する；参照する","nu":"話や視線を特定の対象に向ける、幅広い場面で使う動詞。","ph":"refer to a dictionary","phm":"辞書を参照する","ex":"Please refer to the textbook if you have any questions.","exm":"質問があれば教科書を参照してください。","us":"必ずrefer toの形で使う自動詞。名詞reference(参照、言及)も頻出。","tip":"re-(再び)+fer(運ぶ)が語源で、「情報を運び戻す→参照する」イメージ。"},{"w":"reflect","pos":"動","m":"反映する；反射する","nu":"光や音を跳ね返すことと、考えを鏡のように映し出すことの両方を表す動詞。","ph":"reflect one's opinion","phm":"意見を反映する","ex":"These lakes always reflect the mountains and the clear sky.","exm":"これらの湖はいつも山々と澄んだ空を映し出す。","us":"reflect on ~で「~についてじっくり考える」という自動詞用法もある。","tip":"re-(後ろへ)+flect(曲げる)が語源で、「光を跳ね返す」から「考えを映す」へ意味が広がった。"},{"w":"regard","pos":"動","m":"みなす；尊重する","nu":"対象を特定の立場や評価の観点から見て、そのように捉えるという動詞。","ph":"regard A as B","phm":"AをBとみなす","ex":"Many students regard him as the best teacher in school.","exm":"多くの生徒が彼を学校で一番の先生だとみなしている。","us":"regard A as Bの形で使い、asを省略しない点がconsiderとの違い。","tip":"名詞regard(敬意、点)もあり、with regard to ~「~に関して」という熟語も重要。"},{"w":"relate","pos":"動","m":"関連づける；共感する","nu":"二つの事柄の間にあるつながりを示したり、感情的に共感したりする動詞。","ph":"relate to each other","phm":"互いに関連している","ex":"Many teenagers relate to the characters in this novel.","exm":"多くの十代の若者はこの小説の登場人物に共感している。","us":"relate A to Bの形と、relate to ~「~と関連する／~に共感する」の自動詞用法がある。","tip":"名詞relationやrelationshipと合わせて覚え、「つながりを作る」中心イメージを持つ。"},{"w":"represent","pos":"動","m":"代表する；表す","nu":"一部が全体を、または記号が実体を代わりに示す動詞。","ph":"represent the school","phm":"学校を代表する","ex":"This graph will represent our club's growth over five years.","exm":"このグラフは五年間の私たちの部の成長を表す予定だ。","us":"進行形にしにくい状態動詞的な使い方が多く、represent A as Bの形も取る。","tip":"re-(再び)+present(提示する)が語源で、「再び目の前に示す→代表する」と覚える。"},{"w":"vary","pos":"動","m":"異なる；変化する","nu":"同じ種類の中で、量や程度が場合によって上下する様子を表す動詞。","ph":"vary from person to person","phm":"人によって異なる","ex":"Prices vary depending on the season and the weather.","exm":"価格は季節や天気によって変動する。","us":"自動詞として使うことが多く、vary from A to Bの形が頻出。形容詞variousと区別する。","tip":"名詞variety(多様性)、形容詞various(様々な)と語根varが共通する点を押さえる。"},{"w":"access","pos":"名","m":"接近；利用権","nu":"場所や情報、機会などに近づき利用できる状態を表す名詞。","ph":"have access to","phm":"～を利用できる","ex":"Every student should have access to a computer at school.","exm":"すべての生徒が学校でコンピューターを利用できるべきだ。","us":"不可算名詞で、have access to ~の形が最頻出。動詞accessも直接目的語を取り前置詞不要。","tip":"ac-(~へ)+cess(行く)が語源で、「~へ行く」から「利用できる」に意味が広がった。"},{"w":"agriculture","pos":"名","m":"農業","nu":"作物栽培や家畜飼育など、食料生産に関わる産業全般を指す語。","ph":"modern agriculture","phm":"近代農業","ex":"Many people in this village still depend on agriculture.","exm":"この村の多くの人々は今も農業に頼っている。","us":"不可算名詞として使う。agricultural(形容詞)との品詞違いに注意。","tip":"agri-(畑)+culture(耕作)が語源で、「畑を耕す文化」から農業の意味になった。"},{"w":"basis","pos":"名","m":"基礎；根拠","nu":"議論や制度、判断を支える土台となる考えや事実を指す語。","ph":"on a regular basis","phm":"定期的に","ex":"Test scores should not be the only basis for grading.","exm":"テストの点数だけが成績評価の唯一の根拠であるべきではない。","us":"複数形はbasesになる点に注意。on a ~ basisという熟語表現が頻出。","tip":"動詞base(基づかせる)、形容詞basic(基本的な)と語根が共通する。"},{"w":"boundary","pos":"名","m":"境界；限界","nu":"地理的な境目だけでなく、規則や許容範囲の限界も指せる語。","ph":"cross the boundary","phm":"境界を越える","ex":"A narrow river forms the boundary between the two towns.","exm":"狭い川がその二つの町の境界を作っている。","us":"可算名詞で、boundary between A and Bの形をよく使う。","tip":"bound(境界、限界)に-aryがついた形で、set boundaries(限度を設ける)という表現も覚えておきたい。"},{"w":"civilization","pos":"名","m":"文明","nu":"高度な社会組織や文化、技術を持つ人間社会のまとまりを指す語。","ph":"ancient civilization","phm":"古代文明","ex":"The ancient civilization along this river shaped the whole region.","exm":"この川沿いの古代文明が地域全体の形成に影響を与えた。","us":"不可算名詞として使われることが多い。civilize(文明化する)という動詞形も存在する。","tip":"civil-(市民の)+ization(~化)が語源で、「市民社会を作ること」というイメージ。"},{"w":"conflict","pos":"名","m":"対立；紛争","nu":"互いの意見や利害が真っ向からぶつかり合う、激しい対立の状態を指す語。","ph":"conflict of interest","phm":"利害の対立","ex":"A conflict between the two teams delayed the whole match.","exm":"両チーム間の対立が試合全体を遅らせた。","us":"可算・不可算どちらの用法もある。動詞としても使えるが、その場合はアクセントが後ろに移る。","tip":"con-(共に)+flict(打つ)が語源で、「互いにぶつかり合う」イメージを持つ。"},{"w":"criterion","pos":"名","m":"基準","nu":"物事を判断・評価するときに用いる、公式で客観的な尺度を指す語。","ph":"meet the criterion","phm":"基準を満たす","ex":"Attendance is one important criterion for the scholarship award.","exm":"出席は奨学金授与のための重要な基準の一つだ。","us":"複数形はcriteriaになり、こちらの方が日常でもよく使われる点に注意。","tip":"ギリシャ語で「判断」を意味する語が由来。複数形criteriaと単数形criterionの区別が入試でも狙われる。"},{"w":"exception","pos":"名","m":"例外","nu":"一般的な規則やパターンに当てはまらない、特別な事例を指す語。","ph":"make an exception","phm":"例外を認める","ex":"The teacher made an exception and accepted the late report.","exm":"先生は例外を認め、その遅れたレポートを受け取った。","us":"with the exception of ~「~を除いて」という熟語も頻出。動詞exceptと合わせて覚えたい。","tip":"ex-(外に)+ception(取ること)が語源で、「取り出して外に置く→例外」とイメージする。"},{"w":"heritage","pos":"名","m":"遺産","nu":"前の世代から受け継がれる文化や伝統、歴史的建造物を指す語。","ph":"cultural heritage","phm":"文化遺産","ex":"This old shrine represents an important part of local heritage.","exm":"この古い神社は地域の遺産の重要な一部を担っている。","us":"不可算名詞として使うことが多く、heritage siteという複合語も頻出。","tip":"heir(相続人)と語根を共有し、「受け継がれるもの」という中心イメージを持つ。"},{"w":"instinct","pos":"名","m":"本能","nu":"学習を経ずに生まれつき備わっている、反射的な行動の傾向を指す語。","ph":"by instinct","phm":"本能で","ex":"The bird knew how to build a nest by instinct.","exm":"その鳥は本能によって巣の作り方を知っていた。","us":"act on instinct、instinct for ~など前置詞との組み合わせが多い。形容詞instinctiveも重要。","tip":"in-(中に)+stinct(刺す、突き動かす)が語源で、「内から突き動かすもの」とイメージする。"},{"w":"layer","pos":"名","m":"層","nu":"積み重なったものの一段一段を指し、比喩的にも使える語。","ph":"a layer of snow","phm":"雪の層","ex":"A thin layer of dust covered the old bookshelf.","exm":"薄いほこりの層がその古い本棚を覆っていた。","us":"可算名詞。動詞としてlayer A over B「AをBの上に重ねる」という使い方もある。","tip":"lay(置く)から派生した語で、「置き重ねられたもの」というイメージで覚える。"},{"w":"literature","pos":"名","m":"文学","nu":"小説や詩など、文字で書かれた芸術作品全体を指す語。","ph":"English literature","phm":"英文学","ex":"She plans to study literature at a university abroad.","exm":"彼女は海外の大学で文学を専攻するつもりだ。","us":"不可算名詞。「文献」「資料」の意味でも使われ、この場合も不可算のまま。","tip":"letter(文字)と同じ語根を持ち、「文字で書かれたもの」という中心イメージを持つ。"},{"w":"means","pos":"名","m":"手段；方法","nu":"ある目的を達成するために実際に用いる、具体的な方法や手立てを指す語。","ph":"by means of","phm":"～によって","ex":"Email is now a common means of daily communication.","exm":"電子メールは今や日常的なコミュニケーションの一般的な手段だ。","us":"単数・複数同形で、a meansともmeansともいう。by all means「ぜひどうぞ」という熟語も頻出。","tip":"動詞mean(意味する)と混同しやすいが、名詞では「手段」という別の意味になる点に注意。"},{"w":"organ","pos":"名","m":"器官","nu":"心臓や肺のように、体内で特定の働きを持つ部分を指す語。","ph":"donate an organ","phm":"臓器を提供する","ex":"The heart is an organ that pumps blood around the body.","exm":"心臓は体中に血液を送り出す器官だ。","us":"可算名詞。楽器の「オルガン」も同じ綴りだが文脈で判断する。","tip":"organization(組織)と同語源で、「全体の中で特定の役割を担う部分」というイメージを共有する。"},{"w":"origin","pos":"名","m":"起源；由来","nu":"物事や人が始まった、最初の出所や根っこの部分を指す語。","ph":"the origin of a word","phm":"単語の起源","ex":"No one knows the exact origin of this old legend.","exm":"この古い伝説の正確な起源を誰も知らない。","us":"可算名詞で、origin ofの形が基本。形容詞originalと合わせて覚える。","tip":"origin(起源)からoriginal(独創的な、元の)が派生していることを意識すると覚えやすい。"},{"w":"process","pos":"名","m":"過程；工程","nu":"何かの結果に至るまでの一連の段階や手順の流れ全体を指す語。","ph":"in the process of","phm":"～の過程で","ex":"Learning a language is a slow and steady process.","exm":"言語を学ぶことはゆっくりとした着実な過程だ。","us":"可算名詞。動詞processは「~を処理する」の意味で使われる。","tip":"pro-(前へ)+cess(進む)が語源で、「前に進んでいく段階」というイメージを持つ。"},{"w":"property","pos":"名","m":"財産；特性","nu":"所有物としての財産と、物が持つ性質の両方を指せる語。","ph":"private property","phm":"私有財産","ex":"This land is private property, so please do not enter.","exm":"この土地は私有財産なので入らないでください。","us":"「財産」の意味では不可算、「特性」の意味では可算になることが多い。","tip":"proper(固有の)と語根が共通し、「その人・物に固有のもの」というイメージを持つ。"},{"w":"psychology","pos":"名","m":"心理学；心理","nu":"人の心の働きや行動の仕組みを研究する学問、またその心理状態自体を指す語。","ph":"study psychology","phm":"心理学を学ぶ","ex":"My brother decided to study psychology at university next year.","exm":"兄は来年大学で心理学を学ぶことに決めた。","us":"不可算名詞。「心理学者」はpsychologist、形容詞はpsychologicalとなる。","tip":"psycho-(心、精神)+logy(学問)が語源で、「心の学問」という構成を覚えておく。"},{"w":"ratio","pos":"名","m":"比率；割合","nu":"二つ以上の数量の間の相対的な大きさの関係を示す語。","ph":"the ratio of A to B","phm":"AとBの比率","ex":"The ratio of boys to girls in this class is even.","exm":"このクラスの男子と女子の比率は同数だ。","us":"the ratio of A to Bの形が基本。数学や統計の文脈で頻出する。","tip":"ラテン語で「計算、理由」を意味する語が由来。rate(割合)と語根が近く関連づけて覚えられる。"},{"w":"revolution","pos":"名","m":"革命；大変革","nu":"社会や技術などが根本から大きく変わる出来事を指す語。","ph":"industrial revolution","phm":"産業革命","ex":"The internet caused a revolution in how we communicate.","exm":"インターネットは私たちのコミュニケーション方法に革命をもたらした。","us":"可算名詞。「回転、公転」という意味もあり、文脈によって使い分ける。","tip":"revolve(回転する)と同語源で、「社会がぐるりと入れ替わる」イメージで覚える。"},{"w":"scale","pos":"名","m":"規模；目盛り","nu":"物事の大きさの度合いや、測定に使う目盛りを指す語。","ph":"on a large scale","phm":"大規模に","ex":"The festival grew rapidly and is now held on a large scale.","exm":"その祭りは急速に成長し、今では大規模に開催されている。","us":"on a ~ scaleで「~な規模で」という熟語が頻出。魚の「うろこ」の意味もある。","tip":"「はしご、階段」を意味するラテン語が由来とされ、段階的に測る目盛りのイメージにつながる。"},{"w":"scheme","pos":"名","m":"計画；体系","nu":"複数の要素を組み合わせた、やや込み入った計画や制度を指す語。","ph":"a pension scheme","phm":"年金制度","ex":"The school introduced a new scheme to reduce plastic waste.","exm":"その学校はプラスチックごみを減らす新しい制度を導入した。","us":"イギリス英語で「制度、計画」の意味で使われることが多く、悪だくみの意味を持つ場合もある。","tip":"color scheme(配色)のように「複数要素の組み合わせ」という中心イメージを持つ。"},{"w":"sequence","pos":"名","m":"順序；連続；一連のもの","nu":"出来事や物事が一定の順番で並んでいる状態を指す語で、流れの中の並びに焦点がある。","ph":"in sequence","phm":"順番に","ex":"The teacher asked students to put the events in sequence.","exm":"先生は生徒たちに出来事を順番に並べるよう頼んだ。","us":"「the sequence of events」のように名詞＋ofの形でよく使われる。動詞sequenceは「順序立てる」の意味。","tip":"sequ-（続く、従う）+ -ence（〜すること）が語源で「あとに続くもの」というイメージ。sequel（続編）と語源が近い。"},{"w":"statistics","pos":"名","m":"統計；統計学","nu":"数値データを集めて分析したものを指し、複数形で「統計データ」、単数扱いで「統計学」を表す。","ph":"according to statistics","phm":"統計によると","ex":"According to statistics, fewer students choose science subjects now.","exm":"統計によると、理系科目を選ぶ生徒は今では減っている。","us":"学問分野を指すときは単数扱い、データの意味では複数扱いになる点に注意する。","tip":"state（国家）が語源で、元は国家の情報整理に由来する。statistic（単数形）は「統計値1つ」を指す。"},{"w":"status","pos":"名","m":"地位；状態；身分","nu":"社会的な立場や、物事が今どういう状態にあるかを表すフォーマルな語。","ph":"social status","phm":"社会的地位","ex":"Her status in the club changed after she became captain.","exm":"キャプテンになってから彼女の部内での立場は変わった。","us":"「status of ~」やmarital status（婚姻状況）のように名詞を修飾する用法も多い。","tip":"stand（立つ）と同語源で、「立っている状態」から「地位・状況」の意味に発展した。"},{"w":"technique","pos":"名","m":"技術；技法；テクニック","nu":"ある目的を達成するための具体的なやり方・方法を指し、練習で身につく技能に使う。","ph":"learn a new technique","phm":"新しい技術を学ぶ","ex":"The coach showed us a new technique for shooting free throws.","exm":"コーチはフリースローの新しい技術を私たちに見せた。","us":"skill（技能全般）より具体的なやり方・手順を指すことが多く、technique of/for ~の形で使う。","tip":"フランス語由来でtechnical（技術的な）と同語源。「テク」というカタカナのイメージそのまま使える。"},{"w":"tendency","pos":"名","m":"傾向；性癖","nu":"人や物事が自然にある方向へ向かいがちな性質を表し、have a tendency to doの形が定番。","ph":"have a tendency to","phm":"〜する傾向がある","ex":"He has a tendency to forget his homework on Fridays.","exm":"彼は金曜日に宿題を忘れる傾向がある。","us":"後ろに不定詞(to do)を伴って「〜しがちだ」という意味を作ることが多い。","tip":"tend（〜する傾向がある）の名詞形。trend（流行・動向）と混同しないよう注意。"},{"w":"tissue","pos":"名","m":"組織；ティッシュペーパー","nu":"生物学では細胞が集まった体の組織を指し、日常語では紙のティッシュも意味する。","ph":"muscle tissue","phm":"筋組織","ex":"In biology class, we looked at plant tissue under a microscope.","exm":"生物の授業で顕微鏡で植物の組織を観察した。","us":"理科の文脈ではbody tissue、日常会話ではa box of tissuesのように使われる。","tip":"「体を織りなすもの」というイメージで覚えると生物学的な意味を思い出しやすい。"},{"w":"chemical","pos":"形","m":"化学の；化学的な","nu":"化学反応や物質そのものに関わることを表し、理科の授業でよく登場する基本語。","ph":"chemical reaction","phm":"化学反応","ex":"We watched a chemical reaction happen in the science lab today.","exm":"今日、理科室で化学反応が起こるのを見た。","us":"chemical + 名詞の形で使う限定用法が中心で、名詞chemistry（化学）とあわせて覚える。","tip":"chemistry（化学）の形容詞形。「ケミカル」というカタカナ語からも意味を連想しやすい。"},{"w":"conscious","pos":"形","m":"意識している；気づいている","nu":"自分の状態や周囲の事実にはっきり気づいていることを表す形容詞。","ph":"be conscious of","phm":"〜を意識している","ex":"She became conscious of her accent while studying abroad.","exm":"彼女は留学中に自分の訛りを意識するようになった。","us":"be conscious of ~ / be conscious that ~の形で使うことが多い。名詞形はconsciousness。","tip":"対義語はunconscious（無意識の）。con-（共に）+ scire（知る）が語源で「共に知っている」から。"},{"w":"constant","pos":"形","m":"絶え間ない；一定の","nu":"変化せず同じ状態が続くこと、または休みなく繰り返されることを表す。","ph":"constant pressure","phm":"絶え間ないプレッシャー","ex":"Students today face constant pressure to check their phones.","exm":"今の生徒はスマホを確認し続けるプレッシャーに絶えず晒されている。","us":"数値や状態が変わらないことにも、行為が繰り返されることにも使える形容詞。","tip":"名詞のconstant（定数）も理科・数学で頻出。consistent（一貫した）と形が似ているので注意。"},{"w":"current","pos":"形","m":"現在の；今の","nu":"今まさに起きている、最新の状態であることを表す形容詞で、名詞を直接修飾する。","ph":"current situation","phm":"現在の状況","ex":"Let's discuss the current situation of climate change in class.","exm":"授業で気候変動の現在の状況について話し合おう。","us":"current + 名詞の形で「現在の〜」を表し、名詞の前に置く限定用法のみで使う。","tip":"currency（通貨）と同語源で「今流れているもの」というイメージを持つと覚えやすい。"},{"w":"diverse","pos":"形","m":"多様な；様々な","nu":"種類や性質が大きく異なるものが集まっている様子を表す。","ph":"diverse background","phm":"多様な背景","ex":"Our class has students from a diverse range of countries.","exm":"私たちのクラスには多様な国々から来た生徒がいる。","us":"a diverse range of ~の形でよく使われ、名詞diversity（多様性）とセットで覚える。","tip":"di-（離れて）+ vertere（向く）が語源で「別々の方向を向く」イメージ。variety, variousと関連づけて覚える。"},{"w":"initial","pos":"形","m":"最初の；初期の","nu":"物事が始まったばかりの段階であることを表す形容詞で、名詞の前に置いて使う。","ph":"initial reaction","phm":"最初の反応","ex":"My initial reaction to the news was pure surprise.","exm":"そのニュースへの私の最初の反応は純粋な驚きだった。","us":"initial + 名詞の形で使われることが多く、動詞initiate（開始する）とあわせて覚えると効率的。","tip":"語頭のinit-はinitiate, initiativeと共通し「始まり」を意味する。"},{"w":"mere","pos":"形","m":"単なる；ほんの","nu":"それ以上でも以下でもない、取るに足らない程度であることを強調する形容詞。","ph":"a mere coincidence","phm":"単なる偶然","ex":"It was a mere coincidence that we chose the same book.","exm":"私たちが同じ本を選んだのは単なる偶然だった。","us":"名詞の前に置いて強調する用法が中心で、名詞の後には基本的に置かない。","tip":"副詞merely（単に）はこの語に-lyを付けた形。only, justと近いニュアンスだが、より書き言葉的。"},{"w":"moral","pos":"形","m":"道徳的な；倫理的な","nu":"善悪の判断基準に関わる様子を表す形容詞で、行動や責任について使われる。","ph":"moral responsibility","phm":"道徳的責任","ex":"The teacher talked about our moral responsibility to help others.","exm":"先生は他人を助ける道徳的責任について話した。","us":"名詞moralsは「道徳観」を意味し、発音の似たmorale（士気）と混同しないよう注意する。","tip":"対義語はimmoral（不道徳な）。moral of the story（物語の教訓）という表現もあわせて覚える。"},{"w":"previous","pos":"形","m":"以前の；前の","nu":"今より時間的に前の出来事や状態を指す、客観的で書き言葉的な語。","ph":"previous experience","phm":"以前の経験","ex":"Do you have any previous experience working part-time jobs?","exm":"アルバイトをした以前の経験はありますか。","us":"previous to ~ / previous yearのように名詞を修飾し、副詞previously（以前に）もあわせて覚える。","tip":"pre-（前に）+ via（道）が語源で「前を行く」イメージ。beforeより硬い響きを持つ。"},{"w":"profound","pos":"形","m":"深い；深遠な","nu":"感情や影響、思想などが表面的でなく非常に深いことを強調する語。","ph":"profound impact","phm":"深い影響","ex":"The book had a profound impact on how I see the world.","exm":"その本は私の世界の見方に深い影響を与えた。","us":"物理的な深さではなく、影響・意味・感情の深さに使うのが基本。","tip":"pro-（前へ）+ fundus（底）が語源で「底まで届くほど深い」イメージ。deepより格式高い語。"},{"w":"stable","pos":"形","m":"安定した","nu":"変化や崩壊の心配がなく、しっかりと落ち着いている状態を表す。","ph":"stable relationship","phm":"安定した関係","ex":"It's important to have a stable relationship with your family.","exm":"家族と安定した関係を持つことは大切だ。","us":"名詞stability（安定性）、対義語unstable（不安定な）とあわせて覚えると便利。","tip":"stand（立つ）と同語源で「しっかり立っている」イメージから安定を表す。"},{"w":"subtle","pos":"形","m":"微妙な；かすかな","nu":"すぐには気づきにくいほど繊細で、はっきりしない違いや変化を表す語。","ph":"subtle difference","phm":"微妙な違い","ex":"There is a subtle difference between these two English words.","exm":"この二つの英単語には微妙な違いがある。","us":"つづりのbは発音しない（サトル）ので発音に注意する。obviousの対義的なニュアンスで使われる。","tip":"「obvious（明白な）の反対」として覚えると使い分けやすい。"},{"w":"temporary","pos":"形","m":"一時的な；仮の","nu":"ずっとは続かず、限られた期間だけ続くことを表す語で、permanentの対義語。","ph":"temporary solution","phm":"一時的な解決策","ex":"Skipping breakfast is only a temporary solution to being late.","exm":"朝食を抜くのは遅刻への一時的な解決策にすぎない。","us":"対義語permanent（永続的な）とセットで覚え、副詞temporarily（一時的に）も頻出。","tip":"temp-（時間）が語源で、temp（派遣社員）という略語も同じ語源から来ている。"},{"w":"vague","pos":"形","m":"曖昧な；漠然とした","nu":"はっきりせず、意味や内容がぼんやりしていて理解しにくい様子を表す。","ph":"vague answer","phm":"曖昧な答え","ex":"The teacher gave a vague answer about the exam schedule.","exm":"先生は試験の日程について曖昧な答えをした。","us":"vague about ~の形で「〜について曖昧だ」を表す。ambiguous（複数の意味に取れる曖昧さ）とは少しニュアンスが違う。","tip":"フランス語由来。「ぼやけた」イメージで、clear（明確な）の対義語として覚える。"},{"w":"vast","pos":"形","m":"広大な；膨大な","nu":"面積や規模、量が非常に大きいことを強調して表す語。","ph":"vast amount of","phm":"膨大な量の","ex":"The library has a vast amount of information on Japanese history.","exm":"その図書館には日本の歴史に関する膨大な情報がある。","us":"a vast amount/number of ~の形で数や量の多さを強調するときによく使う。","tip":"huge, enormousと似た意味だが、広がりのイメージが強く土地・海・量に使われやすい。"},{"w":"widespread","pos":"形","m":"広範囲の；普及した","nu":"ある事柄や現象が特定の場所だけでなく広い範囲に及んでいる様子を表す。","ph":"widespread use","phm":"広範な使用、普及","ex":"Smartphones have gained widespread use among high school students.","exm":"スマートフォンは高校生の間で広く普及した。","us":"wide（広い）+ spread（広がる）の複合形容詞として覚えると意味が取りやすい。","tip":"widespread damage（広範囲の被害）のように、被害・意見・習慣など幅広い名詞と結びつく。"},{"w":"apparently","pos":"副","m":"どうやら；見たところ","nu":"確実ではないが見聞きした情報から推測すると、という意味で文全体を修飾する副詞。","ph":"apparently unaware","phm":"どうやら気づいていない","ex":"The festival was, apparently, canceled due to bad weather again.","exm":"文化祭は、どうやら悪天候のせいでまた中止になったらしい。","us":"文頭に置いて「伝聞・推測」を表すことが多く、確信の度合いは高くない点に注意。","tip":"appear（〜のように見える）の副詞形。obviously（明らかに）ほど確信度が高くない点で区別する。"},{"w":"furthermore","pos":"副","m":"さらに；その上","nu":"前の内容に情報を追加するときに使う、論理的でフォーマルな接続副詞。","ph":"furthermore, this suggests","phm":"さらに、これは〜を示唆する","ex":"The club needs new members; furthermore, it lacks a proper coach.","exm":"その部は新入部員が必要で、さらに、きちんとしたコーチも欠けている。","us":"文と文をつなぐ副詞で、通常文頭に置きカンマを伴う。エッセイやレポートで多用される。","tip":"moreoverとほぼ同義で言い換え可能。further（さらに）にmoreが付いた形と覚えると覚えやすい。"},{"w":"increasingly","pos":"副","m":"ますます；だんだん","nu":"ある状態や程度が時間とともに次第に強まっていく様子を表す副詞。","ph":"increasingly popular","phm":"ますます人気の","ex":"Online classes have become increasingly popular in recent years.","exm":"オンライン授業は近年ますます人気になってきている。","us":"increasingly + 形容詞/動詞の形で「ますます〜」という変化の度合いを強調する。","tip":"increase（増える）の副詞形。graduallyより「増加の一方通行」感が強い。"},{"w":"largely","pos":"副","m":"主に；大部分は","nu":"全体のかなりの割合を占める理由や程度を表す副詞。","ph":"largely due to","phm":"主に〜のせいで","ex":"Her success was largely due to hours of daily practice.","exm":"彼女の成功は主に毎日の長時間の練習によるものだった。","us":"largely due to ~ / largely because of ~の形で理由を説明するときによく使われる。","tip":"mainly, mostlyと近い意味。large（大きい）から「大部分を占める」という広がりのイメージ。"},{"w":"meanwhile","pos":"副","m":"その間に；一方で","nu":"同じ時間帯に別の場所で起きている出来事を対比して示す副詞。","ph":"meanwhile, back home","phm":"その一方で、家では","ex":"I was studying; meanwhile, my brother was watching TV.","exm":"私は勉強していた。その間、弟はテレビを見ていた。","us":"文頭やセミコロンの後に置き、二つの出来事を同時進行として対比するのが基本。","tip":"mean（中間の）+ while（間）が語源で「その中間の間に」というイメージ。"},{"w":"moreover","pos":"副","m":"その上；さらに","nu":"すでに述べた内容に加えて、さらに重要な情報を付け加えるときに使う副詞。","ph":"moreover, it means","phm":"その上、それは〜を意味する","ex":"She is talented; moreover, she practices harder than anyone else.","exm":"彼女は才能があり、その上、誰よりも熱心に練習する。","us":"furthermoreとほぼ同義で、文頭に置いて前文への追加情報を導く。","tip":"more + overが組み合わさった語で、「さらに加えて」というイメージで覚える。"},{"w":"scarcely","pos":"副","m":"ほとんど〜ない","nu":"数量や程度がごくわずかであることを表す否定的な意味合いの副詞。","ph":"scarcely believe","phm":"ほとんど信じられない","ex":"I could scarcely believe my eyes when I saw the results.","exm":"結果を見たとき、私はほとんど自分の目が信じられなかった。","us":"hardly, barelyとほぼ同義で、否定語なしで否定の意味を作る準否定語である点に注意。","tip":"scarce（乏しい）の副詞形。scarcely everで「めったに〜ない」という頻度表現も頻出。"},{"w":"seldom","pos":"副","m":"めったに〜ない","nu":"ある行動や出来事が起こる頻度が非常に低いことを表す準否定の頻度副詞。","ph":"seldom see","phm":"めったに見ない","ex":"We seldom see snow in this part of Japan.","exm":"日本のこの地域では雪をめったに見ない。","us":"一般動詞の前、be動詞の後に置く準否定語で、文頭に置くと倒置が起こる点に注意。","tip":"rarelyとほぼ同義。not oftenと言い換えられると覚えると意味を取りやすい。"},{"w":"thus","pos":"副","m":"このように；従って","nu":"前の内容を受けて結果や結論を導くときに使う、書き言葉的な副詞。","ph":"thus, it follows","phm":"従って、〜ということになる","ex":"She practiced every day; thus, her English greatly improved.","exm":"彼女は毎日練習した。従って、彼女の英語は大きく上達した。","us":"therefore, soと近い意味で、論理的な結論を導く際にレポートやエッセイでよく使われる。","tip":"soのフォーマルな言い換えと考えると使いやすい。thus far（これまでのところ）という表現もある。"},{"w":"beyond","pos":"前","m":"〜を超えて；〜の向こうに","nu":"場所・程度・範囲などが、ある基準や限界の先にあることを示す前置詞。","ph":"beyond expectations","phm":"期待を超えて","ex":"The concert was beyond our expectations in every way.","exm":"そのコンサートはあらゆる点で私たちの期待を超えていた。","us":"場所（beyond the mountain）だけでなく、程度・限界（beyond belief）にも幅広く使われる。","tip":"be-（〜のそばに、の意の接頭辞）+ yond（向こう）が語源で「向こう側」という空間イメージから抽象的な限界にも広がった。"},{"w":"accompany","pos":"動","m":"同行する；伴う","nu":"人につき添って一緒に行くことや、ある事柄に別の事柄が伴うことを表す。","ph":"accompany someone","phm":"人に同行する","ex":"My mother will accompany me to the hospital tomorrow.","exm":"明日、母が病院に私に同行してくれる。","us":"受け身形be accompanied by ~（〜を伴う）の形も頻出で、抽象的な名詞にも使える。","tip":"com-（共に）と関連する語で「一緒について行く」イメージを持つと覚えやすい。"},{"w":"admire","pos":"動","m":"感心する；尊敬する","nu":"人の能力や行動、美しさなどに強く心を打たれて称賛する気持ちを表す動詞。","ph":"admire someone for","phm":"〜の点で人を尊敬する","ex":"I really admire my coach for her patience with us.","exm":"私はコーチの私たちへの忍耐強さを本当に尊敬している。","us":"admire A for B（AをBの点で尊敬する）の形が定番で、他動詞なので前置詞なしで目的語を取る。","tip":"respect（敬意）より感情的な称賛のニュアンスが強い。admiration（賞賛）という名詞形も覚えておく。"},{"w":"afford","pos":"動","m":"〜する余裕がある","nu":"お金や時間などの面で、あることをしても問題ないだけの余裕があることを表す。","ph":"can afford to","phm":"〜する余裕がある","ex":"We can't afford to buy new uniforms this month.","exm":"今月は新しい制服を買う余裕がない。","us":"can/can'tと共に使うことが多く、afford to do / afford + 名詞の形を取る。","tip":"お金だけでなく時間の余裕にも使える点に注意。canとセットでcan affordという形で覚えると自然。"},{"w":"amaze","pos":"動","m":"〜を驚かせる","nu":"予想を超える出来事によって、人を強く驚かせ感心させることを表す動詞。","ph":"amaze the audience","phm":"観客を驚かせる","ex":"Her amazing violin skills never fail to amaze the whole audience.","exm":"彼女の見事なバイオリンの腕前は、いつも観客全員を驚かせる。","us":"他動詞で「人を驚かせる」の意味なので、人が驚くときはbe amazed at/byという受け身の形で使う。","tip":"amazing（形容詞、驚くべき）、amazement（名詞、驚き）とあわせて覚える。surpriseより驚きの度合いが強い。"},{"w":"annoy","pos":"動","m":"〜をいらだたせる","nu":"小さな不快なことが繰り返されて人をイライラさせることを表す動詞。","ph":"annoy someone","phm":"人をいらだたせる","ex":"Loud phone notifications during class always annoy the teacher a lot.","exm":"授業中の大きな通知音は、いつも先生をひどくいらだたせる。","us":"他動詞で、人がいらだつときはbe annoyed with(人)/at(物事)という受け身形で表す。","tip":"annoying（形容詞、うっとうしい）という形もセットで覚える。angerより弱い不快感を表す。"},{"w":"ban","pos":"動","m":"〜を禁止する","nu":"法律やルールによって公式に何かを行うことを禁止することを表す動詞。","ph":"ban someone from","phm":"人が〜するのを禁止する","ex":"The school decided to ban smartphones during class time.","exm":"学校は授業中のスマートフォンを禁止することを決めた。","us":"ban A from doing（Aが〜するのを禁止する）の形でよく使われ、受け身be banned fromも頻出。","tip":"forbid, prohibitと似た意味だが、banは公式なルールによる禁止によく使われる。"},{"w":"bear","pos":"動","m":"耐える；産む；持つ","nu":"重い負担や苦痛に耐えること、また生み出す・持ち続けることまで幅広く表す動詞。","ph":"can't bear","phm":"耐えられない","ex":"I can't bear to watch our team lose the final match.","exm":"私たちのチームが決勝で負けるのを見るのは耐えられない。","us":"can't bear to do / can't bear doingの形で「耐えられない」を表す不規則動詞（bear-bore-born(e)）。","tip":"「クマ」のbearと綴りが同じだが無関係。bear a child（子を産む）などの意味も持つ多義語。"},{"w":"blame","pos":"動","m":"〜のせいにする","nu":"悪い結果の原因を特定の人や物に求めて非難することを表す動詞。","ph":"blame someone for","phm":"〜のことで人を責める","ex":"Don't blame me for losing the game; it was a team effort.","exm":"試合に負けたことを私のせいにしないで。チーム全体の結果だから。","us":"blame A for B（BのことでAを責める）、またはblame B on A（BをAのせいにする）という2つの形を取る。","tip":"fault（名詞、責任・欠点）と関連づけて覚えると使い分けやすい。"},{"w":"bother","pos":"動","m":"悩ませる；わざわざ〜する","nu":"相手に軽い迷惑や手間をかける、または自分がわざわざ手間をかけるという意味合い。","ph":"bother to do something","phm":"わざわざ〜する","ex":"Don't bother me while I study for the exam tonight.","exm":"今夜試験勉強している間は邪魔しないで。","us":"「bother to do」で「わざわざ〜する」、否定文でよく使う。「bother about/with」で「〜を気にする」の意味になる。","tip":"don't bother 〜ingで「わざわざ〜しなくていい」という決まり文句を覚えると便利。"},{"w":"breathe","pos":"動","m":"呼吸する","nu":"息を吸ったり吐いたりする基本動作。名詞breathより動作そのものを表す。","ph":"breathe deeply","phm":"深呼吸する","ex":"The coach told us to breathe slowly before the race started.","exm":"コーチはレース前にゆっくり呼吸するよう言った。","us":"自動詞・他動詞どちらでも使える。名詞形breath（呼吸）とスペル・発音の違いに注意する。","tip":"名詞breath[breθ]と動詞breathe[briːð]で語尾の発音が変わる点で区別する。"},{"w":"charge","pos":"動","m":"請求する；充電する；非難する","nu":"代金を求める、電気を蓄える、責任を負わせるなど幅広い場面で使う多義語。","ph":"charge a fee","phm":"料金を請求する","ex":"The shop will charge extra if you return items late.","exm":"その店は商品を遅れて返すと追加料金を請求する。","us":"「charge A for B」でAにBの代金を請求する、「charge A with B」でAをBの罪で告発する形をとる。","tip":"名詞でも「料金」「充電」の意味を持ち、動詞の意味とつながっていると覚える。"},{"w":"confess","pos":"動","m":"告白する；白状する","nu":"隠していた罪や失敗、気持ちを正直に認めて話すこと。confessionは名詞形。","ph":"confess to a crime","phm":"罪を告白する","ex":"He decided to confess his mistake to the whole class.","exm":"彼はクラス全員に自分の間違いを告白することにした。","us":"「confess to doing」「confess that節」の形をよく使う。admitより重い罪や恥の告白に使われやすい。","tip":"con（共に）+ fess（話す）が語源で、隠さず全部話すイメージだと覚える。"},{"w":"conquer","pos":"動","m":"征服する；克服する","nu":"敵国や困難など大きな対象を力で打ち負かし支配下に置くイメージ。","ph":"conquer your fears","phm":"恐怖心を克服する","ex":"She worked hard every day to conquer her fear of speaking.","exm":"彼女はスピーチへの恐怖を克服するため毎日努力した。","us":"「conquer a country」のような物理的征服と「conquer fear/difficulty」のような比喩的克服の両方に使う。","tip":"名詞conquest（征服）とセットで覚える。overcomeより大掛かりな勝利のイメージ。"},{"w":"cure","pos":"動","m":"治す；治療する","nu":"病気や問題の原因そのものを取り除いて元通りにするイメージ。healより根本的な治療。","ph":"cure a disease","phm":"病気を治す","ex":"Doctors are trying to cure this rare disease completely.","exm":"医師たちはこの珍しい病気を完全に治そうとしている。","us":"「cure A of B」でAのB（病気）を治す形をとる。名詞としても「治療法」の意味で使われる。","tip":"healは傷が自然に治る意味も持つが、cureは医学的に病気を治す場合に使うと区別する。"},{"w":"defeat","pos":"動","m":"打ち負かす；破る","nu":"試合や戦いで相手に勝ち、負けさせるという結果に焦点を当てた語。","ph":"defeat the opponent","phm":"相手を打ち負かす","ex":"Our soccer team managed to defeat the rival school yesterday.","exm":"私たちのサッカー部は昨日ライバル校を打ち負かした。","us":"「be defeated by」で受け身にもよく使われる。名詞としても「敗北」の意味を持つ。","tip":"winは「勝利を得る」、defeatは「相手を負かす」と目的語の違いを意識すると区別しやすい。"},{"w":"disappoint","pos":"動","m":"失望させる","nu":"期待していたことが叶わず、相手をがっかりさせる気持ちを表す。","ph":"disappoint your parents","phm":"親をがっかりさせる","ex":"I don't want to disappoint my teammates in the final match.","exm":"決勝戦でチームメイトをがっかりさせたくない。","us":"感情動詞なので人が主語のとき受け身be disappointed（がっかりする）で使うことが多い。","tip":"形容詞disappointed（がっかりして）とdisappointing（がっかりさせるような）の使い分けが重要。"},{"w":"display","pos":"動","m":"展示する；示す","nu":"物や感情、能力などを人目につくように見せる、はっきり表すイメージ。","ph":"display artwork","phm":"作品を展示する","ex":"The students will display their science projects in the hall.","exm":"生徒たちは廊下に科学の作品を展示する予定だ。","us":"「display emotions/skills」のように感情や能力を表に出す意味でも使う。名詞としても同形で使われる。","tip":"showよりも意図的に、はっきりと見せるニュアンスが強い語だと覚える。"},{"w":"disturb","pos":"動","m":"邪魔する；乱す","nu":"静かな状態や集中を妨げて落ち着かなくさせること。人にも状況にも使う。","ph":"disturb someone's sleep","phm":"人の睡眠を妨げる","ex":"Please don't disturb your brother while he is studying.","exm":"勉強している弟の邪魔をしないでください。","us":"「Do not disturb」はホテルの札などでもおなじみの表現。名詞disturbance（妨害、騒動）も重要。","tip":"botherより公式・強い響きを持ち、静けさや秩序を乱すイメージが中心だと覚える。"},{"w":"donate","pos":"動","m":"寄付する","nu":"お金や物、血液などを見返りを求めず他人のために差し出すこと。","ph":"donate money to charity","phm":"慈善団体にお金を寄付する","ex":"Our class decided to donate old books to the local library.","exm":"私たちのクラスは古本を地元の図書館に寄付することにした。","us":"「donate A to B」の形が基本。名詞donation（寄付）とあわせて覚える。","tip":"giveより公的・善意の提供という響きが強く、募金活動などでよく使われる語。"},{"w":"elect","pos":"動","m":"選出する；選挙で選ぶ","nu":"投票によって代表者や役職者を正式に選ぶこと。chooseより制度的な選出。","ph":"elect a new president","phm":"新しい大統領を選出する","ex":"Students will elect a new leader for the student council.","exm":"生徒たちは生徒会の新しいリーダーを選出する。","us":"「elect A B/as B」でAをBに選ぶという形で使うことが多い。名詞election（選挙）も重要。","tip":"chooseは一般的な選択、electは投票による公式な選出という違いを意識する。"},{"w":"embarrass","pos":"動","m":"恥ずかしい思いをさせる","nu":"人前でのミスなどにより相手を気まずく、恥ずかしい気持ちにさせること。","ph":"embarrass yourself","phm":"自分に恥をかかせる","ex":"Falling asleep in class can really embarrass a student in front of friends.","exm":"授業中に眠ってしまうと友達の前で本当に恥をかくことがある。","us":"「be embarrassed」で「恥ずかしい思いをする」という受け身の形でよく使う。スペルのrr, ssに注意する。","tip":"形容詞embarrassing（恥ずかしくさせるような）とembarrassed（恥ずかしく感じて）を区別して覚える。"},{"w":"entertain","pos":"動","m":"楽しませる","nu":"話や芸、もてなしなどで人を楽しい気分にさせること。","ph":"entertain the audience","phm":"観客を楽しませる","ex":"The comedian tried hard to entertain the tired students after lunch.","exm":"そのコメディアンは昼食後の疲れた生徒たちを楽しませようとした。","us":"名詞entertainment（娯楽）、entertainer（芸能人）とセットで覚える重要語。","tip":"enter（間に）+ tain（保つ）というつくりで、人の注意を引きつけ楽しませ続けるイメージ。"},{"w":"explode","pos":"動","m":"爆発する","nu":"物理的に激しく破裂すること、また感情が急に爆発することにも使う。","ph":"explode with anger","phm":"怒りを爆発させる","ex":"The old firework might explode if we leave it near the fire.","exm":"古い花火は火の近くに置いておくと爆発するかもしれない。","us":"自動詞として使うことが多い。名詞explosion（爆発）、形容詞explosive（爆発性の）も覚えておく。","tip":"感情が爆発する比喩表現「explode with anger」もよく出るので合わせて覚える。"},{"w":"float","pos":"動","m":"浮かぶ","nu":"水面や空中で沈まず、ゆっくり漂うように存在すること。","ph":"float on the water","phm":"水面に浮かぶ","ex":"A small paper boat began to float down the quiet river.","exm":"小さな紙の船が静かな川を浮かびながら流れていった。","us":"自動詞で使うことが多く、sinkが対義語。「float on/in/down」など前置詞と共に使われる。","tip":"sink（沈む）と対で覚えると記憶に残りやすい。"},{"w":"flow","pos":"動","m":"流れる","nu":"液体や交通、時間などが途切れず一定方向に進んでいく様子。","ph":"flow into the sea","phm":"海に流れ込む","ex":"This small river seems to flow quietly through our peaceful town.","exm":"この小さな川は私たちの平和な町を静かに流れているようだ。","us":"自動詞。川以外にも「traffic flows」「conversation flows」のように比喩的にも使われる。","tip":"名詞flow（流れ）も同形で頻出、riverやtrafficと結びつけて覚える。"},{"w":"forbid","pos":"動","m":"禁じる","nu":"権威ある立場の人が何かをすることを強く禁止すること。banよりやや硬い語。","ph":"forbid smoking","phm":"喫煙を禁じる","ex":"Our school rules forbid students from using phones in class.","exm":"校則は生徒が授業中に携帯電話を使うことを禁じている。","us":"「forbid A to do」「forbid A from doing」の形をとる。過去形forbade、過去分詞forbiddenは不規則変化。","tip":"形容詞forbidden（禁止された）は標識などにもよく使われるので合わせて覚える。"},{"w":"forgive","pos":"動","m":"許す","nu":"相手の過ちや罪を責めるのをやめ、心の中で受け入れること。excuseより感情的な赦し。","ph":"forgive someone for something","phm":"人の〜を許す","ex":"It may take time, but she will finally forgive her friend for lying.","exm":"時間はかかるかもしれないが、彼女はついに嘘をついた友人を許すだろう。","us":"「forgive A for B」の形が基本。give（与える）と語根が同じで「赦しを与える」イメージ。","tip":"過去形forgave、過去分詞forgivenの不規則変化をgiveと同じパターンで覚えると楽。"},{"w":"guard","pos":"動","m":"守る；警備する","nu":"危険や攻撃から人や物を注意深く見張って守ること。protectより監視のニュアンスが強い。","ph":"guard the entrance","phm":"入り口を警備する","ex":"Two teachers guard the school gate every morning before class.","exm":"毎朝授業前に2人の先生が校門を警備している。","us":"名詞としても同形で「警備員」「守り」の意味を持つ。「guard against」で「〜を警戒する」という表現もある。","tip":"protectは危害から守る一般語、guardは見張って守る具体的な行為を表すと区別する。"},{"w":"hire","pos":"動","m":"雇う；賃借りする","nu":"人を仕事のために雇うこと、または一時的にお金を払って借りることを表す。","ph":"hire a part-time worker","phm":"アルバイトを雇う","ex":"The new cafe decided to hire three students for the summer.","exm":"新しいカフェは夏の間に3人の学生を雇うことにした。","us":"イギリス英語では物を「借りる」意味でもよく使うが、アメリカ英語では「雇う」意味が中心。","tip":"employよりカジュアルで、一時的な雇用や短期バイトによく使われる語だと覚える。"},{"w":"injure","pos":"動","m":"けがをさせる","nu":"事故やスポーツなどで体の一部を傷つけること。hurtより医学的・フォーマルな響き。","ph":"injure your knee","phm":"膝をけがする","ex":"He might injure his ankle badly if he keeps playing today.","exm":"今日このまま試合を続けたら、彼は足首をひどく怪我するかもしれない。","us":"「be injured」の受け身でよく使われる。名詞injury（けが）とあわせて頻出。","tip":"hurtは日常的で軽い痛みにも使うが、injureはより深刻なけがに使う傾向がある。"},{"w":"limit","pos":"動","m":"制限する","nu":"数量や範囲、程度などをある基準以上に増やさないよう抑えること。","ph":"limit screen time","phm":"画面を見る時間を制限する","ex":"Our teacher decided to limit homework during the busy exam week.","exm":"忙しい試験週間は、先生は宿題を制限することにした。","us":"「limit A to B」でAをBに制限する形をよく使う。名詞としても同形で「限界」の意味を持つ。","tip":"名詞limitation（限界、制約）と合わせて、restrict（制限する）とほぼ同義と覚える。"},{"w":"locate","pos":"動","m":"位置を突き止める；置く","nu":"物や場所の正確な位置を見つけ出す、または何かをある場所に設置すること。","ph":"locate the nearest station","phm":"最寄り駅の場所を探す","ex":"We used a map app to locate the new bookstore downtown.","exm":"私たちは地図アプリを使って街の新しい書店の場所を探した。","us":"「be located in/at」で「〜に位置している」という受け身の形が非常によく使われる。","tip":"名詞location（場所、位置）はよく使う語なので動詞形とセットで覚える。"},{"w":"obey","pos":"動","m":"従う","nu":"規則や命令、指示に逆らわずそのとおりに行動すること。","ph":"obey the rules","phm":"規則に従う","ex":"All players must obey the coach's instructions during practice.","exm":"すべての選手は練習中コーチの指示に従わなければならない。","us":"他動詞で目的語を直接とる（obey to ×）。対義語はdisobey（従わない、反抗する）。","tip":"followより「命令・規則に服従する」という強い意味を持つと覚える。"},{"w":"overlook","pos":"動","m":"見落とす；見渡す","nu":"気づかずに見過ごしてしまうこと、または高い場所から下を見渡すことの両方を表す。","ph":"overlook a mistake","phm":"間違いを見落とす","ex":"The teacher might overlook one answer while grading so many tests.","exm":"先生はこれほど多くのテストを採点していると、答えを一つ見落とすかもしれない。","us":"「見落とす」の意味では他動詞で使うことが多い。「部屋が海を見渡す」のような物理的な意味もある。","tip":"overは「上から」、lookは「見る」で、見下ろして全体を見る／逆に細部を見落とすという2つの意味につながる。"},{"w":"owe","pos":"動","m":"借りがある；恩がある","nu":"お金を返す義務がある、または誰かのおかげであると感じる気持ちを表す。","ph":"owe money to someone","phm":"人にお金を借りている","ex":"I still owe my brother some money from last month.","exm":"私は先月分のお金をまだ兄に借りている。","us":"「owe A B」または「owe B to A」の形で使う。「owe A an apology」で「Aに謝罪すべきだ」の意味にもなる。","tip":"感謝の気持ちを表す「owe A a lot」のような比喩的用法もよく出るので覚えておく。"},{"w":"praise","pos":"動","m":"ほめる","nu":"人の行いや能力を高く評価し、心を込めた言葉で称賛すること。","ph":"praise someone's effort","phm":"人の努力をほめる","ex":"The coach always tries to praise the team for trying hard.","exm":"コーチはいつも一生懸命がんばったチームをほめようとする。","us":"「praise A for B」の形でよく使う。名詞としても同形で「称賛」の意味を持つ。","tip":"対義語blame（責める）とセットで覚えると記憶に残りやすい。"},{"w":"pray","pos":"動","m":"祈る","nu":"神や何か大きな存在に願いを込めて心の中や声に出して願うこと。","ph":"pray for peace","phm":"平和を祈る","ex":"Many people gathered to pray for the injured students' recovery.","exm":"多くの人がけがをした生徒たちの回復を祈るために集まった。","us":"「pray for A」で「Aを願って祈る」、「pray that節」の形もよく使われる。","tip":"発音・綴りが似たprey（獲物、名詞）と混同しないよう注意する。"},{"w":"pronounce","pos":"動","m":"発音する","nu":"言葉や音を声に出して正しく言うこと。特に発音の正しさに焦点を当てる。","ph":"pronounce a word correctly","phm":"単語を正しく発音する","ex":"It is hard for me to pronounce this long English word.","exm":"この長い英単語を発音するのは私には難しい。","us":"名詞pronunciation（発音）はスペルが少し異なるので注意する。","tip":"pronounceの「ou」がpronunciationでは「u」に変わる綴りの違いを意識して覚える。"},{"w":"punish","pos":"動","m":"罰する","nu":"悪い行いをした人に対して罰を与えること。学校や法律の場面でよく使う。","ph":"punish students for cheating","phm":"カンニングをした生徒を罰する","ex":"The teacher decided not to punish the whole class today.","exm":"先生は今日クラス全員を罰しないことに決めた。","us":"「punish A for B」の形をとる。名詞punishment（罰）と対義語reward（報いる）を覚える。","tip":"rewardとの対比で覚えると、良い行い／悪い行いへの対応の違いが分かりやすい。"},{"w":"purchase","pos":"動","m":"購入する","nu":"buyのフォーマルな言い方で、特に高額な物や正式な取引に使われる。","ph":"purchase a ticket online","phm":"オンラインでチケットを購入する","ex":"Students can purchase lunch tickets at the school office.","exm":"生徒は学校の事務室で昼食チケットを購入できる。","us":"buyより書き言葉的・フォーマルな響きを持つ。名詞としても同形で「購入」の意味を持つ。","tip":"日常会話ではbuy、案内文や公式文書ではpurchaseが好まれると覚える。"},{"w":"react","pos":"動","m":"反応する","nu":"出来事や刺激に対して即座に行動や態度で応じること。","ph":"react to the news","phm":"そのニュースに反応する","ex":"How did your parents react when you got the good news?","exm":"良い知らせを聞いたとき、あなたの両親はどう反応しましたか。","us":"「react to A」の形で前置詞toを伴う。名詞reaction（反応）も頻出。","tip":"respondとほぼ同義だが、reactはより本能的・瞬間的な反応というニュアンスが強い。"},{"w":"recall","pos":"動","m":"思い出す","nu":"過去の記憶を意識的に呼び戻すこと。rememberより努力して思い出すニュアンスがある。","ph":"recall the details","phm":"詳細を思い出す","ex":"I can't quite recall where I left my school bag today.","exm":"今日どこにかばんを置いてきたのか、はっきり思い出せない。","us":"「recall doing」の形をとり、to不定詞は続けない。企業が製品を「回収する」意味でも使われる。","tip":"rememberは単に覚えている状態、recallは記憶を積極的に呼び起こす動作というイメージで区別する。"},{"w":"relieve","pos":"動","m":"和らげる；安心させる","nu":"痛みや不安、緊張などの負担を軽くして楽にすること。","ph":"relieve stress","phm":"ストレスを和らげる","ex":"Listening to music helps relieve stress after a long day.","exm":"長い一日の後、音楽を聴くとストレスが和らぐ。","us":"「be relieved to hear/that」で「〜と聞いて安心する」という感情表現でよく使われる。","tip":"形容詞relieved（安心して）と名詞relief（安心、緩和）をセットで覚えておく。"},{"w":"remind","pos":"動","m":"思い出させる","nu":"忘れそうなことを誰かに気づかせる、または何かを見て別のことを連想させること。","ph":"remind someone of something","phm":"人に何かを思い出させる","ex":"This old photo can always remind me of my elementary school days.","exm":"この古い写真はいつも私に小学生時代を思い出させてくれる。","us":"「remind A of B」「remind A to do」の2つの重要な形を区別して覚える。","tip":"rememberは「自分が思い出す」、remindは「人に思い出させる」という主語の違いを意識する。"},{"w":"repair","pos":"動","m":"修理する","nu":"壊れた物を元の状態に直すこと。fixよりやや硬く、専門的な修理に使われやすい。","ph":"repair a bicycle","phm":"自転車を修理する","ex":"My father spent all weekend trying to repair the old radio.","exm":"父は古いラジオを修理しようと週末をずっと費やした。","us":"名詞としても同形で「修理」の意味を持つ。「under repair」で「修理中」という表現も覚えておく。","tip":"fixは日常的でカジュアル、repairはやや技術的・フォーマルな響きを持つと区別する。"},{"w":"rescue","pos":"動","m":"救助する","nu":"危険な状況にある人や動物を助け出すこと。saveより緊急性の高い救出を表す。","ph":"rescue a cat from a tree","phm":"木から猫を救助する","ex":"Firefighters rushed to rescue people from the burning building.","exm":"消防士たちは燃えている建物から人々を救助するため急いだ。","us":"「rescue A from B」の形でよく使われる。名詞としても同形で「救助」の意味を持つ。","tip":"saveより緊急の危機的状況からの救出という具体的なイメージが強いと覚える。"},{"w":"reserve","pos":"動","m":"予約する；取っておく","nu":"席や部屋などを前もって確保すること、または将来のために取っておくこと。","ph":"reserve a table","phm":"テーブルを予約する","ex":"We need to reserve seats for the concert next Saturday.","exm":"来週土曜のコンサートの席を予約する必要がある。","us":"bookとほぼ同義でレストランやホテルの予約に使う。名詞reservation（予約）も頻出。","tip":"「取っておく」という基本イメージから、予約や保留の意味に広がったと考えると覚えやすい。"},{"w":"retire","pos":"動","m":"引退する；退職する","nu":"仕事や現役生活から身を引いて、休息の段階に入ること。","ph":"retire from work","phm":"仕事を引退する","ex":"My grandfather plans to retire from his job next spring.","exm":"祖父は来年の春に仕事を引退する予定だ。","us":"「retire from A」の形で使う。名詞retirement（引退、退職）も合わせて覚える。","tip":"スポーツ選手が引退する場合にも使われ、quit（やめる）よりも円満で計画的な引退を表す。"},{"w":"rob","pos":"動","m":"奪う；強盗する","nu":"人やお金・銀行などから力ずくや不正な方法で奪う行為を表す語だ。","ph":"rob a bank","phm":"銀行を襲う","ex":"Someone tried to rob the convenience store near our school.","exm":"誰かが学校の近くのコンビニを襲おうとした。","us":"rob A of Bの形で「AからBを奪う」と使う。目的語は人や場所（bank, storeなど）を取り、奪われた物にofを続ける点がstealと異なる。","tip":"stealは「物を盗む」、robは「人や場所を襲って奪う」と覚えると区別しやすい。"},{"w":"scare","pos":"動","m":"怖がらせる","nu":"人を急に驚かせて怖い気持ちにさせることを表す語だ。","ph":"scare someone away","phm":"人を怖がらせて追い払う","ex":"The loud thunder outside began to scare my little sister.","exm":"外の大きな雷の音が妹を怖がらせ始めた。","us":"他動詞として「(人)を怖がらせる」の形でよく使う。be scared of ~で「~が怖い」という受け身の形も頻出。","tip":"frightenとほぼ同じ意味だが、scareの方が口語的でカジュアルな場面でよく使われる。"},{"w":"settle","pos":"動","m":"解決する；定住する","nu":"問題を落ち着いて解決したり、ある場所に落ち着いて住むことを表す語だ。","ph":"settle a dispute","phm":"争いを解決する","ex":"The two teams managed to settle their argument before practice.","exm":"二つのチームは練習前に言い争いを解決することができた。","us":"settle downで「落ち着く、定住する」の意味になる。争い・問題を目的語にとると「解決する」の意味になる。","tip":"settleは「落ち着かせる」がコアイメージで、心・場所・問題を落ち着けるという方向に意味が広がる。"},{"w":"spoil","pos":"動","m":"台無しにする；甘やかす","nu":"良い状態のものを悪くしたり、子供を甘やかして育てることを表す語だ。","ph":"spoil the surprise","phm":"サプライズを台無しにする","ex":"Please do not spoil the ending of the movie for me.","exm":"私のために映画の結末を台無しにしないでください。","us":"「(計画・気分など)を台無しにする」と「(子供)を甘やかす」の2つの意味を持つ。過去形・過去分詞はspoiledまたはspoiltが使われる。","tip":"「傷める・腐らせる」が本来のイメージで、そこから食べ物が傷む・子供が甘やかされる意味まで広がったと考えると覚えやすい。"},{"w":"strike","pos":"動","m":"打つ；ストライキする","nu":"物を強く打つことや、労働者が抗議のために仕事を止めることを表す語だ。","ph":"strike a match","phm":"マッチを擦る","ex":"He watched the clock strike twelve during the long meeting.","exm":"彼は長い会議の間に時計が12時を打つのを見ていた。","us":"「思い浮かぶ」の意味でもan idea struck me（考えが浮かんだ）のように主語に物事が来る形が重要だ。過去形・過去分詞はstruckになる。","tip":"名詞strike「ストライキ」と結びつけると、「労働者が仕事を打ち切る」イメージで動詞の意味も思い出しやすい。"},{"w":"surround","pos":"動","m":"取り囲む","nu":"人や物が周りを完全に囲んでいる状態を表す語だ。","ph":"surround yourself with","phm":"~で自分の周りを固める","ex":"Fans began to surround the young singer after the concert.","exm":"コンサートの後、ファンたちがその若い歌手を取り囲み始めた。","us":"受け身のbe surrounded by ~「~に囲まれている」の形で使われることが非常に多い。","tip":"roundと関連づけると「周り(round)を囲む」イメージが作りやすい。"},{"w":"treat","pos":"動","m":"扱う；治療する","nu":"人や物事にどう対応するか、また病気やけがに医療的に対処することを表す語だ。","ph":"treat someone kindly","phm":"人を親切に扱う","ex":"Our new coach promised to treat every player with respect.","exm":"私たちの新しいコーチはすべての選手を敬意を持って扱うと約束した。","us":"treat A as B「AをBとして扱う」、treat A for B「Aの病気Bを治療する」の形が頻出だ。名詞treat「ごちそう、楽しみ」との違いに注意する。","tip":"「対応する」がコアで、人への対応なら「扱う」、病気への対応なら「治療する」と覚えると整理しやすい。"},{"w":"upset","pos":"動","m":"動揺させる","nu":"人の気持ちを乱して悲しませたり怒らせたりすることを表す語だ。","ph":"upset someone","phm":"人を動揺させる","ex":"The bad news about the exam upset most of the students.","exm":"試験についての悪い知らせはほとんどの生徒を動揺させた。","us":"過去形・過去分詞も同じupsetで変化しない。形容詞としてbe upset about ~「~について動揺している」もよく使う。","tip":"「心の設定(set)がひっくり返る(up)」イメージで動揺・混乱を連想すると覚えやすい。"},{"w":"vote","pos":"動","m":"投票する","nu":"選挙や決定のために賛成・反対の意思を表明することを表す語だ。","ph":"vote for someone","phm":"人に投票する","ex":"Every student will vote for the new class president tomorrow.","exm":"すべての生徒は明日新しいクラス委員長に投票する予定だ。","us":"vote for ~「~に賛成投票する」、vote against ~「~に反対投票する」と前置詞で意味が変わる点に注意する。","tip":"名詞vote「投票、票」と同じ形で動詞にもなる語だと覚えておくと使い分けやすい。"},{"w":"weigh","pos":"動","m":"重さを量る；重さが～ある","nu":"物の重さを測定したり、実際にある重さを持つことを表す語だ。","ph":"weigh oneself","phm":"体重を量る","ex":"The nurse asked him to weigh himself before the checkup.","exm":"看護師は健診の前に彼に体重を量るよう頼んだ。","us":"This bag weighs five kilograms.のように「~の重さがある」という状態を表す使い方が重要で、進行形にはしない。","tip":"名詞weight「重さ」とスペル・意味の両方が近い語なので、セットで覚えると定着しやすい。"},{"w":"whisper","pos":"動","m":"ささやく","nu":"他人に聞こえないよう小さな声で静かに話すことを表す語だ。","ph":"whisper in someone's ear","phm":"人の耳元でささやく","ex":"She began to whisper the answer to her nervous classmate.","exm":"彼女は緊張しているクラスメートに答えをささやき始めた。","us":"whisper to ~「~にささやく」、whisper that節の形も使われる。shoutとの対義関係で覚えると良い。","tip":"whで始まる語は風のようなかすかな音を連想させるものが多く、whisperも「小さな声」のイメージと結びつく。"},{"w":"architecture","pos":"名","m":"建築（学）","nu":"建物を設計する技術・様式や、建物全体の構造を指す語だ。","ph":"modern architecture","phm":"現代建築","ex":"Our teacher explained the history of Japanese architecture in class.","exm":"先生は授業で日本建築の歴史を説明した。","us":"不可算名詞として使う。個々の建物はbuildingで表し、architectureは建築という分野・様式全体を指す。","tip":"architectは「建築家」で、そこにureがついて分野・様式を表す名詞になったと考えると覚えやすい。"},{"w":"athlete","pos":"名","m":"運動選手","nu":"スポーツを専門的に行う、運動能力に優れた人を指す語だ。","ph":"a professional athlete","phm":"プロの運動選手","ex":"Every athlete on the team trains hard every single morning.","exm":"チームのすべての運動選手は毎朝熱心に練習する。","us":"陸上選手に限らず、あらゆるスポーツをする選手全般に使える語である点に注意する。","tip":"athletic「運動能力の高い」という形容詞とセットで覚えると語彙が広がる。"},{"w":"award","pos":"名","m":"賞","nu":"優れた業績や功績に対して公式に与えられる賞を指す語だ。","ph":"win an award","phm":"賞を獲得する","ex":"The school gave an award to the best young writer.","exm":"学校は最も優れた若い作家に賞を与えた。","us":"give/win an awardの形でよく使う。動詞としても「(賞など)を与える」の意味で使える。","tip":"prize（賞品・賞金を伴う賞）より、awardは功績を公式に称える賞というイメージが強い。"},{"w":"battle","pos":"名","m":"戦い","nu":"軍隊同士の戦闘だけでなく、困難との激しい闘いも表す語だ。","ph":"fight a battle","phm":"戦いを戦う","ex":"The soldiers described a difficult battle from many years ago.","exm":"兵士たちは何年も前の困難な戦いについて語った。","us":"warより規模が小さく個別の戦闘を指す。比喩的にa battle against illness「病気との戦い」のようにも使う。","tip":"warが「戦争」全体、battleがその中の「一つの戦闘」だと考えると区別しやすい。"},{"w":"border","pos":"名","m":"国境；縁","nu":"国と国との境界線や、物の外側の縁を表す語だ。","ph":"cross the border","phm":"国境を越える","ex":"The river forms a natural border between the two countries.","exm":"その川は二国間の自然の国境を形成している。","us":"動詞としてborder on ~「~に隣接する、~と紙一重である」の使い方も重要だ。","tip":"boundary(境界一般)より、borderは特に国と国との境界を指すことが多い語である。"},{"w":"branch","pos":"名","m":"枝；支店","nu":"木の幹から伸びる枝や、会社・組織の支部を表す語だ。","ph":"a branch office","phm":"支店・支社","ex":"A small bird built its nest on a low branch.","exm":"小さな鳥が低い枝に巣を作った。","us":"会社の「支店」の意味でもよく使われ、the main branch「本店」と対比される。","tip":"木の枝から会社が枝分かれしていくイメージで「支店」の意味が生まれたと考えると覚えやすい。"},{"w":"candidate","pos":"名","m":"候補者","nu":"選挙に立候補する人や、職や試験を受ける対象者を指す語だ。","ph":"a candidate for president","phm":"大統領候補","ex":"Every candidate for the student council gave a short speech.","exm":"生徒会のすべての候補者が短いスピーチをした。","us":"candidate for ~「~の候補者」の形で使う。「候補者になる」はrun as a candidateなどと表現する。","tip":"就職や試験の応募者を指すこともあり、election(選挙)だけの語ではない点に注意する。"},{"w":"cell","pos":"名","m":"細胞；独房","nu":"生物を構成する最小単位や、刑務所の小さな部屋を表す語だ。","ph":"a blood cell","phm":"血液細胞","ex":"In biology class, we observed a plant cell under the microscope.","exm":"生物の授業で私たちは顕微鏡で植物の細胞を観察した。","us":"生物の「細胞」のほか、刑務所の「独房」、電池を表すbattery cellなど文脈で意味が変わる。","tip":"cell phone(携帯電話)のcellも同じ語で、「小さな区切られた空間」という共通イメージを持つ。"},{"w":"charity","pos":"名","m":"慈善（団体）","nu":"困っている人を助けるための寄付や活動、またその団体を表す語だ。","ph":"donate to charity","phm":"慈善団体に寄付する","ex":"Our club plans to raise money for a local charity.","exm":"私たちの部活は地元の慈善団体のためにお金を集める予定だ。","us":"「慈善」という抽象的な意味では不可算、「慈善団体」という具体的な組織を指す時は可算名詞として使う。","tip":"charitableという形容詞形とあわせて覚えると、「思いやりのある」という語感がつかみやすい。"},{"w":"childhood","pos":"名","m":"子供時代","nu":"生まれてから大人になるまでの子供として過ごす時期を指す語だ。","ph":"since childhood","phm":"子供の頃から","ex":"My grandmother often tells stories about her happy childhood.","exm":"祖母はよく彼女の幸せな子供時代についての話をする。","us":"不可算名詞として使うことが多く、a happy childhoodのように形容詞を伴って具体的な時期を表すこともある。","tip":"child「子供」にhoodがついて「~の時期・状態」を表す名詞になっている。"},{"w":"clue","pos":"名","m":"手がかり","nu":"問題や謎を解くための情報やヒントを表す語だ。","ph":"give someone a clue","phm":"人にヒントを与える","ex":"The detective found an important clue near the broken window.","exm":"探偵は壊れた窓の近くで重要な手がかりを見つけた。","us":"I don't have a clue.で「全く分からない」という口語表現になる点も覚えておくとよい。","tip":"謎解きゲームやミステリー小説でよく出る語なので、探偵ものと結びつけて記憶すると定着しやすい。"},{"w":"coast","pos":"名","m":"海岸","nu":"陸地と海が接する地域全体を指す、比較的広い範囲を表す語だ。","ph":"along the coast","phm":"海岸沿いに","ex":"We drove along the coast to watch the beautiful sunset.","exm":"私たちは美しい夕日を見るために海岸沿いをドライブした。","us":"beach(浜辺、泳いだり遊んだりする場所)より広い地域全体を指す点がbeachとの違いである。","tip":"beachが「砂浜」というピンポイントの場所、coastは「海岸地域全体」という広い範囲だと区別すると良い。"},{"w":"colony","pos":"名","m":"植民地","nu":"ある国が他の地域を支配して人を送り込み統治する地域を表す語だ。","ph":"a former colony","phm":"かつての植民地","ex":"The history teacher explained how the colony gained independence.","exm":"歴史の先生はその植民地がどのように独立を得たかを説明した。","us":"歴史の文脈でよく使われ、動物のcolony「群れ、集団」（an ant colonyなど）の意味もある。","tip":"colonize「植民地化する」という動詞とセットで覚えると理解が深まる。"},{"w":"column","pos":"名","m":"円柱；コラム","nu":"建物を支える柱や、新聞・雑誌の決まった欄の記事を表す語だ。","ph":"a newspaper column","phm":"新聞のコラム","ex":"My favorite writer publishes a weekly column in that magazine.","exm":"私のお気に入りの作家はその雑誌で週刊コラムを発表している。","us":"建築の「柱」の意味と、新聞・雑誌の縦の欄・コラム記事の意味の両方を持つ点に注意する。","tip":"新聞が縦の列(column)に組まれていることから、決まった欄の記事もcolumnと呼ばれるようになったと考えると覚えやすい。"},{"w":"weapon","pos":"名","m":"武器","nu":"人を傷つけたり戦ったりするために使う道具全般を表す語だ。","ph":"carry a weapon","phm":"武器を携帯する","ex":"The museum displayed an ancient weapon used in old battles.","exm":"博物館は昔の戦いで使われた古代の武器を展示していた。","us":"銃や剣などの物理的な武器のほか、比喩的にa powerful weapon in the debate「議論での強力な武器」のようにも使う。","tip":"warと関連づけて「戦争で使う道具」というイメージで覚えると定着しやすい。"},{"w":"conference","pos":"名","m":"会議","nu":"特定の話題について多くの人が集まって話し合う正式な会合を表す語だ。","ph":"attend a conference","phm":"会議に出席する","ex":"Teachers from many schools attended the conference last weekend.","exm":"多くの学校の先生たちが先週末その会議に出席した。","us":"meeting(日常的な打ち合わせ)より規模が大きく、専門的・公式な集まりを指すことが多い。","tip":"a press conference「記者会見」のように、conferenceは公式な場での話し合いというイメージを持つ。"},{"w":"continent","pos":"名","m":"大陸","nu":"アジアやアフリカのような、地球上の広大な陸地のまとまりを表す語だ。","ph":"across the continent","phm":"大陸を横断して","ex":"Africa is the second largest continent on our planet.","exm":"アフリカは私たちの惑星で2番目に大きい大陸だ。","us":"the African continentのように固有名詞と組み合わせて使われることも多いが、continent自体は普通名詞である。","tip":"continentalという形容詞形(大陸の)とセットで覚えておくと語彙が広がる。"},{"w":"contract","pos":"名","m":"契約","nu":"当事者間で取り決めた条件を文書などで正式に約束することを表す語だ。","ph":"sign a contract","phm":"契約書に署名する","ex":"The young player finally signed a contract with the team.","exm":"その若い選手はついにそのチームと契約書に署名した。","us":"名詞は前に強勢(CONtract)、動詞「契約する、縮小する」は後ろに強勢(conTRACT)を置き発音が変わる。","tip":"プロスポーツ選手や会社の話でよく出る語なので、ニュースの文脈と結びつけて覚えると良い。"},{"w":"crew","pos":"名","m":"乗組員","nu":"船や飛行機を動かすチームや、共同で作業をする一団を表す語だ。","ph":"a flight crew","phm":"飛行機の乗務員","ex":"The film crew worked all night to finish the scene.","exm":"撮影クルーはそのシーンを終わらせるために一晩中働いた。","us":"集合名詞として通例単数扱いだが、構成員個人に焦点を当てる時は複数扱いになることもある。","tip":"teamが一般的な「チーム」なのに対し、crewは船・飛行機・撮影など専門的な作業チームを指すことが多い。"},{"w":"crop","pos":"名","m":"作物","nu":"農家が育てて収穫する穀物や野菜などの農産物を表す語だ。","ph":"grow a crop","phm":"作物を育てる","ex":"Farmers in this area grow a rice crop every year.","exm":"この地域の農家は毎年米の作物を育てている。","us":"具体的な作物の種類を指す時は可算名詞として使い、収穫全体を指す時はcropsと複数形になることも多い。","tip":"天候のニュースでdrought damaged the crops「干ばつが作物に被害を与

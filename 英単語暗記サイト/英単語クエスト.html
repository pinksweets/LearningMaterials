<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語クエスト</title>
<style>
  :root{
    --bg:#0f1226; --panel:#191d3a; --panel2:#22274d; --accent:#ffb703;
    --accent2:#8ecae6; --ok:#2ec4b6; --ng:#ff6b6b; --text:#f4f6ff;
    --muted:#a9b0d6; --line:#2f356a; --flame:#ff9e2c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#26305e 0%,var(--bg) 55%);
    color:var(--text);min-height:100vh;line-height:1.7;
  }
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px;}
  h1{font-size:1.35rem;margin:.2em 0;text-align:center;}
  h2{font-size:1.05rem;margin:.4em 0;}
  .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:14px;}
  .btn{
    display:inline-block;border:none;border-radius:14px;padding:14px 18px;font-size:1rem;
    font-weight:700;cursor:pointer;transition:transform .08s,filter .2s;width:100%;margin-top:8px;
    background:linear-gradient(180deg,var(--accent),#f08c00);color:#3a2400;
  }
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn.small{width:auto;padding:9px 14px;font-size:.85rem;margin-top:0;}
  .btn:disabled{opacity:.5;cursor:default;}
  .hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;}
  .chip .em{color:var(--accent);}
  .chip.flame{border-color:var(--flame);color:#ffd9a8;}
  .combo{color:#ffd166;}
  .progress{height:12px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:10px 0 2px;border:1px solid var(--line);}
  .bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--ok));transition:width .4s;}
  .xpbar{height:9px;background:var(--panel2);border-radius:999px;overflow:hidden;border:1px solid var(--line);flex:1;}
  .xpbar .fill{height:100%;background:linear-gradient(90deg,#b388ff,var(--accent2));transition:width .4s;}
  .lvrow{display:flex;align-items:center;gap:10px;margin:6px 0;}
  .lvrow .lvnum{font-weight:900;color:#c9b6ff;white-space:nowrap;}
  .lvrow .lvtitle{font-size:.78rem;color:var(--muted);white-space:nowrap;}
  /* mission */
  .mission{display:flex;align-items:center;gap:14px;}
  .mission .flamebig{font-size:2.4rem;line-height:1;text-align:center;}
  .mission .flamebig .n{display:block;font-size:1rem;font-weight:900;color:#ffd9a8;}
  .goal{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted);}
  .goal .dot{width:14px;height:14px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);}
  .goal .dot.on{background:var(--ok);border-color:var(--ok);}
  /* part cards */
  .part{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);margin-top:10px;cursor:pointer;transition:filter .2s;}
  .part:hover{filter:brightness(1.12);}
  .part .no{font-size:1.5rem;font-weight:800;min-width:40px;text-align:center;color:var(--accent);}
  .part .t{font-weight:800;font-size:.98rem;}
  .part .d{font-size:.76rem;color:var(--muted);}
  .part .pct{margin-left:auto;font-weight:800;color:var(--accent2);white-space:nowrap;font-size:.9rem;}
  .part .minibar{height:6px;background:var(--panel);border-radius:99px;overflow:hidden;margin-top:5px;}
  .part .minibar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--ok));}
  .part .mid{flex:1;min-width:0;}
  /* tabs */
  .tabs{display:flex;gap:8px;margin:10px 0;}
  .tab{flex:1;text-align:center;padding:10px 6px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:.85rem;color:var(--muted);}
  .tab.on{background:linear-gradient(180deg,var(--accent),#f08c00);color:#3a2400;border-color:var(--accent);}
  .coursedesc{font-size:.8rem;color:var(--muted);margin:4px 0 10px;}
  /* stage grid */
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;}
  .snode{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;cursor:pointer;transition:filter .15s;}
  .snode:hover{filter:brightness(1.15);}
  .snode.locked{opacity:.45;cursor:not-allowed;}
  .snode .n{font-weight:800;font-size:.95rem;}
  .snode .r{font-size:.7rem;color:var(--muted);}
  .snode .st{font-size:.78rem;letter-spacing:1px;color:var(--accent);min-height:1.1em;}
  .snode.done{border-color:var(--ok);}
  /* 高速周回 */
  .flashword{font-size:2.6rem;font-weight:900;text-align:center;letter-spacing:.5px;margin:10px 0;}
  .flashprev{min-height:1.4em;text-align:center;color:var(--accent2);font-size:.92rem;font-weight:700;}
  .flashhint{text-align:center;color:var(--muted);font-size:.78rem;}
  .fxwrap{display:flex;gap:12px;margin-top:14px;}
  .fxwrap .opt{text-align:center;font-size:1.05rem;padding:18px 8px;margin:0;}
  /* flashcard */
  .fcard{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:26px 18px;text-align:center;min-height:270px;display:flex;flex-direction:column;justify-content:center;gap:8px;}
  .fcard .w{font-size:2rem;font-weight:900;letter-spacing:.5px;}
  .fcard .pos{color:var(--accent);font-weight:700;font-size:.85rem;}
  .fcard .m{font-size:1.15rem;font-weight:800;color:#ffe3a3;}
  .fcard .nu,.fcard .us,.fcard .tipx{font-size:.88rem;color:var(--muted);}
  .fcard .exen{font-size:.95rem;font-weight:600;margin-top:6px;}
  .fcard .exja{font-size:.85rem;color:var(--muted);}
  .fcard .phen{font-size:.98rem;font-weight:700;color:var(--accent2);}
  .fcard .hidden-hint{color:var(--muted);font-size:.9rem;}
  .spk{background:none;border:1px solid var(--line);border-radius:99px;color:var(--text);padding:4px 12px;cursor:pointer;font-size:1rem;}
  /* question */
  .qtypebar{display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:10px;}
  .tag{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;}
  .tag.lv{color:var(--accent);}
  .qtext{font-size:1.12rem;font-weight:700;margin:6px 0 16px;white-space:pre-line;}
  .opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:14px;padding:14px 16px;margin:9px 0;font-size:1rem;cursor:pointer;transition:filter .15s,border-color .15s;font-weight:600;}
  .opt:hover{filter:brightness(1.14);}
  .opt.correct{border-color:var(--ok);background:rgba(46,196,182,.18);}
  .opt.wrong{border-color:var(--ng);background:rgba(255,107,107,.16);}
  .opt.disabled{cursor:default;pointer-events:none;}
  .mxwrap{display:flex;gap:12px;}
  .mxwrap .opt{text-align:center;font-size:1.4rem;padding:22px;}
  .matchrow{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .matchrow .l{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-weight:700;font-size:.95rem;}
  .matchrow select{flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:.92rem;}
  .matchrow select.correct{border-color:var(--ok);}
  .matchrow select.wrong{border-color:var(--ng);}
  .fb{margin-top:14px;padding:14px 16px;border-radius:14px;font-size:.93rem;display:none;border:1px solid var(--line);background:var(--panel2);}
  .fb.show{display:block;animation:pop .25s;}
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .fb .head{font-weight:800;font-size:1.05rem;margin-bottom:4px;}
  .fb.good .head{color:var(--ok);}
  .fb.bad .head{color:var(--ng);}
  .fb .exp{color:#e8ecff;}
  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#2b3170;border:1px solid var(--accent);
    color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:50;opacity:0;transition:opacity .3s,top .3s;pointer-events:none;max-width:88vw;text-align:center;}
  .toast.show{opacity:1;top:32px;}
  .rankbig{font-size:3.2rem;font-weight:900;text-align:center;color:var(--accent);margin:6px 0;}
  .center{text-align:center;}
  .badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;}
  .badge{background:var(--panel2);border:1px solid var(--accent);border-radius:12px;padding:8px 12px;font-size:.82rem;font-weight:700;}
  .badge.locked{border-color:var(--line);color:var(--muted);opacity:.65;}
  .muted{color:var(--muted);font-size:.85rem;}
  .row{display:flex;gap:10px;}
  .row .btn{margin-top:0;}
  .navrow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .stars{color:var(--accent);letter-spacing:2px;}
  /* wordbook */
  .wbitem{border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:12px 14px;margin-top:10px;cursor:pointer;}
  .wbitem .top{display:flex;align-items:center;gap:10px;}
  .wbitem .w{font-weight:900;font-size:1.05rem;}
  .wbitem .m{color:#ffe3a3;font-size:.9rem;margin-left:auto;text-align:right;}
  .wbitem .detail{display:none;margin-top:8px;font-size:.85rem;color:#dfe4ff;border-top:1px dashed var(--line);padding-top:8px;}
  .wbitem.open .detail{display:block;}
  .dots{font-size:.7rem;letter-spacing:1px;color:var(--ok);white-space:nowrap;}
  .search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 14px;font-size:16px;}
  textarea.io{width:100%;height:110px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;}
  .foot{text-align:center;color:var(--muted);font-size:.72rem;margin-top:22px;}
  /* confetti */
  .cf{position:fixed;top:-24px;z-index:60;pointer-events:none;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6;}}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   設定
============================================================ */
const CONFIG = {
  title: "⚔️ 英単語クエスト",
  subtitle: "高校必修1600語・句を3コースで完全攻略<br>1回10語・約3分でOK。毎日つづけてレベルアップ！",
  foot: "英単語クエスト｜収録データはすべてオリジナル書き下ろし"
};

const PART_INFO = [
  {key:"p1", no:1, name:"Part 1", label:"Basic Vocabulary & Idioms", desc:"基礎単語＋基本熟語"},
  {key:"p2", no:2, name:"Part 2", label:"Active Vocabulary 1", desc:"発信で使う必修語 ①"},
  {key:"p3", no:3, name:"Part 3", label:"Active Vocabulary 2", desc:"発信で使う必修語 ②"},
  {key:"p4", no:4, name:"Part 4", label:"Passive Vocabulary 1", desc:"読解で出会う語 ①"},
  {key:"p5", no:5, name:"Part 5", label:"Passive Vocabulary 2", desc:"読解で出会う語 ②"}
];
const COURSE_INFO = [
  {c:1, icon:"🌱", name:"コース1", label:"意味とニュアンス", desc:"まずは単語と意味＋語のイメージをつかむ"},
  {c:2, icon:"🌿", name:"コース2", label:"フレーズ・例文", desc:"コース1の復習＋実際の使われ方を例文で学ぶ"},
  {c:3, icon:"🌳", name:"コース3", label:"使い方とTip", desc:"総復習＋語法とTipで知識を深める"}
];
const STAGE_SIZE = 10;
const DAILY_GOAL = 3;           // 1日のセッション目標
const CLEAR_PCT = 70;           // クリアライン
const SRS_INT = [0,1,3,7,14,30]; // 習熟レベル別の復習間隔（日）
const REVIEW_MAX = 20;          // 1回の復習セッションの最大語数
const REVIEW_DAILY_CAP = 40;    // 1日に期限が来る復習語の上限（超過分は自動で翌日以降に分散）
const FLASH_MAX = 20;           // 高速周回の1回あたり語数

/* ============================================================
   単語データ（ここは自動生成データで差し替わる）
============================================================ */
/*__WORDS_START__*/
const WORDS = {"p1":[{"w":"agree","pos":"動","m":"同意する；意見が一致する","nu":"相手の意見や提案に対して「そうだと思う」と賛成する気持ちを表す動詞。","ph":"agree with someone","phm":"人の意見に同意する","ex":"I think we should agree with the plan for the trip.","exm":"私たちはその旅行の計画に賛成すべきだと思う。","us":"agree with＋人・意見、agree to＋提案・条件、agree that＋文の形で使う動作動詞である。","tip":"反対語は disagree。agree to は「提案に同意」、agree with は「人・意見に同意」と使い分けると覚えやすい。"},{"w":"borrow","pos":"動","m":"借りる","nu":"他人の持ち物を一時的に借りて後で返すことを表す、無料が基本の動詞。","ph":"borrow a book from the library","phm":"図書館から本を借りる","ex":"Can I borrow your pen for a minute during class today?","exm":"今日の授業中、少しの間ペンを貸してもらえますか。","us":"borrow は「借りる側」の視点の動詞で、from を使って貸し主を示す。lend（貸す）と混同しやすいので注意する。","tip":"lend（貸す）とセットで覚える。borrow は「持ってくる」、lend は「貸してあげる」と方向を意識すると区別しやすい。"},{"w":"decide","pos":"動","m":"決める；決心する","nu":"複数の選択肢からよく考えて一つを選び取ることを表す動詞。","ph":"decide to do something","phm":"〜することに決める","ex":"We need to decide on a topic for our group project soon.","exm":"私たちはそろそろグループ課題のテーマを決める必要がある。","us":"decide to do（〜することに決める）、decide on〜（〜に決める）の形が頻出で、decide that 文も可能。","tip":"名詞形は decision。「迷いを断ち切る」イメージで、de（分離）＋cide（切る）という語源を意識すると覚えやすい。"},{"w":"invite","pos":"動","m":"招待する；誘う","nu":"人をパーティーや行事などに来るよう丁寧に誘うことを表す動詞。","ph":"invite someone to a party","phm":"人をパーティーに招待する","ex":"She wants to invite all her classmates to her birthday party.","exm":"彼女は誕生日パーティーにクラスメート全員を招待したいと思っている。","us":"invite A to B（AをBに招待する）の形が基本で、名詞形 invitation もあわせて覚える。","tip":"招待状は invitation card ということも覚えておく。動詞 invite と名詞 invitation をセットで覚えると定着しやすい。"},{"w":"arrive","pos":"動","m":"到着する","nu":"目的地に着くことを表す自動詞で、後に場所を続けるときは前置詞が必要。","ph":"arrive at the station","phm":"駅に到着する","ex":"Our train will arrive at the station in ten minutes.","exm":"私たちの電車は10分後に駅に到着する予定だ。","us":"自動詞なので目的語を直接取らず、arrive at（狭い場所）、arrive in（広い場所）のように前置詞を使う点に注意する。","tip":"reach（〜に到着する）は他動詞で前置詞不要、arrive は自動詞で前置詞が必要という違いで区別する。"},{"w":"believe","pos":"動","m":"信じる","nu":"人の言葉や話の内容を本当のことだと思う気持ちを表す動詞。","ph":"believe in yourself","phm":"自分自身を信じる","ex":"You should always believe in yourself before every big game.","exm":"大事な試合の前はいつも自分自身を信じるべきだ。","us":"believe＋人・話（〜を信じる）、believe in〜（〜の存在や価値を信じる）を区別して使う。","tip":"believe in は「存在・能力を信じ続ける」という継続的な信頼を表すと覚えると使い分けやすい。"},{"w":"carry","pos":"動","m":"運ぶ；持ち歩く","nu":"物を手や体を使って別の場所へ移動させることを表す動詞。","ph":"carry a heavy bag","phm":"重いかばんを運ぶ","ex":"Please help me carry these heavy boxes to the classroom.","exm":"この重い箱を教室まで運ぶのを手伝ってください。","us":"carry A to B（AをBへ運ぶ）の形でよく使い、carry on（続ける）という句動詞の意味も重要である。","tip":"「持って移動する」イメージが基本。carry on（続ける）、carry out（実行する）などの熟語も一緒に覚えると良い。"},{"w":"catch","pos":"動","m":"捕まえる；間に合う","nu":"動くものを手でつかんだり、電車などに乗り遅れないことを表す動詞。","ph":"catch the bus","phm":"バスに間に合う","ex":"If we run, we can still catch the last bus home.","exm":"走れば、まだ最終バスに間に合うことができる。","us":"catch a cold（風邪をひく）のように病気にも使う。過去形・過去分詞は caught という不規則変化に注意する。","tip":"「動いているものを瞬間的につかむ」イメージ。catch up with（追いつく）もセットで覚えておく。"},{"w":"choose","pos":"動","m":"選ぶ","nu":"複数の中から自分の意志で一つを選び取ることを表す動詞。","ph":"choose the right answer","phm":"正しい答えを選ぶ","ex":"Take your time and choose the best answer for question three.","exm":"時間をかけて3番の問題に最適な答えを選んでください。","us":"choose to do（〜することを選ぶ）、choose A from B（BからAを選ぶ）の形で使う。過去形は chose、過去分詞は chosen という不規則変化である。","tip":"select よりくだけた語で日常会話でよく使う。名詞形は choice。"},{"w":"climb","pos":"動","m":"登る","nu":"山やはしごなどを手足を使って高い所へ上ることを表す動詞。","ph":"climb a mountain","phm":"山に登る","ex":"Every summer our club members climb a mountain together happily.","exm":"毎年夏、私たちの部の仲間は一緒に楽しく山に登る。","us":"climb up（よじ登る）の形も使われる。b は発音しない（発音は /klaɪm/）ので、スペルミスに注意する。","tip":"語尾の b は黙字（発音しない）。climb up the stairs（階段を上る）のようにも使う。"},{"w":"collect","pos":"動","m":"集める","nu":"同じ種類のものを一つにまとめて集めることを表す動詞。","ph":"collect stamps","phm":"切手を集める","ex":"My grandfather likes to collect old stamps from around the world.","exm":"祖父は世界中の古い切手を集めるのが好きだ。","us":"collect data（データを集める）のように情報にも使う。名詞形は collection。","tip":"gather（寄せ集める）と似るが、collect は「趣味・目的を持って集める」場面でよく使われる。"},{"w":"continue","pos":"動","m":"続ける；続く","nu":"動作や状態を止めずにそのまま続けることを表す動詞。","ph":"continue to study","phm":"勉強し続ける","ex":"Even after the rain started, they decided to continue the game.","exm":"雨が降り始めた後も、彼らは試合を続けることに決めた。","us":"continue to do と continue doing の両方の形が使え、意味はほぼ同じ。反対語は stop。","tip":"con（共に）＋tinue（保つ）という語源から「同じ状態を保ち続ける」イメージを持つとよい。"},{"w":"cover","pos":"動","m":"覆う；扱う","nu":"物の上にかぶせて隠したり、範囲や話題を扱ったりすることを表す動詞。","ph":"cover the desk","phm":"机を覆う","ex":"We used a big cloth to cover the desk before painting.","exm":"ペンキを塗る前に、大きな布で机を覆った。","us":"cover A with B（AをBで覆う）の形が基本で、教科書の「（範囲を）扱う」という意味でもよく使われる。","tip":"名詞 cover（表紙・カバー）と同じ形。「上から隠す」イメージを軸に意味を広げて覚える。"},{"w":"cry","pos":"動","m":"泣く；叫ぶ","nu":"悲しみや痛みで涙を流したり、大声を出したりすることを表す動詞。","ph":"cry with joy","phm":"うれし泣きする","ex":"The little girl began to cry with joy after winning first prize.","exm":"その小さな女の子は1位を取った後、うれし泣きし始めた。","us":"cry over〜（〜のことで泣く）の形も使う。「叫ぶ」という意味では shout に近い使い方をする。","tip":"三人称単数は cries、過去形は cried と y を i に変える綴りの変化に注意する。"},{"w":"dance","pos":"動","m":"踊る","nu":"音楽に合わせて体を動かすことを表す動詞で、同じ形のまま名詞（踊り）にもなる。","ph":"dance to the music","phm":"音楽に合わせて踊る","ex":"All the students began to dance to the music happily.","exm":"生徒たち全員が音楽に合わせて楽しそうに踊り始めた。","us":"dance with someone（人と一緒に踊る）、dance to music（音楽に合わせて踊る）の前置詞の違いに注意する。","tip":"名詞・動詞同形。文化祭などの学校行事でよく使われる語なので例文ごと覚えておくとよい。"},{"w":"draw","pos":"動","m":"描く；引く","nu":"鉛筆などで絵や図をかいたり、物を引き寄せたりすることを表す動詞。","ph":"draw a picture","phm":"絵を描く","ex":"In art class, we had to draw a picture of our school.","exm":"美術の授業で、私たちは学校の絵を描かなければならなかった。","us":"draw a picture／draw a line のように「線を使って表す」動作に使う。過去形 drew、過去分詞 drawn という不規則変化に注意する。","tip":"paint（絵の具で塗る）と違い、draw は主に線でかくことを指す。draw a conclusion（結論を導く）という比喩表現もある。"},{"w":"drop","pos":"動","m":"落とす；落ちる","nu":"物をうっかり落としたり、価格や温度が下がったりすることを表す動詞。","ph":"drop a plate","phm":"皿を落とす","ex":"Be careful not to drop a plate while washing the dishes.","exm":"皿を洗っている間、皿を落とさないように気をつけて。","us":"drop by（立ち寄る）、drop out（中退する）などの句動詞も頻出で、他動詞・自動詞どちらの用法もある。","tip":"fall（自然に落ちる）と違い、drop は「うっかり手から落とす」場合にも使える点を意識する。"},{"w":"enjoy","pos":"動","m":"楽しむ","nu":"自分の好きなことをして楽しい気持ちを味わうことを表す動詞。","ph":"enjoy reading books","phm":"読書を楽しむ","ex":"My little sister really seems to enjoy reading books at night.","exm":"私の妹は夜、読書を心から楽しんでいるようだ。","us":"enjoy の後は動名詞（〜ing）を続けるのが原則で、to不定詞は続けない点に日本人学習者は注意が必要である。","tip":"enjoy oneself（楽しむ、楽しく過ごす）という再帰代名詞を使う形もよく出る。"},{"w":"explain","pos":"動","m":"説明する","nu":"分かりにくいことを相手に分かるように言葉で述べることを表す動詞。","ph":"explain the reason","phm":"理由を説明する","ex":"Our teacher took time to explain the reason for the change.","exm":"先生は時間をかけてその変更の理由を説明してくれた。","us":"explain A to B（AをBに説明する）の語順に注意し、explain のあとに人を直接目的語に取らない（explain me ではなく explain to me が正しい）。","tip":"日本人が間違えやすい動詞の代表格。「explain＋人」ではなく「explain to＋人」という形を意識して覚える。"},{"w":"fall","pos":"動","m":"落ちる；転ぶ","nu":"上から下へ落ちたり、立っている状態から倒れたりすることを表す動詞。","ph":"fall asleep","phm":"眠りに落ちる","ex":"He was so tired that he began to fall asleep in class.","exm":"彼はとても疲れていて、授業中に眠りに落ち始めた。","us":"fall in love（恋に落ちる）、fall asleep（眠り込む）など状態変化を表す表現が多い。過去形 fell、過去分詞 fallen という不規則変化に注意する。","tip":"自動詞であり「自然に落ちる」イメージ。drop（意図的・偶然に落とす）との違いを意識する。"},{"w":"finish","pos":"動","m":"終える；終わる","nu":"行っていたことを最後までやり遂げることを表す動詞。","ph":"finish homework","phm":"宿題を終える","ex":"I always try to finish my homework before dinner every evening.","exm":"私はいつも毎晩夕食前に宿題を終えるようにしている。","us":"finish の後は動名詞（〜ing）を続け、to不定詞は続けない点に注意する。反対語に近いのは begin/start。","tip":"finish doing の形で覚える。end（終わる、幅広く使う）より finish は「やるべきことを完了する」ニュアンスが強い。"},{"w":"fly","pos":"動","m":"飛ぶ；飛行機で行く","nu":"鳥や飛行機などが空中を移動することを表す動詞で、名詞にもなる。","ph":"fly to Tokyo","phm":"東京まで飛行機で行く","ex":"Next spring, our family plans to fly to Tokyo together.","exm":"来年の春、私たちの家族は一緒に東京まで飛行機で行く予定だ。","us":"fly to〜（〜へ飛行機で行く）の形で移動手段を表す。過去形 flew、過去分詞 flown という不規則変化に注意する。","tip":"名詞 flight（飛行）と関連づけて覚える。虫の「ハエ」も同じ fly という綴りなので文脈で判断する。"},{"w":"follow","pos":"動","m":"ついて行く；従う","nu":"人の後をついて行ったり、指示やルールに従ったりすることを表す動詞。","ph":"follow the instructions","phm":"指示に従う","ex":"You must follow the instructions carefully during the science experiment.","exm":"理科の実験中は指示に注意深く従わなければならない。","us":"follow me（私についてきて）のように道案内でも使う。SNSの「フォローする」も同じ動詞から来ている。","tip":"「後ろについて行く」が基本イメージ。そこから「規則に従う」「話の筋を理解する」へ意味が広がると考えると覚えやすい。"},{"w":"forget","pos":"動","m":"忘れる","nu":"覚えていたことや、するべきことを思い出せなくなることを表す動詞。","ph":"forget your umbrella","phm":"傘を忘れる","ex":"Don't forget your umbrella today because it might rain later.","exm":"後で雨が降るかもしれないから、今日は傘を忘れないで。","us":"forget to do（〜し忘れる、まだしていない）と forget doing（〜したことを忘れる、すでにした）の意味の違いに注意する。","tip":"反対語は remember。過去形 forgot、過去分詞 forgotten という不規則変化も一緒に覚える。"},{"w":"grow","pos":"動","m":"育つ；成長する","nu":"植物や人などが時間の経過とともに大きく成長することを表す動詞。","ph":"grow up quickly","phm":"急速に成長する","ex":"Children in this town seem to grow up quickly and happily.","exm":"この町の子どもたちはすくすくと幸せに成長しているようだ。","us":"grow up（成長する、育つ）は人によく使う。過去形 grew、過去分詞 grown という不規則変化に注意する。","tip":"他動詞としても使え、grow vegetables（野菜を育てる）のように「育てる」意味にもなる点を覚えておく。"},{"w":"guess","pos":"動","m":"推測する；当てる","nu":"十分な情報がない中で、たぶんこうだろうと考えることを表す動詞。","ph":"guess the answer","phm":"答えを推測する","ex":"Can you guess the answer without looking at your notes?","exm":"ノートを見ずに答えを推測できますか。","us":"guess that〜（〜だと思う）のように think に近い軽い推量の意味でも使われ、名詞としても「推測」の意味で使われる。","tip":"I guess so.（そうだと思う）は会話でよく使う相づち表現なので、フレーズごと覚えておくと便利である。"},{"w":"happen","pos":"動","m":"起こる","nu":"予定していなかった出来事が実際に起こることを表す自動詞。","ph":"happen suddenly","phm":"突然起こる","ex":"A strange thing seemed to happen suddenly during the school festival.","exm":"文化祭の最中に、不思議なことが突然起こったようだった。","us":"主語には人ではなく出来事や物事が来る点に注意する。happen to do（たまたま〜する）という表現も頻出である。","tip":"occur（起こる、ややかたい語）とほぼ同意だが、happen のほうが日常会話で使われやすい。"},{"w":"hold","pos":"動","m":"持つ；開催する","nu":"手や腕でしっかり持ったり、行事を実施したりすることを表す動詞。","ph":"hold a meeting","phm":"会議を開く","ex":"The student council decided to hold a meeting after school today.","exm":"生徒会は今日の放課後に会議を開くことに決めた。","us":"hold a party／hold an event（行事を催す）の形が頻出で、過去形・過去分詞は held という不規則変化である。","tip":"「しっかり保つ」イメージから「持つ」「維持する」「開催する」へ意味が広がると理解すると覚えやすい。"},{"w":"hope","pos":"動","m":"望む；希望する","nu":"実現してほしいと前向きに願う気持ちを表し、実現の可能性がある事柄に使う動詞。","ph":"hope to see you","phm":"あなたに会えることを願う","ex":"I really hope to see you again at the concert.","exm":"そのコンサートでまたあなたに会えることを本当に願っている。","us":"hope to do、hope that〜 の形を取り、実現可能性のある願いに使う。実現困難な願望を表す wish とは区別する。","tip":"wish（現実には難しい願い）との違いを意識する。hope は「かなうかもしれない」希望に使うと覚える。"},{"w":"hurry","pos":"動","m":"急ぐ","nu":"時間に間に合うように急いで行動することを表す動詞。","ph":"hurry up","phm":"急ぐ","ex":"We need to hurry up or we will miss the train.","exm":"急がないと電車に乗り遅れてしまう。","us":"hurry up（急ぐ）は命令文でもよく使われる。名詞としても in a hurry（急いで）の形で使われる。","tip":"in a hurry（急いで）という前置詞句の形もセットで覚えておくと表現の幅が広がる。"},{"w":"imagine","pos":"動","m":"想像する","nu":"実際には見えないことを頭の中で思い描くことを表す動詞。","ph":"imagine a world","phm":"ある世界を想像する","ex":"Try to imagine a world without smartphones for just one day.","exm":"たった一日でいいから、スマートフォンのない世界を想像してみて。","us":"imagine の後は動名詞（〜ing）または that節を続け、to不定詞は続けない点に注意する。","tip":"image（イメージ・画像）と語源が同じ。「頭の中に image を描く」と考えると意味を覚えやすい。"},{"w":"improve","pos":"動","m":"改善する；上達する","nu":"今の状態や能力を今よりも良い方向へ高めることを表す動詞。","ph":"improve your English","phm":"英語を上達させる","ex":"Reading every day can really help improve your English skills.","exm":"毎日読書をすることは英語力の向上に本当に役立つ。","us":"他動詞・自動詞どちらでも使える。improve on〜（〜を改良する）という形もある。","tip":"名詞形は improvement。get better（良くなる）というカジュアルな言い方と言い換えられる場面も多い。"},{"w":"introduce","pos":"動","m":"紹介する","nu":"初対面の人同士を引き合わせたり、新しい物事を知らせたりすることを表す動詞。","ph":"introduce yourself","phm":"自己紹介する","ex":"On the first day, each student had to introduce themselves briefly.","exm":"初日、生徒はそれぞれ簡単に自己紹介をしなければならなかった。","us":"introduce A to B（AをBに紹介する）の形が基本で、名詞形 introduction もよく使われる。","tip":"intro-（中へ）＋duce（導く）という語源から「人を中へ導き入れる」イメージを持つと覚えやすい。"},{"w":"join","pos":"動","m":"参加する；加わる","nu":"サークルや部活など、あるグループに新しく加わることを表す動詞。","ph":"join the club","phm":"部活に入る","ex":"My best friend asked me to join the tennis club too.","exm":"親友が私にもテニス部に入るよう誘ってきた。","us":"join のあとは in などの前置詞を付けず直接名詞を続ける（join in the club ではなく join the club）。","tip":"join in（一緒に加わる、活動に参加する）という句動詞の形もあわせて覚える。"},{"w":"laugh","pos":"動","m":"笑う","nu":"おかしさや楽しさを感じて、声を出して笑うことを表す動詞。","ph":"laugh out loud","phm":"声を出して笑う","ex":"The whole class started to laugh out loud at his joke.","exm":"クラス全員が彼の冗談に声を出して笑い出した。","us":"laugh at〜（〜を見て笑う、〜を笑いものにする）の形に注意する。良い意味にも悪い意味にも使われる。","tip":"gh は f の音になり /læf/ と発音する。smile（微笑む、静かに笑う）との違いを意識する。"},{"w":"learn","pos":"動","m":"学ぶ；習得する","nu":"勉強や経験を通して知識や技能を身につけることを表す動詞。","ph":"learn a new language","phm":"新しい言語を学ぶ","ex":"It takes time and effort to learn a new language well.","exm":"新しい言語をしっかり学ぶには時間と努力が必要だ。","us":"learn to do（〜できるようになる）、learn about〜（〜について学ぶ）の形が頻出。study（勉強する行為）と learn（身につく結果）の違いに注意する。","tip":"study との違いがよく問われる。study は「勉強する行為」、learn は「習得できた結果」に重点があると覚える。"},{"w":"lend","pos":"動","m":"貸す","nu":"自分の持ち物を一時的に他人に貸してあげることを表す動詞。","ph":"lend a hand","phm":"手を貸す（手伝う）","ex":"Could you please lend a hand with these heavy chairs?","exm":"これらの重い椅子を運ぶのを手伝ってもらえますか。","us":"lend A to B、lend B A（AをBに貸す）の第4文型・第3文型両方で使える。borrow（借りる）との方向の違いに注意する。","tip":"borrow とセットで覚える。lend は「貸す側」、borrow は「借りる側」の視点という違いを意識する。過去形・過去分詞は lent。"},{"w":"lose","pos":"動","m":"失う；負ける","nu":"持っていた物をなくしたり、試合や勝負に負けたりすることを表す動詞。","ph":"lose the game","phm":"試合に負ける","ex":"Our team really doesn't want to lose the game tomorrow.","exm":"私たちのチームは明日の試合に本当に負けたくない。","us":"lose one's way（道に迷う）、lose weight（体重が減る）など幅広い意味を持つ。過去形・過去分詞は lost という不規則変化に注意する。","tip":"発音は /luːz/ で名詞 loss や形容詞 loose（緩い）とつづりを混同しないよう注意する。"},{"w":"marry","pos":"動","m":"結婚する","nu":"特定の相手と正式な法律上の夫婦になることを表す動詞。","ph":"marry each other","phm":"お互いに結婚する","ex":"In the story, the two characters finally marry each other happily.","exm":"物語の中で、その2人の登場人物はついに幸せに結婚する。","us":"marry は他動詞で marry with のように with を付けないよう注意し、get married to（〜と結婚する）という受け身の形もよく使われる。","tip":"get married との使い分けに注意する。日常会話では get married to のほうがよく使われることも覚えておく。"},{"w":"mean","pos":"動","m":"意味する；〜のつもりで言う","nu":"ある言葉や行動が本来示している内容や意図を表す動詞。","ph":"mean a lot","phm":"とても大きな意味を持つ","ex":"Your kind support during the contest will mean a lot to me.","exm":"コンテスト中のあなたの温かい支えは、私にとってとても大きな意味を持つだろう。","us":"What does it mean?（それはどういう意味ですか）のように疑問文でよく使われる。過去形・過去分詞は meant という不規則変化に注意する。","tip":"mean to do（〜するつもりだ）という意図を表す用法も重要。形容詞 mean（意地悪な）と混同しないよう注意する。"},{"w":"miss","pos":"動","m":"逃す；恋しく思う；欠席する","nu":"望んでいたものや大切な人がそこにない状態を残念に感じる気持ちを表す。","ph":"miss the bus","phm":"バスに乗り遅れる","ex":"I really miss my best friend, who moved to Osaka last month.","exm":"先月大阪に引っ越した親友のことを、私は今とても恋しく思う。","us":"miss は他動詞で直後に目的語を置く。miss doing で「（今はできなくて）〜を恋しく思う」の意味になる。","tip":"「機会をつかみ損ねる／そこにないと感じる」がコア。absent（意図的な欠席）との違いに注意。"},{"w":"move","pos":"動","m":"動く；引っ越す；感動させる","nu":"位置や状態が変わることを表し、人の心を動かす意味にも広がる基本動詞。","ph":"move to a new city","phm":"新しい街に引っ越す","ex":"My family will move to Tokyo next spring for work.","exm":"来春、仕事の都合で私の家族は東京へ引っ越す予定だ。","us":"自動詞・他動詞どちらでも使え、move houseで「引っ越す」の意味でも使う。","tip":"名詞movement（動き）と関連づけて覚える。be movedで「感動する」の意味になる。"},{"w":"notice","pos":"動","m":"気づく；掲示","nu":"意識していなかった変化や存在にふと気づく瞬間を表す動詞。","ph":"notice a change","phm":"変化に気づく","ex":"I didn't notice the mistake until my teacher pointed it out.","exm":"先生が指摘するまで、私はその間違いに気づかなかった。","us":"notice that節や notice + 目的語 + 分詞（notice him running）の形をよく取る。","tip":"名詞では「掲示・通知」の意味もある。noticeboard（掲示板）と合わせて覚える。"},{"w":"order","pos":"動","m":"注文する；命令する；順序","nu":"店で品物を頼む場合と、目上から指示・命令を出す場合の両方で使う語。","ph":"order a pizza","phm":"ピザを注文する","ex":"Let's order some pizza after the soccer game tonight.","exm":"今夜のサッカーの試合の後、ピザを注文しよう。","us":"order A to do で「Aに〜するよう命じる」となる。飲食店では「注文する」の意で最頻出。","tip":"名詞では「順序」「命令」の意味もある。in order to（〜するために）も重要表現。"},{"w":"paint","pos":"動","m":"（絵の具で）描く；塗る","nu":"絵の具やペンキを使って色をつけたり絵を仕上げたりする行為を表す。","ph":"paint a picture","phm":"絵を描く","ex":"We will paint a mural on the classroom wall this weekend.","exm":"今週末、私たちは教室の壁に壁画を描く予定だ。","us":"絵画作品にはdrawではなくpaintを使う（絵の具を使う場合）。名詞では「絵の具・塗料」を表す。","tip":"鉛筆やペンで描くdrawと、絵の具を塗るpaintを区別して覚える。"},{"w":"pass","pos":"動","m":"通り過ぎる；合格する；渡す","nu":"場所や時間を通過する、試験を突破する、物を手渡すなど幅広い場面で使う。","ph":"pass the exam","phm":"試験に合格する","ex":"I hope I can pass the exam next Friday without any mistakes.","exm":"来週の金曜日の試験に、間違えずに合格できるといいなと思う。","us":"スポーツで「パスする」、道で「追い越す」など多義。pass byで「通り過ぎる」となる。","tip":"「通過する」がコアイメージ。failを「不合格」の対語として覚えると理解しやすい。"},{"w":"pay","pos":"動","m":"払う；報われる","nu":"お金を支払う行為に加え、努力などが「割に合う」の意味でも使われる。","ph":"pay attention","phm":"注意を払う","ex":"You should pay attention when the teacher explains the homework.","exm":"先生が宿題の説明をするときは、しっかり注意を払うべきだ。","us":"pay for + 商品（代金を払う）、pay attention to（〜に注意を払う）の形が頻出。","tip":"pay-paid-paidと不規則変化する点に注意。名詞paymentも合わせて覚える。"},{"w":"plan","pos":"動","m":"計画する；計画","nu":"将来の行動をあらかじめ考えて準備することを表す基本語。","ph":"plan a trip","phm":"旅行を計画する","ex":"My classmates plan to visit Kyoto during the summer vacation.","exm":"夏休みの間に、クラスメートたちは京都を訪れる計画を立てている。","us":"plan to do（〜する予定だ）の形でよく使う。名詞としても同じ形で使える。","tip":"名詞・動詞同形の語。scheduleより「意図・計画そのもの」に重点を置く語。"},{"w":"practice","pos":"動","m":"練習する；習慣","nu":"技能を上達させるために繰り返し行う訓練を表す基本的な語。","ph":"practice the piano","phm":"ピアノを練習する","ex":"Our team will practice basketball every day after school this week.","exm":"今週、私たちのチームは放課後毎日バスケットボールを練習する。","us":"米ではpractice、英ではpractiseとつづりが分かれる（動詞）。名詞は両国ともpracticeが多い。","tip":"「繰り返して身につける」がコア。experience（経験）と混同しないよう注意。"},{"w":"prepare","pos":"動","m":"準備する","nu":"何かに備えて必要なものを整える、事前の行動を表す語。","ph":"prepare for the test","phm":"テストの準備をする","ex":"I need to prepare for the math test starting tomorrow morning.","exm":"明日の朝から始まる数学のテストの準備をしなければならない。","us":"prepare for（〜に備える）、prepare A for B（AにBの準備をさせる）の形が頻出。","tip":"名詞preparation（準備）とセットで覚える。readyという形容詞との使い分けにも注意。"},{"w":"promise","pos":"動","m":"約束する；約束","nu":"将来必ず実行すると相手に強く誓う気持ちを表す基本的な語。","ph":"promise to help","phm":"手伝うと約束する","ex":"I promise to help you finish the project by Friday.","exm":"金曜日までにプロジェクトを終わらせるのを手伝うと約束するよ。","us":"promise to do / promise that節の形を取る。keep a promise（約束を守る）も重要。","tip":"名詞・動詞同形。「必ず〜する」という強い確約のニュアンスがhopeより強い。"},{"w":"protect","pos":"動","m":"守る；保護する","nu":"危険や害から人・物・環境などを積極的に守る行為を表す語。","ph":"protect the environment","phm":"環境を守る","ex":"We should protect the environment by recycling paper and plastic bottles.","exm":"紙やペットボトルをリサイクルして、私たちは環境を守るべきだ。","us":"protect A from B（BからAを守る）の形が頻出。","tip":"名詞protection、形容詞protectiveと合わせて覚える。saveより「危険から遠ざける」意味合いが強い。"},{"w":"pull","pos":"動","m":"引く","nu":"手前や自分の方向に力を加えて動かすことを表す基本動詞。","ph":"pull the rope","phm":"ロープを引く","ex":"Please pull the door instead of pushing it.","exm":"そのドアは押すのではなく、引いてください。","us":"pullとpushはドアの表示でよく対になって使われる。pull outで「引き抜く・撤退する」の意味にもなる。","tip":"反対語push（押す）とセットで覚えると忘れにくい。"},{"w":"push","pos":"動","m":"押す","nu":"対象を前方や離れる方向に力を加えて動かすことを表す語。","ph":"push the button","phm":"ボタンを押す","ex":"You just need to push this button to start the machine.","exm":"この機械を動かすには、このボタンを押すだけでいい。","us":"push A to do（Aに〜するよう強く促す）という比喩的用法もある。","tip":"反対語pull（引く）と一緒に覚える。push oneselfで「自分を追い込む」という意味にもなる。"},{"w":"receive","pos":"動","m":"受け取る","nu":"手紙や贈り物、知らせなどが自分の元に届くことを表す語。","ph":"receive a letter","phm":"手紙を受け取る","ex":"I receive a lot of messages from friends on my birthday.","exm":"誕生日には、友達からたくさんのメッセージを受け取る。","us":"つづりに注意（cの直後はieではなくei）。getよりもややかたい響きで、手紙・賞・招待状などに使う。","tip":"反対語sendとセットで覚える。「iの前にe、ただしcの後は例外」という綴りの規則の代表例。"},{"w":"remember","pos":"動","m":"覚えている；思い出す","nu":"過去の出来事や情報を記憶にとどめている、または思い出す働きを表す。","ph":"remember the answer","phm":"答えを覚えている","ex":"I always remember the answer during math class, but forget it later.","exm":"数学の授業中はいつも答えを覚えているが、後で忘れてしまう。","us":"remember to do（これから〜するのを忘れない）とremember doing（過去に〜したことを覚えている）の違いに注意。","tip":"反対語forgetとセットで覚える。remember to doとforget to doの区別が入試頻出。"},{"w":"repeat","pos":"動","m":"繰り返す","nu":"同じ言葉や行動をもう一度、あるいは何度も行うことを表す語。","ph":"repeat the word","phm":"その単語を繰り返す","ex":"Please repeat the word after me three times slowly.","exm":"私の後に続いて、その単語をゆっくり3回繰り返してください。","us":"repeat oneselfで「同じことを繰り返し言う」の意味になる。repeat againは意味が重複するため避ける。","tip":"repeat自体に「再び」の意味が含まれる点に注目すると覚えやすい。"},{"w":"return","pos":"動","m":"戻る；返す","nu":"元の場所や状態に帰る、あるいは物を持ち主に戻すことを表す語。","ph":"return the book","phm":"本を返す","ex":"I need to return this book to the library by Monday.","exm":"月曜日までにこの本を図書館に返さなければならない。","us":"自動詞（帰る）と他動詞（返す）の両方で使える。give backより少しかたい表現。","tip":"re-（再び）+turn（向かう）という成り立ちで「元に向かう」イメージ。"},{"w":"ride","pos":"動","m":"乗る","nu":"自転車やバイク、馬など、またがったり座ったりして乗り物を利用することを表す語。","ph":"ride a bike","phm":"自転車に乗る","ex":"I ride my bike to school every morning with my sister.","exm":"毎朝、妹と一緒に自転車に乗って学校へ行く。","us":"電車やバスにも使えるが、自転車・バイク・馬など「またがる」乗り物に使うことが多い。","tip":"ride-rode-riddenと不規則変化する。名詞としても「乗ること」の意味で使える。"},{"w":"save","pos":"動","m":"救う；節約する；保存する","nu":"危険から助ける、お金や時間を無駄にしない、データを保管するなど幅広く使う語。","ph":"save time","phm":"時間を節約する","ex":"We can save time by taking the shortcut through the park.","exm":"公園を通る近道を使えば、時間を節約できる。","us":"save money（貯金する）、save a file（ファイルを保存する）など目的語で意味が変わる。","tip":"「無駄にせず取っておく」がコア。spend（使う・費やす）と対で覚えると理解しやすい。"},{"w":"sell","pos":"動","m":"売る","nu":"商品やサービスをお金と引き換えに他人に譲り渡すことを表す語。","ph":"sell tickets","phm":"チケットを売る","ex":"Our club will sell tickets for the school festival next week.","exm":"来週の学園祭に向けて、私たちの部はチケットを売る予定だ。","us":"sell A to B / sell B Aの両方の形を取れる。反対語buyとセットで覚える。","tip":"sell-sold-soldと不規則変化。sell outで「売り切れる」の意味になる。"},{"w":"send","pos":"動","m":"送る","nu":"手紙やメール、物などを相手のもとへ届くように出すことを表す語。","ph":"send a message","phm":"メッセージを送る","ex":"I will send a message to my friend after club activities.","exm":"部活動の後、友達にメッセージを送るつもりだ。","us":"send A to B / send B Aの両方の語順が可能。反対語receiveとセットで覚える。","tip":"send-sent-sentと不規則変化する。sendは「出す」、receiveは「受ける」という対の関係。"},{"w":"share","pos":"動","m":"共有する；分け合う","nu":"物や情報、気持ちなどを他人と一緒に使ったり分け合ったりすることを表す語。","ph":"share a room","phm":"部屋を共有する","ex":"My sister and I share a room in our small apartment.","exm":"狭いアパートで、私と姉は部屋を共有している。","us":"share A with B（AをBと分け合う）の形が頻出。名詞としても同じ形で使う。","tip":"「みんなの物にする」がコア。SNSのshare機能とも結びつけて覚えやすい。"},{"w":"shout","pos":"動","m":"叫ぶ；大声を出す","nu":"感情や緊急の伝達のために普段より大きな声を出すことを表す語。","ph":"shout for help","phm":"助けを求めて叫ぶ","ex":"Don't shout in the library; other students are trying to study.","exm":"図書館では叫ばないで。他の生徒たちが勉強しようとしている。","us":"shout at（〜に向かって怒鳴る）とshout to（〜に呼びかける）でニュアンスが変わる。","tip":"「声を張り上げる」がコア。sayやspeakより声量が大きい点で区別する。"},{"w":"sleep","pos":"動","m":"眠る；睡眠","nu":"目を閉じて休息を取る、生理的な休息状態を表す基本語。","ph":"sleep well","phm":"よく眠る","ex":"I try to sleep at least eight hours every school night.","exm":"学校がある日は毎晩、少なくとも8時間は眠るようにしている。","us":"名詞としても同形で使う（get some sleep）。fall asleep（眠りに落ちる）との違いに注意。","tip":"sleep-slept-sleptと不規則変化。形容詞sleepy（眠い）と合わせて覚える。"},{"w":"smile","pos":"動","m":"ほほえむ；笑顔","nu":"声を出さず口元をゆるめて喜びや親しみを表す表情を表す語。","ph":"smile at someone","phm":"誰かに笑いかける","ex":"I smile at everyone I pass in the hallway between classes.","exm":"授業の合間、廊下ですれ違う人みんなに私は笑いかける。","us":"smile at A（Aに向かって微笑む）の形。laugh（声を出して笑う）との違いに注意。","tip":"声を出すlaughと違い、smileは無音の笑顔を表す。名詞としても同形で使う。"},{"w":"solve","pos":"動","m":"解決する；解く","nu":"問題や謎に答えを見つけて片づけることを表す基本的な語。","ph":"solve the problem","phm":"問題を解決する","ex":"Let's work together to solve this math problem before class ends.","exm":"授業が終わる前に、みんなで協力してこの数学の問題を解こう。","us":"solve a problem/mystery/puzzleのように「答えが出るもの」を目的語に取る他動詞。","tip":"名詞solution（解決策）と合わせて覚える。answerは答えそのもの、solveは解く過程を表す。"},{"w":"spend","pos":"動","m":"費やす；使う","nu":"お金や時間をある目的のために使うことを表す基本的な語。","ph":"spend time","phm":"時間を過ごす","ex":"I spend two hours on homework every night after dinner.","exm":"毎晩夕食の後、宿題に2時間を費やしている。","us":"spend money/time on A、spend time doing（〜して時間を過ごす）の形が頻出。","tip":"spend-spent-spentと不規則変化。saveと反対の関係にある語として覚える。"},{"w":"stand","pos":"動","m":"立つ；我慢する","nu":"直立した姿勢を保つことに加え、否定文で「我慢できない」の意味にもなる語。","ph":"stand in line","phm":"列に並んで立つ","ex":"We had to stand in line for an hour to buy tickets.","exm":"チケットを買うために、私たちは1時間列に並んで立たなければならなかった。","us":"can't stand ~（〜が我慢できない）はよく使われる口語表現。","tip":"stand-stood-stoodと不規則変化。sitとの対で「立つ／座る」を整理して覚える。"},{"w":"steal","pos":"動","m":"盗む","nu":"他人の物を許可なく、こっそりと持ち去ることを表す語。","ph":"steal a bike","phm":"自転車を盗む","ex":"Someone tried to steal a bike from the school parking area.","exm":"誰かが学校の駐輪場から自転車を盗もうとした。","us":"目的語には「盗まれる物」を取る（steal A from B）。robは人・場所を目的語に取る点で異なる。","tip":"steal-stole-stolenと不規則変化。robとの違い（stealは物、robは人や場所）を区別して覚える。"},{"w":"suggest","pos":"動","m":"提案する","nu":"自分の考えや案を相手にやんわりと示し、検討を促すことを表す語。","ph":"suggest an idea","phm":"アイデアを提案する","ex":"I suggest we meet at the library to study for the test.","exm":"テスト勉強のために図書館で集まるのを提案するよ。","us":"suggest that S (should) doやsuggest doingの形を取り、suggest to doとはしない点に注意。","tip":"「to不定詞を取らない」動詞として入試頻出。proposeよりくだけた響きで日常会話でも使う。"},{"w":"teach","pos":"動","m":"教える","nu":"知識や技術を相手が理解・習得できるように伝えることを表す語。","ph":"teach English","phm":"英語を教える","ex":"My uncle will teach me how to play the guitar this summer.","exm":"この夏、おじが私にギターの弾き方を教えてくれる予定だ。","us":"teach A B / teach B to Aの両方の形が可能。tellやsayと違い「学ばせる」意味を含む。","tip":"teach-taught-taughtと不規則変化。名詞teacherと合わせて覚える。"},{"w":"throw","pos":"動","m":"投げる","nu":"手を使って物を勢いよく空中に飛ばすことを表す基本動詞。","ph":"throw a ball","phm":"ボールを投げる","ex":"Can you throw the ball a little softer during practice today?","exm":"今日の練習では、もう少し優しくボールを投げてくれる？","us":"throw A to B（Aを投げて渡す）、throw A at B（Aを狙って投げつける）で意味が変わる。","tip":"throw-threw-thrownと不規則変化。throw awayで「捨てる」の意味にもなる。"},{"w":"touch","pos":"動","m":"触れる；感動させる","nu":"手や体で物に軽く触れること、また心を動かすことを表す語。","ph":"touch the screen","phm":"画面に触れる","ex":"Please don't touch the paintings displayed in the art room.","exm":"美術室に展示されている絵画には触れないでください。","us":"be touched by A（Aに感動する）という受け身の形も頻出。物理的接触と感情の両方を表せる。","tip":"「軽く接する」がコア。feel（感じる）よりも接触の動作そのものに重点がある。"},{"w":"travel","pos":"動","m":"旅行する；移動する","nu":"遠くの場所へ移動すること、特に旅行や出張などの長距離移動を表す語。","ph":"travel abroad","phm":"海外旅行をする","ex":"I want to travel abroad with my friends after graduation next year.","exm":"来年の卒業後、友達と一緒に海外旅行をしたい。","us":"自動詞として使うことが多く、travel to A（Aへ旅行する）の形が頻出。一回の具体的な「旅行」を指す名詞にはtripを使うことが多く、travelは主に動詞、または旅行・移動全般を表す不可算名詞として使われる。","tip":"光や音が「伝わる」場合にもtravelを使う。名詞traveler（旅行者）と合わせて覚える。"},{"w":"understand","pos":"動","m":"理解する","nu":"話や状況の意味・内容を正しく把握することを表す基本動詞。","ph":"understand the lesson","phm":"授業内容を理解する","ex":"I finally understand the lesson after asking my teacher many questions.","exm":"先生にたくさん質問した後、ようやく授業内容を理解できた。","us":"進行形にしにくい状態動詞の代表例（×I am understanding）。understand thatや疑問詞節も目的語に取れる。","tip":"understand-understood-understoodと不規則変化。knowとの違い（理解の深さ・過程）を意識する。"},{"w":"visit","pos":"動","m":"訪れる；訪問","nu":"人や場所を実際に訪ねて時間を過ごすことを表す基本的な語。","ph":"visit a museum","phm":"博物館を訪れる","ex":"My class will visit a museum in Kyoto during our school trip next month.","exm":"来月の校外学習で、私たちのクラスは京都の博物館を訪れる予定だ。","us":"他動詞なので前置詞なしで直接目的語を取る（×visit to）。名詞としても同形で使う。","tip":"「行って訪ねる」がコア。go toと違い、その場所での滞在・見学のニュアンスを含む。"},{"w":"wait","pos":"動","m":"待つ","nu":"人や物事が来る、または起こるまで動かずに時間を過ごすことを表す語。","ph":"wait for the bus","phm":"バスを待つ","ex":"We often wait for the bus together after school.","exm":"放課後、私たちはよく一緒にバスを待つ。","us":"wait for A（Aを待つ）と前置詞forを伴う点に注意（×wait A）。can't wait to doで「早く〜したい」の意味。","tip":"「じっと待機する」がコア。expect（予期する）との違いを意識して区別する。"},{"w":"wake","pos":"動","m":"目が覚める；起こす","nu":"眠りの状態から覚醒することを表す語。他人を起こす意味でも使う。","ph":"wake up early","phm":"早く目を覚ます","ex":"I usually wake up early to study before school starts.","exm":"私はたいてい、学校が始まる前に勉強するため早く目を覚ます。","us":"wake up（自動詞的に目覚める）とwake A up（Aを起こす）の形をよく使う。","tip":"wake-woke-wokenと不規則変化。get up（起床して起き上がる動作）とは意味が異なる点に注意。"},{"w":"wear","pos":"動","m":"身につけている；着る","nu":"服や靴、眼鏡などを身につけている状態を表す語で、着る動作そのものより状態に重点がある。","ph":"wear a uniform","phm":"制服を着ている","ex":"Students in our school wear a uniform every day except Fridays.","exm":"私たちの学校の生徒は、金曜日を除いて毎日制服を着ている。","us":"wearは状態を表す語だが、is wearingの形で「今何を着ているか」を表すこともよくある。","tip":"wear-wore-wornと不規則変化。動作を表すput onと状態を表すwearを区別して覚える。"},{"w":"win","pos":"動","m":"勝つ；勝ち取る","nu":"競争や試合で相手に勝ち、目的のものを手に入れることを表す語だ。","ph":"win the game","phm":"試合に勝つ","ex":"Our team worked hard to win the final game today.","exm":"私たちのチームは今日の決勝戦に勝つために懸命に努力した。","us":"win a game/prize のように目的語を直接とる。「人に勝つ」は beat を使う点で win と区別する。","tip":"対義語は lose（負ける）。win-win（両者が得をする）という表現も合わせて覚えておく。"},{"w":"wish","pos":"動","m":"望む；願う","nu":"実現しにくいことを心の中で願う気持ちを表し、hope より非現実的な内容に使う。","ph":"wish for peace","phm":"平和を願う","ex":"I wish I could join the club activity after school.","exm":"放課後の部活動に参加できたらいいのにと思う。","us":"wish＋仮定法過去（現在の事実に反する願望）や wish to do（〜したいと願う）の形をとる。","tip":"現実的な望みは hope、非現実的な願いは wish と覚えると使い分けやすい。"},{"w":"worry","pos":"動","m":"心配する","nu":"良くない結果を想像して気持ちが落ち着かない状態を表す語だ。","ph":"worry about the exam","phm":"試験について心配する","ex":"Please don't worry about the test results too much.","exm":"テストの結果についてあまり心配しすぎないでください。","us":"worry about 〜（〜について心配する）の形が基本。名詞形も同じ worry で「心配」を表す。","tip":"形容詞 worried（心配して）と混同しない。worrisome は「心配させるような」の意味。"},{"w":"allow","pos":"動","m":"許す；可能にする","nu":"相手の行動を認めて許可を与えることを表す、permit よりやや口語的な語だ。","ph":"allow students to use","phm":"生徒が使うことを許す","ex":"Our teacher does not allow phones during class time.","exm":"先生は授業中の携帯電話の使用を許可していない。","us":"allow A to do（Aが〜するのを許す）の形をよく使う。受け身 be allowed to do も頻出。","tip":"口語的な let、ややかたい permit との違いを意識すると使い分けやすい。"},{"w":"become","pos":"動","m":"〜になる","nu":"状態や身分が変化して、ある結果に至ることを表す基本動詞だ。","ph":"become a teacher","phm":"先生になる","ex":"She wants to become a nurse after graduating from high school.","exm":"彼女は高校卒業後、看護師になりたいと思っている。","us":"become の後には名詞や形容詞が続き、SVCの文型をとる。get より少しかたい響きを持つ。","tip":"become-became-become の変化を確実に覚える。"},{"w":"begin","pos":"動","m":"始まる；始める","nu":"物事がスタートする瞬間を表す語で、start とほぼ同じ意味で使われる。","ph":"begin to study","phm":"勉強を始める","ex":"The club meeting will begin at four o'clock today.","exm":"部活のミーティングは今日午後4時に始まる予定だ。","us":"begin to do／begin doing の両方の形をとれる。自動詞・他動詞どちらでも使える。","tip":"begin-began-begun という不規則変化を覚える。start より書き言葉で好まれる。"},{"w":"break","pos":"動","m":"壊す；割れる","nu":"物が力を受けて壊れたり、割れたりする様子を表す語だ。","ph":"break the window","phm":"窓を割る","ex":"Be careful not to break the glass in the kitchen.","exm":"台所のガラスを割らないように気をつけて。","us":"break-broke-broken と活用する。take a break（休憩する）という名詞の使い方も重要。","tip":"break the rules（規則を破る）のように抽象的な意味の広がりも覚えておく。"},{"w":"bring","pos":"動","m":"持ってくる","nu":"話し手のいる場所へ物や人を移動させることを表す語だ。","ph":"bring an umbrella","phm":"傘を持ってくる","ex":"Don't forget to bring your textbook to class tomorrow.","exm":"明日の授業に教科書を持ってくるのを忘れないで。","us":"bring-brought-brought と活用する。take（持って行く）との方向の違いに注意。","tip":"bring は「こちらへ」、take は「あちらへ」と方向で区別すると覚えやすい。"},{"w":"build","pos":"動","m":"建てる；築く","nu":"材料を組み合わせて建物や関係などを作り上げることを表す語だ。","ph":"build a house","phm":"家を建てる","ex":"Workers are going to build a new gym near the school.","exm":"作業員たちは学校の近くに新しい体育館を建てる予定だ。","us":"build-built-built と活用する。build a relationship のように抽象的にも使う。","tip":"名詞 building（建物）とセットで覚えると語彙が広がる。"},{"w":"burn","pos":"動","m":"燃える；焦がす","nu":"火によって物が燃えたり、皮膚が熱で傷ついたりする様子を表す語だ。","ph":"burn the toast","phm":"トーストを焦がす","ex":"She tries not to burn the toast every morning before school.","exm":"彼女は毎朝、学校前にトーストを焦がさないようにしている。","us":"burn-burned/burnt-burned/burnt と活用する。burn calories（カロリーを消費する）という比喩表現もある。","tip":"sunburn（日焼け）のように複合語でもよく使われる語だ。"},{"w":"buy","pos":"動","m":"買う","nu":"お金を払って物を自分のものにすることを表す基本動詞だ。","ph":"buy a present","phm":"プレゼントを買う","ex":"I want to buy a new bag for the school trip.","exm":"修学旅行のために新しいカバンを買いたい。","us":"buy A for B（BのためにAを買う）または buy B A の形をとる。sell（売る）と対で覚える。","tip":"buy-bought-bought の不規則変化に注意。purchase はよりフォーマルな同義語だ。"},{"w":"change","pos":"動","m":"変える；変わる","nu":"状態や形が以前とは違うものになることを表す幅広い語だ。","ph":"change one's mind","phm":"気持ちを変える","ex":"He decided to change his plan for the summer vacation.","exm":"彼は夏休みの計画を変更することにした。","us":"change into A（Aに変わる）や change A into B（AをBに変える）の形が頻出。","tip":"名詞では「変化」「おつり」の意味もあり、文脈で判断する必要がある。"},{"w":"check","pos":"動","m":"確認する；調べる","nu":"間違いや状態がないかを注意深く調べることを表す語だ。","ph":"check the schedule","phm":"予定を確認する","ex":"Please check your answers before you submit the test.","exm":"テストを提出する前に答えを確認してください。","us":"check A（Aを確認する）や check if/whether（〜かどうか確かめる）の形をとる。","tip":"名詞では「小切手」の意味もあるが、動詞では「確認」の意味が中心だ。"},{"w":"clean","pos":"動","m":"掃除する","nu":"汚れやごみを取り除いてきれいな状態にすることを表す語だ。","ph":"clean the classroom","phm":"教室を掃除する","ex":"Students clean the classroom together after school every day.","exm":"生徒たちは毎日放課後、一緒に教室を掃除する。","us":"clean up（きれいに片付ける）という句動詞もよく使われる。","tip":"形容詞 clean（きれいな）と同じ形なので、文中の位置で品詞を見分ける。"},{"w":"close","pos":"動","m":"閉める；閉じる","nu":"開いていたものを閉じて、出入りや利用ができない状態にすることを表す語だ。","ph":"close the door","phm":"ドアを閉める","ex":"Could you please close the window because it's getting cold outside?","exm":"外が寒くなってきたので窓を閉めていただけますか。","us":"動詞のときは発音が濁り、形容詞（close to〜「近い」）のときは発音が変わる点に注意する。","tip":"反対語は open（開ける）。close to（〜の近くに）という使い方も重要。"},{"w":"cook","pos":"動","m":"料理する","nu":"材料に熱を加えて食べられる状態にすることを表す語だ。","ph":"cook dinner","phm":"夕食を作る","ex":"My father likes to cook dinner for the family.","exm":"父は家族のために夕食を作るのが好きだ。","us":"cook（火を使って調理する）と make（作る全般）の違いに注意する。名詞 cook は「料理人」の意味。","tip":"cooking class（料理教室）のように名詞の cooking もよく使われる。"},{"w":"count","pos":"動","m":"数える","nu":"数を一つずつ確認しながら合計を出すことを表す語だ。","ph":"count the students","phm":"生徒を数える","ex":"The teacher asked us to count the students in line.","exm":"先生は私たちに列に並ぶ生徒の数を数えるよう頼んだ。","us":"count on 〜（〜を頼りにする）という熟語表現は意味が大きく異なるので注意する。","tip":"「重要である」という意味の count もある。Every effort counts. のように使う。"},{"w":"die","pos":"動","m":"死ぬ；枯れる","nu":"生命が終わることを表す直接的な語で、状況によっては婉曲表現が好まれる。","ph":"die of an illness","phm":"病気で死ぬ","ex":"Old trees sometimes die during a very strong typhoon.","exm":"古い木は非常に強い台風の際に枯れることがある。","us":"die of/from（原因を表す前置詞）を使い分ける。die-died-died と活用する。","tip":"名詞形 death（死）、形容詞 dead（死んでいる）とあわせて覚えると効率的だ。"},{"w":"feel","pos":"動","m":"感じる","nu":"気持ちや体の感覚を心や体で感じ取ることを表す基本動詞だ。","ph":"feel nervous","phm":"緊張を感じる","ex":"I always feel nervous before my speech in English class.","exm":"私は英語の授業でのスピーチの前はいつも緊張する。","us":"feel＋形容詞（SVC）の形が基本。feel like doing（〜したい気がする）も頻出。","tip":"feel-felt-felt と活用する。think と違い、感覚的な判断を表す点に注意。"},{"w":"find","pos":"動","m":"見つける","nu":"探していたものや気づかなかったものを発見することを表す語だ。","ph":"find the answer","phm":"答えを見つける","ex":"I usually find my pencil case somewhere inside my messy bag.","exm":"私はたいてい散らかったかばんの中のどこかで筆箱を見つける。","us":"find-found-found と活用する。find it 形容詞 to do（〜するのを…だと思う）の形も重要。","tip":"look for（探す）は行動、find（見つける）は結果を表す点で使い分ける。"},{"w":"fix","pos":"動","m":"直す；固定する","nu":"壊れたものを直したり、位置を動かないようにしたりすることを表す語だ。","ph":"fix the bike","phm":"自転車を直す","ex":"My brother helped me fix my broken bicycle yesterday.","exm":"昨日、兄が壊れた自転車を直すのを手伝ってくれた。","us":"fix（口語的な「修理する」）は repair とほぼ同義。fix a date（日程を決める）の意味もある。","tip":"「修理」だけでなく「固定する・決める」という意味の広がりも覚えておく。"},{"w":"hit","pos":"動","m":"打つ；ぶつかる","nu":"何かに強く当たったり、たたいたりする動作を表す語だ。","ph":"hit the ball","phm":"ボールを打つ","ex":"He hit the ball hard during baseball practice.","exm":"彼は野球の練習中、ボールを強く打った。","us":"hit-hit-hit と活用が変化しない不規則動詞だ。hit on an idea（考えを思いつく）という表現もある。","tip":"過去形も過去分詞も hit のまま変わらない点をしっかり覚える。"},{"w":"hurt","pos":"動","m":"傷つける；痛む","nu":"体や心に痛みや苦痛を与える、あるいは痛みを感じることを表す語だ。","ph":"hurt one's leg","phm":"足を痛める","ex":"She hurt her leg while playing volleyball at practice.","exm":"彼女は練習中にバレーボールをしていて足を痛めた。","us":"hurt-hurt-hurt と活用は変化しない。自動詞で「痛む」（My head hurts.）としても使える。","tip":"injure（けがをさせる、ややフォーマル）との違いを意識すると使い分けやすい。"},{"w":"keep","pos":"動","m":"保つ；続ける","nu":"ある状態や習慣を大きく変えずにそのまま維持し続けることを表す語だ。","ph":"keep a diary","phm":"日記をつける","ex":"I try to keep a diary every night before going to bed.","exm":"私は毎晩寝る前に日記をつけるようにしている。","us":"keep＋形容詞（〜のままでいる）や keep doing（〜し続ける）の形が頻出。","tip":"keep-kept-kept と活用する。continue と似ているが、keep は状態の維持に重点がある。"},{"w":"leave","pos":"動","m":"去る；残す","nu":"ある場所を離れたり、物をそのままの状態にしておいたりすることを表す語だ。","ph":"leave home early","phm":"早く家を出る","ex":"I usually leave home early to catch the school bus.","exm":"私はスクールバスに乗るためたいてい早く家を出る。","us":"leave-left-left と活用する。leave A behind（Aを置き忘れる）という表現も重要。","tip":"名詞 leave（休暇）という意味もあるので文脈で判断する。"},{"w":"meet","pos":"動","m":"会う","nu":"人と出会ったり、待ち合わせをしたりすることを表す基本動詞だ。","ph":"meet a friend","phm":"友達に会う","ex":"Let's meet at the station after club activities end.","exm":"部活動が終わったら駅で会いましょう。","us":"meet-met-met と活用する。meet with（人と会う、または困難に遭う）という用法もある。","tip":"初対面には Nice to meet you.、再会には Nice to see you again. と使い分ける。"},{"w":"need","pos":"動","m":"必要とする","nu":"あるものや行動がなくてはならないと感じることを表す語だ。","ph":"need more time","phm":"もっと時間が必要だ","ex":"I need more time to finish my homework tonight.","exm":"今夜、宿題を終えるにはもっと時間が必要だ。","us":"need to do（〜する必要がある）や need＋名詞の形をとる。否定文では needn't も使われる。","tip":"have to や must と似ているが、need は「必要性」に焦点を当てる点で異なる。"},{"w":"open","pos":"動","m":"開ける","nu":"閉じていたものを開いて、中に入れるようにすることを表す語だ。","ph":"open the window","phm":"窓を開ける","ex":"Could you open the window because the room feels a bit hot?","exm":"部屋が少し暑く感じるので窓を開けてもらえますか。","us":"動詞のほか形容詞（open「開いている」）としても使われ、文脈で判断する。","tip":"反対語は close/shut（閉める）。open-minded（心が広い）のような複合語も覚えておく。"},{"w":"pick","pos":"動","m":"選ぶ；摘む","nu":"複数の中から一つを選び取ったり、手で摘み取ったりすることを表す語だ。","ph":"pick a book","phm":"本を選ぶ","ex":"You can pick any book you like from this shelf.","exm":"この棚から好きな本を選んでいいですよ。","us":"pick up（拾い上げる、車で迎えに行く）という句動詞が特に頻出なので合わせて覚える。","tip":"choose よりくだけた響きを持ち、日常会話でよく使われる語だ。"},{"w":"put","pos":"動","m":"置く","nu":"物をある場所に位置づけることを表す最も基本的な動詞だ。","ph":"put the book on the desk","phm":"本を机の上に置く","ex":"Please put your bag on the desk before the class starts.","exm":"授業が始まる前にかばんを机の上に置いてください。","us":"put-put-put と活用が変化しない。put on（身につける）、put off（延期する）などの句動詞も重要。","tip":"place（置く、ややフォーマル）との違いを意識し、句動詞とセットで覚えると効果的だ。"},{"w":"chance","pos":"名","m":"機会；可能性","nu":"何かが起こる可能性や、行動を起こす良い機会を表す語だ。","ph":"get a chance","phm":"機会を得る","ex":"I finally got a chance to talk with the new student.","exm":"私はついに転校生と話す機会を得た。","us":"chance to do（〜する機会）や chance of/for（〜の可能性）の形をとる。opportunity より口語的。","tip":"by chance（偶然に）という熟語表現もよく出題される。"},{"w":"culture","pos":"名","m":"文化","nu":"ある集団が共有する生活様式や価値観、伝統などを表す語だ。","ph":"learn about culture","phm":"文化について学ぶ","ex":"We learned about Japanese culture in social studies class.","exm":"私たちは社会科の授業で日本文化について学んだ。","us":"通常は数えられない名詞として使うが、「異文化」など特定の文化を指すときは可算になる。","tip":"形容詞形 cultural（文化的な）とあわせて覚えておくと表現の幅が広がる。"},{"w":"weather","pos":"名","m":"天気","nu":"ある地域・時点の気温や天候の状態を表す語で、気候全体を指す climate とは異なる。","ph":"check the weather","phm":"天気を確認する","ex":"We checked the weather before planning our school trip.","exm":"私たちは修学旅行の計画を立てる前に天気を確認した。","us":"不可算名詞として扱い、a や複数形をつけない点に注意する。","tip":"長期的な「気候」は climate、その日その時の「天気」は weather と区別する。"},{"w":"accident","pos":"名","m":"事故；偶然","nu":"予期せず起こる好ましくない出来事、特に交通事故などを表す語だ。","ph":"a traffic accident","phm":"交通事故","ex":"There was a small traffic accident near the school gate.","exm":"学校の門の近くで小さな交通事故があった。","us":"have an accident（事故に遭う）の形が頻出。by accident（偶然に）という熟語もある。","tip":"incident（出来事全般）より accident は「事故性・偶然性」が強い点で区別する。"},{"w":"activity","pos":"名","m":"活動","nu":"何かをして過ごす行動や催し物を表す語で、club activity のように使われる。","ph":"club activity","phm":"部活動","ex":"Playing soccer is my favorite activity during the long summer vacation.","exm":"サッカーをすることは、長い夏休みの間の私のお気に入りの活動だ。","us":"可算名詞として複数形 activities でもよく使われる。動詞 act、形容詞 active と語源が同じ。","tip":"outdoor activity（屋外活動）のように具体的な種類とセットで覚えると使いやすい。"},{"w":"address","pos":"名","m":"住所；演説","nu":"手紙や荷物を届けるための場所を示す情報を表す語で、演説の意味もある。","ph":"home address","phm":"自宅の住所","ex":"Please write your home address on this school form.","exm":"この学校の書類に自宅の住所を書いてください。","us":"動詞では「（問題に）対処する」「演説する」の意味になり、名詞とは異なる用法を持つ。","tip":"email address（メールアドレス）のように現代生活でも頻出する語だ。"},{"w":"adult","pos":"名","m":"大人；成人","nu":"成長して大人になった人を表す語で、child（子ども）と対になる。","ph":"become an adult","phm":"大人になる","ex":"In Japan, a person legally becomes an adult at eighteen.","exm":"日本では、人は18歳で法的に大人になる。","us":"形容詞としても使え、adult movie（成人向け映画）のような使い方もある。","tip":"発音には強勢の違いが二通りあるが、意味は変わらないので聞き取りに注意する。"},{"w":"advice","pos":"名","m":"助言；忠告","nu":"人が困っているときに与える役立つ意見や提案を表す語だ。","ph":"give advice","phm":"助言を与える","ex":"My teacher gave me good advice about choosing a career.","exm":"先生は進路選択について良い助言をくれた。","us":"不可算名詞なので an advice とは言わず、a piece of advice と数える。","tip":"動詞 advise（助言する）とスペル・発音が異なる点に注意する。"},{"w":"age","pos":"名","m":"年齢；時代","nu":"生まれてからの年数や、ある特定の時代・時期を表す語だ。","ph":"at the age of","phm":"〜歳のときに","ex":"She started playing tennis at the age of six.","exm":"彼女は6歳のときにテニスを始めた。","us":"at the age of＋数字（〜歳で）の形が頻出。the digital age（デジタル時代）のように「時代」の意味もある。","tip":"形容詞 aged（年を取った）や teenage（10代の）などの派生語もあわせて覚える。"},{"w":"air","pos":"名","m":"空気","nu":"私たちが呼吸するために吸う、目に見えない気体を表す語だ。","ph":"fresh air","phm":"新鮮な空気","ex":"We opened the window to get some fresh air inside.","exm":"私たちは新鮮な空気を取り入れるために窓を開けた。","us":"基本的に不可算名詞として使うが、「雰囲気」の意味では an air of 〜 のように使うこともある。","tip":"air conditioner（エアコン）のように日常生活でよく使われる複合語も一緒に覚える。"},{"w":"area","pos":"名","m":"地域；分野；面積","nu":"範囲を持つ場所や分野を指し、区切られた空間や領域のイメージを持つ語。","ph":"a residential area","phm":"住宅地域","ex":"Many students live in this area near the school.","exm":"多くの生徒はこの学校の近くのこの地域に住んでいる。","us":"前置詞は in を使う（in this area）。可算名詞として使うことが多い。","tip":"area は「面積・範囲」がコアイメージ。region（広い地方）より狭い範囲を指すことが多い。"},{"w":"art","pos":"名","m":"芸術；美術；技術","nu":"美しさや創造性を表現する活動や作品を指し、教科名としても使う語。","ph":"modern art","phm":"現代美術","ex":"Our school offers an art class every Friday afternoon.","exm":"私たちの学校は毎週金曜日の午後に美術の授業がある。","us":"教科としての「美術」は不可算で、個々の作品は「a work of art」のように数える。","tip":"art の対義語ではないが、science（科学）としばしば対比される教科区分だと覚える。"},{"w":"beach","pos":"名","m":"浜辺；海岸","nu":"波打ち際の砂浜を指し、海水浴や散歩を楽しむ場所というイメージを持つ語。","ph":"go to the beach","phm":"浜辺へ行く","ex":"We plan to relax at the beach during summer vacation.","exm":"私たちは夏休みに浜辺でのんびり過ごす予定だ。","us":"前置詞は at や on を使う（at the beach, on the beach）。","tip":"sea（海そのもの）と違い、beach は陸地側の砂浜部分を指すと区別する。"},{"w":"body","pos":"名","m":"体；身体；団体","nu":"頭からつま先までの肉体全体を指し、健康や運動の話題でよく使う語。","ph":"take care of your body","phm":"体を大切にする","ex":"Regular exercise keeps your body strong and healthy daily.","exm":"定期的な運動は毎日あなたの体を強く健康に保つ。","us":"「委員会・団体」の意味では student body（全校生徒）のように使う。","tip":"body と soul（心・魂）は対で覚えると意味の幅が広がる。"},{"w":"bottle","pos":"名","m":"瓶；ボトル","nu":"液体を入れる細長い容器を指し、ペットボトルや水筒などにも使う語。","ph":"a water bottle","phm":"水筒（水のボトル）","ex":"Please bring a bottle of water to practice every day.","exm":"毎日の練習には水のボトルを持ってきてください。","us":"「a bottle of ~」の形で中身を表す（a bottle of juice）。","tip":"容器を表す cup, glass, bottle の形の違いをイメージすると覚えやすい。"},{"w":"bridge","pos":"名","m":"橋；架け橋","nu":"川や谷を越えて両岸をつなぐ構造物で、比喩的に人をつなぐ意味でも使う語。","ph":"cross the bridge","phm":"橋を渡る","ex":"Students often walk across the old bridge to school.","exm":"生徒たちはよく古い橋を渡って学校に行く。","us":"前置詞は across や over を使うことが多い（walk over the bridge）。","tip":"比喩的に「a bridge between cultures」（文化の架け橋）のようにも使われる。"},{"w":"company","pos":"名","m":"会社；仲間・同伴","nu":"働く組織としての会社と、一緒にいる仲間の両方の意味を持つ語。","ph":"work for a company","phm":"会社に勤める","ex":"His father works for a large company near their home.","exm":"彼の父は自宅の近くにある大きな会社に勤めている。","us":"「仲間・同伴」の意味では不可算（keep company with）、「企業」の意味では可算になる。","tip":"friend の意味の company と business の意味の company を文脈で区別する。"},{"w":"century","pos":"名","m":"世紀","nu":"100年という長い時間の区切りを表し、歴史の出来事を語るときに使う語。","ph":"in the 21st century","phm":"21世紀に","ex":"This old castle was built nearby in the sixteenth century.","exm":"この古い城はこの近くで16世紀に建てられた。","us":"「in the ~ century」の形で使い、序数詞と組み合わせて表す。","tip":"cent（100）を含む語（century, percent）とまとめて覚えると効率的。"},{"w":"ceremony","pos":"名","m":"式典；儀式","nu":"卒業式や結婚式など、決まった形式で行われる公式の行事を指す語。","ph":"a graduation ceremony","phm":"卒業式","ex":"Every student wore a uniform at the graduation ceremony.","exm":"卒業式では全ての生徒が制服を着ていた。","us":"「opening/closing ceremony」（開会式・閉会式）のように行事名の前後に置く。","tip":"発音とスペルに注意（ce-re-mo-ny）。formal な行事を指す語だと覚える。"},{"w":"corner","pos":"名","m":"角；隅","nu":"二つの線や面が交わる曲がり角や、部屋の隅の部分を指す語。","ph":"around the corner","phm":"角を曲がったところに","ex":"Turn left at the next corner to find the bookstore.","exm":"次の角を左に曲がると本屋が見つかる。","us":"前置詞は at（at the corner）や around（around the corner）を使う。","tip":"「すぐ近く」を表す比喩表現「just around the corner」も一緒に覚える。"},{"w":"country","pos":"名","m":"国；田舎","nu":"国家という意味に加え、都会に対する田舎という意味も持つ語。","ph":"travel to another country","phm":"別の国へ旅行する","ex":"Many families visited a different country during the summer holidays.","exm":"多くの家族が夏休みの間に別の国を訪れた。","us":"「田舎」の意味では the country のように定冠詞をつけて使うことが多い。","tip":"nation（政治的な国家）と country（地理的な国）の使い分けを意識する。"},{"w":"custom","pos":"名","m":"習慣；風習","nu":"社会や地域で長く受け継がれてきた決まった行動様式を指す語。","ph":"a local custom","phm":"地元の風習","ex":"Removing your shoes indoors is a common custom here.","exm":"家の中で靴を脱ぐことはここでは一般的な習慣だ。","us":"個人の癖は habit、社会全体の慣習は custom と使い分ける。","tip":"customer（客）と語源的なつながりがあるが意味は別なので混同しないよう注意する。"},{"w":"date","pos":"名","m":"日付；デート","nu":"カレンダー上の特定の日を指すほか、男女で出かけるデートの意味もある語。","ph":"set a date","phm":"日取りを決める","ex":"Our teacher wrote the date of the test today.","exm":"先生は今日テストの日付を書いた。","us":"「What's the date today?」（今日は何日か）のように使う。曜日は day で聞く点に注意。","tip":"day（曜日・日）と date（日付＝月日）の違いを意識して覚える。"},{"w":"daughter","pos":"名","m":"娘","nu":"親から見た女の子供を指す語で、息子（son）と対で覚える語。","ph":"their only daughter","phm":"彼らの一人娘","ex":"Their daughter joined the tennis club this spring term.","exm":"彼らの娘はこの春学期にテニス部に入った。","us":"発音注意（gh は発音しない、/ˈdɔːtər/）。","tip":"son（息子）と daughter（娘）をペアで覚えると効率がよい。"},{"w":"dictionary","pos":"名","m":"辞書","nu":"単語の意味やつづりを調べるための本やアプリを指す語。","ph":"look up a word in the dictionary","phm":"辞書で単語を調べる","ex":"She checks new words in her electronic dictionary daily.","exm":"彼女は毎日電子辞書で新しい単語を確認する。","us":"「look up ~ in a dictionary」の形でよく使われる。","tip":"diction（言葉遣い）と同じ語源から派生した語だと考えると覚えやすい。"},{"w":"dinner","pos":"名","m":"夕食；ディナー","nu":"一日の中心となる食事で、多くの場合夜に家族で食べる食事を指す語。","ph":"have dinner together","phm":"一緒に夕食を食べる","ex":"The whole family usually has dinner together around seven.","exm":"家族全員はたいてい7時ごろに一緒に夕食を食べる。","us":"一日の主要な食事を指すため、地域や状況によっては昼食を指すこともある。","tip":"breakfast, lunch, dinner の3食をセットで覚える。"},{"w":"dream","pos":"名","m":"夢；将来の夢","nu":"眠っている間に見る夢と、将来かなえたい夢や目標の両方を表す語。","ph":"follow your dream","phm":"夢を追いかける","ex":"Becoming a doctor has been her dream since childhood.","exm":"医者になることは彼女の子供の頃からの夢だ。","us":"「have a dream」や「dream of ~ing」の形で使われることが多い。","tip":"dream job（夢の仕事）のように名詞を修飾する形でもよく使われる。"},{"w":"earth","pos":"名","m":"地球；大地","nu":"私たちが住む惑星である地球や、土そのものを指す語。","ph":"protect the earth","phm":"地球を守る","ex":"Students learned how pollution affects the earth today.","exm":"生徒たちは今日汚染が地球にどう影響するか学んだ。","us":"惑星としての地球は the earth、特に強調する場合は Earth と大文字で書くこともある。","tip":"world（人間社会としての世界）と earth（物理的な星）を区別して覚える。"},{"w":"effort","pos":"名","m":"努力","nu":"目標達成のために力を尽くす行為を指し、結果より過程の頑張りを表す語。","ph":"make an effort","phm":"努力する","ex":"He made a great effort to improve his English.","exm":"彼は英語力を伸ばすために大きな努力をした。","us":"「make an effort to do ~」の形が頻出。不可算・可算どちらでも使われる。","tip":"try（試みる）と違い、effort は注いだ力や労力そのものを指す語だと覚える。"},{"w":"energy","pos":"名","m":"エネルギー；活力","nu":"活動するための力を指し、物理的なエネルギーにも人の元気にも使う語。","ph":"save energy","phm":"エネルギーを節約する","ex":"Playing soccer every afternoon gives him a lot of energy.","exm":"毎日午後にサッカーをすることで彼は多くの活力を得ている。","us":"不可算名詞として使うのが基本（an energy とは言わない）。","tip":"renewable energy（再生可能エネルギー）のように環境の話題でよく登場する。"},{"w":"environment","pos":"名","m":"環境","nu":"人や生物を取り巻く自然や社会の状況全体を指し、保護の対象として話題になる語。","ph":"protect the environment","phm":"環境を守る","ex":"Our club collects garbage to protect the local environment.","exm":"私たちの部活は地元の環境を守るためにゴミを集めている。","us":"「the environment」と定冠詞をつけて自然環境全体を指すことが多い。","tip":"environ（周囲）+ ment（名詞化）で「周りを取り巻くもの」と覚える。"},{"w":"event","pos":"名","m":"出来事；行事","nu":"学校行事やニュースになるような、特定の時に起こる出来事を指す語。","ph":"a school event","phm":"学校行事","ex":"The sports festival is the biggest school event of the year.","exm":"体育祭は年間最大の学校行事だ。","us":"「special event」（特別な行事）のように形容詞と結びつくことが多い。","tip":"日本語の「イベント（行事）」より意味が広く、歴史的な事件など予定外の「出来事」にも使う。"},{"w":"example","pos":"名","m":"例","nu":"何かを説明したり理解したりするために挙げる具体的な事例を指す語。","ph":"for example","phm":"例えば","ex":"Our teacher gave an example to explain the grammar point.","exm":"先生は文法のポイントを説明するために例を挙げた。","us":"「for example」（挿入句）と「an example of ~」の形をセットで覚える。","tip":"sample（見本）と似ているが、example は説明のための具体例に重点がある。"},{"w":"experience","pos":"名","m":"経験","nu":"実際に経験したことで得られる知識や技能を指し、動詞としても使う語。","ph":"gain experience","phm":"経験を積む","ex":"Studying abroad last year was a valuable experience for her.","exm":"去年の留学は彼女にとって貴重な経験だった。","us":"「経験」全般は不可算、個々の体験談は可算になる（a good experience）。","tip":"experiment（実験）とスペルが似ているので混同しないよう注意する。"},{"w":"fact","pos":"名","m":"事実","nu":"実際に起こった、あるいは確認できる真実の事柄を指す語。","ph":"in fact","phm":"実は","ex":"It is a fact that regular sleep improves test scores.","exm":"定期的な睡眠がテストの点数を上げるのは事実だ。","us":"「in fact」（実は）は文をつなぐ副詞句としてよく使われる。","tip":"opinion（意見）と fact（事実）の違いを意識して覚える。"},{"w":"farm","pos":"名","m":"農場","nu":"作物を育てたり家畜を飼ったりする土地や施設を指す語。","ph":"work on a farm","phm":"農場で働く","ex":"The students visited a farm to learn about vegetables.","exm":"生徒たちは野菜について学ぶために農場を訪れた。","us":"動詞としても使える（to farm the land＝土地を耕す）。","tip":"farmer（農家）は -er をつけて「働く人」を表す派生語だと覚える。"},{"w":"festival","pos":"名","m":"祭り；フェスティバル","nu":"音楽や食べ物などを楽しむ特別なお祝いの催しを指す語。","ph":"a music festival","phm":"音楽祭","ex":"Our town holds a big festival every summer near the river.","exm":"私たちの町は毎年夏に川の近くで大きな祭りを開催する。","us":"「hold a festival」（祭りを開催する）の形でよく使われる。","tip":"film festival, food festival のように様々な名詞と組み合わさる語。"},{"w":"fire","pos":"名","m":"火；火事","nu":"燃える炎そのものと、建物などが燃える火事の両方を指す語。","ph":"catch fire","phm":"火が付く","ex":"The students practiced what to do in case of fire.","exm":"生徒たちは火事の場合にどうすべきか練習した。","us":"「on fire」（燃えている）、「catch fire」（発火する）などの熟語が頻出。","tip":"fireworks（花火）、fire alarm（火災報知器）など複合語も一緒に覚える。"},{"w":"floor","pos":"名","m":"床；階","nu":"建物内の床面や、建てられた階を数えるときの階数を表す語。","ph":"on the first floor","phm":"1階に","ex":"Her classroom is located on the third floor of the school.","exm":"彼女の教室はその学校の3階にある。","us":"「階」の数え方はイギリスとアメリカで異なる場合があるので注意する。","tip":"ground floor（1階）を基準にして上の階を数えていく。"},{"w":"forest","pos":"名","m":"森","nu":"木々が広く生い茂った自然の場所を指し、wood より規模が大きい語。","ph":"a walk in the forest","phm":"森の中の散歩","ex":"They went camping in a quiet forest near the mountains.","exm":"彼らは山の近くの静かな森でキャンプをした。","us":"前置詞は in を使う（in the forest）。","tip":"wood(s)（小さな林）と forest（広大な森）の規模の違いで区別する。"},{"w":"future","pos":"名","m":"未来；将来","nu":"これから先に起こること、特に自分の人生における先の時期を指す語。","ph":"in the future","phm":"将来に","ex":"She often thinks about her future career as a nurse.","exm":"彼女は看護師としての将来の仕事についてよく考える。","us":"「in the future」（将来に）は文頭・文末どちらでも使える副詞句。","tip":"past（過去）・present（現在）・future（未来）を時間軸でセットで覚える。"},{"w":"garbage","pos":"名","m":"ゴミ；生ゴミ","nu":"家庭などから出る不要な廃棄物を指す語で、trash とほぼ同義の語。","ph":"take out the garbage","phm":"ゴミを出す","ex":"Please remember to take out the garbage before school.","exm":"学校に行く前にゴミを出すのを忘れないでください。","us":"不可算名詞なので a garbage とは言わず、a piece of garbage のように数える。","tip":"アメリカ英語では garbage、イギリス英語では rubbish が好まれる。"},{"w":"goal","pos":"名","m":"目標；ゴール","nu":"達成しようと目指す到達点を指し、サッカーなどの得点の意味もある語。","ph":"set a goal","phm":"目標を立てる","ex":"His goal this term is to join the basketball team.","exm":"今学期の彼の目標はバスケ部に入ることだ。","us":"「set a goal」（目標を設定する）、「achieve a goal」（目標を達成する）が頻出表現。","tip":"サッカーの「ゴール」も同じ単語なので、スポーツニュースでも覚えやすい。"},{"w":"government","pos":"名","m":"政府","nu":"国や地域を治め、法律や政策を決めて実行する組織全体を指す語。","ph":"the local government","phm":"地方政府","ex":"The government announced a new plan to support students.","exm":"政府は学生を支援する新しい計画を発表した。","us":"集合名詞なので単数扱いが基本だが、イギリス英語では複数扱いされることもある。","tip":"govern（治める）+ ment（名詞化）で「治める組織」と覚える。"},{"w":"grade","pos":"名","m":"学年；成績","nu":"学校の学年と、テストなどの成績や評価の両方を表す語。","ph":"get a good grade","phm":"良い成績をとる","ex":"She got a good grade on her history test.","exm":"彼女は歴史のテストで良い成績をとった。","us":"アメリカ英語では学年を「first grade」のように呼び、イギリス英語では year を使うことが多い。","tip":"grade（点数・学年）と grate（すりおろす）は発音が似るがスペルが異なるので注意。"},{"w":"group","pos":"名","m":"集団；グループ","nu":"共通の目的や特徴で集まった人やものの集まりを指す語。","ph":"work in a group","phm":"グループで作業する","ex":"Our club members practice together as one big group.","exm":"私たちの部員は一つの大きなグループとして一緒に練習する。","us":"可算名詞として使い、「a group of students」（生徒の集団）のように使う。","tip":"グループ全体を一つの単位として見るときは単数扱いにすると覚える。"},{"w":"habit","pos":"名","m":"習慣；癖","nu":"無意識のうちに繰り返す個人の行動パターンを指す語。","ph":"a good habit","phm":"良い習慣","ex":"Reading before bed is a good habit for students.","exm":"寝る前に読書をすることは生徒にとって良い習慣だ。","us":"「have a habit of ~ing」（〜する習慣がある）の形が頻出。","tip":"custom（社会全体の慣習）に対し、habit は個人の癖や習慣を指すと区別する。"},{"w":"health","pos":"名","m":"健康","nu":"体や心の調子が良い状態を指す語で、病気の有無に関わる話題で使う語。","ph":"good for your health","phm":"健康に良い","ex":"Eating vegetables every day is good for your health.","exm":"毎日野菜を食べることは健康に良い。","us":"不可算名詞。形容詞形は healthy（健康な）なので混同しないよう注意する。","tip":"health（名詞：健康）と healthy（形容詞：健康な）をセットで覚える。"},{"w":"history","pos":"名","m":"歴史","nu":"過去に起こった出来事の記録や、それを学ぶ教科を指す語。","ph":"study history","phm":"歴史を勉強する","ex":"He enjoys learning about history in social studies class.","exm":"彼は社会科の授業で歴史について学ぶのが好きだ。","us":"教科としては不可算名詞。「world history」（世界史）のように複合語でよく使う。","tip":"story（物語）と語源的なつながりがあるが、history は実際に起きた過去の記録を指す。"},{"w":"hobby","pos":"名","m":"趣味","nu":"楽しみのために自分の自由時間に継続して行う個人の活動を指す語。","ph":"my favorite hobby","phm":"私のお気に入りの趣味","ex":"Playing the guitar has become his favorite hobby lately.","exm":"ギターを弾くことは最近彼のお気に入りの趣味になった。","us":"「What's your hobby?」よりも「What do you do in your free time?」の方が自然な会話表現とされる。","tip":"interest（興味）より hobby は実際に行う活動に重点があると覚える。"},{"w":"holiday","pos":"名","m":"休日；祝日；休暇","nu":"学校や仕事が休みになる特別な日を指し、日常からの解放感を伴う語。","ph":"on holiday","phm":"休暇中で","ex":"We are planning a family trip during the summer holiday.","exm":"私たちは夏休みの間に家族旅行を計画している。","us":"イギリス英語では旅行や休暇全体を holiday と呼び、アメリカ英語では vacation が好まれる。可算名詞として扱う。","tip":"holy（神聖な）+day が語源で、元は宗教的な祭日を指した語。そこから休みの日全般に意味が広がった。"},{"w":"hospital","pos":"名","m":"病院","nu":"けがや病気を治療するための施設を指し、医療行為が行われる場所を意味する。","ph":"go to the hospital","phm":"病院に行く","ex":"My brother had to go to the hospital after the game.","exm":"兄はその試合の後、病院に行かなければならなかった。","us":"イギリス英語では in hospital のように無冠詞で「入院中」を表せるが、アメリカ英語では in the hospital と冠詞をつける。","tip":"hospitality（もてなし）と語源が同じで、元は「客をもてなす場所」を意味した語。"},{"w":"hour","pos":"名","m":"時間；1時間","nu":"60分という時間の単位を表し、時計で計れる具体的な長さを示す語。","ph":"for an hour","phm":"1時間の間","ex":"We waited for an hour before the concert finally started.","exm":"コンサートがようやく始まる前、私たちは1時間待った。","us":"発音が母音で始まるため a ではなく an hour と言う。h は発音しない点に注意する。","tip":"h を発音しないのはフランス語由来の語だから。time（時間全般）と違い hour は具体的な60分の単位を指す。"},{"w":"idea","pos":"名","m":"考え；アイデア；思いつき","nu":"頭に浮かんだ考えや思いつきを指し、計画や解決策のもとになるものを表す。","ph":"have an idea","phm":"考えがある","ex":"I have a good idea for our next class festival project.","exm":"次のクラスの文化祭の企画について、私にはいい考えがある。","us":"have an idea や get an idea の形でよく使う可算名詞で、複数の考えを言うときは ideas とする。","tip":"no idea で「全然わからない」という決まり文句もあわせて覚えておくと便利。"},{"w":"information","pos":"名","m":"情報","nu":"何かについて知らせる事実や知識の集まりを指し、形のない内容そのものを表す。","ph":"get information","phm":"情報を得る","ex":"You can get more information about the trip from our teacher.","exm":"その旅行についての詳しい情報は先生から得られる。","us":"数えられない名詞なので informations や an information とは言わず、a piece of information のように数える。","tip":"inform（知らせる）+-ation（名詞化）でできた語。動詞形 inform とセットで覚える。"},{"w":"island","pos":"名","m":"島","nu":"水に囲まれた陸地を指し、大陸から離れた独立性のあるイメージを持つ語。","ph":"a small island","phm":"小さな島","ex":"Our school trip to a small island was really unforgettable.","exm":"小さな島への修学旅行は本当に忘れられないものだった。","us":"s は発音しない（アイランド）ので、スペルと発音のずれに注意する可算名詞。","tip":"island の s は語源的な誤りから加わった黙字。isle（小島）と関連づけて覚えると発音を間違えにくい。"},{"w":"job","pos":"名","m":"仕事；職","nu":"お金を得るための具体的な仕事や、頼まれた作業そのものを指す語。","ph":"get a job","phm":"仕事を得る","ex":"My sister got a part-time job at a bookstore last month.","exm":"姉は先月、本屋でアルバイトの仕事を得た。","us":"work は不可算だが job は可算名詞。「良い仕事だ」と褒める Good job! も日常でよく使う。","tip":"work（労働全般）に対して job は「一つの具体的な職・作業」を指す点で区別すると覚えやすい。"},{"w":"kitchen","pos":"名","m":"台所；キッチン","nu":"料理を作るための部屋を指し、家庭内の調理スペースを表す語。","ph":"in the kitchen","phm":"台所で","ex":"My mother was cooking dinner in the kitchen with my sister.","exm":"母は妹と一緒に台所で夕食を作っていた。","us":"「台所で」は前置詞 in を使い、on とは言わない可算名詞である。","tip":"kitchen knife や kitchenware のような複合語とまとめて覚えると語彙が広がる。"},{"w":"language","pos":"名","m":"言語；言葉","nu":"人が意思を伝え合うために使う言葉の体系全体を指す語。","ph":"a foreign language","phm":"外国語","ex":"Learning a foreign language opens many doors for students.","exm":"外国語を学ぶことは生徒たちに多くの道を開く。","us":"特定の言語を指すときは a language と可算で使い、body language（身振り）のような比喩表現もある。","tip":"語源はラテン語 lingua（舌）から。tongue にも「言語」の意味があることとあわせて覚えるとよい。"},{"w":"law","pos":"名","m":"法律","nu":"社会の秩序を保つために国が定めた規則を指し、破ると罰を受ける拘束力のある語。","ph":"break the law","phm":"法律を破る","ex":"Everyone in this country must follow the traffic law.","exm":"この国ではすべての人が交通法規に従わなければならない。","us":"一般的な「法」は不可算、個別の「法律」は a law と可算で扱え、rule より公的で重い響きを持つ。","tip":"lawyer（弁護士）や illegal（違法な）など関連語とセットで覚えると理解が深まる。"},{"w":"letter","pos":"名","m":"手紙；文字","nu":"紙に書いて送るメッセージ、または文字そのものを指す語。","ph":"write a letter","phm":"手紙を書く","ex":"She decided to write a letter to her favorite author.","exm":"彼女はお気に入りの作家に手紙を書くことに決めた。","us":"「手紙」と「アルファベットの文字」の両方の意味があるため文脈で判断する可算名詞である。","tip":"capital letter（大文字）という表現もあわせて覚えておくと便利。"},{"w":"library","pos":"名","m":"図書館","nu":"本を読んだり借りたりするために利用する公共の施設を指す語。","ph":"at the library","phm":"図書館で","ex":"I usually study for tests at the library after school.","exm":"私はたいてい放課後、図書館でテスト勉強をする。","us":"本を買う bookstore と混同しないよう注意する。library card（図書館カード）などの表現もよく使う。","tip":"bookstore との違いは「借りる場所か買う場所か」。この対比で覚えると混同を防げる。"},{"w":"line","pos":"名","m":"線；列；行","nu":"まっすぐに引かれたものや、人・物が並んだ状態を幅広く指す語。","ph":"stand in line","phm":"列に並ぶ","ex":"We had to stand in line for an hour to buy tickets.","exm":"チケットを買うために私たちは1時間列に並ばなければならなかった。","us":"イギリス英語では queue をよく使うが、アメリカ英語では stand in line が一般的な可算名詞である。","tip":"「線」から「列」「行」「セリフ」まで意味が広がった語。文脈ごとの訳し分けを意識して覚える。"},{"w":"luck","pos":"名","m":"運；幸運","nu":"自分の力ではどうにもならない偶然の巡り合わせを指す語。","ph":"good luck","phm":"幸運を祈る","ex":"Good luck on your exam next week, I know you can do it.","exm":"来週の試験、頑張ってね、あなたならできるよ。","us":"不可算名詞なので a luck とは言わない。Good luck! は励ましの決まり文句として日常でよく使う。","tip":"形容詞形 lucky（幸運な）とセットで覚え、対義語の unlucky も一緒に押さえておく。"},{"w":"machine","pos":"名","m":"機械","nu":"動力を使って作業を行う装置を指し、人の労力を代わりに行うものを表す語。","ph":"a washing machine","phm":"洗濯機","ex":"The washing machine in our house broke down yesterday.","exm":"我が家の洗濯機が昨日壊れてしまった。","us":"具体的な一台一台は可算名詞として扱い、vending machine（自動販売機）など複合語で使われることが多い。","tip":"マシンという日本語のカタカナ語とほぼ同じ意味なので覚えやすい。robot との違いは自動判断能力の有無。"},{"w":"magazine","pos":"名","m":"雑誌","nu":"定期的に発行される、記事や写真をまとめた冊子を指す語。","ph":"read a magazine","phm":"雑誌を読む","ex":"I like to read a fashion magazine while waiting for the bus.","exm":"私はバスを待つ間、ファッション雑誌を読むのが好きだ。","us":"newspaper と違い、magazine は週刊・月刊など定期的に出る綴じられた冊子を指す可算名詞である。","tip":"newspaper との違い（紙一枚の新聞か、綴じられた冊子か）を意識すると混同しない。"},{"w":"matter","pos":"名","m":"問題；事柄","nu":"話題として取り上げられる事柄や、重要な意味を持つ内容を指す語。","ph":"a matter of time","phm":"時間の問題","ex":"This matter is more serious than most students seem to realize.","exm":"この問題は、ほとんどの生徒が気づいている以上に深刻だ。","us":"It doesn't matter. のように動詞としても使われるが、名詞では as a matter of fact（実は）などの表現で頻出する。","tip":"subject（話題）と似るが、matter は「重要性・問題性」を含むニュアンスがある点で区別する。"},{"w":"medicine","pos":"名","m":"薬；医学","nu":"病気を治すための薬、または病気の治療を研究する学問を指す語。","ph":"take medicine","phm":"薬を飲む","ex":"You should take medicine and rest well when you have a cold.","exm":"風邪をひいたら薬を飲んでしっかり休んだ方がいい。","us":"「薬を飲む」は drink ではなく take medicine と言う。不可算名詞として扱うことが多い。","tip":"study medicine で「医学を学ぶ」の意味にもなる。drug（薬、時に違法薬物）との使い分けに注意する。"},{"w":"member","pos":"名","m":"メンバー；会員；一員","nu":"学校のクラブや会社などの組織に所属している人の一人一人を指す語。","ph":"a member of the club","phm":"クラブの一員","ex":"She is an active member of the tennis club at school.","exm":"彼女は学校のテニス部の活発な一員だ。","us":"a member of ~ の形でよく使い、family member（家族の一員）のような複合語表現も頻出する。","tip":"membership（会員資格）とセットで覚えると語彙が広がる。"},{"w":"message","pos":"名","m":"メッセージ；伝言","nu":"誰かに何かを伝えるために送られる、短い文章や内容を指す語。","ph":"send a message","phm":"メッセージを送る","ex":"Could you send a message to Tom about the club meeting?","exm":"クラブの集まりについてトムにメッセージを送ってくれる?","us":"leave a message（伝言を残す）もよく使う表現で、可算名詞として数えられる。","tip":"text message（携帯メール）のように今は電子的な連絡手段としても使われることが多い。"},{"w":"mind","pos":"名","m":"心；精神；頭","nu":"考えたり感じたりする働きをする心・頭脳の部分を指す語。","ph":"change one's mind","phm":"考えを変える","ex":"I decided to change my mind about joining the drama club.","exm":"私は演劇部に入ることについて考えを変えることにした。","us":"Never mind.（気にしないで）や Do you mind if ~?（〜してもいい?）など会話表現でも頻出する。","tip":"heart（感情の心）と mind（理性の心）の違いを対にして覚えると使い分けやすい。"},{"w":"mistake","pos":"名","m":"間違い；誤り","nu":"意図していなかったのに起きてしまった誤りや失敗を指す語。","ph":"make a mistake","phm":"間違いをする","ex":"Everyone makes a mistake sometimes, so don't worry too much.","exm":"誰でも時には間違いをするので、あまり心配しなくていい。","us":"「間違いをする」は do ではなく make a mistake と言う点に日本人学習者は注意が必要である。","tip":"mis-（誤った）+take（取る）が語源。by mistake（間違って）という表現もあわせて覚える。"},{"w":"moment","pos":"名","m":"瞬間；ちょっとの間","nu":"とても短い時間の一区切りを指し、特定の一瞬を強調する語。","ph":"at the moment","phm":"今のところ","ex":"Wait a moment, I need to find my phone before we leave.","exm":"ちょっと待って、出かける前に携帯電話を探さないと。","us":"for a moment（少しの間）、at the moment（現時点で）などの前置詞句でよく使われる可算名詞である。","tip":"moment は秒や分のように長さが決まった単位ではなく、「ほんの少しの間」という感覚的な短さを表す語。文脈によって一瞬にも数分にもなりうる点に注意する。"},{"w":"mountain","pos":"名","m":"山","nu":"周囲の土地より高くそびえ立つ、大きくて険しい地形を指す語。","ph":"climb a mountain","phm":"山に登る","ex":"Our club plans to climb a mountain during the summer vacation.","exm":"私たちの部活は夏休みに山に登る予定だ。","us":"hill（丘）より高く険しい地形を指し、Mount Fuji のように固有名詞では Mount を使う。","tip":"hill との高さの違いを意識すると使い分けやすい。mountain bike のような複合語も日常でよく登場する。"},{"w":"museum","pos":"名","m":"博物館；美術館","nu":"歴史的な物や芸術作品を集めて展示している施設を指す語。","ph":"visit a museum","phm":"博物館を訪れる","ex":"Our class will visit a museum in Tokyo next Friday.","exm":"私たちのクラスは来週の金曜日、東京の博物館を訪れる予定だ。","us":"美術専門の場合は art museum、gallery とも呼ばれる可算名詞である。","tip":"library（図書館）と違い、本ではなく物や作品を展示する施設だと区別して覚える。"},{"w":"nature","pos":"名","m":"自然；性質","nu":"人の手が加わっていない自然界全体、または物事が本来持つ性質を指す語。","ph":"love nature","phm":"自然を愛する","ex":"Many people visit this area because they love nature so much.","exm":"多くの人がこの地域を訪れるのは、自然をとても愛しているからだ。","us":"「自然」の意味では通常無冠詞の不可算名詞で、human nature（人間の本性）のように「性質」の意味でも使われる。","tip":"natural（自然の）という形容詞形とセットで覚え、環境問題の文章でも頻出することを意識する。"},{"w":"news","pos":"名","m":"ニュース；知らせ","nu":"世の中で最近起きた出来事についての新しい情報を指す語。","ph":"watch the news","phm":"ニュースを見る","ex":"My father likes to watch the news every morning before work.","exm":"父は仕事前に毎朝ニュースを見るのが好きだ。","us":"形は複数形に見えるが不可算名詞で、動詞は単数扱い（The news is ~）になる点に注意する。","tip":"語末の s に惑わされず単数扱いすることを覚える。a piece of news で「一つの知らせ」と数える。"},{"w":"noise","pos":"名","m":"騒音；物音","nu":"人がうるさいと感じるような音や、耳障りな物音を指す語。","ph":"make noise","phm":"騒音を立てる","ex":"Please don't make noise in the library while others are studying.","exm":"他の人が勉強している間、図書館で騒音を立てないでください。","us":"sound（音全般、中立的）と違い、noise はうるさい・不快なニュアンスを持つ不可算名詞である。","tip":"sound との違い（中立か不快か）を対比して覚えると使い分けやすい。noisy（うるさい）という形容詞形も重要。"},{"w":"number","pos":"名","m":"数；数字；番号","nu":"物の量を表す数字や、順序・識別のための番号を指す語。","ph":"a phone number","phm":"電話番号","ex":"Can I have your phone number so I can call you later?","exm":"後で電話できるように、あなたの電話番号を教えてもらえる?","us":"a number of ~ で「いくつかの〜」という意味になる可算名詞である。","tip":"amount（量、不可算名詞に使う）との違いを意識し、数えられるものには number を使うと覚える。"},{"w":"ocean","pos":"名","m":"海洋；大洋","nu":"地球を覆う広大な海全体を指し、sea よりも規模が大きいニュアンスを持つ語。","ph":"across the ocean","phm":"海を越えて","ex":"My cousin moved across the ocean to study in Australia.","exm":"いとこはオーストラリアに留学するため海を越えて引っ越した。","us":"sea より広大で、Pacific Ocean のように固有名詞にも使われる。可算・不可算どちらの用法もある。","tip":"sea（比較的狭い海域）と ocean（世界の五大洋のような広大な海）の規模の違いで区別する。"},{"w":"office","pos":"名","m":"事務所；会社；オフィス","nu":"会社などで人々が仕事をするための部屋や建物全体を指す語。","ph":"at the office","phm":"会社で","ex":"My father usually stays late at the office on Fridays.","exm":"父は金曜日はたいてい会社に遅くまで残っている。","us":"「会社にいる」は at the office と言い、in the office よりも一般的に使われる可算名詞である。","tip":"company（組織そのもの）と office（働く場所）の違いを意識すると混同しにくい。"},{"w":"opinion","pos":"名","m":"意見；考え","nu":"ある事柄について個人が持っている考えや判断、見解を指す語。","ph":"in my opinion","phm":"私の意見では","ex":"In my opinion, this is the best way to solve the problem.","exm":"私の意見では、これがその問題を解決する最善の方法だ。","us":"In my opinion, ~ の形で自分の意見を述べる際に頻出し、have an opinion の形でもよく使う可算名詞である。","tip":"idea（思いつき）より根拠のある「見解」を表すニュアンスが強い語だと区別する。"},{"w":"part","pos":"名","m":"部分；役割","nu":"全体を構成するひとつの要素や、劇などでの役割を指す語。","ph":"take part in","phm":"〜に参加する","ex":"I want to take part in the school speech contest this year.","exm":"私は今年、学校のスピーチコンテストに参加したい。","us":"take part in ~（〜に参加する）は participate in と同義でよく使われる重要表現である。","tip":"whole（全体）の対義語として part（部分）を対にして覚えると理解しやすい。"},{"w":"peace","pos":"名","m":"平和","nu":"戦争や争いがなく、人々が穏やかで安定して暮らせる状態を指す語。","ph":"world peace","phm":"世界平和","ex":"Students in our class discussed how to achieve world peace.","exm":"私たちのクラスの生徒たちは世界平和をどう実現するか話し合った。","us":"不可算名詞として扱い、a peace とは基本的に言わない。peace and quiet（静けさ）という表現もある。","tip":"形容詞形 peaceful（平和な）や war（戦争）という対義語とセットで覚える。"},{"w":"person","pos":"名","m":"人","nu":"一人の人間を指す語で、性別や年齢を問わない一般的な言い方である。","ph":"a kind person","phm":"親切な人","ex":"My grandmother is the kindest person I have ever met.","exm":"祖母は私が今まで会った中で一番親切な人だ。","us":"複数形は persons ではなく people を使うのが一般的で、in person（直接会って）という表現も頻出する。","tip":"people との使い分け（単数は person、複数は people）を意識すると自然な英語になる。"},{"w":"planet","pos":"名","m":"惑星","nu":"太陽の周りを回る星のことで、地球もその一つとされる語。","ph":"protect the planet","phm":"地球を守る","ex":"We should protect the planet by using less plastic every day.","exm":"私たちは毎日プラスチックの使用を減らして地球を守るべきだ。","us":"the planet だけで「地球」を指す環境問題の文脈での用法が多い可算名詞である。","tip":"Earth（地球という固有名詞）と planet（惑星という一般名詞）の違いを意識すると使い分けやすい。"},{"w":"plant","pos":"名","m":"植物；工場","nu":"土から育つ緑の生き物、または物を製造する施設を指す語。","ph":"water the plant","phm":"植物に水をやる","ex":"I always water the plant on my desk before going to school.","exm":"私は学校に行く前にいつも机の植物に水をやる。","us":"動詞では「植える」の意味にもなる点に注意する。工場の意味では factory とほぼ同義で使われる。","tip":"動詞「植える」と名詞「植物」の両方の意味を持つ語なので文脈で判断する練習をしておく。"},{"w":"pocket","pos":"名","m":"ポケット","nu":"服やかばんについている、小物を入れる袋状の部分を指す語。","ph":"in my pocket","phm":"ポケットの中に","ex":"I always keep my phone in my pocket during practice.","exm":"私は練習中いつも携帯電話をポケットの中に入れている。","us":"pocket money（お小遣い）のような複合語も日常会話でよく使われる可算名詞である。","tip":"pocket money（お小遣い）という表現とセットで覚えると語彙が広がる。"},{"w":"point","pos":"名","m":"点；要点；得点","nu":"議論の中心となる要点や、試合での得点、地図上の一地点などを指す語。","ph":"a good point","phm":"いい指摘","ex":"That's a good point, but I still disagree with your conclusion.","exm":"それはいい指摘だけど、私はあなたの結論にはまだ賛成できない。","us":"get to the point（要点を言う）、there's no point in ~（〜しても無意味だ）など会話表現が豊富な可算名詞である。","tip":"score（得点）と似た意味でも使われるが、point は議論の「要点」という抽象的な意味も持つ点が特徴。"},{"w":"police","pos":"名","m":"警察","nu":"法律を守らせ、犯罪を取り締まる仕事をする組織を指す語。","ph":"call the police","phm":"警察を呼ぶ","ex":"Someone decided to call the police after the accident happened.","exm":"事故が起きた後、誰かが警察を呼ぶことにした。","us":"常に複数扱いの集合名詞で、The police are ~ のように動詞は複数形になる。a police のようには使わない。","tip":"一人の警察官を指すときは a police officer と言い、police 単独では使わない点に注意する。"},{"w":"vacation","pos":"名","m":"休暇；休み","nu":"長期の休みを指す語で、学校や仕事を離れてゆっくり過ごす期間を表す。","ph":"go on vacation","phm":"休暇に出かける","ex":"My family plans to go on vacation to Okinawa this summer.","exm":"私の家族はこの夏、沖縄へ休暇旅行に行く予定だ。","us":"アメリカ英語で「休暇」を表す一般的な語で、イギリス英語ではholidayが使われることが多い。前置詞onと共に使うことが多い。","tip":"vacate（空にする）と語源が近く、日常の場を「空けて」離れる休みだとイメージすると覚えやすい。"},{"w":"present","pos":"名","m":"贈り物；現在","nu":"贈り物の意味と「今この時」という意味を持ち、文脈で意味が変わる語だ。","ph":"a birthday present","phm":"誕生日プレゼント","ex":"She opened the present her friend gave her carefully.","exm":"彼女は友達がくれたプレゼントを丁寧に開けた。","us":"名詞のときは前の音節にアクセント（PREsent）、動詞「贈る・提示する」のときは後ろにアクセント（preSENT）が置かれる。","tip":"「今そこに(present)ある物」から「贈り物」の意味が生まれたと考えると関連づけて覚えられる。"},{"w":"price","pos":"名","m":"値段；価格","nu":"商品やサービスに支払うべき金額を表す最も基本的な語だ。","ph":"at a low price","phm":"安い値段で","ex":"The store sells fresh vegetables at a reasonable price.","exm":"その店は新鮮な野菜を手頃な価格で売っている。","us":"可算名詞として扱われ、値段を尋ねるときはWhat is the price of ~?を使う。costは動詞としてもよく使われる点が異なる。","tip":"priceless（値がつけられないほど貴重な）という語と合わせて覚えると理解が深まる。"},{"w":"prize","pos":"名","m":"賞；賞品","nu":"競技やコンテストで優れた成績に対して与えられる賞や賞品を指す。","ph":"win first prize","phm":"一等賞を取る","ex":"He worked hard and finally won the first prize.","exm":"彼は懸命に努力し、ついに一等賞を獲得した。","us":"winと結びついて「賞を取る」という意味になることが多く、動詞にはgetも使われる。priceと綴りが似ているので混同しないよう注意。","tip":"prizeのzは「賞」、priceのcは「値段」と、綴りの違いで意味を区別して覚える。"},{"w":"problem","pos":"名","m":"問題","nu":"解決すべき困った事柄や課題を指し、questionより深刻な内容に使う。","ph":"solve a problem","phm":"問題を解決する","ex":"Our team met to discuss a problem with the schedule.","exm":"私たちのチームは予定に関する問題を話し合うために集まった。","us":"have a problem with ~で「~に関して問題がある」という表現になり、日常会話でも頻繁に使われる。","tip":"「解決する」動詞のsolveとセットで覚えると、使い方が自然に身につく。"},{"w":"program","pos":"名","m":"番組；計画","nu":"テレビ番組から学習計画まで、順序立てられた内容全般を表す語だ。","ph":"a TV program","phm":"テレビ番組","ex":"We watched an interesting program about ocean animals last night.","exm":"私たちは昨晩、海洋動物についての面白い番組を見た。","us":"イギリス英語ではprogrammeと綴ることが多いが、コンピューター関連では両者ともprogramと綴る。","tip":"「予定・計画」というschedule系の意味も持つので、単なる「番組」だけでなく広い文脈で捉える。"},{"w":"project","pos":"名","m":"計画；企画","nu":"目的を持って組織的に進める計画や事業を指し、学校の課題にも使われる。","ph":"work on a project","phm":"プロジェクトに取り組む","ex":"Our class started a new project about protecting the environment.","exm":"私たちのクラスは環境保護についての新しいプロジェクトを始めた。","us":"名詞ではPROject、動詞「見積もる・投影する」ではproJECTとアクセント位置が変わる。","tip":"pro-（前へ）+ject（投げる）が語源で、「前に投げ出す計画」というイメージで覚える。"},{"w":"purpose","pos":"名","m":"目的","nu":"行動や物事の背後にある狙いや目標を表すフォーマルな語だ。","ph":"for this purpose","phm":"この目的のために","ex":"The purpose of this meeting is to plan the school festival.","exm":"この会議の目的は学園祭を計画することだ。","us":"on purpose で「わざと、故意に」という熟

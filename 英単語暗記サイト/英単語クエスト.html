"～する勇気を持つ","ex":"It took real courage to speak in front of everyone.","exm":"みんなの前で話すには本当の勇気が必要だった。","us":"have the courage to do（～する勇気を持つ）の形が頻出。不可算名詞として使うことが多い。","tip":"形容詞courageous（勇敢な）と一緒に、心の強さを表す語だと意識して覚える。"},{"w":"crime","pos":"名","m":"犯罪","nu":"法律に違反する行為を表す名詞で、道徳的な過ちよりも法的な違反行為を指す。","ph":"commit a crime","phm":"犯罪を犯す","ex":"The number of crime cases in this town has decreased.","exm":"この町での犯罪件数は減少している。","us":"commit a crime（犯罪を犯す）という組み合わせが頻出。可算・不可算どちらでも使われる。","tip":"形容詞criminal（犯罪の・犯人）と関連づけて覚えると語彙が広がる。"},{"w":"degree","pos":"名","m":"程度；度；学位","nu":"程度や度合いを表す語で、温度・角度の「度」や大学の「学位」の意味でも使う。","ph":"to some degree","phm":"ある程度は","ex":"I agree with your opinion to some degree, but not fully.","exm":"私はある程度あなたの意見に賛成だが、完全にではない。","us":"可算名詞。\"to a degree\"で「ある程度」、\"a degree in ~\"で「〜の学位」という意味になる。","tip":"語源はラテン語の「一段一段の階段」。段階を刻んで測るイメージで温度・程度・学位のどれにも使うと覚える。"},{"w":"demand","pos":"名","m":"要求；需要","nu":"強く求める要求や、商品・労働力が必要とされる「需要」の高さを表す語。","ph":"in demand","phm":"需要がある","ex":"There is a high demand for tickets to the concert.","exm":"そのコンサートのチケットには高い需要がある。","us":"\"demand for ~\"の形で使うことが多い。requestより強く「当然の権利として要求する」響きがある動詞用法もある。","tip":"対義語はsupply(供給)。「需要と供給」はsupply and demandとセットで覚えると忘れにくい。"},{"w":"detail","pos":"名","m":"詳細；細部","nu":"全体の中にある、一つ一つの細かい情報や部分を指す語。","ph":"in detail","phm":"詳細に","ex":"Please explain the plan for the trip in detail.","exm":"旅行の計画を詳しく説明してください。","us":"可算名詞で複数形detailsは「詳細情報」の意味。\"in detail\"は「詳しく」という副詞的な熟語。","tip":"動詞detail(詳しく述べる)としても使う。「細かく切り分ける」イメージから細部の意味になったと考えると覚えやすい。"},{"w":"direction","pos":"名","m":"方向；指示","nu":"進むべき方角や道筋、また物事を導く指示・指導を表す語。","ph":"sense of direction","phm":"方向感覚","ex":"The compass showed the wrong direction during our hike.","exm":"そのコンパスはハイキング中に間違った方向を示した。","us":"複数形directionsで「道案内・使用説明」の意味になる。動詞directの名詞形として覚える。","tip":"direct(指導する・向ける)にionをつけた形。矢印が指す先をイメージすると覚えやすい。"},{"w":"duty","pos":"名","m":"義務；職務","nu":"立場上果たすべき責任や、仕事上で任される役割を表す語。","ph":"on duty","phm":"勤務中で","ex":"The nurse was on duty all night at the hospital.","exm":"その看護師は病院で一晩中勤務していた。","us":"可算・不可算どちらもある。\"on duty\"は「勤務中」、\"off duty\"は「非番」を表す。","tip":"due(当然払うべき)から派生した語。「当然すべきこと」というイメージで義務の意味を覚える。"},{"w":"image","pos":"名","m":"印象；像","nu":"人が抱く印象・イメージや、目に見える映像・画像を表す語。","ph":"public image","phm":"世間のイメージ","ex":"The company wants to improve its image among young people.","exm":"その会社は若者の間でのイメージを良くしたいと思っている。","us":"可算名詞。\"public image\"や\"positive image\"のように形容詞と結びつく形で頻出する。","tip":"imagine(想像する)と同語源。頭の中に描かれる「像」だと考えると覚えやすい。"},{"w":"journey","pos":"名","m":"旅；道のり","nu":"出発から到着までの長い移動や過程を指す語で、tripより長く感じられることが多い。","ph":"go on a journey","phm":"旅に出る","ex":"Our journey to the mountain village took almost six hours.","exm":"山あいの村までの旅には6時間近くかかった。","us":"可算名詞。陸路の長距離移動によく使われ、比喩的に「人生の道のり」の意味でも使われる。","tip":"フランス語のjour(1日)が語源で、もとは「1日分の旅程」の意味だった。"},{"w":"manner","pos":"名","m":"方法；態度；行儀","nu":"物事のやり方や人の振る舞い方を表す語で、複数形mannersは「礼儀作法」を指す。","ph":"in a friendly manner","phm":"親しみやすい態度で","ex":"The teacher spoke to us in a friendly manner.","exm":"先生は私たちに親しみやすい態度で話しかけた。","us":"単数で「方法・様子」、複数形mannersで「マナー・行儀」の意味になる点に注意する。","tip":"manus(手)に由来する語で、「手のやり方」から「方法・態度」の意味に発展したと考えると覚えやすい。"},{"w":"position","pos":"名","m":"位置；地位；立場","nu":"物の置かれた場所や、社会・組織内での地位・立場を表す語。","ph":"apply for a position","phm":"職に応募する","ex":"She applied for a new position at the company.","exm":"彼女はその会社の新しい職に応募した。","us":"可算名詞。jobよりやや形式的で「職位・地位」の意味で使われることが多い。","tip":"posit(置く)にionをつけた形。「置かれた場所」が原義だと考えると位置も地位も理解しやすい。"},{"w":"pressure","pos":"名","m":"圧力；プレッシャー","nu":"物理的な圧力だけでなく、精神的な負担やストレスも表す語。","ph":"under pressure","phm":"プレッシャーの中で","ex":"He performed well even under a lot of pressure.","exm":"彼は大きなプレッシャーの中でもうまくやり遂げた。","us":"不可算名詞が基本。\"under pressure\"や\"pressure to do ~\"の形で頻出する。","tip":"press(押す)から派生した語。試験前に感じる「押しつぶされそうな重さ」をイメージすると覚えやすい。"},{"w":"sight","pos":"名","m":"視力；光景","nu":"目で物を見る能力や、実際に目に映る景色・光景を表す語。","ph":"at first sight","phm":"一目見て","ex":"It was love at first sight when they met.","exm":"二人が出会ったのは一目惚れだった。","us":"視力の意味では不可算、光景の意味では可算になる。\"catch sight of ~\"は「〜をちらっと見る」という熟語。","tip":"動詞seeの名詞形。「見る力・見えるもの」とセットで覚えると忘れにくい。"},{"w":"view","pos":"名","m":"眺め；見解","nu":"窓などから見える景色や、物事に対する個人的な考え方を表す語。","ph":"in my view","phm":"私の見解では","ex":"In my view, the new rule is too strict for students.","exm":"私の見解では、その新しい規則は生徒にとって厳しすぎる。","us":"可算名詞。\"point of view\"(観点)や\"in view of ~\"(〜を考慮して)などの熟語も重要。","tip":"opinionより「実際に見て感じた個人的な見え方」というニュアンスが強い語だと覚える。"},{"w":"basic","pos":"形","m":"基本的な","nu":"物事の土台となる、最も基本的で必要不可欠な部分を表す語。","ph":"basic knowledge","phm":"基礎知識","ex":"This textbook covers only the most basic grammar rules for beginners.","exm":"この教科書は初心者向けの最も基本的な文法規則しか扱っていない。","us":"名詞の前に置いて使うことが多い形容詞。名詞形basics(基本・基礎)もセットで覚えておきたい。","tip":"base(土台)の形容詞形。「土台となる」というイメージで覚えると応用も理解しやすい。"},{"w":"calm","pos":"形","m":"落ち着いた；穏やかな","nu":"心が乱れず静かで落ち着いている状態や、風・海が穏やかな様子を表す語。","ph":"stay calm","phm":"冷静でいる","ex":"Try to stay calm before the exam starts tomorrow.","exm":"明日の試験が始まる前は落ち着いていようとしなさい。","us":"形容詞のほか\"calm down\"(落ち着く・なだめる)という動詞句でも使う。excitedやnervousの対義語として覚えると良い。","tip":"lの音をほとんど発音しない点に注意。calm downとセットで音読して覚える。"},{"w":"certain","pos":"形","m":"確信している；確実な；ある","nu":"話し手が強い確信を持っている状態や、特定できるが名前を伏せた「ある〜」を表す語。","ph":"be certain of","phm":"〜を確信している","ex":"I am certain that our team will win the match.","exm":"私はチームがその試合に勝つと確信している。","us":"\"certain that ~\"や\"certain of ~\"の形をとる。「ある特定の」の意味では名詞の前に置いて使う。","tip":"sureとほぼ同義だが、certainの方がやや客観的で断定的な響きを持つと覚えておく。"},{"w":"clear","pos":"形","m":"明らかな；澄んだ","nu":"意味や視界がはっきりしていて理解しやすい、または透き通っている様子を表す語。","ph":"make it clear","phm":"それをはっきりさせる","ex":"The teacher made the homework instructions very clear.","exm":"先生は宿題の指示をとても明確にしてくれた。","us":"形容詞のほか動詞(片付ける・晴れる)としても頻出する。\"be clear about ~\"で「〜について明確である」の意味。","tip":"「濁りがない」がコアイメージ。空が澄んでいても説明が分かりやすくてもclearが使えると覚える。"},{"w":"curious","pos":"形","m":"好奇心の強い；奇妙な","nu":"知りたいという強い興味を持つ様子、または変わっていて興味を引く様子を表す語。","ph":"curious about","phm":"〜に興味がある","ex":"My little sister is curious about how volcanoes erupt.","exm":"妹は火山がどう噴火するのか興味を持っている。","us":"\"curious about ~\"の形が基本。interestedより「知りたくてたまらない」という積極性が強い。","tip":"名詞形curiosity(好奇心)とセットで覚える。「好奇心が強い」がcuriousの中心イメージ。"},{"w":"eager","pos":"形","m":"熱心な；切望して","nu":"何かを強く望み、待ちきれないほど意欲的な気持ちを表す語。","ph":"eager to learn","phm":"学ぶことに熱心な","ex":"The new students were eager to join the soccer club.","exm":"新入生たちはサッカー部に入ることに意欲的だった。","us":"\"eager to do ~\"の形で使うことが多い。willingより意欲の度合いが強い点に注意する。","tip":"「今すぐにでもやりたい」という前のめりな気持ちをイメージすると覚えやすい。"},{"w":"exact","pos":"形","m":"正確な；まさにその","nu":"誤差や曖昧さが全くなく、細部までぴったり合っている様子を表す語。","ph":"the exact time","phm":"正確な時刻","ex":"Nobody knew the exact number of students in the hall.","exm":"ホールにいる生徒の正確な人数は誰も知らなかった。","us":"accurateと似るが、exactは「寸分の狂いもない」というニュアンスが強い。\"to be exact\"は「正確に言うと」という副詞句。","tip":"副詞形exactly(ちょうど・正確に)とセットで覚えると会話でも使いやすくなる。"},{"w":"fair","pos":"形","m":"公平な；かなりの","nu":"ルールや扱いが偏らず公正である様子を表す語で、「相当な」「色白の」の意味もある。","ph":"a fair chance","phm":"公平なチャンス","ex":"It is not fair to blame him for everyone's mistake.","exm":"みんなの失敗を彼のせいにするのは公平ではない。","us":"対義語はunfair。\"fair enough\"で「まあ妥当だ」という会話表現もよく使われる。","tip":"野球などスポーツの「フェア」と同じ語。ルールの中で平等であることをイメージすると覚えやすい。"}],"p3":[{"w":"accomplish","pos":"動","m":"成し遂げる；達成する","nu":"目標や困難な仕事を努力の末にやり遂げるという達成感を伴う語。","ph":"accomplish a goal","phm":"目標を達成する","ex":"She worked hard to accomplish her goal before graduation.","exm":"彼女は卒業前に目標を達成しようと懸命に努力した。","us":"他動詞で目的語に成果や目標をとる。accomplish a goal/task/missionの形が多い。","tip":"achieveとほぼ同義だが、accomplishは困難を乗り越えた達成感を強調する語。"},{"w":"acquire","pos":"動","m":"習得する；獲得する","nu":"時間をかけて努力や経験を通じて知識・技能・財産などを身につける意味。","ph":"acquire a new skill","phm":"新しい技能を身につける","ex":"He managed to acquire fluency in English during his stay abroad.","exm":"彼は留学中に英語の流暢さを身につけることができた。","us":"acquire + skill/knowledge/habitなど、身につける対象を目的語にとる。getより硬い表現。","tip":"名詞acquisition（習得・取得）とセットで覚える。「身につける」イメージが強い。"},{"w":"acknowledge","pos":"動","m":"認める；謝意を示す","nu":"事実・存在・功績などを公に認めたり感謝の気持ちを表したりする語。","ph":"acknowledge the problem","phm":"問題を認める","ex":"The teacher will acknowledge that the test was too difficult.","exm":"先生はそのテストが難しすぎたと認めるだろう。","us":"acknowledge that節、またはacknowledge + 名詞の形をとる。admitより穏やかで公式な響きを持つ。","tip":"knowを含む語で「知っていると認める」がコアイメージ。名詞はacknowledgement。"},{"w":"adapt","pos":"動","m":"適応する；改作する","nu":"新しい環境や条件に自分や物事を合わせて変化させる語。","ph":"adapt to change","phm":"変化に適応する","ex":"New students must adapt to the busy school schedule quickly.","exm":"新入生は忙しい学校のスケジュールに素早く適応しなければならない。","us":"自動詞ではadapt to ~、他動詞ではadapt A to Bの形をとる。","tip":"adjustと似るが、adaptは環境に合わせた根本的な変化を、adjustは細かな微調整を表す。"},{"w":"adjust","pos":"動","m":"調整する；順応する","nu":"状況に合わせて位置や設定などを細かく合わせ直す語。","ph":"adjust the schedule","phm":"予定を調整する","ex":"The coach decided to adjust the training plan for beginners.","exm":"コーチは初心者向けに練習計画を調整することにした。","us":"adjust to ~（順応する）とadjust A（Aを調整する）の両方の形がある。","tip":"adaptより小さな変化に使う。fine-tuningのような微調整のイメージを持つとよい。"},{"w":"advocate","pos":"動","m":"主張する；提唱する","nu":"ある考え・政策・行動が正しいと公に強く支持し訴える語。","ph":"advocate for change","phm":"変化を訴える","ex":"Many students advocate for shorter exams and more discussion time.","exm":"多くの生徒が試験の短縮と議論時間の増加を訴えている。","us":"advocate for ~／advocate that節の形をとる。名詞でも同形でadvocate（主張者）を表す。","tip":"動詞と名詞（主張者）が同形。voiceに近い語源で「声を上げて支持する」イメージ。"},{"w":"analyze","pos":"動","m":"分析する","nu":"物事を細かい要素に分けて仕組みや原因を詳しく調べる語。","ph":"analyze the data","phm":"データを分析する","ex":"Students often analyze the survey results for their science project.","exm":"生徒たちはよく科学の課題のためにアンケート結果を分析する。","us":"他動詞でanalyze + 名詞の形をとる。名詞形はanalysis、形容詞形はanalytical。","tip":"イギリス英語ではanalyseと綴る。「細かく分ける」が語源のコアイメージ。"},{"w":"anticipate","pos":"動","m":"予期する；見越す","nu":"将来起こりそうな出来事を前もって予測し、備えておく語。","ph":"anticipate a problem","phm":"問題を予期する","ex":"The team must anticipate heavy rain and move the game indoors.","exm":"チームは大雨を予期して試合を屋内に移さなければならない。","us":"anticipate + 名詞／動名詞の形をとる。expectより予測して備える含みが強い。","tip":"expectと似るが、anticipateは予測して準備する行動を伴うニュアンスが強い。"},{"w":"appreciate","pos":"動","m":"感謝する；理解する","nu":"物事の価値・良さを正しく認めたり、恩恵に感謝したりする語。","ph":"appreciate your help","phm":"あなたの助けに感謝する","ex":"I really appreciate your help with my homework tonight.","exm":"今夜の宿題を手伝ってくれて本当に感謝している。","us":"他動詞で通常進行形にしない。appreciate + 名詞／動名詞の形をとる。","tip":"Thank youより丁寧な感謝表現。「価値を認める」が語源のコアイメージ。"},{"w":"approve","pos":"動","m":"承認する；賛成する","nu":"計画・行動・人などを正式に、または個人的によいと認める語。","ph":"approve the plan","phm":"計画を承認する","ex":"The principal will finally approve the plan for the school festival.","exm":"校長先生はついに学園祭の計画を承認するだろう。","us":"approve of ~（個人的に賛成する）とapprove ~（正式に承認する）で意味合いが少し異なる。","tip":"対義語はdisapprove。「よいと認める」がコアで、名詞approvalとセットで覚える。"},{"w":"arise","pos":"動","m":"生じる；起こる","nu":"問題や状況が自然に、あるいは何かの結果として発生する語。","ph":"issues arise","phm":"問題が生じる","ex":"New problems often arise when the printer suddenly stops working.","exm":"プリンターが突然止まると、新たな問題がよく生じる。","us":"自動詞で人を主語にとらない。arise-arose-arisenと不規則変化する点に注意。","tip":"riseと語源が近く「立ち上がる→生じる」のイメージ。occurと似るが原因から生じる含みがある。"},{"w":"assess","pos":"動","m":"評価する；査定する","nu":"価値・能力・状況などを注意深く調べて判断を下す語。","ph":"assess the situation","phm":"状況を評価する","ex":"Teachers assess students' progress through regular short quizzes.","exm":"教師たちは定期的な小テストを通じて生徒の進歩を評価する。","us":"他動詞でassess + 名詞の形をとる。名詞形はassessment。","tip":"evaluateとほぼ同義。assessは特に基準や数値に基づく判定に使われやすい。"},{"w":"assign","pos":"動","m":"割り当てる；任命する","nu":"仕事・役割・場所などを特定の人に割り振って与える語。","ph":"assign homework","phm":"宿題を出す","ex":"The teacher will assign homework based on today's lesson.","exm":"先生は今日の授業内容に基づいて宿題を出す予定だ。","us":"assign A to B、またはassign B Aの形でBにAを割り当てる意味を表す。","tip":"名詞assignment（課題・任務）とセットで覚えると使い方が広がる。"},{"w":"associate","pos":"動","m":"関連付ける；付き合う","nu":"二つの物事を心の中で結びつけたり、人と交流したりする語。","ph":"associate with friends","phm":"友人と付き合う","ex":"Many people associate summer vacation with beaches and fireworks.","exm":"多くの人が夏休みと海や花火を結びつけて考える。","us":"associate A with B（AをBと結びつける）、associate with ~（人と交際する）の形をとる。","tip":"名詞association（協会・連想）、associate（仲間）と関連づけて覚える。"},{"w":"assume","pos":"動","m":"想定する；引き受ける","nu":"証拠がなくても何かを当然のこととして受け止める語。","ph":"assume the worst","phm":"最悪の事態を想定する","ex":"Don't assume that everyone in class agrees with your opinion.","exm":"クラスの全員が君の意見に賛成していると思い込んではいけない。","us":"assume that節の形が多い。「責任を引き受ける」assume responsibilityの意味もある。","tip":"名詞assumption（仮定）と合わせて覚える。guessより確信度が高い思い込みを表す。"},{"w":"attach","pos":"動","m":"添付する；取り付ける","nu":"物理的または比喩的に何かを別のものにくっつける語。","ph":"attach a file","phm":"ファイルを添付する","ex":"Please attach your essay file to the email tonight.","exm":"今夜、あなたの作文ファイルをメールに添付してください。","us":"attach A to Bの形をとる。受け身be attached to ~（～に愛着がある）も頻出。","tip":"対義語はdetach。「くっつける」イメージからメールの「添付」の意味が生まれた。"},{"w":"attain","pos":"動","m":"達成する；獲得する","nu":"努力を重ねて高い目標や地位に到達するという格式ばった語。","ph":"attain a goal","phm":"目標を達成する","ex":"It took years of practice to attain such a high level.","exm":"そのような高いレベルに達するのに何年もの練習が必要だった。","us":"attain + 名詞（level, goal, success）をとる。achieveより書き言葉的で硬い響き。","tip":"名詞attainment（達成）とセットで覚える。頂上に手が届くイメージを持つとよい。"},{"w":"attribute","pos":"動","m":"～のせいにする；～に起因すると考える","nu":"ある結果の原因を特定の人・事柄に結びつけて考える語。","ph":"attribute success to","phm":"成功を～のおかげとする","ex":"She tends to attribute her success to her family's constant support.","exm":"彼女は自分の成功を家族の絶え間ない支えのおかげだと考える傾向がある。","us":"attribute A to B（AをBのせいにする／おかげとする）の形が基本。名詞では発音のアクセント位置が変わる。","tip":"名詞のattribute（特質）とアクセント位置が異なる点に注意して覚える。"},{"w":"calculate","pos":"動","m":"計算する；見積もる","nu":"数字を使って結果を正確に求めたり、慎重に予測したりする語。","ph":"calculate the cost","phm":"費用を計算する","ex":"We must calculate the total cost of the class trip carefully.","exm":"私たちはクラス旅行の総費用を慎重に計算しなければならない。","us":"他動詞でcalculate + 名詞、またはcalculate how/that節をとる。","tip":"名詞calculation、calculator（電卓）と合わせて覚えると定着しやすい。"},{"w":"collapse","pos":"動","m":"崩壊する；倒れる","nu":"建物・体制・体力などが突然支えを失って崩れ落ちる語。","ph":"buildings collapse","phm":"建物が崩壊する","ex":"Old wooden bridges sometimes collapse after a heavy typhoon hits.","exm":"古い木製の橋は時々激しい台風の後に崩壊する。","us":"自動詞で人・建物・制度など幅広い主語をとる。名詞としても同形で使われる。","tip":"com（共に）＋lapse（崩れる）が語源。「支えを失って一気に崩れる」イメージ。"},{"w":"commit","pos":"動","m":"専念する；罪を犯す","nu":"ある行動や努力に責任を持って取り組むことを固く決意する語。","ph":"commit to practice","phm":"練習に打ち込む","ex":"Our team decided to commit to daily practice before the tournament.","exm":"私たちのチームは大会前に毎日の練習に打ち込むことに決めた。","us":"commit to ~ing／名詞（打ち込む）、commit a crime（罪を犯す）の両方の意味がある。","tip":"名詞commitment（献身・約束）とセットで覚えると使い方が広がる。"},{"w":"distribute","pos":"動","m":"配布する；分配する","nu":"物や情報を複数の人や場所に分けて確実に行き渡らせる語。","ph":"distribute handouts","phm":"プリントを配布する","ex":"The teacher asked a student to distribute handouts to everyone.","exm":"先生は生徒の一人に全員へプリントを配るよう頼んだ。","us":"distribute A to B／among Bの形で、AをBに配る意味を表す。","tip":"名詞distribution（配布・分布）と合わせて覚える。「分けて与える」がコアイメージ。"},{"w":"conclude","pos":"動","m":"結論づける；終える","nu":"議論や出来事の最後にある判断を下したり物事を終わらせたりする語。","ph":"conclude that","phm":"～と結論づける","ex":"The committee will conclude that the new rule seems fair enough.","exm":"委員会はその新しい規則は十分公正だと結論づけるだろう。","us":"conclude that節、またはconclude with ~（～で締めくくる）の形をとる。","tip":"名詞conclusion（結論）、in conclusion（結論として）と合わせて覚える。"},{"w":"conduct","pos":"動","m":"実施する；指揮する","nu":"調査・実験・活動などを計画的に行ったり、指揮したりする語。","ph":"conduct a survey","phm":"調査を実施する","ex":"Our class plans to conduct a survey about students' study habits.","exm":"私たちのクラスは生徒の学習習慣についての調査を実施する予定だ。","us":"conduct + research/survey/experimentの形をとる他動詞。名詞conductはアクセント位置が異なる。","tip":"名詞conduct（行動・指揮）はアクセント位置が動詞と異なる点に注意する。"},{"w":"confirm","pos":"動","m":"確認する；確定する","nu":"情報や予定が正しい・確実であることをはっきりさせる語。","ph":"confirm the reservation","phm":"予約を確認する","ex":"Please confirm the meeting time with the club members tomorrow.","exm":"明日、部員たちとミーティングの時間を確認してください。","us":"confirm + 名詞／confirm that節の形をとる。confirm whether ~も可能。","tip":"名詞confirmation（確認）と合わせて覚える。con（完全に）＋firm（固くする）が語源。"},{"w":"conserve","pos":"動","m":"節約する；保護する","nu":"資源やエネルギーなどを無駄にせず大切に保とうとする語。","ph":"conserve energy","phm":"エネルギーを節約する","ex":"Turning off lights helps students conserve energy at school.","exm":"電気を消すことは生徒が学校でエネルギーを節約する助けになる。","us":"他動詞でconserve + 資源・自然（water, energy, forests）をとる。","tip":"preserve（保存する）と似るが、conserveは無駄遣いを防ぐ節約の意味合いが強い。"},{"w":"constitute","pos":"動","m":"構成する；相当する","nu":"いくつかの部分が集まって全体を形作る、あるいは何かに相当する語。","ph":"constitute a majority","phm":"過半数を構成する","ex":"Girls constitute more than half of the school choir members.","exm":"女子は学校の合唱部員の半数以上を構成している。","us":"受け身にしない他動詞。「A constitutes B（AはBを構成する）」の形が基本。","tip":"名詞constitution（憲法・構成）と関連づけて覚えるとよい。"},{"w":"construct","pos":"動","m":"建設する；組み立てる","nu":"建物だけでなく理論や文章なども部品を組み合わせて作り上げる語。","ph":"construct a building","phm":"建物を建設する","ex":"Workers will construct a new gym near the school library.","exm":"作業員たちは学校の図書館の近くに新しい体育館を建設する予定だ。","us":"他動詞でconstruct + 名詞（buildings, sentences, theories）をとる。","tip":"buildより硬い語。名詞construction、対義語destroyと合わせて覚える。"},{"w":"consult","pos":"動","m":"相談する；参照する","nu":"助言や情報を得るために専門家や資料に意見を求める語。","ph":"consult a doctor","phm":"医者に相談する","ex":"You should consult a teacher before choosing your elective classes.","exm":"選択科目を決める前に先生に相談したほうがよい。","us":"consult + 人／資料（doctor, dictionary）を直接目的語にとる。consult with ~も使われる。","tip":"名詞consultant（相談役）、consultation（相談）と合わせて覚えるとよい。"},{"w":"convert","pos":"動","m":"変換する；改宗する","nu":"形・用途・単位などを別の状態にすっかり変化させる語。","ph":"convert into a lab","phm":"実験室に変える","ex":"Workers will convert the old classroom into a small computer lab.","exm":"作業員たちは古い教室を小さなコンピュータ室に改装するだろう。","us":"convert A into/to B（AをBに変える）の形をとる。名詞convertは前にアクセントが来る。","tip":"名詞conversion（変換）と合わせて覚える。vert（回す）が語源で「向きを変える」イメージ。"},{"w":"convey","pos":"動","m":"伝える；運ぶ","nu":"考えや感情、あるいは物を相手に確実にきちんと届ける語。","ph":"convey a message","phm":"メッセージを伝える","ex":"Her letter seemed to convey her deep gratitude to the volunteers.","exm":"彼女の手紙はボランティアへの深い感謝を伝えているようだった。","us":"convey + 名詞（message, meaning, feeling）をとる他動詞。communicateよりやや文語的。","tip":"con（共に）＋vey（運ぶ）が語源。「意味を運んで伝える」イメージで覚える。"},{"w":"cope","pos":"動","m":"対処する；乗り切る","nu":"困難やストレスに耐えながら何とかうまく対応する語。","ph":"cope with stress","phm":"ストレスに対処する","ex":"Many teenagers find it hard to cope with exam stress.","exm":"多くの十代の若者は試験のストレスに対処するのが難しいと感じる。","us":"自動詞で必ずcope with ~の形をとる。目的語を直接とらない点に注意。","tip":"dealと似るが、copeは苦しい状況を耐え抜くニュアンスが強い語。"},{"w":"declare","pos":"動","m":"宣言する；申告する","nu":"自分の意見や事実、決定などをはっきりと公に述べる語。","ph":"declare independence","phm":"独立を宣言する","ex":"The student council will declare the festival a huge success.","exm":"生徒会は文化祭を大成功だと宣言するだろう。","us":"declare that節、またはdeclare O C（OをCだと宣言する）の形をとる。","tip":"名詞declaration（宣言）。clear（明確な）と語根が近く「はっきり述べる」イメージ。"},{"w":"decline","pos":"動","m":"断る；減少する","nu":"丁寧に申し出を断ったり、数量・質が徐々に下がったりする語。","ph":"decline an offer","phm":"申し出を断る","ex":"He decided to politely decline the invitation to join club activities.","exm":"彼はクラブ活動に参加する誘いを丁寧に断ることに決めた。","us":"他動詞decline + 名詞（invitation, offer）と、自動詞「減少する」の両方の意味がある。","tip":"refuseより丁寧な断り方。「傾く→下がる」の語源から減少の意味も生まれた。"},{"w":"dedicate","pos":"動","m":"捧げる；専念させる","nu":"時間や労力、作品などを特定の目的や人のために惜しみなく使う語。","ph":"dedicate time to","phm":"時間を～に捧げる","ex":"She likes to dedicate every weekend to practicing the violin.","exm":"彼女は毎週末をバイオリンの練習に捧げたがっている。","us":"dedicate A to Bの形をとる。再帰のdedicate oneself to ~もよく使われる。","tip":"名詞dedication（献身）、形容詞dedicated（熱心な）と合わせて覚える。"},{"w":"define","pos":"動","m":"定義する；明確にする","nu":"言葉の意味や物事の範囲・特徴を明確にはっきりと示す語。","ph":"define the term","phm":"用語を定義する","ex":"The teacher asked students to define the word in their own words.","exm":"先生は生徒に自分の言葉でその単語を定義するよう求めた。","us":"define + 名詞（term, word, role）をとる他動詞。受け身be definedも頻出。","tip":"名詞definition（定義）、形容詞definite（明確な）と合わせて覚える。"},{"w":"demonstrate","pos":"動","m":"実証する；実演する","nu":"証拠や実演を通して何かが事実・可能であることを明確に示す語。","ph":"demonstrate a skill","phm":"技能を実演する","ex":"The coach will demonstrate the correct form before practice starts.","exm":"コーチは練習が始まる前に正しいフォームを実演するだろう。","us":"demonstrate + 名詞／demonstrate that節の形をとる。showより論理的に示すニュアンス。","tip":"名詞demonstration（実演・デモ）。showより論理的・客観的に示すニュアンスがある。"},{"w":"derive","pos":"動","m":"由来する；引き出す","nu":"何かが別の元となるものから生じたり、そこから得られたりする語。","ph":"derive from","phm":"～に由来する","ex":"The word biology seems to derive from two ancient Greek terms.","exm":"biologyという単語は2つの古代ギリシャ語に由来するようだ。","us":"derive from ~（自動詞的用法）とderive A from B（BからAを得る）の両方がある。","tip":"名詞derivation（派生）、derivative（派生語）と合わせて覚えるとよい。"},{"w":"detect","pos":"動","m":"検知する；見つける","nu":"注意深い観察や機械を用いて隠れたものの存在に気づく語。","ph":"detect a change","phm":"変化を検知する","ex":"The smoke alarm can detect smoke coming from the school kitchen.","exm":"煙探知機は学校の台所からの煙を検知できる。","us":"他動詞でdetect + 名詞（smoke, error, change）をとる。","tip":"名詞detection（検知）、detective（探偵）と合わせて「隠れたものを見抜く」イメージで覚える。"},{"w":"devote","pos":"動","m":"捧げる；充てる","nu":"時間・努力・関心を特定の目的や人に集中的に注ぐ語。","ph":"devote time to","phm":"時間を～に充てる","ex":"He tries to devote an hour every day to reading novels.","exm":"彼は毎日1時間を小説を読むことに充てようとしている。","us":"devote A to Bの形をとる。再帰のdevote oneself to ~も頻出。","tip":"dedicateとほぼ同義。形容詞devoted（献身的な）、名詞devotion（献身）と合わせて覚える。"},{"w":"dominate","pos":"動","m":"支配する；優位に立つ","nu":"ある分野や状況で圧倒的な力・存在感を持ち、他を圧倒するイメージ。","ph":"dominate the market","phm":"市場を支配する","ex":"Their team continued to dominate the league throughout the season.","exm":"彼らのチームはシーズンを通してリーグを支配し続けた。","us":"dominate は他動詞で目的語を直接取る（dominate in ではなく dominate the market）。","tip":"dominant「支配的な」、domination「支配」と語形変化を一緒に覚えるとよい。"},{"w":"eliminate","pos":"動","m":"排除する；取り除く","nu":"不要・不適切なものを完全に取り除き、なくしてしまうイメージの語。","ph":"eliminate the risk","phm":"リスクを取り除く","ex":"Coaches try to eliminate mistakes before the big tournament begins.","exm":"コーチたちは大会が始まる前にミスをなくそうとする。","us":"eliminate A from B「AをBから排除する」の形でよく使われる。","tip":"e（外へ）と limen（境界）が由来で、境界の外へ出す＝取り除くイメージを持つとよい。"},{"w":"embrace","pos":"動","m":"受け入れる；抱きしめる","nu":"新しい考えや変化を前向きに、積極的に受け入れる態度を表す語。","ph":"embrace change","phm":"変化を受け入れる","ex":"Many students embrace new technology to study more efficiently.","exm":"多くの生徒は効率的に勉強するために新しい技術を受け入れる。","us":"accept より積極的・肯定的なニュアンスが強く、意見・変化・文化のような抽象的な対象を目的語に取ることが多い。","tip":"元々「抱きしめる」の意味から、考えや変化を抱き込む＝受け入れるへと意味が広がったと考えるとよい。"},{"w":"emerge","pos":"動","m":"現れる；浮上する","nu":"隠れていた・存在しなかったものが徐々に表面化し、姿を現す様子を表す。","ph":"emerge as a leader","phm":"リーダーとして台頭する","ex":"A new problem began to emerge during the group project last week.","exm":"先週のグループ課題中に新たな問題が浮上し始めた。","us":"自動詞なので目的語を取らず、emerge from ~「〜から現れる」の形もよく使う。","tip":"反対語は submerge「沈む」。em-（外へ）というイメージと合わせて覚えるとよい。"},{"w":"emphasize","pos":"動","m":"強調する","nu":"ある点を特に重要だと考え、繰り返し目立たせて伝える動作を表す。","ph":"emphasize the importance","phm":"重要性を強調する","ex":"Our teacher likes to emphasize the importance of daily practice.","exm":"私たちの先生は毎日の練習の重要性を強調するのが好きだ。","us":"emphasize that節「〜ということを強調する」の形も頻出で、名詞形は emphasis。","tip":"イギリス英語では emphasise とも綴る。stress とほぼ同義で言い換え可能。"},{"w":"enable","pos":"動","m":"可能にする","nu":"人や物が何かをできるようにする、条件や手段を与えるイメージの語。","ph":"enable students to","phm":"生徒が〜できるようにする","ex":"This app will enable students to review vocabulary every single day.","exm":"このアプリは生徒が毎日単語を復習できるようにしてくれる。","us":"enable + 人 + to do の形が基本形で、allow と似るが「能力・手段を与える」ニュアンスが強い。","tip":"able「できる」を中に含むと考えると、できる状態にするという意味を覚えやすい。"},{"w":"encounter","pos":"動","m":"出くわす；遭遇する","nu":"予期せず人や問題に出会う、偶然の遭遇を表す少しフォーマルな語。","ph":"encounter difficulties","phm":"困難に直面する","ex":"She did not expect to encounter so many difficulties abroad.","exm":"彼女は海外でこれほど多くの困難に直面するとは思わなかった。","us":"他動詞で前置詞を伴わず直接目的語を取り、meet with より硬い響きを持つ。","tip":"名詞としても使え、a chance encounter「偶然の出会い」のように使われる。"},{"w":"enhance","pos":"動","m":"高める；向上させる","nu":"既にある良いものの質・価値・魅力をさらに引き上げるイメージの語。","ph":"enhance performance","phm":"パフォーマンスを高める","ex":"Regular sleep can enhance your memory and concentration in class.","exm":"十分な睡眠は授業中の記憶力と集中力を高めてくれる。","us":"improve と近いが、enhance はすでに良いものを「さらに」引き上げる場面で好んで使われる。","tip":"ラテン語で「高くする」という語に由来し、良い状態をさらに高めるイメージを持つとよい。"},{"w":"ensure","pos":"動","m":"確実にする；保証する","nu":"望む結果や状態を確実にするために手を打つ、という保証のニュアンス。","ph":"ensure safety","phm":"安全を確保する","ex":"Teachers check the equipment to ensure safety during science experiments.","exm":"先生たちは理科の実験中の安全を確保するために器具を確認する。","us":"ensure that節がよく続く。insure（保険をかける）とスペルが似ているが意味が異なるので注意。","tip":"sure「確実な」を含むので、確実にするという意味を連想しやすい。"},{"w":"estimate","pos":"動","m":"見積もる；推定する","nu":"正確な数値ではなく、経験や情報からおおよその数量・程度を判断する語。","ph":"estimate the cost","phm":"費用を見積もる","ex":"We tried to estimate the total cost of the school festival.","exm":"私たちは学園祭の総費用を見積もろうとした。","us":"estimate that/how much の形も取り、名詞としても同形で使われる（アクセント位置は変わらず、語尾の発音が動詞と名詞で異なる）。","tip":"名詞では最後を弱く発音し、動詞では語尾をはっきり発音する違いも意識するとよい。"},{"w":"evaluate","pos":"動","m":"評価する","nu":"基準に沿って対象の価値や質を注意深く判断・分析することを表す語。","ph":"evaluate the results","phm":"結果を評価する","ex":"Teachers evaluate student essays based on clarity and structure.","exm":"教師は明確さと構成に基づいて生徒のエッセイを評価する。","us":"数値化しにくい価値・質を判断する場合に使われることが多く、assess とほぼ同義。","tip":"value「価値」を語幹に含むので、価値を測るという意味を連想できる。"},{"w":"evolve","pos":"動","m":"進化する；発展する","nu":"時間をかけて段階的に変化し、より複雑・高度な形へ発展していく様子。","ph":"evolve over time","phm":"時間とともに進化する","ex":"Club activities in Japan have started to evolve over the decades.","exm":"日本の部活動はここ数十年で進化し始めている。","us":"自動詞として使うことが多く、evolve into ~「〜へと発展する」の形も頻出。","tip":"evolution「進化」、evolutionary「進化の」と合わせて覚えると理解が深まる。"},{"w":"exceed","pos":"動","m":"超える；上回る","nu":"決められた基準・限度・期待を数量や程度で上回ることを表す語。","ph":"exceed expectations","phm":"期待を上回る","ex":"Her test score managed to exceed everyone's expectations this term.","exm":"彼女のテストの点数は今学期、皆の期待を上回った。","us":"他動詞で数値・限度を表す名詞を目的語に取る。つづりが似た excess（名詞・過剰、発音は異なる）と混同しないよう注意。","tip":"exceedingly「非常に」という副詞も派生語として合わせて覚えておきたい。"},{"w":"exclude","pos":"動","m":"除外する","nu":"ある範囲・グループから対象を意図的に外し、含めないようにすることを表す。","ph":"exclude from the list","phm":"リストから除外する","ex":"The coach decided to exclude injured players from the next match.","exm":"監督はけがをした選手を次の試合から除外することにした。","us":"exclude A from B の形が基本で、反対語は include「含める」であり対で覚えると効果的。","tip":"ex-（外へ）と clude（閉じる）で「外に締め出す」イメージを持つとよい。concludeやincludeと語根が共通する。"},{"w":"exhibit","pos":"動","m":"示す；展示する","nu":"感情・特徴・作品などを人の目に見える形ではっきりと示すことを表す語。","ph":"exhibit signs of","phm":"〜の兆候を示す","ex":"The patient began to exhibit signs of improvement after the treatment.","exm":"その患者は治療後に回復の兆候を示し始めた。","us":"「展示する」の意味の他に、感情や性質を「表す」意味でも頻繁に使われる。","tip":"名詞形は exhibition「展覧会」。美術館の展示から意味を広げて覚えるとよい。"},{"w":"expand","pos":"動","m":"拡大する；広げる","nu":"サイズ・規模・範囲などを物理的または比喩的に大きく広げていくことを表す。","ph":"expand the business","phm":"事業を拡大する","ex":"The school plans to expand its library over the summer break.","exm":"その学校は夏休みの間に図書館を拡張する計画だ。","us":"自動詞・他動詞どちらでも使え、expand on ~「〜について詳しく述べる」という表現もある。","tip":"反対語は shrink や contract。名詞形 expansion もセットで覚えたい。"},{"w":"expose","pos":"動","m":"さらす；露出させる","nu":"隠れていたものを外気や視線、危険などにさらけ出すことを表す語。","ph":"expose students to","phm":"生徒を〜に触れさせる","ex":"The program aims to expose students to different cultures abroad.","exm":"そのプログラムは生徒を海外の異なる文化に触れさせることを目指す。","us":"expose A to B「AをBにさらす／触れさせる」の形が定番で、受け身 be exposed to も頻出。","tip":"名詞形 exposure「露出、さらされること」も写真やニュースでよく見る語。"},{"w":"extend","pos":"動","m":"延ばす；広げる","nu":"時間・空間・範囲を今ある限度よりも先まで伸ばすことを表す語。","ph":"extend the deadline","phm":"締め切りを延長する","ex":"The teacher agreed to extend the deadline for our history report.","exm":"先生は歴史のレポートの締め切りを延長することに同意した。","us":"時間だけでなく、extend an invitation「招待を申し出る」のように抽象的にも使う。","tip":"名詞形 extension「延長」はコード（延長コード）などの日常語にもなっている。"},{"w":"facilitate","pos":"動","m":"促進する；容易にする","nu":"直接行うのではなく、物事がスムーズに進むよう手助けする様子を表す語。","ph":"facilitate communication","phm":"コミュニケーションを促進する","ex":"Group chats can facilitate communication among busy club members.","exm":"グループチャットは忙しい部員同士のコミュニケーションを促進してくれる。","us":"主語には人よりも物事・仕組みが来ることが多く、フォーマルな文章でよく使われる。","tip":"facile「容易な」と語根が近く、物事を容易にするという意味を連想できる。"},{"w":"fulfill","pos":"動","m":"果たす；満たす","nu":"約束・義務・夢などを最後までやり遂げ、実現させることを表す語。","ph":"fulfill a dream","phm":"夢を叶える","ex":"Winning the championship helped the team fulfill a long-held dream.","exm":"優勝したことで、そのチームは長年の夢を叶えることができた。","us":"fulfill a promise/duty/dream のように「約束・義務・夢」を目的語に取ることが多い。","tip":"イギリス英語では fulfil と l が一つの場合もある。full「満ちた」と関連づけて満たすを覚える。"},{"w":"generate","pos":"動","m":"生み出す；発生させる","nu":"エネルギー・利益・アイデアなど、何かを新たに作り出すことを表す語。","ph":"generate ideas","phm":"アイデアを生み出す","ex":"Brainstorming helps our club generate new ideas for the festival.","exm":"ブレインストーミングは私たちの部が学園祭の新しいアイデアを生み出す助けになる。","us":"generate electricity/income/ideas など、抽象・具体どちらの対象にも幅広く使える。","tip":"generation「世代、発生」と語根が同じで、新しく生み出すイメージを共有する。"},{"w":"identify","pos":"動","m":"特定する；見極める","nu":"対象が何であるか、誰であるかを他と区別してはっきりさせることを表す語。","ph":"identify the problem","phm":"問題を特定する","ex":"The nurse helped identify the cause of his sudden headache.","exm":"看護師は彼の急な頭痛の原因を特定するのを手伝った。","us":"identify A as B「AをBだと特定する」、identify with ~「〜に共感する」の形も重要。","tip":"identity「身元、アイデンティティ」と語根が同じで、同一のものを見つけるイメージを持つとよい。"},{"w":"illustrate","pos":"動","m":"説明する；例示する","nu":"例や図を使って、考えや事実をわかりやすく示すことを表す語。","ph":"illustrate the point","phm":"論点を例示する","ex":"The teacher used a simple graph to illustrate the point clearly.","exm":"先生はその論点をわかりやすく説明するために簡単なグラフを使った。","us":"illustrate that節や illustrate how ~の形でも使われ、explainより具体例で示すニュアンスが強い。","tip":"illustration「挿絵、実例」という名詞は絵本や教科書のイラストにもつながる語。"},{"w":"impose","pos":"動","m":"課す；押し付ける","nu":"規則・義務・意見などを相手の意志に関係なく上から押し付けることを表す語。","ph":"impose a rule","phm":"規則を課す","ex":"The school decided to impose a new rule on smartphone use.","exm":"学校はスマートフォンの使用について新しい規則を課すことに決めた。","us":"impose A on B「AをBに課す」の形が基本で、しばしば押し付けがましさを含意する。","tip":"名詞 imposition「押し付け」や impose on ~「〜に迷惑をかける」の表現も一緒に覚えたい。"},{"w":"indicate","pos":"動","m":"示す；指し示す","nu":"データや様子から、ある事実や可能性をそれとなく示すことを表す語。","ph":"indicate a trend","phm":"傾向を示す","ex":"The survey results indicate a growing interest in online classes.","exm":"調査結果はオンライン授業への関心が高まっていることを示している。","us":"indicate that節がよく続き、show より客観的でややフォーマルな響きを持つ。","tip":"名詞形 indication「兆候」、indicator「指標」も新聞やニュースでよく見かける。"},{"w":"inherit","pos":"動","m":"受け継ぐ；相続する","nu":"財産・性質・伝統などを前の世代や前任者から自動的に受け取ることを表す語。","ph":"inherit traits from","phm":"〜から特徴を受け継ぐ","ex":"Many people believe children inherit personality traits from their parents.","exm":"多くの人は子どもが親から性格的特徴を受け継ぐと信じている。","us":"inherit A from B の形で使い、遺伝や財産だけでなく伝統・問題を受け継ぐ場合にも使う。","tip":"名詞形 inheritance「遺産、相続」も合わせて覚えると理解が深まる。"},{"w":"integrate","pos":"動","m":"統合する；一体化する","nu":"複数の別々のものを組み合わせて、一つのまとまったものにすることを表す語。","ph":"integrate technology into","phm":"技術を〜に取り入れる","ex":"Our school hopes to integrate technology into every classroom lesson.","exm":"私たちの学校はあらゆる教室の授業に技術を取り入れたいと考えている。","us":"integrate A into B の形が基本で、自動詞として「馴染む、溶け込む」意味でも使われる。","tip":"名詞形 integration「統合」は数学の積分の意味でも使われる語。"},{"w":"interact","pos":"動","m":"交流する；相互に作用する","nu":"人や物同士が互いに影響を与え合いながらやり取りをすることを表す語。","ph":"interact with classmates","phm":"クラスメートと交流する","ex":"Shy students often find it hard to interact with new classmates.","exm":"内気な生徒は新しいクラスメートと交流するのを難しく感じることが多い。","us":"interact with ~の形が基本で、前置詞 with を省略しないよう注意する。","tip":"名詞形 interaction「交流、相互作用」や interactive「双方向の」という形容詞もよく使われる。"},{"w":"interpret","pos":"動","m":"解釈する；通訳する","nu":"情報・言葉・状況の意味を自分なりに読み取って説明することを表す語。","ph":"interpret the data","phm":"データを解釈する","ex":"Scientists must carefully interpret the data before drawing a conclusion.","exm":"科学者は結論を出す前に慎重にデータを解釈しなければならない。","us":"interpret A as B「AをBだと解釈する」の形も頻出。「通訳する」の意味では人が主語になる。","tip":"名詞形 interpretation「解釈」、interpreter「通訳者」も合わせて覚えたい。"},{"w":"invest","pos":"動","m":"投資する","nu":"お金・時間・労力などを、将来の利益や成果を期待してつぎ込むことを表す語。","ph":"invest time in","phm":"〜に時間を投資する","ex":"Successful athletes invest a lot of time in daily training.","exm":"成功しているアスリートは日々の練習に多くの時間を投資している。","us":"invest in ~の形が基本で、お金だけでなく time や effort も目的語にできる。","tip":"名詞形 investment「投資」も経済ニュースで頻出の関連語。"},{"w":"investigate","pos":"動","m":"調査する","nu":"事件や問題の原因・真相を明らかにするために詳しく調べることを表す語。","ph":"investigate the cause","phm":"原因を調査する","ex":"Police officers arrived quickly to investigate the accident near school.","exm":"警察官は学校近くの事故を調査するためにすぐに到着した。","us":"research が学術的な調査を指すのに対し、investigate は事件・不正など真相解明の調査に使われやすい。","tip":"名詞形 investigation「調査」、investigator「捜査官」も刑事ドラマなどでよく耳にする語。"},{"w":"justify","pos":"動","m":"正当化する","nu":"自分の行動や意見が正しい・妥当であると理由を示して説明することを表す語。","ph":"justify the decision","phm":"決定を正当化する","ex":"He struggled to justify his decision to skip the club meeting.","exm":"彼は部活の集まりを休むという決定を正当化するのに苦労した。","us":"justify doing/justify A by ~の形で使われ、名詞形 justification「正当化、理由づけ」も覚えておきたい。","tip":"just「正しい」を語根に含み、正しいと示すという意味を連想しやすい。"},{"w":"launch","pos":"動","m":"開始する；打ち上げる","nu":"新しい活動・製品・ロケットなどを勢いよくスタートさせることを表す語。","ph":"launch a new project","phm":"新しい企画を始める","ex":"The student council decided to launch a new recycling project.","exm":"生徒会は新しいリサイクル企画を始めることに決めた。","us":"製品・サービス・キャンペーンなど「大々的に始める」場面で使われ、start より規模感がある。","tip":"ロケットの打ち上げから、新しい物事の開始へ意味が広がったと考えるとイメージしやすい。"},{"w":"maintain","pos":"動","m":"維持する；主張する","nu":"良い状態を保ち続けること、または意見を変えずに言い続けることを表す語。","ph":"maintain a balance","phm":"バランスを保つ","ex":"It is important to maintain a balance between study and sleep.","exm":"勉強と睡眠のバランスを保つことは大切だ。","us":"「維持する」の他に maintain that節で「〜だと主張する」意味にもなる点に注意。","tip":"名詞形 maintenance「維持、メンテナンス」は日常のカタカナ語としてもなじみがある。"},{"w":"modify","pos":"動","m":"修正する；変更する","nu":"全体を変えるのではなく、一部分を目的に合わせて手直しすることを表す語。","ph":"modify the plan","phm":"計画を修正する","ex":"The coach had to modify the training plan due to rain.","exm":"監督は雨のため練習計画を修正しなければならなかった。","us":"change より部分的で小さな変更を指すことが多く、名詞形 modification「修正」も覚えておきたい。","tip":"mode「様式」と語根が近く、様式を少し変えるというイメージを持つとよい。"},{"w":"monitor","pos":"動","m":"監視する；観察する","nu":"状況や変化を見逃さないよう、継続的に注意深く見守ることを表す語。","ph":"monitor progress","phm":"進捗を見守る","ex":"The teacher will monitor progress on our group project weekly.","exm":"先生は私たちのグループ課題の進捗を毎週見守るつもりだ。","us":"watch よりも継続的・定期的なチェックのニュアンスが強く、health や data を目的語にも取る。","tip":"名詞としても「モニター（画面）」の意味で使われ、見張る道具のイメージから動詞の意味も覚えやすい。"},{"w":"negotiate","pos":"動","m":"交渉する","nu":"意見の異なる相手と話し合い、合意点を見つけようとすることを表す語。","ph":"negotiate a deal","phm":"取引を交渉する","ex":"Students tried to negotiate a later curfew with their parents.","exm":"生徒たちは両親ともっと遅い門限を交渉しようとした。","us":"negotiate with ~ over/about ...「〜と…について交渉する」の形が基本。","tip":"名詞形 negotiation「交渉」はニュース英語でも頻出する語。"},{"w":"occupy","pos":"動","m":"占める；占領する","nu":"場所・時間・地位などを物理的または比喩的に埋めて、そこにあることを表す語。","ph":"occupy a seat","phm":"席を占める","ex":"Club activities occupy most of her free time after school.","exm":"部活動は放課後の彼女の自由時間の大半を占めている。","us":"「軍が占領する」意味の他に、時間・空間・地位を「占める」という日常的な使い方も多い。","tip":"名詞形 occupation「職業、占領」も合わせて覚えると幅広い場面で応用できる。"},{"w":"occur","pos":"動","m":"起こる；生じる","nu":"予定外の出来事や考えが、ある時に自然に発生することを表す語。","ph":"occur to me","phm":"ふと思いつく","ex":"Such accidents often occur when people use smartphones while walking.","exm":"そのような事故は、歩きスマホをしているときによく起こる。","us":"自動詞で受け身にしない点に注意。it occurs to 人 that ~「人にふと〜と思い浮かぶ」の形も重要。","tip":"happen とほぼ同義だが、occur はややフォーマルで、事故・現象などにもよく使われる。"},{"w":"oppose","pos":"動","m":"反対する","nu":"計画・意見・行動などに対して、反対の立場をはっきり取ることを表す語。","ph":"oppose the plan","phm":"計画に反対する","ex":"Several parents strongly oppose the plan to cancel the trip.","exm":"何人かの保護者はその旅行を中止する計画に強く反対している。","us":"他動詞で目的語を直接取り、oppose to とは言わない点に注意（be opposed to は形容詞用法）。","tip":"反対語は support。名詞形 opposition「反対、野党」もニュースでよく使われる。"},{"w":"overcome","pos":"動","m":"克服する；乗り越える","nu":"困難や障害を努力して乗り越え、打ち勝つイメージを表す語。","ph":"overcome a difficulty","phm":"困難を克服する","ex":"She managed to overcome her fear of public speaking last month.","exm":"彼女は先月、人前で話す恐怖を克服することができた。","us":"overcome＋名詞（困難・障害・恐怖など）の形でよく使う他動詞で、前置詞は不要。","tip":"over（越えて）＋come（来る）から「乗り越えて来る」というイメージで覚える。"},{"w":"overwhelm","pos":"動","m":"圧倒する","nu":"感情や物量があまりに大きく、対処しきれないほど圧倒する様子を表す。","ph":"overwhelm someone with","phm":"人を〜で圧倒する","ex":"The amount of homework began to overwhelm the tired students yesterday.","exm":"宿題の量が昨日、疲れた生徒たちを圧倒し始めた。","us":"be overwhelmed by/withという受け身の形が非常に多く、感情表現に頻出する。","tip":"over（過度に）＋whelm（覆う）で「覆いかぶさるほど圧倒する」と覚える。"},{"w":"perceive","pos":"動","m":"知覚する；認識する","nu":"感覚や思考を通して物事を捉え、それをある特定の形で理解する意味合いを持つ。","ph":"perceive something as","phm":"〜を…として認識する","ex":"Many students perceive math as more difficult than it really is.","exm":"多くの生徒は数学を実際よりも難しいものと認識している。","us":"perceive A as B「AをBとして認識する」の形が頻出。seeより思考を伴う知覚を表す。","tip":"per（完全に）＋ceive（つかむ、感じ取る）で「しっかり捉える」というイメージ。"},{"w":"persist","pos":"動","m":"持続する；固執する","nu":"反対や困難があっても同じ状態や行動をあきらめずに続けることを表す。","ph":"persist in doing","phm":"〜し続ける","ex":"Our coach told us to persist in practicing even after losing.","exm":"コーチは負けた後でも練習を続けるようにと私たちに言った。","us":"persist in ~ingの形で「〜し続ける」を表す自動詞。continueより粘り強さのニュアンスが強い。","tip":"per（通して）＋sist（立つ）で「最後まで立ち続ける」と覚える。"},{"w":"possess","pos":"動","m":"所有する","nu":"財産や能力・性質などを自分のものとして持っていることを表すやや堅い語。","ph":"possess the ability","phm":"能力を持っている","ex":"Every member of the team must possess a valid student ID card.","exm":"チームの全員は有効な学生証を持っていなければならない。","us":"進行形にしない状態動詞。haveよりフォーマルで、能力や性質にも使える。","tip":"pos（力）＋sess（座る）で「自分のもとにしっかり座らせて持つ」と覚える。"},{"w":"preserve","pos":"動","m":"保存する；保護する","nu":"良い状態や価値あるものを損なわないよう大切に守り続ける意味を持つ。","ph":"preserve the environment","phm":"環境を保護する","ex":"Our club works every weekend to preserve the local forest area.","exm":"私たちの部活は毎週末、地元の森林地域を保護するために活動している。","us":"preserve A from B「AをBから守る」の形もある。protectより元の状態を保つニュアンスが強い。","tip":"pre（前もって）＋serve（保つ）で「あらかじめ保っておく」と覚える。"},{"w":"prohibit","pos":"動","m":"禁止する","nu":"法律や規則によって公式に何かを行うことを禁じる、フォーマルな語。","ph":"prohibit smoking","phm":"喫煙を禁止する","ex":"School rules strictly prohibit students from using phones during class time.","exm":"校則は授業中に生徒が携帯電話を使うことを厳しく禁止している。","us":"prohibit A from ~ing「Aが〜するのを禁止する」の形で頻出。forbidより公的・法的な響きを持つ。","tip":"pro（前に）＋hibit（保つ）で「前もって差し止める」というイメージで覚える。"},{"w":"pursue","pos":"動","m":"追求する；追いかける","nu":"目標や夢、興味あるものを長期間にわたって熱心に追い求めることを表す。","ph":"pursue a dream","phm":"夢を追求する","ex":"He decided to pursue a career in music after graduation.","exm":"彼は卒業後に音楽の分野でのキャリアを追求することを決めた。","us":"pursue a goal/career/interestなど抽象的な目的語を伴うことが多い他動詞。","tip":"pur（前へ）＋sue（従う）で「前へ向かって追いかけ続ける」と覚える。"},{"w":"regulate","pos":"動","m":"規制する；調整する","nu":"決まったルールや仕組みによって物事の量や動きを一定に保つよう管理すること。","ph":"regulate the temperature","phm":"温度を調整する","ex":"This app helps students regulate their study time throughout the week.","exm":"このアプリは生徒が一週間を通して勉強時間を調整するのに役立つ。","us":"機械の調整にも社会のルールによる規制にも使える幅広い語。名詞形regulationも頻出。","tip":"regul（規則）から派生し、「規則に従わせて整える」というイメージで覚える。"},{"w":"reinforce","pos":"動","m":"強化する","nu":"すでにあるものをさらに強く頑丈にしたり、考えや効果を裏付けて強めたりする意味。","ph":"reinforce the idea","phm":"その考えを強める","ex":"Practicing every day will reinforce what you learned in class.","exm":"毎日練習することで、授業で学んだことがより定着するだろう。","us":"物理的な補強にも、意見や印象を強める抽象的な意味にも使える。","tip":"re（再び）＋enforce（forceに力を加える）で「さらに力を加えて強くする」と覚える。"},{"w":"reject","pos":"動","m":"拒否する；却下する","nu":"提案や申し出、意見などを受け入れずにはっきりと断ることを表す語。","ph":"reject an offer","phm":"申し出を拒否する","ex":"The committee decided to reject his proposal for the new club.","exm":"委員会は新しいクラブに関する彼の提案を却下することを決めた。","us":"refuseより対象がしっかり形になった提案や案に対して使われることが多い。","tip":"re（後ろへ）＋ject（投げる）で「投げ返す＝拒む」というイメージで覚える。"},{"w":"resolve","pos":"動","m":"解決する；決意する","nu":"問題をきちんと片付けることや、強い意志で何かをすると心に決めることを表す。","ph":"resolve a conflict","phm":"対立を解決する","ex":"The two friends finally managed to resolve their long argument.","exm":"二人の友人はついに長い口論を解決することができた。","us":"resolve to doで「〜しようと決意する」の意味にもなる。名詞resolutionも合わせて覚えたい。","tip":"re（強意）＋solve（解く）で「しっかり解き明かす」というイメージで覚える。"},{"w":"restore","pos":"動","m":"回復させる；修復する","nu":"以前の良い状態やもとの形にもう一度戻すことを表す語。","ph":"restore order","phm":"秩序を回復する","ex":"Volunteers worked hard to restore the old school building last summer.","exm":"ボランティアたちは昨年の夏、古い校舎を修復するために懸命に働いた。","us":"restore A to Bの形で「AをBの状態に戻す」を表すこともある。","tip":"re（再び）＋store（蓄える、置く）で「元の状態に再び戻す」と覚える。"},{"w":"restrict","pos":"動","m":"制限する","nu":"範囲や自由、量などを一定の枠内に抑えて自由に広がらないようにすること。","ph":"restrict access","phm":"立ち入りを制限する","ex":"The new rule will restrict access to the gym after nine.","exm":"新しい規則は9時以降のジムへの立ち入りを制限することになる。","us":"restrict A to Bで「AをBに制限する」となる。limitとほぼ同義だがやや堅い語。","tip":"re（後ろへ）＋strict（引き締める）で「引き締めて狭める」というイメージで覚える。"},{"w":"retain","pos":"動","m":"保持する；覚えておく","nu":"一度得たものを失わずにそのまま持ち続けることを表すやや堅い語。","ph":"retain information","phm":"情報を覚えておく","ex":"Reading aloud helps you retain new vocabulary much more easily.","exm":"音読することで新しい単語をより簡単に覚えておくことができる。","us":"記憶を保つ意味でも、地位や性質を保つ意味でも使われる他動詞。","tip":"re（後ろに）＋tain（保つ）で「後ろにしっかり保っておく」というイメージで覚える。"},{"w":"reveal","pos":"動","m":"明らかにする","nu":"隠れていた事実や気持ち、姿などを人目にさらして分かるようにすること。","ph":"reveal the truth","phm":"真実を明らかにする","ex":"The survey results reveal that many teens sleep less than expected.","exm":"調査結果は多くの十代の若者が予想より睡眠が少ないことを明らかにしている。","us":"主語に人だけでなく調査結果や表情なども使える。showより発見的なニュアンスが強い。","tip":"re（元に戻す）＋veal（veil：覆いを取る）で「覆いを外して見せる」と覚える。"},{"w":"seek","pos":"動","m":"求める；探し求める","nu":"目標や助け、答えなどを真剣に探し求めることを表す、lookより堅い語。","ph":"seek advice","phm":"助言を求める","ex":"Students who struggle should seek help from their teacher early.","exm":"苦労している生徒は早めに先生に助けを求めるべきだ。","us":"seek advice/helpのように名詞を直接目的語に取る。seek to doで「〜しようと努める」も頻出。","tip":"過去形sought・過去分詞soughtの不規則変化に注意して覚える。"},{"w":"stimulate","pos":"動","m":"刺激する；促す","nu":"何かに働きかけて活動や興味、成長をより活発にさせることを表す語。","ph":"stimulate interest","phm":"興味を刺激する","ex":"A good teacher can stimulate curiosity in even the quietest students.","exm":"良い教師は最も静かな生徒にさえ好奇心を刺激することができる。","us":"stimulate A to do「Aを刺激して〜させる」の形も取れる。encourageより神経・感覚への働きかけを含む。","tip":"stimul（刺す、突く）から派生し、「突いて活気づける」イメージで覚える。"},{"w":"submit","pos":"動","m":"提出する；服従する","nu":"書類や課題を担当者に差し出すことや、力に従い自分の意志を譲ることを表す。","ph":"submit an assignment","phm":"課題を提出する","ex":"Please submit your essay to the teacher before Friday afternoon.","exm":"金曜日の午後までに先生にエッセイを提出してください。","us":"submit A to Bで「AをBに提出する」。submit toで「〜に服従する」の意味にもなる。","tip":"sub（下に）＋mit（送る）で「下に差し出す＝提出・服従する」と覚える。"},{"w":"substitute","pos":"動","m":"代用する；代わりに使う","nu":"あるものの代わりに別のものを当てはめて使うことを表す語。","ph":"substitute A for B","phm":"BをAで代用する","ex":"You can substitute honey for sugar in this simple recipe.","exm":"この簡単なレシピでは砂糖の代わりに蜂蜜を使うことができる。","us":"substitute A for B「Bの代わりにAを使う」の語順に注意。名詞としても「代理人」の意味で頻出。","tip":"sub（下に）＋stitute（置く）で「代わりに下に置く」というイメージで覚える。"},{"w":"suspend","pos":"動","m":"一時停止する；つるす","nu":"活動や規則を一時的に止めることや、物を空中につるすことを表す語。","ph":"suspend the game","phm":"試合を一時中断する","ex":"The referee had to suspend the match because of heavy rain.","exm":"審判は大雨のため試合を一時中断しなければならなかった。","us":"suspend a student「生徒を停学にする」のように人にも使える。stopより一時的な中断を強調する。","tip":"sus（下から）＋pend（ぶら下げる）で「宙にぶら下げて止める」というイメージで覚える。"},{"w":"sustain","pos":"動","m":"持続させる；維持する","nu":"ある状態や活動を弱めずに長く支え続けることを表す語。","ph":"sustain economic growth","phm":"経済成長を維持する","ex":"Good nutrition can sustain your energy throughout a long school day.","exm":"良い栄養は長い学校の一日を通してエネルギーを維持することができる。","us":"sustain damage/injuryで「損害・けがを受ける」の意味にもなる点に注意。","tip":"sus（下から）＋tain（保つ）で「下から支えて保ち続ける」と覚える。"},{"w":"transform","pos":"動","m":"変える；変形させる","nu":"見た目や性質を根本的に、まったく別のものに変化させることを表す語。","ph":"transform into","phm":"〜に変わる","ex":"New technology can transform the way students study at home.","exm":"新しい技術は生徒が自宅で勉強する方法を大きく変えることができる。","us":"transform A into Bの形で「AをBに変える」。changeより変化の程度が大きいことを示す。","tip":"trans（越えて）＋form（形）で「形を越えて別の形にする」と覚える。"},{"w":"transmit","pos":"動","m":"伝達する；送る","nu":"情報や信号、病気などをある場所や人から別の場所や人へ送り伝えることを表す。","ph":"transmit information","phm":"情報を伝達する","ex":"This device can transmit data wirelessly to your phone instantly.","exm":"この機器はデータを無線であなたの携帯電話に瞬時に送ることができる。","us":"電波・データだけでなく病気の感染にもtransmit a diseaseのように使われる。","tip":"trans（越えて）＋mit（送る）で「向こう側へ送り届ける」というイメージで覚える。"},{"w":"undergo","pos":"動","m":"経験する；受ける","nu":"変化や試練、検査など、自分の意志とは関係なく経験することを表す語。","ph":"undergo a change","phm":"変化を経験する","ex":"The school building will undergo major repairs next spring vacation.","exm":"校舎は来年の春休みに大規模な修理を受けることになる。","us":"undergo surgery/treatment/changeなど、受け身的に経験する事柄を目的語に取る。","tip":"under（下を）＋go（通る）で「試練の下を通り抜ける」というイメージで覚える。"},{"w":"undertake","pos":"動","m":"引き受ける；着手する","nu":"責任を持って仕事や課題、任務などに取りかかることを表すやや堅い語。","ph":"undertake a project","phm":"計画に着手する","ex":"Our class decided to undertake a project about local recycling habits.","exm":"私たちのクラスは地元のリサイクル習慣についての計画に着手することを決めた。","us":"undertake to doで「〜することを約束する」の意味にもなる。startよりも責任の重さを含む。","tip":"under（下に）＋take（取る）で「自分の下に引き取って責任を持つ」と覚える。"},{"w":"utilize","pos":"動","m":"利用する；活用する","nu":"あるものの機能や価値を十分に生かして役立てることを表す、useより堅い語。","ph":"utilize resources","phm":"資源を活用する","ex":"The library encourages students to utilize its resources for research.","exm":"図書館は生徒が調査のためにその資料を活用するよう勧めている。","us":"useよりも書き言葉やフォーマルな場面で好まれる。目的語には道具・資源・機会などが多い。","tip":"util（役立つ）＋ize（〜化する）から「役立つようにする」と覚える。"},{"w":"withdraw","pos":"動","m":"引き出す；撤退する","nu":"お金を口座から引き出したり、参加や発言を取り下げたりすることを表す語。","ph":"withdraw money","phm":"お金を引き出す","ex":"He had to withdraw money from the bank before the trip.","exm":"彼は旅行の前に銀行からお金を引き出さなければならなかった。","us":"withdraw from a race/competitionで「大会などを棄権する」の意味でも頻出する。","tip":"with（離れて）＋draw（引く）で「引いて離れる＝引き出す・退く」と覚える。"},{"w":"aspect","pos":"名","m":"側面；観点","nu":"物事が持つ多くの性質のうち、注目している一つの部分や見方を表す語。","ph":"an important aspect of","phm":"〜の重要な側面","ex":"Teamwork is an important aspect of success in club activities.","exm":"チームワークは部活動での成功における重要な側面だ。","us":"aspect of ~の形で頻出。可算名詞で、通例someやanなどの限定詞を伴う。","tip":"a（〜へ）＋spect（見る）で「ある角度から見た姿」というイメージで覚える。"},{"w":"atmosphere","pos":"名","m":"雰囲気；大気","nu":"場所や集団を包む空気のような感覚や、地球を覆う大気の両方を表す語。","ph":"a friendly atmosphere","phm":"和やかな雰囲気","ex":"Our classroom has a friendly atmosphere that makes learning enjoyable.","exm":"私たちの教室には学びを楽しくする和やかな雰囲気がある。","us":"「雰囲気」の意味では単数扱いで、a friendly atmosphereのように形容詞を伴うことが多い。","tip":"atmo（蒸気）＋sphere（球）から「地球を包む蒸気の層」が原義だと覚える。"},{"w":"authority","pos":"名","m":"権威；当局","nu":"人を従わせる力や、その力を持つ人・機関、正しいと認められた専門性を表す語。","ph":"have the authority to","phm":"〜する権限を持つ","ex":"Only the principal has the authority to cancel school events.","exm":"校長だけが学校行事を中止する権限を持っている。","us":"「当局」の意味ではthe authoritiesと複数形で使うことが多い点に注意。","tip":"author（著者、創始者）から派生し、「元となる人の持つ力」というイメージで覚える。"},{"w":"barrier","pos":"名","m":"障壁；壁","nu":"進行や理解、交流などを妨げる物理的または心理的な壁を表す語。","ph":"a language barrier","phm":"言語の壁","ex":"Shyness can become a barrier to making new friends quickly.","exm":"内気さは新しい友達を早く作るための障壁になりうる。","us":"barrier to ~ingの形で「〜することへの障壁」を表す。可算名詞として使う。","tip":"bar（棒、柵）から派生し、「進む道をふさぐ柵」というイメージで覚える。"},{"w":"budget","pos":"名","m":"予算","nu":"ある目的のために使えるお金の計画や見積もりを表す語。","ph":"a tight budget","phm":"厳しい予算","ex":"The student council has a tight budget for the school festival.","exm":"生徒会は学園祭のために厳しい予算しか持っていない。","us":"on a budgetで「限られた予算で」の意味になる頻出表現。動詞としても使える。","tip":"古いフランス語で「小さな袋」を意味した語で、お金を入れる袋から意味が広がったと覚える。"},{"w":"burden","pos":"名","m":"負担；重荷","nu":"精神的・経済的・身体的に重くのしかかる責任や苦労を表す語。","ph":"a heavy burden","phm":"重い負担","ex":"Too much homework can become a heavy burden for busy students.","exm":"多すぎる宿題は忙しい生徒にとって重い負担になりうる。","us":"burden on/to someoneの形で「〜への負担」を表す。動詞burden A with Bも頻出。","tip":"「重い荷物を背負う」という原義から、比喩的な精神的重荷にも使うと覚える。"},{"w":"capacity","pos":"名","m":"能力；容量","nu":"物を入れられる最大の量や、人が持つ潜在的な能力を表す語。","ph":"the capacity to learn","phm":"学ぶ能力","ex":"Every child has the capacity to learn a new language easily.","exm":"どの子どもも新しい言語を簡単に学ぶ能力を持っている。","us":"capacity for/to doの形が多い。abilityより潜在的な最大限の力というニュアンスを含む。","tip":"capac（つかむ、収める）から派生し、「収めきれる限界の量」というイメージで覚える。"},{"w":"category","pos":"名","m":"部門；分類","nu":"共通の特徴によって物事をいくつかのグループに分けたときの一つの区分を表す語。","ph":"fall into a category","phm":"部門に分類される","ex":"This book does not fall into any single category of fiction.","exm":"この本はどんな分類にも簡単には当てはまらない。","us":"category of ~の形が頻出。分類する動詞categorizeも合わせて覚えたい。","tip":"「カテゴリー」というカタカナ語そのままの意味なので、日本語の感覚で覚えやすい語。"},{"w":"circumstance","pos":"名","m":"状況；事情","nu":"ある出来事を取り巻く具体的な条件や背景を指す語で、通例複数形circumstancesで使われる。","ph":"an unexpected circumstance","phm":"予期しない事情","ex":"The police carefully examined every circumstance of the accident.","exm":"警察はその事故のあらゆる状況を慎重に調べた。","us":"通例circumstancesと複数形で使い、under no circumstances「どんな状況でも〜ない」は否定を強調する決まり文句としてよく使われる。文頭に置くとshouldなどの倒置が起こる点に注意。","tip":"circum（周りを）＋stance（立つこと）で「周りを取り巻く状態」というイメージで覚える。"},{"w":"colleague","pos":"名","m":"同僚","nu":"同じ職場や組織で共に働く人を指す、ややフォーマルな語。","ph":"a close colleague","phm":"親しい同僚","ex":"My mother often has lunch with a colleague from her office.","exm":"母はよく職場の同僚と昼食を共にする。","us":"friendとは違い、仕事上の関係に限定して使う可算名詞。","tip":"ラテン語collega（com「共に」＋legare「任命する」）に由来し、「共に任命された仲間」から「同僚」を意味すると覚える。"},{"w":"concept","pos":"名","m":"概念","nu":"具体的な事例を抽象化して得られる、頭の中の基本的な考えやイメージを表す語。","ph":"a basic concept","phm":"基本的な概念","ex":"The teacher explained a basic concept of physics using simple examples.","exm":"先生は簡単な例を使って物理学の基本的な概念を説明した。","us":"concept of ~の形で頻出。ideaより体系だった抽象的な考えを指すことが多い。","tip":"con（共に）＋cept（つかむ）で「多くの例をまとめてつかんだ考え」というイメージで覚える。"},{"w":"consequence","pos":"名","m":"結果；影響","nu":"ある行動や出来事の後に必然的に生じる結果、特に重大な影響を表す語。","ph":"as a consequence of","phm":"〜の結果として","ex":"As a consequence of the storm, all weekend games were cancelled.","exm":"嵐の結果として、週末の試合はすべて中止になった。","us":"as a consequence of ~「〜の結果として」の形で頻出。resultよりやや深刻な結果を暗示する。","tip":"con（共に）＋sequence（続くもの）で「後に続いて起こること」というイメージで覚える。"},{"w":"context","pos":"名","m":"文脈；状況","nu":"発言や出来事が置かれた背景・状況を指し、理解の手がかりとなるものだ。","ph":"in this context","phm":"この文脈では","ex":"Please give me more context before you explain the rule.","exm":"そのルールを説明する前に、もっと状況を教えてください。","us":"「文脈」の意味では通常不可算名詞として使う。in the context of ~の形で「〜という状況では」を表す。","tip":"con-(共に)+text(織る)というラテン語由来で、周囲と織り合わさった背景というイメージを持つ。"},{"w":"controversy","pos":"名","m":"論争；物議","nu":"意見が真っ二つに分かれ、激しい対立を招くような話題や状態を表す。","ph":"spark controversy","phm":"論争を引き起こす","ex":"The new school rule caused a lot of controversy among students.","exm":"その新しい校則は生徒の間で大きな論争を引き起こした。","us":"不可算名詞として使うことが多く、controversy over/aboutの形で対象を示す。","tip":"contra-(反対)+vers(向く)から、意見が反対方向を向き合う様子をイメージすると覚えやすい。"},{"w":"crisis","pos":"名","m":"危機","nu":"深刻で不安定な状態が続き、重大な決断や対応が急がれる局面を指す。","ph":"a financial crisis","phm":"金融危機","ex":"Our club faced a crisis when half the members quit.","exm":"部員の半数が辞めた時、私たちの部は危機に直面した。","us":"複数形crisesという不規則変化に注意。in a crisisで「危機的状況で」を表す。","tip":"ギリシャ語で「分かれ目・決定」を意味する語に由来し、物事の転換点というイメージを持つ。"},{"w":"debate","pos":"名","m":"討論；議論","nu":"賛否が分かれるテーマについて、根拠を示しながら意見をぶつけ合うことを表す。","ph":"a heated debate","phm":"白熱した討論","ex":"Our class had a debate about school uniforms yesterday.","exm":"私たちのクラスは昨日、制服についての討論をした。","us":"動詞としても使え、discussより形式的で勝敗を意識した議論を指すことが多い。","tip":"de-(強く)+bate(打つ)から、意見を打ち合わせるイメージで覚える。"},{"w":"decade","pos":"名","m":"10年間","nu":"10年という期間のまとまりを指し、時代の変化を語るときによく使われる。","ph":"over the past decade","phm":"この10年間で","ex":"Smartphones have changed a lot over the past decade.","exm":"スマートフォンはこの10年間で大きく変化した。","us":"必ず10年単位を指す語で、期間を表すforやoverと結びつきやすい。","tip":"deca-はギリシャ語で「10」を表す接頭辞で、decagon(10角形)などにも使われる。"},{"w":"democracy","pos":"名","m":"民主主義","nu":"国民が主権を持ち、選挙などを通じて政治に参加する仕組みや理念を指す。","ph":"promote democracy","phm":"民主主義を推進する","ex":"Students learned how democracy works in social studies class.","exm":"生徒たちは社会科の授業で民主主義の仕組みを学んだ。","us":"「制度」を指すときは可算、「理念」を指すときは不可算として使われる。","tip":"demo-(民衆)+cracy(支配)から、「民衆による支配」という成り立ちで覚える。"},{"w":"destination","pos":"名","m":"目的地","nu":"旅や移動の最終的な到着点を指し、途中経過ではなく終点に焦点がある。","ph":"a popular destination","phm":"人気の目的地","ex":"Kyoto is a popular destination for our school trip.","exm":"京都は私たちの修学旅行の人気の目的地だ。","us":"destination for/ofの形で結びつくことが多く、toとは直接結びつきにくい。","tip":"destine(運命づける)と同じ語根で、「行き着くよう定められた場所」というイメージを持つ。"},{"w":"dimension","pos":"名","m":"次元；側面","nu":"物事を捉える見方の広がりや、大きさ・奥行きなど測れる要素を指す。","ph":"add a new dimension","phm":"新たな側面を加える","ex":"Her advice added a new dimension to our project idea.","exm":"彼女の助言は私たちの企画案に新たな側面を加えた。","us":"物理的な「寸法」は複数形dimensionsで使うことが多く、抽象的な「側面」は単数でも使われる。","tip":"di-(離れて)+mens(測る)から、「測って広がりを見る」というイメージで覚える。"},{"w":"discipline","pos":"名","m":"規律；訓練；分野","nu":"自分を律して物事に取り組む態度や、学問の専門分野を意味する。","ph":"an academic discipline","phm":"学問分野","ex":"Daily practice requires a lot of discipline and patience.","exm":"毎日の練習には多くの規律と忍耐が必要だ。","us":"「規律」の意味では不可算、「学問分野」の意味では可算名詞として使う。","tip":"disciple(弟子)と同じ語源で、弟子が師から学ぶ「訓練」というイメージを持つと覚えやすい。"},{"w":"diversity","pos":"名","m":"多様性","nu":"人種・意見・種類などがさまざまに異なって存在している状態を表す。","ph":"cultural diversity","phm":"文化的多様性","ex":"Our school values diversity among students from many countries.","exm":"私たちの学校はさまざまな国出身の生徒の多様性を大切にしている。","us":"通例不可算名詞。diversity of/inの形で「〜の多様性」を表す。","tip":"di-(分かれて)+vers(向く)から、いろいろな方向に分かれている状態をイメージする。"},{"w":"element","pos":"名","m":"要素；元素","nu":"全体を構成する基本的な部分や成分を指し、化学の「元素」も表す。","ph":"a key element","phm":"重要な要素","ex":"Teamwork is an important element of our volleyball success.","exm":"チームワークは私たちのバレーボールの成功の重要な要素だ。","us":"可算名詞。element of ~の形で「〜という要素」を表すことが多い。","tip":"化学の「元素」の意味から、「これ以上分けられない基本単位」というイメージで抽象的な意味にも広げると覚えやすい。"},{"w":"enthusiasm","pos":"名","m":"熱意；熱心さ","nu":"何かに強く心を惹かれ、意欲的に取り組もうとする気持ちの高まりを表す。","ph":"show enthusiasm for","phm":"〜への熱意を示す","ex":"He joined the debate club with great enthusiasm last spring.","exm":"彼はこの前の春、大きな熱意を持って討論部に入部した。","us":"不可算名詞。enthusiasm for/aboutの形で対象を示す。形容詞形enthusiasticも頻出。","tip":"ギリシャ語で「神が内に宿る」を意味した語に由来するとされ、内側からわき上がる情熱というイメージを持つ。"},{"w":"equipment","pos":"名","m":"装備；備品","nu":"特定の作業や活動に必要な道具・機材をひとまとめにして指す語だ。","ph":"sports equipment","phm":"スポーツ用具","ex":"The gym needs new equipment for the basketball team soon.","exm":"体育館はバスケ部のために近々新しい用具が必要だ。","us":"常に不可算名詞で複数形にしない。数えるときはa piece of equipmentという形を使う。","tip":"equip(装備する)の名詞形として、動詞と一緒に覚えると定着しやすい。"},{"w":"era","pos":"名","m":"時代","nu":"特徴的な出来事や状況によって区切られる、歴史上のひとまとまりの期間を指す。","ph":"a new era","phm":"新しい時代","ex":"The internet started a new era of global communication.","exm":"インターネットは世界的なコミュニケーションの新時代を切り開いた。","us":"periodやageと似るが、eraは何かが始まる・終わる節目を強調して使われることが多い。","tip":"ラテン語で時代の起点となる数値を表した語に由来するとされる。"},{"w":"expertise","pos":"名","m":"専門知識","nu":"ある分野について豊富な経験に基づく高い知識や技能を持つことを表す。","ph":"technical expertise","phm":"専門技術","ex":"The coach shared his expertise in improving our running form.","exm":"コーチは私たちの走り方を改善する専門知識を共有してくれた。","us":"不可算名詞。expertise in/onの形で分野を示す。expert(専門家)と混同しないよう注意。","tip":"expert(専門家)の名詞形と考えると、「専門家が持つ知識」というつながりで覚えやすい。"},{"w":"function","pos":"名","m":"機能；働き","nu":"物や人が本来持っている役割や、それが果たすべき働きのことを表す。","ph":"the function of","phm":"〜の機能","ex":"The main function of this app is tracking your homework.","exm":"このアプリの主な機能は宿題を記録することだ。","us":"動詞としても「機能する」の意味で使われる(function as/like ~)。数学では「関数」の意味にもなる。","tip":"「役割どおりに動く」というイメージで名詞・動詞の意味をまとめて覚えるとよい。"},{"w":"gender","pos":"名","m":"性；性別","nu":"社会的・文化的な観点から捉えた男女の区別や性のあり方を表す。","ph":"gender equality","phm":"男女平等","ex":"The team welcomes new members regardless of their gender.","exm":"そのチームは性別に関係なく新しいメンバーを歓迎している。","us":"sex(生物学的な性)と区別され、社会的な役割や意識としての性を表すときに使われることが多い。","tip":"gender equality(男女平等)というフレーズとセットで社会的な文脈をイメージすると覚えやすい。"},{"w":"geography","pos":"名","m":"地理；地理学","nu":"土地の地形や気候、人々の暮らしとの関係を研究する学問や特徴を指す。","ph":"study geography","phm":"地理を学ぶ","ex":"We study geography every Tuesday during second period.","exm":"私たちは毎週火曜の2時間目に地理を学んでいる。","us":"不可算名詞。学問分野としても、土地の地形的特徴としても使われる。","tip":"geo-(地球)+graphy(記述)から、「地球について記述する学問」という成り立ちで覚える。"},{"w":"guarantee","pos":"名","m":"保証","nu":"あることが確実に起こる、または一定の質を満たすと約束することを表す。","ph":"a money-back guarantee","phm":"返金保証","ex":"Hard work does not always come with a guarantee of success.","exm":"一生懸命努力しても、必ず成功が保証されるとは限らない。","us":"名詞・動詞どちらでも使う。a guarantee of/thatの形で内容を示す。","tip":"「保証する」という動詞用法とセットで覚え、warranty(製品保証書)との違いも意識するとよい。"},{"w":"hypothesis","pos":"名","m":"仮説","nu":"まだ証明されていないが、実験や調査で検証しようとする仮の説明を指す。","ph":"test a hypothesis","phm":"仮説を検証する","ex":"Our science group formed a hypothesis before starting the experiment.","exm":"私たちの理科班は実験を始める前に仮説を立てた。","us":"複数形はhypothesesという特殊変化。theory(理論)より検証前の仮の段階を指す。","tip":"hypo-(下に、仮の)+thesis(命題)から、「仮に置いた命題」という成り立ちで覚える。"},{"w":"immigrant","pos":"名","m":"移民","nu":"他国からその国に移り住んで生活する人を指し、定住の視点を強調する語だ。","ph":"an immigrant family","phm":"移民の家族","ex":"Her grandfather was an immigrant from Italy many years ago.","exm":"彼女の祖父は何年も前にイタリアからの移民だった。","us":"emigrant(出て行く側)と対になる語で、immigrant(入ってくる側)という視点の違いに注意する。","tip":"im-(中へ)+migrant(移動者)から、「その国の中へ移動してきた人」というイメージで覚える。"},{"w":"incident","pos":"名","m":"出来事；事件","nu":"通常とは異なる、注目すべき出来事や小さな事件を指す語だ。","ph":"report an incident","phm":"事件を報告する","ex":"A strange incident happened during our field trip last week.","exm":"先週の校外学習中に奇妙な出来事が起きた。","us":"accidentより中立的で、事故に限らず幅広い「出来事」を指すのに使われる。","tip":"incidental(付随的な)と語根が同じで、日常に付随して起こる出来事というイメージを持つ。"},{"w":"ingredient","pos":"名","m":"材料；成分","nu":"料理や物事を成り立たせるために必要な個々の材料や要素を指す。","ph":"the main ingredient","phm":"主な材料","ex":"Fresh vegetables are the main ingredient in this simple recipe.","exm":"新鮮な野菜がこの簡単なレシピの主な材料だ。","us":"料理の「材料」だけでなく、成功などの「要素」を比喩的に表す時にも使われる。","tip":"「中へ入っていく」というラテン語由来のニュアンスから、料理に加えられる材料をイメージする。"},{"w":"insight","pos":"名","m":"洞察；見識","nu":"物事の本質を見抜く、深く鋭い理解や気づきを指す語だ。","ph":"gain insight into","phm":"〜への洞察を得る","ex":"The book gave us real insight into teenage friendships today.","exm":"その本は今日の10代の友情について本物の洞察を私たちに与えた。","us":"insight into ~の形で対象を示すのが基本。可算・不可算どちらの用法もある。","tip":"in-(中に)+sight(視覚)から、「物事の内側を見通す力」というイメージで覚える。"},{"w":"instance","pos":"名","m":"例；場合","nu":"一般的な事柄を説明するために挙げる、具体的な一つの事例を指す。","ph":"for instance","phm":"例えば","ex":"For instance, our teacher canceled class due to heavy snow.","exm":"例えば、私たちの先生は大雪のため授業を中止した。","us":"for instanceは慣用句としてfor exampleとほぼ同じ意味で使われる。","tip":"instance(例)とinsurance(保険)を混同しないよう、スペルの違いに注意して覚える。"},{"w":"institution","pos":"名","m":"機関；制度","nu":"学校や病院など社会的な役割を担う組織や、長く続く制度を指す。","ph":"an educational institution","phm":"教育機関","ex":"Our school is a small institution with a long history.","exm":"私たちの学校は長い歴史を持つ小さな機関だ。","us":"instituteは主に「研究所・学会」、institutionはより広く「機関・制度」を指す点が異なる。","tip":"institute(設立する)の名詞形と考え、「設立された組織や仕組み」というイメージで覚える。"},{"w":"instrument","pos":"名","m":"器具；楽器","nu":"精密な作業や演奏のために使う道具、特に楽器や測定器を指す。","ph":"play an instrument","phm":"楽器を演奏する","ex":"Everyone in the band plays at least one instrument well.","exm":"そのバンドの全員が少なくとも一つの楽器を上手に演奏する。","us":"「楽器」の意味が最も一般的だが、「精密な器具・手段」の意味でも使われる。","tip":"「道具」を意味するラテン語に由来し、楽器も測定器具も「目的のための道具」という共通イメージで覚える。"},{"w":"labor","pos":"名","m":"労働","nu":"体力や時間を使って行う仕事、特に肉体的な労働や努力を指す。","ph":"manual labor","phm":"肉体労働","ex":"The farmer's labor in the field lasted from dawn until dusk.","exm":"その農家の畑での労働は夜明けから日暮れまで続いた。","us":"不可算名詞。イギリス英語ではlabourと綴る。動詞では「苦労して働く」の意味もある。","tip":"laboratory(研究室)と語根が同じで、「作業する場所」というつながりで覚えられる。"},{"w":"landscape","pos":"名","m":"風景；景観","nu":"広く見渡した土地の眺めや、比喩的に物事全体の状況を指す語だ。","ph":"a beautiful landscape","phm":"美しい風景","ex":"The photo showed a landscape of mountains near our town.","exm":"その写真は私たちの町の近くの山々の風景を写していた。","us":"絵画の「風景画」の意味もある。比喩的にbusiness landscapeなど「状況・情勢」の意味でも使われる。","tip":"land(土地)+scape(眺め)から成る語で、「土地の眺め」という直訳イメージそのままで覚えやすい。"},{"w":"logic","pos":"名","m":"論理","nu":"筋道を立てて物事を考え、結論を導き出すための一貫した思考の仕組みを指す。","ph":"follow the logic","phm":"論理に従う","ex":"I could not follow the logic behind his sudden decision.","exm":"彼の突然の決断の裏にある論理が私には理解できなかった。","us":"不可算名詞。形容詞logicalとセットで使われることが多い。","tip":"ギリシャ語logos(言葉・理性)に由来し、「理にかなった筋道」というイメージで覚える。"},{"w":"mechanism","pos":"名","m":"仕組み；機構","nu":"物事がどのように動き、機能するのかという内部の仕組みを指す語だ。","ph":"a defense mechanism","phm":"防御機構","ex":"Scientists studied the mechanism behind how plants absorb sunlight.","exm":"科学者たちは植物が日光を吸収する仕組みを研究した。","us":"機械的な「装置」だけでなく、生物や社会現象の「仕組み」を説明する時にもよく使う。","tip":"machine(機械)と同じ語根から、「機械のように動く仕組み」というイメージで覚える。"},{"w":"medium","pos":"名","m":"媒体；手段","nu":"情報や表現を伝えるための手段や、物事の中間的な状態を指す語だ。","ph":"a powerful medium","phm":"強力な媒体","ex":"Television remains a powerful medium for reaching young viewers.","exm":"テレビは若い視聴者に届く強力な媒体であり続けている。","us":"複数形はmediaで、newspapers, TV, internetなどをまとめてthe mediaと呼ぶ。medium自体は単数形。","tip":"「中間」を意味するラテン語に由来し、送り手と受け手の間に立つ「媒体」というイメージで覚える。"},{"w":"notion","pos":"名","m":"考え；概念","nu":"はっきりした根拠はないが、ぼんやりと抱いている考えや思いつきを指す。","ph":"have a notion","phm":"ある考えを持つ","ex":"She had a strange notion about how the story ended.","exm":"彼女はその物語の結末についてある奇妙な考えを持っていた。","us":"ideaより漠然とした、あいまいな考えを表すことが多い。notion that ~の形もよく使う。","tip":"ラテン語で「知ること」を意味する語に由来し、頭に浮かんだ漠然とした考えというイメージで覚える。"},{"w":"nutrition","pos":"名","m":"栄養","nu":"体の成長や健康を保つために食物から摂取する栄養やその摂取行為を指す。","ph":"good nutrition","phm":"良い栄養状態","ex":"Good nutrition helps athletes recover faster after hard practice.","exm":"良い栄養は選手がきつい練習の後に早く回復するのを助ける。","us":"不可算名詞。形容詞nutritious(栄養のある)や名詞nutrient(栄養素)と合わせて覚える。","tip":"nourish(養う)と同じ語根から、「体を養うもの」というイメージで覚える。"},{"w":"obstacle","pos":"名","m":"障害；妨げ","nu":"目標達成の途中に立ちはだかり、進むのを妨げるものを指す語だ。","ph":"overcome an obstacle","phm":"障害を乗り越える","ex":"Lack of time was the biggest obstacle to our project.","exm":"時間不足が私たちの企画にとって最大の障害だった。","us":"obstacle to ~の形で対象を示す。overcome, faceなどの動詞とよく結びつく。","tip":"ob-(前に)+stacle(立つもの)から、「行く手に立ちはだかるもの」というイメージで覚える。"},{"w":"outcome","pos":"名","m":"結果","nu":"ある行動や出来事の最終的な結末、特にその後の影響を含む結果を指す。","ph":"the final outcome","phm":"最終的な結果","ex":"Nobody could predict the outcome of the close match.","exm":"その接戦の試合の結果は誰にも予測できなかった。","us":"resultとほぼ同義だが、outcomeはより長い過程の末に生じた結果を意識して使われることが多い。","tip":"out-(外へ)+come(来る)から、「過程の外に出てきたもの」というイメージで結果を覚える。"},{"w":"perspective","pos":"名","m":"視点；見方","nu":"物事をどの立場・角度から捉えるかという、その人独自のものの見方を表す。","ph":"from a different perspective","phm":"異なる視点から","ex":"Traveling abroad gave her a new perspective on her hometown.","exm":"海外旅行は彼女に故郷についての新しい視点を与えた。","us":"from ~ perspectiveの形が頻出。絵画の「遠近法」の意味もある。","tip":"per-(通して)+spect(見る)から、「ある地点を通して見る見方」というイメージで覚える。"},{"w":"phenomenon","pos":"名","m":"現象","nu":"観察され、説明や研究の対象となるような出来事や事象を指す語だ。","ph":"a natural phenomenon","phm":"自然現象","ex":"The northern lights are a beautiful natural phenomenon in winter.","exm":"オーロラは冬に見られる美しい自然現象だ。","us":"複数形はphenomenaという特殊変化に注意。ギリシャ語由来の不規則複数名詞の代表格。","tip":"ギリシャ語で「現れるもの」を意味する語に由来し、目に見える形で現れる出来事というイメージで覚える。"},{"w":"philosophy","pos":"名","m":"哲学；理念","nu":"人生や物事の根本原理を探究する学問、または個人が持つ基本的な考え方を指す。","ph":"a philosophy of life","phm":"人生哲学","ex":"Her philosophy is to always give her best effort in practice.","exm":"彼女の理念は練習でいつも全力を尽くすことだ。","us":"学問分野としては不可算、「個人の理念・信条」の意味では可算名詞として使われることもある。","tip":"philo-(愛する)+sophy(知恵)から、「知を愛すること」という成り立ちで覚える。"},{"w":"policy","pos":"名","m":"政策；方針","nu":"組織や政府が一貫して従う、公式に定められた方針や基本方針を指す。","ph":"government policy","phm":"政府の政策","ex":"The school introduced a new policy on smartphone use.","exm":"学校はスマートフォンの使用について新しい方針を導入した。","us":"policy on/toward ~の形で対象を示す。「保険証券」の意味(insurance policy)もある。","tip":"都市国家を意味するギリシャ語polisに関連する語に由来するとされる。"},{"w":"prejudice","pos":"名","m":"偏見；先入観","nu":"根拠なく特定の人や集団を悪く決めつける、偏った先入観を表す語だ。","ph":"racial prejudice","phm":"人種的偏見","ex":"Some students still show prejudice against classmates from other countries.","exm":"一部の生徒は今も外国出身のクラスメートに偏見を示す。","us":"against/toward などの前置詞をとる。不可算名詞として使うことが多いが、a prejudice で個々の偏見を表すこともある。","tip":"pre-(前もって)+judge(判断する)が語源で、「事前に判断する」→「偏見」と覚える。"},{"w":"principle","pos":"名","m":"原則；信念","nu":"行動や判断のよりどころとなる、基本的なルールや考え方を指す語だ。","ph":"basic principle","phm":"基本原則","ex":"Our teacher always explains the principle behind each math rule.","exm":"先生はいつも各数学のルールの背後にある原則を説明してくれる。","us":"「principal(校長・主要な)」とスペルが似ているため混同注意。in principle(原則として)という表現もよく使う。","tip":"prin-(最初の)から派生し、「最初にある基本的な考え」とイメージすると覚えやすい。"},{"w":"priority","pos":"名","m":"優先事項；優先順位","nu":"複数の物事の中で最も重要で先に扱うべきことを表す語だ。","ph":"top priority","phm":"最優先事項","ex":"Passing the exam is her top priority this semester.","exm":"試験に合格することが今学期の彼女の最優先事項だ。","us":"give priority to A(Aを優先する)の形でよく使う。可算・不可算どちらでも使われる。","tip":"prior(前の)から派生し、「他より前に来るもの」→「優先事項」と覚える。"},{"w":"procedure","pos":"名","m":"手順；手続き","nu":"目的を達成するために決まった順序で行う一連の方法や段階を指す語だ。","ph":"follow a procedure","phm":"手順に従う","ex":"Students must follow the correct procedure during the science experiment.","exm":"生徒は理科の実験中、正しい手順に従わなければならない。","us":"「method」より形式的・段階的な手続きを指すことが多い可算名詞だ。","tip":"pro-(前へ)+ced(進む)が語源で、「前へ進める段取り」→「手順」と結びつけて覚える。"},{"w":"profit","pos":"名","m":"利益；儲け","nu":"商売や活動から得られる金銭的な利益、支出を差し引いた儲けを表す語だ。","ph":"make a profit","phm":"利益を上げる","ex":"The school festival stall made a small profit this year.","exm":"学園祭の模擬店は今年、少しの利益を上げた。","us":"対義語は loss(損失)。動詞としても profit from A(Aから利益を得る)の形で使う。","tip":"pro-(前に)+fic(作る)が語源で、benefit(利益)と語源が近い語だと覚える。"},{"w":"campaign","pos":"名","m":"運動；キャンペーン","nu":"社会や政治の目的を達成するために組織的に行われる一連の活動を指す語だ。","ph":"run a campaign","phm":"運動を行う","ex":"The student council launched a campaign to reduce plastic waste.","exm":"生徒会はプラスチックごみを減らす運動を立ち上げた。","us":"advertising campaign(広告キャンペーン)、election campaign(選挙運動)のように幅広く使う可算名詞だ。","tip":"元々は軍事作戦を意味した語で、そこから「組織的な活動」全般に意味が広がったと覚える。"},{"w":"proportion","pos":"名","m":"割合；比率","nu":"全体の中である部分が占める比率やバランスを表す語だ。","ph":"a large proportion of","phm":"〜の大部分","ex":"A large proportion of students walk to school every morning.","exm":"生徒の大部分は毎朝歩いて学校に通っている。","us":"in proportion to A(Aに比例して)という表現も頻出する。ratio(比率)と近いが全体に対する部分の割合を強調する。","tip":"pro-(割合に応じて)+portion(部分)が語源で、「部分の割合」と直訳的に覚える。"},{"w":"reputation","pos":"名","m":"評判；評価","nu":"ある人や組織が周囲からどう思われているか、その評価や世間の評判を表す語だ。","ph":"have a good reputation","phm":"良い評判を得ている","ex":"The tennis club has a good reputation for strong teamwork.","exm":"テニス部はチームワークの強さで良い評判を得ている。","us":"reputation for A、reputation as Aの形をとる。a reputationやhis/her reputationのように、単数形で使われることが多い。","tip":"re-(繰り返し)+put(考える)が語源で、「繰り返し考えられること」→「評判」と結びつける。"},{"w":"routine","pos":"名","m":"日課；決まった手順","nu":"毎日または定期的に繰り返し行う、決まりきった一連の行動を指す語だ。","ph":"daily routine","phm":"毎日の日課","ex":"Checking his phone right after waking up became his morning routine.","exm":"起きてすぐスマホを確認することが彼の朝の日課になった。","us":"形容詞として「決まりきった、日常の」という意味でも使う(a routine check など)。","tip":"フランス語のroute(道)に由来し、「いつもの道筋」→「日課」と覚える。"},{"w":"sacrifice","pos":"名","m":"犠牲；犠牲にすること","nu":"大切なものを他の目的のためにあきらめる、または差し出すことを表す語だ。","ph":"make a sacrifice","phm":"犠牲を払う","ex":"She made a big sacrifice by giving up her weekends to practice.","exm":"彼女は週末をあきらめて練習し、大きな犠牲を払った。","us":"動詞としても使い、sacrifice A for B(BのためにAを犠牲にする)の形が頻出する。","tip":"sacri-(神聖な)+fice(作る)が語源で、元は「神への捧げ物」を意味した語だと覚える。"},{"w":"shortage","pos":"名","m":"不足；欠乏","nu":"必要な量に対して物やお金、人手などが足りない状態を表す語だ。","ph":"a shortage of","phm":"〜の不足","ex":"The volleyball team faced a shortage of players before the match.","exm":"バレー部は試合前に選手不足に直面した。","us":"shortage of A(Aの不足)の形で頻出する。short(足りない)+age(状態)からできた語だと理解すると覚えやすい。","tip":"shortの名詞形と考えると覚えやすく、対義語はsurplus(余剰)だ。"},{"w":"strategy","pos":"名","m":"戦略；作戦","nu":"目標を達成するために練られた、長期的で全体的な計画や方針を指す語だ。","ph":"develop a strategy","phm":"戦略を立てる","ex":"The team developed a new strategy to win the final game.","exm":"チームは最終戦に勝つための新しい戦略を立てた。","us":"「tactic(戦術)」より広く長期的な計画を指す可算名詞として使う。","tip":"ギリシャ語で「将軍」を意味する語が語源で、「軍を率いる作戦」から意味が広がったと覚える。"},{"w":"substance","pos":"名","m":"物質；実質","nu":"具体的な物理的性質を持つ材料や、物事の本質的な中身を表す語だ。","ph":"a chemical substance","phm":"化学物質","ex":"The lab experiment used a strange substance that changed color quickly.","exm":"その実験では色がすぐに変わる不思議な物質を使った。","us":"可算・不可算どちらでも使われ、「本質」の意味ではno substance(中身がない)のように不可算で使う。","tip":"sub-(下に)+stance(立つ)が語源で、「物事の下に立つもの」→「本質・物質」と覚える。"},{"w":"surgery","pos":"名","m":"手術","nu":"病気やけがを治療するために体を切開して行う医療行為を指す専門的な語だ。","ph":"undergo surgery","phm":"手術を受ける","ex":"His grandfather had to undergo surgery on his injured knee last week.","exm":"彼の祖父は先週、けがをした膝の手術を受けなければならなかった。","us":"通常は不可算名詞で、have surgery や undergo surgery の形で頻出する。","tip":"同じ「手術」を表すoperationとほぼ同義だが、surgeryはより専門的・医学的な響きを持つ。"},{"w":"symptom","pos":"名","m":"症状；兆候","nu":"病気や問題があることを示す、体に現れるしるしや兆候を表す語だ。","ph":"an early symptom","phm":"初期症状","ex":"The doctor asked him to describe every symptom of his illness in detail.","exm":"医者は彼に病気のあらゆる症状を詳しく説明するよう頼んだ。","us":"symptom of A(Aの症状)の形で使う。比喩的に社会問題の「兆候」を表すこともある。","tip":"sym-(共に)+ptom(落ちる)が語源で、「病気と共に現れるもの」→「症状」と覚える。"},{"w":"territory","pos":"名","m":"領土；領域","nu":"ある国や動物が支配・管理する土地や範囲を表す語だ。","ph":"enemy territory","phm":"敵の領土","ex":"The two countries have argued over this territory for many years.","exm":"この二国は長年この領土をめぐって争ってきた。","us":"地理的な「領土」だけでなく、専門分野などの「領域」を比喩的に表すこともある。","tip":"terra(土地)から派生した語で、landと関連づけて覚えると意味が浮かびやすい。"},{"w":"threat","pos":"名","m":"脅威；脅し","nu":"危険や損害を引き起こす可能性のあるものごと、または脅迫を表す語だ。","ph":"pose a threat","phm":"脅威をもたらす","ex":"Climate change poses a serious threat to our future environment.","exm":"気候変動は私たちの未来の環境に深刻な脅威をもたらす。","us":"threat to A(Aへの脅威)の形をとる。動詞形threaten(脅す)とセットで覚えると良い。","tip":"threatenの名詞形と考え、「脅す」行為や存在そのものを指すとイメージすると覚えやすい。"},{"w":"trait","pos":"名","m":"特性；特徴","nu":"人の性格や物事に見られる、他と区別できる特徴的な性質を表す語だ。","ph":"personality trait","phm":"性格的特徴","ex":"Kindness is one trait that many students admire in their teacher.","exm":"優しさは多くの生徒が先生の中で尊敬する特性の一つだ。","us":"characteristic(特徴)とほぼ同義だが、traitは特に性格や遺伝的な特徴に使われやすい。","tip":"フランス語で「線」を意味する語に由来し、「その人を描く一本の線」→「特性」と覚える。"},{"w":"vehicle","pos":"名","m":"乗り物；車両","nu":"人や物を運ぶための自動車・バスなど、動力で動く輸送手段全般を表す語だ。","ph":"an electric vehicle","phm":"電気自動車","ex":"The school bought a new vehicle to transport students on trips.","exm":"学校は遠足で生徒を運ぶための新しい車両を購入した。","us":"carより広く、バス・トラックなども含む一般的な「乗り物」を指す語だ。","tip":"ラテン語で「運ぶもの」を意味する語が語源で、「運搬手段」全般を指すと覚える。"},{"w":"welfare","pos":"名","m":"福祉；幸福","nu":"人々の健康や幸福、生活の充実を守るための支援や状態を指す語だ。","ph":"social welfare","phm":"社会福祉","ex":"The new law aims to improve the welfare of elderly people.","exm":"その新しい法律は高齢者の福祉を向上させることを目指している。","us":"well(良い)+fare(状態)からなる語で、animal welfare(動物福祉)のように幅広い対象に使う不可算名詞だ。","tip":"「良い状態で旅する」が原義とされ、そこから人々の「幸福・福祉」を表すようになったと覚える。"},{"w":"witness","pos":"名","m":"目撃者；証人","nu":"事件や出来事を実際に見た人、また法廷で証言する人を表す語だ。","ph":"a key witness","phm":"重要な証人","ex":"A witness told police she saw the accident near the station.","exm":"目撃者は駅の近くで事故を見たと警察に話した。","us":"動詞としても使い、witness A(Aを目撃する)の形で頻出する。","tip":"wit(知る・見る)から派生した語で、「実際に見て知っている人」→「目撃者」と覚える。"},{"w":"organism","pos":"名","m":"生物；有機体","nu":"細菌から動植物まで、生命を持つ個々の生き物を科学的に指す語だ。","ph":"a living organism","phm":"生きている生物","ex":"Every living organism in the pond depends on clean water to survive.","exm":"池のあらゆる生物はきれいな水に依存して生きている。","us":"生物学の授業でよく使う語で、単細胞生物から人間まで幅広く指す可算名詞だ。","tip":"organ(器官)から派生し、「器官を持つまとまった生命体」→「生物」と覚える。"},{"w":"abstract","pos":"形","m":"抽象的な","nu":"具体的な形を持たず、頭の中の考えや概念として存在するさまを表す語だ。","ph":"an abstract idea","phm":"抽象的な考え","ex":"Freedom is an abstract concept that is hard to define simply.","exm":"自由は簡単には定義しにくい抽象的な概念だ。","us":"対義語はconcrete(具体的な)。名詞としても「要約」の意味で使われる点に注意する。","tip":"concreteとセットで、abstractは頭の中、concreteは手で触れると対比して覚える。"},{"w":"accurate","pos":"形","m":"正確な","nu":"誤りがなく、事実や実際の状況と細部まで一致している様子を表す語だ。","ph":"an accurate description","phm":"正確な描写","ex":"The weather forecast was surprisingly accurate about this weekend's heavy rain.","exm":"天気予報は今週末の大雨について驚くほど正確だった。","us":"be accurate about/in Aの形をとる。名詞形accuracy(正確さ)も合わせて覚えておく。","tip":"対義語はinaccurate(不正確な)。correctが「正しい」ならaccurateは細部まで精密に正しいというニュアンスだ。"},{"w":"adequate","pos":"形","m":"十分な；適切な","nu":"必要とされる水準や量を満たしている、過不足のない様子を表す語だ。","ph":"adequate time","phm":"十分な時間","ex":"Students need adequate sleep to concentrate well during morning classes.","exm":"生徒たちは午前の授業に集中するために十分な睡眠が必要だ。","us":"enoughよりやや堅い語で、adequate for A(Aに十分な)の形も使う。対義語はinadequate(不十分な)。","tip":"ラテン語の「等しくする」が語源で、「必要な基準に等しい」→「十分な」と覚える。"},{"w":"aggressive","pos":"形","m":"攻撃的な；積極的な","nu":"力ずくで相手に向かっていく攻撃的な態度や、強い意欲的な姿勢を表す語だ。","ph":"aggressive behavior","phm":"攻撃的な行動","ex":"The referee warned the player for his aggressive behavior on the field.","exm":"審判はフィールド上での攻撃的な態度についてその選手に警告した。","us":"スポーツやビジネスでは「積極的な、攻めの」という良い意味でも使われる。","tip":"ag-(=ad, 〜へ)+gress(進む)が語源で、「相手に向かって進んでいく」→「攻撃的な」と覚える。progress(前進)やaggression(攻撃)と同じ語根を持つ。"},{"w":"alternative","pos":"形","m":"代わりの；別の","nu":"既存のものの代わりとなる、もう一つの選択肢を表す語だ。","ph":"an alternative plan","phm":"代替案","ex":"We need an alternative plan in case the outdoor event gets canceled.","exm":"屋外イベントが中止になった場合に備えて代替案が必要だ。","us":"名詞としても「代替案、選択肢」の意味で頻出する(alternative to A)。","tip":"alter(変える)から派生し、「変えて別のものにする」→「代わりの」と覚える。"},{"w":"ambitious","pos":"形","m":"野心的な；意欲的な","nu":"大きな目標を達成しようとする強い意欲や野心を持つ様子を表す語だ。","ph":"an ambitious goal","phm":"野心的な目標","ex":"She set an ambitious goal of running a full marathon this year.","exm":"彼女は今年フルマラソンを走るという野心的な目標を立てた。","us":"be ambitious to do / about Aの形で使う。名詞形ambition(野心)とセットで覚える。","tip":"ambition(野心)の形容詞形で、大きな夢を持つという前向きな意味合いが強い。"},{"w":"annual","pos":"形","m":"年に一度の；毎年の","nu":"一年に一回、定期的に行われる出来事や発行物を表す語だ。","ph":"an annual event","phm":"毎年恒例の行事","ex":"The sports festival is an annual event that every student enjoys.","exm":"体育祭は全生徒が楽しむ毎年恒例の行事だ。","us":"annual income(年収)のように「年間の」という意味でも使う。","tip":"ラテン語annus(年)が語源で、「1年ごとの」→「年に一度の」と覚える。"},{"w":"artificial","pos":"形","m":"人工の；人為的な","nu":"自然に生じたものではなく、人間の手によって作られた様子を表す語だ。","ph":"artificial intelligence","phm":"人工知能","ex":"Many drinks contain artificial flavors instead of real fruit juice.","exm":"多くの飲み物には本物の果汁の代わりに人工的な香料が含まれている。","us":"対義語はnatural(自然の)。artificial intelligence(AI)という形で日常的にも使われる。","tip":"art(技術)から派生し、「技術によって作られたもの」→「人工の」と覚える。"},{"w":"biological","pos":"形","m":"生物学的な","nu":"生き物の体の構造や機能、生命現象に関わる様子を表す専門的な語だ。","ph":"biological clock","phm":"体内時計","ex":"The teacher explained the biological process behind human digestion in class.","exm":"先生は授業で人間の消化にまつわる生物学的な過程を説明した。","us":"biology(生物学)の形容詞形。biological father/mother(実の父・母)のように血縁を表す用法もある。","tip":"bio-(生命)+logical(論理的な)から成る語で、「生命に関する」学問分野の形容詞と覚える。"},{"w":"commercial","pos":"形","m":"商業の；営利目的の","nu":"利益を得ることを目的とした商売や取引に関係する様子を表す語だ。","ph":"commercial success","phm":"商業的な成功","ex":"The app quickly became a commercial success after its worldwide release.","exm":"そのアプリは世界的な発売後、すぐに商業的な成功を収めた。","us":"名詞としては「テレビCM」の意味でもよく使う(during the commercial)。","tip":"commerce(商業)の形容詞形で、「お金のやり取りに関わる」とイメージすると覚えやすい。"},{"w":"complex","pos":"形","m":"複雑な","nu":"多くの要素が絡み合っていて、単純には理解や説明ができない様子を表す語だ。","ph":"a complex problem","phm":"複雑な問題","ex":"The math teacher broke down the complex problem into simple steps.","exm":"数学の先生はその複雑な問題を簡単な手順に分解した。","us":"difficultより「要素が絡み合って複雑」という意味合いが強い。名詞としては「複合施設」の意味もある。","tip":"com-(共に)+plex(編む)が語源で、「多くの要素が編み込まれた」→「複雑な」と覚える。"},{"w":"concrete","pos":"形","m":"具体的な；コンクリート製の","nu":"抽象的でなく、実際に手で触れたり見たりできるほどはっきりした様子を表す語だ。","ph":"a concrete example","phm":"具体的な例","ex":"Please give a concrete example to support your opinion in the essay.","exm":"エッセイで自分の意見を裏付ける具体的な例を挙げてください。","us":"対義語はabstract(抽象的な)。名詞としては建材の「コンクリート」も表す。","tip":"concreteは固まった、具体的な形があるものとイメージして覚える。"},{"w":"considerable","pos":"形","m":"かなりの；相当な","nu":"無視できないほど大きい、量や程度がかなりのものであることを表す語だ。","ph":"considerable effort","phm":"かなりの努力","ex":"She put considerable effort into preparing for the speech contest.","exm":"彼女はスピーチコンテストの準備にかなりの努力を注いだ。","us":"considerable amount/number of Aの形で量の多さを表すことが多い。considerate(思いやりのある)と混同注意。","tip":"considerと語根は同じだが、「考慮に値するほど大きい」→「かなりの」という意味に発展したと覚える。"},{"w":"consistent","pos":"形","m":"一貫した；矛盾のない","nu":"時間が経っても変わらず、同じ方針や状態を保ち続ける様子を表す語だ。","ph":"remain consistent","phm":"一貫している","ex":"The coach praised him for staying consistent with his daily training.","exm":"コーチは彼が毎日の練習を一貫して続けたことを褒めた。","us":"consistent with A(Aと一致した)の形で使う。対義語はinconsistent(一貫性のない)。","tip":"con-(共に)+sist(立つ)が語源で、「常に同じ立場に立つ」→「一貫した」と覚える。"},{"w":"contemporary","pos":"形","m":"現代の；同時代の","nu":"今の時代に属する、または同じ時代に存在していることを表す語だ。","ph":"contemporary art","phm":"現代美術","ex":"The museum has a new exhibition of contemporary art from Japan.","exm":"その美術館では日本の現代美術の新しい展覧会が開かれている。","us":"modernと似るが、contemporaryは「今この時代の」「同時代の」という意味を強く含む。","tip":"con-(共に)+tempor(時)が語源で、「同じ時に存在する」→「現代の、同時代の」と覚える。"},{"w":"conventional","pos":"形","m":"従来の；伝統的な","nu":"昔からの習慣や一般的なやり方に従っている、目新しさのない様子を表す語だ。","ph":"conventional method","phm":"従来の方法","ex":"Instead of conventional methods, the teacher tried a new teaching style.","exm":"先生は従来の方法の代わりに新しい指導スタイルを試した。","us":"unconventional(型破りな)が対義語。convention(慣習)の形容詞形だ。","tip":"convention(慣習・大会)と結びつけ、「昔からの慣習に従った」→「従来の」と覚える。"},{"w":"crucial","pos":"形","m":"極めて重要な","nu":"結果を大きく左右するほど、非常に重要で欠かせない様子を表す語だ。","ph":"a crucial role","phm":"極めて重要な役割","ex":"Getting enough sleep plays a crucial role in memory and learning.","exm":"十分な睡眠を取ることは記憶や学習に極めて重要な役割を果たす。","us":"importantよりも強い意味を持ち、crucial to/for A(Aにとって極めて重要)の形で使う。","tip":"ラテン語crux(十字架)が語源で、「決断の分かれ道」→「極めて重要な」と覚える。"},{"w":"delicate","pos":"形","m":"繊細な；壊れやすい","nu":"傷つきやすく丁寧な扱いを必要とする、繊細で微妙な様子を表す語だ。","ph":"a delicate balance","phm":"微妙なバランス","ex":"The artist used a delicate brush to paint the small flower petals.","exm":"画家は小さな花びらを描くために繊細な筆を使った。","us":"物だけでなく、delicate situation(微妙な状況)のように状況や問題にも使う。","tip":"壊れそうなガラス細工をイメージし、「取り扱い注意なほど繊細な」と覚える。"},{"w":"distinct","pos":"形","m":"明確に異なる；別個の","nu":"他と混同されないほどはっきり区別できる違いを表す語だ。","ph":"a distinct possibility","phm":"明確な可能性","ex":"There is a distinct difference between the two music genres.","exm":"その2つの音楽ジャンルには明確な違いがある。","us":"distinct from A（Aとは異なる）の形でよく使う。distinguishと同語源で「区別」の意味合いが強い。","tip":"distinguish（区別する）と語根が同じ。似た語のdistinctive（特徴的な）と混同しないよう注意する。"},{"w":"domestic","pos":"形","m":"国内の；家庭の","nu":"自国内、または家の中を指す語で、foreignやinternationalと対になる。","ph":"domestic and international flights","phm":"国内線と国際線","ex":"The airport handles both domestic and international flights daily.","exm":"その空港は毎日国内線と国際線の両方を扱っている。","us":"domestic marketのように「国内の」の意味と、domestic workのように「家庭の」の意味の両方がある。","tip":"dom-はラテン語で「家」を表す語根。domestic animal（家畜）のような表現とあわせて覚える。"},{"w":"dramatic","pos":"形","m":"劇的な；驚くべき","nu":"変化や出来事が急激で、人目を引くほど大きいことを表す語だ。","ph":"a dramatic change","phm":"劇的な変化","ex":"The team made a dramatic comeback in the final minutes.","exm":"そのチームは最後の数分で劇的な逆転を果たした。","us":"dramatic increase／decreaseのように数量の急変を表すときによく使われる。","tip":"drama（演劇）が語源で、演劇のように印象的な様子を表すとイメージすると覚えやすい。"},{"w":"ethical","pos":"形","m":"倫理的な；道徳上の","nu":"社会や職業上の善悪の基準に照らして正しいかを判断する語だ。","ph":"ethical issues","phm":"倫理的問題","ex":"Students discussed ethical issues surrounding animal testing in class.","exm":"生徒たちは授業で動物実験をめぐる倫理的問題について話し合った。","us":"ethics（倫理学、名詞）の形容詞形。moralとほぼ同義だが、職業倫理など制度的な文脈で好まれる。","tip":"対義語はunethical（非倫理的な）。名詞形ethicsとセットで覚えるとよい。"},{"w":"enormous","pos":"形","m":"巨大な；莫大な","nu":"通常の基準をはるかに超える大きさや量を強調する語だ。","ph":"an enormous amount of","phm":"莫大な量の","ex":"She spent an enormous amount of time preparing for exams.","exm":"彼女は試験勉強に莫大な時間を費やした。","us":"名詞の前に置いて大きさや量を強調する。hugeよりやや硬い書き言葉的な語だ。","tip":"ラテン語で「標準（norm）から外れている」という意味に由来するとされる語だ。"},{"w":"external","pos":"形","m":"外部の；外面的な","nu":"物事の表面や外側、あるいは組織の外にあるものを指す語だ。","ph":"external factors","phm":"外的要因","ex":"Coaches must consider external factors like weather before the match.","exm":"コーチは試合前に天候などの外的要因を考慮しなければならない。","us":"対義語はinternal（内部の）。external examination（外部試験）のようにも使う。","tip":"exit（出る）と同じex-（外へ）という接頭辞を持つ語だ。対義語のinternalとセットで覚える。"},{"w":"extinct","pos":"形","m":"絶滅した","nu":"種や慣習が完全に消滅し、もう存在しないことを表す語だ。","ph":"become extinct","phm":"絶滅する","ex":"Many species become extinct because of habitat destruction each year.","exm":"生息地の破壊により毎年多くの種が絶滅している。","us":"「絶滅している」状態を表す形容詞で、動詞にはdie outやbecome extinctを使う。","tip":"extinguish（火を消す）と語源が近く、「消え去った」イメージで覚える。名詞形はextinction。"},{"w":"extreme","pos":"形","m":"極端な；極度の","nu":"程度が普通の範囲をはるかに超えていることを強く示す語だ。","ph":"extreme weather conditions","phm":"異常気象","ex":"The hikers were warned about extreme weather conditions on the mountain.","exm":"ハイカーたちは山での異常気象について警告された。","us":"extreme sports（過激なスポーツ）のように名詞の前で使うことが多い。副詞形extremelyも頻出。","tip":"ex-（外へ）から派生したextremus（最も外の）が語源とされる。moderateと対で覚える。"},{"w":"financial","pos":"形","m":"財政の；金融の","nu":"お金の管理や経済活動に関わることを表す語だ。","ph":"financial support","phm":"資金援助","ex":"The club received financial support from local businesses this year.","exm":"そのクラブは今年地元企業から資金援助を受けた。","us":"financial aid（奨学金・援助金）のように教育関連でもよく使われる。名詞financeとセットで覚える。","tip":"financeが名詞形。fin-はラテン語で「終わり・決済」を意味し、支払いの完了に由来するとされる。"},{"w":"flexible","pos":"形","m":"柔軟な","nu":"状況に応じて形や予定を変えられる、融通のきく性質を表す語だ。","ph":"a flexible schedule","phm":"融通のきく予定","ex":"Part-time jobs often offer students a flexible schedule during exam season.","exm":"アルバイトは試験期間中、生徒に柔軟なスケジュールを提供することが多い。","us":"人の性格にもスケジュールなどの物事にも使える形容詞。反対語はrigid（融通のきかない）。","tip":"flex（曲げる）が語源で、体を曲げるストレッチのイメージから「融通がきく」を連想する。"},{"w":"fragile","pos":"形","m":"壊れやすい；もろい","nu":"物理的に割れやすい、または弱くて崩れやすい状態を表す語だ。","ph":"a fragile ecosystem","phm":"脆弱な生態系","ex":"The glass sculpture is fragile, so please handle it carefully.","exm":"そのガラスの彫刻は壊れやすいので、丁寧に扱ってください。","us":"物だけでなく、fragile peace（不安定な平和）のように抽象的な状況の脆さにも使える。","tip":"fragment（破片）と同語源で、「砕けやすい」イメージを持つ。strong（頑丈な）と対で覚える。"},{"w":"fundamental","pos":"形","m":"基本的な；根本的な","nu":"物事の土台となる、最も重要で欠かせない部分を表す語だ。","ph":"a fundamental principle","phm":"基本原則","ex":"Understanding grammar is fundamental to learning any foreign language.","exm":"文法を理解することはどんな外国語学習にも基本的だ。","us":"be fundamental to Aで「Aにとって基本的だ」という形をよく使う。名詞化はfundamentals（基礎）。","tip":"ラテン語fundamentum（土台、基礎）に由来する語で、建物の「基礎」のイメージで覚えるとよい。"},{"w":"genetic","pos":"形","m":"遺伝の；遺伝子の","nu":"親から子へ受け継がれる特徴や病気の原因を指す語だ。","ph":"genetic factors","phm":"遺伝的要因","ex":"Scientists say genetic factors partly explain athletic ability in some families.","exm":"科学者たちは、遺伝的要因が一部の家系の運動能力を部分的に説明すると言う。","us":"genetic disease（遺伝性疾患）、genetic engineering（遺伝子工学）のように名詞を修飾する。","tip":"geneが語根。gene（遺伝子）＋-icで形容詞になると覚える。"},{"w":"genuine","pos":"形","m":"本物の；心からの","nu":"偽りがなく本当にそうである、または感情が心からのものであることを表す語だ。","ph":"a genuine smile","phm":"心からの笑顔","ex":"Her genuine smile made everyone in the room feel welcome.","exm":"彼女の心からの笑顔は、部屋にいた誰もを歓迎される気持ちにさせた。","us":"物には「本物の」、感情や態度には「誠実な、心からの」の意味になる。realに近いがより丁寧な響き。","tip":"対義語はfake（偽の）。genuine leather（本革）のように商品の真贋を表すときにもよく使う。"},{"w":"gradual","pos":"形","m":"徐々の；漸進的な","nu":"変化が急でなく、少しずつゆっくり進む様子を表す語だ。","ph":"a gradual increase","phm":"徐々の増加","ex":"The teacher noticed a gradual increase in students' reading speed.","exm":"先生は生徒たちの読解速度が徐々に上がっていることに気づいた。","us":"対義語はsudden（突然の）。副詞形gradually（徐々に）も頻出なので合わせて覚える。","tip":"grade（段階）と同語源で、階段を一段ずつ上るイメージで変化の緩やかさを

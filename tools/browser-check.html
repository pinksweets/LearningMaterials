<!doctype html><html lang="ja"><meta charset="utf-8"><title>オフライン準備の確認</title>
<h1>オフライン準備の確認</h1><pre id="status">確認中</pre>
<script type="module">
const lines=[`secure: ${isSecureContext}`,`serviceWorker available: ${'serviceWorker' in navigator}`];
try{
  const reg=await navigator.serviceWorker.getRegistration('../');
  lines.push(`registration: ${reg?.scope||'none'}`,`active: ${reg?.active?.state||'none'}`);
  lines.push(`controller: ${navigator.serviceWorker.controller?.scriptURL||'none'}`);
  for(const name of await caches.keys()){
    const cache=await caches.open(name),requests=await cache.keys();
    lines.push(`cache: ${name} (${requests.length} files)`);
    for(const file of ['../','../js/main.js','../js/session.js','../js/math-display.js'])lines.push(`${file}: ${!!await cache.match(new URL(file,location.href))}`);
  }
}catch(e){lines.push(e.name+': '+e.message);}
document.getElementById('status').textContent=lines.join('\n');
</script></html>
